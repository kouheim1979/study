<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英語回路</title>
<meta name="description" content="聞き分け・ディクテーション・瞬間英作文・シャドーイング・AI英会話を毎日15分。英語が聞ける・話せる回路をつくるトレーニングアプリ。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Lexend:wght@300..700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  /* 英語回路 — インクの太線と硬い影のポップ。青=耳（聞く）、ピンク=口（話す）、朱=完了のハンコ。
     レイアウト: スマホ1カラム、下にタブ、練習は全画面。英文はリズム記号つき（●強く読む語・‿つながり） */
  --paper: #F1EFFA;
  --card: #FFFFFF;
  --ink: #1D1A3B;
  --line: #1D1A3B;
  --muted: #5C5880;
  --soft: #E5E1F6;
  --ear: #2B6CF6;
  --ear-soft: #DCE6FF;
  --mouth: #E5407A;
  --mouth-soft: #FFE0EB;
  --hanko: #D2382B;
  --hl: #FFE066;
  --ok: #0E8656;
  --ok-soft: #D5F4E5;
  --bad: #C7303E;
  --bad-soft: #FFE1E4;
  --on-color: #FFFFFF;
  --f-disp: "Dela Gothic One", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --f-ja: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --f-en: "Lexend", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --bw: 2.5px;
  --sh: 3px 3px 0 var(--line);
  --sh-lg: 5px 5px 0 var(--line);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #15132B; --card: #232046; --ink: #F1EFFF; --line: #050414; --muted: #ABA7D3; --soft: #2F2B58;
    --ear: #6B98FF; --ear-soft: #263461; --mouth: #FF6C99; --mouth-soft: #4B2342; --hanko: #FF5E4D;
    --hl: #FFD84D; --ok: #43D49D; --ok-soft: #173D33; --bad: #FF6E7A; --bad-soft: #4A1E28; --on-color: #0D0B22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #15132B; --card: #232046; --ink: #F1EFFF; --line: #050414; --muted: #ABA7D3; --soft: #2F2B58;
  --ear: #6B98FF; --ear-soft: #263461; --mouth: #FF6C99; --mouth-soft: #4B2342; --hanko: #FF5E4D;
  --hl: #FFD84D; --ok: #43D49D; --ok-soft: #173D33; --bad: #FF6E7A; --bad-soft: #4A1E28; --on-color: #0D0B22;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font: 500 16px/1.65 var(--f-ja);
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--ear); outline-offset: 2px; }
.ic { width: 22px; height: 22px; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }

/* ---------- 枠組み ---------- */
.app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
.top { display: flex; align-items: center; gap: 10px; padding: 12px 16px 8px; flex: none; }
.logo { display: flex; align-items: center; gap: 8px; font: 400 21px/1 var(--f-disp); letter-spacing: .02em; margin-right: auto; }
.logo .wave { width: 30px; height: 18px; color: var(--mouth); }
.streak { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; padding: 4px 10px 4px 4px; border: var(--bw) solid var(--line); border-radius: 999px; background: var(--card); box-shadow: 2px 2px 0 var(--line); }
.streak b { font: 400 13px/1 var(--f-disp); color: var(--on-color); background: var(--hanko); border-radius: 999px; min-width: 26px; height: 26px; display: grid; place-items: center; padding: 0 6px; }
.iconbtn { display: grid; place-items: center; width: 42px; height: 42px; border: var(--bw) solid var(--line); border-radius: 12px; background: var(--card); box-shadow: 2px 2px 0 var(--line); padding: 0; }
.iconbtn:active { transform: translate(2px, 2px); box-shadow: none; }
#view { flex: 1; overflow-y: auto; padding: 6px 16px 28px; display: flex; flex-direction: column; gap: 18px; -webkit-overflow-scrolling: touch; }
.tabbar { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 8px 8px 10px; background: var(--card); border-top: var(--bw) solid var(--line); }
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 2px; border: var(--bw) solid transparent; background: none; border-radius: 14px; padding: 6px 2px 4px; font-size: 11.5px; font-weight: 700; color: var(--muted); }
.tabbar button .ic { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--ink); background: var(--hl); border-color: var(--line); box-shadow: 2px 2px 0 var(--line); }
.tabbar button[aria-current="page"][data-tab="listen"] { background: var(--ear); color: var(--on-color); }
.tabbar button[aria-current="page"][data-tab="speak"] { background: var(--mouth); color: var(--on-color); }
.tabbar button[aria-current="page"] .ic { stroke-width: 2.6; }

/* ---------- ボタン類 ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 16px; border: var(--bw) solid var(--line); border-radius: 13px; background: var(--card); box-shadow: var(--sh); font-weight: 700; font-size: 16px; line-height: 1.2; text-align: center; transition: transform .06s ease, box-shadow .06s ease; touch-action: manipulation; }
.btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--line); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ear { background: var(--ear); color: var(--on-color); }
.btn.mouth { background: var(--mouth); color: var(--on-color); }
.btn.ink { background: var(--ink); color: var(--paper); }
.btn.hl { background: var(--hl); color: #1D1A3B; }
.btn.big { width: 100%; min-height: 58px; font-size: 18px; border-radius: 16px; box-shadow: var(--sh-lg); }
.btn.big:active:not(:disabled) { transform: translate(5px, 5px); }
.btn.sm { min-height: 38px; padding: 6px 12px; font-size: 14px; border-radius: 10px; box-shadow: 2px 2px 0 var(--line); }
.btn.round { width: 58px; height: 58px; padding: 0; border-radius: 50%; }
.btn.round .ic { width: 28px; height: 28px; }
.btn.flat { box-shadow: none; }
.btn.link { border: none; box-shadow: none; background: none; text-decoration: underline; text-underline-offset: 4px; min-height: 40px; color: var(--ink); }
.btn.wide { flex: 1; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 700; padding: 2px 10px; border: 2px solid var(--line); border-radius: 999px; background: var(--card); line-height: 1.5; white-space: nowrap; }
.chip.ear { background: var(--ear-soft); }
.chip.mouth { background: var(--mouth-soft); }
.chip.ghost { border-color: transparent; background: var(--soft); }
button.chip { min-height: 36px; padding: 4px 12px; font-size: 13.5px; }
button.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: flex; border: var(--bw) solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); box-shadow: 2px 2px 0 var(--line); }
.seg button { flex: 1; min-height: 40px; border: none; background: none; font-weight: 700; font-size: 14px; padding: 6px 8px; border-left: 2px solid var(--line); }
.seg button:first-child { border-left: none; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.label { font-weight: 900; font-size: 14px; }

/* ---------- 英文（リズム記号） ---------- */
.en { font-family: var(--f-en); font-weight: 400; letter-spacing: .005em; line-height: 1.5; word-break: normal; overflow-wrap: anywhere; }
.en .w { display: inline-block; position: relative; padding-top: 11px; border-radius: 6px; transition: background .12s; }
.en.rh .w.st { font-weight: 650; }
.en.rh .w.wk { color: var(--muted); font-weight: 350; }
.en.rh .w.st::before, .en.rh .w.wk::before { content: ""; position: absolute; top: 2px; left: 50%; transform: translateX(-50%); border-radius: 50%; }
.en.rh .w.st::before { width: 8px; height: 8px; background: var(--mouth); }
.en.rh .w.wk::before { width: 4px; height: 4px; background: var(--muted); opacity: .55; top: 4px; }
.en .grp { white-space: nowrap; }
.en .lk { display: inline-block; color: var(--ear); font-weight: 700; margin: 0 -.12em; transform: translateY(.42em); font-size: .9em; }
.en .pu { display: inline-block; padding-top: 11px; }
.en .w.on { background: var(--hl); color: #1D1A3B; }
.en .w.m-ok { color: var(--ok); }
.en .w.m-near { color: #B7791F; text-decoration: underline wavy; text-underline-offset: 5px; }
.en .w.m-miss { color: var(--bad); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }
.en .w.hit { background: var(--hl); color: #1D1A3B; padding-left: 3px; padding-right: 3px; }
.en input.blank { font: 500 1em/1.2 var(--f-en); border: none; border-bottom: 3px solid var(--ear); background: var(--ear-soft); border-radius: 6px 6px 0 0; padding: 2px 4px; margin: 0 2px; min-width: 3.2ch; text-align: center; color: var(--ink); vertical-align: baseline; }
.en input.blank:focus { outline: none; background: var(--hl); color: #1D1A3B; border-bottom-color: var(--ink); }
.en input.blank.ok { background: var(--ok-soft); border-bottom-color: var(--ok); }
.en input.blank.ng { background: var(--bad-soft); border-bottom-color: var(--bad); }
.ja { color: var(--muted); font-size: 15px; }
.big-en { font-size: clamp(22px, 6.4vw, 30px); }
.mid-en { font-size: clamp(19px, 5.2vw, 24px); }

/* ---------- ホーム ---------- */
.stage { position: relative; background: var(--card); border: var(--bw) solid var(--line); border-radius: 22px; box-shadow: var(--sh-lg); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
.stage-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stage-top .label { margin-right: auto; }
.stage .legend { font-size: 12px; color: var(--muted); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--mouth); margin-right: 4px; vertical-align: 1px; }
.legend i.s { width: 4px; height: 4px; background: var(--muted); }
.legend em { font-style: normal; color: var(--ear); font-weight: 700; margin-right: 4px; }
.plan { display: flex; flex-direction: column; gap: 12px; }
.plan-head { display: flex; align-items: baseline; gap: 10px; }
.plan-head h2 { font: 400 19px/1.3 var(--f-disp); margin-right: auto; }
.plan-head .mins { font-weight: 700; font-variant-numeric: tabular-nums; }
.meter { height: 12px; border: 2px solid var(--line); border-radius: 999px; background: var(--card); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--hl); border-right: 2px solid var(--line); }
.meter i[style*="100%"] { border-right: none; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: var(--bw) solid var(--line); border-radius: 16px; background: var(--card); overflow: hidden; }
.steps li { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; padding: 11px 14px; border-top: 2px dashed var(--soft); counter-increment: st; }
.steps li:first-child { border-top: none; }
.steps li::before { content: counter(st); display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); font: 400 14px/1 var(--f-disp); background: var(--paper); }
.steps li.done::before { content: "済"; background: var(--hanko); color: var(--on-color); border-color: var(--hanko); font-size: 13px; }
.steps li b { display: block; font-weight: 900; font-size: 15.5px; line-height: 1.3; }
.steps li span { display: block; font-size: 13px; color: var(--muted); line-height: 1.4; }
.steps li em { font-style: normal; font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.steps li.done b { text-decoration: line-through; text-decoration-thickness: 2px; opacity: .6; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.week .d { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; color: var(--muted); font-weight: 700; }
.week .d .c { width: 38px; height: 38px; border-radius: 50%; border: 2px dashed var(--muted); display: grid; place-items: center; opacity: .55; }
.week .d.part .c { border-style: solid; opacity: 1; background: var(--card); }
.week .d.part .c::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--hanko); }
.week .d.today { color: var(--ink); }
.week .d.today .c { opacity: 1; border-color: var(--ink); }
.week .d.full .c { border: none; opacity: 1; }
.week .d .c svg { width: 40px; height: 40px; color: var(--hanko); }
.section-title { font: 400 17px/1.3 var(--f-disp); }
.note { font-size: 13.5px; color: var(--muted); }
.callout { border: 2px dashed var(--muted); border-radius: 14px; padding: 12px 14px; font-size: 14px; color: var(--muted); }

/* ---------- 練習メニュー ---------- */
.tool { background: var(--card); border: var(--bw) solid var(--line); border-radius: 18px; box-shadow: var(--sh); overflow: hidden; }
.tool-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: var(--bw) solid var(--line); background: var(--ear); color: var(--on-color); }
.tool.mouthy .tool-head { background: var(--mouth); }
.tool.inky .tool-head { background: var(--ink); color: var(--paper); }
.tool-head h3 { font: 400 17px/1.3 var(--f-disp); margin-right: auto; }
.tool-head .chip { color: var(--ink); }
.tool-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 12px; }
.tool-body p { font-size: 14px; color: var(--muted); }
.pagehead { display: flex; flex-direction: column; gap: 4px; padding-top: 4px; }
.pagehead h1 { font: 400 24px/1.25 var(--f-disp); }
.pagehead p { color: var(--muted); font-size: 14px; }
.acc { font-variant-numeric: tabular-nums; font-size: 12px; opacity: .8; margin-left: 2px; }

/* ---------- 全画面（練習・会話・聞き流し） ---------- */
#ov { position: fixed; left: 0; right: 0; top: var(--vvt, 0px); height: var(--vvh, 100%); z-index: 40; background: var(--paper); display: flex; flex-direction: column; }
#ov[hidden] { display: none; }
.ov-wrap { width: 100%; max-width: 560px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; }
.run-top { display: flex; align-items: center; gap: 10px; padding: 10px 14px 6px; flex: none; }
.run-title { display: flex; flex-direction: column; margin-right: auto; min-width: 0; line-height: 1.25; }
.run-title b { font: 400 16px/1.3 var(--f-disp); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.run-title span { font-size: 12.5px; color: var(--muted); font-weight: 700; }
.run-count { font: 400 14px/1 var(--f-disp); font-variant-numeric: tabular-nums; }
.run-bar { height: 8px; margin: 2px 14px 0; border: 2px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--card); flex: none; }
.run-bar i { display: block; height: 100%; background: var(--ear); transition: width .25s ease; }
.run-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.run-body { padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 16px; min-height: 100%; }
.run-foot { flex: none; padding: 10px 16px 14px; border-top: var(--bw) solid var(--line); background: var(--card); display: flex; flex-direction: column; gap: 10px; }
.run-foot:empty { display: none; }
.q { font-weight: 900; font-size: 17px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.prompt-ja { font: 700 clamp(20px, 5.6vw, 26px)/1.55 var(--f-ja); }
.playbig { align-self: center; display: flex; flex-direction: column; align-items: center; gap: 6px; border: none; background: none; font-weight: 700; font-size: 13.5px; color: var(--muted); padding: 4px; }
.playbig .disc { width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; background: var(--ear); color: var(--on-color); border: var(--bw) solid var(--line); box-shadow: var(--sh-lg); transition: transform .06s, box-shadow .06s; }
.playbig:active .disc { transform: translate(4px, 4px); box-shadow: none; }
.playbig .disc .ic { width: 40px; height: 40px; }
html.is-speaking .playbig .disc { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 5px 5px 0 var(--line), 0 0 0 10px color-mix(in srgb, var(--ear) 25%, transparent); } }
.audio-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice { min-height: 86px; border: var(--bw) solid var(--line); border-radius: 18px; background: var(--card); box-shadow: var(--sh-lg); font: 600 clamp(22px, 6vw, 28px)/1.2 var(--f-en); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px; transition: transform .06s, box-shadow .06s; }
.choice:active:not(:disabled) { transform: translate(5px, 5px); box-shadow: none; }
.choice small { font: 700 12px/1 var(--f-ja); color: var(--muted); }
.choice.right { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.choice.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.choice:disabled { cursor: default; }
.verdict { display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 18px; padding: 10px 14px; border: var(--bw) solid var(--line); border-radius: 14px; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.verdict.ng { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.verdict.mid { background: color-mix(in srgb, var(--hl) 45%, var(--card)); }
.verdict .ic { width: 26px; height: 26px; stroke-width: 3; }
.verdict small { font-weight: 700; font-size: 13px; margin-left: auto; color: var(--ink); opacity: .75; }
.tip { font-size: 14.5px; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.tip b { font-weight: 900; }
.card { background: var(--card); border: var(--bw) solid var(--line); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--sh); }
.card.flat { box-shadow: none; }
.sound { display: inline-flex; align-items: baseline; gap: 8px; font-weight: 900; font-size: 20px; }
.sound small { font-size: 12.5px; color: var(--muted); font-weight: 700; }
textarea.full, input.text, select.text { width: 100%; border: var(--bw) solid var(--line); border-radius: 14px; background: var(--card); padding: 12px 14px; font: 500 17px/1.5 var(--f-en); resize: vertical; }
textarea.full:focus, input.text:focus { outline: none; box-shadow: 0 0 0 3px var(--ear-soft); border-color: var(--ear); }
input.text.ja-in, textarea.ja-in { font-family: var(--f-ja); }
.timer { height: 6px; border-radius: 999px; background: var(--soft); overflow: hidden; }
.timer i { display: block; height: 100%; width: 100%; background: var(--mouth); transform-origin: left; animation: shrink var(--dur, 6s) linear forwards; }
@keyframes shrink { to { transform: scaleX(0); } }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grades .btn { flex-direction: column; gap: 0; min-height: 58px; padding: 6px 4px; font-size: 14.5px; }
.grades .btn small { font-weight: 500; font-size: 11.5px; opacity: .8; }
.grades .g0 { background: var(--bad-soft); }
.grades .g2 { background: var(--ok-soft); }
.grades .g3 { background: var(--ear-soft); }
.grades .btn.sug { outline: 3px solid var(--ink); outline-offset: 2px; }
.speakbox { display: flex; flex-direction: column; gap: 10px; }
.mic { width: 100%; min-height: 60px; font-size: 17px; }
.mic.on { background: var(--ink); color: var(--paper); animation: breathe 1.4s ease-in-out infinite; }
@keyframes breathe { 50% { box-shadow: 3px 3px 0 var(--line), 0 0 0 8px color-mix(in srgb, var(--mouth) 30%, transparent); } }
.live { min-height: 1.6em; font: 500 17px/1.5 var(--f-en); color: var(--ink); }
.live:empty::before { content: attr(data-ph); color: var(--muted); font: 500 13.5px/1.5 var(--f-ja); }
.live .part { color: var(--muted); }
.typein { display: flex; gap: 8px; }
.typein input { flex: 1; min-width: 0; border: var(--bw) solid var(--line); border-radius: 12px; background: var(--card); padding: 10px 12px; font: 500 17px/1.4 var(--f-en); }
.typein input:focus { outline: none; border-color: var(--ear); box-shadow: 0 0 0 3px var(--ear-soft); }

.score { font: 400 30px/1 var(--f-disp); font-variant-numeric: tabular-nums; }
.score small { font: 700 13px/1 var(--f-ja); color: var(--muted); margin-left: 4px; }
.heard { font: 500 15px/1.5 var(--f-en); color: var(--muted); }

.finish { align-items: center; text-align: center; justify-content: center; }

.bignums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }

.bignums b { font: 400 26px/1.1 var(--f-disp); font-variant-numeric: tabular-nums; }
.bignums span { font-size: 12px; color: var(--muted); font-weight: 700; }
.stamp { color: var(--hanko); }

.stamp.slam { animation: slam .55s cubic-bezier(.2, .9, .3, 1.3) both; }
@keyframes slam { 0% { transform: scale(2.2) rotate(-24deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: scale(1) rotate(-9deg); opacity: 1; } }
.stamp.rest { transform: rotate(-9deg); }

/* ---------- AI会話 ---------- */
.scenes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.scene { text-align: left; border: var(--bw) solid var(--line); border-radius: 16px; background: var(--card); box-shadow: var(--sh); padding: 12px; display: flex; flex-direction: column; gap: 4px; min-height: 92px; }

.msg { max-width: 88%; display: flex; flex-direction: column; gap: 6px; }
.msg.ai { align-self: flex-start; }
.msg.me { align-self: flex-end; align-items: flex-end; }
.bubble { border: var(--bw) solid var(--line); border-radius: 18px; padding: 10px 14px; font: 400 17px/1.5 var(--f-en); background: var(--card); box-shadow: 2px 2px 0 var(--line); }
.msg.ai .bubble { border-bottom-left-radius: 4px; }

.msg.me .bubble.ja-msg { font-family: var(--f-ja); font-size: 16px; }
.bubble .tr { display: block; font: 500 14px/1.5 var(--f-ja); color: var(--muted); margin-top: 4px; }
.bubble.hidden-cap { color: var(--muted); font: 700 14px/1.5 var(--f-ja); display: flex; gap: 8px; align-items: center; }
.msg-tools { display: flex; gap: 6px; }

.msg-tools button .ic { width: 15px; height: 15px; }
.fb { width: 100%; border: 2px solid var(--line); border-radius: 14px; background: var(--card); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.fb.good { border-color: var(--ok); }
.fb .fb-h { font-weight: 900; display: flex; align-items: center; gap: 6px; }
.fb.good .fb-h { color: var(--ok); }
.fb.fix .fb-h { color: var(--mouth); }
.fb .fb-h .ic { width: 18px; height: 18px; stroke-width: 3; }
.fb .alt { font: 500 16px/1.45 var(--f-en); }
.fb .alt small { display: block; font: 700 11.5px/1.4 var(--f-ja); color: var(--muted); }
.typing { display: inline-flex; gap: 5px; padding: 14px 16px; }
.typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; }
.typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 50% { opacity: .2; } }
.composer { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; min-width: 0; border: var(--bw) solid var(--line); border-radius: 14px; background: var(--card); padding: 10px 12px; font: 500 17px/1.4 var(--f-en); resize: none; max-height: 120px; }

.composer .btn { min-height: 48px; padding: 0 12px; }
.hints { display: flex; flex-direction: column; gap: 6px; }
.hints button { text-align: left; border: 2px solid var(--line); border-radius: 12px; background: var(--hl); color: #1D1A3B; padding: 8px 12px; font: 500 15px/1.4 var(--f-en); }
.hints button small { display: block; font: 700 12px/1.4 var(--f-ja); opacity: .75; }
.sys { align-self: center; font-size: 13.5px; color: var(--muted); text-align: center; max-width: 92%; display: flex; flex-direction: column; gap: 8px; align-items: center; }

/* ---------- 記録 ---------- */
.cal { background: var(--card); border: var(--bw) solid var(--line); border-radius: 18px; box-shadow: var(--sh-lg); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.cal-head { display: flex; align-items: center; gap: 8px; }
.cal-head h3 { font: 400 18px/1.3 var(--f-disp); margin-right: auto; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }

.cal-grid .day { aspect-ratio: 1; border: 1.5px solid var(--soft); border-radius: 10px; position: relative; display: grid; place-items: center; font: 600 12.5px/1 var(--f-en); color: var(--muted); }

.cal-grid .day svg { position: absolute; inset: 1px; width: calc(100% - 2px); height: calc(100% - 2px); color: var(--hanko); }
.cal-grid .day.future { opacity: .45; }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 7.5em 1fr 3.2em; gap: 8px; align-items: center; font-size: 13px; font-weight: 700; }
.bar-row .tr { height: 14px; border: 2px solid var(--line); border-radius: 999px; background: var(--card); overflow: hidden; }

.bar-row .tr i.low { background: var(--mouth); }
.bar-row .v { text-align: right; font-variant-numeric: tabular-nums; }
.list { display: flex; flex-direction: column; border: var(--bw) solid var(--line); border-radius: 16px; background: var(--card); overflow: hidden; }
.li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-top: 2px dashed var(--soft); }
.li:first-child { border-top: none; }
.li .en { font-size: 15.5px; line-height: 1.4; }
.li .ja { font-size: 13px; line-height: 1.45; }
.li .st-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); }

.li .st-dot.l2 { background: var(--ear); }
.li .acts { display: flex; gap: 6px; }
.li .acts button { width: 38px; height: 38px; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 10px; background: var(--card); padding: 0; }
.li .acts button .ic { width: 18px; height: 18px; }
.empty { padding: 18px 14px; text-align: center; color: var(--muted); font-size: 14px; }

/* ---------- シート・ダイアログ・トースト ---------- */
#sheet { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }

.sheet-back { position: absolute; inset: 0; background: color-mix(in srgb, var(--ink) 45%, transparent); }
.sheet-panel { position: relative; width: 100%; max-width: 560px; max-height: calc(var(--vvh, 100%) - 24px); overflow-y: auto; background: var(--paper); border: var(--bw) solid var(--line); border-bottom: none; border-radius: 22px 22px 0 0; padding: 16px 16px 22px; display: flex; flex-direction: column; gap: 16px; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet-head { display: flex; align-items: center; gap: 10px; }

.sw span { font-weight: 700; font-size: 15px; }

.toggle[aria-checked="true"] { background: var(--ok); }
.toggle[aria-checked="true"]::after { transform: translateX(24px); }
.lvopts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.lvopt { text-align: left; border: var(--bw) solid var(--line); border-radius: 14px; background: var(--card); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; box-shadow: 2px 2px 0 var(--line); }

.lvopt span { font-size: 12px; color: var(--muted); line-height: 1.4; }
.lvopt em { font: 400 13px/1.4 var(--f-en); font-style: normal; }
.lvopt[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.lvopt[aria-pressed="true"] span { color: color-mix(in srgb, var(--paper) 75%, transparent); }
.range { display: flex; align-items: center; gap: 12px; }
.range input { flex: 1; accent-color: var(--ear); }
.range output { font: 400 15px/1 var(--f-disp); min-width: 3.4em; text-align: right; }
details.help { border: 2px solid var(--line); border-radius: 14px; background: var(--card); padding: 10px 14px; }
details.help summary { font-weight: 900; cursor: pointer; }
details.help ul { margin: 8px 0 0; padding-left: 1.2em; font-size: 14px; display: flex; flex-direction: column; gap: 6px; }
.dlg-wrap { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 20px; background: color-mix(in srgb, var(--ink) 45%, transparent); }
.dlg { width: 100%; max-width: 380px; background: var(--card); border: var(--bw) solid var(--line); border-radius: 20px; box-shadow: var(--sh-lg); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.dlg h3 { font: 400 18px/1.4 var(--f-disp); }
.dlg p { font-size: 14.5px; color: var(--muted); }

#toast.on { opacity: 1; transform: translateX(-50%) translateY(-6px); }
body.ov-open #toast { bottom: 110px; }

@media (prefers-reduced-motion: reduce) {

@media (min-width: 600px) {

.iconbtn:disabled { opacity: .35; cursor: default; box-shadow: none; }
.run-title span:empty { display: none; }

/* ===== core.js — 判定・リズム・復習間隔などの純粋ロジック（DOMなし） ===== */
const Core = (() => {
  'use strict';

  function hashStr(s) {
    let h = 5381;
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  }

  function parseCorpus(raw) {
    const out = [];
    for (const lv of Object.keys(raw)) {
      let ord = 0;
      raw[lv].split('\n').forEach((line) => {
        if (!line.trim()) return;
        const [en, ja, tag] = line.split('|').map((x) => (x || '').trim());
        if (!en || !ja) return;
        out.push({ id: 's' + hashStr(en), en, ja, tag: tag || '', lv: +lv, ord: ord++ });
      });
    }
    return out;
  }

  // ローカル日付での通し日番号
  function dayNum(d) {
    return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000);
  }
  function dayToDate(n) {
    const d = new Date(n * 86400000);
    return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  }

  const ONES = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
  const TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
  function numWords(n) {
    if (n < 20) return ONES[n];
    if (n < 100) return TENS[Math.floor(n / 10)] + (n % 10 ? ' ' + ONES[n % 10] : '');
    if (n < 1000) return ONES[Math.floor(n / 100)] + ' hundred' + (n % 100 ? ' ' + numWords(n % 100) : '');
    if (n < 10000) return numWords(Math.floor(n / 1000)) + ' thousand' + (n % 1000 ? ' ' + numWords(n % 1000) : '');
    return String(n);
  }

  const CONTR = {
    "i'm": 'i am', "you're": 'you are', "we're": 'we are', "they're": 'they are', "he's": 'he is', "she's": 'she is', "it's": 'it is',
    "that's": 'that is', "what's": 'what is', "where's": 'where is', "who's": 'who is', "how's": 'how is', "there's": 'there is', "here's": 'here is', "let's": 'let us',
    "i've": 'i have', "you've": 'you have', "we've": 'we have', "they've": 'they have', "could've": 'could have', "should've": 'should have', "would've": 'would have', "might've": 'might have', "must've": 'must have',
    "i'll": 'i will', "you'll": 'you will', "we'll": 'we will', "they'll": 'they will', "he'll": 'he will', "she'll": 'she will', "it'll": 'it will', "that'll": 'that will',
    "i'd": 'i would', "you'd": 'you would', "we'd": 'we would', "they'd": 'they would', "he'd": 'he would', "she'd": 'she would',
    "don't": 'do not', "doesn't": 'does not', "didn't": 'did not', "can't": 'can not', cannot: 'can not', "won't": 'will not', "wouldn't": 'would not',
    "shouldn't": 'should not', "couldn't": 'could not', "isn't": 'is not', "aren't": 'are not', "wasn't": 'was not', "weren't": 'were not',
    "haven't": 'have not', "hasn't": 'has not', "hadn't": 'had not', "mustn't": 'must not', "needn't": 'need not', "ain't": 'is not',
    gonna: 'going to', wanna: 'want to', gotta: 'got to', kinda: 'kind of', lemme: 'let me', gimme: 'give me', shoulda: 'should have',
    hafta: 'have to', cuppa: 'cup of', ok: 'okay', 'o.k.': 'okay', till: 'until', alright: 'all right',
  };

  // 表示用トークン（語・記号・空白）。ci は文字位置
  function tokenize(text) {
    const toks = [];
    const re = /([A-Za-z0-9]+(?:['’][A-Za-z]+)*(?:-[A-Za-z0-9]+)*)|(\s+)|([^A-Za-z0-9\s]+)/g;
    let m;
    while ((m = re.exec(text))) {
      if (m[1]) toks.push({ k: 'w', s: m[1], ci: m.index });
      else if (m[2]) toks.push({ k: 's', s: m[2], ci: m.index });
      else toks.push({ k: 'p', s: m[3], ci: m.index });
    }
    return toks;
  }

  // 1語を比較用の語（複数のこともある）に正規化
  function normToken(w) {
    let x = w.toLowerCase().replace(/[’‘`´]/g, "'").replace(/^'+|'+$/g, '');
    if (!x) return [];
    if (CONTR[x]) return CONTR[x].split(' ');
    if (/^\d+$/.test(x)) return numWords(parseInt(x, 10)).split(' ');
    if (/'s$/.test(x)) x = x.slice(0, -2);
    if (x.includes('-')) return x.split('-').filter(Boolean);
    return [x];
  }

  function normWords(text) {
    const t = String(text || '')
      .replace(/(\d{1,2}):(\d{2})/g, (_, h, mm) => h + (mm === '00' ? '' : ' ' + mm))
      .replace(/(\d),(\d{3})/g, '$1$2');
    const words = [];
    for (const tok of tokenize(t)) if (tok.k === 'w') words.push(...normToken(tok.s));
    return { words };
  }

  function lev(a, b) {
    if (a === b) return 0;
    if (Math.abs(a.length - b.length) > 2) return 3;
    const dp = Array.from({ length: a.length + 1 }, (_, i) => i);
    for (let j = 1; j <= b.length; j++) {
      let prev = dp[0];
      dp[0] = j;
      for (let i = 1; i <= a.length; i++) {
        const tmp = dp[i];
        dp[i] = Math.min(dp[i] + 1, dp[i - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
        prev = tmp;
      }
    }
    return dp[a.length];
  }

  // 最長共通部分列による語の対応づけ
  function align(T, U) {
    const n = T.length, m = U.length;
    const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
    for (let i = n - 1; i >= 0; i--)
      for (let j = m - 1; j >= 0; j--)
        dp[i][j] = T[i] === U[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    const ops = [];
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (T[i] === U[j]) { ops.push({ op: 'eq', t: i, u: j }); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push({ op: 'del', t: i }); i++; }
      else { ops.push({ op: 'ins', u: j }); j++; }
    }
    while (i < n) ops.push({ op: 'del', t: i++ });
    while (j < m) ops.push({ op: 'ins', u: j++ });
    return { lcs: dp[0][0], ops };
  }

  // アポストロフィなしで書いた短縮形（its, dont, oclock など）を、お手本に合わせて直す
  function fixApostrophes(said, target) {
    const forms = new Map();
    for (const t of tokenize(target)) if (t.k === 'w' && /['’]/.test(t.s)) forms.set(bare(t.s), t.s);
    if (!forms.size) return said;
    return String(said || '').replace(/[A-Za-z]+/g, (w) => forms.get(w.toLowerCase()) || w);
  }

  // お手本 target と、言った／書いた said を比べる
  function compare(target, said) {
    said = fixApostrophes(said, target);
    const toks = tokenize(target);
    const T = [], tmap = [];
    toks.forEach((tok, ti) => {
      if (tok.k === 'w') normToken(tok.s).forEach((w) => { T.push(w); tmap.push(ti); });
    });
    const U = normWords(said).words;
    const { ops } = align(T, U);
    const st = new Array(T.length).fill('miss');
    const usedU = new Set();
    ops.forEach((o) => { if (o.op === 'eq') { st[o.t] = 'ok'; usedU.add(o.u); } });
    // 一致の間にはさまれた区間で、つづり違い程度のものは near
    let seg = { del: [], ins: [] };
    const flush = () => {
      for (const t of seg.del) {
        let best = -1, bd = 9;
        for (const u of seg.ins) {
          if (usedU.has(u)) continue;
          const d = lev(T[t], U[u]);
          const lim = T[t].length >= 7 ? 2 : T[t].length >= 4 ? 1 : 0;
          if (d <= lim && d < bd) { bd = d; best = u; }
        }
        if (best >= 0) { st[t] = 'near'; usedU.add(best); }
      }
      seg = { del: [], ins: [] };
    };
    for (const o of ops) {
      if (o.op === 'eq') flush();
      else if (o.op === 'del') seg.del.push(o.t);
      else seg.ins.push(o.u);
    }
    flush();
    toks.forEach((tok, ti) => {
      if (tok.k !== 'w') return;
      const ss = [];
      tmap.forEach((x, i) => { if (x === ti) ss.push(st[i]); });
      if (!ss.length) tok.m = 'ok';
      else if (ss.every((x) => x === 'ok')) tok.m = 'ok';
      else if (ss.some((x) => x !== 'miss')) tok.m = 'near';
      else tok.m = 'miss';
    });
    const good = st.filter((x) => x === 'ok').length + 0.75 * st.filter((x) => x === 'near').length;
    const extra = [];
    U.forEach((w, u) => { if (!usedU.has(u)) extra.push(w); });
    return { score: T.length ? good / T.length : 0, tokens: toks, extra, total: T.length, heard: U.length };
  }

  // 候補が複数あるとき（音声認識の別候補）一番近いものを採用
  function compareBest(target, alts) {
    let best = null;
    for (const a of alts) {
      if (!a) continue;
      const r = compare(target, a);
      r.said = a;
      if (!best || r.score > best.score) best = r;
    }
    return best || Object.assign(compare(target, ''), { said: '' });
  }

  /* ---- リズム（強く読む語）とつながり ---- */
  const FUNC = new Set(('a an the to of for from at in on by with as and but or nor than if ' +
    'is am are was were be been being do does did have has had can could will would shall should may might must ' +
    'i me my you your he him his she her it its we us our they them their some any into about ' +
    "i'm you're we're they're he's she's it's i've you've we've they've i'll you'll we'll they'll he'll she'll it'll " +
    "i'd you'd we'd they'd he'd she'd there's that's").split(/\s+/));
  const END_STRESS = new Set(('is am are was were be been do does did have has had can could will would shall should may might must ' +
    'to of for from at in on by with about into').split(/\s+/));
  const E_VOWEL = new Set(['the', 'be', 'he', 'me', 'we', 'she', 'ye', 'maybe', 'recipe', 'cafe', 'karaoke', 'anime', 'sake', 'karate', 'sesame']);
  const GH_CONS = new Set(['enough', 'tough', 'rough', 'cough', 'laugh']);

  function bare(w) { return w.toLowerCase().replace(/[’']/g, ''); }
  function endsConsonant(w0) {
    const w = bare(w0);
    if (!w) return false;
    if (/[aiouyw]$/.test(w)) return false;
    if (/e$/.test(w)) return !(E_VOWEL.has(w) || /(ee|ie|oe|ye|ue|ae)$/.test(w));
    if (/gh$/.test(w)) return GH_CONS.has(w);
    if (/h$/.test(w)) return !/(ah|oh|uh|eh)$/.test(w);
    return /[bcdfgjklmnpqrstvxz]$/.test(w);
  }
  function startsVowel(w0) {
    const w = bare(w0);
    if (/^(one|once|uni|use|usu|uti|eu|ewe|you|yo)/.test(w)) return false;
    if (/^(hour|honest|honor|honour|heir)/.test(w)) return true;
    return /^[aeiou]/.test(w);
  }

  function rhythm(toks) {
    let clause = [];
    const close = () => {
      if (!clause.length) return;
      const last = clause[clause.length - 1];
      if (END_STRESS.has(last.s.toLowerCase().replace(/’/g, "'"))) last.st = true;
      if (!clause.some((t) => t.st)) last.st = true;
      clause = [];
    };
    toks.forEach((t) => {
      if (t.k === 'w') {
        const lw = t.s.toLowerCase().replace(/’/g, "'");
        t.st = !FUNC.has(lw);
        clause.push(t);
      } else if (t.k === 'p' && /[.,!?;:]/.test(t.s)) close();
    });
    close();
    for (let i = 0; i < toks.length; i++) {
      const t = toks[i];
      if (t.k !== 'w') continue;
      const sp = toks[i + 1], nx = toks[i + 2];
      if (sp && sp.k === 's' && nx && nx.k === 'w' && endsConsonant(t.s) && startsVowel(nx.s)) {
        t.lk = true;
        nx.lkp = true;
      }
    }
    return toks;
  }

  /* ---- 穴埋めの位置選び ---- */
  function pickBlanks(toks, n, rand) {
    rand = rand || Math.random;
    const cands = [];
    toks.forEach((t, i) => {
      if (t.k !== 'w') return;
      let sc = 0;
      const weak = !t.st;
      if (weak) sc += 3;
      if (t.lk || t.lkp) sc += 2;
      if (i > 0 && /^[A-Z]/.test(t.s) && t.s !== 'I' && !/^I['’]/.test(t.s)) sc -= 5;
      if (/\d/.test(t.s)) sc -= 5;
      cands.push({ i, sc, weak });
    });
    const score = (arr) => arr.map((c) => ({ i: c.i, sc: c.sc, r: c.sc + rand() * 2.5 })).sort((a, b) => b.r - a.r);
    const pick = [];
    const strong = score(cands.filter((c) => !c.weak && c.sc > -3));
    if (n >= 2 && strong.length) pick.push(strong[0].i);
    for (const c of score(cands)) {
      if (pick.length >= n) break;
      if (!pick.includes(c.i) && c.sc > -3) pick.push(c.i);
    }
    if (!pick.length && cands.length) pick.push(cands[0].i);
    return pick.sort((a, b) => a - b);
  }

  function squash(s) {
    return String(s || '').toLowerCase().replace(/[’‘`´]/g, "'").replace(/[^a-z0-9' ]/g, ' ').replace(/\s+/g, ' ').trim();
  }
  // 穴埋め・聞き取りの答え合わせ。'ok' | 'near'（つづりミス） | 'ng'
  function answerCheck(ans, target, alts) {
    const a = normWords(ans).words.join(' ');
    if (!a) return 'ng';
    const goals = [target].concat(alts || []);
    for (const g of goals) {
      const b = normWords(g).words.join(' ');
      if (a === b) return 'ok';
      if (squash(ans).replace(/'/g, '') === squash(g).replace(/'/g, '')) return 'ok';
    }
    for (const g of goals) {
      const b = normWords(g).words.join(' ');
      if (b.length >= 5 && lev(a, b) <= 1) return 'near';
      if (b.length >= 10 && lev(a, b) <= 2) return 'near';
    }
    return 'ng';
  }

  /* ---- 復習間隔（簡易SM-2） grade: 0 もう一回 / 1 難しい / 2 OK / 3 簡単 ---- */
  function srsNext(card, g, t, now) {
    const c = Object.assign({ i: 0, e: 2.5, r: 0, l: 0, d: t }, card || {});
    if (g === 0) { c.l += 1; c.e = Math.max(1.3, c.e - 0.2); c.i = 1; }
    else if (g === 1) { c.e = Math.max(1.3, c.e - 0.15); c.i = Math.max(1, Math.round(c.i * 1.2)); }
    else if (g === 2) { c.i = c.i < 1 ? 1 : c.i < 3 ? 3 : Math.round(c.i * c.e); }

    if (this.unlocked) return;
    this.unlocked = true;
    const ss = window.speechSynthesis;
    if (!ss) return;
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; ss.speak(u); } catch { /* noop */ }
  },
  // 聞き分け練習用：毎回ちがう声
  variedVoice() {
    if (this.engine('en') === 'claude') return { cvoice: pickOne(CVOICES)[0] };
    const vs = Voices.variety();
    return vs.length ? { voice: pickOne(vs) } : {};
  },
};

/* ---------- マイク（Claudeの音声入力 → ブラウザの音声認識 → キーボード） ---------- */
const Mic = {
  active: false, h: null, fin: '', part: '', alts: [], rec: null, dictOff: false, webOff: false, silenceT: 0, capT: 0, subscribed: false,
  kind() {
    if (Caps.dict && !this.dictOff) return 'claude';
    if (SR && !this.webOff && !(HAS_CLAUDE && IN_FRAME)) return 'web';
    return 'none';
  },
  subscribe() {
    if (this.subscribed || !Caps.dict) return;
    this.subscribed = true;
    Caps.dict.onPartial(({ text }) => { if (!this.active) return; this.part = text || ''; this._emit(); this._arm(1600); });
    Caps.dict.onFinal(({ text }) => { if (!this.active) return; this.fin += text || ''; this.part = ''; this._emit(); this._arm(1300); });
    Caps.dict.onState(({ state, reason }) => {
      if (state === 'listening' && this.active) this.h?.onState?.('listening');
      if (state === 'idle' && this.active) this._end(reason || 'idle');
    });
  },
  // クリックの中から同期的に呼ぶこと
  start(h) {
    if (this.active) { this.stop(); return true; }
    const k = this.kind();
    if (k === 'none') return false;
    Speech.stop();
    this.h = h; this.fin = ''; this.part = ''; this.alts = []; this.active = true;
    clearTimeout(this.capT);
    this.capT = setTimeout(() => this.stop(), 25000);
    if (k === 'claude') {
      Caps.dict.start({ language: 'en-US' })
        .then(() => { this.h?.onState?.('listening'); this._arm(7000); })
        .catch((e) => this._fail((e && e.code) || 'upstream_error'));
    } else {
      try {
        const r = new SR();
        this.rec = r;
        r.lang = 'en-US'; r.interimResults = true; r.continuous = false; r.maxAlternatives = 3;
        r.onresult = (ev) => {
          let fin = '', part = '';
          const alts = [];
          for (let i = 0; i < ev.results.length; i++) {
            const res = ev.results[i];
            if (res.isFinal) { fin += res[0].transcript; for (let j = 0; j < res.length; j++) alts.push(res[j].transcript); }
            else part += res[0].transcript;
          }
          this.fin = fin; this.part = part; if (alts.length) this.alts = alts;
          this._emit();
        };
        r.onerror = (ev) => {
          const c = ev.error;
          if (c === 'not-allowed' || c === 'service-not-allowed' || c === 'audio-capture') { this.webOff = true; toast('この画面ではマイクが使えません。キーボードの音声入力を使ってください。', 4200); }
          else if (c === 'no-speech') toast('声が聞き取れませんでした。もう一度どうぞ');
        };
        r.onend = () => this._end('ended');
        r.start();
        this.h?.onState?.('listening');
      } catch {
        this.webOff = true;
        this._end('error');
        return false;
      }
    }
    h.onState?.('starting');
    return true;
  },
  _arm(ms) {
    clearTimeout(this.silenceT);
    this.silenceT = setTimeout(() => { if (this.active) this.stop(); }, ms);
  },
  stop() {
    if (!this.active) return;
    clearTimeout(this.silenceT);
    if (this.rec) { try { this.rec.stop(); } catch { this._end('error'); } }
    else if (Caps.dict) { Caps.dict.stop().catch(() => this._end('error')); }
    else this._end('stop');
  },
  _fail(code) {
    if (code === 'not_granted' || code === 'unavailable') { this.dictOff = true; toast('音声入力が使えません。キーボードの音声入力か、文字で入力してください。', 4200); }
    else if (code === 'no_gesture') toast('マイクのボタンをもう一度タップしてください');
    else if (code === 'rate_limited') toast('音声入力が混み合っています。少し待ってからどうぞ');
    else if (code === 'dismissed') toast('マイクの許可が必要です');
    this._end(code);
  },
  _emit() { this.h?.onText?.(this.fin.trim(), this.part.trim()); },
  _end(reason) {
    if (!this.active) return;
    this.active = false;
    clearTimeout(this.silenceT); clearTimeout(this.capT);
    this.rec = null;
    const text = (this.fin + ' ' + this.part).replace(/\s+/g, ' ').trim();
    const h = this.h; this.h = null;
    const alts = this.alts.length ? this.alts.slice() : [];
    if (text && !alts.includes(text)) alts.unshift(text);
    h?.onDone?.(text, alts, reason);
  },
};

/* ---------- Claude（AI） ---------- */
const AI = {
  off: false,
  ok() { return !!Caps.sample && !this.off; },
  async json(prompt, opt = {}) {
    try {
      return await Caps.sample.json(prompt, { modelTier: opt.tier || 'quick', cache: false, signal: opt.signal });
    } catch (e) {
      const c = (e && e.code) || 'upstream_error';
      if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(c)) { this.off = true; }
      throw { code: c, text: e && e.text };
    }
  },
  msg(code) {
    return ({
      cancelled: '',
      not_granted: 'Claudeの利用が許可されていないため、AI機能はお休みします。',
      sampling_disabled: 'このアカウントではAI機能が使えません。',
      not_declared: 'AI機能が使えない設定になっています。',
      rate_limited: '利用が集中しています。少し待ってからもう一度どうぞ。',
      session_expired: 'Claudeにサインインし直してください。',

      prompt_too_large: '会話が長くなりすぎました。新しく始めてください。',

/* ---------- 同期（Claudeアカウントに保存） ---------- */
const Sync = {
  ref: null, mode: 'local', timer: 0, writing: false, again: false, lastPushed: '', lastPull: 0, note: '',
  async init() {
    if (!Caps.db || !Caps.user) return;
    let uid = null;
    try { uid = await Caps.user.id(); } catch { uid = null; }
    if (!uid) return;
    try { this.ref = Caps.db.doc('data/users/' + uid + '/state'); } catch { this.ref = null; return; }
    await this.pull(true);
  },
  async pull(first) {
    if (!this.ref) return;
    this.lastPull = Date.now();
    let snap;
    try { snap = await withTimeout(this.ref.get(), 10000); }
    catch (e) { this.note = 'つながるまで端末に保存しています'; if (e && (e.code === 'revoked' || e.code === 'not_granted' || e.code === 'capability_disabled')) this.ref = null; refreshSyncNote(); return; }
    this.mode = 'cloud'; this.note = '';
    let remoteU = 0;
    if (snap && snap.exists) {
      const d = snap.data() || {};
      remoteU = +d.u || 0;
      let remote = null;
      try { remote = normalizeState(JSON.parse(d.json || 'null')); } catch { remote = null; }
      if (remote && remote.u) {
        const merged = normalizeState(Core.mergeState(S, remote));
        if (JSON.stringify(merged) !== JSON.stringify(S)) { S = merged; saveLocal(); if (!Ov.mode) render(); if (S.onb && Sheet.mode === 'onboard') Sheet.close(); }
      }
    }
    if (!snap || !snap.exists || remoteU < S.u) this.soon(first ? 800 : 2500);
    refreshSyncNote();
  },
  soon(ms = 2500) { if (!this.ref) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), ms); },
  async push() {
    if (!this.ref) return;
    if (this.writing) { this.again = true; return; }
    const json = JSON.stringify(S);
    if (json === this.lastPushed) return;
    this.writing = true;
    try {
      await this.ref.set({ v: 1, u: S.u, json });
      this.lastPushed = json; this.mode = 'cloud'; this.note = '';
    } catch (e) {
      const c = e && e.code;
      if (c === 'unavailable' || c === 'resource_exhausted') setTimeout(() => this.soon(), 6000 + Math.random() * 4000);
      else if (c === 'quota_exceeded') { this.note = '保存容量の上限に達しました'; toast('保存容量の上限に達しました。マイフレーズを減らすと保存できます。', 4500); }
      else { this.ref = null; this.mode = 'local'; this.note = 'この端末にだけ保存しています'; }
    }
    this.writing = false;
    refreshSyncNote();
    if (this.again) { this.again = false; this.soon(); }
  },
};
function refreshSyncNote() { const el = $('#sync-note'); if (el) el.textContent = syncText(); }
function syncText() {
  if (Sync.mode === 'cloud' && Sync.ref) return 'Claudeのアカウントに保存しています。ほかの端末でこのアプリを開いても続きから練習できます。';
  if (Sync.note) return Sync.note + '。';
  return HAS_CLAUDE ? 'この端末に保存しています（Claudeにサインインすると他の端末と同期します）。' : 'このブラウザに保存しています。';
}

function ask(title, body, okLabel = 'OK', cancelLabel = 'キャンセル') {
  return new Promise((resolve) => {
    const w = document.createElement('div');
    w.className = 'dlg-wrap';
    w.innerHTML = `<div class="dlg" role="alertdialog" aria-modal="true"><h3>${esc(title)}</h3>${body ? `<p>${esc(body)}</p>` : ''}<div class="row end"><button class="btn" data-r="0">${esc(cancelLabel)}</button><button class="btn ink" data-r="1">${esc(okLabel)}</button></div></div>`;
    const fin = (v) => { w.remove(); document.removeEventListener('keydown', key, true); resolve(v); };
    const key = (e) => { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); fin(false); } };
    w.addEventListener('click', (e) => { const b = e.target.closest('[data-r]'); if (b) fin(b.dataset.r === '1'); else if (e.target === w) fin(false); });
    document.addEventListener('keydown', key, true);
    document.body.appendChild(w);
    w.querySelector('[data-r="1"]').focus();
  });
}
let toastT = 0;
function toast(msg, ms = 2600) {
  const t = $('#toast'); if (!t) return;
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms);
}
const Wake = {
  lock: null,
  async on() { try { if (navigator.wakeLock && !this.lock) { this.lock = await navigator.wakeLock.request('screen'); this.lock.addEventListener?.('release', () => { this.lock = null; }); } } catch { this.lock = null; } },
  release() { try { this.lock?.release(); } catch { /* noop */ } this.lock = null; },
};

/* ---------- 英文の表示（リズム記号・穴埋め・判定の色） ---------- */
function rhythmTokens(en) { return Core.rhythm(Core.tokenize(en)); }
function sentHTML(en, o = {}) {
  const toks = o.tokens || rhythmTokens(en);
  const rh = o.rhythm ?? !!S.settings.rhythm;
  let html = '', wi = -1, inGrp = false;
  toks.forEach((t, i) => {
    if (t.k === 's') { if (!(rh && toks[i - 1] && toks[i - 1].lk)) html += ' '; return; }
    if (t.k === 'p') { html += `<span class="pu">${esc(t.s)}</span>`; return; }
    wi++;
    if (rh && t.lk && !inGrp) { html += '<span class="grp">'; inGrp = true; }
    if (o.blanks && o.blanks.has(i)) html += o.blankHTML(i, t);
    else {
      const cls = ['w'];
      if (rh) cls.push(t.st ? 'st' : 'wk');
      if (o.marks) cls.push('m-' + (t.m || 'miss'));
      if (o.hit && o.hit.has(i)) cls.push('hit');
      html += `<span class="${cls.join(' ')}" data-ci="${t.ci}" data-wi="${wi}">${esc(t.s)}</span>`;
    }
    if (rh && t.lk) html += '<span class="lk" aria-hidden="true">‿</span>';
    else if (inGrp) { html += '</span>'; inGrp = false; }
  });
  if (inGrp) html += '</span>';
  return html;
}
function enClass(extra = '') { return `en ${S.settings.rhythm ? 'rh' : ''} ${extra}`; }
// 端末の声の単語位置に合わせて光らせる
function karaoke(container) {
  const words = container ? $$('.w[data-ci]', container) : [];
  return (charIndex) => {
    let cur = null;
    for (const w of words) { if (+w.dataset.ci <= charIndex) cur = w; else break; }
    words.forEach((w) => w.classList.toggle('on', w === cur));
  };
}
function clearKaraoke(container) { if (container) $$('.w.on', container).forEach((w) => w.classList.remove('on')); }

function fmtMin(sec) {
  const m = Math.round(sec / 60);
  if (m < 60) return m + '分';
  return Math.floor(m / 60) + '時間' + (m % 60 ? (m % 60) + '分' : '');
}

/* ===== app-steps.js — 練習ステップと進行 ===== */
const PHASE = { warm: '耳慣らし', rev: '復習', new: '新しい文' };

/* ---------- 音の聞き分け ---------- */
class MPStep {
  constructor(c, pair, phase) { this.c = c; this.pair = pair; this.ans = rnd(2); this.v = Speech.variedVoice(); this.done = false; this.picked = -1; this.phase = phase || ''; this.label = '音の聞き分け'; }
  play(i = this.ans) { return Speech.say(this.pair[i], Object.assign({ rate: 0.95 }, this.v)); }
  render() {
    const choice = (i) => {
      let cls = 'choice';
      if (this.done) cls += i === this.ans ? ' right' : i === this.picked ? ' wrong' : '';
      return `<button class="${cls}" data-act="mp-pick" data-i="${i}" ${this.done ? 'disabled' : ''}>${esc(this.pair[i])}${this.done && i === this.ans ? '<small>聞こえた音</small>' : ''}</button>`;
    };
    let body = `<p class="q">どっちが聞こえた？ <span class="chip ear">${esc(this.c.name)}</span></p>
      <button class="playbig" data-act="replay"><span class="disc">${ic('play')}</span>もう一度聞く</button>
      <div class="choices">${choice(0)}${choice(1)}</div>`;
    if (this.done) {
      const good = this.picked === this.ans;
      body += `<div class="verdict ${good ? 'ok' : 'ng'}">${ic(good ? 'check' : 'x')}${good ? '正解！' : '正解は ' + esc(this.pair[this.ans])}</div>
        <div class="audio-row"><button class="btn sm" data-act="mp-hear" data-i="0">${ic('play')} ${esc(this.pair[0])}</button><button class="btn sm" data-act="mp-hear" data-i="1">${ic('play')} ${esc(this.pair[1])}</button></div>
        ${good ? '' : `<p class="tip"><b>コツ </b>${esc(this.c.tip)}</p>`}`;
    }
    const foot = this.done ? `<button class="btn big ink" data-act="next">次へ ${ic('next')}</button>` : '';
    return { body, foot };
  }
  mount() { if (!this.played) { this.played = true; this.t = setTimeout(() => this.play(), 300); } }
  act(a, el) {
    if (a === 'replay') { clearTimeout(this.autoT); this.play(); return true; }
    if (a === 'mp-pick' && !this.done) {
      this.picked = +el.dataset.i; this.done = true;
      const good = this.picked === this.ans;
      const st = S.mp[this.c.k] || (S.mp[this.c.k] = { n: 0, ok: 0 });
      st.n++; if (good) st.ok++;
      countItem(); commit();
      Sfx.play(good ? 'ok' : 'ng');
      Run.score(good);
      Run.refresh();
      if (good) this.autoT = setTimeout(() => { if (Run.cur() === this) Run.next(); }, 1200);
      return true;
    }
    if (a === 'mp-hear') { clearTimeout(this.autoT); this.play(+el.dataset.i); return true; }
    return false;
  }
  unmount() { clearTimeout(this.autoT); clearTimeout(this.t); }
}

/* ---------- 音の変化 ---------- */
const csKey = (it) => 'c' + Core.hashStr(it.t);
class CSStep {
  constructor(it, phase) { this.it = it; this.done = false; this.res = ''; this.ans = ''; this.phase = phase || ''; this.label = '音の変化'; }
  parts() {
    const t = this.it.t, c = this.it.c, i = t.toLowerCase().indexOf(c.toLowerCase());
    return [t.slice(0, i), t.slice(i, i + c.length), t.slice(i + c.length)];
  }
  play(slow) { return slow ? Speech.say(this.it.t, { slow: true }) : Speech.say(this.it.say || this.it.t, { rate: (S.settings.rate || 1) * 1.05 }); }
  render() {
    const R = CS_RULES[this.it.r];
    const [a, c, b] = this.parts();
    let body = `<p class="q">聞こえたとおりに書こう <span class="chip ear">${esc(R.name)}</span></p>
      <div class="audio-row"><button class="btn ear" data-act="replay">${ic('play')} ふつうの速さ</button><button class="btn" data-act="slow">${ic('play')} ゆっくり</button></div>`;
    if (!this.done) {
      body += `<p class="en big-en">${esc(a)}<input class="blank" id="cs-in" style="width:${Math.max(4, c.length + 1.5)}ch" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="聞こえた語句">${esc(b)}</p>
        <p class="note">空欄の部分が、音がつながったり消えたりするところです。</p>`;
    } else {
      const good = this.res !== 'ng';
      body += `<p class="en big-en">${esc(a)}<span class="w hit">${esc(c)}</span>${esc(b)}</p>
        <div class="verdict ${good ? 'ok' : 'ng'}">${ic(good ? 'check' : 'x')}${this.res === 'ok' ? '正解！' : this.res === 'near' ? 'ほぼ正解（つづりに注意）' : '答え：' + esc(c)}${this.ans && this.res !== 'ok' ? `<small>あなた：${esc(this.ans)}</small>` : ''}</div>
        <div class="card flat"><span class="sound">${esc(this.it.s)}<small>のように聞こえる</small></span><p class="small"><b>${esc(R.name)}（${esc(R.sub)}）</b> ${esc(R.desc)}</p></div>`;
    }
    const foot = this.done
      ? `<button class="btn big ink" data-act="next">次へ ${ic('next')}</button>`
      : `<button class="btn big ink" data-act="check">答え合わせ</button><button class="btn link" data-act="giveup">わからない（答えを見る）</button>`;
    return { body, foot };
  }
  mount() {
    if (!this.played) { this.played = true; this.t = setTimeout(() => this.play(false), 300); }
    if (!this.done && finePointer()) $('#cs-in')?.focus();
  }
  check(giveup) {
    this.ans = giveup ? '' : ($('#cs-in')?.value || '').trim();
    this.res = giveup ? 'ng' : Core.answerCheck(this.ans, this.it.c);
    this.done = true;
    const k = csKey(this.it);
    const st = S.cs[k] || (S.cs[k] = { n: 0, ok: 0 });
    st.n++; if (this.res !== 'ng') st.ok++;
    countItem(); commit();
    Sfx.play(this.res !== 'ng' ? 'ok' : 'ng');
    Run.score(this.res !== 'ng');
    Run.refresh();
    setTimeout(() => { if (Run.cur() === this) this.play(false); }, 350);
  }
  act(a) {
    if (a === 'replay') { this.play(false); return true; }
    if (a === 'slow') { this.play(true); return true; }
    if (a === 'check' && !this.done) { this.check(false); return true; }
    if (a === 'giveup' && !this.done) { this.check(true); return true; }
    return false;
  }
  unmount() { clearTimeout(this.t); }
}

/* ---------- ディクテーション（穴埋め・全文） ---------- */
class DictStep {
  constructor(s, mode, o = {}) {
    this.s = s; this.mode = mode; this.learn = !!o.learn; this.phase = o.phase || '';
    this.toks = rhythmTokens(s.en);
    const nW = this.toks.filter((t) => t.k === 'w').length;
    this.blanks = mode === 'cloze' ? new Set(Core.pickBlanks(this.toks, clamp(Math.round(nW / 4), 1, 3))) : null;
    this.done = false; this.showJa = false; this.label = this.learn ? '聞き取り' : mode === 'cloze' ? '穴埋め' : '全文';
  }
  play(slow) {
    const box = this.done ? $('#dc-en') : null;
    return Speech.say(this.s.en, { slow, onWord: box ? karaoke(box) : null }).then(() => clearKaraoke(box));
  }
  render() {
    let body = `<p class="q">${this.mode === 'cloze' ? '空欄の語を聞き取ろう' : '聞こえた英文を書こう'}${this.learn ? ' <span class="chip ear">新しい文</span>' : ''}</p>
      <div class="audio-row"><button class="btn ear round" data-act="replay" aria-label="もう一度聞く">${ic('play')}</button><button class="btn" data-act="slow">ゆっくり</button></div>`;
    if (!this.done) {
      if (this.mode === 'cloze') {
        body += `<p class="en big-en">${sentHTML(this.s.en, { tokens: this.toks, rhythm: false, blanks: this.blanks, blankHTML: (i, t) => `<input class="blank" data-bi="${i}" style="width:${Math.max(3, t.s.length) + 1.6}ch" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" aria-label="空欄">` })}</p>`;
      } else {
        body += `<textarea class="full" id="dict-in" rows="3" autocomplete="off" autocapitalize="sentences" autocorrect="off" spellcheck="false" placeholder="聞こえたとおりに入力" aria-label="聞こえた英文"></textarea>`;
      }
      body += this.showJa ? `<p class="ja">日本語訳：${esc(this.s.ja)}</p>` : `<button class="btn sm flat" data-act="toggle-ja" style="align-self:flex-start">ヒント：日本語訳を見る</button>`;
    } else {
      if (this.mode === 'cloze') {
        body += `<div class="card"><p class="${enClass('big-en')}" id="dc-en">${sentHTML(this.s.en, { tokens: this.toks, hit: this.blanks })}</p><p class="ja">${esc(this.s.ja)}</p></div>`;
        body += `<div class="stack">${this.answers.map((x) => `<div class="verdict ${x.r === 'ng' ? 'ng' : 'ok'}">${ic(x.r === 'ng' ? 'x' : 'check')}${esc(this.toks[x.i].s)}<small>${x.r === 'ok' ? '正解' : x.r === 'near' ? 'つづりに注意：' + esc(x.v) : 'あなた：' + esc(x.v || '（空欄）')}</small></div>`).join('')}</div>`;
      } else {
        body += `<div class="card"><p class="${enClass('big-en')}" id="dc-en">${sentHTML(this.s.en, { tokens: this.cmp.tokens, marks: true })}</p><p class="ja">${esc(this.s.ja)}</p></div>
          <p class="heard"><b>あなた</b>${esc(this.typed || '（未入力）')}</p>${verdictHTML(this.score)}
          <p class="note">赤い下線は聞き取れなかった語です。短い語ほど弱く速く読まれます。</p>`;
      }
      if (this.learn) body += `<p class="note">次は、この文をまねして言います。</p>`;
    }
    const foot = this.done
      ? `<button class="btn big ink" data-act="next">${this.learn ? 'まねして言う' : '次へ'} ${ic('next')}</button>`
      : `<button class="btn big ink" data-act="check">答え合わせ</button>`;
    return { body, foot };
  }
  mount() {
    if (!this.played) { this.played = true; this.t = setTimeout(() => this.play(false), 300); }
    if (!this.done && finePointer()) ($('input.blank', Ov.el) || $('#dict-in'))?.focus();
    if (this.done && !this.revealPlayed) { this.revealPlayed = true; this.t = setTimeout(() => { if (Run.cur() === this) this.play(false); }, 450); }
  }
  check() {
    if (this.mode === 'cloze') {
      this.answers = [...this.blanks].map((i) => {
        const v = ($(`input[data-bi="${i}"]`, Ov.el)?.value || '').trim();
        return { i, v, r: Core.answerCheck(v, this.toks[i].s) };
      });
      this.score = this.answers.filter((x) => x.r !== 'ng').length / Math.max(1, this.answers.length);
    } else {
      this.typed = ($('#dict-in')?.value || '').trim();
      this.cmp = Core.compare(this.s.en, this.typed);
      Core.rhythm(this.cmp.tokens);
      this.score = this.cmp.score;
    }
    this.done = true;
    countItem(); commit();
    Sfx.play(this.score >= 0.99 ? 'ok' : 'ng');
    Run.score(this.score >= 0.99);
    Run.refresh(true);
  }
  act(a) {
    if (a === 'replay') { this.play(false); return true; }
    if (a === 'slow') { this.play(true); return true; }
    if (a === 'toggle-ja') { this.showJa = true; Run.refresh(); return true; }
    if (a === 'check' && !this.done) { this.check(); return true; }
    return false;
  }
  unmount() { clearTimeout(this.t); }
}

/* ---------- シャドーイング（聞いてまねる） ---------- */
class ShadowStep {
  constructor(s, o = {}) { this.s = s; this.learn = !!o.learn; this.phase = o.phase || ''; this.toks = rhythmTokens(s.en); this.reps = 0; this.turn = false; this.res = null; this.listening = false; this.label = this.learn ? 'まねして言う' : 'シャドーイング'; }
  dur() { const w = this.toks.filter((t) => t.k === 'w').length; return Math.round(((w * 0.42) / (S.settings.rate || 1) + 1.0) * 1000); }
  async cycle(slow) {
    if (this.busy) return;
    this.busy = true;
    const box = $('#sh-en');
    await Speech.say(this.s.en, { slow, onWord: karaoke(box) });
    clearKaraoke(box);
    if (Run.cur() !== this) { this.busy = false; return; }
    this.turn = true;
    const tn = $('#sh-turn');
    if (tn) { tn.classList.remove('go'); void tn.offsetWidth; tn.style.setProperty('--dur', this.dur() * (slow ? 1.35 : 1) + 'ms'); tn.classList.add('go'); tn.querySelector('.lbl').textContent = 'あなたの番：同じリズムで声に出して！'; }
    Sfx.play('go');
    await sleep(this.dur() * (slow ? 1.35 : 1));
    this.busy = false;
    if (Run.cur() !== this) return;
    this.turn = false;
    this.reps = Math.min(3, this.reps + 1);
    Run.refresh();
  }
  render() {
    let body = `<p class="q">お手本のリズムでまねしよう${this.learn ? ' <span class="chip mouth">新しい文</span>' : ''}</p>
      <div class="card"><p class="${enClass('big-en')}" id="sh-en">${sentHTML(this.s.en, { tokens: this.res ? this.res.tokens : this.toks, marks: !!this.res })}</p><p class="ja">${esc(this.s.ja)}</p>
      ${S.settings.rhythm ? '<p class="legend" style="font-size:12px;color:var(--muted)"><span><i></i>強く長く</span><span><i class="s"></i>弱く短く</span><span><em>‿</em>つなげて読む</span></p>' : ''}</div>
      <div class="turn" id="sh-turn" style="--dur:${this.dur()}ms"><div class="bar"><i></i></div><span class="lbl">▶ のあと、バーが伸びる間に同じように言います</span></div>
      <div class="dots">${[0, 1, 2].map((i) => `<i class="${i < this.reps ? 'on' : ''}"></i>`).join('')}<span>${this.reps >= 3 ? 'よくできました！' : `3回まねしよう（${this.reps}/3）`}</span></div>
      <div class="audio-row"><button class="btn ear" data-act="cycle">${ic('play')} 聞いてまねる</button><button class="btn" data-act="slow">ゆっくりで</button></div>`;
    body += `<details class="help" ${this.res || Mic.kind() !== 'none' ? 'open' : ''}><summary>発音チェック（声で判定）</summary><div class="stack" style="margin-top:10px">${speakBoxHTML(this.listening, '話した英語がここに表示されます')}</div></details>`;
    if (this.res) body += `<p class="heard"><b>判定</b>${esc(this.res.said)}</p>${verdictHTML(this.res.score)}`;
    const ready = this.reps >= 3 || this.res;
    const foot = `<button class="btn big ${ready ? 'ink' : ''}" data-act="next">${this.learn ? '覚えた！次へ' : '次へ'} ${ic('next')}</button>`;
    return { body, foot };
  }
  mount() { if (!this.started) { this.started = true; this.t = setTimeout(() => this.cycle(false), 350); } }
  onSaid(text, alts) {
    this.res = Core.compareBest(this.s.en, alts && alts.length ? alts : [text]);
    Core.rhythm(this.res.tokens);
    countItem(); commit();
    Sfx.play(this.res.score >= 0.9 ? 'ok' : 'ng');
    Run.refresh(true);
  }
  act(a) {
    if (a === 'cycle') { this.cycle(false); return true; }
    if (a === 'slow') { this.cycle(true); return true; }
    if (a === 'replay') { this.cycle(false); return true; }
    if (a === 'mic') { startMicFor(this); return true; }
    return false;
  }
  beforeNext() {
    if (this.learn) learnCard(this.s);
    if (!this.counted) { this.counted = true; Run.score(this.reps >= 1 || (this.res && this.res.score >= 0.6)); }
  }
  unmount() { clearTimeout(this.t); }
}

/* ---------- 瞬間英作文 ---------- */
class CompStep {
  constructor(s, o = {}) { this.s = s; this.review = !!o.review; this.phase = o.phase || ''; this.revealed = false; this.att = ''; this.res = null; this.ai = null; this.listening = false; this.label = this.review ? '復習' : '瞬間英作文'; }
  thinkSec() { const w = this.s.en.split(/\s+/).length; return clamp(Math.round(2 + w * 0.6), 4, 12); }
  play(slow) { const box = $('#cp-en'); return Speech.say(this.s.en, { slow, onWord: box ? karaoke(box) : null }).then(() => clearKaraoke(box)); }
  render() {
    let body = `<p class="q">英語で言ってみよう ${this.s.tag ? `<span class="chip ghost">${esc(this.s.tag)}</span>` : ''}</p><p class="prompt-ja">${esc(this.s.ja)}</p>`;
    if (!this.revealed) {
      body += `<div class="timer" style="--dur:${this.thinkSec()}s" aria-hidden="true"><i></i></div>` + speakBoxHTML(this.listening, '話した英語がここに表示されます') + `<p class="note">声に出して言ってから「答えを見る」でもOK。ゆっくりでも最後まで言い切るのがコツです。</p>`;
    } else {
      body += `<div class="card"><p class="${enClass('big-en')}" id="cp-en">${sentHTML(this.s.en, { tokens: this.res ? this.res.tokens : rhythmTokens(this.s.en), marks: !!this.res })}</p>
        <div class="row"><button class="btn sm ear" data-act="replay">${ic('play')} 聞く</button><button class="btn sm" data-act="slow">ゆっくり</button></div></div>`;
      if (this.res) body += `<p class="heard"><b>あなた</b>${esc(this.att)}</p>${verdictHTML(this.res.score)}`;
      if (this.ai) {
        body += this.ai.err ? `<p class="note">${esc(this.ai.err)}</p>` : `<div class="fb ${this.ai.ok ? 'good' : 'fix'}"><span class="fb-h">${ic(this.ai.ok ? 'check' : 'repeat')}${this.ai.ok ? 'AI判定：その言い方でも正解です' : 'AI判定：少し直しましょう'}</span>${this.ai.comment ? `<p>${esc(this.ai.comment)}</p>` : ''}${!this.ai.ok && this.ai.fixed ? `<div class="alt"><small>直すなら</small>${esc(this.ai.fixed)}</div>` : ''}</div>`;
      } else if (this.aiBusy) body += `<p class="note">AIが確認しています…</p>`;
      else if (this.res && this.res.score < 0.999 && AI.ok()) body += `<button class="btn sm" data-act="ai-judge" style="align-self:flex-start">${ic('chat')} 別の言い方でも合ってる？ AIに確認</button>`;
    }
    const foot = this.revealed ? this.gradesHTML() : `<button class="btn big ink" data-act="reveal">答えを見る</button>`;
    return { body, foot };
  }
  gradesHTML() {
    const pv = Core.srsPreview(S.cards[this.s.id], today());
    let sug = -1;
    if (this.ai && !this.ai.err) sug = this.ai.ok ? 2 : 1;
    else if (this.res) sug = this.res.score >= 0.9 ? 2 : this.res.score >= 0.6 ? 1 : 0;
    const names = ['もう一回', '難しい', 'できた', '簡単'];
    return `<div class="grades">${names.map((n, g) => `<button class="btn g${g} ${g === sug ? 'sug' : ''}" data-act="grade" data-g="${g}">${n}<small>${g === 0 ? 'あとで再出題' : '次は' + Core.fmtInterval(pv[g])}</small></button>`).join('')}</div>`;
  }
  mount() {
    if (this.revealed && !this.revealPlayed) { this.revealPlayed = true; this.t = setTimeout(() => { if (Run.cur() === this) this.play(false); }, 300); }
  }
  reveal() { Mic.stop(); this.revealed = true; Run.refresh(true); }
  onSaid(text, alts) {
    this.res = Core.compareBest(this.s.en, alts && alts.length ? alts : [text]);
    Core.rhythm(this.res.tokens);
    this.att = this.res.said;
    Sfx.play(this.res.score >= 0.9 ? 'ok' : 'ng');
    this.reveal();
  }
  async aiJudge() {
    if (this.aiBusy) return;
    this.aiBusy = true; Run.refresh();
    const prompt = `You are checking a Japanese learner's spoken English in a speaking drill.
Japanese meaning: ${this.s.ja}
Model answer: ${this.s.en}
Learner said (from speech recognition or typing, so ignore capitalization and punctuation): ${this.att}

Is the learner's sentence a correct and natural way to say the Japanese meaning? Different wording is fine if the meaning and grammar are right.
Reply with only a JSON object: {"ok": true, "comment": "one short sentence in Japanese explaining your judgment", "fixed": "the learner's sentence with minimal corrections (same as theirs if ok)"}`;
    try {
      const r = await AI.json(prompt);
      this.ai = { ok: !!(r && r.ok), comment: String((r && r.comment) || ''), fixed: String((r && r.fixed) || '') };
    } catch (e) { this.ai = { err: AI.msg(e.code) || 'AIに確認できませんでした。' }; }
    this.aiBusy = false;
    if (Run.cur() === this) Run.refresh(true);
  }
  grade(g) {
    S.cards[this.s.id] = Core.srsNext(S.cards[this.s.id], g, today());
    if (this.review) dayLog().rv++;
    countItem(); commit();
    Run.score(g >= 2);
    if (g === 0 && !this.again) { const st = new CompStep(this.s, { review: this.review, phase: this.phase }); st.again = true; Run.push(st); }
    Run.next();
  }
  act(a, el) {
    if (a === 'reveal' && !this.revealed) { this.reveal(); return true; }
    if (a === 'mic') { startMicFor(this); return true; }
    if (a === 'replay') { this.play(false); return true; }
    if (a === 'slow') { this.play(true); return true; }
    if (a === 'ai-judge') { this.aiJudge(); return true; }
    if (a === 'grade') { this.grade(+el.dataset.g); return true; }
    return false;
  }
  unmount() { clearTimeout(this.t); }
}

/* ---------- 音読チェック ---------- */
class ReadStep {
  constructor(s) { this.s = s; this.toks = rhythmTokens(s.en); this.res = null; this.tries = 0; this.listening = false; this.label = '音読チェック'; }
  play(slow) { const box = $('#rd-en'); return Speech.say(this.s.en, { slow, onWord: karaoke(box) }).then(() => clearKaraoke(box)); }
  render() {
    let body = `<p class="q">英文を声に出して読もう</p>
      <div class="card"><p class="${enClass('big-en')}" id="rd-en">${sentHTML(this.s.en, { tokens: this.res ? this.res.tokens : this.toks, marks: !!this.res })}</p><p class="ja">${esc(this.s.ja)}</p>
      <div class="row"><button class="btn sm ear" data-act="replay">${ic('play')} お手本</button><button class="btn sm" data-act="slow">ゆっくり</button></div></div>`;
    body += speakBoxHTML(this.listening, '読み上げた英語がここに表示されます');
    if (this.res) {
      const missed = this.res.tokens.filter((t) => t.k === 'w' && t.m === 'miss').map((t) => t.s);
      body += `<p class="heard"><b>判定</b>${esc(this.res.said)}</p>${verdictHTML(this.res.score, this.tries > 1 ? `（${this.tries}回目）` : '')}`;
      if (missed.length) body += `<p class="tip"><b>聞き取られなかった語 </b>${missed.map(esc).join(', ')}。お手本を聞いて、その語の音をまねしてみましょう。</p>`;
    }
    return { body, foot: `<button class="btn big ${this.res ? 'ink' : ''}" data-act="next">次へ ${ic('next')}</button>` };
  }
  onSaid(text, alts) {
    this.res = Core.compareBest(this.s.en, alts && alts.length ? alts : [text]);
    Core.rhythm(this.res.tokens);
    this.tries++;
    if (this.tries === 1) { Run.score(this.res.score >= 0.9); countItem(); commit(); }
    Sfx.play(this.res.score >= 0.9 ? 'ok' : 'ng');
    Run.refresh(true);
  }
  act(a) {
    if (a === 'replay') { this.play(false); return true; }
    if (a === 'slow') { this.play(true); return true; }
    if (a === 'mic') { startMicFor(this); return true; }
    return false;
  }
}

/* ---------- 練習の進行 ---------- */
function stampSVG(label, cls = '') {
  return `<svg class="stamp ${cls}" viewBox="0 0 120 120" role="img" aria-label="完了スタンプ ${esc(label)}">
    <g filter="url(#ink)" fill="none" stroke="currentColor"><circle cx="60" cy="60" r="53" stroke-width="5.5"/><path d="M9 45h102M9 75h102" stroke-width="3.5"/></g>
    <g filter="url(#ink)" fill="currentColor" text-anchor="middle"><text x="60" y="36" font-size="16" font-family="Dela Gothic One, sans-serif">英語回路</text><text x="60" y="68" font-size="21" font-weight="700" font-family="Lexend, sans-serif">${esc(label)}</text><text x="60" y="101" font-size="21" font-family="Dela Gothic One, sans-serif">完了</text></g></svg>`;
}
function miniStamp(rot) {
  return `<svg viewBox="0 0 40 40" aria-hidden="true" style="transform:rotate(${rot}deg)"><g filter="url(#ink-s)"><circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-width="2.6"/><text x="20" y="21" text-anchor="middle" dominant-baseline="central" font-size="15" fill="currentColor" font-family="Dela Gothic One, sans-serif">済</text></g></svg>`;
}
function fmtDur(sec) { return sec < 60 ? sec + '秒' : fmtMin(sec); }

const Run = {
  steps: [], i: 0, title: '', kind: '', ok: 0, n: 0, t0: 0, finished: false, again: null,
  start(o) {
    if (!o.steps || !o.steps.length) { toast(o.empty || '練習できる文がまだありません'); return; }
    Speech.stop();
    Object.assign(this, { steps: o.steps, i: 0, title: o.title, kind: o.kind || 'drill', ok: 0, n: 0, t0: Date.now(), finished: false, again: o.again || null });
    Ov.open('run');
    this.show();
  },
  cur() { return this.finished ? null : this.steps[this.i] || null; },
  push(st) { this.steps.push(st); },
  score(good) { this.n++; if (good) this.ok++; },
  header() {
    const st = this.cur(), total = this.steps.length;
    const pct = this.finished ? 100 : Math.round((this.i / total) * 100);
    const sub = st ? (st.phase ? PHASE[st.phase] + '：' + st.label : st.label !== this.title ? st.label : '') : '完了';
    return `<header class="run-top"><button class="iconbtn" data-act="run-close" aria-label="練習を終える">${ic('close')}</button><div class="run-title"><b>${esc(this.title)}</b><span>${esc(sub)}</span></div><span class="run-count">${this.finished ? total : this.i + 1}/${total}</span></header><div class="run-bar" aria-hidden="true"><i style="width:${pct}%"></i></div>`;
  },
  show() {
    const st = this.cur();
    if (!st) { this.finish(); return; }
    const r = st.render();
    Ov.el.innerHTML = `<div class="ov-wrap">${this.header()}<div class="run-scroll" id="run-scroll"><div class="run-body">${r.body}</div></div><div class="run-foot">${r.foot || ''}</div></div>`;
    st.mount?.();
  },
  refresh(toEnd) {
    const st = this.cur(); if (!st) return;
    const r = st.render();
    const sc = $('#run-scroll'), body = $('.run-body', Ov.el), foot = $('.run-foot', Ov.el);
    const top = sc ? sc.scrollTop : 0;
    if (body) body.innerHTML = r.body;
    if (foot) foot.innerHTML = r.foot || '';
    if (sc) sc.scrollTop = toEnd ? sc.scrollHeight : top;
    st.mount?.();
  },
  next() {
    const st = this.cur();
    if (st) { st.beforeNext?.(); st.unmount?.(); }
    Speech.stop(); Mic.stop();
    const nx = this.steps[this.i + 1];
    if (st && st.phase === 'warm' && (!nx || nx.phase !== 'warm')) { dayLog().w = 1; commit(); }
    this.i++;
    if (this.i >= this.steps.length) this.finish(); else this.show();
  },
  finish() {
    this.finished = true;
    Speech.stop(); Mic.stop();
    const secs = Math.max(1, Math.round((Date.now() - this.t0) / 1000));
    const daily = this.kind === 'daily';
    if (daily) { dayLog().done = 1; }
    commit();
    const d = new Date();
    const stk = Core.streak(S.days, today());
    const body = `<div class="run-body finish">
      ${daily ? stampSVG(`${d.getMonth() + 1}.${d.getDate()}`, 'big slam') : ''}
