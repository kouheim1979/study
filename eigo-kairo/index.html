      <p class="note">${daily ? '今日覚えた文は明日の復習に出てきます。忘れかけたころに思い出すのが、いちばん記憶に残ります。' : 'できなかった文は、明日以降の復習でまた出てきます。'}</p>
    </div>`;
    let foot = '';
    if (daily) foot = `${AI.ok() ? `<button class="btn big mouth" data-act="go-ai">${ic('chat')} 仕上げにAIと会話する</button>` : ''}<button class="btn big ${AI.ok() ? '' : 'ink'}" data-act="run-done">ホームに戻る</button>`;
    else foot = `${this.again ? `<button class="btn big ink" data-act="run-again">${ic('repeat')} もう一度</button>` : ''}<button class="btn big" data-act="run-done">戻る</button>`;
    Ov.el.innerHTML = `<div class="ov-wrap">${this.header()}<div class="run-scroll">${body}</div><div class="run-foot">${foot}</div></div>`;
    if (daily) setTimeout(() => Sfx.play('stamp'), 260);
  },
  async close() {
    if (this.finished) { Ov.close(); return; }
    const ok = await ask('練習を終えますか？', 'ここまでの結果は保存されています。', '終える', '続ける');
    if (ok && Ov.mode === 'run') { this.cur()?.unmount?.(); this.finished = true; Ov.close(); }
  },
  act(a, el, ev) {
    if (a === 'run-close') { this.close(); return true; }
    if (a === 'run-done') { Ov.close(); return true; }
    if (a === 'run-again' && this.again) { const o = this.again(); Ov.close(); this.start(o); return true; }
    if (a === 'go-ai') { Ov.close(); setTab('ai'); return true; }
    const st = this.cur();
    if (st && st.act && st.act(a, el, ev)) return true;
    if (a === 'next') { this.next(); return true; }
    return false;
  },
};

/* ---------- メニューの組み立て ---------- */
function weightedPick(items) {
  const tot = items.reduce((a, x) => a + x.w, 0);
  let r = Math.random() * tot;
  for (const x of items) { r -= x.w; if (r <= 0) return x.c; }
  return items[items.length - 1].c;
}
function mpSteps(n, key, phase) {
  const pool = key ? MP.filter((c) => c.k === key) : MP;
  const weights = pool.map((c) => { const st = S.mp[c.k]; const acc = st && st.n ? st.ok / st.n : 0.5; return { c, w: 0.15 + (1 - acc) + (!st || st.n < 5 ? 0.6 : 0) }; });
  const out = [];
  let last = '';
  for (let i = 0; i < n; i++) {
    const c = weightedPick(weights);
    let pair = pickOne(c.pairs);
    if (pair.join() === last && c.pairs.length > 1) pair = pickOne(c.pairs.filter((p) => p.join() !== last));
    last = pair.join();
    out.push(new MPStep(c, pair, phase));
  }
  return out;
}
function csSteps(n, rule, phase) {
  const pool = (rule ? CS.filter((x) => x.r === rule) : CS).map((it) => ({ it, n: (S.cs[csKey(it)] || {}).n || 0, ng: ((S.cs[csKey(it)] || {}).n || 0) - ((S.cs[csKey(it)] || {}).ok || 0) }));
  const sorted = shuffle(pool).sort((a, b) => (a.n - a.ng * 2) - (b.n - b.ng * 2));
  return sorted.slice(0, n).map((x) => new CSStep(x.it, phase));
}
function learnSteps(sents) {
  const out = [];
  sents.forEach((s) => { out.push(new DictStep(s, 'cloze', { learn: true, phase: 'new' })); out.push(new ShadowStep(s, { learn: true, phase: 'new' })); });
  return out;
}
function practicePool(lv) {
  const learned = learnedSentences();
  const pool = levelPool(lv);
  return learned.length >= 6 ? shuffle(learned.concat(pool.slice(0, 20))) : shuffle(pool);
}
function dailySteps() {
  const L = dayLog();
  const steps = [];
  if (!L.w) steps.push(...mpSteps(6, null, 'warm'), ...csSteps(2, null, 'warm'));
  dueList().slice(0, REV_CAP).forEach((s) => steps.push(new CompStep(s, { review: true, phase: 'rev' })));
  steps.push(...learnSteps(freshSentences(Math.max(0, S.settings.newPer - L.nw))));
  return steps;
}
function startDaily() {
  const steps = dailySteps();
  if (!steps.length) {
    Run.start({ title: 'おかわり練習', kind: 'drill', steps: learnSteps(freshSentences(3)), empty: 'このレベルの文はすべて学習しました。設定でレベルを上げてみましょう。' });
    return;
  }
  Run.start({ title: '今日のトレーニング', kind: 'daily', steps });
}

function addPhrase(en, ja) {
  const id = 'c' + Date.now().toString(36) + rnd(1296).toString(36);
  S.custom.push({ id, en: en.trim(), ja: ja.trim(), at: Date.now() });
  S.cards[id] = { i: 0, e: 2.5, r: 0, l: 0, d: today(), t: Date.now() };
  commit();
  return id;
}
async function pfAI() {
  if (!PF.ja.trim()) { toast('先に日本語を入力してください'); return; }
  PF.busy = true; Sheet.refresh();
  const lvWord = { 1: 'beginner', 2: 'elementary', 3: 'intermediate', 4: 'upper-intermediate' }[S.settings.level];
  const prompt = `Translate the Japanese below into natural spoken English that a ${lvWord} learner can actually say in conversation. Prefer short, common wording.
Japanese: ${PF.ja}
Reply with only a JSON object: {"en": "the English sentence", "note": "one short tip in Japanese about when or how to use it, or an empty string"}`;
  try {
    const r = await AI.json(prompt);
    PF.en = String((r && r.en) || '').trim();
    PF.note = String((r && r.note) || '').trim();
  } catch (e) { toast(AI.msg(e.code) || '英語にできませんでした'); }
  PF.busy = false;
  if (Sheet.mode === 'phrase') Sheet.refresh();
}

/* ---------- AI英会話 ---------- */
const sameText = (a, b) => Core.normWords(a).words.join(' ') === Core.normWords(b).words.join(' ');
const LV_PROMPT = {
  1: 'beginner (CEFR A1): use very short, simple sentences (under 8 words) and only basic words',
  2: 'elementary (CEFR A2): use short sentences (under 12 words) and everyday words',
  3: 'intermediate (CEFR B1): use natural sentences, one or two per reply',
  4: 'upper-intermediate (CEFR B2): use natural, fluent speech with some common idioms, one to three sentences per reply',
};
const Chat = {
  scene: null, msgs: [], seq: 0, busy: false, ctl: null, cap: true, hintsOpen: false, hints: [], turns: 0, summary: false, draft: '',
  open(id) {
    if (!AI.ok()) { toast('AI英会話はClaudeの中で開いているときに使えます'); return; }
    const sc = SCENES.find((x) => x.id === id);
    if (!sc) return;
    Object.assign(this, { scene: sc, msgs: [], seq: 0, busy: false, ctl: null, cap: !!S.settings.aiCap, hintsOpen: false, hints: [], turns: 0, summary: false, draft: '' });
    this.msgs.push({ id: ++this.seq, role: 'ai', en: sc.open, ja: SCENE_JA[sc.id] || '' });
    Speech.stop();
    Ov.open('chat');
    this.render();
    this.say(this.msgs[0]);
  },
  render() {
    Ov.el.innerHTML = `<div class="ov-wrap">
      <header class="run-top"><button class="iconbtn" data-act="chat-close" aria-label="会話を終える">${ic('close')}</button>
        <div class="run-title"><b>${esc(this.scene.name)}</b><span>${esc(this.scene.goal)}</span></div>
        <span class="chip">${LV[S.settings.level]}</span>
        <button class="iconbtn" data-act="chat-cap" aria-pressed="${!this.cap}" aria-label="${this.cap ? 'AIの字幕を隠す' : 'AIの字幕を表示'}">${ic(this.cap ? 'eye' : 'eyeoff')}</button>
      </header>
      <div class="run-scroll" id="chat-scroll"><div class="run-body"><div class="chat" id="chat-list">${this.listHTML()}</div></div></div>
      <div class="run-foot" id="chat-foot">${this.footHTML()}</div></div>`;
    this.scrollEnd();
  },
  listHTML() {
    let h = `<p class="sys">${this.cap ? '' : '字幕オフ：まず耳だけで聞き取ってみましょう。'}</p>`;
    for (const m of this.msgs) {
      if (m.role === 'ai') {
        const hidden = !this.cap && !m.show;
        h += `<div class="msg ai">${hidden ? `<button class="bubble hidden-cap" data-act="chat-show" data-id="${m.id}">${ic('eye')} 字幕を見る</button>` : `<div class="bubble">${esc(m.en)}${m.showJa && m.ja ? `<span class="tr">${esc(m.ja)}</span>` : ''}</div>`}
          <div class="msg-tools"><button data-act="chat-say" data-id="${m.id}">${ic('play')} 聞く</button>${m.ja && !hidden ? `<button data-act="chat-ja" data-id="${m.id}">${m.showJa ? '訳を隠す' : '訳'}</button>` : ''}</div></div>`;
      } else {
        h += `<div class="msg me"><div class="bubble ${hasJa(m.text) ? 'ja-msg' : ''}">${esc(m.text)}</div>${this.fbHTML(m)}</div>`;
      }
    }
    if (this.busy) h += '<div class="msg ai"><div class="bubble typing" role="status" aria-label="返事を考えています"><i></i><i></i><i></i></div></div>';
    return h;
  },
  fbHTML(m) {
    if (m.err) return `<div class="sys">${esc(m.err)}${AI.ok() ? `<button class="btn sm" data-act="chat-retry" data-id="${m.id}">${ic('repeat')} もう一度送る</button>` : ''}</div>`;
    const f = m.fb;
    if (!f) return '';
    const tools = `<div class="msg-tools"><button data-act="chat-say-fix" data-id="${m.id}">${ic('play')} 聞く</button><button data-act="chat-add" data-id="${m.id}" ${m.added ? 'disabled' : ''}>${ic('plus')} ${m.added ? '追加しました' : 'マイフレーズへ'}</button></div>`;
    const showNat = f.natural && !sameText(f.natural, m.text);
    if (f.ok && !hasJa(m.text)) {
      return `<div class="fb good"><span class="fb-h">${ic('check')}通じます</span>${showNat ? `<div class="alt"><small>こんな言い方もできます</small>${esc(f.natural)}</div>` : ''}${f.point ? `<p>${esc(f.point)}</p>` : ''}${showNat ? tools : ''}</div>`;
    }
    const showCor = f.corrected && !sameText(f.corrected, m.text) && !(f.natural && sameText(f.corrected, f.natural));
    return `<div class="fb fix"><span class="fb-h">${ic('repeat')}${hasJa(m.text) ? '英語ではこう言います' : 'こう言うともっと伝わります'}</span>${showCor ? `<div class="alt"><small>直すなら</small>${esc(f.corrected)}</div>` : ''}${f.natural ? `<div class="alt"><small>自然な言い方</small>${esc(f.natural)}</div>` : ''}${f.point ? `<p>${esc(f.point)}</p>` : ''}${f.natural || f.corrected ? tools : ''}</div>`;
  },
  footHTML() {
    if (this.summary) return '';
    const k = Mic.kind();
    const hints = this.hintsOpen && this.hints.length ? `<div class="hints">${this.hints.map((x, i) => `<button data-act="chat-hint" data-i="${i}">${esc(x.en)}${x.ja ? `<small>${esc(x.ja)}</small>` : ''}</button>`).join('')}</div>` : '';
    return `${hints}<div class="composer">
      <button class="btn" data-act="chat-hints" aria-label="返事のヒント" aria-expanded="${this.hintsOpen}" ${this.hints.length ? '' : 'disabled'}>${ic('bulb')}</button>
      <textarea id="chat-in" rows="1" placeholder="英語で返事" autocomplete="off" autocapitalize="sentences" autocorrect="off" spellcheck="false" aria-label="返事を入力">${esc(this.draft)}</textarea>
      ${k !== 'none' ? `<button class="btn mouth ${Mic.active ? 'on mic' : ''}" data-act="chat-mic" id="mic-btn" aria-label="話して返事する">${ic('mic')}</button>` : ''}
      <button class="btn ink" data-act="chat-send" aria-label="送る" ${this.busy ? 'disabled' : ''}>${ic('send')}</button>
    </div>${k === 'none' ? `<p class="hint">${ic('info')}<span>キーボードを英語にして、キーボードのマイクで話せます。</span></p>` : ''}`;
  },
  paintList() { const l = $('#chat-list'); if (l) l.innerHTML = this.listHTML(); this.scrollEnd(); },
  paintFoot() { const f = $('#chat-foot'); if (f) f.innerHTML = this.footHTML(); },
  scrollEnd() { const sc = $('#chat-scroll'); if (sc) sc.scrollTop = sc.scrollHeight; },
  say(m) { return Speech.say(m.en); },
  prompt() {
    const sc = this.scene;
    const hist = this.msgs.filter((m) => !m.err).slice(-16).map((m) => (m.role === 'ai' ? 'Partner: ' + m.en : 'Learner: ' + m.text)).join('\n');
    return `You are the conversation partner in an English speaking practice app for a Japanese learner.
Role: you are ${sc.role}. Stay in character.
The learner wants to practice: ${sc.aim}.
Learner level: ${LV_PROMPT[S.settings.level]}.

Write your next spoken line as the partner:
- Natural spoken English that fits the learner's level. Keep it short so it is easy to catch by ear.
- Keep the conversation going, usually with one simple question.
- If the learner wrote in Japanese, they did not know how to say it in English. Treat it as if they had said it in English and continue.

Also review the learner's LAST message:
- "ok": true if it is understandable and grammatically correct (small differences in style are fine).
- "corrected": the learner's message with minimal grammar fixes (if they wrote Japanese, the English for it).
- "natural": how a native speaker would naturally say the same thing in this situation.
- "natural_ja": a Japanese translation of "natural".
- "point": one or two short sentences in Japanese with the most useful fix or tip. Use "" if there is nothing to add.

Conversation so far:
${hist}

Reply with only a JSON object in this shape:
{"reply": "your next line", "reply_ja": "Japanese translation of your line", "feedback": {"ok": true, "corrected": "...", "natural": "...", "natural_ja": "...", "point": "..."}, "hints": [{"en": "a possible next line for the learner", "ja": "its Japanese"}, {"en": "...", "ja": "..."}]}`;
  },
  send(text) {
    text = String(text ?? ($('#chat-in')?.value || '')).trim();
    if (!text || this.busy) return;
    this.draft = '';
    const me = { id: ++this.seq, role: 'me', text, fb: null, err: '' };
    this.msgs.push(me);
    this.request(me);
  },
  async request(me) {
    this.busy = true; this.hintsOpen = false; me.err = '';
    this.paintList(); this.paintFoot();
    Speech.stop();
    const ctl = (this.ctl = new AbortController());
    try {
      const r = await AI.json(this.prompt(), { signal: ctl.signal });
      if (ctl !== this.ctl || Ov.mode !== 'chat') return;
      const s = (v) => (typeof v === 'string' ? v.trim() : '');
      const f = (r && r.feedback) || {};
      me.fb = { ok: !!f.ok, corrected: s(f.corrected), natural: s(f.natural), naturalJa: s(f.natural_ja), point: s(f.point) };
      const ai = { id: ++this.seq, role: 'ai', en: s(r && r.reply) || 'Sorry, could you say that again?', ja: s(r && r.reply_ja) };
      this.msgs.push(ai);
      this.hints = (Array.isArray(r && r.hints) ? r.hints : []).map((h) => (typeof h === 'string' ? { en: h.trim(), ja: '' } : { en: s(h && h.en), ja: s(h && h.ja) })).filter((h) => h.en).slice(0, 3);
      this.turns++;
      countItem(); commit();
      this.busy = false;
      this.paintList(); this.paintFoot();
      if (S.settings.aiSpeak) this.say(ai);
    } catch (e) {
      if (ctl !== this.ctl) return;
      this.busy = false;
      if (!(e && e.code === 'cancelled')) me.err = AI.msg(e && e.code) || 'うまく返事が返ってきませんでした。';
      if (Ov.mode === 'chat' && !this.summary) { this.paintList(); this.paintFoot(); }
    }
  },
  mic() {
    const ok = Mic.start({
      onState: (st) => paintMic(st !== 'idle'),
      onText: (fin, part) => { const t = $('#chat-in'); if (t) t.value = (fin + ' ' + part).trim(); },
      onDone: (text) => { paintMic(false); if (text && Ov.mode === 'chat' && !this.summary) this.send(text); },
    });
    if (!ok) toast('この画面ではマイクが使えません。キーボードの音声入力を使ってください。');
  },
  fixes() { return this.msgs.filter((m) => m.role === 'me' && m.fb && (m.fb.natural || m.fb.corrected) && (!m.fb.ok || hasJa(m.text) || (m.fb.natural && !sameText(m.fb.natural, m.text)))); },
  addFrom(m) {
    if (!m || m.added || !m.fb) return;
    const en = m.fb.natural || m.fb.corrected;
    if (!en) return;
    const ja = m.fb.naturalJa || (hasJa(m.text) ? m.text : `「${m.text}」を自然な英語で`);
    addPhrase(en, ja);
    m.added = true;
  },
  showSummary() {
    this.summary = true;
    this.ctl?.abort();
    Speech.stop(); Mic.stop();
    const items = this.fixes();
    const body = `<div class="run-body"><h2 class="section-title">会話のふりかえり</h2>
      <p class="note">${this.turns}往復話しました。${items.length ? '言い直しをマイフレーズに入れておくと、復習で言えるようになります。' : '直すところはありませんでした。すばらしい！'}</p>
      ${items.map((m) => `<div class="card flat"><p class="heard"><b>あなた</b>${esc(m.text)}</p><p class="en mid-en">${esc(m.fb.natural || m.fb.corrected)}</p>${m.fb.point ? `<p class="small">${esc(m.fb.point)}</p>` : ''}<div class="msg-tools"><button data-act="chat-say-fix" data-id="${m.id}">${ic('play')} 聞く</button><button data-act="chat-add" data-id="${m.id}" ${m.added ? 'disabled' : ''}>${ic('plus')} ${m.added ? '追加しました' : 'マイフレーズへ'}</button></div></div>`).join('')}</div>`;
    const foot = `${items.some((m) => !m.added) ? `<button class="btn big mouth" data-act="chat-add-all">${ic('plus')} すべてマイフレーズに追加</button>` : ''}<button class="btn big" data-act="chat-done">閉じる</button>`;
    Ov.el.innerHTML = `<div class="ov-wrap"><header class="run-top"><button class="iconbtn" data-act="chat-done" aria-label="閉じる">${ic('close')}</button><div class="run-title"><b>${esc(this.scene.name)}</b><span>ふりかえり</span></div></header><div class="run-scroll">${body}</div><div class="run-foot">${foot}</div></div>`;
  },
  byId(id) { return this.msgs.find((m) => m.id === +id); },
  act(a, el) {
    switch (a) {
      case 'chat-close':
        if (this.turns > 0 && !this.summary) this.showSummary(); else { this.ctl?.abort(); Ov.close(); }
        return true;
      case 'chat-done': this.ctl?.abort(); Ov.close(); return true;
      case 'chat-send': this.send(); return true;
      case 'chat-mic': this.mic(); return true;
      case 'chat-retry': { const m = this.byId(el.dataset.id); if (m && !this.busy) this.request(m); return true; }
      case 'chat-say': { const m = this.byId(el.dataset.id); if (m) this.say(m); return true; }
      case 'chat-say-fix': { const m = this.byId(el.dataset.id); if (m && m.fb) Speech.say(m.fb.natural || m.fb.corrected); return true; }
      case 'chat-ja': { const m = this.byId(el.dataset.id); if (m) { m.showJa = !m.showJa; this.paintList(); } return true; }
      case 'chat-show': { const m = this.byId(el.dataset.id); if (m) { m.show = true; this.paintList(); } return true; }
      case 'chat-cap': this.cap = !this.cap; S.settings.aiCap = this.cap ? 1 : 0; commit(); this.render(); return true;
      case 'chat-hints': this.hintsOpen = !this.hintsOpen; this.paintFoot(); return true;
      case 'chat-hint': { const h = this.hints[+el.dataset.i]; if (h) { this.draft = h.en; this.hintsOpen = false; this.paintFoot(); const t = $('#chat-in'); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } } return true; }
      case 'chat-add': { const m = this.byId(el.dataset.id); this.addFrom(m); toast('マイフレーズに追加しました'); if (this.summary) this.showSummary(); else this.paintList(); return true; }
      case 'chat-add-all': { const items = this.fixes(); items.forEach((m) => this.addFrom(m)); toast(`${items.length}文をマイフレーズに追加しました`); this.showSummary(); return true; }
    }
    return false;
  },
};

/* ---------- 聞き流し（ハンズフリー） ---------- */
const HF_PHASES = [['ja', '日本語'], ['think', '考える'], ['en1', '英語'], ['rep', 'まねる'], ['en2', '英語']];
const HF = {
  list: [], i: 0, playing: false, tok: 0, phase: '',
  open(src) {
    let list = src === 'learned' ? learnedSentences() : levelPool();
    if (src === 'learned' && list.length < 3) { list = levelPool(); toast('覚えた文がまだ少ないので、レベルの文を流します'); }
    this.list = shuffle(list); this.i = 0; this.playing = false; this.phase = '';
    Speech.stop();
    Ov.open('hf');
    this.render();
  },
  render() {
    const s = this.list[this.i];
    const hideEn = S.settings.hfHide && (this.phase === 'ja' || this.phase === 'think' || this.phase === '');
    const cue = { ja: '日本語を聞いて…', think: '英語で言ってみよう', en1: 'お手本を聞こう', rep: '同じように声に出して', en2: 'もう一度お手本' }[this.phase] || '▶ で再生。画面を見なくても練習できます';
    Ov.el.innerHTML = `<div class="ov-wrap">
      <header class="run-top"><button class="iconbtn" data-act="hf-close" aria-label="聞き流しを終える">${ic('close')}</button><div class="run-title"><b>聞き流し</b><span>${this.i + 1} / ${this.list.length}文</span></div></header>
      <div class="run-scroll"><div class="run-body" style="justify-content:center">
        <div class="phases" aria-hidden="true">${HF_PHASES.map(([k, n]) => `<span class="${this.phase === k ? 'on' : ''}">${n}</span>`).join('')}</div>
        <div class="card" style="min-height:230px;justify-content:center;gap:14px">
          <p class="prompt-ja">${esc(s.ja)}</p>
          <p class="${enClass('big-en')}" id="hf-en" style="${hideEn ? 'visibility:hidden' : ''}">${sentHTML(s.en)}</p>
        </div>
        <p class="q" style="justify-content:center" role="status">${cue}</p>
      </div></div>
      <div class="run-foot">
        <div class="row" style="justify-content:center;gap:18px"><button class="iconbtn" data-act="hf-prev" aria-label="前の文">${ic('prev')}</button><button class="btn round ${this.playing ? 'ink' : 'ear'}" data-act="hf-toggle" aria-label="${this.playing ? '一時停止' : '再生'}">${ic(this.playing ? 'pause' : 'play')}</button><button class="iconbtn" data-act="hf-next" aria-label="次の文">${ic('skip')}</button></div>
        ${toggleRow('hfHide', '英文はお手本のあとに表示')}
      </div></div>`;
  },
  gap(s) { const w = s.en.split(/\s+/).length; return clamp(1100 + (w * 420) / (S.settings.rate || 1), 1800, 7000); },
  async loop(my) {
    const alive = () => this.playing && my === this.tok && Ov.mode === 'hf';
    const set = (p) => { this.phase = p; this.render(); };
    while (alive()) {
      const s = this.list[this.i];
      set('ja');
      if (S.settings.hfJa && (Voices.ja || !Voices.loaded) && window.speechSynthesis) await Speech.say(s.ja, { lang: 'ja' }); else await sleep(1600);
      if (!alive()) return;
      set('think'); await sleep(this.gap(s)); if (!alive()) return;
      set('en1'); await Speech.say(s.en, { onWord: karaoke($('#hf-en')) }); if (!alive()) return;
      set('rep'); await sleep(this.gap(s)); if (!alive()) return;
      set('en2'); await Speech.say(s.en, { onWord: karaoke($('#hf-en')) }); if (!alive()) return;
      await sleep(900); if (!alive()) return;
      this.i = (this.i + 1) % this.list.length;
      countItem();
    }
  },
  play() { this.playing = true; const my = ++this.tok; Wake.on(); this.render(); this.loop(my); },
  pause() { this.playing = false; this.tok++; Speech.stop(); this.phase = ''; this.render(); },
  skip(d) { const was = this.playing; this.pause(); this.i = (this.i + d + this.list.length) % this.list.length; this.render(); if (was) this.play(); },
  act(a) {
    if (a === 'hf-close') { this.playing = false; this.tok++; Ov.close(); return true; }
    if (a === 'hf-toggle') { if (this.playing) this.pause(); else this.play(); return true; }
    if (a === 'hf-next') { this.skip(1); return true; }
    if (a === 'hf-prev') { this.skip(-1); return true; }
    return false;
  },
};

/* ---------- 操作 ---------- */
function drill(title, make, empty) {
  const o = () => ({ title, steps: make(), again: o, empty });
  Run.start(o());
}
function compSource(src) {
  if (src === 'due') return dueList().slice(0, REV_CAP).map((s) => new CompStep(s, { review: true }));
  if (src === 'mine') return shuffle(S.custom.map(customAsSent)).slice(0, 10).map((s) => new CompStep(s, { review: true }));
  return practicePool(S.settings.level).slice(0, 10).map((s) => new CompStep(s));
}
function sayHome(el, slow) {
  const s = sentById(el.dataset.id); if (!s) return;
  const box = $('#sod-en');
  Speech.say(s.en, { slow, onWord: karaoke(box) }).then(() => clearKaraoke(box));
}
const ACT = {
  tab: (el) => setTab(el.dataset.tab),
  settings: () => Sheet.open('settings', settingsHTML),
  'sheet-close': () => Sheet.close(),
  set: (el) => {
    const k = el.dataset.k;
    let v = el.dataset.v;
    if (['level', 'goal', 'newPer'].includes(k)) v = +v;
    S.settings[k] = v;
    commit();
    if (Sheet.mode) Sheet.refresh();
    if (!Ov.mode) render();
  },
  toggle: (el) => {
    const k = el.dataset.k;
    S.settings[k] = S.settings[k] ? 0 : 1;
    commit();
    if (Sheet.mode) Sheet.refresh();
    if (Ov.mode === 'hf') HF.render(); else if (!Ov.mode) render();
  },
  'voice-test': () => Speech.say("Hi! This is how I sound. Let's practice English together."),
  'sod-play': (el) => sayHome(el, false),
  'sod-slow': (el) => sayHome(el, true),
  'sod-shadow': (el) => { const s = sentById(el.dataset.id); if (s) Run.start({ title: '今日の一文', steps: [new ShadowStep(s)] }); },
  daily: () => startDaily(),
  'mp-start': (el) => { const k = el.dataset.k || null; drill('音の聞き分け', () => mpSteps(10, k)); },
  'cs-start': (el) => { const r = el.dataset.r || null; drill('音の変化', () => csSteps(8, r)); },
  'dict-start': () => drill('ディクテーション', () => practicePool(S.settings.level).slice(0, 10).map((s) => new DictStep(s, S.settings.dictMode))),
  'hf-start': (el) => HF.open(el.dataset.src),
  'comp-start': (el) => { const src = el.dataset.src; drill('瞬間英作文', () => compSource(src), src === 'due' ? '今日の復習はすべて終わりました' : undefined); },
  'shadow-start': () => drill('シャドーイング', () => practicePool(S.settings.level).slice(0, 5).map((s) => new ShadowStep(s))),
  'read-start': () => drill('音読チェック', () => practicePool(S.settings.level).slice(0, 5).map((s) => new ReadStep(s))),
  'chat-open': (el) => Chat.open(el.dataset.id),
  'phrase-add': () => { Object.assign(PF, { ja: '', en: '', note: '', busy: false }); Sheet.open('phrase', phraseHTML); },
  'pf-ai': () => pfAI(),
  'pf-save': () => {
    if (!PF.en.trim() || !PF.ja.trim()) { toast('日本語と英語の両方を入れてください'); return; }
    addPhrase(PF.en, PF.ja);
    Sheet.close(); toast('マイフレーズに追加しました。今日の復習に出てきます。', 3200);
    if (!Ov.mode) render();
  },
  library: (el) => { libLv = +el.dataset.lv; Sheet.open('library', libraryHTML); },
  'lib-lv': (el) => { libLv = +el.dataset.v; Sheet.refresh(); const p = $('#sheet-panel'); if (p) p.scrollTop = 0; },
  'lib-play': (el) => { const s = sentById(el.dataset.id); if (s) Speech.say(s.en); },
  'lib-learn': (el) => { const s = sentById(el.dataset.id); if (!s) return; Sheet.close(); Run.start({ title: '例文を練習', steps: learnSteps([s]) }); },
  'phrase-del': async (el) => {
    const id = el.dataset.id;
    const p = S.custom.find((x) => x.id === id);
    if (!p || !(await ask('このフレーズを削除しますか？', p.en, '削除', 'やめる'))) return;
    S.custom = S.custom.filter((x) => x.id !== id);
    delete S.cards[id];
    S.del[id] = Date.now();
    commit(); Sheet.refresh();
    if (!Ov.mode) render();
  },
  cal: (el) => {
    let { y, m } = calMonth; m += +el.dataset.d;
    if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
    calMonth = { y, m }; render();
  },
  backup: () => {
    const json = JSON.stringify(S);
    const fallback = () => Sheet.open('backup', () => `<div class="sheet-head"><h2>バックアップ</h2><button class="iconbtn" data-act="sheet-close" aria-label="閉じる">${ic('close')}</button></div><p class="note">下の文字列をすべて選んでコピーし、メモなどに保管してください。</p><textarea class="full" rows="8" readonly>${esc(json)}</textarea>`);
    try {
      navigator.clipboard.writeText(json).then(() => toast('コピーしました。メモ帳などに貼り付けて保管してください。', 3600), fallback);
    } catch { fallback(); }
  },
  restore: () => Sheet.open('restore', () => `<div class="sheet-head"><h2>バックアップから戻す</h2><button class="iconbtn" data-act="sheet-close" aria-label="閉じる">${ic('close')}</button></div><p class="note">「バックアップをコピー」で保管した文字列を貼り付けてください。いまの記録は置きかわります。</p><textarea class="full" id="restore-in" rows="7" aria-label="バックアップの文字列"></textarea><button class="btn big ink" data-act="restore-do">この内容で戻す</button>`),
  'restore-do': async () => {
    let o = null;
    try { o = JSON.parse(($('#restore-in')?.value || '').trim()); } catch { o = null; }
    if (!o || typeof o !== 'object' || !o.settings || !o.cards) { toast('バックアップの文字列として読み取れませんでした'); return; }
    if (!(await ask('この内容で記録を置きかえますか？', 'いまの記録は上書きされます。', '置きかえる', 'やめる'))) return;
    S = normalizeState(o); S.onb = 1; commit(); saveLocal();
    Sheet.close(); render(); toast('記録を戻しました');
  },
  reset: async () => {
    if (!(await ask('記録をすべて消しますか？', '覚えた文、ハンコ、マイフレーズが消えます。元には戻せません。', '消す', 'やめる'))) return;
    const keep = S.settings;
    S = defaults(); S.settings = keep; S.onb = 1; S.resetAt = Date.now();
    commit(); saveLocal(); render(); toast('記録を消しました');
  },
  'onb-done': () => { S.onb = 1; commit(); Sheet.close(); render(); },
};

/* ---------- イベント ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const a = el.dataset.act;
  if (Ov.mode && Ov.el.contains(el)) {
    if (Ov.mode === 'run' && Run.act(a, el, e)) return;
    if (Ov.mode === 'chat' && Chat.act(a, el, e)) return;
    if (Ov.mode === 'hf' && HF.act(a, el, e)) return;
  }
  const h = ACT[a];
  if (h) h(el, e);
});
document.addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target;
  if (f.dataset.form === 'say') {
    const inp = $('#say-in', f);
    const v = (inp && inp.value || '').trim();
    if (!v) { toast('話した英語を入力してください'); return; }
    if (Mic.active) Mic.stop();
    const st = Run.cur();
    if (st && st.onSaid) st.onSaid(v, [v]);
  }
});
const isTyping = (t) => t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
document.addEventListener('keydown', (e) => {
  const t = e.target;
  if (e.key === 'Escape' && Sheet.mode && Sheet.mode !== 'onboard') { e.preventDefault(); Sheet.close(); return; }
  if (e.isComposing || e.keyCode === 229) return;
  if (e.key === 'Enter' && t.matches && t.matches('input.blank')) {
    e.preventDefault();
    const blanks = $$('input.blank', Ov.el);
    const i = blanks.indexOf(t);
    if (i >= 0 && i < blanks.length - 1) blanks[i + 1].focus(); else Run.act('check');
    return;
  }
  if (e.key === 'Enter' && t.id === 'chat-in' && !e.shiftKey) { e.preventDefault(); Chat.send(); return; }
  if (Ov.mode === 'run' && !isTyping(t) && !Sheet.mode && !document.querySelector('.dlg-wrap')) {
    if (e.key === ' ') { e.preventDefault(); Run.act('replay'); }
    else if (e.key === 'Enter' && !(t.tagName === 'BUTTON')) { const b = $('.run-foot .btn.big', Ov.el); if (b && !b.disabled) { e.preventDefault(); b.click(); } }
    else if (e.key === '1' || e.key === '2') { const b = $(`[data-act="mp-pick"][data-i="${+e.key - 1}"]`, Ov.el); if (b && !b.disabled) b.click(); }
  }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'rate') { S.settings.rate = +t.value; const o = $('#rate-out'); if (o) o.textContent = (+t.value).toFixed(2) + '×'; commit(); }
  else if (t.dataset && t.dataset.bind) PF[t.dataset.bind] = t.value;
  else if (t.id === 'chat-in') { Chat.draft = t.value; t.style.height = 'auto'; t.style.height = Math.min(120, t.scrollHeight) + 'px'; }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'voice-sel') { S.settings.voice = e.target.value; commit(); Speech.say('This is how I sound.'); }
});

/* ---------- 起動 ---------- */
let lastAct = Date.now(), ticks = 0;
['pointerdown', 'keydown'].forEach((ev) => document.addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true, capture: true }));
setInterval(() => {
  if (!Ov.mode || document.hidden) return;
  if (Date.now() - lastAct > 120000 && !(Ov.mode === 'hf' && HF.playing)) return;
  dayLog().s += 5;
  S.u = Date.now();
  if (++ticks % 6 === 0) { saveLocal(); Sync.soon(); }
}, 5000);

function initCaps() {
  if (!HAS_CLAUDE) { Caps.done = true; return; }
  const use = (n) => Promise.resolve().then(() => window.claude.use(n)).catch(() => null);
  const after = () => { if (!Ov.mode) render(); if (Sheet.mode === 'settings') Sheet.refresh(); };
  const p1 = use('tts').then((x) => { Caps.tts = x; });
  const p2 = use('dictation').then((x) => { Caps.dict = x; Mic.subscribe(); });
  const p3 = use('sample').then((x) => { Caps.sample = x; });
  Promise.all([use('db'), use('user')]).then(([db, user]) => { Caps.db = db; Caps.user = user; return Sync.init(); }).catch(() => {});
  [p1, p2, p3].forEach((p) => p.then(after));
  Promise.all([p1, p2, p3]).then(() => { Caps.done = true; after(); });
}
function boot(hot) {
  Ov.el = $('#ov'); Sheet.el = $('#sheet');
  $('.tabbar').innerHTML = TABS.map(([k, icon, name]) => `<button data-act="tab" data-tab="${k}" aria-current="false">${ic(icon)}<span>${name}</span></button>`).join('');
  $('#settings-btn').innerHTML = ic('gear');
  const h = (location.hash || '').slice(1);
  tab = VIEWS[h] ? h : hot && VIEWS[hot.tab] ? hot.tab : 'home';
  render();
  const unlock = () => { Speech.unlock(); Sfx.ensure(); };
  ['pointerdown', 'click', 'keydown'].forEach((ev) => document.addEventListener(ev, unlock, { once: true, capture: true }));
  if (window.visualViewport) {
    const vv = window.visualViewport, root = document.documentElement;
    const fit = () => { root.style.setProperty('--vvh', vv.height + 'px'); root.style.setProperty('--vvt', vv.offsetTop + 'px'); };
    vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); fit();
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { saveLocal(); Sync.soon(300); if (Mic.active) Mic.stop(); }
    else if (Sync.ref && Date.now() - Sync.lastPull > 60000 && !Ov.mode) Sync.pull(false);
  });
  window.addEventListener('pagehide', saveLocal);
  window.addEventListener('hashchange', () => { const k = (location.hash || '').slice(1); if (VIEWS[k] && k !== tab) { tab = k; render(); } });
  try { window.claude?.hot?.snapshot?.(() => ({ tab })); } catch { /* noop */ }
  if (!S.onb) Sheet.open('onboard', onboardHTML);
  initCaps();
}
try {
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
} catch { boot({}); }

</script>
