name: Build Kokoro Shadowing Audio ZIP
on:
  push:
    branches:
      - shadowing-native-slow-better-audio-20261107
    paths:
      - shadowing/generate_shadowing_kokoro.py
      - shadowing-studio/tools/install_kokoro_samples.py
      - .github/workflows/build-shadowing-kokoro.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg espeak-ng
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install speech dependencies
        run: python -m pip install 'kokoro>=0.9.4,<1' soundfile numpy
      - name: Generate the 50 MP3 files
        run: python shadowing/generate_shadowing_kokoro.py
      - name: Check the archive
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          f='shadowing_kokoro_out/shadowing_audio_50files_kokoro.zip'
          with ZipFile(f) as z:
              names=z.namelist()
              assert sum(p.endswith('.mp3') for p in names)==50
              assert 'chunk_timings.csv' in names
          print('Validated 50 MP3 files')
          PY
      - name: Integrate Kokoro audio into Shadowing Studio
        run: python shadowing-studio/tools/install_kokoro_samples.py
      - name: Check JavaScript syntax
        run: |
          node --check shadowing-studio/js/player.js
          node --check shadowing-studio/js/views/lesson.js
          node --check shadowing-studio/js/compare.js
          node --check shadowing-studio/js/lessons.js
      - name: Validate app media and metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('shadowing-studio/samples')
          idx=json.loads((root/'index.json').read_text())
          assert len(idx['lessons'])==4
          assert idx['version']==3
          audio=root/'audio'
          assert len(list(audio.glob('*_w_*.mp3')))==27
          assert len(list(audio.glob('s??-*_??.mp3')))==23
          for item in idx['lessons']:
            sid=item['id']
            lesson=json.loads((root/(sid+'.json')).read_text())
            assert abs(lesson['duration']-item['duration']) < .02
            assert lesson['timingMethod'].endswith('approximate')
            assert lesson['audioGeneration']=='native_slow_kokoro_without_waveform_time_stretch'
            assert lesson['appPlaybackRateAt1x']==1.08
            assert (audio/(sid+'.mp3')).is_file()
            assert (audio/(sid+'-words.mp3')).is_file()
            assert all(c['start'] < c['end'] for c in lesson['chunks'])
          m=json.loads(Path('shadowing_kokoro_out/mp3/manifest.json').read_text())
          assert not m['slowed_waveform_postprocessing']
          assert m['format'].endswith('128 kbps')
          print('Four lessons, 50 stems, 8 continuous tracks, native slow synthesis validated')
          PY
      - name: Commit generated app assets to working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shadowing-studio/samples shadowing-studio/sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Install Kokoro voices and aligned practice audio for all four lessons"
            git push origin HEAD:$GITHUB_REF_NAME
          fi
      - name: Upload downloadable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: shadowing-kokoro-50files
          path: shadowing_kokoro_out/shadowing_audio_50files_kokoro.zip
          if-no-files-found: error
          retention-days: 30