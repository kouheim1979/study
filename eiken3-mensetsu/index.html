<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英検3級 面接ルーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
/* Layout: one narrow column like a phone held in the waiting room; the 問題カード is the only "object" on the page. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --card:#ffffff; --ink:#1d2533; --muted:#5d6878; --line:#cfd6df;
  --accent:#0d6e6a; --accent-ink:#ffffff; --accent-soft:#d8ece9; --amber:#c98a12; --amber-soft:#f8ecd2;
  --good:#2f7d3e; --warn:#b4541c;
  --skin:#ffffff; --hair:#3a4252; --c1:#d6e6ef; --c2:#e9dfcf; --c3:#dfe8d6;
  --jp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --en:"Literata",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a22; --surface:#1d2530; --card:#f4f6f8; --ink:#1d2533; --muted:#9aa6b6; --line:#334050;
  --accent:#4fb3ab; --accent-ink:#0c1a1a; --accent-soft:#1f3b3a; --amber:#e6b44f; --amber-soft:#3a3020;
  --good:#7cc98a; --warn:#f0a070; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#141a22; --surface:#1d2530; --card:#f4f6f8; --ink:#1d2533; --muted:#9aa6b6; --line:#334050;
  --accent:#4fb3ab; --accent-ink:#0c1a1a; --accent-soft:#1f3b3a; --amber:#e6b44f; --amber-soft:#3a3020;
  --good:#7cc98a; --warn:#f0a070; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--txt,var(--fg));font-family:var(--jp);line-height:1.6;font-size:15px}
:root{--fg:#1d2533}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--fg:#e6ebf1}}
:root[data-theme="dark"]{--fg:#e6ebf1}
.wrap{max-width:620px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:1.5rem;font-weight:900;margin:0;letter-spacing:.02em;text-wrap:balance}
h2{font-size:1.1rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.88rem}
button{font-family:inherit;font-size:1rem;cursor:pointer;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 14px}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.ghost{background:transparent}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}

/* progress rail */
.rail{display:flex;gap:4px;margin:4px 0 14px}
.rail span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.rail span.on{background:var(--accent)}
.rail span.now{background:var(--amber)}
.phase{font-size:.78rem;letter-spacing:.08em;color:var(--muted);font-weight:700}

/* examiner */
.ex{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start}
.ex .av{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);font-weight:900;font-size:.8rem}
.ex .bub{background:var(--surface);border:1.5px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 12px;min-width:0}
.ex .who{font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:.06em}
.ex .line{font-family:var(--en);font-size:1.08rem;margin-top:2px}
.ex .line.hiddenq{font-family:var(--jp);color:var(--muted);font-size:.9rem}
.mini{font-size:.82rem;padding:6px 10px;border-radius:8px}
.you{border-left:4px solid var(--amber);background:var(--amber-soft);padding:10px 12px;border-radius:0 10px 10px 0}
.you .who{font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--amber)}
.you .say{font-family:var(--en);font-size:1.05rem}

/* 問題カード */
.qcard{background:var(--card);color:#1d2533;border:2px solid #1d2533;border-radius:6px;padding:14px 14px 10px;box-shadow:0 2px 0 #1d2533}
.qcard .ptitle{font-family:var(--en);font-weight:600;text-align:center;font-size:1.05rem;margin-bottom:6px}
.qcard .ptext{font-family:var(--en);font-size:1.02rem;line-height:1.75;margin:0 0 10px}
.qcard svg{display:block;width:100%;height:auto;border-top:1.5px solid #1d2533;padding-top:8px}
.turned{border:2px dashed var(--line);border-radius:6px;padding:28px 14px;text-align:center;color:var(--muted)}

.big-timer{font-variant-numeric:tabular-nums;font-size:3rem;font-weight:900;text-align:center;color:var(--amber);line-height:1}
.timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.timer.late{color:var(--warn);font-weight:700}

textarea{width:100%;min-height:92px;font-family:var(--en);font-size:1.05rem;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);resize:vertical}
input[type=text]{font-family:inherit;font-size:1rem;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);width:100%}
.hint{font-size:.8rem;color:var(--muted)}

/* home */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.pick{text-align:left;display:flex;flex-direction:column;gap:2px;padding:12px}
.pick .n{font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:.06em}
.pick .t{font-family:var(--en);font-weight:600;font-size:1.02rem}
.pick .h{font-size:.78rem;color:var(--accent)}
.pick[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px}
.flow{margin:0;padding-left:1.3em;font-size:.88rem;color:var(--muted)}
.flow li{margin:2px 0}
.toggle{display:flex;align-items:center;gap:8px;font-size:.92rem}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}

/* results */
.score-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score-head .tot{font-size:2.6rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.pass{display:inline-block;padding:3px 10px;border-radius:99px;font-weight:700;font-size:.85rem}
.pass.ok{background:var(--accent-soft);color:var(--good)}
.pass.ng{background:var(--amber-soft);color:var(--warn)}
.item{border-top:1.5px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.item .q{font-family:var(--en);font-weight:600}
.item .a{font-family:var(--en)}
.item .lab{font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.06em}
.item .better{font-family:var(--en);background:var(--accent-soft);border-radius:8px;padding:6px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-width:40px;padding:6px 0;font-variant-numeric:tabular-nums;font-weight:700}
.row button.mini[aria-pressed=true],.chips button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note{font-size:.85rem;color:var(--muted)}
.fb-good{color:var(--good);font-size:.9rem}
.fb-fix{color:var(--warn);font-size:.9rem}
@media (prefers-reduced-motion:no-preference){.fade{animation:fade .25s ease}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}

/* svg line art */
.ln{stroke:#1d2533;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sf{fill:#ffffff;stroke:#1d2533;stroke-width:2;stroke-linejoin:round}
.f1{fill:#d6e6ef}.f2{fill:#e9dfcf}.f3{fill:#dfe8d6}.fk{fill:#1d2533}.fh{fill:#3a4252}.fo{fill:#f2c79a}.fg{fill:#cdd3db}

/* Redesigned teenager-friendly interview viewport */
:root{--accent:#7569eb;--accent-soft:#eae7ff;--amber:#ce7139;--amber-soft:#fff2e7}
body{background:radial-gradient(ellipse at top right,#e0ddff,transparent 55%),var(--bg)}
.wrap{max-width:760px}
h1{font-size:clamp(1.7rem,5vw,2.1rem);letter-spacing:-.025em}
.panel{border-radius:19px;padding:17px;box-shadow:0 4px 20px #20295010}
button{border-radius:12px;min-height:42px}button.primary{background:#6c60df;color:#fff}
.cards{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}.pick{border-radius:13px;min-height:95px}
.ex{display:flex;flex-direction:column;gap:12px}.ex .bub{border-radius:15px;padding:14px;width:100%}.ex .line{font-size:1.17rem}
.ex-video{position:relative;isolation:isolate;overflow:hidden;height:244px;border-radius:22px;border:1px solid #8490b5;background:linear-gradient(180deg,#405887,#314975 65%,#172c55 66%);box-shadow:0 14px 24px #121a3530}
.ex-video:before{content:"";position:absolute;inset:14% 22% 12%;border:8px solid #e4ecfa55;border-radius:120px 120px 8px 8px;background:linear-gradient(155deg,#c3def18a,#b3cdac5c)}
.ex-video .examiner-img{width:205px;height:235px;display:block;margin:12px auto 0;position:relative;z-index:1;animation:exbreath 4s ease-in-out infinite}
.ex-video .mouth{transform-origin:120px 91px}.ex-video.talking .mouth{animation:extalk .2s ease-in-out infinite alternate}
.ex-desk{position:absolute;bottom:0;left:0;right:0;height:16%;background:linear-gradient(#7a8fab,#405373);border-top:6px solid #bdc9dd;z-index:2}
.ex-live{position:absolute;top:11px;left:11px;border-radius:999px;background:#132242bd;padding:5px 11px;color:#fff;font-weight:800;font-size:.68rem;z-index:3}
.ex-live:before{content:"";display:inline-block;width:7px;height:7px;background:#ff8195;border-radius:50%;margin-right:6px}
.ex-name{position:absolute;bottom:10px;left:12px;color:#fff;font-size:.72rem;font-weight:900;z-index:3}
.ex-bars{position:absolute;bottom:15px;right:15px;display:flex;gap:3px;align-items:center;height:23px;z-index:3}
.ex-bars i{background:#bcf187;border-radius:5px;width:4px;height:5px;display:block}
.ex-video.talking .ex-bars i{animation:exbar .33s ease-in-out infinite alternate}
.ex-video.talking .ex-bars i:nth-child(even){animation-delay:.17s}
.home-hero{padding:22px;border-radius:22px;background:linear-gradient(135deg,#29356b,#151f41);color:white}
.home-hero h1{color:white}.home-hero .sub{color:#d8e2fd}
.home-tag{color:#c5fb90;font-size:.7rem;letter-spacing:.17em;font-weight:900;margin-bottom:8px}
.home-hero .ex-video{margin:14px auto 0;max-width:430px}
.home-hero .quick-note{font-size:.85rem;color:#e9eaff}
@keyframes exbreath{50%{transform:translateY(3px)}}@keyframes extalk{to{transform:scaleY(2.4)}}@keyframes exbar{to{height:18px}}
@media(prefers-reduced-motion:reduce){.ex-video .examiner-img,.ex-video .mouth,.ex-video .ex-bars i{animation:none!important}}
@media(max-width:520px){.ex-video{height:227px}.ex-video .examiner-img{width:197px}}

/* Printable Grade 3 practice cards (A4: two cut-outs per sheet) */
#print-pack{display:none}
@media print{
 @page{size:A4 portrait;margin:9mm}
 html,body{background:white!important;color:#1c2d45!important;min-height:0!important;margin:0!important}
 .wrap{display:none!important}
 #print-pack{display:block!important;margin:0!important;padding:0!important}
 .practice-print-card{height:131mm;width:100%;box-sizing:border-box;background:#fff;color:#1c2d45;border:1px solid #8294b7;border-radius:4mm;padding:7mm 9mm;break-inside:avoid;page-break-inside:avoid;position:relative;overflow:hidden}
 .practice-print-card:nth-child(odd){margin-bottom:7mm}
 .practice-print-card:nth-child(even){break-after:page;page-break-after:always}
 .practice-print-card:last-child{break-after:auto;page-break-after:auto}
 .print-head3{display:flex;justify-content:space-between;align-items:center;font-family:Arial,sans-serif;font-size:8.5pt;font-weight:bold;color:#405479}
 .print-head3 b{border:1px solid #98a8c5;border-radius:30px;padding:4px 9px}
 .practice-print-card h2{text-align:center;font:700 16pt Georgia,serif;margin:6mm 0 4mm;color:#1b2d42}
 .practice-print-card .ptext{font:10.5pt/1.65 Georgia,serif;margin:0;min-height:27mm}
 .practice-print-card svg{width:100%;max-width:164mm;height:58mm;display:block;margin:4mm auto 0;border-top:1px solid #a3aabb;padding-top:2mm}
 .practice-print-card .print-foot3{position:absolute;bottom:4mm;right:8mm;font:6.4pt Arial,sans-serif;color:#65748b}
 .practice-print-card .picture-title{margin:2mm 0 0;text-align:center;font:8pt Arial,sans-serif;letter-spacing:.12em;color:#6a7791}
}

.voice-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.voice-tools .mini{flex:1 1 135px;font-size:.83rem}
.voice-status{font-size:.85rem;line-height:1.55;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:11px;padding:9px 12px}
.voice-status:empty{display:none}
.voice-help{font-size:.78rem;color:var(--muted);line-height:1.6}
</style>

<body>

<div class="wrap" id="app"></div>

<script src="../shared/eiken-voice.js"></script>
<script>
/* ---------- picture helpers (black line art, like the real card) ---------- */
const L=(x1,y1,x2,y2,w)=>`<line class="ln" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"${w?` style="stroke-width:${w}"`:''}/>`;
const R=(x,y,w,h,c='',rx=0)=>`<rect class="sf ${c}" x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}"/>`;
const C=(x,y,r,c='')=>`<circle class="sf ${c}" cx="${x}" cy="${y}" r="${r}"/>`;
const PATH=(d,c='')=>`<path class="sf ${c}" d="${d}"/>`;
const PL=(d,w)=>`<path class="ln" d="${d}"${w?` style="stroke-width:${w}"`:''}/>`;

function fig(o){
  const s=o.s||1,f=o.f||1,k=o.kind,sit=o.pose==='sit',dy=sit?12:0,w=-52+dy;
  const top=o.top||'f1',bot=o.bot||'f2';
  const skirt=(k==='w'||k==='g');
  const leg=(pts,thick)=>thick
    ? `<polyline points="${pts}" style="fill:none;stroke:#1d2533;stroke-width:8;stroke-linecap:round;stroke-linejoin:round"/><polyline points="${pts}" class="${bot}" style="fill:none;stroke:currentColor;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round"/>`
    : `<polyline points="${pts}" style="fill:none;stroke:#1d2533;stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/>`;
  let legs;
  if(sit) legs=[`-3,${w} 17,${w} 17,-1`,`3,${w} 21,${w} 21,-1`];
  else if(o.pose==='walk') legs=[`-5,${w} -14,-2`,`5,${w} 13,-2`];
  else legs=[`-6,${w} -6,-2`,`6,${w} 6,-2`];
  const pants=!skirt;
  const botColor={f1:'#d6e6ef',f2:'#e9dfcf',f3:'#dfe8d6',fg:'#cdd3db'}[bot]||'#e9dfcf';
  let g='';
  const shoe=(pts)=>{const p=pts.split(' ').pop().split(',');return `<ellipse cx="${+p[0]+3}" cy="${+p[1]+1}" rx="6" ry="3" class="fk"/>`};
  const hl=o.hl||[-13,-58+dy], hr=o.hr||[13,-58+dy];
  const arm=(h,sx)=>`<line x1="${sx}" y1="${-86+dy}" x2="${h[0]}" y2="${h[1]}" style="stroke:#1d2533;stroke-width:7.5;stroke-linecap:round"/><line x1="${sx}" y1="${-86+dy}" x2="${h[0]}" y2="${h[1]}" style="stroke:${({f1:'#d6e6ef',f2:'#e9dfcf',f3:'#dfe8d6',fg:'#cdd3db'})[top]};stroke-width:4;stroke-linecap:round"/><circle cx="${h[0]}" cy="${h[1]}" r="3.6" class="sf" style="stroke-width:1.5"/>`;
  // long hair behind
  if(k==='w') g+=PATH(`M-9,${-113+dy} Q-19,${-98+dy} -13,${-84+dy} L-3,${-88+dy} Z`,'fh');
  if(k==='g') g+=C(-14,-102+dy,5,'fh');
  g+=arm(hl,-10);
  legs.forEach(p=>{g+=`<g style="color:${botColor}">${leg(p,pants)}</g>`+shoe(p)});
  if(skirt) g+=PATH(sit?`M-13,${w-2} L13,${w-2} L24,${w+8} L-8,${w+8} Z`:`M-13,${w-2} L13,${w-2} L18,${w+18} L-18,${w+18} Z`,bot);
  else g+=PATH(`M-13,${w-3} L13,${w-3} L13,${w+4} L-13,${w+4} Z`,bot);
  g+=PATH(`M-12,${-89+dy} Q0,${-93+dy} 12,${-89+dy} L13,${w} L-13,${w} Z`,top);
  g+=C(0,-104+dy,11);
  g+=`<circle cx="5.5" cy="${-105+dy}" r="1.5" class="fk"/>`+PL(`M5,${-98+dy} q2.5,1.5 5,-0.5`,1.5);
  g+=PATH(`M-11.5,${-101+dy} C-13,${-119+dy} 11,${-121+dy} 11.5,${-106+dy} C5,${-112+dy} -3,${-111+dy} -6,${-104+dy} C-8,${-103+dy} -10,${-102+dy} -11.5,${-101+dy}Z`,'fh');
  if(k==='g') g+=R(-11.5,-104+dy,3,4,'fk');
  g+=arm(hr,10);
  if(o.extra) g+=o.extra;
  return `<g transform="translate(${o.x},${o.y}) scale(${s*f},${s})">${g}</g>`;
}
function thought(cx,cy,r,hx,hy,inner){
  const mx=(cx+hx)/2,my=(cy+r+hy)/2;
  return C(hx+(mx-hx)*0.3,hy-6,2.5)+C(mx,my,4)+`<ellipse class="sf" cx="${cx}" cy="${cy}" rx="${r*1.25}" ry="${r}"/>`+inner;
}
const bird=(x,y,f=1)=>`<g transform="translate(${x},${y}) scale(${f},1)">${PATH('M-8,0 Q-2,-7 6,-3 L10,-5 L8,0 Q2,5 -8,0Z','fg')}<path d="M8,-4 l4,1 l-4,1z" class="fk"/>${L(-1,3,-1,7,1.5)}${L(2,3,2,7,1.5)}</g>`;
const svgWrap=(body)=>`<svg viewBox="0 0 360 215" role="img" aria-label="イラスト">${body}</svg>`;

const SCENES={
 cook(){
  let b='';
  b+=L(0,200,360,200);
  b+=R(300,78,52,122,'',3)+L(300,122,352,122)+L(308,100,308,112,3)+L(308,130,308,146,3);
  b+=fig({x:70,y:200,kind:'w',top:'f1',bot:'f2',hl:[22,-68],hr:[40,-72]});
  b+=R(28,138,124,62)+L(28,150,152,150);
  b+=R(84,131,58,7,'f2',2);
  b+=PATH('M120,133 l14,-3 l-1,5 z','fo')+C(103,134,3,'fo')+C(110,134,3,'fo')+C(96,134.5,3,'fo');
  b+=L(110,128,118,124,3)+PATH('M118,124 l16,-9 l1,3 l-15,8 z','fg');
  b+=fig({x:216,y:200,s:.8,kind:'b',top:'f3',bot:'fg',hl:[8,-84],hr:[24,-81]});
  b+=R(172,138,98,62)+R(192,132,56,7,'fg',2)+PL('M244,132 v-14 h-10 v4',3);
  b+=`<ellipse class="sf" cx="232" cy="131" rx="11" ry="3.5"/>`+C(222,124,3)+C(228,120,2.2)+C(240,122,2.6);
  b+=fig({x:278,y:200,s:.78,kind:'g',top:'f2',bot:'f1'});
  b+=thought(300,40,22,282,108,
     PATH('M290,30 L310,30 L310,58 L290,58 Z')+PATH('M290,30 L295,22 L305,22 L310,30 Z','fg')+R(294,40,12,10,'f1',1)+'');
  return svgWrap(b);
 },
 bike(){
  let b='';
  b+=L(0,198,360,198);
  b+=R(48,92,14,106,'f2')+`<ellipse class="sf f3" cx="55" cy="66" rx="48" ry="40"/>`+PL('M55,100 L55,80 M55,88 L36,74 M56,84 L76,70',2);
  b+=bird(30,46,1)+bird(80,40,-1)+bird(62,82,1);
  b+=R(130,112,100,6,'f2',2)+L(140,118,140,152,3)+L(220,118,220,152,3)+R(130,124,100,6,'f2',2);
  b+=fig({x:160,y:194,kind:'m',pose:'sit',top:'f1',bot:'fg',hl:[22,-62],hr:[28,-66]});
  b+=PATH('M178,126 L190,116 L202,122 L192,132 Z')+PATH('M190,116 L192,132',2);

function qcardHTML(){const c=card();return `<div class="qcard fade"><div class="ptitle">${esc(c.title)}</div><p class="ptext">${esc(c.passage)}</p>${SCENES[c.id]()}</div>`}

 const key=S.step==='q5'?'q5':S.step;
 if(!/^q[1-5]$/.test(key))return;
 S.a[key]=((S.a[key]||'')+' '+txt).trim();

  if(EikenVoice.isRecording()){EikenVoice.stopAI();return}

function answerBox(key,ph){
  return `<div class="stack"><label for="ans" class="hint">あなたの答え（声に出して言ってから入力。キーボードのマイクで音声入力すると本番に近くなります）</label>

function render(){
  clearTimer();const app=$('#app');const c=card();
  if(S.step==='home'){app.innerHTML=home();return}
  if(S.step==='result'){app.innerHTML=result();return}
  let h=rail();
  if(S.step==='intro'){const [ex,you,tip]=INTRO[S.introI];
    h+=`<div class="stack">${examiner(ex)}<div class="you fade"><div class="who">YOU · ${esc(tip)}</div><div class="say">${esc(you)}</div></div>
    <div class="row" style="justify-content:flex-end"><button class="primary" data-act="intro-next">言った → 次へ</button></div></div>`;}
  else if(S.step==='silent'){h+=`<div class="stack">${examiner('First, please read the passage silently for 20 seconds.',{repeat:false})}

  else if(/^q[123]$/.test(S.step)){const n=+S.step[1],q=c.q[n-1];
    h+=`<div class="stack">${examiner(q.t,{hide:!S.showText})}${qcardHTML()}${answerBox(S.step,n===1?'Because ...':n===2?'He / She is ...':'')}</div>`;}
  else if(S.step==='turn'){h+=`<div class="stack">${examiner('Now, please turn the card over.')}
    <div class="note">ここからはカードを見ずに、あなた自身のことを答えます。</div>
    <div class="row" style="justify-content:flex-end"><button class="primary" data-act="next">カードを裏返した</button></div></div>`;}
  else if(S.step==='q4'){const q=c.q[3];
    h+=`<div class="stack">${examiner(q.t,{hide:!S.showText})}<div class="turned">問題カードは裏返しています</div>${answerBox('q4','I ...')}</div>`;}
  else if(S.step==='q5'){const q=c.q[4];
    if(!S.yn){h+=`<div class="stack">${examiner(q.t,{hide:!S.showText})}<div class="turned">問題カードは裏返しています</div>
      <div class="note">まず Yes / No で答えます（例：Yes, I do. / No, I don't.）。声に出してから選んでください。</div>
      <div class="row"><button class="primary" data-act="yn" data-v="yes">Yes と答えた</button><button data-act="yn" data-v="no">No と答えた</button></div></div>`;}
    else{const fol=S.yn==='yes'?q.yes:q.no;
      h+=`<div class="stack">${examiner(fol,{hide:!S.showText})}<div class="turned">問題カードは裏返しています</div>${answerBox('q5','')}</div>`;}}
  else if(S.step==='end'){const [ex,you,tip]=ENDING[S.endI];

  if(S.step==='silent'){let r=20;timerId=setInterval(()=>{r--;const el=$('#cd');if(el)el.textContent=r;if(r<=0){S.step='aloud';enter()}},1000)}
}
function currentLine(){const c=card();
  if(S.step==='intro')return INTRO[S.introI][0];if(S.step==='end')return ENDING[S.endI][0];
  if(S.step==='silent')return 'First, please read the passage silently for 20 seconds.';
  if(S.step==='aloud')return 'All right. Please read the passage aloud.';
  if(S.step==='turn')return 'Now, please turn the card over.';
  if(/^q[1-4]$/.test(S.step))return c.q[+S.step[1]-1].t;
  if(S.step==='q5'){const q=c.q[4];return !S.yn?q.t:(S.yn==='yes'?q.yes:q.no)}
  return '';}

 const pack=document.getElementById("print-pack")||document.createElement("section");
 pack.id="print-pack";
 pack.innerHTML=src.map((c,i)=>'<article class="practice-print-card"><div class="print-head3"><b>EIKEN GRADE 3 · PRACTICE CARD</b><span>CARD '+c.id.toUpperCase()+'</span></div><h2>'+esc(c.title)+'</h2><p class="ptext">'+esc(c.passage)+'</p><div class="picture-title">LOOK AT THE PICTURE</div>'+SCENES[c.id]()+'<div class="print-foot3">ORIGINAL · UNOFFICIAL PRACTICE MATERIAL</div></article>').join('');
 document.body.appendChild(pack);
 const cleanup=()=>{pack.remove();window.removeEventListener("afterprint",cleanup)};
 window.addEventListener("afterprint",cleanup);
 window.print();
}

function home(){
  const rows=CARDS.map((c,i)=>{const r=saved['r_'+c.id];return `<button class="pick" data-act="pick" data-i="${i}" aria-pressed="${i===S.cardIdx}">
    <span class="n">CARD ${String.fromCharCode(65+i)}</span><span class="t">${esc(c.title)}</span><span class="h">${esc(c.hint)}${r?`　前回 ${r.total}/33`:''}</span></button>`}).join('');
  return `<div class="stack fade">
   <div class="home-hero"><div class="home-tag">EIKEN GRADE 3 · INTERVIEW QUEST</div><h1>画面の先生と、面接に挑戦。</h1><div class="sub">声に出して練習しよう。入室から退室まで本番と同じ順番で進めるよ。</div><div class="home-preview">${interviewVideo()}</div><p class="quick-note">🎬 動く面接官　🎧 英語の質問　✨ 5枚の練習カード</p></div>
   <div class="panel stack"><h2>問題カードを選ぶ</h2><div class="cards">${rows}</div>
    <div class="note">練習用のオリジナル問題です（実際の過去問ではありません）。</div></div>
   <div class="panel stack"><h2>本番の流れ</h2>
    <ol class="flow"><li>入室・あいさつ（面接カードを渡す）</li><li>パッセージを20秒黙読 → 音読</li><li>No.1 パッセージについて</li><li>No.2・No.3 イラストについて</li><li>カードを裏返して No.4・No.5 あなた自身のこと</li><li>カードを返して退室</li></ol>
    <div class="note">配点の目安：音読5点＋No.1〜5 各5点＋アティチュード3点＝33点。合格目安は17点前後です。</div></div>
   <div class="panel stack"><h2>設定</h2>
    <label class="toggle"><input type="checkbox" id="showText" ${S.showText?'checked':''}>質問を文字でも表示する（練習モード）</label>
    <div class="hint">オフにすると本番と同じく、質問は音声だけ。聞き取れなければ「Could you say that again?」で聞き直せます。</div>
    <div class="row"><span class="toggle">読み上げの速さ</span>
     <button class="mini" data-act="rate" data-v="0.75" aria-pressed="${S.rate==0.75}">ゆっくり</button>
     <button class="mini" data-act="rate" data-v="0.9" aria-pressed="${S.rate==0.9}">ふつう</button>
     <button class="mini" data-act="rate" data-v="1" aria-pressed="${S.rate==1}">本番より速め</button>
     <button class="mini ghost" data-act="test">🔊 試し聞き</button></div></div>
   <button class="primary" data-act="start" style="padding:14px">🎬 面接官と練習スタート（${esc(card().title)}）</button><div class="panel stack"><h2>🖨 問題カードを印刷する</h2><p class="note">A4用紙に2枚ずつ印刷できます。英語の文章とイラストだけを印刷し、質問やお手本は載せません。</p><div class="row"><button data-act="printall" class="primary">5枚まとめて印刷</button><button data-act="printone">選んだ1枚だけ印刷</button></div></div><div class="note">※人物はアニメーション。音声は端末の読み上げ機能です（実在の動画・AIとの自由会話ではありません）。</div><a href="../eiken2-mensetsu/" class="sub">2級の面接練習はこちら →</a>
  </div>`;
}

/* ---------- grading ---------- */
function items(){const c=card();return [1,2,3,4,5].map(n=>{const q=c.q[n-1];
  if(n<5)return {no:n,q:q.t,model:q.m,ans:S.a['q'+n]||''};
  const fol=S.yn==='yes'?q.yes:q.no;return {no:5,q:`${q.t} → (${S.yn==='yes'?'Yes':S.yn==='no'?'No':'未回答'}) → ${fol}`,model:S.yn==='no'?q.mn:q.my,ans:(S.yn?(S.yn==='yes'?'[Yes と回答] ':'[No と回答] '):'')+(S.a.q5||'')}})}
async function grade(){
  if(!sampleFn){S.grade={state:'off'};render();return}
  S.grade={state:'busy'};render();
  const c=card(),its=items();
  const prompt=`あなたは英検3級二次試験（面接）の採点に慣れた先生です。受験者は日本の中学生くらいです。下の回答を採点し、日本語でやさしく具体的に助言してください。

採点基準（各問0〜5点）：5=質問に合った内容で、文として正しい／4=小さな誤りが1つ／3=意味は通じるが文法の誤りや主語・動詞が欠けた答え／1〜2=一部だけ・単語のみ／0=無回答・質問と無関係。
- No.1: パッセージの内容から答えているか。people→they のような代名詞の置き換え、Because で始める形、so の前の部分を答えているか。
- No.2/3: イラストの内容に合っているか。現在進行形（He is ~ing）や be going to の形、There are ~ の形。
- No.4/5: 自分のことを主語と動詞のある文で答えているか。No.5は Yes/No の後の追加質問への答えを評価。お手本と内容が違っても、質問に合っていれば満点にしてよい。
- 回答は音声入力の可能性があるため、句読点・大文字・明らかな音声認識の誤変換は減点しない。

パッセージ（${c.title}）：${c.passage}
イラストの内容：${c.pic}

${its.map(i=>`No.${i.no}
質問: ${i.q}
お手本の一例: ${i.model}
受験者の回答: ${i.ans.trim()||'（無回答）'}`).join('\n\n')}

JSONだけで返してください。形式：
{"items":[{"no":1,"score":0,"good":"よかった点（20字程度、なければ空）","fix":"直すとよい点（40字以内、なければ空）","better":"この受験者の答えを生かした、より良い英文1文〜2文"}],"overall":"全体へのひとこと（2文以内）"}`;
  try{
    const r=await sampleFn.json(prompt,{modelTier:'default'});
    if(!r||!Array.isArray(r.items))throw {code:'invalid_json'};
    S.grade={state:'done',items:r.items,overall:String(r.overall||'')};
  }catch(e){
    const code=e&&e.code;
    S.grade={state:(code==='not_granted'||code==='sampling_disabled'||code==='not_declared'||code==='capability_disabled'||code==='capability_removed')?'off':'err',code};
  }
  render();
}
function scoreOf(no){const g=S.grade;if(g&&g.items){const it=g.items.find(x=>+x.no===no);if(it&&S.manual?.[no]==null)return Math.max(0,Math.min(5,Math.round(+it.score||0)))}return S.manual?.[no]??null}
function result(){
  const its=items(),g=S.grade||{};
  const qs=[1,2,3,4,5].map(scoreOf);
  const qsum=qs.reduce((a,b)=>a+(b||0),0),allq=qs.every(v=>v!=null);
  const tot=qsum+(S.self.read||0)+(S.self.att||0),complete=allq&&S.self.read!=null&&S.self.att!=null;
  if(complete){saved['r_'+card().id]={total:tot,at:Date.now()};persist()}
  const chips=(key,max,val)=>`<div class="chips">${Array.from({length:max+1},(_,i)=>`<button data-act="chip" data-k="${key}" data-v="${i}" aria-pressed="${val===i}">${i}</button>`).join('')}</div>`;
  let status='';
  if(g.state==='busy')status=`<div class="panel">採点中です… 30秒ほどかかることがあります。</div>`;
  else if(g.state==='off')status=`<div class="panel note">ここでは自動採点が使えません。お手本と比べて、各問の点数を自分でつけてみましょう。</div>`;
  else if(g.state==='err')status=`<div class="panel row" style="justify-content:space-between"><span class="note">採点を取得できませんでした。少し待ってからもう一度お試しください。</span><button class="mini" data-act="regrade">もう一度採点</button></div>`;
  else if(g.state==='done'&&g.overall)status=`<div class="panel">${esc(g.overall)}</div>`;
  else if(!g.state)status=`<div class="panel row" style="justify-content:space-between"><span class="note">Claude に No.1〜5 を採点してもらえます（初回は許可の確認が出ます）。</span><button class="primary mini" data-act="regrade">採点する</button></div>`;
  const body=its.map(i=>{const gi=g.items?.find(x=>+x.no===i.no);return `<div class="item">
    <div class="lab">No.${i.no}</div><div class="q">${esc(i.q)}</div>
    <div><span class="lab">あなた</span><div class="a">${esc(i.ans.trim())||'<span class="note">（無回答）</span>'}</div></div>
    ${gi?.good?`<div class="fb-good">○ ${esc(gi.good)}</div>`:''}${gi?.fix?`<div class="fb-fix">△ ${esc(gi.fix)}</div>`:''}
    <div><span class="lab">${gi?.better?'よりよい答え':'お手本の一例'}</span><div class="better">${esc(gi?.better||i.model)}</div></div>
    <div class="row"><span class="lab">点数</span>${chips('q'+i.no,5,scoreOf(i.no))}</div></div>`}).join('');
  return `<div class="stack fade">
   <div><div class="phase">RESULT · ${esc(card().title)}</div>
   <div class="score-head"><span class="tot">${tot}</span><span class="sub">/ 33</span>
    ${complete?`<span class="pass ${tot>=17?'ok':'ng'}">${tot>=17?'合格ライン到達':'合格目安まであと'+(17-tot)+'点'}</span>`:'<span class="note">音読・態度の自己採点を入れると合計が出ます</span>'}</div></div>
   ${status}
   <div class="panel stack"><h2>自己チェック</h2>
    <div class="stack"><div><b>音読</b>（0〜5）<div class="hint">はっきり・つかえず・意味の区切りで読めたか</div></div>${chips('read',5,S.self.read)}</div>
    <div class="stack"><div><b>アティチュード</b>（0〜3）<div class="hint">あいさつ・声の大きさ・沈黙しなかったか</div></div>${chips('att',3,S.self.att)}</div></div>
   <div class="panel stack"><h2>No.1〜5 の答え</h2>${body}</div>
   <div class="row"><button class="primary" data-act="retry">同じカードでもう一度</button><button data-act="home">ほかのカードへ</button></div>
  </div>`;
}

/* ---------- events ---------- */
document.addEventListener('change',e=>{if(e.target.id==='showText'){S.showText=e.target.checked;saved.showText=S.showText;persist()}});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='printall'){printGrade3Cards(false);return}
  if(a==='printone'){printGrade3Cards(true);return}
  if(a==='pick'){S.cardIdx=+b.dataset.i;render();return}
  if(a==='rate'){S.rate=+b.dataset.v;saved.rate=S.rate;persist();render();say('Hello. Can I have your card, please?');return}
  if(a==='test'){say('Please look at the picture. What is the woman doing?');return}
  if(a==='start'||a==='retry'){EikenVoice.cancel();S.a={};S.yn=null;S.introI=0;S.endI=0;S.grade=null;S.manual={};S.self={read:null,att:null};S.step='intro';enter();window.scrollTo(0,0);return}
  if(a==='home'||a==='quit'){EikenVoice.cancel();hush();S.step='home';render();window.scrollTo(0,0);return}
  if(a==='again'){say(currentLine());return}
  if(a==='mic'){grade3Mic('native');return}
  if(a==='aimic'){grade3Mic('ai');return}
  if(a==='reveal'){const el=$('#exline');if(el){el.textContent=currentLine();el.classList.remove('hiddenq')}b.remove();return}
  if(a==='intro-next'){if(S.introI<INTRO.length-1){S.introI++;enter()}else{S.step='silent';enter()}return}
  if(a==='end-next'){if(S.endI<ENDING.length-1){S.endI++;enter()}else{EikenVoice.cancel();hush();S.step='result';render();window.scrollTo(0,0);grade()}return}
  if(a==='yn'){S.yn=b.dataset.v;enter();return}
  if(a==='next'){const i=STEPS.indexOf(S.step);S.step=STEPS[i+1];enter();window.scrollTo(0,0);return}
  if(a==='regrade'){grade();return}
  if(a==='chip'){const k=b.dataset.k,v=+b.dataset.v;if(k==='read')S.self.read=v;else if(k==='att')S.self.att=v;else{S.manual=S.manual||{};S.manual[+k.slice(1)]=v}render();return}
});

S.manual={};
render();
(async()=>{try{if(window.claude&&claude.use){sampleFn=await claude.use('sample')}}catch(e){sampleFn=null}})();
</script>
