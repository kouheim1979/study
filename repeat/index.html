/**
 * REPEAT – English Speaking Lab
 * Main Application Controller (All 12 Screens, Voice Session Orchestrator, Walking Mode,
 * Level Check, PDF/JSON Import, Question Editor, Real Analytics, Calendar, Settings)
 */
(function (root) {
  'use strict';

  const Schema = root.RepeatSchema;
  const Evaluator = root.RepeatEvaluator;
  const StoreLib = root.RepeatStoreLib;
  const VoiceLib = root.RepeatVoiceEngine;
  const DrillRunner = root.RepeatDrillRunner;
  const Curriculum = root.RepeatCurriculum;
  const PdfImporter = root.RepeatPdfImporter;
  const TutorAvatar = root.RepeatTutorAvatar;

  const store = new StoreLib.RepeatStore();
  let voice = null;

  // Application UI State
  const ui = {
    route: 'home', // home | curriculum | lesson | walking | drills | weakness | levelcheck | import | editor | analytics | calendar | settings
    mobileMenuOpen: false,
    selectedLevel: 'C',
    tutorId: 'claire',
    lessonDuration: 15, // 5 | 10 | 15 | 25
    drillLevelFilter: 'ALL',
    analyticsPeriod: 'daily', // daily | weekly | monthly
    calendarYear: new Date().getFullYear(),
    calendarMonth: new Date().getMonth(),
    // Active Session (Lesson / Walking / Drill / Weak / LevelCheck / Custom)
    session: null,
    // PDF Import Draft
    importDraft: {
      title: '',
      pageRange: '',
      exerciseFilter: '',
      drillType: 'repetition',
      orderMode: 'sequential',
      rawText: '',
      parsedItems: [],
      warnings: [],
      error: ''
    },
    // Editor State
    editingDeckId: null,
    // Modal State (replaces native confirm/alert)
    modal: null
  };

  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function formatDuration(sec) {
    const s = Math.max(0, Math.round(sec || 0));
    if (s < 60) return `${s}秒`;
    const m = Math.floor(s / 60);
    if (m < 60) return `${m}分`;
    const h = Math.floor(m / 60);
    const rem = m % 60;
    return `${h}時間${rem}分`;
  }

  function showToast(message) {
    const host = document.getElementById('toast-container');
    if (!host) return;
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = message;
    host.appendChild(el);
    setTimeout(() => {
      el.remove();
    }, 3400);
  }

  function showModal({ title, body, confirmLabel = '実行する', danger = false, onConfirm }) {
    ui.modal = { title, body, confirmLabel, danger, onConfirm };
    renderModal();
  }

  function closeModal() {
    ui.modal = null;
    renderModal();
  }

  function renderModal() {
    const host = document.getElementById('modal-root');
    if (!host) return;
    if (!ui.modal) {
      host.innerHTML = '';
      return;
    }
    host.innerHTML = `
      <div class="modal-backdrop" id="modal-backdrop">
        <div class="modal-card" role="dialog" aria-modal="true">
          <h3 class="section-heading" style="margin-bottom:8px;">${esc(ui.modal.title)}</h3>
          <p style="color:var(--ink-secondary);margin:0 0 20px;font-size:14px;">${esc(ui.modal.body)}</p>
          <div class="btn-row" style="justify-content:flex-end;">
            <button class="btn btn-secondary" data-action="modal-cancel">キャンセル</button>
            <button class="btn ${ui.modal.danger ? 'btn-danger' : 'btn-primary'}" data-action="modal-confirm">${esc(ui.modal.confirmLabel)}</button>
          </div>
        </div>
      </div>
    `;
  }

  function applyTheme() {
    const theme = store.state.settings.theme || 'light';
    document.documentElement.setAttribute('data-theme', theme);
  }

  // Stop any running audio/timers safely when navigating away from a session
  function stopActiveSession(saveProgress = true) {
    if (voice) {
      voice.stopAll();
      voice.setWantWakeLock(false);
    }
    if (ui.session) {
      if (ui.session.timerInterval) {
        clearInterval(ui.session.timerInterval);
        ui.session.timerInterval = null;
      }
      if (ui.session.elapsedSec > 0) {
        store.addStudySeconds(ui.session.elapsedSec);
        ui.session.elapsedSec = 0;
      }
      if (saveProgress && ui.session.mode !== 'levelcheck' && ui.session.stage === 'drills') {
        store.saveCheckpoint({
          mode: ui.session.mode,
          title: ui.session.title,
          levelId: ui.session.levelId,
          lessonNumber: ui.session.lessonNumber,
          drillId: ui.session.drillId,
          deckId: ui.session.deckId,
          questionIndex: ui.session.index
        });
        if (ui.session.deckId) {
          const deck = store.state.customDecks.find((d) => d.id === ui.session.deckId);
          if (deck) {
            deck.resumeIndex = ui.session.index;
            store.saveCustomDeck(deck);
          }
        }
      }
    }
  }

  function navigate(route, opts = {}) {
    if (ui.route !== route) {
      if (ui.route === 'lesson' || ui.route === 'walking' || ui.route === 'levelcheck') {
        stopActiveSession(true);
      } else if (voice) {
        voice.stopAll();
      }
    }
    ui.route = route;
    ui.mobileMenuOpen = false;
    if (opts.levelId) ui.selectedLevel = opts.levelId;
    if (opts.editingDeckId !== undefined) ui.editingDeckId = opts.editingDeckId;
    render();
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  // =========================================================================
  // SESSION ENGINE (Voice Lesson, Walking Mode, Drill, Weak Review, LevelCheck)
  // =========================================================================
  function startSession(config) {
    stopActiveSession(false);

    const stages = config.stages || [{ id: 'drills', name: 'Drills and Exercises', ja: '反復トレーニング', items: config.items || [] }, { id: 'summary', name: 'Summary', ja: '学習結果' }];
    const startStageIdx = config.startAtDrills ? Math.max(0, stages.findIndex((s) => s.id === 'drills')) : 0;

    ui.session = {
      id: Date.now(),
      mode: config.mode || 'lesson', // lesson | walking | drill | weakness | levelcheck | custom
      title: config.title || 'Voice Lesson',
      subtitle: config.subtitle || '',
      levelId: config.levelId || null,
      lessonNumber: config.lessonNumber || null,
      drillId: config.drillId || null,
      deckId: config.deckId || null,
      stages,
      stageIdx: startStageIdx,
      stage: stages[startStageIdx].id,
      items: stages[startStageIdx].items || config.items || [],
      index: config.startIndex || 0,
      subStep: 0,
      attemptNumber: 1,
      showText: Boolean(store.state.settings.showTextDefault),
      showHint: false,
      interimTranscript: '',
      lastTranscript: '',
      lastEval: null,
      fsmState: VoiceLib.STATES.IDLE,
      paused: false,
      errorBanner: '',
      walkingDurationMin: config.walkingDurationMin || 0, // 0 = unlimited
      remainingSec: config.walkingDurationMin ? config.walkingDurationMin * 60 : null,
      elapsedSec: 0,
      results: [],
      dialogueLog: [],
      timerInterval: null
    };

    ui.session.timerInterval = setInterval(() => {
      if (!ui.session || ui.session.paused || ui.session.stage === 'summary') return;
      ui.session.elapsedSec += 1;
      if (ui.session.remainingSec !== null) {
        ui.session.remainingSec = Math.max(0, ui.session.remainingSec - 1);
        const timerEl = document.getElementById('walking-timer-readout');
        if (timerEl) {
          const mm = String(Math.floor(ui.session.remainingSec / 60)).padStart(2, '0');
          const ss = String(ui.session.remainingSec % 60).padStart(2, '0');
          timerEl.textContent = `${mm}:${ss}`;
        }
        if (ui.session.remainingSec === 0) {
          finishSession('設定したウォーキング時間に達しました。お疲れさまでした。');
        }
      }
    }, 1000);

    if (config.mode === 'walking') {
      voice.setWantWakeLock(true);
      ui.route = 'walking';
    } else if (config.mode === 'levelcheck') {
      ui.route = 'levelcheck';
    } else {
      ui.route = 'lesson';
    }

    render();

    if (ui.session.stage === 'drills' || ui.session.stage === 'revision') {
      runCurrentQuestion();
    }
  }

  function currentQuestion() {
    if (!ui.session) return null;
    const stageObj = ui.session.stages[ui.session.stageIdx];
    const list = (stageObj && stageObj.items) || ui.session.items || [];
    return list[ui.session.index] || null;
  }

  function currentStageItems() {
    if (!ui.session) return [];
    const stageObj = ui.session.stages[ui.session.stageIdx];
    return (stageObj && stageObj.items) || ui.session.items || [];
  }

  function advanceStage() {
    if (!ui.session) return;
    voice.stopAll();
    const nextIdx = ui.session.stageIdx + 1;
    if (nextIdx >= ui.session.stages.length) {
      finishSession();
      return;
    }
    ui.session.stageIdx = nextIdx;
    ui.session.stage = ui.session.stages[nextIdx].id;
    ui.session.index = 0;
    ui.session.subStep = 0;
    ui.session.attemptNumber = 1;
    ui.session.lastEval = null;
    ui.session.lastTranscript = '';
    ui.session.interimTranscript = '';
    ui.session.showHint = false;
    ui.session.showText = Boolean(store.state.settings.showTextDefault);
    render();
    if (ui.session.stage === 'drills' || ui.session.stage === 'revision') {
      runCurrentQuestion();
    } else if (ui.session.stage === 'summary') {
      finishSession();
    }
  }

  async function runCurrentQuestion() {
    const sess = ui.session;
    if (!sess || sess.paused) return;
    const q = currentQuestion();
    if (!q) {
      advanceStage();
      return;
    }

    const signal = voice.turn.signal;
    sess.errorBanner = '';
    sess.interimTranscript = '';
    const plan = DrillRunner.buildDrillPromptPlan(q, {
      teacherRepeats: store.state.settings.teacherRepeats,
      subStep: sess.subStep
    });
    sess.currentPlan = plan;
    const teacherUtterance = plan.teacherLines.filter(Boolean).slice(-1)[0] || plan.cueText;
    if (teacherUtterance) {
      sess.dialogueLog.push({ role: 'teacher', text: teacherUtterance, label: TutorAvatar.getTutor(ui.tutorId, store.state.settings.accent).name });
      if (sess.dialogueLog.length > 30) sess.dialogueLog = sess.dialogueLog.slice(-30);
    }
    render();

    const speakRes = await voice.speakSequence(plan.teacherLines, store.state.settings, 420);
    if (speakRes.completed && !signal.aborted) await beginAnswerTurn();
  }

  function beginAnswerTurn() {
    if (voice.capabilities.hasSTT && store.state.settings.inputFallbackMode === 'auto' && !voice.needsMicTap && !ui.session.tapEachAnswer) {
      return startListeningTurn(true);
    }
    if (!voice.capabilities.hasSTT && store.state.settings.inputFallbackMode === 'auto') {
      ui.session.errorBanner = voice.capabilities.isIOS
        ? 'この画面では音声認識を利用できません。iPhoneのSafariで開くか、下の欄に英語で回答してください。'
        : 'このブラウザでは音声認識を利用できません。下の欄に英語で回答できます。';
    }
    voice.transition(VoiceLib.STATES.READY);
  }

  async function startListeningTurn(automatic = false) {
    const sess = ui.session;
    if (!sess || sess.paused) return;
    const q = currentQuestion();
    if (!q || voice.recognition || voice.utterance) return;

    const signal = voice.turn.signal;
    sess.interimTranscript = '';
    sess.errorBanner = '';

    const res = await voice.listen(store.state.settings);
    if (signal.aborted || res.cancelled) return;

    sess.interimTranscript = '';
    if (res.recognitionFailed) {
      if (automatic && res.errorCode === 'not-allowed') sess.tapEachAnswer = true;
      sess.errorBanner = res.message || '音声認識に失敗しました。不正解にはカウントされません。再試行するか文字入力をご利用ください。';
      const evalRes = Evaluator.evaluateAnswer({ transcript: '', question: q, recognitionFailed: true });
      sess.lastEval = evalRes;
      voice.transition(VoiceLib.STATES.IDLE);
      render();
      return;
    }

    voice.transition(VoiceLib.STATES.EVALUATING);
    // Walking Mode voice commands
    if (sess.mode === 'walking' && res.transcript) {
      const cmd = DrillRunner.detectVoiceCommand(res.transcript, q);
      if (cmd) {
        await handleWalkingVoiceCommand(cmd);
        return;
      }
    }

    // Silence handling
    if (!res.transcript) {
      sess.lastTranscript = '';
      sess.lastEval = Evaluator.evaluateAnswer({ transcript: '', question: q, recognitionFailed: false });
      if (sess.mode === 'walking') {
        const replay = await voice.speak('No response detected. Let me repeat.', store.state.settings);
        if (replay.completed && !signal.aborted) runCurrentQuestion();
        return;
      }
      voice.transition(VoiceLib.STATES.IDLE);
      render();
      return;
    }

    await processUserAnswer(res.transcript, {
      responseStartMs: res.responseStartMs,
      responseCompleteMs: res.responseCompleteMs
    });
  }

  async function handleWalkingVoiceCommand(cmd) {
    const sess = ui.session;
    if (!sess) return;
    const signal = voice.turn.signal;
    if (cmd === 'repeat') {
      showToast('音声コマンド: Repeat（再読み上げ）');
      await runCurrentQuestion();
    } else if (cmd === 'skip') {
      showToast('音声コマンド: Skip（スキップ）');
      await voice.speak('Skipping to the next item.', store.state.settings);
      if (!signal.aborted) goNextQuestion();
    } else if (cmd === 'hint') {
      showToast('音声コマンド: Hint（ヒント）');
      sess.showHint = true;
      sess.showText = true;
      const q = currentQuestion();
      render();
      if (q) await voice.speak(q.expectedAnswer, store.state.settings);
      if (!signal.aborted) await beginAnswerTurn();
    } else if (cmd === 'pause') {
      showToast('音声コマンド: Pause（一時停止）');
      togglePauseSession();
    }
  }

  async function processUserAnswer(transcript, timing = {}) {
    const sess = ui.session;
    if (!sess) return;
    const q = currentQuestion();
    if (!q) return;
    const signal = voice.turn.signal;
    if (voice.state !== VoiceLib.STATES.EVALUATING) voice.transition(VoiceLib.STATES.EVALUATING);

    const plan = sess.currentPlan || DrillRunner.buildDrillPromptPlan(q, { subStep: sess.subStep });
    const evalQuestion = { ...q, expectedAnswer: plan.targetAnswer || q.expectedAnswer };
    const evalRes = Evaluator.evaluateAnswer({
      transcript,
      question: evalQuestion,
      mode: store.state.settings.scoringMode,
      recognitionFailed: false
    });

    sess.lastTranscript = transcript;
    sess.dialogueLog.push({ role: 'student', text: transcript, label: 'You' });
    if (sess.dialogueLog.length > 30) sess.dialogueLog = sess.dialogueLog.slice(-30);
    sess.lastEval = evalRes;

    // Needs self-evaluation (Open Question / Controlled Open / Pronunciation reference)
    if (evalRes.needsSelfEval && sess.mode !== 'walking') {
      sess.showText = true;
      voice.transition(VoiceLib.STATES.IDLE);
      render();
      return;
    }

    // Walking mode auto-continues open questions after playing model answer
    if (evalRes.needsSelfEval && sess.mode === 'walking') {
      recordAndTrack(q, 'Not evaluated', true, evalRes.errorCategories, timing, false);
      await voice.speak(`Model answer: ${evalQuestion.expectedAnswer}`, store.state.settings);
      if (!signal.aborted) goNextQuestion();
      return;
    }

    if (evalRes.passed) {
      // Check if multi-substep drill (backwards_buildup or follow_up) has more steps
      if (plan.totalSubSteps > 1 && sess.subStep < plan.totalSubSteps - 1) {
        sess.subStep += 1;
        sess.attemptNumber = 1;
        sess.lastEval = null;
        if (sess.mode === 'walking') {
          await voice.speak('Good.', store.state.settings);
        }
        if (signal.aborted) return;
        render();
        runCurrentQuestion();
        return;
      }

      recordAndTrack(q, evalRes.rating, true, evalRes.errorCategories, timing, false);
      voice.transition(VoiceLib.STATES.NEXT);
      render();

      if (sess.mode === 'walking') {
        await voice.speak('Correct.', store.state.settings);
      }

      if (store.state.settings.autoAdvance || sess.mode === 'walking') {
        if (await voice.wait(sess.mode === 'walking' ? 450 : 850, signal)) goNextQuestion();
      }
      return;
    }

    // Incorrect / Almost -> Correction flow
    const maxRetries = Number(store.state.settings.maxRetries) || 3;
    sess.showText = true; // Reveal text on correction per requirement 12
    if (sess.attemptNumber >= 2) {
      sess.showHint = true; // Provide hint after 2+ misses per requirement 5
    }

    if (sess.attemptNumber >= maxRetries) {
      // Exceeded max retries -> register as weak item and move on
      recordAndTrack(q, evalRes.rating, false, evalRes.errorCategories, timing, true);
      voice.transition(VoiceLib.STATES.CORRECTING);
      render();
      await voice.speak(`The correct sentence is: ${evalQuestion.expectedAnswer}. Added to your review list.`, store.state.settings);
      if (store.state.settings.autoAdvance || sess.mode === 'walking') {
        if (await voice.wait(1200, signal)) goNextQuestion();
      }
      return;
    }

    // Record miss and ask for retry
    recordAndTrack(q, evalRes.rating, false, evalRes.errorCategories, timing, false);
    sess.attemptNumber += 1;
    voice.transition(VoiceLib.STATES.CORRECTING);
    render();

    const corrRes = await voice.speakSequence(
      [evalRes.rating === 'Almost' ? 'Almost. Listen carefully.' : 'Try again. Listen carefully.', evalQuestion.expectedAnswer],
      store.state.settings,
      350
    );
    if (corrRes.completed && !signal.aborted) await beginAnswerTurn();
  }

  function recordAndTrack(q, rating, passed, errorCategories, timing, forceWeak) {
    const sess = ui.session;
    if (!sess) return;
    if (sess.mode !== 'levelcheck') {
      store.recordAttempt({
        question: q,
        rating,
        passed,
        attemptNumber: sess.attemptNumber,
        errorCategories,
        responseStartMs: timing.responseStartMs || null,
        responseCompleteMs: timing.responseCompleteMs || null,
        forceWeak
      });
    }
    sess.results.push({
      questionId: q.id,
      expectedAnswer: q.expectedAnswer,
      rating,
      passed,
      difficulty: q.difficulty || 1,
      responseCompleteMs: timing.responseCompleteMs || null
    });
  }

  function submitSelfEvaluation(rating) {
    const sess = ui.session;
    if (!sess) return;
    const q = currentQuestion();
    if (!q) return;
    const passed = rating === 'Perfect' || rating === 'Almost';
    recordAndTrack(q, rating, passed, [], {}, rating === 'Try again');
    goNextQuestion();
  }

  function goNextQuestion() {
    const sess = ui.session;
    if (!sess) return;
    voice.stopAll();
    const list = currentStageItems();
    if (sess.index + 1 >= list.length) {
      if (sess.mode === 'walking' && sess.remainingSec !== 0) {
        // Loop seamlessly if walking timer still has time or unlimited
        sess.index = 0;
      } else {
        advanceStage();
        return;
      }
    } else {
      sess.index += 1;
    }
    sess.subStep = 0;
    sess.attemptNumber = 1;
    sess.lastEval = null;
    sess.lastTranscript = '';
    sess.interimTranscript = '';
    sess.showHint = false;
    sess.showText = Boolean(store.state.settings.showTextDefault);
    sess.errorBanner = '';
    render();
    runCurrentQuestion();
  }

  function togglePauseSession() {
    const sess = ui.session;
    if (!sess) return;
    if (sess.paused) {
      sess.paused = false;
      voice.resume();
      render();
      runCurrentQuestion();
    } else {
      sess.paused = true;
      voice.pause();
      render();
    }
  }

  function finishSession(customMsg) {
    const sess = ui.session;
    if (!sess) return;
    voice.stopAll();
    voice.setWantWakeLock(false);
    if (sess.timerInterval) {
      clearInterval(sess.timerInterval);
      sess.timerInterval = null;
    }
    if (sess.elapsedSec > 0) {
      store.addStudySeconds(sess.elapsedSec);
      sess.finalElapsedSec = (sess.finalElapsedSec || 0) + sess.elapsedSec;
      sess.elapsedSec = 0;
    }

    if (sess.mode === 'levelcheck') {
      const rec = Curriculum.recommendLevelFromCheck(sess.results);
      store.saveLevelCheck(rec);
      sess.levelCheckRecommendation = rec;
    } else if (sess.levelId && sess.lessonNumber) {
      const evaluated = sess.results.filter((r) => r.rating !== 'Not evaluated');
      const passed = evaluated.filter((r) => r.passed).length;
      store.markLessonCompleted(sess.levelId, sess.lessonNumber, {
        accuracy: evaluated.length ? Math.round((passed / evaluated.length) * 100) : 100,
        answered: sess.results.length
      });
      store.saveCheckpoint(null);
    }

    sess.stage = 'summary';
    sess.summaryMessage = customMsg || '';
    render();
  }

        <div class="btn-row" style="margin-bottom:16px;">${stagePills}</div>
        <div class="panel">
          <h2 class="section-heading">${esc(pf.target)} / ${esc(pf.contrast)} (${esc(pf.ipa)})</h2>
          <p style="font-size:15px;color:var(--ink-secondary);margin:0 0 14px;">例文: <strong>${esc(pf.sentence)}</strong></p>
          <div class="btn-row">
            <button class="btn btn-secondary" data-action="speak-sample" data-text="${esc(pf.target + '. ' + pf.contrast + '. ' + pf.sentence)}">
              <i data-lucide="volume-2"></i> お手本を聴く
            </button>
            <button class="btn btn-primary" data-action="next-stage">ドリルへ進む</button>
          </div>
        </div>
      `;
    }

    if (sess.stage === 'summary') {
      const evaluated = sess.results.filter((r) => r.rating !== 'Not evaluated');
      const passed = evaluated.filter((r) => r.passed).length;
      const acc = evaluated.length ? Math.round((passed / evaluated.length) * 100) : null;
      return `
        <div class="page-header">
          <div>
            <h1 class="page-title">セッション完了</h1>
            <p class="page-subtitle">${esc(sess.title)}</p>
          </div>
        </div>
        <div class="panel">
          ${sess.summaryMessage ? `<p style="font-weight:600;color:var(--primary);margin-top:0;">${esc(sess.summaryMessage)}</p>` : ''}
          <div class="grid-3" style="margin-bottom:20px;">
            <div class="metric-cell">
              <div class="metric-label">回答数</div>
              <div class="metric-value">${sess.results.length}問</div>
            </div>
            <div class="metric-cell">
              <div class="metric-label">正答率</div>
              <div class="metric-value">${acc !== null ? acc + '%' : '—'}</div>
            </div>
            <div class="metric-cell">
              <div class="metric-label">学習時間</div>
              <div class="metric-value">${formatDuration(sess.finalElapsedSec || sess.elapsedSec)}</div>
            </div>
          </div>
          <div class="btn-row">
            <button class="btn btn-primary" data-nav="home">ホームへ戻る</button>
            <button class="btn btn-secondary" data-nav="analytics">学習分析を見る</button>
            <button class="btn btn-secondary" data-nav="weakness">苦手問題を確認</button>
          </div>
        </div>
      `;
    }

    // Active Drill Stage
    const q = currentQuestion();
    const list = currentStageItems();
    const plan = sess.currentPlan || (q ? DrillRunner.buildDrillPromptPlan(q, { subStep: sess.subStep }) : null);
    const drillMeta = q ? (Schema.DRILL_MAP[q.drillType] || { name: q.drillType, ja: '' }) : { name: '', ja: '' };
    const pct = list.length ? Math.round(((sess.index + 1) / list.length) * 100) : 0;

    const fsm = sess.fsmState || VoiceLib.STATES.IDLE;
    const pillClass = fsm === 'SPEAKING' ? 'speaking' : fsm === 'LISTENING' ? 'listening' : fsm === 'CORRECTING' ? 'correcting' : '';

    const evalClass = sess.lastEval ? sess.lastEval.rating.toLowerCase().replace(/\s+/g, '_') : '';
    const needManualInput = !voice.capabilities.hasSTT || store.state.settings.inputFallbackMode !== 'auto' || Boolean(sess.errorBanner);

    return `
      <div class="page-header">
        <div>
          <h1 class="page-title">${esc(sess.title)}</h1>
          <p class="page-subtitle">${esc(drillMeta.name)}（${esc(drillMeta.ja)}） — ${sess.index + 1} / ${list.length}問</p>
        </div>
        <div class="btn-row">
          <button class="btn btn-secondary" data-action="toggle-pause">
            <i data-lucide="${sess.paused ? 'play' : 'pause'}"></i> ${sess.paused ? '再開' : '一時停止'}
          </button>
          <button class="btn btn-secondary" data-action="exit-session">ホームへ戻る</button>
        </div>
      </div>

      <div class="btn-row" style="margin-bottom:10px;">${stagePills}</div>
      <div class="progress-track" style="margin-bottom:20px;">
        <div class="progress-fill" style="width:${pct}%;"></div>
      </div>

      ${sess.errorBanner ? `<div class="feedback-banner not_evaluated" style="max-width:none;margin-bottom:16px;">${esc(sess.errorBanner)}</div>` : ''}

      <div class="lesson-room-grid">
        <div>
          <div class="lesson-video-room">
            ${TutorAvatar.renderTutorSVG(TutorAvatar.getTutor(ui.tutorId, store.state.settings.accent), fsm, sess.paused)}

            <div class="video-overlay-top">
              <span class="video-badge ${pillClass}">
                <span class="live-dot"></span>
                <span role="status">${esc(TutorAvatar.getTutor(ui.tutorId, store.state.settings.accent).name)} · ${esc(voiceStatus(sess))}</span>
              </span>
              <div class="btn-row" style="gap:6px;">
                <span class="video-badge">${formatDuration(sess.elapsedSec)}</span>
                <button class="video-badge" style="border:none;cursor:pointer;" data-action="switch-tutor" title="講師とアクセントを切り替え">
                  講師切替
                </button>
              </div>
            </div>

            <div class="video-overlay-bottom">
              <div class="video-caption-bar">
                <div style="font-size:11px;opacity:0.8;">${esc(plan ? plan.modeLabel : '')} — ${esc(plan ? plan.cueText : '')}</div>
                ${sess.showText && q ? `
                  <div class="video-caption-sentence">${esc(plan && plan.targetAnswer ? plan.targetAnswer : q.expectedAnswer)}</div>
                ` : `
                  <div style="font-size:12px;opacity:0.75;margin-top:2px;">音声に集中するため字幕は非表示（ヒント・訂正時に表示）</div>
                `}
              </div>

              <div class="pip-student ${fsm === 'LISTENING' && !sess.paused ? 'active-mic' : ''}">
                <div style="font-size:10px;opacity:0.8;letter-spacing:0.06em;">YOU</div>
                <div class="pip-wave"><span></span><span></span><span></span><span></span><span></span></div>
                <div style="font-size:11px;font-weight:600;">${fsm === 'LISTENING' && !sess.paused ? 'マイク受付中' : '待機'}</div>
              </div>
            </div>
          </div>

          <div class="call-controls">
            ${micButton(sess, 'btn-primary')}
            <button class="btn btn-secondary" data-action="repeat-prompt" ${sess.paused ? 'disabled' : ''}>
              <i data-lucide="volume-2"></i> もう一度聴く
            </button>
            <button class="btn btn-secondary" data-action="show-hint">
              <i data-lucide="captions"></i> 字幕・ヒント
            </button>
            <button class="btn btn-ghost" data-action="skip-question">
              スキップ <i data-lucide="skip-forward"></i>
            </button>
          </div>
        </div>

        <div class="lesson-board">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
            <strong style="font-size:14px;">レッスンボード</strong>
            <span class="tag tag-primary">${sess.index + 1} / ${list.length}問</span>
          </div>

          ${plan && plan.showTokens && plan.tokens ? `
            <div class="token-list" style="justify-content:flex-start;">
              ${plan.tokens.map((t) => `<span class="token-chip">${esc(t)}</span>`).join('')}
            </div>
          ` : ''}

          ${sess.showText && q && q.sourceSentence && q.sourceSentence !== q.expectedAnswer ? `
            <div style="font-size:13px;color:var(--ink-muted);margin-bottom:8px;">元の英文: <strong>${esc(q.sourceSentence)}</strong></div>
          ` : ''}

          ${sess.showHint && q && q.hint ? `
            <div style="font-size:13px;color:var(--primary);font-weight:600;margin-bottom:8px;">ヒント: ${esc(q.hint)}</div>
          ` : ''}

          ${store.state.settings.showJaExplanation && sess.showText && q && q.explanation ? `
            <div style="font-size:13px;color:var(--ink-secondary);margin-bottom:10px;">解説: ${esc(q.explanation)}</div>
          ` : ''}

          <div class="session-log">
            ${(sess.dialogueLog || []).slice(-6).map((entry) => `
              <div class="chat-bubble ${entry.role}">
                <div class="chat-role">${esc(entry.label)}</div>
                <div>${entry.role === 'teacher' && !sess.showText ? '（音声で指示を読み上げました — 字幕ボタンで確認可）' : esc(entry.text)}</div>
              </div>
            `).join('')}
            <div class="chat-bubble student" style="opacity:0.78;" data-live-panel ${sess.interimTranscript ? '' : 'hidden'}>
              <div class="chat-role">You · 聞き取り中</div>
              <div data-live-transcript>${esc(sess.interimTranscript)}</div>
            </div>
            ${(!sess.dialogueLog || sess.dialogueLog.length === 0) && !sess.interimTranscript ? `
              <div style="font-size:12px;color:var(--ink-muted);text-align:center;padding:18px 8px;">講師とのやり取りがここにライブ表示されます</div>
            ` : ''}
          </div>

          ${sess.lastEval ? `
            <div class="feedback-banner ${evalClass}" style="max-width:none;margin:0 0 12px;">
              <div style="font-weight:700;margin-bottom:4px;">評価: ${esc(sess.lastEval.rating)}</div>
              <div>${esc(sess.lastEval.feedback)}</div>
            </div>
          ` : ''}

          ${sess.lastEval && sess.lastEval.needsSelfEval ? `
            <div class="btn-row" style="margin:0 0 12px;">
              <button class="btn btn-primary" data-action="self-eval" data-rating="Perfect">Perfect</button>
              <button class="btn btn-secondary" data-action="self-eval" data-rating="Almost">Almost</button>
              <button class="btn btn-danger" data-action="self-eval" data-rating="Try again">Try again</button>
            </div>
          ` : ''}

          <form id="manual-answer-form" style="display:flex;gap:8px;margin-top:8px;">
            <input type="text" class="input" id="manual-answer-input" placeholder="${needManualInput ? 'チャット入力で英語回答を送信...' : '音声が使えない時はここに入力...'}" autocomplete="off" />
            <button type="submit" class="btn btn-secondary">送信</button>
          </form>
        </div>
      </div>
    `;
  }

  function renderWalking() {
    const sess = ui.session && ui.session.mode === 'walking' ? ui.session : null;
    const wakeSupported = voice && voice.capabilities.hasWakeLock;
    const isIOS = voice && voice.capabilities.isIOS;

    if (!sess) {
      return `
        <div class="page-header">
          <div>
            <h1 class="page-title">ウォーキングモード</h1>
            <p class="page-subtitle">画面を見ずに音声だけで連続トレーニング。Bluetoothイヤホン対応。</p>
          </div>
        </div>

        <div class="notice-box">
          <strong>モバイル環境での制約事項:</strong>
          ${wakeSupported ? 'このブラウザは Screen Wake Lock API に対応しており、開始中は画面の自動消灯を抑制します。' : 'このブラウザは Screen Wake Lock API に非対応のため、端末設定で画面消灯時間を延ばしてご利用ください。'}
          ${isIOS ? 'iPhone (iOS Safari) では画面ロック時やバックグラウンド移行時にブラウザ仕様で音声認識が停止します。画面をオンのままご利用ください。' : '画面ロック時やバックグラウンド時は OS・ブラウザ仕様により音声認識が停止する場合があります。'}
        </div>

        <div class="panel">
          <h2 class="section-heading">ウォーキング設定</h2>
          <div class="grid-2">
            <div class="field">
              <label class="field-label" for="walk-duration">学習時間</label>
              <select class="select" id="walk-duration">
                <option value="5">5分</option>
                <option value="10" selected>10分</option>
                <option value="15">15分</option>
                <option value="25">25分</option>
                <option value="0">時間無制限</option>
              </select>
            </div>
            <div class="field">
              <label class="field-label" for="walk-source">出題範囲</label>
              <select class="select" id="walk-source">
                <option value="weak">苦手問題・復習優先（なければ Level C）</option>
                ${Schema.LEVELS.map((l) => `<option value="level:${l.id}" ${l.id === ui.selectedLevel ? 'selected' : ''}>Level ${l.id}: ${esc(l.name)}</option>`).join('')}
              </select>
            </div>
          </div>

          <div class="panel-subtle" style="margin-bottom:18px;">
            <div style="font-size:13px;font-weight:600;margin-bottom:6px;">対応音声コマンド（発話待機中に単独で発話）</div>
            <div class="btn-row">
              <span class="tag tag-primary">Repeat（再読み上げ）</span>
              <span class="tag tag-primary">Skip（次へ）</span>
              <span class="tag tag-primary">Hint（正解読み上げ）</span>
              <span class="tag tag-primary">Pause（一時停止）</span>
            </div>
          </div>

          <button class="btn btn-primary btn-lg" data-action="start-walking">
            <i data-lucide="footprints"></i> ウォーキング学習を開始する
          </button>
        </div>
      `;
    }

    const q = currentQuestion();
    const fsm = sess.fsmState || VoiceLib.STATES.IDLE;
    const mm = sess.remainingSec !== null ? String(Math.floor(sess.remainingSec / 60)).padStart(2, '0') : '--';
    const ss = sess.remainingSec !== null ? String(sess.remainingSec % 60).padStart(2, '0') : '--';

    return `
      <div class="page-header">
        <div>
          <h1 class="page-title">ウォーキング中</h1>
          <p class="page-subtitle">${esc(sess.title)} ・ 第${sess.index + 1}問</p>
        </div>
        <button class="btn btn-secondary" data-action="exit-session">終了して進捗を保存</button>
      </div>

      <div class="walking-panel">
        <div style="font-size:12px;letter-spacing:0.12em;text-transform:uppercase;opacity:0.8;">
          ${sess.remainingSec !== null ? 'REMAINING TIME' : 'UNLIMITED MODE'}
        </div>
        <div id="walking-timer-readout" style="font-family:var(--font-serif);font-size:46px;font-weight:600;margin:4px 0 12px;">
          ${sess.remainingSec !== null ? `${mm}:${ss}` : `${formatDuration(sess.elapsedSec)}`}
        </div>

        <div class="waveform ${fsm === 'SPEAKING' ? 'speaking' : fsm === 'LISTENING' ? 'listening' : ''}">
          ${Array.from({ length: 9 }, () => '<div class="wave-bar" style="background:rgba(255,255,255,0.85);"></div>').join('')}
        </div>

        <div role="status" style="font-size:16px;font-weight:600;margin-bottom:8px;">
          ${esc(voiceStatus(sess))}
        </div>

        <div data-live-panel ${sess.interimTranscript || sess.lastTranscript ? '' : 'hidden'} style="background:rgba(255,255,255,0.12);border-radius:10px;padding:10px 14px;margin:12px auto;max-width:480px;font-size:14px;">
          <span data-live-transcript>${esc(sess.interimTranscript || sess.lastTranscript)}</span>
        </div>
        ${sess.errorBanner ? `<div role="status">${esc(sess.errorBanner)}</div>` : ''}

        ${sess.showText && q ? `<div style="margin:10px 0;font-family:var(--font-serif);font-size:20px;">${esc(q.expectedAnswer)}</div>` : ''}

        <div class="btn-row" style="justify-content:center;margin-top:24px;">
          ${micButton(sess, 'btn-walk-control')}
          <button class="btn btn-walk-control" data-action="toggle-pause">${sess.paused ? '再開' : '一時停止'}</button>
          <button class="btn btn-walk-control" data-action="repeat-prompt">Repeat</button>
          <button class="btn btn-walk-control" data-action="show-hint">Hint</button>
          <button class="btn btn-walk-control" data-action="skip-question">Skip</button>
        </div>
        ${!voice.capabilities.hasSTT || store.state.settings.inputFallbackMode !== 'auto' || sess.errorBanner ? `
          <form id="manual-answer-form" class="btn-row" style="justify-content:center;margin-top:12px;">
            <input class="input" id="manual-answer-input" aria-label="英語で回答" placeholder="英語で回答を入力" autocomplete="off" />
            <button type="submit" class="btn btn-walk-control">送信</button>
          </form>
        ` : ''}
      </div>
    `;
  }

  function renderDrills() {
    return `
      <div class="page-header">
        <div>
          <h1 class="page-title">20種ドリル選択</h1>
          <p class="page-subtitle">各ドリル専用の進行ロジックで、弱点や目的に特化した反復練習を行います。</p>
        </div>
        <div class="btn-row">
          <label style="font-size:13px;font-weight:600;color:var(--ink-secondary);">対象レベル:</label>
          <select class="select" style="width:auto;" id="drill-level-filter">
            <option value="ALL" ${ui.drillLevelFilter === 'ALL' ? 'selected' : ''}>全レベル横断 (A–T)</option>
            ${Schema.LEVELS.map((l) => `<option value="${l.id}" ${ui.drillLevelFilter === l.id ? 'selected' : ''}>Level ${l.id}: ${esc(l.name)}</option>`).join('')}
          </select>
        </div>
      </div>

      <div class="grid-2">
        ${Schema.DRILL_TYPES.map((d) => `
          <div class="panel" style="margin-bottom:0;display:flex;flex-direction:column;justify-content:space-between;">
            <div>
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;">
                <span class="tag tag-primary">Drill ${d.code}</span>
                <span class="tag">${esc(d.mode)}</span>
              </div>
              <h3 style="margin:0 0 4px;font-size:16px;color:var(--ink);">${esc(d.name)}</h3>
              <div style="font-size:13px;font-weight:600;color:var(--accent);margin-bottom:6px;">${esc(d.ja)}</div>
              <p style="margin:0 0 14px;font-size:13px;color:var(--ink-secondary);">${esc(d.desc)}</p>
            </div>
            <div>
              <button class="btn btn-secondary" style="width:100%;" data-action="start-drill" data-drill="${d.id}">このドリルを練習する</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  function renderWeakness(analytics) {
    const queue = Curriculum.buildWeakReviewQueue(store.state.questionStats, Date.now(), 20);
    const errEntries = Object.entries(analytics.errorBreakdown || {}).sort((a, b) => b[1] - a[1]);

    return `
      <div class="page-header">
        <div>
          <h1 class="page-title">苦手問題・間隔反復復習</h1>
          <p class="page-subtitle">1日・3日・7日・14日・30日の間隔反復と、同じ文法構造の別問題による定着トレーニング</p>
        </div>
        <button class="btn btn-primary" data-action="start-weak-review" ${queue.length === 0 ? 'disabled' : ''}>
          <i data-lucide="play"></i> 苦手・復習セッションを開始 (${queue.length}問)
        </button>
      </div>

      <div class="grid-2">
        <div class="panel">
          <h2 class="section-heading">誤りの傾向（文法カテゴリ別）</h2>
          ${errEntries.length === 0 ? `
            <p style="color:var(--ink-muted);font-size:14px;margin:0;">まだ誤りの記録はありません。レッスンを受講すると、三人称単数の-s・冠詞・前置詞・時制などの弱点が自動分類されます。</p>
          ` : errEntries.map(([cat, count]) => {
            const meta = Schema.GRAMMAR_CATEGORIES.find((g) => g.id === cat);
            return `
              <div class="list-row">
                <span>${esc(meta ? meta.name : cat)}</span>
                <span class="tag tag-warning">${count}回</span>
              </div>
            `;
          }).join('')}
        </div>

        <div class="panel">
          <h2 class="section-heading">復習対象キュー（類似構造の応用問題を含む）</h2>
          ${queue.length === 0 ? `
            <p style="color:var(--ink-muted);font-size:14px;margin:0;">現在復習期限を迎えている問題はありません。</p>
          ` : queue.slice(0, 10).map((q) => `
            <div class="list-row">
              <div style="min-width:0;">
                <div style="font-size:13px;font-weight:600;color:var(--ink);">${esc(q.expectedAnswer)}</div>
                <div style="font-size:12px;color:var(--ink-muted);">
                  Level ${q.level} ・ ${esc(Schema.DRILL_MAP[q.drillType]?.ja || q.drillType)}
                  ${q.isTransferPractice ? ' ・ <strong style="color:var(--primary);">同構造の別問題</strong>' : ''}
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  function renderLevelCheck() {
    const sess = ui.session && ui.session.mode === 'levelcheck' ? ui.session : null;
    const saved = store.state.levelCheckResult;

    if (sess && sess.stage !== 'summary') {
      return renderLesson();
    }

    const rec = (sess && sess.levelCheckRecommendation) || saved;
    return `
      <div class="page-header">
        <div>
          <h1 class="page-title">レベルチェック</h1>
          <p class="page-subtitle">文法・復唱・文型変換・英語質問の8問から、現在の推奨開始レベル（A〜T）を提案します。</p>
        </div>
        <button class="btn btn-primary" data-action="start-levelcheck">
          <i data-lucide="compass"></i> ${rec ? 'レベルチェックを再受験' : 'レベルチェックを開始'}
        </button>
      </div>

      ${rec ? `
        <div class="panel" style="border-left:3px solid var(--primary);">
          <div class="tag tag-primary" style="margin-bottom:10px;">診断結果</div>
          <h2 class="section-heading">推奨開始レベル: Level ${esc(rec.level)}（${esc(Schema.LEVEL_MAP[rec.level]?.name || '')}）</h2>
          <div class="grid-3" style="margin:14px 0 18px;">
            <div class="metric-cell">
              <div class="metric-label">正答率</div>
              <div class="metric-value">${rec.accuracy}%</div>
            </div>
            <div class="metric-cell">
              <div class="metric-label">平均回答完了時間</div>
              <div class="metric-value">${rec.avgSpeedSec !== null ? rec.avgSpeedSec + '秒' : '—'}</div>
            </div>
            <div class="metric-cell">
              <div class="metric-label">正答数</div>
              <div class="metric-value">${rec.passedCount} / ${rec.totalCount}</div>
            </div>
          </div>
          <p style="font-size:13px;color:var(--ink-muted);margin:0 0 16px;">
            ※このレベルは REPEAT 独自の難易度基準であり、QQEnglish の公式レベルとの一致を保証するものではありません。お好みのレベルから自由に学習を開始できます。
          </p>

    const decks = store.state.customDecks || [];

        <div class="grid-4">
          <div class="field">

          <div class="field">

              <div class="list-row">

          <p style="color:var(--ink-muted);font-size:14px;margin:0;">まだ取り込んだ教材はありません。</p>
        ` : decks.map((dk) => `
          <div class="list-row">
            <div>
              <div style="font-weight:600;">${esc(dk.title)}</div>

  function renderEditor() {
    const decks = store.state.customDecks || [];

    return `

        <div>

        </div>
        <div class="btn-row">
          <button class="btn btn-secondary" data-action="create-blank-deck">新規教材を作成</button>
          ${deck ? `<button class="btn btn-primary" data-action="play-custom-deck" data-deck-id="${esc(deck.id)}">この教材で学習</button>` : ''}
        </div>
      </div>

      ${!deck ? `
        <div class="panel">
          <p style="margin:0 0 14px;color:var(--ink-secondary);">編集可能な教材がありません。新規作成するか、教材取り込み画面からPDF・JSONを読み込んでください。</p>
          <div class="btn-row">
            <button class="btn btn-primary" data-action="create-blank-deck">新規教材を作成</button>

          <div class="grid-2">
            <div class="field">

            <div class="field">
              <label class="field-label" for="editor-deck-title">教材タイトル</label>
              <input type="text" class="input" id="editor-deck-title" value="${esc(deck.title)}" />
            </div>
          </div>
          <div class="btn-row">
            <button class="btn btn-secondary" data-action="editor-add-item">問題を追加</button>

                <input type="text" class="input ed-source" value="${esc(it.sourceSentence)}" />

              <div class="field">
                <label class="field-label">教師の指示 (Instruction)</label>
                <input type="text" class="input ed-inst" value="${esc(it.teacherInstruction)}" />
              </div>
              <div class="field">
                <label class="field-label">正解英文 (Expected Answer)</label>
                <input type="text" class="input ed-expected" value="${esc(it.expectedAnswer)}" />
              </div>
              <div class="field">
                <label class="field-label">ドリル種別</label>
                <select class="select ed-drill">
                  ${Schema.DRILL_TYPES.map((dt) => `<option value="${dt.id}" ${it.drillType === dt.id ? 'selected' : ''}>${esc(dt.code)}. ${esc(dt.ja)}</option>`).join('')}

  function renderAnalytics(analytics) {
    const series = ui.analyticsPeriod === 'daily'
      ? analytics.dailySeries.map((d) => ({ label: d.date.slice(5), value: Math.round(d.seconds / 60) }))
      : ui.analyticsPeriod === 'weekly'
        ? analytics.weeklySeries.map((w) => ({ label: w.label, value: Math.round(w.seconds / 60) }))
        : analytics.monthlySeries.map((m) => ({ label: m.label.slice(2), value: Math.round(m.seconds / 60) }));

    const maxVal = Math.max(1, ...series.map((s) => s.value));

    return `
      <div class="page-header">
        <div>
          <h1 class="page-title">学習分析</h1>
          <p class="page-subtitle">実測データのみから集計した学習記録と正答率の推移</p>
        </div>
      </div>

      <div class="grid-4" style="margin-bottom:20px;">
        <div class="metric-cell">
          <div class="metric-label">今日 / 累計学習時間</div>
          <div class="metric-value">${formatDuration(analytics.todaySec)}</div>
          <div class="metric-sub">累計 ${formatDuration(analytics.totalSec)}</div>
        </div>
        <div class="metric-cell">
          <div class="metric-label">総回答数 / 連続日数</div>
          <div class="metric-value">${analytics.totalAnswers}回</div>
          <div class="metric-sub">連続 ${analytics.streak}日</div>
        </div>
        <div class="metric-cell">
          <div class="metric-label">正答率 / 初回正答率</div>
          <div class="metric-value">${analytics.accuracy !== null ? analytics.accuracy + '%' : '—'}</div>
          <div class="metric-sub">初回 ${analytics.firstTryAccuracy !== null ? analytics.firstTryAccuracy + '%' : '—'}</div>
        </div>
        <div class="metric-cell">
          <div class="metric-label">平均回答開始 / 完了</div>
          <div class="metric-value">${analytics.avgStartSec !== null ? analytics.avgStartSec + 's' : '—'}</div>
          <div class="metric-sub">完了 ${analytics.avgCompleteSec !== null ? analytics.avgCompleteSec + 's' : '—'} ・ 復習待ち ${analytics.dueReviewCount}問</div>
        </div>
      </div>

      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px;">
          <h2 class="section-heading" style="margin:0;">学習時間の推移（分）</h2>
          <div class="btn-row">
            ${[['daily', '日別 (14日)'], ['weekly', '週別 (8週)'], ['monthly', '月別 (6ヶ月)']].map(([k, lbl]) => `
              <button class="btn ${ui.analyticsPeriod === k ? 'btn-primary' : 'btn-secondary'}" style="min-height:34px;padding:4px 12px;" data-action="analytics-period" data-period="${k}">${lbl}</button>
            `).join('')}
          </div>
        </div>
        <div class="bar-chart">
          ${series.map((s) => `
            <div class="bar-col" title="${esc(s.label)}: ${s.value}分">
              <div class="bar-rect" style="height:${s.value > 0 ? Math.max(8, Math.round((s.value / maxVal) * 120)) : 2}px;opacity:${s.value > 0 ? 1 : 0.25};"></div>
              <div class="bar-label">${esc(s.label)}</div>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="grid-2">
        <div class="panel">
          <h2 class="section-heading">ドリル別正答率</h2>
          ${Object.keys(analytics.byDrill).length === 0 ? `<p style="color:var(--ink-muted);font-size:14px;margin:0;">まだ実測データがありません。</p>` : Object.entries(analytics.byDrill).map(([id, st]) => {
            const pct = Math.round((st.passed / st.total) * 100);
            return `
              <div style="margin-bottom:12px;">
                <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
                  <span>${esc(Schema.DRILL_MAP[id]?.ja || id)}</span>
                  <strong>${pct}% (${st.passed}/${st.total})</strong>
                </div>
                <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
              </div>
            `;
          }).join('')}
        </div>

        <div class="panel">
          <h2 class="section-heading">文法別正答率</h2>
          ${Object.keys(analytics.byGrammar).length === 0 ? `<p style="color:var(--ink-muted);font-size:14px;margin:0;">まだ実測データがありません。</p>` : Object.entries(analytics.byGrammar).map(([id, st]) => {
            const pct = Math.round((st.passed / st.total) * 100);
            const meta = Schema.GRAMMAR_CATEGORIES.find((g) => g.id === id);
            return `
              <div style="margin-bottom:12px;">
                <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
                  <span>${esc(meta ? meta.name : id)}</span>
                  <strong>${pct}% (${st.passed}/${st.total})</strong>
                </div>
                <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
              </div>
            `;
          }).join('')}
        </div>
      </div>

      <div class="panel">
        <h2 class="section-heading">レベル別進捗率（A〜T）</h2>
        <div class="grid-4">
          ${Schema.LEVELS.map((lv) => {
            const done = Array.from({ length: 10 }, (_, i) => store.state.lessonProgress[`${lv.id}-${String(i + 1).padStart(2, '0')}`]).filter(Boolean).length;
            const pct = done * 10;
            return `
              <div style="padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);">
                <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px;">
                  <span>Level ${lv.id}</span>
                  <span>${pct}%</span>
                </div>
                <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }

  function renderCalendar() {
    const y = ui.calendarYear;
    const m = ui.calendarMonth;
    const firstDay = new Date(y, m, 1).getDay();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const daily = store.state.dailyStudySeconds || {};

    const cells = [];
    for (let i = 0; i < firstDay; i++) cells.push('<div class="cal-cell empty"></div>');
    for (let d = 1; d <= daysInMonth; d++) {
      const key = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const sec = daily[key] || 0;
      const mins = Math.round(sec / 60);
      const cls = sec === 0 ? '' : sec < 300 ? 'lv1' : sec < 900 ? 'lv2' : 'lv3';
      cells.push(`
        <div class="cal-cell ${cls}" title="${key}: ${formatDuration(sec)}">
          <strong>${d}</strong>
          ${sec > 0 ? `<span style="font-size:10px;">${mins > 0 ? mins + 'm' : sec + 's'}</span>` : ''}
        </div>
      `);
    }

    return `
      <div class="page-header">
        <div>
          <h1 class="page-title">学習カレンダー</h1>
          <p class="page-subtitle">毎日の実測学習時間を記録します</p>
        </div>
        <div class="btn-row">
          <button class="btn btn-secondary" data-action="cal-prev">前月</button>
          <span style="font-weight:600;min-width:100px;text-align:center;">${y}年 ${m + 1}月</span>
          <button class="btn btn-secondary" data-action="cal-next">翌月</button>
        </div>
      </div>

      <div class="panel">
        <div class="calendar-grid">
          ${['日', '月', '火', '水', '木', '金', '土'].map((w) => `<div class="cal-day-header">${w}</div>`).join('')}
          ${cells.join('')}
        </div>
      </div>
    `;
  }

    const s = store.state.settings;
    const voices = voice ? voice.getEnglishVoices(s.accent) : [];

    return `
      <div class="page-header">
        <div>
          <h1 class="page-title">設定</h1>
          <p class="page-subtitle">音声・評価・表示・バックアップをカスタマイズします。</p>
        </div>
      </div>

      <div class="panel">
        <h2 class="section-heading">音声・発話設定</h2>
        <div class="grid-2">
          <div class="field">
            <label class="field-label" for="set-accent">英語アクセント</label>
            <select class="select" id="set-accent">
              <option value="en-US" ${s.accent === 'en-US' ? 'selected' : ''}>アメリカ英語 (en-US)</option>
              <option value="en-GB" ${s.accent === 'en-GB' ? 'selected' : ''}>イギリス英語 (en-GB)</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label" for="set-voice">英語音声の選択</label>
            <select class="select" id="set-voice">
              <option value="">自動選択（推奨音声）</option>
              ${voices.map((v) => `<option value="${esc(v.voiceURI)}" ${s.voiceURI === v.voiceURI ? 'selected' : ''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label class="field-label" for="set-rate">読み上げ速度: <span id="rate-val">${s.speechRate}x</span></label>
            <input type="range" id="set-rate" min="0.6" max="1.5" step="0.05" value="${s.speechRate}" style="width:100%;" />
          </div>
          <div class="field">
            <label class="field-label" for="set-repeats">教師の読み上げ回数 (1–3回)</label>
            <select class="select" id="set-repeats">
              ${[1, 2, 3].map((n) => `<option value="${n}" ${Number(s.teacherRepeats) === n ? 'selected' : ''}>${n}回${n === 2 ? '（標準 TTSTS）' : ''}</option>`).join('')}
            </select>

          <div class="field">

          </div>

            <label class="field-label" for="set-silence">無音判定時間（秒）</label>
            <input type="number" class="input" id="set-silence" min="1.5" max="8" step="0.5" value="${s.silenceTimeoutSec}" />
          </div>
          <div class="field">
            <label class="field-label" for="set-retries">最大再回答回数</label>

              <option value="text" ${s.inputFallbackMode === 'text' ? 'selected' : ''}>文字入力モード</option>
              <option value="self" ${s.inputFallbackMode === 'self' ? 'selected' : ''}>自己採点モード</option>
            </select>

  function render() {
    applyTheme();
    const analytics = StoreLib.computeAnalytics(store.state);
    const navHtml = renderNavMarkup(analytics);

    const sidebarEl = document.getElementById('sidebar-nav');
    if (sidebarEl) sidebarEl.innerHTML = navHtml;

    const drawerEl = document.getElementById('mobile-drawer-nav');
    if (drawerEl) drawerEl.innerHTML = navHtml;

    const drawerWrap = document.getElementById('mobile-drawer-wrap');
    if (drawerWrap) drawerWrap.style.display = ui.mobileMenuOpen ? 'block' : 'none';

    document.querySelectorAll('.mobile-nav-btn').forEach((btn) => {
      const target = btn.getAttribute('data-nav');
      btn.classList.toggle('active', ui.route === target || (target === 'curriculum' && ui.route === 'lesson'));
    });

    const pageEl = document.getElementById('page-content');
    if (!pageEl) return;

    let html = '';
    switch (ui.route) {
      case 'home': html = renderHome(analytics); break;
      case 'curriculum': html = renderCurriculum(); break;
      case 'lesson': html = renderLesson(); break;
      case 'walking': html = renderWalking(); break;
      case 'drills': html = renderDrills(); break;
      case 'weakness': html = renderWeakness(analytics); break;
      case 'levelcheck': html = renderLevelCheck(); break;
      case 'import': html = renderImport(); break;
      case 'editor': html = renderEditor(); break;
      case 'analytics': html = renderAnalytics(analytics); break;
      case 'calendar': html = renderCalendar(); break;
      case 'settings': html = renderSettings(); break;
      default: html = renderHome(analytics);
    }

    pageEl.innerHTML = html;
    renderModal();
    if (typeof root.lucide !== 'undefined' && root.lucide.createIcons) {
      root.lucide.createIcons();
    }
    bindPageSpecificEvents();
  }

  // =========================================================================
  // EVENT HANDLERS
  // =========================================================================
  function bindPageSpecificEvents() {
    const manualForm = document.getElementById('manual-answer-form');
    if (manualForm) {
      manualForm.addEventListener('submit', (e) => {
        e.preventDefault();
        if (!ui.session || ui.session.paused) return;
        const inp = document.getElementById('manual-answer-input');
        const val = inp ? inp.value.trim() : '';
        if (!val) return;
        inp.value = '';
        voice.stopAll();
        processUserAnswer(val, {});
      });
    }

    const durSel = document.getElementById('lesson-duration-select');
    if (durSel) {
      durSel.addEventListener('change', (e) => {
        ui.lessonDuration = Number(e.target.value) || 15;
      });
    }

    const drillFilter = document.getElementById('drill-level-filter');
    if (drillFilter) {
      drillFilter.addEventListener('change', (e) => {
        ui.drillLevelFilter = e.target.value;
        render();
      });
    }

    // PDF Import handlers
    const pdfInput = document.getElementById('pdf-file-input');
    if (pdfInput) {
      pdfInput.addEventListener('change', async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        ui.importDraft.error = '';
        ui.importDraft.warnings = [];
        ui.importDraft.title = ui.importDraft.title || file.name.replace(/\.pdf$/i, '');
        const pageRange = (document.getElementById('import-page-range') || {}).value || '';
        try {
          const res = await PdfImporter.extractPdfTextByPage(file, pageRange);
          ui.importDraft.rawText = res.pages.map((p) => p.text).join('\n');
          showToast(`PDFから ${res.pages.length} ページ分を抽出しました。`);
        } catch (err) {
          ui.importDraft.error = err.message;
        }
        render();
      });
    }

    const jsonImportInput = document.getElementById('json-deck-import-input');
    if (jsonImportInput) {
      jsonImportInput.addEventListener('change', async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const deck = PdfImporter.importDeckJSON(text);
          store.saveCustomDeck(deck);
          showToast(`教材「${deck.title}」(${deck.items.length}問) を取り込みました。`);
          render();
        } catch (err) {
          ui.importDraft.error = err.message;
          render();
        }
      });
    }

    const editorDeckSelect = document.getElementById('editor-deck-select');
    if (editorDeckSelect) {
      editorDeckSelect.addEventListener('change', (e) => {
        ui.editingDeckId = e.target.value;
        render();
      });
    }

    // Settings live bindings
    const bindSetting = (id, key, transform = (v) => v) => {
      const el = document.getElementById(id);
      if (!el) return;
      const ev = el.type === 'range' ? 'input' : 'change';
      el.addEventListener(ev, () => {
        const val = el.type === 'checkbox' ? el.checked : transform(el.value);
        store.updateSettings({ [key]: val });
        if (key === 'speechRate') {
          const rv = document.getElementById('rate-val');
          if (rv) rv.textContent = `${val}x`;
        }
        if (key === 'theme' || key === 'accent') render();
      });
    };

    bindSetting('set-accent', 'accent');
    bindSetting('set-voice', 'voiceURI');
    bindSetting('set-rate', 'speechRate', Number);
    bindSetting('set-repeats', 'teacherRepeats', Number);
    bindSetting('set-wait', 'responseWaitSec', Number);
    bindSetting('set-silence', 'silenceTimeoutSec', Number);
    bindSetting('set-retries', 'maxRetries', Number);
    bindSetting('set-fallback', 'inputFallbackMode');
    bindSetting('set-auto-advance', 'autoAdvance');
    bindSetting('set-show-text', 'showTextDefault');
    bindSetting('set-show-ja', 'showJaExplanation');
    bindSetting('set-prioritize-weak', 'prioritizeWeak');
    bindSetting('set-scoring', 'scoringMode');
    bindSetting('set-theme', 'theme');

    const restoreInput = document.getElementById('restore-data-input');
    if (restoreInput) {
      restoreInput.addEventListener('change', async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          store.importJSON(text);
          showToast('学習データを復元しました。');
          render();
        } catch (err) {
          showToast('復元エラー: ' + err.message);
        }
      });
    }
  }

  function downloadJSON(filename, content) {
    const blob = new Blob([content], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function launchLesson(levelId, lessonNumber, startIndex = 0) {
    const lesson = Curriculum.getLesson(levelId, lessonNumber);
    const weakItems = store.state.settings.prioritizeWeak
      ? Curriculum.buildWeakReviewQueue(store.state.questionStats, Date.now(), 4)
      : [];
    const stages = DrillRunner.buildLessonPlanByDuration(lesson, weakItems, ui.lessonDuration);
    startSession({
      mode: 'lesson',
      title: `Level ${levelId} — ${lesson.title}`,
      levelId,
      lessonNumber,
      stages,
      startAtDrills: startIndex > 0,
      startIndex
    });
  }

  function bindGlobalClicks() {
    document.addEventListener('click', (e) => {
      const navBtn = e.target.closest('[data-nav]');
      if (navBtn) {
        navigate(navBtn.getAttribute('data-nav'));
        return;
      }

      const actBtn = e.target.closest('[data-action]');
      if (!actBtn) return;
      const action = actBtn.getAttribute('data-action');

      switch (action) {
        case 'switch-tutor': {
          ui.tutorId = ui.tutorId === 'claire' ? 'oliver' : 'claire';
          const nextAccent = ui.tutorId === 'oliver' ? 'en-GB' : 'en-US';
          store.updateSettings({ accent: nextAccent, voiceURI: '' });
          showToast(`担当講師を ${TutorAvatar.getTutor(ui.tutorId, nextAccent).name} (${nextAccent}) に切り替えました。`);
          render();
          break;
        }
        case 'toggle-mobile-menu':
          ui.mobileMenuOpen = !ui.mobileMenuOpen;
          render();
          break;
        case 'close-mobile-menu':
          ui.mobileMenuOpen = false;
          render();
          break;
        case 'select-level':
          ui.selectedLevel = actBtn.getAttribute('data-level');
          render();
          break;
        case 'quick-start-lesson':
          if (store.state.lastSession) {
            resumeCheckpoint();
          } else {
            launchLesson(ui.selectedLevel || 'C', 1);
          }
          break;
        case 'resume-checkpoint':
          resumeCheckpoint();
          break;
        case 'start-lesson':
          launchLesson(actBtn.getAttribute('data-level'), Number(actBtn.getAttribute('data-lesson')));
          break;
        case 'start-drill': {
          const drillId = actBtn.getAttribute('data-drill');
          const items = Curriculum.getQuestionsByDrill(drillId, ui.drillLevelFilter, 20);
          const meta = Schema.DRILL_MAP[drillId];
          startSession({
            mode: 'drill',
            title: `${meta ? meta.name : drillId} (${ui.drillLevelFilter})`,
            drillId,
            items
          });
          break;
        }
        case 'start-weak-review': {
          const queue = Curriculum.buildWeakReviewQueue(store.state.questionStats, Date.now(), 15);
          if (!queue.length) return;
          startSession({
            mode: 'weakness',
            title: '苦手問題・類似構造 復習セッション',
            items: queue
          });
          break;
        }
        case 'start-levelcheck': {
          const items = Curriculum.getLevelCheckItems();
          startSession({
            mode: 'levelcheck',
            title: 'レベルチェック診断 (全8問)',
            items
          });
          break;
        }
        case 'start-walking': {
          const durMin = Number((document.getElementById('walk-duration') || {}).value || 10);
          const src = (document.getElementById('walk-source') || {}).value || 'level:C';
          let items = [];
          let title = 'ウォーキング学習';
          if (src === 'weak') {
            items = Curriculum.buildWeakReviewQueue(store.state.questionStats, Date.now(), 20);
            if (!items.length) items = Curriculum.getLesson('C', 1).questions;
            title = 'ウォーキング（苦手優先）';
          } else {
            const lv = src.split(':')[1] || 'C';
            items = Curriculum.getLesson(lv, 1).questions;
            title = `ウォーキング（Level ${lv}）`;
          }
          startSession({
            mode: 'walking',
            title,
            items,
            walkingDurationMin: durMin
          });
          break;
        }
        case 'next-stage':
          advanceStage();
          break;
        case 'exit-session':
          stopActiveSession(true);
          ui.session = null;
          navigate('home');
          break;
        case 'toggle-pause':
          togglePauseSession();
          break;
        case 'listen-now':
          if (canStartMic(ui.session)) startListeningTurn();
          break;
        case 'repeat-prompt':
          if (ui.session && !ui.session.paused) {
            voice.stopAll();
            runCurrentQuestion();
          }
          break;
        case 'show-hint':
          if (ui.session) {
            ui.session.showHint = true;
            ui.session.showText = true;
            render();
          }
          break;
        case 'skip-question':
          goNextQuestion();
          break;
        case 'self-eval':
          submitSelfEvaluation(actBtn.getAttribute('data-rating'));
          break;
        case 'speak-sample':
          voice.stopAll();
          voice.speak(actBtn.getAttribute('data-text'), store.state.settings);
          break;
        case 'test-voice':
          voice.stopAll();
          voice.speak('Welcome to REPEAT English Speaking Lab. Listen carefully and repeat after me.', store.state.settings);
          break;
        case 'analytics-period':
          ui.analyticsPeriod = actBtn.getAttribute('data-period');
          render();
          break;
        case 'cal-prev':
          ui.calendarMonth -= 1;
          if (ui.calendarMonth < 0) { ui.calendarMonth = 11; ui.calendarYear -= 1; }
          render();
          break;
        case 'cal-next':
          ui.calendarMonth += 1;
          if (ui.calendarMonth > 11) { ui.calendarMonth = 0; ui.calendarYear += 1; }
          render();
          break;
        case 'parse-import-text': {
          ui.importDraft.title = (document.getElementById('import-deck-title') || {}).value || 'My Imported Material';
          ui.importDraft.pageRange = (document.getElementById('import-page-range') || {}).value || '';
          ui.importDraft.exerciseFilter = (document.getElementById('import-ex-filter') || {}).value || '';
          ui.importDraft.drillType = (document.getElementById('import-drill-type') || {}).value || 'repetition';
          ui.importDraft.orderMode = (document.getElementById('import-order-mode') || {}).value || 'sequential';
          ui.importDraft.rawText = (document.getElementById('import-raw-text') || {}).value || '';
          const parsed = PdfImporter.parseExercisesFromText(ui.importDraft.rawText, {
            exerciseFilter: ui.importDraft.exerciseFilter,
            defaultDrillType: ui.importDraft.drillType,
            sourceTitle: ui.importDraft.title
          });
          ui.importDraft.parsedItems = parsed.items;
          ui.importDraft.warnings = parsed.warnings;
          ui.importDraft.error = '';
          render();
          break;
        }
        case 'save-imported-deck': {
          if (!ui.importDraft.parsedItems.length) return;
          const deck = {
            id: `deck-${Date.now()}`,
            title: ui.importDraft.title || 'My Imported Material',
            orderMode: ui.importDraft.orderMode,
            resumeIndex: 0,
            createdAt: Date.now(),
            items: ui.importDraft.parsedItems
          };
          store.saveCustomDeck(deck);
          ui.importDraft.parsedItems = [];
          ui.importDraft.rawText = '';
          ui.importDraft.warnings = [];
          showToast(`教材「${deck.title}」を保存しました。`);
          render();
          break;
        }
        case 'load-sample-deck': {
          const sample = {
            id: `sample-${Date.now()}`,
            title: 'Sample TTSTS Commute Deck',
            orderMode: 'sequential',
            resumeIndex: 0,
            createdAt: Date.now(),
            items: [
              { id: 'S-01', level: 'CUSTOM', lessonNumber: 1, drillType: 'repetition', sourceSentence: 'I go to work by train.', teacherInstruction: 'Repeat the sentence.', expectedAnswer: 'I go to work by train.', acceptableAnswers: [], grammarCategory: 'third_person_s', difficulty: 1, hint: '', explanation: '', strictMaterialMode: true, sourceMaterial: 'Sample' },
              { id: 'S-02', level: 'CUSTOM', lessonNumber: 1, drillType: 'single_slot', sourceSentence: 'I go to work by train.', teacherInstruction: 'Change to by bus.', expectedAnswer: 'I go to work by bus.', acceptableAnswers: [], grammarCategory: 'prepositions', difficulty: 1, hint: '', explanation: '', strictMaterialMode: true, sourceMaterial: 'Sample' },
              { id: 'S-03', level: 'CUSTOM', lessonNumber: 1, drillType: 'single_slot', sourceSentence: 'I go to work by bus.', teacherInstruction: 'Change I to she.', expectedAnswer: 'She goes to work by bus.', acceptableAnswers: [], grammarCategory: 'third_person_s', difficulty: 1, hint: '', explanation: '', strictMaterialMode: true, sourceMaterial: 'Sample' },
              { id: 'S-04', level: 'CUSTOM', lessonNumber: 1, drillType: 'transformation', sourceSentence: 'She goes to work by bus.', teacherInstruction: 'Make it negative.', expectedAnswer: "She doesn't go to work by bus.", acceptableAnswers: ['She does not go to work by bus.'], grammarCategory: 'negation', difficulty: 1, hint: '', explanation: '', strictMaterialMode: true, sourceMaterial: 'Sample' }
            ]
          };
          store.saveCustomDeck(sample);
          showToast('サンプル教材を読み込みました。');
          render();
          break;
        }
        case 'play-custom-deck': {
          const deck = store.state.customDecks.find((d) => d.id === actBtn.getAttribute('data-deck-id'));
          if (!deck || !deck.items.length) return;
          const items = deck.orderMode === 'shuffle' ? [...deck.items].sort(() => Math.random() - 0.5) : deck.items;
          startSession({
            mode: 'custom',
            title: deck.title,
            deckId: deck.id,
            items,
            startIndex: deck.resumeIndex < items.length ? deck.resumeIndex : 0
          });
          break;
        }
        case 'edit-custom-deck':
          navigate('editor', { editingDeckId: actBtn.getAttribute('data-deck-id') });
          break;
        case 'export-custom-deck': {
          const deck = store.state.customDecks.find((d) => d.id === actBtn.getAttribute('data-deck-id'));
          if (!deck) return;
          downloadJSON(`${deck.title.replace(/\s+/g, '_')}.json`, PdfImporter.exportDeckJSON(deck));
          break;
        }
        case 'delete-custom-deck': {
          const deckId = actBtn.getAttribute('data-deck-id');
          showModal({
            title: '教材を削除しますか？',
            body: '削除した教材は元に戻せません（必要に応じて先にJSONエクスポートしてください）。',
            confirmLabel: '削除する',
            danger: true,
            onConfirm: () => {
              store.deleteCustomDeck(deckId);
              if (ui.editingDeckId === deckId) ui.editingDeckId = null;
              closeModal();
              showToast('教材を削除しました。');
              render();
            }
          });
          break;
        }
        case 'create-blank-deck': {
          const deck = {
            id: `deck-${Date.now()}`,
            title: '新しいオリジナル教材',
            orderMode: 'sequential',
            resumeIndex: 0,
            createdAt: Date.now(),
            items: [
              { id: `ED-${Date.now()}-1`, level: 'CUSTOM', lessonNumber: 1, drillType: 'repetition', sourceSentence: 'I review the schedule every morning.', teacherInstruction: 'Repeat the sentence.', expectedAnswer: 'I review the schedule every morning.', acceptableAnswers: [], grammarCategory: 'third_person_s', difficulty: 1, hint: '', explanation: '', strictMaterialMode: true, sourceMaterial: 'User Created' }
            ]
          };
          store.saveCustomDeck(deck);
          ui.editingDeckId = deck.id;
          render();
          break;
        }
        case 'editor-add-item': {
          const deck = store.state.customDecks.find((d) => d.id === ui.editingDeckId);
          if (!deck) return;
          collectEditorValues(deck);
          deck.items.push({
            id: `ED-${Date.now()}-${deck.items.length + 1}`,
            level: 'CUSTOM', lessonNumber: 1, drillType: 'repetition',
            sourceSentence: '', teacherInstruction: '', expectedAnswer: '',
            acceptableAnswers: [], grammarCategory: 'fluency_open', difficulty: 2,
            hint: '', explanation: '', strictMaterialMode: true, sourceMaterial: deck.title
          });
          store.saveCustomDeck(deck);
          render();
          break;
        }
        case 'editor-remove-item': {
          const deck = store.state.customDecks.find((d) => d.id === ui.editingDeckId);
          if (!deck) return;
          collectEditorValues(deck);
          deck.items.splice(Number(actBtn.getAttribute('data-idx')), 1);
          store.saveCustomDeck(deck);
          render();
          break;
        }
        case 'editor-save-deck': {
          const deck = store.state.customDecks.find((d) => d.id === ui.editingDeckId);
          if (!deck) return;
          collectEditorValues(deck);
          store.saveCustomDeck(deck);
          showToast('教材の変更を保存しました。');
          render();
          break;
        }
        case 'backup-data':
          downloadJSON(`repeat-backup-${StoreLib.toDateKey(Date.now())}.json`, store.exportJSON());
          showToast('バックアップJSONを保存しました。');
          break;
        case 'reset-all-data':
          showModal({
            title: '全学習データを初期化しますか？',
            body: '学習履歴・苦手問題・取り込んだ教材・設定がすべて消去されます。',
            confirmLabel: '初期化する',
            danger: true,
            onConfirm: () => {
              store.resetAll();
              ui.session = null;
              closeModal();
              showToast('全データを初期化しました。');
              render();
            }
          });
          break;
        case 'modal-cancel':
          closeModal();
          break;
        case 'modal-confirm':
          if (ui.modal && ui.modal.onConfirm) ui.modal.onConfirm();
          break;
      }
    });
  }

  function collectEditorValues(deck) {
    const titleEl = document.getElementById('editor-deck-title');
    if (titleEl) deck.title = titleEl.value.trim() || deck.title;
    document.querySelectorAll('[data-editor-item]').forEach((card) => {
      const idx = Number(card.getAttribute('data-editor-item'));
      const item = deck.items[idx];
      if (!item) return;
      item.sourceSentence = card.querySelector('.ed-source').value.trim();
      item.teacherInstruction = card.querySelector('.ed-inst').value.trim();
      item.expectedAnswer = card.querySelector('.ed-expected').value.trim();
      item.drillType = card.querySelector('.ed-drill').value;
    });
  }

  function resumeCheckpoint() {
    const cp = store.state.lastSession;
    if (!cp) return;
    if (cp.levelId && cp.lessonNumber) {
      launchLesson(cp.levelId, cp.lessonNumber, cp.questionIndex || 0);
    } else if (cp.deckId) {
      const deck = store.state.customDecks.find((d) => d.id === cp.deckId);
      if (deck) {
        startSession({ mode: 'custom', title: deck.title, deckId: deck.id, items: deck.items, startIndex: cp.questionIndex || 0 });
      }
    } else if (cp.drillId) {
      const items = Curriculum.getQuestionsByDrill(cp.drillId, 'ALL', 20);
      startSession({ mode: 'drill', title: cp.title, drillId: cp.drillId, items, startIndex: cp.questionIndex || 0 });
    }
  }

  async function initApp() {
    await store.init();
    voice = new VoiceLib.VoiceEngine({
      onStateChange: (nextState) => {
        if (ui.session) {
          ui.session.fsmState = nextState;
          if (ui.route === 'lesson' || ui.route === 'walking' || ui.route === 'levelcheck') {
            render();
          }
        }
      },
      onInterimTranscript: (text) => {
        if (ui.session) {
          ui.session.interimTranscript = text;
          const live = document.querySelector('[data-live-transcript]');
          if (live) {
            live.textContent = text;
            live.closest('[data-live-panel]').hidden = !text;
            const log = live.closest('.session-log');
            if (log) log.scrollTop = log.scrollHeight;
          }
        }
      },
      onError: (err) => {
        if (ui.session && ['lesson', 'walking', 'levelcheck'].includes(ui.route)) {
          ui.session.errorBanner = err.message;
          if (err.type === 'tts_error') ui.session.showText = true;
        } else showToast(err.message);
      }
    });

    bindGlobalClicks();
    render();

    // Register Service Worker safely when hosted over HTTP(S) (GitHub Pages / localhost)
    if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  }

  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  }
})(typeof window !== 'undefined' ? window : globalThis);

  </script>
</body>
</html>
