<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1B4332" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>REPEAT – English Speaking Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
/* REPEAT – English Speaking Lab
 * Editorial Premium Language Learning UI
 * Palette: Ivory / Off-white + Deep Forest Green + Sage Green + Dark Mode
 * Zero gradients, zero emojis, zero flashy shadows, iOS Safari safe-area compliant
 */

:root {
  --bg: #F7F5F0;
  --bg-subtle: #EFECE4;
  --surface: #FFFFFF;
  --surface-hover: #FAF9F5;
  --primary: #1B4332;
  --primary-hover: #143326;
  --primary-soft: #E8F0EC;
  --accent: #52796F;
  --accent-soft: #EDF3F0;
  --ink: #1C2320;
  --ink-secondary: #4D5852;
  --ink-muted: #76827B;
  --border: #DEDAD0;
  --border-strong: #C8C3B6;
  --success: #2D6A4F;
  --success-bg: #E9F3EE;
  --warning: #8C6223;
  --warning-bg: #FBF4E6;
  --danger: #9B2C2C;
  --danger-bg: #FCEEEE;
  --neutral-bg: #ECEAE2;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --font-sans: 'Manrope', 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-serif: 'Newsreader', 'Cormorant Garamond', Georgia, serif;
  --nav-height: 64px;
  --sidebar-width: 248px;
}

[data-theme="dark"] {
  --bg: #111614;
  --bg-subtle: #18201C;
  --surface: #1B2420;
  --surface-hover: #222D28;
  --primary: #7CA998;
  --primary-hover: #96BEAE;
  --primary-soft: #21322B;
  --accent: #95B8AA;
  --accent-soft: #1F2D27;
  --ink: #EDEBE4;
  --ink-secondary: #B7C0BA;
  --ink-muted: #84918A;
  --border: #2B3731;
  --border-strong: #3C4D45;
  --success: #74C69D;
  --success-bg: #1C3128;
  --warning: #E0B268;
  --warning-bg: #2E261A;
  --danger: #E68A8A;
  --danger-bg: #321E1E;
  --neutral-bg: #232D28;
}

*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background-color: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  width: 100%;
}

/* Prevent iOS Safari input auto-zoom */
input, select, textarea, button {
  font-family: inherit;
  font-size: 16px;
}

a {
  color: var(--primary);
  text-decoration: none;
}

/* Layout Shell */
.app-shell {
  display: flex;
  min-height: 100dvh;
  width: 100%;
  overflow-x: hidden;
}

.sidebar {
  width: var(--sidebar-width);
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 24px 16px;
  position: sticky;
  top: 0;
  height: 100dvh;
  overflow-y: auto;
}

.brand {
  padding: 4px 12px 24px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}

.brand-mark {
  font-family: var(--font-serif);
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--primary);
  line-height: 1.1;
}

.brand-sub {
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-top: 4px;
}

.nav-section-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-muted);
  padding: 12px 12px 6px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px 12px;
  margin-bottom: 2px;
  border: none;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--ink-secondary);
  font-size: 14px;
  font-weight: 500;
  text-align: left;
  cursor: pointer;
  transition: background-color 0.15s ease, color 0.15s ease;
}

.nav-item:hover {
  background: var(--bg-subtle);
  color: var(--ink);
}

.nav-item.active {
  background: var(--primary-soft);
  color: var(--primary);
  font-weight: 600;
}

.nav-item svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}

.nav-badge {
  margin-left: auto;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--primary);
  color: #FFFFFF;
}

[data-theme="dark"] .nav-badge {
  color: #111614;
}

/* Main Content */
.main-area {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.mobile-topbar {
  display: none;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  padding-top: calc(12px + env(safe-area-inset-top));
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 30;
}

.page-container {
  width: 100%;
  max-width: 980px;
  margin: 0 auto;
  padding: 32px 28px 64px;
}

.page-header {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 28px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

.page-title {
  font-family: var(--font-serif);
  font-size: 30px;
  font-weight: 500;
  line-height: 1.2;
  margin: 0;
  color: var(--ink);
}

.page-subtitle {
  margin: 6px 0 0;
  font-size: 14px;
  color: var(--ink-secondary);
}

/* Typography & Surfaces */
.section-heading {
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 500;
  margin: 0 0 14px;
  color: var(--ink);
}

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 22px;
  margin-bottom: 20px;
}

.panel-subtle {
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 18px 20px;
}

/* Grid Helpers */
.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.grid-4 {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
}

/* Metrics */
.metric-cell {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 18px 20px;
}

.metric-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-muted);
  margin-bottom: 6px;
}

.metric-value {
  font-family: var(--font-serif);
  font-size: 28px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.15;
}

.metric-sub {
  font-size: 12px;
  color: var(--ink-secondary);
  margin-top: 4px;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  white-space: nowrap;
  min-height: 42px;
}

.btn:disabled {
  opacity: 0.48;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--primary);
  color: #FFFFFF;
}

[data-theme="dark"] .btn-primary {
  color: #111614;
}

.btn-primary:hover:not(:disabled) {
  background: var(--primary-hover);
}

.btn-secondary {
  background: var(--surface);
  border-color: var(--border-strong);
  color: var(--ink);
}

.btn-secondary:hover:not(:disabled) {
  background: var(--bg-subtle);
}

.btn-ghost {
  background: transparent;
  color: var(--ink-secondary);
  padding: 8px 12px;
}

.btn-ghost:hover:not(:disabled) {
  background: var(--bg-subtle);
  color: var(--ink);
}

.btn-danger {
  background: var(--danger-bg);
  color: var(--danger);
  border-color: transparent;
}

.btn-lg {
  padding: 14px 24px;
  font-size: 15px;
  min-height: 48px;
}

.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}

/* Tags & Badges */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--bg-subtle);
  color: var(--ink-secondary);
}

.tag-primary {
  background: var(--primary-soft);
  color: var(--primary);
}

.tag-success {
  background: var(--success-bg);
  color: var(--success);
}

.tag-warning {
  background: var(--warning-bg);
  color: var(--warning);
}

.tag-danger {
  background: var(--danger-bg);
  color: var(--danger);
}

/* Form Controls */
.field {
  margin-bottom: 16px;
}

.field-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 6px;
}

.field-hint {
  font-size: 12px;
  color: var(--ink-muted);
  margin-top: 4px;
}

.input, .select, .textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--ink);
  outline: none;
  transition: border-color 0.15s ease;
}

.input:focus, .select:focus, .textarea:focus {
  border-color: var(--primary);
}

.textarea {
  min-height: 110px;
  resize: vertical;
  line-height: 1.55;
}

/* Toggle Switch */
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}

.toggle-row:last-child {
  border-bottom: none;
}

.switch {
  position: relative;
  display: inline-block;
  width: 44px;
  height: 24px;
  flex-shrink: 0;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.switch-slider {
  position: absolute;
  inset: 0;
  background: var(--border-strong);
  border-radius: 999px;
  cursor: pointer;
  transition: background-color 0.2s ease;
}

.switch-slider::before {
  content: '';
  position: absolute;
  width: 18px;
  height: 18px;
  left: 3px;
  top: 3px;
  background: #FFFFFF;
  border-radius: 50%;
  transition: transform 0.2s ease;
}

.switch input:checked + .switch-slider {
  background: var(--primary);
}

.switch input:checked + .switch-slider::before {
  transform: translateX(20px);
}

/* Voice Stage & Waveform Visualizer */
.voice-stage {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 32px 24px;
  text-align: center;
  margin-bottom: 20px;
}

.state-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  background: var(--bg-subtle);
  color: var(--ink-secondary);
  margin-bottom: 20px;
}

.state-pill.speaking {
  background: var(--primary-soft);
  color: var(--primary);
}

.state-pill.listening {
  background: var(--success-bg);
  color: var(--success);
}

.state-pill.correcting {
  background: var(--warning-bg);
  color: var(--warning);
}

.state-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
}

.waveform {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 54px;
  margin: 12px auto 22px;
}

.wave-bar {
  width: 4px;
  height: 12px;
  border-radius: 999px;
  background: var(--border-strong);
  transition: height 0.15s ease, background-color 0.2s ease;
}

.waveform.speaking .wave-bar {
  background: var(--primary);
  animation: wavePulse 0.9s ease-in-out infinite;
}

.waveform.listening .wave-bar {
  background: var(--accent);
  animation: waveListen 0.65s ease-in-out infinite;
}

.waveform .wave-bar:nth-child(2) { animation-delay: 0.1s; }
.waveform .wave-bar:nth-child(3) { animation-delay: 0.22s; }
.waveform .wave-bar:nth-child(4) { animation-delay: 0.34s; }
.waveform .wave-bar:nth-child(5) { animation-delay: 0.16s; }
.waveform .wave-bar:nth-child(6) { animation-delay: 0.28s; }
.waveform .wave-bar:nth-child(7) { animation-delay: 0.08s; }
.waveform .wave-bar:nth-child(8) { animation-delay: 0.24s; }
.waveform .wave-bar:nth-child(9) { animation-delay: 0.12s; }

@keyframes wavePulse {
  0%, 100% { height: 10px; }
  50% { height: 42px; }
}

@keyframes waveListen {
  0%, 100% { height: 14px; }
  50% { height: 48px; }
}

.prompt-cue {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  margin: 0 auto 10px;
  max-width: 600px;
}

.masked-text-notice {
  display: inline-block;
  padding: 10px 16px;
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--ink-muted);
  margin: 8px 0 14px;
}

.revealed-sentence {
  font-family: var(--font-serif);
  font-size: 24px;
  line-height: 1.4;
  color: var(--ink);
  margin: 10px auto 14px;
  max-width: 640px;
}

.transcript-box {
  background: var(--bg-subtle);
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  margin: 14px auto;
  max-width: 600px;
  font-size: 15px;
  color: var(--ink);
  min-height: 46px;
}

.feedback-banner {
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  margin: 14px auto;
  max-width: 620px;
  text-align: left;
  font-size: 14px;
}

.feedback-banner.perfect { background: var(--success-bg); color: var(--success); }
.feedback-banner.almost { background: var(--warning-bg); color: var(--warning); }
.feedback-banner.try_again { background: var(--danger-bg); color: var(--danger); }
.feedback-banner.not_evaluated { background: var(--neutral-bg); color: var(--ink-secondary); }

/* Jumbled Tokens */
.token-list {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin: 14px 0;
}

.token-chip {
  padding: 6px 14px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  background: var(--bg);
  font-weight: 600;
  font-size: 15px;
}

/* Progress Bar */
.progress-track {
  width: 100%;
  height: 6px;
  background: var(--bg-subtle);
  border-radius: 999px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--primary);
  border-radius: 999px;
  transition: width 0.25s ease;
}

/* Level List & Tables */
.list-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  transition: background-color 0.12s ease;
}

.list-row:last-child {
  border-bottom: none;
}

.list-row:hover {
  background: var(--surface-hover);
}

.level-letter {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-sm);
  background: var(--primary-soft);
  color: var(--primary);
  font-family: var(--font-serif);
  font-size: 20px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* Calendar Heatmap */
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 6px;
}

.cal-day-header {
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-muted);
  padding-bottom: 4px;
}

.cal-cell {
  aspect-ratio: 1;
  border-radius: 8px;
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  background: var(--surface);
  color: var(--ink-secondary);
}

.cal-cell.empty {
  border-color: transparent;
  background: transparent;
}

.cal-cell.lv1 { background: #DCEAE2; color: #1B4332; border-color: #B8D4C5; }
.cal-cell.lv2 { background: #95BDA8; color: #143326; border-color: #7AA990; }
.cal-cell.lv3 { background: #1B4332; color: #FFFFFF; border-color: #1B4332; }

[data-theme="dark"] .cal-cell.lv1 { background: #1F342A; color: #A8CBB9; border-color: #2B4739; }
[data-theme="dark"] .cal-cell.lv2 { background: #2D5241; color: #E2F0E8; border-color: #3D6C56; }
[data-theme="dark"] .cal-cell.lv3 { background: #7CA998; color: #111614; border-color: #7CA998; }

/* Simple Bar Chart (Zero external dependency required, crisp SVG/CSS) */
.bar-chart {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  height: 160px;
  padding-top: 16px;
  border-bottom: 1px solid var(--border);
}

.bar-col {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100%;
  justify-content: flex-end;
}

.bar-rect {
  width: 100%;
  max-width: 32px;
  background: var(--primary);
  border-radius: 4px 4px 0 0;
  min-height: 2px;
  transition: height 0.25s ease;
}

.bar-label {
  font-size: 10px;
  color: var(--ink-muted);
  margin-top: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

/* Walking Mode Full-Focus Panel */
.walking-panel {
  background: var(--primary);
  color: #F7F5F0;
  border-radius: var(--radius-lg);
  padding: 36px 24px;
  text-align: center;
}

[data-theme="dark"] .walking-panel {
  background: #182921;
  border: 1px solid var(--border-strong);
  color: #EDEBE4;
}

.walking-panel .btn-walk-control {
  background: rgba(255, 255, 255, 0.14);
  color: #FFFFFF;
  border: 1px solid rgba(255, 255, 255, 0.28);
  min-height: 54px;
  font-size: 15px;
  padding: 12px 20px;
}

.walking-panel .btn-walk-control:hover {
  background: rgba(255, 255, 255, 0.24);
}

/* Notice Callout */
.notice-box {
  padding: 14px 16px;
  border-left: 3px solid var(--accent);
  background: var(--accent-soft);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-size: 13px;
  color: var(--ink-secondary);
  margin-bottom: 16px;
}

/* Toast & Modal */
.toast-container {
  position: fixed;
  bottom: calc(20px + env(safe-area-inset-bottom));
  right: 20px;
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 360px;
}

.toast {
  background: var(--ink);
  color: var(--bg);
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(20, 28, 24, 0.55);
  z-index: 90;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 24px;
  max-width: 460px;
  width: 100%;
}

/* Mobile Bottom Nav */
.mobile-bottom-nav {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  z-index: 40;
  justify-content: space-around;
}

.mobile-nav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  border: none;
  background: transparent;
  color: var(--ink-muted);
  font-size: 11px;
  font-weight: 500;
  padding: 6px 8px;
  cursor: pointer;
}

/* Online 1-on-1 Lesson Studio & Animated Tutor */
.lesson-room-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 0.95fr);
  gap: 18px;
  align-items: start;
}

.lesson-video-room {
  position: relative;
  border-radius: var(--radius-lg);
  overflow: hidden;
  border: 1px solid var(--border-strong);
  background: #EDE9DF;
  aspect-ratio: 16 / 10;
  width: 100%;
}

[data-theme="dark"] .lesson-video-room {
  background: #1A231F;
}

.tutor-svg {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.tutor-body {
  transform-origin: 200px 240px;
  animation: tutorBreathe 4.6s ease-in-out infinite;
}

.tutor-eyes {
  transform-origin: 200px 113px;
  animation: tutorBlink 4.4s ease-in-out infinite;
}

.tutor-mouth-talk {
  display: none;
  transform-origin: 200px 140px;
}

.tutor-speaking .tutor-mouth-rest {
  display: none;
}

.tutor-speaking .tutor-mouth-talk {
  display: block;
  animation: tutorLipSync 0.34s ease-in-out infinite alternate;
}

.tutor-speaking .tutor-head {
  transform-origin: 200px 160px;
  animation: tutorSpeakHead 1.8s ease-in-out infinite;
}

.tutor-listening .tutor-head {
  transform-origin: 200px 160px;
  animation: tutorListenNod 2.6s ease-in-out infinite;
}

.tutor-happy .tutor-head {
  transform-origin: 200px 160px;
  animation: tutorHappyNod 0.7s ease-in-out 2;
}

.tutor-paused .tutor-body,
.tutor-paused .tutor-eyes,
.tutor-paused .tutor-head {
  animation: none;
}

@keyframes tutorBreathe {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-2px); }
}

@keyframes tutorBlink {
  0%, 92%, 100% { transform: scaleY(1); }
  96% { transform: scaleY(0.08); }
}

@keyframes tutorLipSync {
  0% { transform: scaleY(0.45) scaleX(0.95); }
  45% { transform: scaleY(1.12) scaleX(1.02); }
  100% { transform: scaleY(0.68) scaleX(0.98); }
}

@keyframes tutorSpeakHead {
  0%, 100% { transform: rotate(0deg) translateY(0); }
  35% { transform: rotate(-1.3deg) translateY(-1px); }
  70% { transform: rotate(1.1deg) translateY(0.5px); }
}

@keyframes tutorListenNod {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  45% { transform: translateY(3px) rotate(1deg); }
  65% { transform: translateY(0) rotate(0deg); }
}

@keyframes tutorHappyNod {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(4px); }
}

      const targetHeard = targetWord ? actualTokens.includes(targetWord) : bestMatch;

      return {
        rating: bestMatch ? 'Perfect' : targetHeard ? 'Almost' : 'Not evaluated',
        isCorrect: bestMatch,
        passed: bestMatch || targetHeard,
        needsSelfEval: !bestMatch,
        similarity: bestMatch ? 1 : targetHeard ? 0.85 : 0.5,
        normalizedActual: normActual,
        normalizedExpected: normalizeText(question.expectedAnswer || ''),
        errorCategories: targetHeard ? [] : ['pronunciation_ref'],
        feedback: bestMatch
          ? `音声認識の参考結果が目標文と一致しました（発音の正確性スコアではなく聞き取り結果の参考表示です）。`
          : `聞き取り参考結果: "${transcript}"。専用の発音評価エンジンではないため、お手本音声と聞き比べて自己確認してください。`,
        details: [],
        isReferenceOnly: true
      };
    }

    // 4. Standard / Strict Grammar-Checked Drills
    const candidates = [question.expectedAnswer, ...(question.acceptableAnswers || [])].filter(Boolean);
    let best = null;

    for (const cand of candidates) {
      const normExp = normalizeText(cand);
      const expTokens = tokenize(normExp);
      const diff = diffTokens(expTokens, actualTokens);
      const maxLen = Math.max(expTokens.length, actualTokens.length, 1);
      const similarity = Math.max(0, 1 - diff.distance / maxLen);

      if (!best || diff.distance < best.diff.distance) {
        best = { cand, normExp, expTokens, diff, similarity };
      }
    }

    if (!best) {
      return {
        rating: 'Not evaluated',
        isCorrect: false,
        passed: false,
        similarity: 0,
        normalizedActual: normActual,
        normalizedExpected: '',
        errorCategories: [],
        feedback: '正解データが設定されていないため未評価としました。',
        details: [],
        isReferenceOnly: false
      };
    }

    // Exact normalized match -> Perfect
    if (best.diff.distance === 0) {
      return {
        rating: 'Perfect',
        isCorrect: true,
        passed: true,
        similarity: 1,
        normalizedActual: normActual,
        normalizedExpected: best.normExp,
        errorCategories: [],
        feedback: '正確です。次の問題へ進みます。',
        details: [],
        diffOps: best.diff.ops,
        isReferenceOnly: false
      };
    }

    const grammarAnalysis = detectGrammarErrors(best.expTokens, actualTokens, best.diff);
    const hasCriticalGrammarError = grammarAnalysis.categories.some((c) =>
      ['third_person_s', 'articles', 'prepositions', 'tense', 'singular_plural', 'word_order', 'auxiliaries', 'negation', 'missing_word', 'extra_word'].includes(c)
    );

    // Almost vs Try again
    // In strict mode: any grammar error is Try again; only minor non-grammar 1-word diff with high similarity is Almost
    // In standard mode: 1 small error on a longer sentence (>=5 words) is Almost (still asks for correction or lets user hear correct form)
    const isAlmost =
      mode === 'standard'
        ? best.diff.distance === 1 && best.expTokens.length >= 5 && !grammarAnalysis.categories.includes('negation') && !grammarAnalysis.categories.includes('tense') && !grammarAnalysis.categories.includes('third_person_s')
        : best.diff.distance === 1 && !hasCriticalGrammarError && best.similarity >= 0.85;

    if (isAlmost) {
      return {
        rating: 'Almost',
        isCorrect: false,
        passed: false,
        similarity: Number(best.similarity.toFixed(2)),
        normalizedActual: normActual,
        normalizedExpected: best.normExp,
        errorCategories: grammarAnalysis.categories,
        feedback: grammarAnalysis.details.length
          ? `惜しいです。${grammarAnalysis.details[0].message}`
          : '惜しいです。正しい英文を聞いてもう一度発話してください。',
        details: grammarAnalysis.details,
        diffOps: best.diff.ops,
        isReferenceOnly: false
      };
    }

    return {
      rating: 'Try again',
      isCorrect: false,
      passed: false,
      similarity: Number(best.similarity.toFixed(2)),
      normalizedActual: normActual,
      normalizedExpected: best.normExp,
      errorCategories: grammarAnalysis.categories.length ? grammarAnalysis.categories : ['word_choice'],
      feedback: grammarAnalysis.details.length
        ? grammarAnalysis.details.slice(0, 2).map((d) => d.message).join(' / ')
        : '正解の英文を確認して、もう一度発話してください。',
      details: grammarAnalysis.details,
      diffOps: best.diff.ops,
      isReferenceOnly: false
    };
  }

  const api = {
    normalizeText,
    tokenize,
    diffTokens,
    detectGrammarErrors,
    evaluateAnswer
  };

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = api;
  } else {
    root.RepeatEvaluator = api;
  }
})(typeof window !== 'undefined' ? window : globalThis);


// ===== js/srs-store.js =====
/**
 * REPEAT – English Speaking Lab
 * Persistence (IndexedDB + LocalStorage fallback), SRS Scheduler (1, 3, 7, 14, 30 days),
 * Weakness Analysis, and Real-Data-Only Analytics Aggregator.
 */
(function (root) {
  'use strict';

  const STORAGE_KEY = 'repeat_speaking_lab_state_v1';
  const DB_NAME = 'RepeatSpeakingLabDB';
  const DB_VERSION = 1;
  const STORE_NAME = 'appState';
  const SRS_INTERVALS_DAYS = [1, 3, 7, 14, 30];

  const DEFAULT_SETTINGS = {
    voiceURI: '',
    accent: 'en-US', // 'en-US' | 'en-GB'
    speechRate: 1.0, // 0.6 – 1.5
    teacherRepeats: 2, // 1 – 3
    responseWaitSec: 8, // 3 – 20
    silenceTimeoutSec: 3.5, // 1.5 – 8
    maxRetries: 3, // 1 – 5
    autoAdvance: true,
    showTextDefault: false,
    showJaExplanation: true,
    scoringMode: 'standard', // 'standard' | 'strict'
    prioritizeWeak: true,
    theme: 'light', // 'light' | 'dark'
    inputFallbackMode: 'auto' // 'auto' | 'text' | 'self'
  };

  function createEmptyState() {
    return {
      version: 1,
      settings: { ...DEFAULT_SETTINGS },
      // Per-question stats keyed by questionId
      questionStats: {},
      // Lesson completion & resume checkpoints
      lessonProgress: {},
      lastSession: null, // { type, levelId, lessonNumber, drillId, deckId, questionIndex, updatedAt }
      // Real measured study attempts (never seeded with fake data)
      attemptLogs: [],
      // Daily study time in seconds keyed by YYYY-MM-DD
      dailyStudySeconds: {},
      // Custom imported decks (PDF or JSON)
      customDecks: [],
      // Level check history
      levelCheckResult: null
    };
  }

  /**
   * Pure SRS scheduling calculation (testable independently)
   * Base intervals: 1, 3, 7, 14, 30 days
   */
  function computeNextReview(prevStat, { passed, firstTry, nowMs = Date.now() }) {
    const stat = prevStat ? { ...prevStat } : {
      attempts: 0,
      correctCount: 0,
      wrongCount: 0,
      srsStage: 0,
      isWeak: false,
      errorCounts: {},
      lastStudiedAt: null,
      nextReviewAt: null
    };

    stat.attempts += 1;
    stat.lastStudiedAt = nowMs;

    if (passed) {
      stat.correctCount += 1;
      if (firstTry) {
        stat.srsStage = Math.min(SRS_INTERVALS_DAYS.length - 1, stat.srsStage + 1);
      } else {
        // Passed after retry: hold or advance slowly
        stat.srsStage = Math.min(SRS_INTERVALS_DAYS.length - 1, Math.max(0, stat.srsStage));
      }
      // Clear weak flag after 2 consecutive clean progressions (stage >= 2)
      if (stat.srsStage >= 2 && firstTry) {
        stat.isWeak = false;
      }
      const days = SRS_INTERVALS_DAYS[stat.srsStage];
      stat.nextReviewAt = nowMs + days * 24 * 60 * 60 * 1000;
    } else {
      stat.wrongCount += 1;
      stat.srsStage = 0;
      stat.isWeak = true;
      // Schedule next review in 1 day (base interval index 0)
      stat.nextReviewAt = nowMs + SRS_INTERVALS_DAYS[0] * 24 * 60 * 60 * 1000;
    }

    return stat;
  }

  function toDateKey(ms) {
    const d = new Date(ms);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  /**
   * Compute real analytics exclusively from recorded state
   */
  function computeAnalytics(state, nowMs = Date.now()) {
    const todayKey = toDateKey(nowMs);
    const todaySec = state.dailyStudySeconds[todayKey] || 0;
    const totalSec = Object.values(state.dailyStudySeconds).reduce((a, b) => a + b, 0);

    // Streak calculation (consecutive days with > 0 sec up to today or yesterday)
    let streak = 0;
    const dayMs = 24 * 60 * 60 * 1000;
    let checkMs = todaySec > 0 ? nowMs : nowMs - dayMs;
    while (true) {
      const k = toDateKey(checkMs);
      if ((state.dailyStudySeconds[k] || 0) > 0) {
        streak += 1;
        checkMs -= dayMs;
      } else {
        break;
      }
    }

    const logs = state.attemptLogs || [];
    const evaluatedLogs = logs.filter((l) => l.rating !== 'Not evaluated');
    const totalAnswers = logs.length;
    const correctAnswers = evaluatedLogs.filter((l) => l.passed).length;
    const accuracy = evaluatedLogs.length ? Math.round((correctAnswers / evaluatedLogs.length) * 100) : null;

    const firstTryLogs = evaluatedLogs.filter((l) => l.attemptNumber === 1);
    const firstTryCorrect = firstTryLogs.filter((l) => l.passed).length;
    const firstTryAccuracy = firstTryLogs.length ? Math.round((firstTryCorrect / firstTryLogs.length) * 100) : null;

    const startTimes = logs.map((l) => l.responseStartMs).filter((v) => typeof v === 'number' && v > 0);
    const completeTimes = logs.map((l) => l.responseCompleteMs).filter((v) => typeof v === 'number' && v > 0);
    const avgStartSec = startTimes.length ? Number((startTimes.reduce((a, b) => a + b, 0) / startTimes.length / 1000).toFixed(2)) : null;
    const avgCompleteSec = completeTimes.length ? Number((completeTimes.reduce((a, b) => a + b, 0) / completeTimes.length / 1000).toFixed(2)) : null;

    // By drill
    const byDrill = {};
    // By grammar
    const byGrammar = {};
    // By level
    const byLevel = {};

    for (const log of evaluatedLogs) {
      if (log.drillType) {
        if (!byDrill[log.drillType]) byDrill[log.drillType] = { total: 0, passed: 0 };
        byDrill[log.drillType].total += 1;
        if (log.passed) byDrill[log.drillType].passed += 1;
      }
      if (log.grammarCategory) {
        if (!byGrammar[log.grammarCategory]) byGrammar[log.grammarCategory] = { total: 0, passed: 0 };
        byGrammar[log.grammarCategory].total += 1;
        if (log.passed) byGrammar[log.grammarCategory].passed += 1;
      }
      if (log.level) {
        if (!byLevel[log.level]) byLevel[log.level] = { total: 0, passed: 0, uniqueIds: new Set() };
        byLevel[log.level].total += 1;
        if (log.passed) byLevel[log.level].passed += 1;
        if (log.questionId) byLevel[log.level].uniqueIds.add(log.questionId);
      }
    }

    // Error category frequency
    const errorBreakdown = {};
    for (const st of Object.values(state.questionStats || {})) {
      for (const [cat, cnt] of Object.entries(st.errorCounts || {})) {
        errorBreakdown[cat] = (errorBreakdown[cat] || 0) + cnt;
      }
    }

    // Due review count
    let dueReviewCount = 0;
    let weakCount = 0;
    for (const st of Object.values(state.questionStats || {})) {
      if (st.isWeak) weakCount += 1;
      if (st.nextReviewAt && st.nextReviewAt <= nowMs) dueReviewCount += 1;
    }

    // Daily trend (last 14 days)
    const dailySeries = [];
    for (let i = 13; i >= 0; i--) {
      const k = toDateKey(nowMs - i * dayMs);
      dailySeries.push({ date: k, seconds: state.dailyStudySeconds[k] || 0 });
    }

    // Weekly trend (last 8 weeks)
    const weeklySeries = [];
    for (let w = 7; w >= 0; w--) {
      let sum = 0;
      const weekEnd = nowMs - w * 7 * dayMs;
      for (let d = 0; d < 7; d++) {
        sum += state.dailyStudySeconds[toDateKey(weekEnd - d * dayMs)] || 0;
      }
      weeklySeries.push({ label: toDateKey(weekEnd).slice(5), seconds: sum });
    }

    // Monthly trend (last 6 months)
    const monthlySeries = [];
    const cur = new Date(nowMs);
    for (let m = 5; m >= 0; m--) {
      const d = new Date(cur.getFullYear(), cur.getMonth() - m, 1);
      const prefix = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      let sum = 0;
      for (const [k, v] of Object.entries(state.dailyStudySeconds)) {
        if (k.startsWith(prefix)) sum += v;
      }
      monthlySeries.push({ label: prefix, seconds: sum });
    }

    return {
      todaySec,
      totalSec,
      streak,
      totalAnswers,
      evaluatedCount: evaluatedLogs.length,
      accuracy,
      firstTryAccuracy,
      avgStartSec,
      avgCompleteSec,
      byDrill,
      byGrammar,
      byLevel,
      errorBreakdown,
      dueReviewCount,
      weakCount,
      dailySeries,
      weeklySeries,
      monthlySeries
    };
  }

  class RepeatStore {
    constructor() {
      this.state = createEmptyState();
      this.db = null;
      this.listeners = new Set();
    }

    subscribe(fn) {
      this.listeners.add(fn);
      return () => this.listeners.delete(fn);
    }

    emit() {
      for (const fn of this.listeners) {
        try { fn(this.state); } catch (_) { /* ignore */ }
      }
    }

    async init() {
      // Try IndexedDB first, fall back to LocalStorage safely
      const idbData = await this._loadFromIDB();
      if (idbData) {
        this.state = this._mergeWithDefaults(idbData);
        return this.state;
      }
      const lsData = this._loadFromLocalStorage();
      if (lsData) {
        this.state = this._mergeWithDefaults(lsData);
      }
      return this.state;
    }

    _mergeWithDefaults(raw) {
      const base = createEmptyState();
      return {
        ...base,
        ...raw,
        settings: { ...DEFAULT_SETTINGS, ...(raw.settings || {}) },
        questionStats: raw.questionStats || {},
        lessonProgress: raw.lessonProgress || {},
        attemptLogs: Array.isArray(raw.attemptLogs) ? raw.attemptLogs : [],
        dailyStudySeconds: raw.dailyStudySeconds || {},
        customDecks: Array.isArray(raw.customDecks) ? raw.customDecks : []
      };
    }

    _openIDB() {
      return new Promise((resolve) => {
        if (typeof indexedDB === 'undefined') return resolve(null);
        try {
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME);
            }
          };
          req.onsuccess = (e) => {
            this.db = e.target.result;
            resolve(this.db);
          };
          req.onerror = () => resolve(null);
        } catch (_) {
          resolve(null);
        }
      });
    }

    async _loadFromIDB() {
      const db = this.db || (await this._openIDB());
      if (!db) return null;
      return new Promise((resolve) => {
        try {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const req = tx.objectStore(STORE_NAME).get('root');
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        } catch (_) {
          resolve(null);
        }
      });
    }

    _loadFromLocalStorage() {
      try {
        if (typeof localStorage === 'undefined') return null;
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (_) {
        return null;
      }
    }

    persist() {
      // Save to LocalStorage synchronously for immediate reload safety
      try {
        if (typeof localStorage !== 'undefined') {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
        }
      } catch (_) { /* quota or sandbox restriction */ }

      // Mirror to IndexedDB asynchronously
      if (this.db) {
        try {
          const tx = this.db.transaction(STORE_NAME, 'readwrite');
          tx.objectStore(STORE_NAME).put(this.state, 'root');
        } catch (_) { /* ignore */ }
      }
      this.emit();
    }

    updateSettings(patch) {
      this.state.settings = { ...this.state.settings, ...patch };
      this.persist();
    }

    recordAttempt({
      question,
      rating,
      passed,
      attemptNumber,
      errorCategories = [],
      responseStartMs = null,
      responseCompleteMs = null,
      forceWeak = false,
      nowMs = Date.now()
    }) {
      const qid = question.id;
      const prev = this.state.questionStats[qid];
      let nextStat;

      if (rating === 'Not evaluated' && !forceWeak) {
        nextStat = prev ? { ...prev, lastStudiedAt: nowMs } : {
          attempts: 0, correctCount: 0, wrongCount: 0, srsStage: 0,
          isWeak: false, errorCounts: {}, lastStudiedAt: nowMs, nextReviewAt: null
        };
      } else {
        nextStat = computeNextReview(prev, {
          passed: forceWeak ? false : passed,
          firstTry: attemptNumber === 1,
          nowMs
        });
        if (forceWeak) nextStat.isWeak = true;
        for (const cat of errorCategories) {
          nextStat.errorCounts[cat] = (nextStat.errorCounts[cat] || 0) + 1;
        }
      }

      this.state.questionStats[qid] = nextStat;
      this.state.attemptLogs.push({
        ts: nowMs,
        questionId: qid,
        level: question.level,
        lessonNumber: question.lessonNumber,
        drillType: question.drillType,
        grammarCategory: question.grammarCategory,
        rating,
        passed,
        attemptNumber,
        errorCategories,
        responseStartMs,
        responseCompleteMs
      });

      // Keep logs bounded to 20,000 entries for storage safety
      if (this.state.attemptLogs.length > 20000) {
        this.state.attemptLogs = this.state.attemptLogs.slice(-20000);
      }

      this.persist();
      return nextStat;
    }

    addStudySeconds(seconds, nowMs = Date.now()) {
      if (!seconds || seconds <= 0) return;
      const key = toDateKey(nowMs);
      this.state.dailyStudySeconds[key] = (this.state.dailyStudySeconds[key] || 0) + Math.round(seconds);
      this.persist();
    }

    saveCheckpoint(checkpoint) {
      this.state.lastSession = checkpoint ? { ...checkpoint, updatedAt: Date.now() } : null;
      this.persist();
    }

    markLessonCompleted(levelId, lessonNumber, scoreSummary) {
      const key = `${levelId}-${String(lessonNumber).padStart(2, '0')}`;
      this.state.lessonProgress[key] = {
        completed: true,
        completedAt: Date.now(),
        ...scoreSummary
      };
      this.persist();
    }

    saveCustomDeck(deck) {
      const idx = this.state.customDecks.findIndex((d) => d.id === deck.id);
      if (idx >= 0) {
        this.state.customDecks[idx] = deck;
      } else {
        this.state.customDecks.unshift(deck);
      }
      this.persist();
    }

    deleteCustomDeck(deckId) {
      this.state.customDecks = this.state.customDecks.filter((d) => d.id !== deckId);
      this.persist();
    }

    saveLevelCheck(result) {
      this.state.levelCheckResult = { ...result, completedAt: Date.now() };
      this.persist();
    }

    exportJSON() {
      return JSON.stringify(this.state, null, 2);
    }

    importJSON(jsonStr) {
      const parsed = JSON.parse(jsonStr);
      if (!parsed || typeof parsed !== 'object') throw new Error('Invalid backup JSON');
      this.state = this._mergeWithDefaults(parsed);
      this.persist();
      return this.state;
    }

    resetAll() {
      this.state = createEmptyState();
      this.persist();
    }
  }

  const api = {
    SRS_INTERVALS_DAYS,
    DEFAULT_SETTINGS,
    createEmptyState,
    computeNextReview,
    computeAnalytics,
    toDateKey,
    RepeatStore
  };

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = api;
  } else {
    root.RepeatStoreLib = api;
  }
})(typeof window !== 'undefined' ? window : globalThis);

/**
 * REPEAT – English Speaking Lab
 * Voice Interaction Engine with Strict Finite State Machine (FSM)
 * A turn owns playback, microphone startup, listening, and delayed callbacks.
 *
 * Safeguards:
 * - Aborting the turn releases pending operations before another turn starts
 * - Strict mutual exclusion: STT never runs while TTS is speaking
 * - The first microphone request on Safari starts from the learner's tap
 * - Graceful handling of mic denial, network error, Bluetooth disconnect, visibilitychange
 * - Screen Wake Lock API integration for Walking Mode
 */
(function (root) {
  'use strict';

  const STATES = Object.freeze({
    IDLE: 'IDLE',
    SPEAKING: 'SPEAKING',
    READY: 'READY',
    STARTING: 'STARTING',
    LISTENING: 'LISTENING',
    EVALUATING: 'EVALUATING',
    CORRECTING: 'CORRECTING',
    NEXT: 'NEXT'
  });

  const ALLOWED_TRANSITIONS = {
    IDLE: ['SPEAKING', 'READY', 'STARTING', 'EVALUATING', 'IDLE'],
    SPEAKING: ['SPEAKING', 'READY', 'STARTING', 'NEXT', 'IDLE'],
    READY: ['STARTING', 'SPEAKING', 'EVALUATING', 'IDLE'],
    STARTING: ['LISTENING', 'EVALUATING', 'IDLE'],
    LISTENING: ['EVALUATING', 'IDLE'],
    EVALUATING: ['CORRECTING', 'NEXT', 'SPEAKING', 'READY', 'STARTING', 'IDLE'],
    CORRECTING: ['SPEAKING', 'READY', 'STARTING', 'NEXT', 'IDLE'],
    NEXT: ['SPEAKING', 'READY', 'IDLE']
  };

  // Render English locally when the browser exposes synthesis but has no working voice.
  class BackupSpeech {
    constructor() {
      this.context = null;
      this.worker = null;
      this.requestId = 0;
      this.busy = false;
    }

    enableOutput() {
      try {
        const Context = window.AudioContext || window.webkitAudioContext;
        if (!this.context) this.context = new Context();
        if (this.context.state !== 'running') this.context.resume().catch(() => {});
      } catch (_) { /* play() reports an unavailable output */ }
    }

    play(text, rate, signal) {
      this.enableOutput();
      if (!this.context || signal.aborted) return Promise.resolve({ completed: false, cancelled: signal.aborted });
      return new Promise((resolve) => {
        const context = this.context;
        const id = ++this.requestId;
        let source, worker, timer;
        let settled = false;
        this.busy = true;
        const finish = (completed) => {
          if (settled) return;
          settled = true;
          this.busy = false;
          clearTimeout(timer);
          signal.removeEventListener('abort', cancel);
          if (worker) {
            worker.removeEventListener('message', onAudio);
            worker.removeEventListener('error', onError);
          }
          if (source) {
            source.onended = null;
            if (!completed) {
              try { source.stop(); } catch (_) { /* already ended */ }
            }
            source.disconnect();
          }
          resolve({ completed, cancelled: signal.aborted });
        };
        const cancel = () => finish(false);
        const onError = () => {
          if (worker) worker.terminate();
          this.worker = null;
          finish(false);
        };
        const onAudio = (event) => {
          if (settled || event.data.id !== id) return;
          clearTimeout(timer);
          const { samples, sampleRate } = event.data;
          if (!samples || !samples.length) return onError();
          try {
            const audio = context.createBuffer(1, samples.length, sampleRate);
            audio.getChannelData(0).set(samples);
            source = context.createBufferSource();
            source.buffer = audio;
            source.connect(context.destination);
            source.onended = () => finish(true);
            source.start();
            // An output that remained locked needs a fresh tap on the replay button.
            timer = setTimeout(() => { if (context.state !== 'running') finish(false); }, 2000);
          } catch (_) { finish(false); }
        };
        signal.addEventListener('abort', cancel, { once: true });
        try {
          if (!this.worker) this.worker = new Worker('./speech/worker.js');
          worker = this.worker;
          worker.addEventListener('message', onAudio);
          worker.addEventListener('error', onError);
          timer = setTimeout(onError, 30000);
          worker.postMessage({ id, text, rate });
        } catch (_) { onError(); }
      });
    }
  }

  class VoiceEngine {
    constructor(options = {}) {
      this.state = STATES.IDLE;
      this.paused = false;

   * Only matches if the spoken utterance is a short standalone command AND does NOT

  function detectVoiceCommand(transcript, question) {

    if (!norm || norm.split(/\s+/).length > 4) return null;

    const expNorm = (question && question.expectedAnswer ? question.expectedAnswer : '').toLowerCase().replace(/[^\w\s]/g, '').trim();
    if (expNorm && (norm === expNorm || expNorm.startsWith(norm + ' ') && norm.split(' ').length > 2)) {

      if (phrases.includes(norm)) {

        if (expNorm === norm) return null;

  function buildChunks(sentence) {
    const words = sentence.trim().split(/\s+/);
    if (words.length <= 4) return [sentence];
    const cut2 = Math.max(2, Math.floor(words.length * 0.65));
    const cut1 = Math.max(1, Math.floor(words.length * 0.35));
    return [
      words.slice(cut2).join(' '),
      words.slice(cut1).join(' '),
      sentence
    ];
  }

  function makeJumbled(sentence, seed) {
    const words = sentence.replace(/[.?!]$/, '').split(/\s+/).filter(Boolean);
    let h = 0;
    for (let i = 0; i < seed.length; i++) h = ((h << 5) - h + seed.charCodeAt(i)) | 0;
    const arr = [...words];
    for (let i = arr.length - 1; i > 0; i--) {
      h = (h * 1664525 + 1013904223) | 0;
      const j = Math.abs(h) % (i + 1);
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    if (arr.join(' ') === words.join(' ') && arr.length > 1) {
      [arr[0], arr[1]] = [arr[1], arr[0]];
    }
    return arr;
  }

    return lessonCache.get(key);
  }

  function getQuestionById(qid) {
    const m = /^([A-T])-(\d{2})-(\d{2})$/.exec(qid || '');
    if (!m) return null;
    const lesson = getLesson(m[1], parseInt(m[2], 10));
    return lesson.questions.find((q) => q.id === qid) || null;
  }

  function getQuestionsByDrill(drillType, levelFilter = 'ALL', limit = 20) {
    const levels = levelFilter === 'ALL' ? 'ABCDEFGHIJKLMNOPQRST'.split('') : [levelFilter];
    const results = [];
    for (const lv of levels) {
      for (let n = 1; n <= 10; n++) {
        const lesson = getLesson(lv, n);
        for (const q of lesson.questions) {
          if (q.drillType === drillType) {
            results.push(q);
            if (results.length >= limit) return results;
          }
        }
      }
    }
    return results;
  }

  /**
   * Build a weak-review queue that mixes:
   * 1. Due/weak questions directly
   * 2. Transfer questions sharing the same grammarCategory (prevents rote memorization of a single sentence!)
   */
  function buildWeakReviewQueue(questionStats, nowMs = Date.now(), maxItems = 15) {
    const dueIds = [];
    const weakCategories = new Set();

    for (const [qid, st] of Object.entries(questionStats || {})) {
      const isDue = st.nextReviewAt && st.nextReviewAt <= nowMs;
      if (st.isWeak || isDue) {
        dueIds.push({ qid, priority: (st.isWeak ? 2 : 0) + (isDue ? 1 : 0), wrongCount: st.wrongCount || 0 });
      }
    }

    dueIds.sort((a, b) => b.priority - a.priority || b.wrongCount - a.wrongCount);

    const queue = [];
    const seenIds = new Set();

    for (const item of dueIds) {
      const q = getQuestionById(item.qid);
      if (q && !seenIds.has(q.id)) {
        queue.push(q);
        seenIds.add(q.id);
        weakCategories.add(q.grammarCategory);
        if (queue.length >= Math.ceil(maxItems * 0.7)) break;
      }
    }

    // Add fresh transfer items with the same grammar categories so learners don't just memorize 1 sentence
    if (weakCategories.size > 0 && queue.length < maxItems) {
      const levels = 'ABCDEFGHIJKLMNOPQRST'.split('');
      for (const lv of levels) {
        for (let n = 1; n <= 10; n++) {
          const lesson = getLesson(lv, n);
          for (const q of lesson.questions) {
            if (!seenIds.has(q.id) && weakCategories.has(q.grammarCategory) && q.drillType !== 'open_question') {
              queue.push({ ...q, isTransferPractice: true });
              seenIds.add(q.id);
              if (queue.length >= maxItems) return queue;
              break;
            }
          }
        }
      }
    }

    return queue;
  }

  /**
   * Recommend a starting level (A–T) based on Level Check accuracy and response speed
   */
  function recommendLevelFromCheck(results) {
    if (!results || !results.length) return { level: 'A', accuracy: 0, avgSpeedSec: null };
    const evaluated = results.filter((r) => r.rating !== 'Not evaluated');
    const passedCount = evaluated.filter((r) => r.passed).length;
    const accuracy = evaluated.length ? Math.round((passedCount / evaluated.length) * 100) : 0;
    const speeds = results.map((r) => r.responseCompleteMs).filter((v) => typeof v === 'number' && v > 0);
    const avgSpeedSec = speeds.length ? Number((speeds.reduce((a, b) => a + b, 0) / speeds.length / 1000).toFixed(1)) : null;

    // Score weighted by item difficulty + speed bonus
    let score = 0;
    for (const r of evaluated) {
      if (r.passed) score += (r.difficulty || 1) * 2;
      else if (r.rating === 'Almost') score += (r.difficulty || 1);
    }
    const maxScore = evaluated.reduce((sum, r) => sum + (r.difficulty || 1) * 2, 0) || 1;
    let ratio = score / maxScore;
    if (avgSpeedSec !== null && avgSpeedSec <= 4.5 && accuracy >= 75) ratio = Math.min(1, ratio + 0.08);
    if (avgSpeedSec !== null && avgSpeedSec >= 9.0) ratio = Math.max(0, ratio - 0.08);

    const levels = 'ABCDEFGHIJKLMNOPQRST'.split('');
    const idx = Math.min(levels.length - 1, Math.max(0, Math.floor(ratio * (levels.length - 1))));
    return {
      level: levels[idx],
      accuracy,
      avgSpeedSec,
      passedCount,
      totalCount: results.length
    };
  }

  const api = {
    TOTAL_LEVELS: 20,
    LESSONS_PER_LEVEL: 10,
    QUESTIONS_PER_LESSON: 20,

    getLesson,
    getLevelLessons,
    getAllQuestions,
    getQuestionById,
    getQuestionsByDrill,
    buildWeakReviewQueue,

    recommendLevelFromCheck
  };

  if (typeof module !== 'undefined' && module.exports) {
    module.exports = api;
  } else {
    root.RepeatCurriculum = api;
  }
})(typeof window !== 'undefined' ? window : globalThis);

/**
 * REPEAT – English Speaking Lab
 * Client-Side PDF Textbook Importer & JSON Deck Import/Export
 * - Processes PDF strictly on-device (never uploads to external servers)
 * - Uses PDF.js when loaded via CDN, with transparent error handling for scanned/encrypted PDFs
 * - Strict fidelity mode: preserves original sentences, order, and instructions without fabricating missing ones
 */
(function (root) {
  'use strict';

  async function extractPdfTextByPage(file, pageRangeStr = '') {
    if (!file) throw new Error('PDFファイルが選択されていません。');
    if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') {
      throw new Error('PDF形式のファイルを選択してください。');
    }

    const arrayBuffer = await file.arrayBuffer();

    // Verify PDF header
    const headerBytes = new Uint8Array(arrayBuffer.slice(0, 5));
    const headerStr = String.fromCharCode(...headerBytes);
    if (!headerStr.startsWith('%PDF')) {
      throw new Error('有効なPDFファイルではありません（ヘッダー検証に失敗しました）。');
    }

    if (typeof window !== 'undefined' && window.pdfjsLib) {
      try {
        const loadingTask = window.pdfjsLib.getDocument({ data: arrayBuffer });
        const pdf = await loadingTask.promise;
        const totalPages = pdf.numPages;
        const targetPages = parsePageRange(pageRangeStr, totalPages);
        const pages = [];

        for (const pNum of targetPages) {
          const page = await pdf.getPage(pNum);
          const content = await page.getTextContent();
          const lines = [];
          let currentLine = '';
          let lastY = null;

          for (const item of content.items) {
            const y = item.transform ? Math.round(item.transform[5]) : null;
            if (lastY !== null && y !== null && Math.abs(y - lastY) > 4) {
              if (currentLine.trim()) lines.push(currentLine.trim());
              currentLine = item.str;
            } else {
              currentLine += (currentLine && !currentLine.endsWith(' ') ? ' ' : '') + item.str;
            }
            lastY = y;
          }
          if (currentLine.trim()) lines.push(currentLine.trim());
          pages.push({ pageNumber: pNum, text: lines.join('\n') });
        }

        const totalChars = pages.reduce((acc, p) => acc + p.text.trim().length, 0);
        if (totalChars === 0) {
          throw new Error('テキストを抽出できませんでした。画像スキャンされたPDF（OCRなし）の可能性があります。テキストを貼り付けるかJSONで取り込んでください。');
        }
        return { totalPages, pages };
      } catch (err) {
        throw new Error(`PDF解析エラー: ${err.message || '読み込みに失敗しました。暗号化または破損している可能性があります。'}`);
      }
    }

    throw new Error('PDF.jsライブラリが読み込まれていません（オフライン環境の可能性があります）。テキスト貼り付けまたはJSONインポートをご利用ください。');
  }

  function parsePageRange(rangeStr, totalPages) {
    if (!rangeStr || !rangeStr.trim()) {
      return Array.from({ length: totalPages }, (_, i) => i + 1);
    }
    const pages = new Set();
    const parts = rangeStr.split(',').map((s) => s.trim()).filter(Boolean);
    for (const part of parts) {
      const m = /^(\d+)\s*-\s*(\d+)$/.exec(part);
      if (m) {
        const start = Math.max(1, parseInt(m[1], 10));
        const end = Math.min(totalPages, parseInt(m[2], 10));
        for (let p = start; p <= end; p++) pages.add(p);
      } else if (/^\d+$/.test(part)) {
        const p = parseInt(part, 10);
        if (p >= 1 && p <= totalPages) pages.add(p);
      }
    }
    const sorted = [...pages].sort((a, b) => a - b);
    return sorted.length ? sorted : Array.from({ length: totalPages }, (_, i) => i + 1);
  }

  /**
   * Parse extracted text strictly preserving original lines & Exercise blocks.
   * Never fabricates instructions or answers that are not in the source text.
   */
  function parseExercisesFromText(rawText, options = {}) {
    const {
      exerciseFilter = '',
      defaultDrillType = 'repetition',
      sourceTitle = 'Imported PDF Material'
    } = options;

    if (!rawText || !rawText.trim()) {
      return { items: [], warnings: ['抽出テキストが空です。原文を確認してください。'] };
    }

    const lines = rawText.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
    const warnings = [];
    const items = [];

    let currentExercise = '';
    let activeInstruction = '';
    let seq = 0;

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];

      // Detect Exercise header (e.g., "Exercise 3", "EX 12:", "Drill 2")
      const exMatch = /^(?:Exercise|Ex\.?|Drill)\s*([0-9A-Za-z.-]+)/i.exec(line);
      if (exMatch) {
        currentExercise = exMatch[1];
        activeInstruction = '';
        continue;
      }

      // Filter by Exercise number if specified
      if (exerciseFilter && currentExercise && currentExercise.toLowerCase() !== exerciseFilter.trim().toLowerCase()) {
        continue;
      }

      // Detect explicit teacher instruction lines (e.g., "Instruction: ..." or "Cue: ...")
      const instMatch = /^(?:Instruction|Cue|Teacher|Prompt)\s*[:：]\s*(.+)$/i.exec(line);
      if (instMatch) {
        activeInstruction = instMatch[1].trim();
        continue;
      }

      // Detect numbered item (e.g., "1. I go to work by train." or "1) ...")
      const itemMatch = /^(?:\d+[.)]|[A-Za-z][.)])\s+(.+)$/.exec(line);
      const sentenceText = itemMatch ? itemMatch[1].trim() : line;

      // Skip very short page numbers or bare symbols
      if (/^\d+$/.test(sentenceText) || sentenceText.length < 3) continue;

      // Check if line has explicit "=>" or "->" separating source, instruction, and answer
      let sourceSentence = sentenceText;
      let teacherInstruction = activeInstruction;
      let expectedAnswer = sentenceText;

      if (sentenceText.includes('=>')) {
        const parts = sentenceText.split('=>').map((p) => p.trim());
        if (parts.length === 2) {
          sourceSentence = parts[0];
          expectedAnswer = parts[1];
        } else if (parts.length >= 3) {
          sourceSentence = parts[0];
          teacherInstruction = parts[1];
          expectedAnswer = parts[2];
        }
      }

      seq += 1;
      items.push({
        id: `CUSTOM-${Date.now()}-${String(seq).padStart(3, '0')}`,
        level: 'CUSTOM',
        lessonNumber: 1,
        exerciseNumber: currentExercise || '1',
        drillType: defaultDrillType,
        sourceSentence,
        teacherInstruction, // Empty if not present in original text — never fabricated
        expectedAnswer,
        acceptableAnswers: [],
        grammarCategory: 'fluency_open',
        difficulty: 2,
        hint: '',
        explanation: '',
        strictMaterialMode: true,
        sourceMaterial: sourceTitle
      });
    }

    if (items.length === 0) {
      warnings.push('指定条件に一致する問題行を検出できませんでした。Exercise番号の指定を外すか、下の編集画面で手動修正してください。');
    } else if (items.some((it) => !it.teacherInstruction && defaultDrillType !== 'repetition')) {
      warnings.push('原文に教師の指示行が含まれていない問題があります。自動補完は行っていないため、必要に応じて問題編集画面で指示と正解を入力してください。');
    }

    return { items, warnings };
  }

  function exportDeckJSON(deck) {
    return JSON.stringify(deck, null, 2);
  }

  function importDeckJSON(jsonStr) {
    const data = JSON.parse(jsonStr);
    if (!data || typeof data !== 'object' || !Array.isArray(data.items)) {
      throw new Error('JSON形式が不正です。"title" と "items" 配列を含む教材JSONを指定してください。');
    }
    const items = data.items.map((it, idx) => ({
      id: it.id || `JSON-${Date.now()}-${idx + 1}`,
      level: it.level || 'CUSTOM',
      lessonNumber: it.lessonNumber || 1,
      exerciseNumber: it.exerciseNumber || '1',
      drillType: it.drillType || 'repetition',
      sourceSentence: String(it.sourceSentence || ''),
      teacherInstruction: String(it.teacherInstruction || ''),
      expectedAnswer: String(it.expectedAnswer || it.sourceSentence || ''),
      acceptableAnswers: Array.isArray(it.acceptableAnswers) ? it.acceptableAnswers : [],
      grammarCategory: it.grammarCategory || 'fluency_open',
      difficulty: Number(it.difficulty) || 2,
      hint: String(it.hint || ''),
      explanation: String(it.explanation || ''),
      strictMaterialMode: true,
      sourceMaterial: data.title || 'Imported JSON Deck'
    }));

    return {
      id: data.id || `deck-${Date.now()}`,
      title: data.title || 'Imported Deck',
      orderMode: data.orderMode || 'sequential',
      createdAt: data.createdAt || Date.now(),
      resumeIndex: Number(data.resumeIndex) || 0,
      items
    };
  }

  const api = {
    extractPdfTextByPage,
    parsePageRange,
    parseExercisesFromText,
    exportDeckJSON,
    importDeckJSON
  };

  if (typeof module !== 'undefined' && module.exports) {
