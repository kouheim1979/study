<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5145db"><title>ENGLISH 80 | 書籍学習モード</title><style>
:root{color-scheme:light dark;--bg:#f4f5ff;--card:#fff;--ink:#20243e;--muted:#606983;--line:#dfe2ee;--accent:#5145db;--soft:#efedff;--green:#087b59}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,sans-serif}header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);z-index:5;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}main{max-width:820px;margin:auto;padding:16px 12px 56px}a{color:var(--accent)}header a{font-weight:700;text-decoration:none}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 13px;font-weight:700;min-height:44px}button.primary{background:#5145db;color:white;border-color:#5145db;box-shadow:0 3px 0 #382ca6}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,a:focus-visible{outline:3px solid #8071f9;outline-offset:3px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:12px}.hero{background:linear-gradient(135deg,#28226f,#6754dc);color:white;border:0;padding:23px}.hero p{color:#efedff}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.13em}.hero h1{font-size:27px;line-height:1.25;margin:8px 0}.hero a{color:#fff}.muted{color:var(--muted);font-size:13px}.hero .muted{color:#ece6ff}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.bar{height:9px;border-radius:20px;background:#ffffff30;overflow:hidden}.bar i{display:block;height:100%;background:#a9f5cf;border-radius:20px}.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.stage{text-align:left;padding:12px;display:grid;gap:5px}.stage.active{outline:2px solid var(--accent);outline-offset:-2px;background:var(--soft)}.stage b{font-size:19px}.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.slot{text-align:left;min-height:76px;overflow-wrap:anywhere;display:grid;align-content:center;gap:4px}.slot.empty{border-style:dashed;color:var(--muted);font-weight:500}.slot.done{border-color:var(--green)}.slot small{font-size:11px;color:var(--muted)}.slot b{font-size:15px}.slot.done small{color:var(--green)}h2{margin:0 0 10px;font-size:20px}h3{margin:14px 0 8px;font-size:16px}input,textarea{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;font-size:16px}label{display:block;font-weight:700;margin-top:10px}.answer{padding:16px;background:var(--soft);border-radius:14px;font-size:20px;font-weight:700;margin:12px 0}.prompt{font-size:19px;font-weight:700;text-align:center;margin:20px 0}.pill{font-size:12px;background:var(--soft);padding:4px 8px;border-radius:9px;color:var(--accent);font-weight:700}#status{min-height:22px}.notice{border-left:3px solid var(--accent);padding-left:10px}.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.mode a,.mode span{padding:10px;text-align:center;border:1px solid var(--line);border-radius:12px;background:var(--card);text-decoration:none;font-weight:700}.mode span{background:var(--accent);color:#fff}.practice-buttons{display:flex;gap:8px;flex-wrap:wrap}.practice-buttons>*{flex:1}button.danger{color:#a33131}@media(max-width:600px){.stages{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h1{font-size:24px}}@media(prefers-color-scheme:dark){:root{--bg:#111324;--card:#1c2036;--ink:#f3f4ff;--muted:#b3bbd4;--line:#373d57;--accent:#a99cff;--soft:#343054;--green:#7ce5b9}}
</style></head><body><header><a href="./index.html">← ENGLISH 80</a><b>書籍学習モード</b></header><main id="app"></main><script>
"use strict";
const seed=[[1,"Can I ...?","〜してもいいですか？",[["Can I sit here?","ここに座ってもいいですか？"],["Can I borrow your pen?","ペンを借りてもいいですか？"],["Can I call you later?","後で電話してもいいですか？"]]],[2,"Thank you for ...","〜をありがとう",[["Thank you for waiting.","待ってくれてありがとう。"],["Thank you for your advice.","アドバイスをありがとう。"],["Thank you for helping me.","手伝ってくれてありがとう。"]]],[21,"It can't be ...","〜であるはずがない",[["It can't be true.","本当のはずがない。"],["It can't be that expensive.","そんなに高いはずがない。"],["It can't be a coincidence.","偶然のはずがない。"]]],[22,"You must be ...","きっと〜でしょう",[["You must be tired.","きっと疲れているでしょう。"],["You must be very busy.","きっととても忙しいでしょう。"],["You must be excited.","きっとわくわくしているでしょう。"]]],[43,"I've never ...","一度も〜したことがない",[["I've never tried skiing.","スキーをしたことがありません。"],["I've never seen snow in April.","4月に雪を見たことがありません。"],["I've never worked abroad.","海外で働いたことがありません。"]]],[44,"I'm used to ...","〜に慣れている",[["I'm used to getting up early.","早起きに慣れています。"],["I'm used to this schedule.","この予定に慣れています。"],["I'm used to speaking in meetings.","会議で話すことに慣れています。"]]],[67,"I should have ...","〜すればよかった",[["I should have checked the time.","時間を確認すればよかった。"],["I should have brought an umbrella.","傘を持ってくればよかった。"],["I should have asked you first.","先にあなたに聞けばよかった。"]]],[68,"I'm afraid ...","残念ながら〜です",[["I'm afraid I can't join you.","残念ながら参加できません。"],["I'm afraid we're out of time.","残念ながら時間切れです。"],["I'm afraid the shop is closed.","残念ながら店は閉まっています。"]]]];
const chapters=[{name:"6歳まで",start:1,end:20},{name:"8歳まで",start:21,end:42},{name:"12歳まで",start:43,end:66},{name:"ティーンまで",start:67,end:80}];
const key="english80_book_companion_v1";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initial=Object.fromEntries(seed.map(([n,pattern,meaning,examples])=>[n,{pattern,meaning,examples,source:"public"}]));
let saved={};try{saved=JSON.parse(localStorage.getItem(key)||"{}")||{}}catch(e){}
let custom=saved.custom||{},progress=saved.progress||{},chapter=0,selected=null,question=0,shown=false,editing=false;
const get=n=>custom[n]||initial[n];
function save(){try{localStorage.setItem(key,JSON.stringify({custom,progress}));return true}catch(e){return false}}
const all=()=>Array.from({length:80},(_,i)=>i+1);
const done=n=>!!get(n)&&!!progress[n]?.done;
const number=n=>String(n).padStart(2,"0");
function render(){
const c=chapters[chapter],registered=all().filter(get).length,complete=all().filter(done).length, nums=Array.from({length:c.end-c.start+1},(_,i)=>c.start+i);
let detail="";
if(selected!==null){
 const p=get(selected),ex=p?.examples?.[question];
 detail='<section class="card" id="detail"><div class="row"><h2>型 '+number(selected)+'</h2><button data-action="close">閉じる</button></div>';
 if(editing||!p){
 detail+='<p class="muted">お持ちの書籍を見ながら型を登録してください。例文は自分で作った英文と日本語訳を入力できます。</p><form id="entry"><label>英語の型<input name="pattern" required maxlength="150" value="'+esc(p?.pattern||"")+'" placeholder="例: I can ..."></label><label>日本語の意味<input name="meaning" required maxlength="200" value="'+esc(p?.meaning||"")+'"></label><label>自作例文（1行につき英文 | 日本語訳）<textarea name="examples" rows="5" maxlength="5000" placeholder="I can swim. | 泳げます。">'+esc((p?.examples||[]).map(x=>x.join(" | ")).join("\n"))+'</textarea></label><div class="practice-buttons" style="margin-top:12px"><button class="primary" type="submit">保存する</button></div></form>';
 }else{
 detail+='<span class="pill">'+(p.source==="public"?"公開目次で確認":"自分で登録")+'</span><h3 style="font-size:24px">'+esc(p.pattern)+'</h3><div>'+esc(p.meaning)+'</div><p class="muted">例文は書籍本文ではなく独自の練習用です。</p>';
 if(ex){
 detail+='<div class="row"><span class="muted">瞬間英作文 '+(question+1)+' / '+p.examples.length+'</span><button data-action="listen">英語音声</button></div><div class="prompt">'+esc(ex[1])+'</div>'+(shown?'<div class="answer">'+esc(ex[0])+'</div><div class="practice-buttons"><button data-action="again">もう一度</button><button class="primary" data-action="next">'+(question+1===p.examples.length?"練習完了":"言えた・次へ")+'</button></div>':'<button class="primary" style="width:100%" data-action="show">答えを見る</button>');
 }else{detail+='<p class="notice muted">例文を登録すると瞬間英作文で練習できます。</p>'}
 detail+='<div class="row" style="margin-top:14px"><button data-action="edit">型・例文を編集</button>'+(done(selected)?'<button data-action="reset">完了を取り消す</button>':'')+'</div>';
 }
 detail+='<div id="status" class="muted" role="status"></div></section>';
}
document.getElementById("app").innerHTML='<div class="mode"><a href="./index.html">オリジナル80</a><span>書籍学習モード</span></div><section class="card hero"><div class="eyebrow">BOOK COMPANION · 非公式</div><h1>本の順番で、英語を身につける。</h1><p>塚本亮著『ネイティブなら12歳までに覚える 80パターンで英語が止まらない！』の学習補助。</p><div class="row"><b>練習完了 '+complete+' / 80</b><span>登録済み '+registered+' / 80</span></div><div class="bar"><i style="width:'+complete/80*100+'%"></i></div><p class="muted">公開目次で確認できた各章冒頭の2型を収録。未確認の72枠は未登録です。書籍の全文・公式例文・公式音声は収録していません。<br><a href="https://www.takahashishoten.co.jp/book/11340.html/" target="_blank" rel="noopener">出版社公式情報</a> · <a href="https://www.e-hon.ne.jp/bec/SA/Detail?refISBN=4471113402" target="_blank" rel="noopener">公開目次</a></p></section><section class="card"><h2>成長ステージ</h2><div class="stages">'+chapters.map((g,i)=>'<button class="stage '+(i===chapter?"active":"")+'" data-chapter="'+i+'"><small>STAGE '+(i+1)+'</small><strong>'+g.name+'</strong><b>'+all().filter(n=>n>=g.start&&n<=g.end&&done(n)).length+' / '+(g.end-g.start+1)+'</b></button>').join("")+'</div></section>'+detail+'<section class="card"><div class="row"><h2>'+c.name+' · '+nums.length+'型</h2><span class="pill">登録 '+nums.filter(get).length+' / '+nums.length+'</span></div><div class="slots">'+nums.map(n=>{const p=get(n);return '<button class="slot '+(!p?"empty":done(n)?"done":"")+'" data-slot="'+n+'"><small>型 '+number(n)+' · '+(done(n)?"✓ 練習完了":p?p.source==="public"?"確認済み":"自分で登録":"未確認")+'</small><b>'+esc(p?.pattern||"＋ 型を登録")+'</b></button>'}).join("")+'</div><p class="muted">記録はオリジナル80とは別に、この端末内に保存されます。練習完了は自己評価であり、習得認定ではありません。</p></section>';
}
function openSlot(n){selected=n;question=0;shown=false;editing=false;render();document.getElementById("detail").scrollIntoView({block:"start"});}
function speak(text){if(!("speechSynthesis" in window)){document.getElementById("status").textContent="この端末では読み上げが使えません。";return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";speechSynthesis.speak(u)}
document.getElementById("app").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.chapter!==undefined){chapter=Number(b.dataset.chapter);selected=null;render();return}if(b.dataset.slot){openSlot(Number(b.dataset.slot));return}const p=get(selected),a=b.dataset.action;if(a==="close"){selected=null;render()}else if(a==="edit"){editing=true;render()}else if(a==="show"){shown=true;render()}else if(a==="again"){shown=false;render()}else if(a==="listen"&&p?.examples[question]){speak(p.examples[question][0])}else if(a==="next"&&shown&&p){if(question+1<p.examples.length){question++;shown=false;render()}else{progress[selected]={done:true,date:new Date().toISOString()};const ok=save();shown=false;question=0;render();document.getElementById("status").textContent=ok?"練習完了！ 次の型へ進みましょう。":"練習完了。端末に保存できませんでした。"}}else if(a==="reset"){delete progress[selected];save();render()}});
document.getElementById("app").addEventListener("submit",e=>{if(e.target.id!=="entry")return;e.preventDefault();const f=new FormData(e.target),pattern=String(f.get("pattern")).trim(),meaning=String(f.get("meaning")).trim(),raw=String(f.get("examples")).trim(),examples=raw?raw.split(/\r?\n/).filter(x=>x.trim()).map(x=>x.split("|").map(t=>t.trim())):[];if(!pattern||!meaning||examples.some(x=>x.length!==2||!x[0]||!x[1])){document.getElementById("status").textContent="型・意味を入力し、例文は英文 | 日本語訳の形式で入力してください。";return}custom[selected]={pattern,meaning,examples,source:"custom"};delete progress[selected];const ok=save();editing=false;shown=false;question=0;render();document.getElementById("status").textContent=ok?"保存しました。":"端末に保存できませんでした。"});
render();
</script></body></html>
