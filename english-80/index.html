s a faster train to the airport.","tpl":"[[I was wondering if]] there's a faster train to the airport.","jp":"空港へ行くもっと速い電車があるかなと思いまして。","scene":"旅行","alts":["Is there a quicker train to the airport?"]}]},{"id":"P40","catId":"cat4","pattern":"Have you heard about ...?","meaning":"〜について聞きましたか？","grammar":"Have you heard about + 名詞／出来事? で、最近のニュースや話題を相手が知っているか尋ねます。","usage":"雑談のきっかけづくり、社内ニュースの確認、新しいお店やイベントの話題を切り出すときに便利です。","nuance":"会話のアイスブレイクに最適。相手が No と言えばそのまま自分の話題を広げられます。","similar":"Have you heard of ...?（名前・存在を知っているか）／ Did you hear about ...?（アメリカ英語でよく使う）","pitfall":"hear about は「詳しい出来事やニュースを聞く」、hear of は「その存在や名前を聞いたことがある」という違いがあります。","dialogue":[{"speaker":"A","en":"Have you heard about the new coffee roastery near the station?","jp":"駅の近くにできた新しいコーヒー焙煎所のこと聞いた？"},{"speaker":"B","en":"No, I haven't! When did it open?","jp":"いや、聞いてない！いつオープンしたの？"},{"speaker":"A","en":"Just last week. Their pour-over is incredible.","jp":"つい先週だよ。ハンドドリップが絶品なんだ。"},{"speaker":"B","en":"Let's check it out after lunch today!","jp":"今日のお昼のあとに見に行こうよ！"}],"drills":{"subject":{"en":"Has your team heard about the new travel policy?","jp":"あなたのチームは新しい出張規定について聞きましたか？"},"tense":{"en":"Had you heard about the delay before arriving?","jp":"到着前に遅延のことは聞いていましたか？"},"negative":{"en":"Haven't you heard about the office move?","jp":"オフィス移転のこと、まだ聞いていないんですか？"},"question":{"en":"Have you heard from the client yet?","jp":"クライアントからまだ連絡はありましたか？"}},"examples":[{"id":"P40_01","en":"Have you heard about the new café down the street?","tpl":"[[Have you heard about]] the new café down the street?","jp":"通りの先にできた新しいカフェのこと聞きましたか？","scene":"日常","alts":["Did you hear about the new café down the street?"]},{"id":"P40_02","en":"Have you heard about the upcoming office renovation?","tpl":"[[Have you heard about]] the upcoming office renovation?","jp":"今度のオフィス改装のこと聞きましたか？","scene":"職場","alts":["Did you hear about the office renovation?"]},{"id":"P40_03","en":"Have you heard about the train strike tomorrow?","tpl":"[[Have you h ative":{"en":"Let's not rush into a contract without reading the fine print.","jp":"細かい条件を読まずに急いで契約するのはやめましょう。"},"question":{"en":"Let's grab coffee after this, shall we?","jp":"このあとコーヒーでも飲みましょうか？"}},"examples":[{"id":"P46_01","en":"Let's get started.","tpl":"[[Let's]] get started.","jp":"始めましょう。","scene":"会議","alts":["Let us begin."]},{"id":"P46_02","en":"Let's double-check the flight time.","tpl":"[[Let's]] double-check the flight time.","jp":"フライト時刻を再確認しましょう。","scene":"海外出張","alts":["Let's verify the flight time."]},{"id":"P46_03","en":"Let's grab a quick lunch before the next session.","tpl":"[[Let's]] grab a quick lunch before the next session.","jp":"次のセッションの前にさっと昼食を食べましょう。","scene":"職場","alts":["Let's get a quick lunch."]},{"id":"P46_04","en":"Let's move on to the next topic.","tpl":"[[Let's]] move on to the next topic.","jp":"次の議題に移りましょう。","scene":"会議","alts":["Let's go to the next item."]},{"id":"P46_05","en":"Let's split the dessert.","tpl":"[[Let's]] split the dessert.","jp":"デザートをシェアしましょう。","scene":"レストラン","alts":["Let's share the dessert."]},{"id":"P46_06","en":"Let's head to the gate now.","tpl":"[[Let's]] head to the gate now.","jp":"そろそろ搭乗ゲートに向かいましょう。","scene":"旅行","alts":["Let's go to the gate now."]},{"id":"P46_07","en":"Let's keep it simple.","tpl":"[[Let's]] keep it simple.","jp":"シンプルにいきましょう。","scene":"会議","alts":["Let's not overcomplicate it."]},{"id":"P46_08","en":"Let's check out early to beat the traffic.","tpl":"[[Let's]] check out early to beat the traffic.","jp":"渋滞を避けるために早めにチェックアウトしましょう。","scene":"ホテル","alts":["Let's check out early."]},{"id":"P46_09","en":"Let's take a quick group photo.","tpl":"[[Let's]] take a quick group photo.","jp":"さっと集合写真を撮りましょう。","scene":"友人","alts":["Let's get a group picture."]},{"id":"P46_10","en":"Let's compare these two options side by side.","tpl":"[[Let's]] compare these two options side by side.","jp":"この2つの選択肢を並べて比較しましょう。","scene":"買い物","alts":["Let's compare both options."]},{"id":"P46_11","en":"Let's wrap up for today.","tpl":"[[Let's]] wrap up for today.","jp":"今日はこれで終わりにしましょう。","scene":"会議","alts":["Let's call it a day."]},{"id":"P46_12","en":"Let's walk—it's only ten minutes away.","tpl":"[[Let's]] walk—it's only ten minutes away.","jp":"歩きましょう、たった10分ですから。","scene":"旅行","alts":["Let's go on foot."]},{"id":"P46_13","en":"Let's catch up again next month.","tpl":"[[Let's]] catch up again next month.","jp":"来月また近況を話しましょう。","scene":"友人","alts":["Let's meet up again next month."]},{"id":"P46_14","en":"Let's confirm the details by email.","tpl":"[[Let's]] confirm the details by email.","jp":"詳細はメールで確認しましょう。","scene":"職場","alts":["Let's follow up by email."]},{"id":"P46_15","en":"Let's not forget to pack our chargers.","tpl":"[[Let's]] not forget to pack our chargers.","jp":"充電器を忘れずに入れましょう。","scene":"海外出張","alts":["Make sure we pack our chargers."]},{"id":"P46_16","en":"Let's ask the waiter for a recommendation.","tpl":"[[Let's]] ask the waiter for a recommendation.","jp":"店員さんにおすすめを聞いてみましょう。","scene":"レストラン","alts":["Let's ask what they recommend."]},{"id":"P46_17","en":"Let's review the action items before leaving.","tpl":"[[Let's]] review the action items before leaving.","jp":"解散前にアクションアイテムを確認しましょう。","scene":"会議","alts":["Let's go over our next steps."]},{"id":"P46_18","en":"Let's look around the local market.","tpl":"[[Let's]] look around the local market.","jp":"地元の市場を見て回りましょう。","scene":"買い物","alts":["Let's explore the market."]},{"id":"P46_19","en":"Let's stay in touch after the conference.","tpl":"[[Let's]] stay in touch after the conference.","jp":"カンファレンス後も連絡を取り合いましょう。","scene":"自己紹介","alts":["Let's keep in touch."]},{"id":"P46_20","en":"Let's give it a try.","tpl":"[[Let's]] give it a try.","jp":"とにかく試してみましょう。","scene":"日常","alts":["Let's try it out."]}]},{"id":"P47","catId":"cat5","pattern":"How about we ...?","meaning":"〜するのはどうでしょう？","grammar":"How about we + 動詞の原形? で、具体的な共同行動を柔らかく提案します。","usage":"ビジネスでの合意形成、妥協案の提示、友人や同僚との計画調整でネイティブが非常に好んで使います。","nuance":"How about + -ing? よりも「私たちで〜しようよ」という具体的な提案感があり、かつ押し付けがましくありません。","similar":"What if we ...?（もし〜したらどうだろう）／ Why don't we ...?（〜しませんか？）","pitfall":"we の後ろの動詞は原形（現在形）を使います（× How about we going → ○ How about we go）。","dialogue":[{"speaker":"A","en":"Both Monday and Tuesday look packed on everyone's calendar.","jp":"月曜も火曜もみんなのカレンダーがいっぱいですね。"},{"speaker":"B","en":"How about we record a short video update instead of holding a live meeting?","jp":"ライブ会議を開く代わりに、短い動画アップデートを録画するのはどうでしょう？"},{"speaker":"A","en":"Oh, I love that idea. That saves everyone thirty minutes.","jp":"わあ、それすごくいいですね。全員30分節約できますよ。"},{"speaker":"B","en":"Great, I'll record it by noon and post it in the channel.","jp":"では正午までに録画してチャンネルに投稿しますね。"}],"drills":{"subject":{"en":"How about we invite the Tokyo team to the demo?","jp":"東京チームもデモに招待するのはどうでしょう？"},"tense":{"en":"How about we revisit this topic next quarter?","jp":"この話題は来四半期に改めて見直すのはどうでしょう？"},"negative":{"en":"How about we don't overpack our schedule on day one?","jp":"1日目は予定を詰め込みすぎないのはどうでしょう？"},"question":{"en":"How about we meet halfway between our offices?","jp":"お互いのオフィスの中間地点で会うのはどうでしょう？"}},"examples":[{"id":"P47_01","en":"How about we grab coffee before the meeting?","tpl":"[[How about we]] grab coffee before the meeting?","jp":"会議の前にコーヒーを買うのはどうでしょう？","scene":"職場","alts":["Why don't we get coffee before the meeting?"]},{"id":"P47_02","en":"How about we start at nine-thirty instead?","tpl":"[[How about we]] start at nine-thirty instead?","jp":"代わりに9時半スタートにするのはどうでしょう？","scene":"会議","alts":["Could we start at nine-thirty instead?"]},{"id":"P47_03","en":"How about we split the main course and get two sides?","tpl":"[[How about we]] split the main course and get two sides?","jp":"メインをシェアしてサイドを2品頼むのはどうでしょう？","scene":"レストラン","alts":["Let's share the main and order two sides."]},{"id":"P47_04","en":"How about we check into the hotel first?","tpl":"[[How about we]] check into the hotel first?","jp":"まずホテルにチェックインするのはどうでしょう？","scene":"ホテル","alts":["Let's check in first."]},{"id":"P47_05","en":"How about we test this with a small group first?","tpl":"[[How about we]] test this with a small group first?","jp":"まず少人数で試してみるのはどうでしょう？","scene":"会議","alts":["Let's run a small pilot first."]},{"id":"P47_06","en":"How about we take the express train to save time?","tpl":"[[How about we]] take the express train to save time?","jp":"時間を節約するために特急電車に乗るのはどうでしょう？","scene":"旅行","alts":["Let's take the express train."]},{"id":"P47_07","en":"How about we revisit the pricing next week?","tpl":"[[How about we]] revisit the pricing next week?","jp":"価格については来週改めて話すのはどうでしょう？","scene":"職場","alts":["Let's come back to pricing next week."]},{"id":"P47_08","en":"How about we walk around the neighborhood after dinner?","tpl":"[[How about we]] walk around the neighborhood after dinner?","jp":"夕食後に近所を散歩するのはどうでしょう？","scene":"友人","alts":["Want to walk around after dinner?"]},{"id":"P47_09","en":"How about we look at one more shop before buying?","tpl":"[[How about we]] look at one more shop before buying?","jp":"買う前にもう1軒お店を見てみるのはどうでしょう？","scene":"買い物","alts":["Let's check one more store first."]},{"id":"P47_10","en":"How about we share a document to track our ideas?","tpl":"[[How about we]] share a document to track our ideas?","jp":"アイデアをまとめる共有ドキュメントを作るのはどうでしょう？","scene":"職場","alts":["Let's create a shared doc for ideas."]},{"id":"P47_11","en":"How about we book the morning flight back?","tpl":"[[How about we]] book the morning flight back?","jp":"帰りは午前便を予約するのはどうでしょう？","scene":"海外出張","alts":["Let's take the morning flight home."]},{"id":"P47_12","en":"How about we skip the appetizer and save room for dessert?","tpl":"[[How about we]] skip the appetizer and save room for dessert?","jp":"前菜は飛ばしてデザートの分を空けておくのはどうでしょう？","scene":"レストラン","alts":["Let's skip appetizers and get dessert."]},{"id":"P47_13","en":"How about we do a quick dry run on Thursday?","tpl":"[[How about we]] do a quick dry run on Thursday?","jp":"木曜日に簡単にリハーサルをするのはどうでしょう？","scene":"会議","alts":["Let's rehearse briefly on Thursday."]},{"id":"P47_14","en":"How about we rent bicycles for the afternoon?","tpl":"[[How about we]] rent bicycles for the afternoon?","jp":"午後はレンタサイクルを借りるのはどうでしょう？","scene":"旅行","alts":["Let's rent bikes this afternoon."]},{"id":"P47_15","en":"How about we send a follow-up summary today?","tpl":"[[How about we]] send a follow-up summary today?","jp":"今日中にフォローアップの要約を送るのはどうでしょう？","scene":"職場","alts":["Let's send a summary email today."]},{"id":"P47_16","en":"How about we sit by the window for better lighting?","tpl":"[[How about we]] sit by the window for better lighting?","jp":"明るい窓際の席に座るのはどうでしょう？","scene":"レストラン","alts":["Let's take a window table."]},{"id":"P47_17","en":"How about we leave our heavy bags at the station locker?","tpl":"[[How about we]] leave our heavy bags at the station locker?","jp":"重い荷物は駅のコインロッカーに預けるのはどうでしょう？","scene":"旅行","alts":["Let's store our bags in a locker."]},{"id":"P47_18","en":"How about we keep the design clean and minimal?","tpl":"[[How about we]] keep the design clean and minimal?","jp":"デザインはすっきりミニマルに保つのはどうでしょう？","scene":"会議","alts":["Let's keep the design minimal."]},{"id":"P47_19","en":"How about we catch a movie if it rains tomorrow?","tpl":"[[How about we]] catch a movie if it rains tomorrow?","jp":"明日雨が降ったら映画を観るのはどうでしょう？","scene":"友人","alts":["If it rains, let's see a movie."]},{"id":"P47_20","en":"How about we ask the front desk to book a cab?","tpl":"[[How about we]] ask the front desk to book a cab?","jp":"フロントにタクシーを頼むのはどうでしょう？","scene":"ホテル","alts":["Let's have the front desk call a cab."]}]},{"id":"P48","catId":"cat5","pattern":"Shall I ...?","meaning":"私が〜しましょうか？","grammar":"Shall I + 動詞の原形? で、相手のために何かを申し出るときの丁寧なオファーを表します。","usage":"来客対応、会議の準備、同僚への気配り、ホテルやレストランでの丁寧なやり取りで品よく響きます。","nuance":"Do you want me to ...? より洗練された丁寧な表現。イギリス英語では特に頻繁に使われ、アメリカでもビジネスで好印象です。","similar":"Should I ...?（アメリカ英語で頻出）／ Would you like me to ...?（さらに丁寧な申し出）","pitfall":"Shall は主に I または we を主語にして使います（Shall I ...?＝しましょうか？ / Shall we ...?＝一緒にしましょうか？）。","dialogue":[{"speaker":"A","en":"Thanks for coming all the way to our office today.","jp":"本日はわざわざ弊社オフィスまでお越しいただきありがとうございます。"},{"speaker":"B","en":"Thank you for having me. It's a lovely space.","jp":"お招きいただきありがとうございます。素敵なオフィスですね。"},{"speaker":"A","en":"Shall I get you some coffee or green tea before we begin?","jp":"始める前にコーヒーか緑茶をお持ちしましょうか？"},{"speaker":"B","en":"Green tea would be wonderful, thank you.","jp":"緑茶をいただけるとうれしいです、ありがとうございます。"}],"drills":{"subject":{"en":"Shall we move to the conference room now?","jp":"そろそろ会議室に移動しましょうか？"},"tense":{"en":"Should I have printed extra copies for the guests?","jp":"ゲスト用に追加で印刷しておくべきだったでしょうか？"},"negative":{"en":"Shall I wait until everyone joins before sharing?","jp":"全員がそろうまで共有を待ちましょうか？"},"question":{"en":"Shall I book a table for four at seven?","jp":"7時に4名でテーブルを予約しましょうか？"}},"examples":[{"id":"P48_01","en":"Shall I open the window for some fresh air?","tpl":"[[Shall I]] open the window for some fresh air?","jp":"換気のために窓を開けましょうか？","scene":"日常","alts":["Should I open the window?"]},{"id":"P48_02","en":"Shall I send you the calendar invite now?","tpl":"[[Shall I]] send you the calendar invite now?","jp":"今すぐカレンダーの招待をお送りしましょうか？","scene":"会議","alts":["Should I send the calendar invite now?"]},{"id":"P48_03","en":"Shall I bring you a cup of coffee?","tpl":"[[Shall I]] bring you a cup of coffee?","jp":"コーヒーをお持ちしましょうか？","scene":"職場","alts":["Would you like me to get you coffee?"]},{"id":"P48_04","en":"Shall I call a taxi to the airport for you?","tpl":"[[Shall I]] call a taxi to the airport for you?","jp":"空港行きのタクシーをお呼びしましょうか？","scene":"ホテル","alts":["Would you like me to call a cab?"]},{"id":"P48_05","en":"Shall I share my screen so we can review it?","tpl":"[[Shall I]] share my screen so we can review it?","jp":"確認できるように画面を共有しましょうか？","scene":"会議","alts":["Should I share my screen?"]},{"id":"P48_06","en":"Shall I take your coat?","tpl":"[[Shall I]] take your coat?","jp":"コートをお預かりしましょうか？","scene":"レストラン","alts":["May I take your coat?"]},{"id":"P48_07","en":"Shall I book a meeting room for tomorrow?","tpl":"[[Shall I]] book a meeting room for tomorrow?","jp":"明日の会議室を予約しましょうか？","scene":"職場","alts":["Should I reserve a room for tomorrow?"]},{"id":"P48_08","en":"Shall I hold the door for you?","tpl":"[[Shall I]] hold the door for you?","jp":"ドアを押さえておきましょうか？","scene":"日常","alts":["Let me hold the door for you."]},{"id":"P48_09","en":"Shall I print out the boarding passes?","tpl":"[[Shall I]] print out the boarding passes?","jp":"搭乗券を印刷しておきましょうか？","scene":"海外出張","alts":["Should I print the boarding passes?"]},{"id":"P48_10","en":"Shall I translate this message into English?","tpl":"[[Shall I]] translate this message into English?","jp":"このメッセージを英語に訳しましょうか？","scene":"職場","alts":["Would you like me to translate this?"]},{"id":"P48_11","en":"Shall I put these items in a separate bag?","tpl":"[[Shall I]] put these items in a separate bag?","jp":"こちらの商品は別の袋にお入れしましょうか？","scene":"買い物","alts":["Would you like a separate bag for these?"]},{"id":"P48_12","en":"Shall I pour you some more water?","tpl":"[[Shall I]] pour you some more water?","jp":"お水をもう少しお注ぎしましょうか？","scene":"レストラン","alts":["Would you like more water?"]},{"id":"P48_13","en":"Shall I take notes during the interview?","tpl":"[[Shall I]] take notes during the interview?","jp":"面接中にメモを取りましょうか？","scene":"職場","alts":["Should I take notes?"]},{"id":"P48_14","en":"Shall I check if the restaurant has openings?","tpl":"[[Shall I]] check if the restaurant has openings?","jp":"レストランに空きがあるか確認しましょうか？","scene":"旅行","alts":["Should I check for restaurant availability?"]},{"id":"P48_15","en":"Shall I turn up the brightness on the screen?","tpl":"[[Shall I]] turn up the brightness on the screen?","jp":"画面の明るさを上げましょうか？","scene":"会議","alts":["Should I brighten the screen?"]},{"id":"P48_16","en":"Shall I carry one of your suitcases?","tpl":"[[Shall I]] carry one of your suitcases?","jp":"スーツケースを1つお持ちしましょうか？","scene":"ホテル","alts":["Let me carry one of your bags."]},{"id":"P48_17","en":"Shall I double-check the total amount?","tpl":"[[Shall I]] double-check the total amount?","jp":"合計金額を再確認しましょうか？","scene":"買い物","alts":["Should I double-check the total?"]},{"id":"P48_18","en":"Shall I summarize our decisions at the end?","tpl":"[[Shall I]] summarize our decisions at the end?","jp":"最後に決定事項をまとめましょうか？","scene":"会議","alts":["Should I recap our decisions?"]},{"id":"P48_19","en":"Shall I order appetizers while we wait?","tpl":"[[Shall I]] order appetizers while we wait?","jp":"待っている間に前菜を頼んでおきましょうか？","scene":"レストラン","alts":["Should I order starters now?"]},{"id":"P48_20","en":"Shall I pick you up at the station?","tpl":"[[Shall I]] pick you up at the station?","jp":"駅まで迎えに行きましょうか？","scene":"友人","alts":["Want me to pick you up at the station?"]}]},{"id":"P49","catId":"cat5","pattern":"Please make sure to ...","meaning":"必ず〜するようにしてください","grammar":"Please make sure to + 動詞の原形（または make sure (that) + 主語 + 動詞）で、大事な注意点や確認事項を丁寧に伝えます。","usage":"仕事の手順案内、出張前のリマインダー、ホテルやイベントでの注意事項など、抜け漏れを防ぎたいときに使います。","nuance":"Don't forget to ... よりもビジネス向きで丁寧・プロフェッショナルな響きがあります。","similar":"Be sure to ...（ぜひ〜してね）／ Remember to ...（忘れずに〜して）","pitfall":"make sure の後ろは to + 原形、または that + 主語 + 動詞 の2パターンが使えます。","dialogue":[{"speaker":"A","en":"Everything is ready for tomorrow's flight to Frankfurt.","jp":"明日のフランクフルト便の準備はすべて整いました。"},{"speaker":"B","en":"Great! Please make sure to keep your receipts for the expense report.","jp":"よかった！経費精算用に領収書は必ず保管してくださいね。"},{"speaker":"A","en":"Will do. Anything else I should bring?","jp":"承知しました。他に持っていくべきものはありますか？"},{"speaker":"B","en":"Please make sure to pack a European power adapter just in case.","jp":"念のためヨーロッパ用の変換プラグも必ず入れておいてください。"}],"drills":{"subject":{"en":"I'll make sure to send the updated slides by five.","jp":"5時までに必ず更新版スライドをお送りします。"},"tense":{"en":"I made sure to lock the hotel safe before leaving.","jp":"出る前にホテルの金庫を確実に施錠しました。"},"negative":{"en":"Please make sure not to leave any belongings on the train.","jp":"電車内に忘れ物をしないよう必ずご確認ください。"},"question":{"en":"Did you make sure to attach the invoice?","jp":"請求書は確実に添付しましたか？"}},"examples":[{"id":"P49_01","en":"Please make sure to save your work regularly.","tpl":"[[Please make sure to]] save your work regularly.","jp":"こまめに作業を保存するようにしてください。","scene":"職場","alts":["Be sure to save your work often."]},{"id":"P49_02","en":"Please make sure to bring your passport tomorrow.","tpl":"[[Please make sure to]] bring your passport tomorrow.","jp":"明日は必ずパスポートをお持ちください。","scene":"海外出張","alts":["Don't forget your passport tomorrow."]},{"id":"P49_03","en":"Please make sure to double-check the dates.","tpl":"[[Please make sure to]] double-check the dates.","jp":"日付を必ず再確認してください。","scene":"会議","alts":["Please verify the dates."]},{"id":"P49_04","en":"Please make sure to return your key card at checkout.","tpl":"[[Please make sure to]] return your key card at checkout.","jp":"チェックアウト時に必ずカードキーをご返却ください。","scene":"ホテル","alts":["Be sure to hand back your key card."]},{"id":"P49_05","en":"Please make sure to mute your microphone when not speaking.","tpl":"[[Please make sure to]] mute your microphone when not speaking.","jp":"発言しないときは必ずマイクをミュートにしてください。","scene":"会議","alts":["Please keep your mic muted when listening."]},{"id":"P49_06","en":"Please make sure to keep the receipt for returns.","tpl":"[[Please make sure to]] keep the receipt for returns.","jp":"返品用に領収書を必ず保管してください。","scene":"買い物","alts":["Hold onto your receipt in case of returns."]},{"id":"P49_07","en":"Please make sure to arrive fifteen minutes early.","tpl":"[[Please make sure to]] arrive fifteen minutes early.","jp":"15分前には必ず到着するようにしてください。","scene":"職場","alts":["Please get there fifteen minutes early."]},{"id":"P49_08","en":"Please make sure to back up your photos before traveling.","tpl":"[[Please make sure to]] back up your photos before traveling.","jp":"旅行前に必ず写真をバックアップしてください。","scene":"旅行","alts":["Be sure to back up your photos."]},{"id":"P49_09","en":"Please make sure to label all files clearly.","tpl":"[[Please make sure to]] label all files clearly.","jp":"すべてのファイルに分かりやすい名前を必ず付けてください。","scene":"職場","alts":["Please name all files clearly."]},{"id":"P49_10","en":"Please make sure to confirm your seat assignment online.","tpl":"[[Please make sure to]] confirm your seat assignment online.","jp":"オンラインで座席指定を必ず確認してください。","scene":"海外出張","alts":["Be sure to check your seat online."]},{"id":"P49_11","en":"Please make sure to let us know about any allergies.","tpl":"[[Please make sure to]] let us know about any allergies.","jp":"アレルギーがあれば必ずお知らせください。","scene":"レストラン","alts":["Please tell us if you have any allergies."]},{"id":"P49_12","en":"Please make sure to lock the door on your way out.","tpl":"[[Please make sure to]] lock the door on your way out.","jp":"出るときは必ず鍵を閉めてください。","scene":"日常","alts":["Don't forget to lock the door."]},{"id":"P49_13","en":"Please make sure to charge your devices overnight.","tpl":"[[Please make sure to]] charge your devices overnight.","jp":"夜のうちに必ず端末を充電しておいてください。","scene":"旅行","alts":["Remember to charge your devices tonight."]},{"id":"P49_14","en":"Please make sure to include the client in the email loop.","tpl":"[[Please make sure to]] include the client in the email loop.","jp":"メールの宛先に必ずクライアントを入れてください。","scene":"職場","alts":["Be sure to CC the client."]},{"id":"P49_15","en":"Please make sure to wear comfortable walking shoes.","tpl":"[[Please make sure to]] wear comfortable walking shoes.","jp":"歩きやすい靴を必ず履いてきてください。","scene":"旅行","alts":["Be sure to wear comfortable shoes."]},{"id":"P49_16","en":"Please make sure to sign at the bottom of the form.","tpl":"[[Please make sure to]] sign at the bottom of the form.","jp":"用紙の下部に必ずご署名ください。","scene":"ホテル","alts":["Please sign the bottom of the form."]},{"id":"P49_17","en":"Please make sure to drink plenty of water on the flight.","tpl":"[[Please make sure to]] drink plenty of water on the flight.","jp":"機内では必ず水分をたっぷり取ってください。","scene":"海外出張","alts":["Stay well hydrated on the plane."]},{"id":"P49_18","en":"Please make sure to test the link before sending.","tpl":"[[Please make sure to]] test the link before sending.","jp":"送信前に必ずリンクが機能するかテストしてください。","scene":"会議","alts":["Check that the link works before sending."]},{"id":"P49_19","en":"Please make sure to check the washing label first.","tpl":"[[Please make sure to]] check the washing label first.","jp":"まず洗濯表示を必ず確認してください。","scene":"買い物","alts":["Be sure to read the care label."]},{"id":"P49_20","en":"Please make sure to text me when you get home safely.","tpl":"[[Please make sure to]] text me when you get home safely.","jp":"無事に家に着いたら必ず連絡してね。","scene":"友人","alts":["Let me know when you get home safe."]}]},{"id":"P50","catId":"cat5","pattern":"I'd appreciate it if you could ...","meaning":"〜していただけるとありがたいです","grammar":"I would appreciate it if you could + 動詞の原形 で、ビジネスにおける最上級の丁寧な依頼を表現します。","usage":"取引先・上司への依頼、重要な確認や迅速な対応をお願いしたいときのメールや会話の切り札です。","nuance":"感謝（appreciate）を先に伝えることで、相手が快く動きたくなる洗練されたビジネス英語になります。","similar":"I would be grateful if you could ...（さらにフォーマル）／ It would be great if you could ...（やや柔らかめ）","pitfall":"appreciate の後ろに必ず形式目的語の it を入れます（× I'd appreciate if you could → ○ I'd appreciate it if you could）。","dialogue":[{"speaker":"A","en":"We're finalizing the Q4 budget slide deck by Thursday noon.","jp":"木曜の正午までに第4四半期の予算スライドを確定させる予定です。"},{"speaker":"B","en":"Got it. Do you need our department's numbers before then?","jp":"承知しました。それまでに私たちの部署の数字が必要ですか？"},{"speaker":"A","en":"Yes, I'd appreciate it if you could send them by Wednesday evening.","jp":"はい、水曜の夕方までに送っていただけるとありがたいです。"},{"speaker":"B","en":"No problem, I'll make sure you have them by five on Wednesday.","jp":"了解です、水曜の5時までには必ずお送りします。"}],"drills":{"subject":{"en":"We'd really appreciate it if you could share your feedback.","jp":"フィードバックを共有していただけると大変ありがたいです。"},"tense":{"en":"I really appreciated it when you covered for me last week.","jp":"先週カバーしていただいたとき、本当にありがたかったです。"},"negative":{"en":"I'd appreciate it if you could keep this confidential for now.","jp":"今のところこの件は内密にしていただけるとありがたいです。"},"question":{"en":"Would you be able to send the quote by tomorrow? I'd really appreciate it.","jp":"明日までにお見積りをいただけますでしょうか？大変助かります。"}},"examples":[{"id":"P50_01","en":"I'd appreciate it if you could reply by Friday.","tpl":"[[I'd appreciate it if you could]] reply by Friday.","jp":"金曜日までにご返信いただけるとありがたいです。","scene":"職場","alts":["Could you please reply by Friday?"]},{"id":"P50_02","en":"I'd appreciate it if you could review the attached file.","tpl":"[[I'd appreciate it if you could]] review the attached file.","jp":"添付ファイルをご確認いただけるとありがたいです。","scene":"職場","alts":["Please take a look at the attached file."]},{"id":"P50_03","en":"I'd appreciate it if you could confirm the reservation.","tpl":"[[I'd appreciate it if you could]] confirm the reservation.","jp":"予約をご確認いただけるとありがたいです。","scene":"ホテル","alts":["Could you please confirm my booking?"]},{"id":"P50_04","en":"I'd appreciate it if you could share the meeting link.","tpl":"[[I'd appreciate it if you could]] share the meeting link.","jp":"会議のリンクを共有していただけるとありがたいです。","scene":"会議","alts":["Could you send over the meeting link?"]},{"id":"P50_05","en":"I'd appreciate it if you could speak a bit slower.","tpl":"[[I'd appreciate it if you could]] speak a bit slower.","jp":"もう少しゆっくり話していただけるとありがたいです。","scene":"海外出張","alts":["Could you speak slightly slower?"]},{"id":"P50_06","en":"I'd appreciate it if you could send me an updated quote.","tpl":"[[I'd appreciate it if you could]] send me an updated quote.","jp":"更新版のお見積りをお送りいただけるとありがたいです。","scene":"職場","alts":["Could you email me a revised quote?"]},{"id":"P50_07","en":"I'd appreciate it if you could keep this matter confidential.","tpl":"[[I'd appreciate it if you could]] keep this matter confidential.","jp":"この件は秘密にしていただけるとありがたいです。","scene":"会議","alts":["Please keep this confidential."]},{"id":"P50_08","en":"I'd appreciate it if you could arrange an airport pickup.","tpl":"[[I'd appreciate it if you could]] arrange an airport pickup.","jp":"空港送迎を手配していただけるとありがたいです。","scene":"ホテル","alts":["Could you organize an airport pickup?"]},{"id":"P50_09","en":"I'd appreciate it if you could introduce me to your team.","tpl":"[[I'd appreciate it if you could]] introduce me to your team.","jp":"御社のチームをご紹介いただけるとありがたいです。","scene":"海外出張","alts":["I would love to meet your team."]},{"id":"P50_10","en":"I'd appreciate it if you could check the delivery status.","tpl":"[[I'd appreciate it if you could]] check the delivery status.","jp":"配送状況を確認していただけるとありがたいです。","scene":"買い物","alts":["Could you check on my delivery?"]},{"id":"P50_11","en":"I'd appreciate it if you could clarify the payment terms.","tpl":"[[I'd appreciate it if you could]] clarify the payment terms.","jp":"支払い条件を明確にしていただけるとありがたいです。","scene":"職場","alts":["Could you explain the payment terms?"]},{"id":"P50_12","en":"I'd appreciate it if you could give me honest feedback.","tpl":"[[I'd appreciate it if you could]] give me honest feedback.","jp":"率直なフィードバックをいただけるとありがたいです。","scene":"会議","alts":["I would love your honest feedback."]},{"id":"P50_13","en":"I'd appreciate it if you could hold my room for late arrival.","tpl":"[[I'd appreciate it if you could]] hold my room for late arrival.","jp":"到着が遅くなるためお部屋を確保しておいていただけるとありがたいです。","scene":"ホテル","alts":["Please note I will arrive late."]},{"id":"P50_14","en":"I'd appreciate it if you could forward this to the right person.","tpl":"[[I'd appreciate it if you could]] forward this to the right person.","jp":"適切なご担当者様へ転送していただけるとありがたいです。","scene":"職場","alts":["Could you pass this to the right contact?"]},{"id":"P50_15","en":"I'd appreciate it if you could let me know by noon.","tpl":"[[I'd appreciate it if you could]] let me know by noon.","jp":"正午までにお知らせいただけるとありがたいです。","scene":"会議","alts":["Could you tell me by noon?"]},{"id":"P50_16","en":"I'd appreciate it if you could double-check the invoice number.","tpl":"[[I'd appreciate it if you could]] double-check the invoice number.","jp":"請求書番号を再確認していただけるとありがたいです。","scene":"職場","alts":["Could you verify the invoice number?"]},{"id":"P50_17","en":"I'd appreciate it if you could provide a brief summary.","tpl":"[[I'd appreciate it if you could]] provide a brief summary.","jp":"簡単な要約をいただけるとありがたいです。","scene":"会議","alts":["Could you share a short summary?"]},{"id":"P50_18","en":"I'd appreciate it if you could seat us in a quiet corner.","tpl":"[[I'd appreciate it if you could]] seat us in a quiet corner.","jp":"静かな角の席にご案内いただけるとありがたいです。","scene":"レストラン","alts":["Could we have a quiet corner table?"]},{"id":"P50_19","en":"I'd appreciate it if you could waive the change fee this time.","tpl":"[[I'd appreciate it if you could]] waive the change fee this time.","jp":"今回に限り変更手数料を免除していただけるとありがたいです。","scene":"海外出張","alts":["Is there any chance the change fee could be waived?"]},{"id":"P50_20","en":"I'd appreciate it if you could notify me once it's back in stock.","tpl":"[[I'd appreciate it if you could]] notify me once it's back in stock.","jp":"再入荷したらお知らせいただけるとありがたいです。","scene":"買い物","alts":["Please let me know when it is restocked."]}]},{"id":"P51","catId":"cat6","pattern":"I have to ...","meaning":"〜しなければなりません","grammar":"I have to + 動詞の原形 で、ルール・スケジュール・状況から生じる客観的な義務を表します。","usage":"仕事の締め切り、移動の都合、日常の用事、断るときの理由説明など毎日使う基本構文です。","nuance":"must より日常会話で圧倒的によく使われます。口語では hafta のように発音されます。","similar":"I need to ...（必要性を強調）／ I must ...（強い決意・規則）","pitfall":"否定の I don't have to ... は「〜してはいけない（禁止）」ではなく「〜する必要はない（不必要）」になります！","dialogue":[{"speaker":"A","en":"Want to grab a drink after work today?","jp":"今日、仕事終わりに一杯いかない？"},{"speaker":"B","en":"I'd love to, but I have to finish packing for my trip tomorrow.","jp":"行きたいんだけど、明日の出張の荷造りを終わらせないといけないんだ。"},{"speaker":"A","en":"Oh right, you're heading to London! What time is your flight?","jp":"そうだった、ロンドンに行くんだよね！フライトは何時？"},{"speaker":"B","en":"Nine AM, so I have to leave my apartment by six.","jp":"朝9時だから、6時までには家を出ないといけないんだ。"}],"drills":{"subject":{"en":"He has to submit the visa application by Monday.","jp":"彼は月曜日までにビザ申請書を提出しなければなりません。"},"tense":{"en":"I had to wait forty minutes at immigration.","jp":"入国審査で40分待たなければなりませんでした。"},"negative":{"en":"I don't have to commute to the office on Fridays.","jp":"金曜日はオフィスに出社する必要がありません。"},"question":{"en":"Do I have to print out my ticket, or is mobile okay?","jp":"チケットは印刷する必要がありますか、それともスマホで大丈夫ですか？"}},"examples":[{"id":"P51_01","en":"I have to leave early today.","tpl":"[[I have to]] leave early today.","jp":"今日は早退しなければなりません。","scene":"職場","alts":["I need to head out early today."]},{"id":"P51_02","en":"I have to catch the seven AM train.","tpl":"[[I have to]] catch the seven AM train.","jp":"朝7時の電車に乗らなければなりません。","scene":"日常","alts":["I need to make the seven AM train."]},{"id":"P51_03","en":"I have to finish this report before noon.","tpl":"[[I have to]] finish this report before noon.","jp":"正午までにこのレポートを終わらせなければなりません。","scene":"職場","alts":["I need to wrap up this report by noon."]},{"id":"P51_04","en":"I have to renew my passport next month.","tpl":"[[I have to]] renew my passport next month.","jp":"来月パスポートを更新しなければなりません。","scene":"旅行","alts":["I need to renew my passport next month."]},{"id":"P51_05","en":"I have to check out of the hotel by eleven.","tpl":"[[I have to]] check out of the hotel by eleven.","jp":"11時までにホテルをチェックアウトしなければなりません。","scene":"ホテル","alts":["Checkout is at eleven, so I have to leave by then."]},{"id":"P51_06","en":"I have to prepare slides for tomorrow's meeting.","tpl":"[[I have to]] prepare slides for tomorrow's meeting.","jp":"明日の会議のためにスライドを用意しなければなりません。","scene":"会議","alts":["I need to make slides for tomorrow."]},{"id":"P51_07","en":"I have to pick up groceries on my way home.","tpl":"[[I have to]] pick up groceries on my way home.","jp":"帰りに食料品を買って帰らなければなりません。","scene":"買い物","alts":["I need to stop by the grocery store."]},{"id":"P51_08","en":"I have to call the airline about my luggage.","tpl":"[[I have to]] call the airline about my luggage.","jp":"荷物のことで航空会社に電話しなければなりません。","scene":"海外出張","alts":["I need to contact the airline about my bag."]},{"id":"P51_09","en":"I have to get up at five tomorrow morning.","tpl":"[[I have to]] get up at five tomorrow morning.","jp":"明日の朝は5時に起きなければなりません。","scene":"日常","alts":["I need to wake up at five tomorrow."]},{"id":"P51_10","en":"I have to confirm the guest count with the restaurant.","tpl":"[[I have to]] confirm the guest count with the restaurant.","jp":"レストランに人数を確認しなければなりません。","scene":"レストラン","alts":["I need to confirm how many people are coming."]},{"id":"P51_11","en":"I have to attend a client call at three.","tpl":"[[I have to]] attend a client call at three.","jp":"3時にクライアントとの通話に出なければなりません。","scene":"職場","alts":["I have a client call at three."]},{"id":"P51_12","en":"I have to submit my expense receipts by Friday.","tpl":"[[I have to]] submit my expense receipts by Friday.","jp":"金曜日までに経費の領収書を提出しなければなりません。","scene":"海外出張","alts":["I need to turn in my receipts by Friday."]},{"id":"P51_13","en":"I have to return this library book today.","tpl":"[[I have to]] return this library book today.","jp":"今日この図書館の本を返さなければなりません。","scene":"日常","alts":["This library book is due today."]},{"id":"P51_14","en":"I have to buy a suit for the conference.","tpl":"[[I have to]] buy a suit for the conference.","jp":"カンファレンス用にスーツを買わなければなりません。","scene":"買い物","alts":["I need to get a suit for the conference."]},{"id":"P51_15","en":"I have to check my emails before boarding.","tpl":"[[I have to]] check my emails before boarding.","jp":"搭乗前にメールを確認しなければなりません。","scene":"海外出張","alts":["I need to check email before getting on the plane."]},{"id":"P51_16","en":"I have to apologize for the misunderstanding.","tpl":"[[I have to]] apologize for the misunderstanding.","jp":"誤解について謝罪しなければなりません。","scene":"職場","alts":["I owe them an apology for the mix-up."]},{"id":"P51_17","en":"I have to exchange some cash before leaving the airport.","tpl":"[[I have to]] exchange some cash before leaving the airport.","jp":"空港を出る前に少し現金を両替しなければなりません。","scene":"旅行","alts":["I need to get some local cash at the airport."]},{"id":"P51_18","en":"I have to watch my caffeine intake lately.","tpl":"[[I have to]] watch my caffeine intake lately.","jp":"最近はカフェインの摂取量に気をつけなければなりません。","scene":"日常","alts":["I need to limit my caffeine lately."]},{"id":"P51_19","en":"I have to head back to the office right after lunch.","tpl":"[[I have to]] head back to the office right after lunch.","jp":"昼食後すぐにオフィスに戻らなければなりません。","scene":"職場","alts":["I need to go straight back after lunch."]},{"id":"P51_20","en":"I have to admit, your presentation was impressive.","tpl":"[[I have to]] admit, your presentation was impressive.","jp":"認めざるを得ないですね、あなたのプレゼンは素晴らしかったです。","scene":"会議","alts":["I must say, your presentation was great."]}]},{"id":"P52","catId":"cat6","pattern":"I need to ...","meaning":"〜する必要があります","grammar":"I need to + 動詞の原形 で、自分自身が必要だと判断している行動を表します。","usage":"仕事のタスク整理、体調管理、確認事項、買い物、時間管理など、前向き・主体的な必要性を語るときに使います。","nuance":"I have to ...（外からの義務）に比べ、I need to ... は「自分のために・目的のために〜が必要だ」という納得感があります。","similar":"I have to ...（外的な義務）／ I gotta ...（超カジュアルな口語）","pitfall":"「〜が要る」と名詞を続けるときは to を外します（○ I need a charger. / ○ I need to buy a charger.）。","dialogue":[{"speaker":"A","en":"Are we ready to send the proposal to the client?","jp":"提案書をクライアントに送る準備はできましたか？"},{"speaker":"B","en":"Almost! I just need to double-check the pricing table on page four.","jp":"ほぼ完成です！4ページ目の料金表だけ再確認する必要があります。"},{"speaker":"A","en":"Take your time. Accuracy is way more important.","jp":"ゆっくりどうぞ。正確さの方がずっと大事ですから。"},{"speaker":"B","en":"Thanks. I also need to export it as a clean PDF, then I'll send it over.","jp":"ありがとうございます。きれいなPDFに書き出してすぐお送りします。"}],"drills":{"subject":{"en":"Our team needs to align on the Q3 goals.","jp":"私たちのチームは第3四半期の目標をすり合わせる必要があります。"},"tense":{"en":"I needed to rest after that twelve-hour flight.","jp":"12時間のフライトのあとは休む必要がありました。"},"negative":{"en":"I don't need to print the boarding pass anymore.","jp":"もう搭乗券を印刷する必要はありません。"},"question":{"en":"Do I need to reserve a seat on the airport train?","jp":"空港行きの電車は座席指定が必要ですか？"}},"examples":[{"id":"P52_01","en":"I need to charge my phone before we leave.","tpl":"[[I need to]] charge my phone before we leave.","jp":"出発前にスマホを充電する必要があります。","scene":"日常","alts":["I should charge my phone before heading out."]},{"id":"P52_02","en":"I need to confirm the schedule with my manager.","tpl":"[[I need to]] confirm the schedule with my manager.","jp":"マネージャーとスケジュールを確認する必要があります。","scene":"職場","alts":["I have to check the schedule with my boss."]},{"id":"P52_03","en":"I need to practice my English presentation tonight.","tpl":"[[I need to]] practice my English presentation tonight.","jp":"今夜、英語プレゼンの練習をする必要があります。","scene":"会議","alts":["I have to rehearse my English talk tonight."]},{"id":"P52_04","en":"I need to get some sleep before tomorrow's flight.","tpl":"[[I need to]] get some sleep before tomorrow's flight.","jp":"明日のフライト前に少し寝る必要があります。","scene":"海外出張","alts":["I should get some rest before flying tomorrow."]},{"id":"P52_05","en":"I need to buy a comfortable pair of walking shoes.","tpl":"[[I need to]] buy a comfortable pair of walking shoes.","jp":"歩きやすい靴を1足買う必要があります。","scene":"買い物","alts":["I should get comfortable walking shoes."]},{"id":"P52_06","en":"I need to step out for a five-minute phone call.","tpl":"[[I need to]] step out for a five-minute phone call.","jp":"5分ほど電話のため席を外す必要があります。","scene":"会議","alts":["Excuse me, I need to take a quick call."]},{"id":"P52_07","en":"I need to check my gate number on the monitor.","tpl":"[[I need to]] check my gate number on the monitor.","jp":"モニターで搭乗ゲート番号を確認する必要があります。","scene":"旅行","alts":["Let me check my gate on the screen."]},{"id":"P52_08","en":"I need to ask the front desk for a wake-up call.","tpl":"[[I need to]] ask the front desk for a wake-up call.","jp":"フロントにモーニングコールを頼む必要があります。","scene":"ホテル","alts":["I should request a wake-up call."]},{"id":"P52_09","en":"I need to drink more water during the workday.","tpl":"[[I need to]] drink more water during the workday.","jp":"仕事中にもっと水を飲む必要があります。","scene":"日常","alts":["I should stay more hydrated at work."]},{"id":"P52_10","en":"I need to update my resume before applying.","tpl":"[[I need to]] update my resume before applying.","jp":"応募する前に履歴書を更新する必要があります。","scene":"職場","alts":["I have to refresh my resume first."]},{"id":"P52_11","en":"I need to find a quiet spot to join the Zoom meeting.","tpl":"[[I need to]] find a quiet spot to join the Zoom meeting.","jp":"Zoom会議に入るために静かな場所を見つける必要があります。","scene":"海外出張","alts":["I need a quiet place for my Zoom call."]},{"id":"P52_12","en":"I need to verify the total on this bill.","tpl":"[[I need to]] verify the total on this bill.","jp":"この請求書の合計を確認する必要があります。","scene":"レストラン","alts":["Let me check the total on the bill."]},{"id":"P52_13","en":"I need to organize my inbox this afternoon.","tpl":"[[I need to]] organize my inbox this afternoon.","jp":"今日の午後に受信トレイを整理する必要があります。","scene":"職場","alts":["I should clean up my inbox today."]},{"id":"P52_14","en":"I need to pick up a small gift for my host.","tpl":"[[I need to]] pick up a small gift for my host.","jp":"ホストへのちょっとした手土産を買う必要があります。","scene":"買い物","alts":["I should get a small gift for my host."]},{"id":"P52_15","en":"I need to take a quick stretch break.","tpl":"[[I need to]] take a quick stretch break.","jp":"少しストレッチ休憩を取る必要があります。","scene":"日常","alts":["I could use a quick stretch."]},{"id":"P52_16","en":"I need to review the contract before signing.","tpl":"[[I need to]] review the contract before signing.","jp":"署名する前に契約書を確認する必要があります。","scene":"会議","alts":["I must read the contract before signing."]},{"id":"P52_17","en":"I need to exchange my currency at the airport.","tpl":"[[I need to]] exchange my currency at the airport.","jp":"空港で外貨を両替する必要があります。","scene":"旅行","alts":["I should exchange money at the airport."]},{"id":"P52_18","en":"I need to request a late checkout by ten AM.","tpl":"[[I need to]] request a late checkout by ten AM.","jp":"朝10時までにレイトチェックアウトを申請する必要があります。","scene":"ホテル","alts":["I should ask for late checkout before ten."]},{"id":"P52_19","en":"I need to follow up with Sarah about the design.","tpl":"[[I need to]] follow up with Sarah about the design.","jp":"デザインの件でサラにフォロー連絡をする必要があります。","scene":"職場","alts":["I should follow up with Sarah on the design."]},{"id":"P52_20","en":"I need to think about it for a day before deciding.","tpl":"[[I need to]] think about it for a day before deciding.","jp":"決める前に1日考える必要があります。","scene":"日常","alts":["Let me sleep on it before deciding."]}]},{"id":"P53","catId":"cat6","pattern":"You should ...","meaning":"〜した方がいいですよ","grammar":"You should + 動詞の原形 で、相手へのおすすめ・助言・アドバイスを伝えます。","usage":"おすすめスポットの紹介、仕事上のアドバイス、体調を気遣うひと言など、親切な提案に幅広く使えます。","nuance":"「絶対やれ」ではなく「〜するといいですよ」という温かいアドバイスのトーン。definitely を入れると「絶対おすすめ！」になります。","similar":"You'd better ...（しないと困るという強い忠告）／ Why don't you ...?（さらに軽い提案）","pitfall":"should の後ろは常に動詞の原形（to は不要）。また否定は You shouldn't + 原形 です。","dialogue":[{"speaker":"A","en":"I have a free afternoon in Yokohama tomorrow. Any recommendations?","jp":"明日の午後、横浜で空き時間があるんです。何かおすすめはありますか？"},{"speaker":"B","en":"You should definitely walk along the waterfront near Minato Mirai.","jp":"みなとみらいの海沿いを歩くのは絶対におすすめですよ。"},{"speaker":"A","en":"Nice! What about food around there?","jp":"いいですね！その辺りの食べ物はどうですか？"},{"speaker":"B","en":"You should try the dumplings in Chinatown—it's just a short walk away.","jp":"中華街で小籠包や餃子を食べてみるといいですよ。歩いてすぐです。"}],"drills":{"subject":{"en":"We should double-check the numbers before publishing.","jp":"公開する前に数字を再確認すべきです。"},"tense":{"en":"You should have seen the sunset from the hotel roof.","jp":"ホテルの屋上からの夕日、あなたにも見てほしかったです。"},"negative":{"en":"You shouldn't skip breakfast before a busy workday.","jp":"忙しい仕事の前に朝食を抜かない方がいいですよ。"},"question":{"en":"Should I bring a light jacket for the evening?","jp":"夜用に薄手のジャケットを持っていった方がいいですか？"}},"examples":[{"id":"P53_01","en":"You should try the ramen shop near the station.","tpl":"[[You should]] try the ramen shop near the station.","jp":"駅の近くのラーメン屋に行ってみるといいですよ。","scene":"レストラン","alts":["You ought to try the ramen place by the station."]},{"id":"P53_02","en":"You should book your hotel early for cherry blossom season.","tpl":"[[You should]] book your hotel early for cherry blossom season.","jp":"桜の季節は早めにホテルを予約した方がいいですよ。","scene":"ホテル","alts":["It is smart to book early for sakura season."]},{"id":"P53_03","en":"You should get some rest if you have a fever.","tpl":"[[You should]] get some rest if you have a fever.","jp":"熱があるなら休んだ方がいいですよ。","scene":"日常","alts":["Please rest if you have a fever."]},{"id":"P53_04","en":"You should back up your laptop before the trip.","tpl":"[[You should]] back up your laptop before the trip.","jp":"出張前にノートパソコンをバックアップしておいた方がいいですよ。","scene":"海外出張","alts":["Make sure to back up your laptop first."]},{"id":"P53_05","en":"You should ask the manager before changing the price.","tpl":"[[You should]] ask the manager before changing the price.","jp":"価格を変える前にマネージャーに確認した方がいいですよ。","scene":"職場","alts":["Check with the manager before changing the price."]},{"id":"P53_06","en":"You should download an offline map before flying.","tpl":"[[You should]] download an offline map before flying.","jp":"飛行機に乗る前にオフライン地図をダウンロードしておくとよいです。","scene":"旅行","alts":["Grab an offline map before your flight."]},{"id":"P53_07","en":"You should wear comfortable shoes—we'll walk a lot.","tpl":"[[You should]] wear comfortable shoes—we'll walk a lot.","jp":"たくさん歩くので歩きやすい靴を履いた方がいいですよ。","scene":"旅行","alts":["Comfortable shoes are a must today."]},{"id":"P53_08","en":"You should keep the slides concise and readable.","tpl":"[[You should]] keep the slides concise and readable.","jp":"スライドは簡潔で読みやすくした方がいいですよ。","scene":"会議","alts":["Try to keep the slides short and clear."]},{"id":"P53_09","en":"You should check the return policy before buying.","tpl":"[[You should]] check the return policy before buying.","jp":"買う前に返品規定を確認した方がいいですよ。","scene":"買い物","alts":["Look at the return policy first."]},{"id":"P53_10","en":"You should arrive at the airport two hours early.","tpl":"[[You should]] arrive at the airport two hours early.","jp":"空港には2時間前に着いた方がいいですよ。","scene":"海外出張","alts":["Get to the airport two hours ahead."]},{"id":"P53_11","en":"You should taste the seasonal soup here.","tpl":"[[You should]] taste the seasonal soup here.","jp":"ここの季節のスープをぜひ味わってみてください。","scene":"レストラン","alts":["Definitely try the seasonal soup."]},{"id":"P53_12","en":"You should take a short break every hour.","tpl":"[[You should]] take a short break every hour.","jp":"1時間ごとに少し休憩を取った方がいいですよ。","scene":"職場","alts":["Try taking a brief break every hour."]},{"id":"P53_13","en":"You should speak up if anything is unclear.","tpl":"[[You should]] speak up if anything is unclear.","jp":"分からないことがあれば遠慮なく言った方がいいですよ。","scene":"会議","alts":["Let us know if anything isn't clear."]},{"id":"P53_14","en":"You should bring an umbrella—it might rain later.","tpl":"[[You should]] bring an umbrella—it might rain later.","jp":"あとで降るかもしれないので傘を持っていった方がいいですよ。","scene":"日常","alts":["Better take an umbrella just in case."]},{"id":"P53_15","en":"You should try learning phrases out loud.","tpl":"[[You should]] try learning phrases out loud.","jp":"フレーズを声に出して覚えるといいですよ。","scene":"日常","alts":["Practicing phrases aloud really helps."]},{"id":"P53_16","en":"You should visit the rooftop garden at sunset.","tpl":"[[You should]] visit the rooftop garden at sunset.","jp":"夕暮れ時に屋上庭園に行ってみるといいですよ。","scene":"ホテル","alts":["The rooftop garden is lovely at sunset."]},{"id":"P53_17","en":"You should compare at least two quotes.","tpl":"[[You should]] compare at least two quotes.","jp":"少なくとも2社から見積もりを比較した方がいいですよ。","scene":"職場","alts":["It helps to compare two quotes."]},{"id":"P53_18","en":"You should try the coat on over a thick sweater.","tpl":"[[You should]] try the coat on over a thick sweater.","jp":"厚手のセーターの上からコートを試着した方がいいですよ。","scene":"買い物","alts":["Test the coat over a sweater."]},{"id":"P53_19","en":"You should tell your friend how you really feel.","tpl":"[[You should]] tell your friend how you really feel.","jp":"友達に本当の気持ちを伝えた方がいいよ。","scene":"友人","alts":["Be honest with your friend."]},{"id":"P53_20","en":"You should celebrate—you worked really hard on this.","tpl":"[[You should]] celebrate—you worked really hard on this.","jp":"お祝いした方がいいですよ、本当に頑張りましたから。","scene":"職場","alts":["You deserve to celebrate this."]}]},{"id":"P54","catId":"cat6","pattern":"You don't have to ...","meaning":"〜する必要はありません","grammar":"You don't have to + 動詞の原形 で、「〜しなくても大丈夫ですよ」と相手の負担を軽くしてあげます。","usage":"来客や同僚への気遣い、手続きの簡略化案内、丁寧な辞退へのフォローに欠かせません。","nuance":"相手を安心させる優しい表現。「〜してはいけない（must not）」とはまったく意味が違うので最重要区別ポイントです。","similar":"You don't need to ...（必要ないよ）／ There's no need to ...（〜する必要はありません・丁寧）","pitfall":"must not（絶対禁止）と don't have to（不要）の混同に要注意！「急がなくていいよ」は You don't have to rush. です。","dialogue":[{"speaker":"A","en":"Sorry, should I print out ten copies of the handout before we start?","jp":"すみません、始める前に資料を10部印刷した方がいいですか？"},{"speaker":"B","en":"Oh, you don't have to print anything—everyone has it on their laptop.","jp":"あ、印刷しなくて大丈夫ですよ。全員パソコンで見られますから。"},{"speaker":"A","en":"Whew, that saves me ten minutes!","jp":"ほっ、10分浮きました！"},{"speaker":"B","en":"You don't have to rush either; we'll start in five minutes.","jp":"急がなくても大丈夫ですよ、5分後に始めますから。"}],"drills":{"subject":{"en":"She doesn't have to attend the optional Friday session.","jp":"彼女は任意の金曜セッションには出る必要がありません。"},"tense":{"en":"We didn't have to wait long at the restaurant.","jp":"レストランではあまり待たずに済みました。"},"negative":{"en":"You don't have to apologize—it wasn't your fault.","jp":"謝る必要はありませんよ、あなたのせいじゃないですから。"},"question":{"en":"We don't have to pay upfront, right?","jp":"前払いする必要はないんですよね？"}},"examples":[{"id":"P54_01","en":"You don't have to worry about it.","tpl":"[[You don't have to]] worry about it.","jp":"心配する必要はありませんよ。","scene":"日常","alts":["No need to worry about it."]},{"id":"P54_02","en":"You don't have to rush—take your time.","tpl":"[[You don't have to]] rush—take your time.","jp":"急がなくて大丈夫ですよ、ゆっくりどうぞ。","scene":"職場","alts":["There is no rush; take your time."]},{"id":"P54_03","en":"You don't have to tip in restaurants in Japan.","tpl":"[[You don't have to]] tip in restaurants in Japan.","jp":"日本のレストランではチップを払う必要はありません。","scene":"レストラン","alts":["Tipping isn't necessary in Japan."]},{"id":"P54_04","en":"You don't have to bring anything to the party.","tpl":"[[You don't have to]] bring anything to the party.","jp":"パーティーには何も持ってこなくて大丈夫ですよ。","scene":"友人","alts":["Just bring yourself to the party."]},{"id":"P54_05","en":"You don't have to wear a tie for tomorrow's meeting.","tpl":"[[You don't have to]] wear a tie for tomorrow's meeting.","jp":"明日の会議はネクタイをしなくて大丈夫ですよ。","scene":"会議","alts":["No tie is needed tomorrow."]},{"id":"P54_06","en":"You don't have to check out until noon.","tpl":"[[You don't have to]] check out until noon.","jp":"正午までチェックアウトしなくて大丈夫ですよ。","scene":"ホテル","alts":["Checkout isn't until noon."]},{"id":"P54_07","en":"You don't have to decide right this second.","tpl":"[[You don't have to]] decide right this second.","jp":"今すぐ決めなくても大丈夫ですよ。","scene":"買い物","alts":["Take your time deciding."]},{"id":"P54_08","en":"You don't have to speak perfect English to communicate.","tpl":"[[You don't have to]] speak perfect English to communicate.","jp":"意思疎通するのに完璧な英語を話す必要はありません。","scene":"日常","alts":["Your English doesn't need to be perfect."]},{"id":"P54_09","en":"You don't have to wait for me—go ahead and eat.","tpl":"[[You don't have to]] wait for me—go ahead and eat.","jp":"私を待たなくていいですよ、先に食べてください。","scene":"レストラン","alts":["Go ahead and start eating without me."]},{"id":"P54_10","en":"You don't have to print your boarding pass anymore.","tpl":"[[You don't have to]] print your boarding pass anymore.","jp":"もう搭乗券を印刷する必要はありません。","scene":"海外出張","alts":["A mobile boarding pass is fine."]},{"id":"P54_11","en":"You don't have to translate every single word.","tpl":"[[You don't have to]] translate every single word.","jp":"すべての単語を一つひとつ訳す必要はありません。","scene":"日常","alts":["Don't translate word for word."]},{"id":"P54_12","en":"You don't have to work over the weekend.","tpl":"[[You don't have to]] work over the weekend.","jp":"週末に仕事をする必要はありませんよ。","scene":"職場","alts":["Enjoy your weekend off."]},{"id":"P54_13","en":"You don't have to buy an expensive suitcase.","tpl":"[[You don't have to]] buy an expensive suitcase.","jp":"高いスーツケースを買う必要はありませんよ。","scene":"買い物","alts":["An affordable suitcase works fine."]},{"id":"P54_14","en":"You don't have to book the museum ticket in advance.","tpl":"[[You don't have to]] book the museum ticket in advance.","jp":"美術館のチケットは事前予約しなくても大丈夫です。","scene":"旅行","alts":["You can just buy tickets at the door."]},{"id":"P54_15","en":"You don't have to explain everything in detail right now.","tpl":"[[You don't have to]] explain everything in detail right now.","jp":"今すべてを詳しく説明しなくても大丈夫です。","scene":"会議","alts":["A brief overview is fine for now."]},{"id":"P54_16","en":"You don't have to carry cash everywhere here.","tpl":"[[You don't have to]] carry cash everywhere here.","jp":"ここではどこでも現金を持ち歩く必要はありません。","scene":"旅行","alts":["Cards are accepted almost everywhere here."]},{"id":"P54_17","en":"You don't have to stay for the whole reception.","tpl":"[[You don't have to]] stay for the whole reception.","jp":"懇親会の最後までいなくても大丈夫ですよ。","scene":"海外出張","alts":["Feel free to leave whenever you need."]},{"id":"P54_18","en":"You don't have to apologize—it happens to everyone.","tpl":"[[You don't have to]] apologize—it happens to everyone.","jp":"謝らなくていいですよ、誰にでもありますから。","scene":"友人","alts":["No need to apologize."]},{"id":"P54_19","en":"You don't have to reserve the hotel gym in advance.","tpl":"[[You don't have to]] reserve the hotel gym in advance.","jp":"ホテルのジムは事前予約不要です。","scene":"ホテル","alts":["No reservation is required for the gym."]},{"id":"P54_20","en":"You don't have to reply to this email.","tpl":"[[You don't have to]] reply to this email.","jp":"このメールへの返信は不要です。","scene":"職場","alts":["No reply is needed."]}]},{"id":"P55","catId":"cat6","pattern":"I'm supposed to ...","meaning":"〜することになっています","grammar":"I'm supposed to + 動詞の原形 で、予定・約束・ルール・周囲の期待によって「〜するはずになっている」ことを表します。","usage":"スケジュールの説明、職場のルール、天気予報（It's supposed to rain）、予定と現実のギャップを伝えるときに大活躍します。","nuance":"「本来の予定や決まりではこうなっている（でも実際は変わるかも／まだできていない）」という微妙な含みが出せるネイティブ超頻出表現です。","similar":"I'm scheduled to ...（公式スケジュール）／ I'm expected to ...（期待されている）","pitfall":"be動詞を忘れやすいので注意（× I supposed to → ○ I'm supposed to）。発音は supposed to が「サポゥストゥ」のように滑らかにつながります。","dialogue":[{"speaker":"A","en":"Hey, aren't you heading to the client workshop now?","jp":"あれ、今クライアントのワークショップに向かっているんじゃなかった？"},{"speaker":"B","en":"Yeah, I'm supposed to be there at two, so I'm grabbing my laptop now.","jp":"そう、2時にそこに着くことになってるから今パソコンを持って出るところだよ。"},{"speaker":"A","en":"Take an umbrella—it's supposed to pour this afternoon.","jp":"傘を持っていきなよ。今日の午後は土砂降りになる予報だよ。"},{"speaker":"B","en":"Oh, thanks for the heads-up! I'll grab one by the door.","jp":"あ、教えてくれてありがとう！玄関で1本持っていくよ。"}],"drills":{"subject":{"en":"The package is supposed to arrive before six tonight.","jp":"荷物は今夜6時までに届くことになっています。"},"tense":{"en":"I was supposed to fly out yesterday, but the storm delayed us.","jp":"昨日出発する予定でしたが、嵐で遅れました。"},"negative":{"en":"We're not supposed to take photos inside the showroom.","jp":"ショールーム内では写真を撮ってはいけないことになっています。"},"question":{"en":"What time are we supposed to meet the client?","jp":"クライアントとは何時に会うことになっていますか？"}},"examples":[{"id":"P55_01","en":"I'm supposed to meet a client at three.","tpl":"[[I'm supposed to]] meet a client at three.","jp":"3時にクライアントと会うことになっています。","scene":"職場","alts":["I am scheduled to meet a client at three."]},{"id":"P55_02","en":"I'm supposed to submit the draft by Friday.","tpl":"[[I'm supposed to]] submit the draft by Friday.","jp":"金曜日までに下書きを提出することになっています。","scene":"職場","alts":["The draft is due on Friday."]},{"id":"P55_03","en":"I'm supposed to fly to Singapore next week.","tpl":"[[I'm supposed to]] fly to Singapore next week.","jp":"来週シンガポールへ飛ぶ予定になっています。","scene":"海外出張","alts":["I am scheduled to fly to Singapore next week."]},{"id":"P55_04","en":"I'm supposed to check in after three PM.","tpl":"[[I'm supposed to]] check in after three PM.","jp":"午後3時以降にチェックインすることになっています。","scene":"ホテル","alts":["Check-in starts at three PM."]},{"id":"P55_05","en":"I'm supposed to give a ten-minute update today.","tpl":"[[I'm supposed to]] give a ten-minute update today.","jp":"今日は10分間の進捗報告をすることになっています。","scene":"会議","alts":["I am scheduled to give a ten-minute update."]},{"id":"P55_06","en":"I'm supposed to pick up my friend at the airport.","tpl":"[[I'm supposed to]] pick up my friend at the airport.","jp":"空港まで友達を迎えに行くことになっています。","scene":"旅行","alts":["I am meeting my friend at the airport."]},{"id":"P55_07","en":"I'm supposed to take this medicine after meals.","tpl":"[[I'm supposed to]] take this medicine after meals.","jp":"この薬は食後に飲むことになっています。","scene":"日常","alts":["I need to take this medicine after eating."]},{"id":"P55_08","en":"I'm supposed to receive the tracking number today.","tpl":"[[I'm supposed to]] receive the tracking number today.","jp":"今日中に追跡番号を受け取るはずになっています。","scene":"買い物","alts":["They said I would get the tracking number today."]},{"id":"P55_09","en":"I'm supposed to lead the kickoff meeting tomorrow.","tpl":"[[I'm supposed to]] lead the kickoff meeting tomorrow.","jp":"明日のキックオフ会議の進行をすることになっています。","scene":"会議","alts":["I am set to run tomorrow's kickoff."]},{"id":"P55_10","en":"I'm supposed to call my parents this evening.","tpl":"[[I'm supposed to]] call my parents this evening.","jp":"今夜両親に電話することになっています。","scene":"日常","alts":["I promised to call my parents tonight."]},{"id":"P55_11","en":"I'm supposed to stay at the harbor hotel for three nights.","tpl":"[[I'm supposed to]] stay at the harbor hotel for three nights.","jp":"ハーバーホテルに3泊することになっています。","scene":"ホテル","alts":["My booking is for three nights at the harbor hotel."]},{"id":"P55_12","en":"I'm supposed to bring a dessert to the dinner party.","tpl":"[[I'm supposed to]] bring a dessert to the dinner party.","jp":"ディナーパーティーにデザートを持っていくことになっています。","scene":"友人","alts":["I am in charge of bringing dessert."]},{"id":"P55_13","en":"I'm supposed to meet the sales team for lunch.","tpl":"[[I'm supposed to]] meet the sales team for lunch.","jp":"営業チームとランチすることになっています。","scene":"職場","alts":["I have lunch planned with the sales team."]},{"id":"P55_14","en":"I'm supposed to wear business attire for the ceremony.","tpl":"[[I'm supposed to]] wear business attire for the ceremony.","jp":"式典にはビジネススーツを着ることになっています。","scene":"海外出張","alts":["Business attire is required for the ceremony."]},{"id":"P55_15","en":"I'm supposed to return the rental car with a full tank.","tpl":"[[I'm supposed to]] return the rental car with a full tank.","jp":"レンタカーはガソリン満タンで返すことになっています。","scene":"旅行","alts":["We need to return the rental car full."]},{"id":"P55_16","en":"I'm supposed to get a confirmation call from the restaurant.","tpl":"[[I'm supposed to]] get a confirmation call from the restaurant.","jp":"レストランから確認の電話が来ることになっています。","scene":"レストラン","alts":["The restaurant should call to confirm."]},{"id":"P55_17","en":"I'm supposed to cover for Kenji while he's away.","tpl":"[[I'm supposed to]] cover for Kenji while he's away.","jp":"健二が不在の間、私がカバーすることになっています。","scene":"職場","alts":["I am filling in for Kenji."]},{"id":"P55_18","en":"I'm supposed to avoid heavy lifting for a week.","tpl":"[[I'm supposed to]] avoid heavy lifting for a week.","jp":"1週間は重い物を持たないことになっています。","scene":"日常","alts":["The doctor told me not to lift heavy things."]},{"id":"P55_19","en":"I'm supposed to exchange this voucher at the ticket booth.","tpl":"[[I'm supposed to]] exchange this voucher at the ticket booth.","jp":"この引換券はチケット売り場で交換することになっています。","scene":"旅行","alts":["I need to redeem this voucher at the booth."]},{"id":"P55_20","en":"I'm supposed to finish onboarding by the end of the month.","tpl":"[[I'm supposed to]] finish onboarding by the end of the month.","jp":"今月末までにオンボーディングを終えることになっています。","scene":"職場","alts":["My onboarding wraps up this month."]}]},{"id":"P56","catId":"cat6","pattern":"I might ...","meaning":"〜するかもしれません","grammar":"I might + 動詞の原形 で、確信度は高くないが「〜する可能性がある（30〜50%程度）」ことを柔らかく伝えます。","usage":"予定の留保、遅刻の可能性連絡、買い物や注文で迷っているとき、控えめな提案に使います。","nuance":"may より日常会話で圧倒的に自然。約束を断定せず「〜するかも」と余白を残せる便利な表現です。","similar":"I may ...（ややフォーマル・可能性やや高め）／ Maybe I'll ...（たぶん〜するよ）","pitfall":"might は過去形ではなく現在の推量です。後ろは必ず動詞の原形にします（× I might going → ○ I might go）。","dialogue":[{"speaker":"A","en":"Are you joining us for the networking mixer tonight?","jp":"今夜の交流会には参加しますか？"},{"speaker":"B","en":"I might stop by for an hour, depending on when my client call ends.","jp":"クライアントとの電話が終わる時間次第で、1時間くらい顔を出すかもしれません。"},{"speaker":"A","en":"Awesome, just text me if you head over!","jp":"いいね、向かうときはメッセージしてね！"},{"speaker":"B","en":"Will do. I might bring Kenji along too.","jp":"了解。健二も一緒に連れていくかもしれません。"}],"drills":{"subject":{"en":"The flight might be delayed due to strong winds.","jp":"強風のためフライトが遅れるかもしれません。"},"tense":{"en":"I might have left my umbrella at the restaurant.","jp":"レストランに傘を忘れたかもしれません。"},"negative":{"en":"I might not be able to join the morning call.","jp":"朝の通話には参加できないかもしれません。"},"question":{"en":"Might we finish early if we skip the intro slides?","jp":"導入スライドを飛ばせば早く終われそうでしょうか？"}},"examples":[{"id":"P56_01","en":"I might be five minutes late.","tpl":"[[I might]] be five minutes late.","jp":"5分ほど遅れるかもしれません。","scene":"会議","alts":["I may run five minutes late."]},{"id":"P56_02","en":"I might work from home tomorrow.","tpl":"[[I might]] work from home tomorrow.","jp":"明日は在宅勤務にするかもしれません。","scene":"職場","alts":["I may work remotely tomorrow."]},{"id":"P56_03","en":"I might order the pasta instead.","tpl":"[[I might]] order the pasta instead.","jp":"代わりにパスタを頼むかもしれません。","scene":"レストラン","alts":["I may go with the pasta."]},{"id":"P56_04","en":"I might stay an extra day in Kyoto.","tpl":"[[I might]] stay an extra day in Kyoto.","jp":"京都にもう1日延泊するかもしれません。","scene":"旅行","alts":["I may extend my stay in Kyoto."]},{"id":"P56_05","en":"I might buy a new backpack this weekend.","tpl":"[[I might]] buy a new backpack this weekend.","jp":"今週末に新しいバックパックを買うかもしれません。","scene":"買い物","alts":["I may pick up a new backpack."]},{"id":"P56_06","en":"I might need a few more days to finish.","tpl":"[[I might]] need a few more days to finish.","jp":"仕上げるのにあと数日必要かもしれません。","scene":"職場","alts":["I may need a couple extra days."]},{"id":"P56_07","en":"I might skip lunch today because I'm busy.","tpl":"[[I might]] skip lunch today because I'm busy.","jp":"忙しいので今日は昼食を抜くかもしれません。","scene":"日常","alts":["I may miss lunch today."]},{"id":"P56_08","en":"I might take a taxi if it rains.","tpl":"[[I might]] take a taxi if it rains.","jp":"雨が降ったらタクシーに乗るかもしれません。","scene":"海外出張","alts":["I may grab a cab if it rains."]},{"id":"P56_09","en":"I might visit the hotel gym before breakfast.","tpl":"[[I might]] visit the hotel gym before breakfast.","jp":"朝食前にホテルのジムに行くかもしれません。","scene":"ホテル","alts":["I may work out before breakfast."]},{"id":"P56_10","en":"I might have left my badge at my desk.","tpl":"[[I might]] have left my badge at my desk.","jp":"デスクに社員証を忘れたかもしれません。","scene":"職場","alts":["I may have forgotten my badge."]},{"id":"P56_11","en":"I might try cooking Thai curry tonight.","tpl":"[[I might]] try cooking Thai curry tonight.","jp":"今夜はタイカレーを作ってみるかもしれません。","scene":"日常","alts":["I may make Thai curry tonight."]},{"id":"P56_12","en":"I might ask for a quieter room.","tpl":"[[I might]] ask for a quieter room.","jp":"もう少し静かな部屋をお願いするかもしれません。","scene":"ホテル","alts":["I may request a quieter room."]},{"id":"P56_13","en":"I might catch up with an old friend in Osaka.","tpl":"[[I might]] catch up with an old friend in Osaka.","jp":"大阪で昔からの友人に会うかもしれません。","scene":"友人","alts":["I may meet an old friend in Osaka."]},{"id":"P56_14","en":"I might switch to a lighter jacket.","tpl":"[[I might]] switch to a lighter jacket.","jp":"もっと軽いジャケットに着替えるかもしれません。","scene":"買い物","alts":["I may go with a lighter jacket."]},{"id":"P56_15","en":"I might need your help with the Japanese translation.","tpl":"[[I might]] need your help with the Japanese translation.","jp":"日本語訳であなたの手を借りるかもしれません。","scene":"職場","alts":["I may ask for your help translating."]},{"id":"P56_16","en":"I might go to the museum on Sunday morning.","tpl":"[[I might]] go to the museum on Sunday morning.","jp":"日曜の朝に美術館に行くかもしれません。","scene":"旅行","alts":["I may visit the museum Sunday morning."]},{"id":"P56_17","en":"I might grab dessert after we walk around.","tpl":"[[I might]] grab dessert after we walk around.","jp":"少し歩いたあとにデザートを食べるかもしれません。","scene":"レストラン","alts":["I may get dessert later."]},{"id":"P56_18","en":"I might change my return flight to Friday evening.","tpl":"[[I might]] change my return flight to Friday evening.","jp":"帰国便を金曜の夕方に変更するかもしれません。","scene":"海外出張","alts":["I may move my return flight to Friday evening."]},{"id":"P56_19","en":"I might join the running club next month.","tpl":"[[I might]] join the running club next month.","jp":"来月ランニングクラブに入るかもしれません。","scene":"友人","alts":["I may sign up for the running club."]},{"id":"P56_20","en":"I might be wrong, so let's verify the source.","tpl":"[[I might]] be wrong, so let's verify the source.","jp":"間違っているかもしれないので出典を確認しましょう。","scene":"会議","alts":["Let's double-check in case I am wrong."]}]},{"id":"P57","catId":"cat6","pattern":"It's possible that ...","meaning":"〜の可能性があります","grammar":"It's possible that + 主語 + 動詞 で、客観的な可能性を冷静に提示します。","usage":"ビジネス会議のリスク分析、トラブル原因の仮説提示、天候や遅延の予測など、論理的な会話で重宝します。","nuance":"感情を交えず客観的に「〜ということもあり得ます」と伝えられるため、会議での仮説出しに最適です。","similar":"There's a chance that ...（〜する見込み・可能性がある）／ It's likely that ...（可能性が高い）","pitfall":"人を主語にして × I'm possible to go とは言えません。必ず It's possible that ... または It's possible for me to ... を使います。","dialogue":[{"speaker":"A","en":"Why hasn't the supplier replied to our order email yet?","jp":"どうして仕入先から注文メールの返信がまだ来ないんだろう？"},{"speaker":"B","en":"It's possible that it's a public holiday in their country today.","jp":"今日、先方の国が祝日という可能性がありますね。"},{"speaker":"A","en":"Good point! Let me check the holiday calendar.","jp":"確かに！祝日カレンダーを確認してみます。"},{"speaker":"B","en":"Also, it's possible that our attachment was too large for their mail server.","jp":"あと、添付ファイルが先方のメールサーバーには大きすぎた可能性もあります。"}],"drills":{"subject":{"en":"It's possible that the venue will reach full capacity.","jp":"会場が満員になる可能性があります。"},"tense":{"en":"It was possible that we misread the train timetable.","jp":"電車の時刻表を読み間違えた可能性がありました。"},"negative":{"en":"It's not possible to board after the gate closes.","jp":"ゲートが閉まった後は搭乗できません。"},"question":{"en":"Is it possible that the shipment arrived at the front desk?","jp":"荷物がフロントに届いている可能性はありますか？"}},"examples":[{"id":"P57_01","en":"It's possible that the flight will be delayed.","tpl":"[[It's possible that]] the flight will be delayed.","jp":"フライトが遅延する可能性があります。","scene":"海外出張","alts":["The flight might be delayed."]},{"id":"P57_02","en":"It's possible that we'll finish ahead of schedule.","tpl":"[[It's possible that]] we'll finish ahead of schedule.","jp":"予定より早く終わる可能性があります。","scene":"職場","alts":["We might finish early."]},{"id":"P57_03","en":"It's possible that the email went to spam.","tpl":"[[It's possible that]] the email went to spam.","jp":"メールが迷惑メールフォルダに入った可能性があります。","scene":"職場","alts":["The email may have landed in spam."]},{"id":"P57_04","en":"It's possible that the restaurant is fully booked tonight.","tpl":"[[It's possible that]] the restaurant is fully booked tonight.","jp":"今夜そのレストランは満席の可能性があります。","scene":"レストラン","alts":["They might be fully booked tonight."]},{"id":"P57_05","en":"It's possible that it'll rain later this afternoon.","tpl":"[[It's possible that]] it'll rain later this afternoon.","jp":"今日の午後遅くに雨が降る可能性があります。","scene":"日常","alts":["It could rain later today."]},{"id":"P57_06","en":"It's possible that they updated the meeting room.","tpl":"[[It's possible that]] they updated the meeting room.","jp":"会議室が変更された可能性があります。","scene":"会議","alts":["They may have moved the meeting room."]},{"id":"P57_07","en":"It's possible that the hotel has a cancellation.","tpl":"[[It's possible that]] the hotel has a cancellation.","jp":"ホテルにキャンセルが出る可能性があります。","scene":"ホテル","alts":["A room might open up from a cancellation."]},{"id":"P57_08","en":"It's possible that this item will restock next week.","tpl":"[[It's possible that]] this item will restock next week.","jp":"この商品は来週再入荷する可能性があります。","scene":"買い物","alts":["It may come back in stock next week."]},{"id":"P57_09","en":"It's possible that I mixed up the two dates.","tpl":"[[It's possible that]] I mixed up the two dates.","jp":"2つの日付を取り違えた可能性があります。","scene":"会議","alts":["I might have confused the dates."]},{"id":"P57_10","en":"It's possible that traffic will slow us down.","tpl":"[[It's possible that]] traffic will slow us down.","jp":"渋滞で遅れる可能性があります。","scene":"旅行","alts":["Traffic might delay us."]},{"id":"P57_11","en":"It's possible that the client wants a simpler design.","tpl":"[[It's possible that]] the client wants a simpler design.","jp":"クライアントはもっとシンプルなデザインを望んでいる可能性があります。","scene":"職場","alts":["The client might prefer a simpler layout."]},{"id":"P57_12","en":"It's possible that our luggage is on the next carousel.","tpl":"[[It's possible that]] our luggage is on the next carousel.","jp":"私たちの荷物は隣のターンテーブルにある可能性があります。","scene":"旅行","alts":["Our bags might be on the next belt."]},{"id":"P57_13","en":"It's possible that the store closes early on Sundays.","tpl":"[[It's possible that]] the store closes early on Sundays.","jp":"そのお店は日曜日は早く閉まる可能性があります。","scene":"買い物","alts":["They may close early on Sundays."]},{"id":"P57_14","en":"It's possible that we misunderstood each other.","tpl":"[[It's possible that]] we misunderstood each other.","jp":"お互いに誤解していた可能性があります。","scene":"会議","alts":["There might have been a misunderstanding."]},{"id":"P57_15","en":"It's possible that the Wi-Fi needs a quick restart.","tpl":"[[It's possible that]] the Wi-Fi needs a quick restart.","jp":"Wi-Fiを一度再起動する必要があるかもしれません。","scene":"ホテル","alts":["Restarting the Wi-Fi might fix it."]},{"id":"P57_16","en":"It's possible that the event will move indoors.","tpl":"[[It's possible that]] the event will move indoors.","jp":"イベントは屋内に変更される可能性があります。","scene":"日常","alts":["They might move the event inside."]},{"id":"P57_17","en":"It's possible that he's already on his way here.","tpl":"[[It's possible that]] he's already on his way here.","jp":"彼はもうこちらに向かっている可能性があります。","scene":"友人","alts":["He might already be on his way."]},{"id":"P57_18","en":"It's possible that prices will rise next quarter.","tpl":"[[It's possible that]] prices will rise next quarter.","jp":"来四半期に価格が上がる可能性があります。","scene":"職場","alts":["Prices could increase next quarter."]},{"id":"P57_19","en":"It's possible that the lunch special is sold out.","tpl":"[[It's possible that]] the lunch special is sold out.","jp":"ランチスペシャルは売り切れている可能性があります。","scene":"レストラン","alts":["They may be out of the lunch special."]},{"id":"P57_20","en":"It's possible that we'll need an extra day for testing.","tpl":"[[It's possible that]] we'll need an extra day for testing.","jp":"テストにもう1日必要になる可能性があります。","scene":"会議","alts":["Testing might take an extra day."]}]},{"id":"P58","catId":"cat6","pattern":"You'd better ...","meaning":"〜した方がいいですよ［忠告］","grammar":"You had better の短縮形 + 動詞の原形 で、「そうしないと困ったことになるよ」という強めの助言・警告を表します。","usage":"天気・終電・締め切り・忘れ物など、実害を避けるための実践的な忠告に使います。","nuance":"目上の人に対して使うと上から目線に聞こえることがあるため、同僚・友人・自分自身（I'd better ...）に使うのが安全です。","similar":"You should ...（一般的なおすすめ）／ I'd better ...（そろそろ〜しなきゃ）","pitfall":"better の後ろに to は入れません（× You'd better to go → ○ You'd better go）。否定は You'd better not + 原形 です。","dialogue":[{"speaker":"A","en":"Look at the sky—those clouds are getting super dark.","jp":"空を見て、雲がすごく暗くなってきたよ。"},{"speaker":"B","en":"Whoa, you're right. You'd better grab an umbrella before heading out.","jp":"うわ、本当だ。出かける前に傘を持っていった方がいいよ。"},{"speaker":"A","en":"Yeah, and I'd better leave now before the downpour starts.","jp":"うん、土砂降りになる前にそろそろ出た方がよさそうだ。"},{"speaker":"B","en":"Good call. Text me when you get to the station!","jp":"いい判断だね。駅に着いたら連絡して！"}],"drills":{"subject":{"en":"We'd better leave now if we want to catch the express.","jp":"特急に乗りたいなら今すぐ出た方がいいですね。"},"tense":{"en":"I'd better check my passport before leaving for the airport.","jp":"空港へ出発する前にパスポートを確認しておいた方がよさそうだ。"},"negative":{"en":"You'd better not forget your ID for the domestic flight.","jp":"国内線でも身分証明書を忘れない方がいいですよ。"},"question":{"en":"Hadn't we better confirm the reservation first?","jp":"先に予約を確認しておいた方がいいのでは？"}},"examples":[{"id":"P58_01","en":"You'd better take an umbrella today.","tpl":"[[You'd better]] take an umbrella today.","jp":"今日は傘を持っていった方がいいですよ。","scene":"日常","alts":["You should definitely bring an umbrella."]},{"id":"P58_02","en":"You'd better leave now to catch the last train.","tpl":"[[You'd better]] leave now to catch the last train.","jp":"終電に間に合うように今出た方がいいですよ。","scene":"日常","alts":["Leave now or you'll miss the last train."]},{"id":"P58_03","en":"You'd better double-check the gate number.","tpl":"[[You'd better]] double-check the gate number.","jp":"搭乗ゲート番号を再確認した方がいいですよ。","scene":"海外出張","alts":["Make sure to check the gate again."]},{"id":"P58_04","en":"You'd better book a table—it gets packed on Fridays.","tpl":"[[You'd better]] book a table—it gets packed on Fridays.","jp":"金曜日は混むので予約した方がいいですよ。","scene":"レストラン","alts":["Reserve a table because Fridays get busy."]},{"id":"P58_05","en":"You'd better save your file before restarting.","tpl":"[[You'd better]] save your file before restarting.","jp":"再起動する前にファイルを保存した方がいいですよ。","scene":"職場","alts":["Save your work before rebooting."]},{"id":"P58_06","en":"You'd better wear a warm coat tonight.","tpl":"[[You'd better]] wear a warm coat tonight.","jp":"今夜は暖かいコートを着た方がいいですよ。","scene":"旅行","alts":["Bundle up tonight; it is cold."]},{"id":"P58_07","en":"You'd better confirm the deadline with the client.","tpl":"[[You'd better]] confirm the deadline with the client.","jp":"クライアントに締め切りを確認した方がいいですよ。","scene":"会議","alts":["Verify the deadline with the client."]},{"id":"P58_08","en":"You'd better keep your passport in a safe pocket.","tpl":"[[You'd better]] keep your passport in a safe pocket.","jp":"パスポートは安全なポケットに入れておいた方がいいですよ。","scene":"旅行","alts":["Keep your passport somewhere secure."]},{"id":"P58_09","en":"You'd better charge your phone before the long flight.","tpl":"[[You'd better]] charge your phone before the long flight.","jp":"長いフライトの前にスマホを充電しておいた方がいいですよ。","scene":"海外出張","alts":["Charge your phone before boarding."]},{"id":"P58_10","en":"You'd better not skip dinner if you're working late.","tpl":"[[You'd better]] not skip dinner if you're working late.","jp":"遅くまで仕事するなら夕食は抜かない方がいいですよ。","scene":"職場","alts":["Don't skip dinner on a late night."]},{"id":"P58_11","en":"You'd better hurry—the store closes in ten minutes.","tpl":"[[You'd better]] hurry—the store closes in ten minutes.","jp":"急いだ方がいいですよ、お店があと10分で閉まります。","scene":"買い物","alts":["Hurry up, the shop closes soon."]},{"id":"P58_12","en":"You'd better call the hotel if you'll arrive after midnight.","tpl":"[[You'd better]] call the hotel if you'll arrive after midnight.","jp":"深夜0時過ぎに着くならホテルに電話しておいた方がいいですよ。","scene":"ホテル","alts":["Let the hotel know if you arrive past midnight."]},{"id":"P58_13","en":"You'd better drink some water—you look dehydrated.","tpl":"[[You'd better]] drink some water—you look dehydrated.","jp":"水分を取った方がいいよ、喉が渇いてそう。","scene":"友人","alts":["Have some water."]},{"id":"P58_14","en":"You'd better test the projector before the boss walks in.","tpl":"[[You'd better]] test the projector before the boss walks in.","jp":"上司が来る前にプロジェクターをテストした方がいいですよ。","scene":"会議","alts":["Check the projector before the boss arrives."]},{"id":"P58_15","en":"You'd better check the size chart before ordering online.","tpl":"[[You'd better]] check the size chart before ordering online.","jp":"ネット注文する前にサイズ表を確認した方がいいですよ。","scene":"買い物","alts":["Look at the size guide before buying."]},{"id":"P58_16","en":"You'd better keep the receipt just in case.","tpl":"[[You'd better]] keep the receipt just in case.","jp":"念のため領収書は取っておいた方がいいですよ。","scene":"買い物","alts":["Save the receipt just in case."]},{"id":"P58_17","en":"You'd better ask for a seat near the front.","tpl":"[[You'd better]] ask for a seat near the front.","jp":"前の方の席をお願いした方がいいですよ。","scene":"旅行","alts":["Try to sit near the front."]},{"id":"P58_18","en":"You'd better get some sleep before tomorrow's exam.","tpl":"[[You'd better]] get some sleep before tomorrow's exam.","jp":"明日の試験の前に寝た方がいいですよ。","scene":"日常","alts":["Get a good night's sleep tonight."]},{"id":"P58_19","en":"You'd better send a quick apology email right away.","tpl":"[[You'd better]] send a quick apology email right away.","jp":"すぐにお詫びメールを送った方がいいですよ。","scene":"職場","alts":["Send a brief apology email now."]},{"id":"P58_20","en":"You'd better not leave your bag unattended here.","tpl":"[[You'd better]] not leave your bag unattended here.","jp":"ここにバッグを置きっぱなしにしない方がいいですよ。","scene":"旅行","alts":["Keep your bag with you here."]}]},{"id":"P59","catId":"cat6","pattern":"I'm able to ...","meaning":"〜することができます","grammar":"I'm able to + 動詞の原形 で、能力や状況的に可能であることを丁寧に表します。","usage":"ビジネスメールでの対応可否連絡、成長の実感、will be able to（未来の可能）との組み合わせで頻繁に使います。","nuance":"can よりも少しフォーマルで、特に未来形（will be able to）や現在完了（have been able to）では can の代わりに必須です。","similar":"I can ...（日常的でシンプル）／ I managed to ...（なんとか〜できた）","pitfall":"× I will can go は文法的に不可！未来の「〜できるだろう」は必ず ○ I will be able to go にします。","dialogue":[{"speaker":"A","en":"Will you be able to join the Singapore team's call at eight AM?","jp":"朝8時のシンガポールチームとの通話に参加できそうですか？"},{"speaker":"B","en":"Yes, I'm able to join from home before heading to the office.","jp":"はい、出社前に自宅から参加できます。"},{"speaker":"A","en":"Fantastic. Are you also able to share the updated timeline?","jp":"素晴らしい。更新したスケジュールも共有できますか？"},{"speaker":"B","en":"Sure, I'll have the slides ready tonight.","jp":"もちろんです、今夜中にスライドを用意しておきます。"}],"drills":{"subject":{"en":"She's able to handle both Japanese and English clients.","jp":"彼女は日本と英語圏のクライアント両方に対応できます。"},"tense":{"en":"I was able to catch the earlier flight without any fee.","jp":"追加料金なしで早い便に乗ることができました。"},"negative":{"en":"I'm not able to open the link on my phone.","jp":"スマホでそのリンクを開けません。"},"question":{"en":"Are you able to attend Thursday's workshop?","jp":"木曜日のワークショップに参加できますか？"}},"examples":[{"id":"P59_01","en":"I'm able to work remotely three days a week.","tpl":"[[I'm able to]] work remotely three days a week.","jp":"週3日はリモートワークができます。","scene":"職場","alts":["I can work from home three days a week."]},{"id":"P59_02","en":"I'm able to join the meeting at two PM.","tpl":"[[I'm able to]] join the meeting at two PM.","jp":"午後2時の会議に参加できます。","scene":"会議","alts":["I can make the two PM meeting."]},{"id":"P59_03","en":"I'm able to understand native speakers much better now.","tpl":"[[I'm able to]] understand native speakers much better now.","jp":"今はネイティブの話すことがずっとよく理解できます。","scene":"日常","alts":["I can follow native speakers much better now."]},{"id":"P59_04","en":"I'm able to send you the revised quote today.","tpl":"[[I'm able to]] send you the revised quote today.","jp":"今日中に修正版のお見積りをお送りできます。","scene":"職場","alts":["I can email the updated quote today."]},{"id":"P59_05","en":"I'm able to check in online using the airline app.","tpl":"[[I'm able to]] check in online using the airline app.","jp":"航空会社のアプリでオンラインチェックインができます。","scene":"海外出張","alts":["I can check in on the app."]},{"id":"P59_06","en":"I'm able to finish this task before the deadline.","tpl":"[[I'm able to]] finish this task before the deadline.","jp":"締め切り前にこの作業を終えることができます。","scene":"職場","alts":["I can get this done before the deadline."]},{"id":"P59_07","en":"I'm able to speak more smoothly than last year.","tpl":"[[I'm able to]] speak more smoothly than last year.","jp":"去年よりずっとスムーズに話せるようになっています。","scene":"日常","alts":["I can speak more fluently than last year."]},{"id":"P59_08","en":"I'm able to accommodate a slight schedule change.","tpl":"[[I'm able to]] accommodate a slight schedule change.","jp":"少しのスケジュール変更であれば対応できます。","scene":"会議","alts":["I can adjust to a minor schedule change."]},{"id":"P59_09","en":"I'm able to walk to the conference venue from my hotel.","tpl":"[[I'm able to]] walk to the conference venue from my hotel.","jp":"ホテルからカンファレンス会場まで歩いて行けます。","scene":"ホテル","alts":["The venue is within walking distance of my hotel."]},{"id":"P59_10","en":"I'm able to read short English articles without a dictionary.","tpl":"[[I'm able to]] read short English articles without a dictionary.","jp":"短い英語記事なら辞書なしで読めます。","scene":"日常","alts":["I can read short English articles without looking up words."]},{"id":"P59_11","en":"I'm able to cover the morning shift this Saturday.","tpl":"[[I'm able to]] cover the morning shift this Saturday.","jp":"今週土曜の朝シフトに入ることができます。","scene":"職場","alts":["I can take Saturday morning's shift."]},{"id":"P59_12","en":"I'm able to order food confidently when traveling abroad.","tpl":"[[I'm able to]] order food confidently when traveling abroad.","jp":"海外旅行で自信を持って料理を注文できます。","scene":"レストラン","alts":["I can order food comfortably abroad."]},{"id":"P59_13","en":"I'm able to connect to the hotel Wi-Fi without issues.","tpl":"[[I'm able to]] connect to the hotel Wi-Fi without issues.","jp":"問題なくホテルのWi-Fiに接続できています。","scene":"ホテル","alts":["The hotel Wi-Fi works fine for me."]},{"id":"P59_14","en":"I'm able to pack everything into one carry-on bag.","tpl":"[[I'm able to]] pack everything into one carry-on bag.","jp":"荷物を全部1つの機内持ち込みバッグに収められます。","scene":"旅行","alts":["Everything fits in my carry-on."]},{"id":"P59_15","en":"I'm able to explain our product features in English.","tpl":"[[I'm able to]] explain our product features in English.","jp":"自社製品の特徴を英語で説明できます。","scene":"海外出張","alts":["I can present our product features in English."]},{"id":"P59_16
