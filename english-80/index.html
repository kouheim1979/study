        return preferred || exact[0];
      }
      const prefix = lower.split("-")[0];
      return this.voices.find((v) => (v.lang || "").toLowerCase().startsWith(prefix)) || null;
    }

    stopAll() {
      this._autoPlayStop = true;
      this.stopSpeaking();
      this.stopListening();
    }

    stopSpeaking() {
      this._speechToken += 1;
      this.isSpeaking = false;
      this._activeUtterance = null;
      if (this.supportsTTS()) {
        try { window.speechSynthesis.cancel(); } catch (_) {}
      }
    }

    stopListening() {
      this.isListening = false;
      if (this._recognition) {
        try { this._recognition.onresult = null; this._recognition.onerror = null; this._recognition.onend = null; this._recognition.abort(); } catch (_) {}
        this._recognition = null;
      }
    }

    speak(text, opts) {
      const options = opts || {};
      const lang = options.lang || this.accent;
      const rate = options.rate != null ? options.rate : (lang.startsWith("ja") ? 1.05 : this.rate);

      return new Promise((resolve) => {
        if (!this.supportsTTS() || !text) {
          resolve(false);
          return;
        }
        // Strict mutex: never allow mic and speaker to collide on iOS Safari
        if (this.isListening) this.stopListening();

        const myToken = ++this._speechToken;
        try { window.speechSynthesis.cancel(); } catch (_) {}

        // Short delay after cancel prevents iOS Safari dropped utterances
        setTimeout(() => {
          if (myToken !== this._speechToken) {
            resolve(false);
            return;
          }
          try {
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = lang;
            utter.rate = rate;
            utter.pitch = 1.0;
            const voice = this._pickVoice(lang);
            if (voice) utter.voice = voice;

            this._activeUtterance = utter;
            this.isSpeaking = true;

            let settled = false;
            const finish = (ok) => {
              if (settled) return;
              settled = true;
              if (myToken === this._speechToken) {
                this.isSpeaking = false;
                this._activeUtterance = null;
              }
              resolve(ok);
            };

            utter.onend = () => finish(true);
            utter.onerror = () => finish(false);

            // Safety watchdog in case iOS Safari drops onend
            const maxMs = Math.max(4000, Math.min(25000, text.length * 140 / Math.max(0.5, rate)));
            setTimeout(() => finish(true), maxMs);

            window.speechSynthesis.speak(utter);
          } catch (_) {
            this.isSpeaking = false;
            this._activeUtterance = null;
            resolve(false);
          }
        }, 65);
      });
    }

    async playSequence(items, onIndex) {
      this._autoPlayStop = false;
      for (let i = 0; i < items.length; i++) {
        if (this._autoPlayStop) break;
        if (onIndex) onIndex(i);
        await this.speak(items[i].text, { lang: items[i].lang || this.accent, rate: items[i].rate });
        if (this._autoPlayStop) break;
        await new Promise((r) => setTimeout(r, items[i].pauseMs || 450));
      }
      if (onIndex) onIndex(-1);
    }

    startListening(callbacks) {
      const cb = callbacks || {};
      if (!this.supportsSTT()) {
        if (cb.onError) cb.onError("unsupported");
        return false;
      }

      // Strict mutex: stop TTS first and wait 180ms for iOS audio session switch
      if (this.isSpeaking) this.stopSpeaking();
      if (this.isListening) this.stopListening();

      setTimeout(() => {
        try {
          const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
          const rec = new SR();
          rec.lang = this.accent;
          rec.interimResults = true;
          rec.continuous = false;
          rec.maxAlternatives = 3;

          this._recognition = rec;
          this.isListening = true;
          if (cb.onStart) cb.onStart();

          let finalTranscript = "";

          rec.onresult = (event) => {
            let interim = "";
            for (let i = event.resultIndex; i < event.results.length; i++) {
              const res = event.results[i];
              if (res.isFinal) {
                finalTranscript += (finalTranscript ? " " : "") + res[0].transcript;
              } else {
                interim += res[0].transcript;
              }
            }
            if (cb.onInterim) cb.onInterim((finalTranscript + " " + interim).trim());
          };

          rec.onerror = (event) => {
            this.isListening = false;
            this._recognition = null;
            if (cb.onError) cb.onError(event.error || "speech-error");
          };

          rec.onend = () => {
            this.isListening = false;
            this._recognition = null;
            if (cb.onEnd) cb.onEnd(finalTranscript.trim());
          };

          rec.start();
        } catch (err) {
          this.isListening = false;
          this._recognition = null;
          if (cb.onError) cb.onError("start-failed");
        }
      }, 180);

      return true;
    }

    async requestWakeLock() {
      if (typeof navigator !== "undefined" && navigator.wakeLock && navigator.wakeLock.request) {
        try {
          this._wakeLock = await navigator.wakeLock.request("screen");
          return true;
        } catch (_) {
          return false;
        }
      }
      return false;
    }

    async releaseWakeLock() {
      if (this._wakeLock) {
        try { await this._wakeLock.release(); } catch (_) {}
        this._wakeLock = null;
      }
    }

    // Flexible semantic + word-level comparison (supports contractions & natural alternatives)
    evaluateAnswer(userInput, primaryEn, alts) {
      const candidates = [primaryEn].concat(Array.isArray(alts) ? alts : []);
      const userTokens = tokenize(userInput);
      const userCanon = userTokens.map(canonicalToken);

      if (!userTokens.length) {
        return {
          passed: false,
          score: 0,
          bestTarget: primaryEn,
          diff: primaryEn.split(" ").map((w) => ({ word: w, matched: false })),
          missedWords: tokenize(primaryEn),
          matchType: "empty"
        };
      }

      let best = null;

      for (let ci = 0; ci < candidates.length; ci++) {
        const target = candidates[ci];
        const rawWords = target.split(/\s+/);
        const targetTokens = tokenize(target);
        const targetCanon = targetTokens.map(canonicalToken);

        // Exact normalized match
        if (userTokens.join(" ") === targetTokens.join(" ") || userCanon.join(" ") === targetCanon.join(" ")) {
          return {
            passed: true,
            score: 100,
            bestTarget: target,
            diff: rawWords.map((w) => ({ word: w, matched: true })),
            missedWords: [],
            matchType: ci === 0 ? "exact" : "alternative"
          };
        }

        // Token matching with synonym tolerance
        const pool = userCanon.slice();
        const diff = [];
        const missedWords = [];
        let matchedCount = 0;

        for (let i = 0; i < rawWords.length; i++) {
          const rw = rawWords[i];
          const subTokens = tokenize(rw).map(canonicalToken);
          let ok = true;
          for (let j = 0; j < subTokens.length; j++) {
            const idx = pool.indexOf(subTokens[j]);
            if (idx >= 0) {
              pool.splice(idx, 1);
            } else {
              ok = false;
            }
          }
          if (ok) {
            matchedCount++;
          } else {
            const clean = rw.replace(/[^a-zA-Z']/g, "").toLowerCase();
            if (clean && !["a", "an", "the"].includes(clean)) missedWords.push(clean);
          }
          diff.push({ word: rw, matched: ok });
        }

        const recall = rawWords.length ? matchedCount / rawWords.length : 0;
        const precision = userTokens.length ? Math.min(1, matchedCount / userTokens.length) : 0;
        const f1 = (recall + precision) > 0 ? (2 * recall * precision) / (recall + precision) : 0;
        const score = Math.round(f1 * 100);

        if (!best || score > best.score) {
          best = {
            passed: score >= 78 || (missedWords.length === 0 && recall >= 0.72),
            score,
            bestTarget: target,
            diff,
            missedWords,
            matchType: score >= 78 ? (ci === 0 ? "near" : "alternative") : "partial"
          };
        }
      }

      return best;
    }
  }

  window.English80Audio = new AudioEngine();
})();

<script>
/* ENGLISH 80 — Adaptive SRS, Mastery Progression & LocalStorage Persistence */
(function () {
  "use strict";

  const STORAGE_KEY = "english80_state_v1";
  const BASE_INTERVALS = [1, 3, 7, 14, 30]; // days

  function todayKey(d) {
    const dt = d ? new Date(d) : new Date();
    const y = dt.getFullYear();
    const m = String(dt.getMonth() + 1).padStart(2, "0");
    const day = String(dt.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function defaultState() {
    return {
      version: 1,
      settings: {
        theme: "light",
        accent: "en-US",
        rate: 1.0,
        instantLimit: 5,
        aiProxyUrl: "",
        dailyGoal: 15
      },
      patterns: {}, // pid -> { level, attempts, correct, totalTimeMs, timedCount, seenIds[], passedIds[], unseenPassedIds[], intervalIdx, nextReviewAt, lastPracticedAt }
      weakWords: {}, // word -> missCount
      daily: {}, // YYYY-MM-DD -> { studySec, speeches, instantTotal, instantCorrect, xp }
      totalStudySec: 0,
      totalSpeeches: 0
    };
  }

  class SRSStore {
    constructor() {
      this.state = this._load();
    }

    _load() {
      try {
        const raw = window.localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();
        const parsed = JSON.parse(raw);
        return Object.assign(defaultState(), parsed, {
          settings: Object.assign(defaultState().settings, parsed.settings || {})
        });
      } catch (_) {
        return defaultState();
      }
    }

    save() {
      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state));
        return true;
      } catch (_) {
        return false;
      }
    }

    _ensureDay(key) {
      const k = key || todayKey();
      if (!this.state.daily[k]) {
        this.state.daily[k] = { studySec: 0, speeches: 0, instantTotal: 0, instantCorrect: 0, xp: 0 };
      }
      return this.state.daily[k];
    }

    getPatternState(pid) {
      if (!this.state.patterns[pid]) {
        this.state.patterns[pid] = {
          level: 1, // 1:未学習, 2:理解できる, 3:見れば話せる, 4:自力で話せる, 5:反射的に話せる
          attempts: 0,
          correct: 0,
          totalTimeMs: 0,
          timedCount: 0,
          seenIds: [],
          passedIds: [],
          unseenPassedIds: [],
          intervalIdx: 0,
          nextReviewAt: 0,
          lastPracticedAt: 0
        };
      }
      return this.state.patterns[pid];
    }

    addStudySeconds(sec) {
      const s = Math.max(0, Math.round(sec));
      if (!s) return;
      this.state.totalStudySec += s;
      const d = this._ensureDay();
      d.studySec += s;
      this.save();
    }

    addSpeechCount(n) {
      const inc = n || 1;
      this.state.totalSpeeches += inc;
      const d = this._ensureDay();
      d.speeches += inc;
      d.xp += inc * 2;
      this.save();
    }

    markUnderstood(pid) {
      const ps = this.getPatternState(pid);
      if (ps.level < 2) ps.level = 2;
      ps.lastPracticedAt = Date.now();
      if (!ps.nextReviewAt) {
        ps.nextReviewAt = Date.now() + 86400000; // 1 day
      }
      const d = this._ensureDay();
      d.xp += 10;
      this.save();
    }

    markDrillCompleted(pid, exampleId) {
      const ps = this.getPatternState(pid);
      if (exampleId && !ps.seenIds.includes(exampleId)) ps.seenIds.push(exampleId);
      if (ps.level < 3 && ps.seenIds.length >= 2) ps.level = 3;
      else if (ps.level < 2) ps.level = 2;
      ps.lastPracticedAt = Date.now();
      if (!ps.nextReviewAt) ps.nextReviewAt = Date.now() + 86400000;
      this.addSpeechCount(1);
      this.save();
    }

    recordAttempt(opts) {
      // opts: { pid, exampleId, passed, timeMs, missedWords, mode }
      const ps = this.getPatternState(opts.pid);
      const isUnseen = opts.exampleId && !ps.seenIds.includes(opts.exampleId);

      ps.attempts += 1;
      if (opts.passed) ps.correct += 1;
      if (opts.timeMs && opts.timeMs > 0) {
        ps.totalTimeMs += opts.timeMs;
        ps.timedCount += 1;
      }
      if (opts.exampleId && !ps.seenIds.includes(opts.exampleId)) {
        ps.seenIds.push(opts.exampleId);
      }
      if (opts.passed && opts.exampleId) {
        if (!ps.passedIds.includes(opts.exampleId)) ps.passedIds.push(opts.exampleId);
        if (isUnseen && !ps.unseenPassedIds.includes(opts.exampleId)) {
          ps.unseenPassedIds.push(opts.exampleId);
        }
      }

      if (Array.isArray(opts.missedWords)) {
        opts.missedWords.forEach((w) => {
          if (w && w.length > 1) {
            this.state.weakWords[w] = (this.state.weakWords[w] || 0) + 1;
          }
        });
      }

      // Compute mastery level (never promote to Lv.4/5 from memorizing a single sentence!)
      const acc = ps.attempts ? ps.correct / ps.attempts : 0;
      const avgMs = ps.timedCount ? ps.totalTimeMs / ps.timedCount : 9999;
      const distinctPassed = ps.passedIds.length;
      const unseenPassed = ps.unseenPassedIds.length;

      if (opts.passed) {
        if (distinctPassed >= 4 && unseenPassed >= 2 && acc >= 0.8 && avgMs <= 5500) {
          ps.level = 5;
        } else if (distinctPassed >= 3 && unseenPassed >= 1 && acc >= 0.7) {
          ps.level = Math.max(ps.level, 4);
        } else if (distinctPassed >= 1) {
          ps.level = Math.max(ps.level, 3);
        } else {
          ps.level = Math.max(ps.level, 2);
        }
        ps.intervalIdx = Math.min(BASE_INTERVALS.length - 1, ps.intervalIdx + 1);
      } else {
        ps.intervalIdx = 0;
        if (ps.level < 2) ps.level = 2;
      }

      const days = BASE_INTERVALS[ps.intervalIdx] || 1;
      const multiplier = acc < 0.6 ? 0.5 : (ps.level >= 5 ? 1.2 : 1.0);
      ps.nextReviewAt = Date.now() + Math.round(days * multiplier * 86400000);
      ps.lastPracticedAt = Date.now();

      const d = this._ensureDay();
      if (opts.mode === "instant") {
        d.instantTotal += 1;
        if (opts.passed) d.instantCorrect += 1;
      }
      d.xp += opts.passed ? 15 : 5;
      this.addSpeechCount(1);
      this.save();

      return { isUnseen, level: ps.level, nextDays: Math.max(1, Math.round(days * multiplier)) };
    }

    getDuePatterns(allPatterns) {
      const now = Date.now();
      return allPatterns.filter((p) => {
        const ps = this.state.patterns[p.id];
        return ps && ps.nextReviewAt > 0 && ps.nextReviewAt <= now;
      });
    }

    // Adaptive weighted selector: prioritizes due SRS items and weak patterns, plus unseen examples!
    pickAdaptiveExample(allPatterns, filterCatId, specificPid) {
      let pool = allPatterns;
      if (specificPid) {
        pool = allPatterns.filter((p) => p.id === specificPid);
      } else if (filterCatId && filterCatId !== "all") {
        pool = allPatterns.filter((p) => p.catId === filterCatId);
      }
      if (!pool.length) pool = allPatterns;

      const now = Date.now();
      const weights = pool.map((p) => {
        const ps = this.state.patterns[p.id];
        if (!ps || ps.attempts === 0) return 3.0; // Encourage new patterns
        const acc = ps.correct / ps.attempts;
        let w = 1.0 + (1 - acc) * 5.0; // Weak patterns appear much more frequently
        if (ps.nextReviewAt && ps.nextReviewAt <= now) w += 4.5; // Due for spaced repetition
        if (ps.level <= 2) w += 1.5;
        if (ps.level === 5) w *= 0.4;
        return w;
      });

      const sum = weights.reduce((a, b) => a + b, 0);
      let r = Math.random() * sum;
      let chosen = pool[0];
      for (let i = 0; i < pool.length; i++) {
        r -= weights[i];
        if (r <= 0) { chosen = pool[i]; break; }
      }

      // Prefer unseen examples within chosen pattern so mastery tests true transfer!
      const ps = this.getPatternState(chosen.id);
      const unseen = chosen.examples.filter((ex) => !ps.seenIds.includes(ex.id));
      const exList = unseen.length ? unseen : chosen.examples;
      const example = exList[Math.floor(Math.random() * exList.length)];
      return { pattern: chosen, example, isUnseen: unseen.includes(example) };
    }

    getStreakDays() {
      let streak = 0;
      const cur = new Date();
      for (let i = 0; i < 365; i++) {
        const k = todayKey(cur);
        const rec = this.state.daily[k];
        if (rec && (rec.xp > 0 || rec.studySec > 0 || rec.speeches > 0)) {
          streak++;
        } else if (i > 0) {
          break;
        }
        cur.setDate(cur.getDate() - 1);
      }
      return streak;
    }

    getDashboardStats(data) {
      const patterns = data.patterns;
      const levels = [0, 0, 0, 0, 0, 0]; // index 1..5
      let totalScore = 0;
      let totalInstantAttempts = 0;
      let totalInstantCorrect = 0;
      let totalTimedMs = 0;
      let totalTimedCount = 0;

      const catStats = data.categories.map((c) => {
        const cps = patterns.filter((p) => p.catId === c.id);
        let catPts = 0;
        cps.forEach((p) => {
          const ps = this.state.patterns[p.id];
          const lv = ps ? ps.level : 1;
          levels[lv] += 1;
          catPts += (lv - 1) / 4;
          totalScore += (lv - 1) / 4;
          if (ps) {
            totalTimedMs += ps.totalTimeMs || 0;
            totalTimedCount += ps.timedCount || 0;
          }
        });
        return {
          id: c.id,
          name: c.name,
          color: c.color,
          pct: cps.length ? Math.round((catPts / cps.length) * 100) : 0
        };
      });

      Object.values(this.state.daily).forEach((d) => {
        totalInstantAttempts += d.instantTotal || 0;
        totalInstantCorrect += d.instantCorrect || 0;
      });

      const weakRanking = patterns
        .map((p) => {
          const ps = this.state.patterns[p.id];
          if (!ps || ps.attempts === 0) return null;
          const acc = Math.round((ps.correct / ps.attempts) * 100);
          const avgSec = ps.timedCount ? +(ps.totalTimeMs / ps.timedCount / 1000).toFixed(1) : 0;
          return { id: p.id, pattern: p.pattern, meaning: p.meaning, acc, attempts: ps.attempts, avgSec, level: ps.level };
        })
        .filter(Boolean)
        .sort((a, b) => a.acc - b.acc || b.avgSec - a.avgSec)
        .slice(0, 6);

      const weakWords = Object.entries(this.state.weakWords)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10)
        .map(([word, count]) => ({ word, count }));

      return {
        overallPct: patterns.length ? Math.round((totalScore / patterns.length) * 100) : 0,
        levels,
        catStats,
        instantAcc: totalInstantAttempts ? Math.round((totalInstantCorrect / totalInstantAttempts) * 100) : 0,
        instantAttempts: totalInstantAttempts,
        avgAnswerSec: totalTimedCount ? +(totalTimedMs / totalTimedCount / 1000).toFixed(1) : 0,
        totalStudyMin: Math.round(this.state.totalStudySec / 60),
        totalSpeeches: this.state.totalSpeeches,
        streakDays: this.getStreakDays(),
        dueCount: this.getDuePatterns(patterns).length,
        weakRanking,
        weakWords
      };
    }

    getGrowthSeries(range) {
      // range: 'daily' (7d), 'weekly' (6w), 'monthly' (6m)
      const now = new Date();
      const series = [];
      if (range === "daily") {
        for (let i = 6; i >= 0; i--) {
          const d = new Date(now);
          d.setDate(d.getDate() - i);
          const k = todayKey(d);
          const rec = this.state.daily[k] || {};
          series.push({
            label: `${d.getMonth() + 1}/${d.getDate()}`,
            value: rec.xp || 0,
            speeches: rec.speeches || 0
          });
        }
      } else if (range === "weekly") {
        for (let w = 5; w >= 0; w--) {
          let xp = 0;
          let sp = 0;
          for (let dOff = 0; dOff < 7; dOff++) {
            const d = new Date(now);
            d.setDate(d.getDate() - (w * 7 + dOff));
            const rec = this.state.daily[todayKey(d)];
            if (rec) { xp += rec.xp || 0; sp += rec.speeches || 0; }
          }
          series.push({ label: w === 0 ? "今週" : `${w}週前`, value: xp, speeches: sp });
        }
      } else {
        for (let m = 5; m >= 0; m--) {
          const d = new Date(now.getFullYear(), now.getMonth() - m, 1);
          const prefix = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
          let xp = 0;
          let sp = 0;
          Object.entries(this.state.daily).forEach(([k, rec]) => {
            if (k.startsWith(prefix)) { xp += rec.xp || 0; sp += rec.speeches || 0; }
          });
          series.push({ label: `${d.getMonth() + 1}月`, value: xp, speeches: sp });
        }
      }
      return series;
    }

    exportJSON() {
      return JSON.stringify(this.state, null, 2);
    }

    importJSON(raw) {
      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== "object" || !parsed.patterns) {
        throw new Error("Invalid ENGLISH 80 backup file");
      }
      this.state = Object.assign(defaultState(), parsed, {
        settings: Object.assign(defaultState().settings, parsed.settings || {})
      });
      this.save();
    }

    resetAll() {
      const keepTheme = this.state.settings.theme;
      this.state = defaultState();
      this.state.settings.theme = keepTheme;
      this.save();
    }
  }

  window.English80Store = new SRSStore();
})();

    getScenarios() { return SCENARIOS; }

    getScenario(id) {
      return SCENARIOS.find((s) => s.id === id) || SCENARIOS[0];
    }

    async reply(scenario, history, userText, proxyUrl) {
      // Optional safe server-side proxy (never embeds API keys in client HTML/JS)
      if (proxyUrl && /^https:\/\/.+/.test(proxyUrl.trim())) {
        try {
          const res = await fetch(proxyUrl.trim(), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              mode: "chat",
              scenario: scenario.title,
              role: scenario.role,
              history: history.slice(-8),
              userMessage: userText
            })
          });
          if (res.ok) {
            const json = await res.json();
            if (json && json.reply) return { text: json.reply, via: "proxy" };
          }
        } catch (_) {
          // Gracefully fall back to built-in offline engine
        }
      }

      // Built-in offline stateful conversation engine
      const userTurnCount = history.filter((m) => m.role === "user").length;
      const lower = (userText || "").toLowerCase();
      let prefix = "";
      if (/\?$/.test(userText.trim()) || /^(do|could|would|can|how|what|where|when|is|are)\b/i.test(lower)) {
        prefix = "Good question! ";
      } else if (/(thank|thanks|appreciate)/i.test(lower)) {
        prefix = "You're very welcome! ";
      } else if (/(sorry|apologize|worried|delay|issue|problem)/i.test(lower)) {
        prefix = "I completely understand. ";
      }

      const idx = Math.min(Math.max(0, userTurnCount - 1), scenario.turns.length - 1);
      return { text: prefix + scenario.turns[idx], via: "local" };
    }

    evaluateConversation(scenario, history, allPatterns) {
      const userMsgs = history.filter((m) => m.role === "user").map((m) => m.text);
      const joined = userMsgs.join(" ");

      const usedPatterns = [];
      PATTERN_DETECTORS.forEach(([pid, re]) => {
        if (re.test(joined)) {
          const p = allPatterns.find((x) => x.id === pid);
          if (p) usedPatterns.push(p);
        }
      });

      const mistakes = [];
      GRAMMAR_CHECKS.forEach((chk) => {
        if (chk.re.test(joined)) {
          mistakes.push({ issue: chk.issue, fix: chk.fix });
        }
      });

      // Suggest natural upgrades based on target patterns not yet used
      const usedIds = new Set(usedPatterns.map((p) => p.id));
      const suggestions = scenario.targetPids
        .filter((pid) => !usedIds.has(pid))
        .map((pid) => allPatterns.find((x) => x.id === pid))
        .filter(Boolean)
        .map((p) => ({
          pattern: p.pattern,
          meaning: p.meaning,
          sample: p.examples[0] ? p.examples[0].en : ""
        }));

      const avgWords = userMsgs.length
        ? Math.round(userMsgs.reduce((acc, s) => acc + s.trim().split(/\s+/).filter(Boolean).length, 0) / userMsgs.length)
        : 0;

      const improvements = [];
      if (avgWords < 5) {
        improvements.push("1回の発話がやや短めです。「構文＋理由（because / That's why）」や「条件（If ...）」を1フレーズ足すと会話がぐっと自然になります。");
      } else {
        improvements.push("1ターンあたりしっかり英文を組み立てられています。次はこの速度を保ちながら、丁寧表現（I'd like to / I was wondering if）も織り交ぜてみましょう。");
      }
      if (!usedPatterns.length) {
        improvements.push("今回おすすめしていた80構文がまだ使われていません。画面上部の「おすすめ構文ヒント」を1つ選んで会話に組み込んでみましょう。");
      } else {
        improvements.push(`${usedPatterns.length}個の基本構文を実践会話の中で自然に使えました！`);
      }

      return {
        turns: userMsgs.length,
        avgWords,
        usedPatterns,
        mistakes,
        suggestions,
        improvements
      };
    }
  }

  window.English80AIChat = new AIChatEngine();
})();

  function showToast(msg) {
    const el = document.getElementById("toast");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove("show"), 2600);
  }

  function applySettingsToEngine() {
    const s = STORE.state.settings;
    document.documentElement.setAttribute("data-theme", s.theme === "dark" ? "dark" : "light");
    AUDIO.setAccent(s.accent || "en-US");
    AUDIO.setRate(s.rate || 1.0);
    const themeBtn = document.getElementById("themeToggleBtn");
    if (themeBtn) themeBtn.innerHTML = s.theme === "dark" ? ICONS.sun : ICONS.moon;
    const streakEl = document.getElementById("headerStreak");
    if (streakEl) streakEl.innerHTML = `${ICONS.flame} ${STORE.getStreakDays()}日`;
  }

  function cleanupActiveTasks() {
    AUDIO.stopAll();
    state.studyAutoPlaying = false;
    if (state.instantTimerId) {
      clearInterval(state.instantTimerId);
      state.instantTimerId = null;
    }
    if (state.walkRunning) {
      stopWalkingMode();
    }
  }

  function navigate(view, opts) {
    cleanupActiveTasks();
    state.view = view;
    if (opts) Object.assign(state, opts);
    if (view === "train") {
      if (state.trainMode === "instant" && !state.instantItem) loadNextInstant(false);
      if (state.trainMode === "listening" && !state.listenItem) loadNextListening();
      if (state.trainMode === "shadowing" && !state.shadowItem) loadNextShadowing();
    }
    updateBottomNav();
    render();
    window.scrollTo({ top: 0, behavior: "instant" });
  }

  function updateBottomNav() {
    document.querySelectorAll(".nav-item").forEach((btn) => {
      const target = btn.getAttribute("data-nav");
      const active = target === state.view || (state.view === "study" && target === "home");
      btn.classList.toggle("active", active);
    });
  }

  // ==================== HOME & 80-PATTERN MAP ====================
  function renderHome() {
    const stats = STORE.getDashboardStats(DATA);
    const dueList = STORE.getDuePatterns(DATA.patterns);
    const q = state.homeSearch.trim().toLowerCase();
    const localDay = (d) => [d.getFullYear(), String(d.getMonth()+1).padStart(2,"0"), String(d.getDate()).padStart(2,"0")].join("-");
    const now = new Date();
    const today = STORE.state.daily[localDay(now)] || {};
    const goal = Math.max(1, Number(STORE.state.settings.dailyGoal) || 15);
    const minutes = Math.floor((today.studySec || 0) / 60);
    const goalPct = Math.min(100, Math.round((today.studySec || 0) / (goal * 60) * 100));
    const mastered = stats.levels[4] + stats.levels[5];
    const learned = 80 - stats.levels[1];
    const currentStage = activeStage();
    const currentPool = GROWTH_ORDER.filter(p => currentStage.ids.includes(p.id));
    const nextPattern = currentPool.find(p => STORE.getPatternState(p.id).level === 1) || currentPool.find(p => STORE.getPatternState(p.id).level < 4) || dueList[0] || GROWTH_ORDER.find(p => STORE.getPatternState(p.id).level < 5) || GROWTH_ORDER[0];

      </div>
      <div class="kpi-row">

        <div class="growth-steps">
          ${GROWTH_STAGES.map((g,i) => {const n=stageProgress(g);return `<button class="growth-step ${g===currentStage?"current":""}" style="--stage-color:${g.color}" data-action="show-stage" data-stage="${g.id}">

  // ---- MODE B: PATTERN DRILL ----
  function renderDrillMode() {
    const drillPool = stagePool(state.trainCat);
    const p = drillPool.find(x => x.id === (state.trainPid || state.studyPid)) || drillPool[0] || DATA.patterns[0];
    const tabs = [
      ["swap", "入れ替え"],
      ["subject", "主語変化"],
      ["tense", "時制変化"],
      ["negative", "否定文"],
      ["question", "疑問文"]
    ];

    let activeEn = "";
    let activeTpl = "";
    let activeJp = "";
    let activeExId = "";

    if (state.drillTab === "swap") {
      const ex = p.examples[state.drillIdx % p.examples.length];
      activeEn = ex.en;
      activeTpl = ex.tpl;
      activeJp = ex.jp;
      activeExId = ex.id;
    } else {
      const d = p.drills[state.drillTab];
      activeEn = d.en;
      activeTpl = d.en;
      activeJp = d.jp;
    }

    return `
      <div class="card">
        <div class="flex-between">
          <div>
            <span class="pill accent">${p.id} · ${esc(p.pattern)}</span>
            <div class="muted mt-8">${esc(p.meaning)}</div>

  // ---- MODE C: INSTANT COMPOSITION ----
  function loadNextInstant(autoStartTimer) {
    if (state.instantTimerId) { clearInterval(state.instantTimerId); state.instantTimerId = null; }
    state.instantItem = pickTraining();
    state.instantInput = "";
    state.instantResult = null;
    state.instantStartMs = Date.now();
    state.instantRemainMs = state.instantLimit * 1000;

    if (autoStartTimer && state.instantLimit > 0) {
      startInstantTimer();
    }
  }

  function startInstantTimer() {
    if (state.instantTimerId) clearInterval(state.instantTimerId);
    if (state.instantLimit <= 0) return;
    state.instantStartMs = Date.now();
    state.instantRemainMs = state.instantLimit * 1000;
    state.instantTimerId = setInterval(() => {
      const elapsed = Date.now() - state.instantStartMs;
      state.instantRemainMs = Math.max(0, state.instantLimit * 1000 - elapsed);
      const fill = document.getElementById("instantTimerFill");
      const label = document.getElementById("instantTimerLabel");
      const pct = state.instantLimit ? (state.instantRemainMs / (state.instantLimit * 1000)) * 100 : 100;
      if (fill) {
        fill.style.width = `${pct}%`;
        fill.className = "timer-fill" + (pct < 25 ? " danger" : pct < 50 ? " warn" : "");
      }
      if (label) label.textContent = `${(state.instantRemainMs / 1000).toFixed(1)}秒`;
      if (state.instantRemainMs <= 0) {
        clearInterval(state.instantTimerId);
        state.instantTimerId = null;
        submitInstantAnswer(true);
      }
    }, 100);
  }

  function submitInstantAnswer(isTimeout) {
    if (!state.instantItem || state.instantResult) return;
    if (state.instantTimerId) { clearInterval(state.instantTimerId); state.instantTimerId = null; }
    const inputEl = document.getElementById("instantInput");
    const userText = inputEl ? inputEl.value.trim() : state.instantInput.trim();
    const timeMs = Math.max(400, Date.now() - state.instantStartMs);
    const { pattern, example } = state.instantItem;

    const evalRes = AUDIO.evaluateAnswer(userText, example.en, example.alts);
    const passed = !isTimeout && evalRes.passed;
    const srsOut = STORE.recordAttempt({
      pid: pattern.id,
      exampleId: example.id,
      passed,
      timeMs,
      missedWords: evalRes.missedWords,
      mode: "instant"
    });

    state.instantInput = userText;
    state.instantResult = { eval: evalRes, passed, isTimeout, timeSec: (timeMs / 1000).toFixed(1), srsOut };
    applySettingsToEngine();
    render();
    AUDIO.speak(example.en);
  }

  // ==================== MODE G: WALKING MODE ====================
  function stopWalkingMode() {
    state.walkRunning = false;
    state.walkPhase = "idle";
    if (state.walkTimerId) { clearTimeout(state.walkTimerId); state.walkTimerId = null; }
    AUDIO.stopAll();
    AUDIO.releaseWakeLock();
    state.walkWakeLocked = false;
  }

  async function runWalkingLoop() {
    if (!state.walkRunning) return;
    if (Date.now() >= state.walkSessionEndAt) {
      stopWalkingMode();
      showToast("ウォーキングセッションが完了しました！");
      render();
      return;
    }

    state.walkItem = STORE.pickAdaptiveExample(DATA.patterns, state.walkCat, null);
    const { pattern, example } = state.walkItem;

    // 1. Japanese Prompt
    state.walkPhase = "jp";
    render();
    await AUDIO.speak(example.jp, { lang: "ja-JP", rate: 1.05 });
    if (!state.walkRunning) return;

    // 2. Answer Pause
    state.walkPhase = "think";
    render();
    await new Promise((r) => { state.walkTimerId = setTimeout(r, state.walkThinkSec * 1000); });
    if (!state.walkRunning) return;

    // 3. English Model Answer
    state.walkPhase = "en";
    render();
    await AUDIO.speak(example.en, { lang: STORE.state.settings.accent, rate: STORE.state.settings.rate });
    if (!state.walkRunning) return;

    // 4. Repeat Pause
    state.walkPhase = "repeat";
    render();
    await new Promise((r) => { state.walkTimerId = setTimeout(r, state.walkRepeatSec * 1000); });
    if (!state.walkRunning) return;

    state.walkCount += 1;
    STORE.markDrillCompleted(pattern.id, example.id);
    applySettingsToEngine();
    runWalkingLoop();
  }

  function renderWalk() {
    const phaseLabels = {
      idle: "待機中（イヤホン推奨）",
      jp: "1. 日本語を出題中...",
      think: `2. 英語で声に出してみましょう（${state.walkThinkSec}秒）`,
      en: "3. 英語の模範解答を再生中...",
      repeat: `4. リピートして発話しましょう（${state.walkRepeatSec}秒）`
    };

    const remainMin = state.walkRunning
      ? Math.max(0, Math.ceil((state.walkSessionEndAt - Date.now()) / 60000))
      : state.walkDurationMin;

    return `
      <div class="walking-stage">
        <div class="walking-phase">${phaseLabels[state.walkPhase]}</div>
        <div class="muted">セッション残り：約${remainMin}分 · 完了フレーズ：${state.walkCount}文</div>

        <div style="min-height:110px;display:flex;flex-direction:column;justify-content:center;margin:18px 0;">
          ${state.walkItem ? `
            <div style="font-size:19px;font-weight:700;">${esc(state.walkItem.example.jp)}</div>
            <div class="en-sentence mt-12" style="opacity:${state.walkPhase === "en" || state.walkPhase === "repeat" ? 1 : 0.15};transition:opacity 0.25s;">
              ${esc(state.walkItem.example.en)}
            </div>
          ` : `<div class="muted">下の再生ボタンを押すと「日本語出題 → 回答時間 → 英語解答 → リピート」を自動で繰り返します。</div>`}

          <button class="walking-big-btn" data-action="walk-toggle" aria-label="再生・停止">

  // ==================== DASHBOARD ====================
  function renderGrowthChart(series) {
    const maxVal = Math.max(20, ...series.map((s) => s.value));
    const w = 520;
    const h = 160;
    const padL = 32;
    const padB = 26;
    const padT = 14;
    const chartW = w - padL - 12;
    const chartH = h - padB - padT;
    const barW = Math.min(36, Math.floor((chartW / series.length) * 0.52));

    const bars = series.map((s, i) => {
      const cx = padL + (i + 0.5) * (chartW / series.length);
      const bh = Math.round((s.value / maxVal) * chartH);
      const y = padT + (chartH - bh);
      return `
        <rect x="${cx - barW / 2}" y="${y}" width="${barW}" height="${Math.max(2, bh)}" rx="5" fill="var(--accent)" opacity="${s.value ? 0.92 : 0.25}"></rect>
        <text x="${cx}" y="${h - 8}" text-anchor="middle" font-size="11" fill="var(--text-3)">${esc(s.label)}</text>
        ${s.value ? `<text x="${cx}" y="${y - 4}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--text-2)">${s.value}</text>` : ""}
      `;
    }).join("");

    return `
      <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">
        <line x1="${padL}" y1="${padT + chartH}" x2="${w - 10}" y2="${padT + chartH}" stroke="var(--border)" stroke-width="1"/>
        ${bars}
      </svg>
    `;
  }

  // ==================== SETTINGS MODAL ====================
  function openSettingsModal() {
    const s = STORE.state.settings;
    const modal = document.getElementById("settingsModal");
    if (!modal) return;
    document.getElementById("setAccent").value = s.accent || "en-US";
    document.getElementById("setRate").value = String(s.rate || 1.0);
    document.getElementById("setProxyUrl").value = s.aiProxyUrl || "";
    modal.classList.add("open");
  }

  function closeSettingsModal() {
    const modal = document.getElementById("settingsModal");
    if (modal) modal.classList.remove("open");
  }

  // ==================== MAIN RENDER & EVENT DELEGATION ====================
  function render() {
    const main = document.getElementById("appMain");
    if (!main) return;
    if (state.view === "home") main.innerHTML = renderHome();
    else if (state.view === "study") main.innerHTML = renderStudy();
    else if (state.view === "train") main.innerHTML = renderTrain();
    else if (state.view === "chat") main.innerHTML = renderChat();
    else if (state.view === "walk") main.innerHTML = renderWalk();
    else if (state.view === "dash") main.innerHTML = renderDashboard();

    if (state.view === "chat") {
      const box = document.getElementById("chatBox");
      if (box) box.scrollTop = box.scrollHeight;
    }
  }

  function bindGlobalEvents() {
    // Bottom nav
    document.querySelectorAll(".nav-item").forEach((btn) => {
      btn.addEventListener("click", () => {
        const target = btn.getAttribute("data-nav");
        state.trainPid = "";
        navigate(target);
      });
    });

    // Header actions
    document.getElementById("brandHomeBtn").addEventListener("click", () => navigate("home"));
    document.getElementById("themeToggleBtn").addEventListener("click", () => {
      STORE.state.settings.theme = STORE.state.settings.theme === "dark" ? "light" : "dark";
      STORE.save();
      applySettingsToEngine();
    });
    document.getElementById("settingsOpenBtn").addEventListener("click", openSettingsModal);
    document.getElementById("settingsCloseBtn").addEventListener("click", closeSettingsModal);
    document.getElementById("settingsModal").addEventListener("click", (e) => {
      if (e.target.id === "settingsModal") closeSettingsModal();
    });

    // Settings controls
    document.getElementById("saveSettingsBtn").addEventListener("click", () => {
      STORE.state.settings.accent = document.getElementById("setAccent").value;
      STORE.state.settings.rate = parseFloat(document.getElementById("setRate").value) || 1.0;
      STORE.state.settings.aiProxyUrl = document.getElementById("setProxyUrl").value.trim();
      STORE.save();
      applySettingsToEngine();
      closeSettingsModal();
      showToast("設定を保存しました");
      render();
    });

    document.getElementById("exportDataBtn").addEventListener("click", () => {
      const blob = new Blob([STORE.exportJSON()], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `english80-backup-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast("学習データを書き出しました");
    });

    document.getElementById("importDataInput").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          STORE.importJSON(reader.result);
          applySettingsToEngine();
          render();
          closeSettingsModal();
          showToast("学習データを復元しました");
        } catch (_) {
          showToast("無効なバックアップファイルです");
        }
      };
      reader.readAsText(file);
      e.target.value = "";
    });

    let resetArmed = false;
    document.getElementById("resetDataBtn").addEventListener("click", () => {
      const btn = document.getElementById("resetDataBtn");
      if (!resetArmed) {
        resetArmed = true;
        btn.textContent = "もう一度押すと全データを初期化します";
        setTimeout(() => { resetArmed = false; btn.textContent = "学習データを初期化"; }, 4000);
        return;
      }
      resetArmed = false;
      btn.textContent = "学習データを初期化";
      STORE.resetAll();
      applySettingsToEngine();
      closeSettingsModal();
      navigate("home");
      showToast("学習データを初期化しました");
    });

    // Main content delegated click events
    const main = document.getElementById("appMain");
    main.addEventListener("click", async (e) => {
      const target = e.target.closest("button");
      if (!target) return;

      const speakText = target.getAttribute("data-speak");
      if (speakText) {
        AUDIO.speak(speakText);
        return;
      }
      const speakSlow = target.getAttribute("data-speak-slow");
      if (speakSlow) {
        AUDIO.speak(speakSlow, { rate: 0.75 });
        return;
      }
      const speakRepeat = target.getAttribute("data-speak-repeat");
      if (speakRepeat) {
        AUDIO.playSequence([
          { text: speakRepeat, pauseMs: 700 },
          { text: speakRepeat, pauseMs: 200 }
        ]);
        return;
      }
      const openPid = target.getAttribute("data-open-pattern");
      if (openPid) {
        state.studyPid = openPid;
        state.studyScene = "all";
        navigate("study");
        return;
      }
      const trainMode = target.getAttribute("data-train-mode");
      if (trainMode) {
        cleanupActiveTasks();
        state.trainMode = trainMode;
        state.instantItem = null; state.listenItem = null; state.shadowItem = null;
        if (trainMode === "instant" && !state.instantItem) loadNextInstant(false);
        if (trainMode === "listening" && !state.listenItem) loadNextListening();
        if (trainMode === "shadowing" && !state.shadowItem) loadNextShadowing();
        render();
        return;
      }
      const drillTab = target.getAttribute("data-drill-tab");
      if (drillTab) {
        state.drillTab = drillTab;
        state.drillResult = null;
        render();
        return;
      }
      const instantLim = target.getAttribute("data-instant-limit");
      if (instantLim != null) {
        const sec = parseInt(instantLim, 10);
        state.instantLimit = sec;
        STORE.state.settings.instantLimit = sec;
        STORE.save();
        loadNextInstant(false);
        render();
        return;
      }
      const startSc = target.getAttribute("data-start-scenario");
      if (startSc) {
        const sc = AICHAT.getScenario(startSc);
        state.chatScenarioId = sc.id;
        state.chatHistory = [{ role: "ai", text: sc.opening }];
        state.chatFeedback = null;
        render();
        AUDIO.speak(sc.opening);
        return;
      }
      const insertPat = target.getAttribute("data-insert-pattern");
      if (insertPat) {
        const inp = document.getElementById("chatInput");
        if (inp) {
          inp.value = (inp.value ? inp.value + " " : "") + insertPat + " ";
          inp.focus();
        }
        return;
      }
      const dashRange = target.getAttribute("data-dash-range");
      if (dashRange) {
        state.dashRange = dashRange;
        render();
        return;
      }

      const action = target.getAttribute("data-action");
      if (!action) return;

      if (action === "back-home") {
        navigate("home");
      } else if (action === "growth-view" || action === "category-view" || action === "show-stage") {
        state.homeGroup = action === "category-view" ? "category" : "growth";
        state.homeCatFilter = action === "show-stage" ? target.getAttribute("data-stage") : "all";
        if (action === "show-stage") state.homeSearch = "";
        render();
        if (action === "show-stage") document.querySelector(".mot-map")?.scrollIntoView({behavior:"auto",block:"start"});
      } else if (action === "practice-stage" || action === "quick-review") {
        state.trainMode = "instant";
        state.trainCat = action === "practice-stage" ? target.getAttribute("data-stage") : activeStage().id;
        state.trainPid = "";
        state.listenItem = null;
        state.shadowItem = null;
        loadNextInstant(false);
        navigate("train");
      } else if (action === "go-walk") {
        navigate("walk");
      } else if (action === "mark-understood") {
        const pid = target.getAttribute("data-pid");
        STORE.markUnderstood(pid);
        applySettingsToEngine();
        showToast(`${pid} を Lv.2（理解できる）に更新しました`);
        render();
      } else if (action === "start-drill-for") {
        state.trainMode = "drill";
        state.trainPid = target.getAttribute("data-pid");
        state.trainCat = "all";
        state.instantItem = null; state.listenItem = null; state.shadowItem = null;
        state.drillIdx = 0;
        state.drillTab = "swap";
        state.drillResult = null;
        navigate("train");
      } else if (action === "start-instant-for") {
        state.trainMode = "instant";
        state.trainPid = target.getAttribute("data-pid");
        state.trainCat = "all";
        state.listenItem = null; state.shadowItem = null;
        loadNextInstant(false);
        navigate("train");
      } else if (action === "play-dialogue") {
        const p = DATA.patterns.find((x) => x.id === target.getAttribute("data-pid"));
        if (p) {
          AUDIO.playSequence(p.dialogue.map((d) => ({ text: d.en, pauseMs: 550 })));
        }
      } else if (action === "toggle-study-autoplay") {
        if (state.studyAutoPlaying) {
          AUDIO.stopAll();
          state.studyAutoPlaying = false;
          render();
        } else {
          const p = DATA.patterns.find((x) => x.id === state.studyPid);
          if (!p) return;
          const list = state.studyScene === "all" ? p.examples : p.examples.filter((x) => x.scene === state.studyScene);
          state.studyAutoPlaying = true;
          render();
          await AUDIO.playSequence(list.map((ex) => ({ text: ex.en, pauseMs: 850 })));
          state.studyAutoPlaying = false;
          render();
        }
      } else if (action === "toggle-accent") {
        STORE.state.settings.accent = STORE.state.settings.accent === "en-GB" ? "en-US" : "en-GB";
        STORE.save();
        applySettingsToEngine();
        showToast(STORE.state.settings.accent === "en-GB" ? "イギリス英語に切り替えました" : "アメリカ英語に切り替えました");
        render();
      } else if (action === "drill-prev") {
        state.drillIdx = Math.max(0, state.drillIdx - 1);
        state.drillResult = null;
        render();
      } else if (action === "drill-next") {
        const pid = target.getAttribute("data-pid");
        const exid = target.getAttribute("data-exid");
        STORE.markDrillCompleted(pid, exid);
        applySettingsToEngine();
        state.drillIdx += 1;
        state.drillResult = null;
        render();
      } else if (action === "drill-speak-check") {
        const expected = target.getAttribute("data-en");
        const pid = target.getAttribute("data-pid");
        const exid = target.getAttribute("data-exid");
        if (!AUDIO.supportsSTT()) {
          showToast("お使いのブラウザは音声認識非対応です。声に出して「次へ」を押してください。");
          return;
        }
        AUDIO.startListening({
          onStart: () => showToast("マイク起動中：英語で話してください"),
          onEnd: (transcript) => {
            const evalRes = AUDIO.evaluateAnswer(transcript, expected, []);
            state.drillResult = { transcript, eval: evalRes };
            STORE.markDrillCompleted(pid, exid);
            applySettingsToEngine();
            render();
          },
          onError: () => showToast("音声認識を開始できませんでした。マイク権限をご確認ください。")
        });
      } else if (action === "instant-start-timer") {
        startInstantTimer();
        render();
      } else if (action === "instant-submit") {
        submitInstantAnswer(false);
      } else if (action === "instant-next") {
        loadNextInstant(state.instantLimit > 0);
        render();
      } else if (action === "instant-mic") {
        if (!AUDIO.supportsSTT()) {
          showToast("このブラウザは音声認識非対応です。キーボードから入力してください。");
          return;
        }
        if (AUDIO.isListening) {
          AUDIO.stopListening();
          render();
          return;
        }
        AUDIO.startListening({
          onStart: () => render(),
          onInterim: (txt) => {
            const inp = document.getElementById("instantInput");
            if (inp) inp.value = txt;
            state.instantInput = txt;
          },
          onEnd: (finalTxt) => {
            if (finalTxt) {
              state.instantInput = finalTxt;
              const inp = document.getElementById("instantInput");
              if (inp) inp.value = finalTxt;
              submitInstantAnswer(false);
            } else {
              render();
            }
          },
          onError: () => {
            showToast("音声を認識できませんでした。テキスト入力も利用できます。");
            render();
          }
        });
      } else if (action === "listen-mic") {
        if (!AUDIO.supportsSTT()) {
          showToast("音声認識非対応のためテキスト入力をご利用ください");
          return;
        }
        AUDIO.startListening({
          onStart: () => showToast("聞き取った英語を話してください"),
          onEnd: (txt) => {
            state.listenInput = txt;
            const inp = document.getElementById("listenInput");
            if (inp) inp.value = txt;
          },
          onError: () => showToast("音声認識エラー：テキスト入力をご利用ください")
        });
      } else if (action === "listen-check") {
        const inp = document.getElementById("listenInput");
        const val = inp ? inp.value.trim() : state.listenInput;
        const { pattern, example } = state.listenItem;
        const ev = AUDIO.evaluateAnswer(val, example.en, example.alts);
        STORE.recordAttempt({ pid: pattern.id, exampleId: example.id, passed: ev.passed, timeMs: 0, missedWords: ev.missedWords, mode: "listening" });
        state.listenInput = val;
        state.listenResult = ev;
        applySettingsToEngine();
        render();
      } else if (action === "listen-next") {
        loadNextListening();
        render();
      } else if (action === "toggle-shadow-en") {
        state.shadowShowEn = !state.shadowShowEn;
        render();
      } else if (action === "toggle-shadow-jp") {
        state.shadowShowJp = !state.shadowShowJp;
        render();
      } else if (action === "shadow-play") {
        if (state.shadowItem) AUDIO.speak(state.shadowItem.example.en);
      } else if (action === "shadow-repeat3") {
        if (state.shadowItem) {
          const t = state.shadowItem.example.en;
          AUDIO.playSequence([{ text: t, pauseMs: 1100 }, { text: t, pauseMs: 1100 }, { text: t, pauseMs: 300 }]);
          STORE.addSpeechCount(3);
          applySettingsToEngine();
        }
      } else if (action === "shadow-record") {
        if (!AUDIO.supportsSTT()) {
          showToast("このブラウザは音声認識非対応です。声に出してシャドーイングを続けましょう！");
          STORE.addSpeechCount(1);
          return;
        }
        const expected = state.shadowItem.example.en;
        AUDIO.startListening({
          onStart: () => showToast("発話チェック中：英文を話してください"),
          onEnd: (txt) => {
            const ev = AUDIO.evaluateAnswer(txt, expected, state.shadowItem.example.alts);
            state.shadowResult = { transcript: txt, eval: ev };
            STORE.addSpeechCount(1);
            applySettingsToEngine();
            render();
          },
          onError: () => showToast("音声認識を開始できませんでした")
        });
      } else if (action === "shadow-next") {
        STORE.addSpeechCount(1);
        loadNextShadowing();
        applySettingsToEngine();
        render();
      } else if (action === "chat-exit") {
        state.chatScenarioId = null;
        state.chatHistory = [];
        state.chatFeedback = null;
        render();
      } else if (action === "chat-mic") {
        if (!AUDIO.supportsSTT()) {
          showToast("音声認識非対応のためテキスト入力をご利用ください");
          return;
        }
        AUDIO.startListening({
          onStart: () => showToast("英語で話しかけてください"),
          onEnd: (txt) => {
            const inp = document.getElementById("chatInput");
            if (inp && txt) inp.value = txt;
          },
          onError: () => showToast("音声を認識できませんでした")
        });
      } else if (action === "chat-send") {
        const inp = document.getElementById("chatInput");
        const text = inp ? inp.value.trim() : "";
        if (!text || state.chatSending) return;
        const sc = AICHAT.getScenario(state.chatScenarioId);
        state.chatHistory.push({ role: "user", text });
        state.chatSending = true;
        STORE.addSpeechCount(1);
        render();
        const res = await AICHAT.reply(sc, state.chatHistory, text, STORE.state.settings.aiProxyUrl);
        state.chatHistory.push({ role: "ai", text: res.text });
        state.chatSending = false;
        applySettingsToEngine();
        render();
        AUDIO.speak(res.text);
      } else if (action === "chat-finish") {
        const sc = AICHAT.getScenario(state.chatScenarioId);
        state.chatFeedback = AICHAT.evaluateConversation(sc, state.chatHistory, DATA.patterns);
        render();
      } else if (action === "walk-toggle") {
        if (state.walkRunning) {
          stopWalkingMode();
          render();
        } else {
          state.walkRunning = true;
          state.walkSessionEndAt = Date.now() + state.walkDurationMin * 60000;
          state.walkWakeLocked = await AUDIO.requestWakeLock();
          runWalkingLoop();
        }
      } else if (action === "walk-skip") {
        if (state.walkTimerId) clearTimeout(state.walkTimerId);
        AUDIO.stopSpeaking();
        runWalkingLoop();
      }
    });

    // Delegated input & change events
    main.addEventListener("input", (e) => {
      if (e.target.id === "homeSearchInput") {
        state.homeSearch = e.target.value;
        const pos = e.target.selectionStart;
        render();
        const nextInp = document.getElementById("homeSearchInput");
        if (nextInp) { nextInp.focus(); nextInp.setSelectionRange(pos, pos); }
      } else if (e.target.id === "instantInput") {
        state.instantInput = e.target.value;
      } else if (e.target.id === "listenInput") {
        state.listenInput = e.target.value;
      }
    });

    main.addEventListener("change", (e) => {
      if (e.target.id === "homeCatSelect") {
        state.homeCatFilter = e.target.value;
        render();
      } else if (e.target.id === "studySceneSelect") {
        state.studyScene = e.target.value;
        render();
      } else if (e.target.id === "trainCatSelect") {
        state.trainCat = e.target.value;
        state.trainPid = "";
        state.drillIdx = 0;
        state.drillResult = null;
        state.instantItem = null;
        state.listenItem = null;
        state.shadowItem = null;
        if (state.trainMode === "instant") loadNextInstant(false);
        if (state.trainMode === "listening") loadNextListening();
        if (state.trainMode === "shadowing") loadNextShadowing();
        render();
      } else if (e.target.id === "rateSelect") {
        STORE.state.settings.rate = parseFloat(e.target.value) || 1.0;
        STORE.save();
        AUDIO.setRate(STORE.state.settings.rate);
        showToast(`再生速度を ${STORE.state.settings.rate}x に設定しました`);
      } else if (e.target.id === "drillPatternSelect") {
        state.trainPid = e.target.value;
        state.instantItem = null; state.listenItem = null; state.shadowItem = null;
        state.drillIdx = 0;
        state.drillResult = null;
        render();
      } else if (e.target.id === "walkThinkSelect") {
        state.walkThinkSec = parseInt(e.target.value, 10) || 5;
      } else if (e.target.id === "walkRepeatSelect") {
        state.walkRepeatSec = parseInt(e.target.value, 10) || 4;
      } else if (e.target.id === "walkDurSelect") {
        state.walkDurationMin = parseInt(e.target.value, 10) || 30;
      }
    });

    // Enter key submit support
    main.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      if (e.target.id === "instantInput") {
        e.preventDefault();
        submitInstantAnswer(false);
      } else if (e.target.id === "listenInput") {
        e.preventDefault();
        const btn = main.querySelector('[data-action="listen-check"]');
        if (btn) btn.click();
      } else if (e.target.id === "chatInput") {
        e.preventDefault();
        const btn = main.querySelector('[data-action="chat-send"]');
        if (btn) btn.click();
      }
    });
  }

  function init() {
    // Populate nav icons
    document.querySelector('[data-nav="home"] .nav-ic').innerHTML = ICONS.home;
    document.querySelector('[data-nav="train"] .nav-ic').innerHTML = ICONS.train;
    document.querySelector('[data-nav="chat"] .nav-ic').innerHTML = ICONS.chat;
    document.querySelector('[data-nav="walk"] .nav-ic').innerHTML = ICONS.walk;
    document.querySelector('[data-nav="dash"] .nav-ic').innerHTML = ICONS.dash;
    document.getElementById("settingsOpenBtn").innerHTML = ICONS.gear;

    applySettingsToEngine();
    bindGlobalEvents();
    updateBottomNav();
    render();

    // Track active study time every 15 seconds while visible
    state.sessionTickId = setInterval(() => {
      if (document.visibilityState === "visible") {
        STORE.addStudySeconds(15);
        if (state.view === "home") {
          const d = new Date();
          const key = [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");
          const rec = STORE.state.daily[key] || {};
          const seconds = rec.studySec || 0;
          const goal = Math.max(1, Number(STORE.state.settings.dailyGoal) || 15);
          const pct = Math.min(100, Math.round(seconds / (goal * 60) * 100));
          const mins = document.getElementById("motMinutes"), label = document.getElementById("motGoalLabel"), bar = document.getElementById("motGoalBar"), msg = document.getElementById("motGoalMessage");
          if (mins && label && bar && msg) {
            mins.textContent = Math.floor(seconds/60);
            label.textContent = pct >= 100 ? "達成！" : pct + "%";
            label.className = "pill " + (pct >= 100 ? "success" : "accent");
            bar.style.width = pct + "%";
            bar.parentElement.setAttribute("aria-valuenow", String(pct));
            msg.textContent = pct >= 100 ? "目標クリア！今日も一歩前進。" : "あと" + Math.max(1, Math.ceil((goal*60-seconds)/60)) + "分。少しずつ積み重ねよう。";
          }
          const day = document.querySelector(".mot-day.today");
          if (day) {day.classList.add("done");day.querySelector("i").textContent = "✓";day.setAttribute("aria-label",d.getDate()+"日 学習済み");}
          applySettingsToEngine();
        }
      }
    }, 15000);


  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();

</script>
</body>
</html>
