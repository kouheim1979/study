<script>
window.ENGLISH80_DATA = {"categories":[{"id":"cat1","name":"基本的な自己表現","enName":"Basic Self-Expression","color":"#2563EB","description":"自分の属性・得意なこと・習慣・変化を自然に伝える土台となる10構文"},{"id":"cat2","name":"希望・予定・意思","enName":"Desires, Plans & Intentions","color":"#059669","description":"やりたいこと・予定・決意・楽しみを的確に表現する10構文"},{"id":"cat3","name":"意見・感情・考え","enName":"Opinions, Feelings & Thoughts","color":"#7C3AED","description":"自分の考え・懸念・共感・率直な感想を的確に伝える10構文"},{"id":"cat4","name":"質問・情報収集","enName":"Questions & Information Gathering","color":"#0284C7","description":"知りたいことを丁寧に・自然に引き出す質問の10構文"},{"id":"cat5","name":"依頼・提案・許可","enName":"Requests, Suggestions & Permission","color":"#EA580C","description":"丁寧なお願い・スマートな提案・許可のやり取りを自在にする10構文"},{"id":"cat6","name":"必要性・可能性・義務","enName":"Necessity, Possibility & Obligation","color":"#DC2626","description":"やるべきこと・予定・推量・助言・重要性を自在に表す10構文"},{"id":"cat7","name":"経験・過去・現在の状況","enName":"Experience, Past & Current Situations","color":"#0D9488","description":"過去の習慣・経験・継続中の状況・現在地を鮮やかに語る10構文"},{"id":"cat8","name":"条件・理由・会話の発展","enName":"Conditions, Reasons & Expanding Conversation","color":"#4F46E5","description":"論理的な説明・仮定・譲歩・話題転換で会話を自在に広げる10構文"}],"patterns":[{"id":"P01","catId":"cat1","pattern":"I'm ...","meaning":"私は〜です／今〜な状態です","grammar":"be動詞の短縮形 I'm に名詞・形容詞・前置詞句を続けて、属性・状態・居場所を表します。","usage":"自己紹介、今の気分や体調、スケジュール上の余裕、居場所を伝える場面で最も頻繁に使われます。","nuance":"I am よりも自然で会話的な響きになります。肯定文の口語ではほぼ常に短縮形を使います。","similar":"I feel ...（内面の感覚を強調）／ I'm currently ...（一時的な現在の状況を強調）","pitfall":"形容詞の前に a を付けてしまう誤り（× I'm a busy）や、excited と exciting の混同に注意しましょう。","dialogue":[{"speaker":"A","en":"Hey, how are you feeling before the client presentation?","jp":"ねえ、クライアント向けのプレゼン前だけど気分はどう？"},{"speaker":"B","en":"I'm a bit nervous, but I'm ready to get started.","jp":"少し緊張していますが、始める準備はできています。"},{"speaker":"A","en":"You know the material inside out. You'll do fine.","jp":"内容は完璧に頭に入っているよ。大丈夫。"},{"speaker":"B","en":"Thanks. I'm glad you're on my team today.","jp":"ありがとう。今日あなたが同じチームで心強いです。"}],"drills":{"subject":{"en":"She's very patient with new team members.","jp":"彼女は新しいメンバーに対してとても忍耐強いです。"},"tense":{"en":"I was exhausted after the overnight flight.","jp":"夜行便の後で疲れ切っていました。"},"negative":{"en":"I'm not familiar with this software yet.","jp":"このソフトにはまだ詳しくありません。"},"question":{"en":"Are you free for a quick call this afternoon?","jp":"今日の午後、少し電話できますか？"}},"examples":[{"id":"P01_01","en":"I'm from Yokohama, Japan.","tpl":"[[I'm]] from Yokohama, Japan.","jp":"私は日本の横浜出身です。","scene":"自己紹介","alts":["I am from Yokohama, Japan."]},{"id":"P01_02","en":"I'm a little nervous about the interview.","tpl":"[[I'm]] a little nervous about the interview.","jp":"面接のことで少し緊張しています。","scene":"職場","alts":["I am a bit nervous about the interview."]},{"id":"P01_03","en":"I'm free after six today.","tpl":"[[I'm]] free after six today.","jp":"今日は6時以降なら空いています。","scene":"日常","alts":["I am available after six today."]},{"id":"P01_04","en":"I'm on my way to the station now.","tpl":"[[I'm]] on my way to the station now.","jp":"今、駅に向かっているところです。","scene":"日常","alts":["I am heading to the station now."]},{"id":"P01_05","en":"I'm ready to order whenever you are.","tpl":"[[I'm]] ready to order whenever you are.","jp":"いつでも注文できます。","scene":"レストラン","alts":["I am ready to order."]},{"id":"P01_06","en":"I'm here on a business trip from Tokyo.","tpl":"[[I'm]] here on a business trip from Tokyo.","jp":"東京から出張で来ています。","scene":"海外出張","alts":["I am visiting on business from Tokyo."]},{"id":"P01_07","en":"I'm allergic to peanuts and shellfish.","tpl":"[[I'm]] allergic to peanuts and shellfish.","jp":"ピーナッツと甲殻類のアレルギーがあります。","scene":"レストラン","alts":["I have a peanut and shellfish allergy."]},{"id":"P01_08","en":"I'm sorry for the late reply.","tpl":"[[I'm]] sorry for the late reply.","jp":"返信が遅くなって申し訳ありません。","scene":"職場","alts":["Sorry for the delayed response."]},{"id":"P01_09","en":"I'm totally fine with either option.","tpl":"[[I'm]] totally fine with either option.","jp":"どちらの選択肢でもまったく問題ありません。","scene":"会議","alts":["Either option works for me."]},{"id":"P01_10","en":"I'm jet-lagged after the long flight.","tpl":"[[I'm]] jet-lagged after the long flight.","jp":"長いフライトの後で時差ボケしています。","scene":"旅行","alts":["I have jet lag after the long flight."]},{"id":"P01_11","en":"I'm just browsing for now, thank you.","tpl":"[[I'm]] just browsing for now, thank you.","jp":"今は見ているだけです、ありがとう。","scene":"買い物","alts":["I am just looking around, thanks."]},{"id":"P01_12","en":"I'm staying at a hotel near the airport.","tpl":"[[I'm]] staying at a hotel near the airport.","jp":"空港近くのホテルに滞在しています。","scene":"ホテル","alts":["I am staying near the airport."]},{"id":"P01_13","en":"I'm really grateful for your help today.","tpl":"[[I'm]] really grateful for your help today.","jp":"今日は手伝ってくれて本当に感謝しています。","scene":"友人","alts":["I really appreciate your help today."]},{"id":"P01_14","en":"I'm running five minutes late for the meeting.","tpl":"[[I'm]] running five minutes late for the meeting.","jp":"会議に5分ほど遅れています。","scene":"会議","alts":["I will be five minutes late to the meeting."]},{"id":"P01_15","en":"I'm starving because I skipped lunch.","tpl":"[[I'm]] starving because I skipped lunch.","jp":"昼食を抜いたのでお腹がぺこぺこです。","scene":"日常","alts":["I am really hungry since I skipped lunch."]},{"id":"P01_16","en":"I'm pretty confident about the final numbers.","tpl":"[[I'm]] pretty confident about the final numbers.","jp":"最終的な数字にはかなり自信があります。","scene":"職場","alts":["I feel confident about the final figures."]},{"id":"P01_17","en":"I'm in the lobby waiting by the front desk.","tpl":"[[I'm]] in the lobby waiting by the front desk.","jp":"フロントのそばのロビーで待っています。","scene":"ホテル","alts":["I am waiting in the lobby near reception."]},{"id":"P01_18","en":"I'm open to any feedback you have.","tpl":"[[I'm]] open to any feedback you have.","jp":"どんなフィードバックでも歓迎します。","scene":"会議","alts":["I welcome any feedback you have."]},{"id":"P01_19","en":"I'm exhausted from walking around all day.","tpl":"[[I'm]] exhausted from walking around all day.","jp":"一日中歩き回ってくたくたです。","scene":"旅行","alts":["I am worn out from walking all day."]},{"id":"P01_20","en":"I'm thrilled to finally meet you in person.","tpl":"[[I'm]] thrilled to finally meet you in person.","jp":"ついに直接お会いできてとてもうれしいです。","scene":"自己紹介","alts":["I am so happy to finally meet you face to face."]}]},{"id":"P02","catId":"cat1","pattern":"I work as ...","meaning":"私は〜として働いています","grammar":"work as + 職業名（可算名詞の単数形には a / an を付ける）で自分の職種を端的に伝えます。","usage":"初対面の自己紹介、異業種交流、海外出張時の名刺交換などで職種を説明するときに使います。","nuance":"I'm a ... とほぼ同じですが、仕事上の役割や専門職としての立場を丁寧に伝える響きがあります。","similar":"I work for + 会社名（〜社に勤めている）／ I work in + 業界・部署（〜分野で働いている）","pitfall":"職業名の前の冠詞 a / an を落としやすいので注意（× I work as engineer → ○ I work as an engineer）。","dialogue":[{"speaker":"A","en":"So, what do you do back in Japan?","jp":"日本ではどんなお仕事をされているんですか？"},{"speaker":"B","en":"I work as a product manager at a tech company.","jp":"IT企業でプロダクトマネージャーとして働いています。"},{"speaker":"A","en":"That sounds exciting. How long have you been in that role?","jp":"面白そうですね。そのポジションはどのくらいですか？"},{"speaker":"B","en":"About three years now. I really enjoy working with engineers.","jp":"もう3年くらいです。エンジニアと働くのがとても楽しいです。"}],"drills":{"subject":{"en":"My brother works as a chef in Kyoto.","jp":"兄は京都でシェフとして働いています。"},"tense":{"en":"I worked as a sales rep before moving to marketing.","jp":"マーケティングに移る前は営業担当として働いていました。"},"negative":{"en":"I don't work as a full-time employee anymore.","jp":"今はもう正社員としては働いていません。"},"question":{"en":"Did you work as a designer before joining us?","jp":"入社前はデザイナーとして働いていたのですか？"}},"examples":[{"id":"P02_01","en":"I work as a software engineer in Tokyo.","tpl":"[[I work as]] a software engineer in Tokyo.","jp":"東京でソフトウェアエンジニアとして働いています。","scene":"自己紹介","alts":["I am a software engineer in Tokyo."]},{"id":"P02_02","en":"I work as a project manager for a global team.","tpl":"[[I work as]] a project manager for a global team.","jp":"グローバルチームのプロジェクトマネージャーとして働いています。","scene":"職場","alts":["I am a project manager for an international team."]},{"id":"P02_03","en":"I work as a freelance graphic designer.","tpl":"[[I work as]] a freelance graphic designer.","jp":"フリーランスのグラフィックデザイナーとして働いています。","scene":"自己紹介","alts":["I am a freelance graphic designer."]},{"id":"P02_04","en":"I work as a nurse at a local hospital.","tpl":"[[I work as]] a nurse at a local hospital.","jp":"地元の病院で看護師として働いています。","scene":"自己紹介","alts":["I am a nurse at a community hospital."]},{"id":"P02_05","en":"I work as an accountant for a trading company.","tpl":"[[I work as]] an accountant for a trading company.","jp":"商社で経理担当として働いています。","scene":"職場","alts":["I am an accountant at a trading firm."]},{"id":"P02_06","en":"I work as a marketing specialist focusing on digital ads.","tpl":"[[I work as]] a marketing specialist focusing on digital ads.","jp":"デジタル広告専門のマーケティング担当として働いています。","scene":"職場","alts":["I specialize in digital marketing."]},{"id":"P02_07","en":"I work as a part-time barista on weekends.","tpl":"[[I work as]] a part-time barista on weekends.","jp":"週末はカフェのバリスタのアルバイトをしています。","scene":"日常","alts":["I have a part-time job as a barista on weekends."]},{"id":"P02_08","en":"I work as a high school math teacher.","tpl":"[[I work as]] a high school math teacher.","jp":"高校の数学教師として働いています。","scene":"自己紹介","alts":["I teach high school math."]},{"id":"P02_09","en":"I work as a customer support lead.","tpl":"[[I work as]] a customer support lead.","jp":"カスタマーサポートのリーダーとして働いています。","scene":"職場","alts":["I lead the customer support team."]},{"id":"P02_10","en":"I work as a consultant helping small businesses.","tpl":"[[I work as]] a consultant helping small businesses.","jp":"中小企業を支援するコンサルタントとして働いています。","scene":"海外出張","alts":["I am a small business consultant."]},{"id":"P02_11","en":"I work as a tour guide during the summer.","tpl":"[[I work as]] a tour guide during the summer.","jp":"夏の間はツアーガイドとして働いています。","scene":"旅行","alts":["I guide tours in the summer."]},{"id":"P02_12","en":"I work as a data analyst in the finance department.","tpl":"[[I work as]] a data analyst in the finance department.","jp":"財務部でデータアナリストとして働いています。","scene":"会議","alts":["I am a data analyst in finance."]},{"id":"P02_13","en":"I work as a translator for legal documents.","tpl":"[[I work as]] a translator for legal documents.","jp":"法務文書の翻訳者として働いています。","scene":"職場","alts":["I translate legal documents."]},{"id":"P02_14","en":"I work as a pharmacist near the main station.","tpl":"[[I work as]] a pharmacist near the main station.","jp":"主要駅の近くで薬剤師として働いています。","scene":"自己紹介","alts":["I am a pharmacist near the main station."]},{"id":"P02_15","en":"I work as an HR recruiter for the Asia region.","tpl":"[[I work as]] an HR recruiter for the Asia region.","jp":"アジア地域の人事採用担当として働いています。","scene":"海外出張","alts":["I am an HR recruiter for Asia."]},{"id":"P02_16","en":"I work as a research scientist at a university.","tpl":"[[I work as]] a research scientist at a university.","jp":"大学で研究員として働いています。","scene":"自己紹介","alts":["I am a university researcher."]},{"id":"P02_17","en":"I work as a store manager in Shibuya.","tpl":"[[I work as]] a store manager in Shibuya.","jp":"渋谷で店長として働いています。","scene":"買い物","alts":["I manage a store in Shibuya."]},{"id":"P02_18","en":"I work as a QA tester to catch bugs early.","tpl":"[[I work as]] a QA tester to catch bugs early.","jp":"バグを早期に発見するQAテスターとして働いています。","scene":"職場","alts":["I am a QA tester."]},{"id":"P02_19","en":"I work as a hotel receptionist on the night shift.","tpl":"[[I work as]] a hotel receptionist on the night shift.","jp":"夜勤のホテルフロント係として働いています。","scene":"ホテル","alts":["I am a night-shift hotel receptionist."]},{"id":"P02_20","en":"I work as a volunteer coordinator on Sundays.","tpl":"[[I work as]] a volunteer coordinator on Sundays.","jp":"日曜日はボランティアのコーディネーターをしています。","scene":"友人","alts":["I coordinate volunteers on Sundays."]}]},{"id":"P03","catId":"cat1","pattern":"I'm in charge of ...","meaning":"私は〜を担当しています","grammar":"I'm in charge of + 名詞／動名詞（-ing）で、自分の責任範囲や担当業務を表します。","usage":"ビジネス会議、自己紹介、クライアントへの窓口案内、イベント運営などで役割分担を伝えるときに使います。","nuance":"単に手伝うのではなく、最終的な責任を持って取り仕切っているニュアンスがあります。","similar":"I'm responsible for ...（責任をより強調）／ I handle ...（実務としてさばく感覚）","pitfall":"of の後ろに動詞を置くときは必ず動名詞（-ing）にします（× in charge of manage → ○ in charge of managing）。","dialogue":[{"speaker":"A","en":"Welcome to the kickoff meeting. Could you briefly introduce your role?","jp":"キックオフ会議へようこそ。簡単に役割を紹介していただけますか？"},{"speaker":"B","en":"Sure. I'm in charge of the overall launch schedule.","jp":"はい。全体のローンチスケジュールを担当しています。"},{"speaker":"A","en":"Great, so we should check with you before changing any deadlines.","jp":"なるほど、締め切りを変更するときはあなたに確認すべきですね。"},{"speaker":"B","en":"Exactly. Feel free to message me anytime.","jp":"その通りです。いつでも気軽に連絡してください。"}],"drills":{"subject":{"en":"Ken is in charge of the client onboarding process.","jp":"ケンが顧客の導入支援プロセスを担当しています。"},"tense":{"en":"I was in charge of organizing last year's conference.","jp":"昨年のカンファレンスの運営を担当していました。"},"negative":{"en":"I'm not in charge of billing, so let me transfer you.","jp":"請求業務は私の担当ではないので、担当者におつなぎします。"},"question":{"en":"Who is in charge of approving travel expenses?","jp":"出張費の承認は誰が担当していますか？"}},"examples":[{"id":"P03_01","en":"I'm in charge of overseas sales.","tpl":"[[I'm in charge of]] overseas sales.","jp":"海外営業を担当しています。","scene":"職場","alts":["I handle overseas sales."]},{"id":"P03_02","en":"I'm in charge of managing the project budget.","tpl":"[[I'm in charge of]] managing the project budget.","jp":"プロジェクトの予算管理を担当しています。","scene":"会議","alts":["I manage the project budget."]},{"id":"P03_03","en":"I'm in charge of training new hires this month.","tpl":"[[I'm in charge of]] training new hires this month.","jp":"今月は新入社員の研修を担当しています。","scene":"職場","alts":["I am handling new hire training this month."]},{"id":"P03_04","en":"I'm in charge of our company's social media accounts.","tpl":"[[I'm in charge of]] our company's social media accounts.","jp":"自社のSNSアカウント運用を担当しています。","scene":"自己紹介","alts":["I run our company's social media."]},{"id":"P03_05","en":"I'm in charge of booking the flights and hotels.","tpl":"[[I'm in charge of]] booking the flights and hotels.","jp":"航空券とホテルの手配を担当しています。","scene":"海外出張","alts":["I am handling flight and hotel bookings."]},{"id":"P03_06","en":"I'm in charge of quality control at the factory.","tpl":"[[I'm in charge of]] quality control at the factory.","jp":"工場の品質管理を担当しています。","scene":"職場","alts":["I oversee quality control at the factory."]},{"id":"P03_07","en":"I'm in charge of taking notes during today's meeting.","tpl":"[[I'm in charge of]] taking notes during today's meeting.","jp":"今日の会議の議事録を担当しています。","scene":"会議","alts":["I am taking the minutes for today's meeting."]},{"id":"P03_08","en":"I'm in charge of customer relations in Europe.","tpl":"[[I'm in charge of]] customer relations in Europe.","jp":"ヨーロッパ地域の顧客対応を担当しています。","scene":"海外出張","alts":["I handle European client relations."]},{"id":"P03_09","en":"I'm in charge of cooking dinner on weekdays.","tpl":"[[I'm in charge of]] cooking dinner on weekdays.","jp":"平日の夕食づくりを担当しています。","scene":"日常","alts":["I do the weekday dinner cooking."]},{"id":"P03_10","en":"I'm in charge of coordinating with the design agency.","tpl":"[[I'm in charge of]] coordinating with the design agency.","jp":"デザイン会社との調整を担当しています。","scene":"職場","alts":["I coordinate with the design agency."]},{"id":"P03_11","en":"I'm in charge of setting up the presentation equipment.","tpl":"[[I'm in charge of]] setting up the presentation equipment.","jp":"プレゼン機材のセッティングを担当しています。","scene":"会議","alts":["I am setting up the presentation gear."]},{"id":"P03_12","en":"I'm in charge of reviewing all incoming contracts.","tpl":"[[I'm in charge of]] reviewing all incoming contracts.","jp":"届く契約書すべての確認を担当しています。","scene":"職場","alts":["I review all incoming contracts."]},{"id":"P03_13","en":"I'm in charge of picking the restaurant for Friday.","tpl":"[[I'm in charge of]] picking the restaurant for Friday.","jp":"金曜日のレストラン選びを担当しています。","scene":"友人","alts":["I am choosing the restaurant for Friday."]},{"id":"P03_14","en":"I'm in charge of inventory management at our branch.","tpl":"[[I'm in charge of]] inventory management at our branch.","jp":"支店での在庫管理を担当しています。","scene":"職場","alts":["I manage inventory at our branch."]},{"id":"P03_15","en":"I'm in charge of organizing the team retreat.","tpl":"[[I'm in charge of]] organizing the team retreat.","jp":"チーム合宿の企画を担当しています。","scene":"職場","alts":["I am organizing the team retreat."]},{"id":"P03_16","en":"I'm in charge of answering technical inquiries.","tpl":"[[I'm in charge of]] answering technical inquiries.","jp":"技術的な問い合わせへの対応を担当しています。","scene":"職場","alts":["I handle technical questions."]},{"id":"P03_17","en":"I'm in charge of updating the product website.","tpl":"[[I'm in charge of]] updating the product website.","jp":"製品ウェブサイトの更新を担当しています。","scene":"職場","alts":["I maintain the product website."]},{"id":"P03_18","en":"I'm in charge of keeping track of our travel receipts.","tpl":"[[I'm in charge of]] keeping track of our travel receipts.","jp":"出張の領収書管理を担当しています。","scene":"海外出張","alts":["I track our travel receipts."]},{"id":"P03_19","en":"I'm in charge of welcoming guests at the reception desk.","tpl":"[[I'm in charge of]] welcoming guests at the reception desk.","jp":"受付でゲストをお迎えする担当です。","scene":"ホテル","alts":["I welcome guests at reception."]},{"id":"P03_20","en":"I'm in charge of planning our family summer trip.","tpl":"[[I'm in charge of]] planning our family summer trip.","jp":"家族の夏の旅行計画を担当しています。","scene":"旅行","alts":["I am planning our family summer vacation."]}]},{"id":"P04","catId":"cat1","pattern":"I'm good at ...","meaning":"私は〜が得意です","grammar":"I'm good at + 名詞／動名詞（-ing）で、自分のスキルや強みを表します。","usage":"自己紹介、面接、チーム内での役割分担、趣味や特技の話題でよく使われます。","nuance":"自慢げになりすぎず、自分の得意分野を率直に伝える自然な表現です。否定の I'm not good at ...（苦手）も頻出です。","similar":"I'm great at ...（とても得意）／ I excel at ...（非常に優れている・フォーマル）","pitfall":"前置詞は in ではなく at を使います（× good in English → ○ good at English）。また動詞は -ing 形にします。","dialogue":[{"speaker":"A","en":"We need someone to design the slides for next week.","jp":"来週のスライドをデザインできる人が必要なんだ。"},{"speaker":"B","en":"I'm good at creating clean visuals, so I can take that on.","jp":"見やすい資料を作るのが得意なので、私が引き受けられますよ。"},{"speaker":"A","en":"Really? That would save us so much time.","jp":"本当？それならすごく時間が節約できるよ。"},{"speaker":"B","en":"No problem at all. Send me the rough outline when you can.","jp":"全然大丈夫です。大まかな構成ができたら送ってください。"}],"drills":{"subject":{"en":"He's really good at explaining complex ideas simply.","jp":"彼は複雑な考えを分かりやすく説明するのがとても上手です。"},"tense":{"en":"I was good at swimming when I was a kid.","jp":"子どもの頃は水泳が得意でした。"},"negative":{"en":"I'm not very good at remembering people's names.","jp":"人の名前を覚えるのがあまり得意ではありません。"},"question":{"en":"Are you good at cooking Italian food?","jp":"イタリア料理を作るのは得意ですか？"}},"examples":[{"id":"P04_01","en":"I'm good at solving problems under pressure.","tpl":"[[I'm good at]] solving problems under pressure.","jp":"プレッシャーの中で問題を解決するのが得意です。","scene":"職場","alts":["I handle problem-solving well under pressure."]},{"id":"P04_02","en":"I'm good at cooking quick weekday meals.","tpl":"[[I'm good at]] cooking quick weekday meals.","jp":"平日の手早い料理が得意です。","scene":"日常","alts":["I can cook quick weekday meals well."]},{"id":"P04_03","en":"I'm good at organizing spreadsheets and data.","tpl":"[[I'm good at]] organizing spreadsheets and data.","jp":"スプレッドシートやデータの整理が得意です。","scene":"職場","alts":["I am skilled at organizing data."]},{"id":"P04_04","en":"I'm good at listening to people's concerns.","tpl":"[[I'm good at]] listening to people's concerns.","jp":"人の悩みを聞くのが得意です。","scene":"友人","alts":["I am a good listener."]},{"id":"P04_05","en":"I'm good at finding affordable flight deals.","tpl":"[[I'm good at]] finding affordable flight deals.","jp":"お得な航空券を見つけるのが得意です。","scene":"旅行","alts":["I am great at spotting cheap flights."]},{"id":"P04_06","en":"I'm good at multitasking during busy hours.","tpl":"[[I'm good at]] multitasking during busy hours.","jp":"忙しい時間帯にマルチタスクをこなすのが得意です。","scene":"職場","alts":["I multitask well when it gets busy."]},{"id":"P04_07","en":"I'm good at remembering faces from meetings.","tpl":"[[I'm good at]] remembering faces from meetings.","jp":"会議で会った人の顔を覚えるのが得意です。","scene":"会議","alts":["I remember faces well."]},{"id":"P04_08","en":"I'm good at negotiating prices at local markets.","tpl":"[[I'm good at]] negotiating prices at local markets.","jp":"地元の市場で値段交渉をするのが得意です。","scene":"買い物","alts":["I am good at bargaining at markets."]},{"id":"P04_09","en":"I'm good at keeping calm during emergencies.","tpl":"[[I'm good at]] keeping calm during emergencies.","jp":"緊急時でも冷静さを保つのが得意です。","scene":"職場","alts":["I stay calm in emergencies."]},{"id":"P04_10","en":"I'm good at reading maps in unfamiliar cities.","tpl":"[[I'm good at]] reading maps in unfamiliar cities.","jp":"知らない街で地図を読むのが得意です。","scene":"旅行","alts":["I navigate unfamiliar cities well."]},{"id":"P04_11","en":"I'm good at spotting tiny typos in documents.","tpl":"[[I'm good at]] spotting tiny typos in documents.","jp":"書類の小さな誤字を見つけるのが得意です。","scene":"職場","alts":["I have a good eye for typos."]},{"id":"P04_12","en":"I'm good at making coffee with a hand drip.","tpl":"[[I'm good at]] making coffee with a hand drip.","jp":"ハンドドリップでコーヒーを淹れるのが得意です。","scene":"日常","alts":["I make great pour-over coffee."]},{"id":"P04_13","en":"I'm good at summarizing long discussions clearly.","tpl":"[[I'm good at]] summarizing long discussions clearly.","jp":"長い議論を分かりやすく要約するのが得意です。","scene":"会議","alts":["I summarize discussions well."]},{"id":"P04_14","en":"I'm good at picking out gifts for friends.","tpl":"[[I'm good at]] picking out gifts for friends.","jp":"友人へのプレゼント選びが得意です。","scene":"買い物","alts":["I am good at choosing gifts."]},{"id":"P04_15","en":"I'm good at adapting to new work environments.","tpl":"[[I'm good at]] adapting to new work environments.","jp":"新しい職場環境に順応するのが得意です。","scene":"自己紹介","alts":["I adapt quickly to new workplaces."]},{"id":"P04_16","en":"I'm good at fixing minor computer issues.","tpl":"[[I'm good at]] fixing minor computer issues.","jp":"ちょっとしたパソコンの不具合を直すのが得意です。","scene":"日常","alts":["I can troubleshoot basic computer problems."]},{"id":"P04_17","en":"I'm good at playing tennis on weekends.","tpl":"[[I'm good at]] playing tennis on weekends.","jp":"週末にするテニスが得意です。","scene":"友人","alts":["I play tennis well."]},{"id":"P04_18","en":"I'm good at managing my time on business trips.","tpl":"[[I'm good at]] managing my time on business trips.","jp":"出張中の時間管理が得意です。","scene":"海外出張","alts":["I manage my schedule well on trips."]},{"id":"P04_19","en":"I'm good at building rapport with new clients.","tpl":"[[I'm good at]] building rapport with new clients.","jp":"新規顧客と信頼関係を築くのが得意です。","scene":"職場","alts":["I build rapport easily with clients."]},{"id":"P04_20","en":"I'm good at baking chocolate chip cookies.","tpl":"[[I'm good at]] baking chocolate chip cookies.","jp":"チョコチップクッキーを焼くのが得意です。","scene":"日常","alts":["I bake really good chocolate chip cookies."]}]},{"id":"P05","catId":"cat1","pattern":"I'm interested in ...","meaning":"私は〜に興味があります","grammar":"I'm interested in + 名詞／動名詞（-ing）で、関心のある分野・商品・活動を伝えます。","usage":"自己紹介、買い物での問い合わせ、キャリアの相談、趣味の会話など幅広く活躍します。","nuance":"購入や参加を前向きに検討しているサインとしても使え、店員や相手から情報を引き出しやすくなります。","similar":"I'm curious about ...（ちょっとした好奇心）／ I'm into ...（今ハマっている・カジュアル）","pitfall":"自分が興味を持つ場合は -ed 形（interested）を使います。I'm interesting と言うと「私は面白い人間です」という意味になります。","dialogue":[{"speaker":"A","en":"Hi there! Let me know if you're looking for anything specific.","jp":"いらっしゃいませ！何かお探しのものがあればお声がけください。"},{"speaker":"B","en":"Actually, I'm interested in this lightweight travel jacket.","jp":"実は、この軽量のトラベルジャケットに興味があるんです。"},{"speaker":"A","en":"That one is water-resistant and packs into its own pocket.","jp":"こちらは撥水加工で、ポケットに折りたたんで収納できますよ。"},{"speaker":"B","en":"Oh, nice! Do you have it in medium?","jp":"いいですね！Mサイズはありますか？"}],"drills":{"subject":{"en":"Our clients are interested in the annual plan.","jp":"クライアントは年間プランに興味を持っています。"},"tense":{"en":"I was interested in architecture when I was in college.","jp":"大学時代は建築に興味がありました。"},"negative":{"en":"I'm not really interested in watching horror movies.","jp":"ホラー映画を観るのにはあまり興味がありません。"},"question":{"en":"Are you interested in joining our study group?","jp":"私たちの勉強会に参加することに興味はありますか？"}},"examples":[{"id":"P05_01","en":"I'm interested in learning more about AI tools.","tpl":"[[I'm interested in]] learning more about AI tools.","jp":"AIツールについてもっと学ぶことに興味があります。","scene":"職場","alts":["I want to learn more about AI tools."]},{"id":"P05_02","en":"I'm interested in trying local street food here.","tpl":"[[I'm interested in]] trying local street food here.","jp":"ここの地元の屋台料理を試すことに興味があります。","scene":"旅行","alts":["I would like to try the local street food."]},{"id":"P05_03","en":"I'm interested in this leather backpack.","tpl":"[[I'm interested in]] this leather backpack.","jp":"このレザーのバックパックに興味があります。","scene":"買い物","alts":["I am looking at this leather backpack."]},{"id":"P05_04","en":"I'm interested in working abroad someday.","tpl":"[[I'm interested in]] working abroad someday.","jp":"いつか海外で働くことに興味があります。","scene":"自己紹介","alts":["I want to work overseas someday."]},{"id":"P05_05","en":"I'm interested in Japanese history and architecture.","tpl":"[[I'm interested in]] Japanese history and architecture.","jp":"日本の歴史と建築に興味があります。","scene":"自己紹介","alts":["I have an interest in Japanese history and architecture."]},{"id":"P05_06","en":"I'm interested in upgrading to a larger room.","tpl":"[[I'm interested in]] upgrading to a larger room.","jp":"もう少し広い部屋へのアップグレードに興味があります。","scene":"ホテル","alts":["I would like to ask about upgrading to a bigger room."]},{"id":"P05_07","en":"I'm interested in how your team handles remote work.","tpl":"[[I'm interested in]] how your team handles remote work.","jp":"御社のチームがリモートワークをどう運用しているか興味があります。","scene":"会議","alts":["I am curious how your team manages remote work."]},{"id":"P05_08","en":"I'm interested in starting a morning running routine.","tpl":"[[I'm interested in]] starting a morning running routine.","jp":"朝のランニング習慣を始めることに興味があります。","scene":"日常","alts":["I am thinking about starting a morning run."]},{"id":"P05_09","en":"I'm interested in sustainable fashion brands.","tpl":"[[I'm interested in]] sustainable fashion brands.","jp":"サステナブルなファッションブランドに興味があります。","scene":"買い物","alts":["I care about sustainable fashion brands."]},{"id":"P05_10","en":"I'm interested in attending next week's workshop.","tpl":"[[I'm interested in]] attending next week's workshop.","jp":"来週のワークショップに参加することに興味があります。","scene":"職場","alts":["I would like to attend next week's workshop."]},{"id":"P05_11","en":"I'm interested in photography, especially street shots.","tpl":"[[I'm interested in]] photography, especially street shots.","jp":"写真、特にストリートスナップに興味があります。","scene":"友人","alts":["I am into street photography."]},{"id":"P05_12","en":"I'm interested in your wine pairing menu.","tpl":"[[I'm interested in]] your wine pairing menu.","jp":"ワインのペアリングメニューに興味があります。","scene":"レストラン","alts":["I would like to know about the wine pairing menu."]},{"id":"P05_13","en":"I'm interested in improving my public speaking skills.","tpl":"[[I'm interested in]] improving my public speaking skills.","jp":"人前で話すスキルを伸ばすことに興味があります。","scene":"職場","alts":["I want to improve my public speaking."]},{"id":"P05_14","en":"I'm interested in visiting national parks in the US.","tpl":"[[I'm interested in]] visiting national parks in the US.","jp":"アメリカの国立公園を訪れることに興味があります。","scene":"旅行","alts":["I would love to visit US national parks."]},{"id":"P05_15","en":"I'm interested in hearing your thoughts on this draft.","tpl":"[[I'm interested in]] hearing your thoughts on this draft.","jp":"この下書きに対するあなたの考えを聞くことに興味があります。","scene":"会議","alts":["I would like to hear your thoughts on this draft."]},{"id":"P05_16","en":"I'm interested in investing for long-term savings.","tpl":"[[I'm interested in]] investing for long-term savings.","jp":"長期的な資産形成のための投資に興味があります。","scene":"日常","alts":["I am looking into long-term investing."]},{"id":"P05_17","en":"I'm interested in booking a guided city tour.","tpl":"[[I'm interested in]] booking a guided city tour.","jp":"ガイド付きの市内ツアーを予約することに興味があります。","scene":"ホテル","alts":["I want to book a guided city tour."]},{"id":"P05_18","en":"I'm interested in podcasts about global business.","tpl":"[[I'm interested in]] podcasts about global business.","jp":"グローバルビジネスに関するポッドキャストに興味があります。","scene":"日常","alts":["I like podcasts about global business."]},{"id":"P05_19","en":"I'm interested in collaborating on the Q3 campaign.","tpl":"[[I'm interested in]] collaborating on the Q3 campaign.","jp":"第3四半期のキャンペーンで協業することに興味があります。","scene":"海外出張","alts":["I would like to collaborate on the Q3 campaign."]},{"id":"P05_20","en":"I'm interested in baking sourdough bread at home.","tpl":"[[I'm interested in]] baking sourdough bread at home.","jp":"家でサワードウブレッドを焼くことに興味があります。","scene":"友人","alts":["I want to try baking sourdough bread at home."]}]},{"id":"P06","catId":"cat1","pattern":"I usually ...","meaning":"私は普段〜します","grammar":"I usually + 動詞の原形（現在形）で、日常の習慣やルーティンを表します。","usage":"平日の過ごし方、週末の習慣、仕事の進め方、普段の好みなどを話すときの定番構文です。","nuance":"「いつも100%（always）」ではなく「たいてい・普段は（7〜8割くらい）」という現実的で自然な頻度を伝えます。","similar":"I normally ...（通常は〜）／ I tend to ...（〜しがちだ）","pitfall":"usually は一般動詞の前、be動詞の後ろに置きます（○ I usually wake up / ○ I'm usually tired）。","dialogue":[{"speaker":"A","en":"What's your typical morning routine before work?","jp":"仕事前のいつもの朝のルーティンはどんな感じですか？"},{"speaker":"B","en":"I usually wake up at six-thirty and go for a short walk.","jp":"普段は6時半に起きて、少し散歩をします。"},{"speaker":"A","en":"That's super healthy. Do you grab coffee on the way?","jp":"とても健康的ですね。途中でコーヒーを買いますか？"},{"speaker":"B","en":"Yeah, I usually make a cup at home before checking emails.","jp":"はい、メールを確認する前に家で1杯淹れるのが習慣です。"}],"drills":{"subject":{"en":"She usually takes the express train to work.","jp":"彼女は普段、急行電車で通勤しています。"},"tense":{"en":"I usually went to the gym after work last year.","jp":"昨年は普段、仕事帰りにジムに通っていました。"},"negative":{"en":"I don't usually drink coffee after three o'clock.","jp":"普段は3時以降にコーヒーを飲みません。"},"question":{"en":"What time do you usually finish work?","jp":"普段は何時ごろ仕事が終わりますか？"}},"examples":[{"id":"P06_01","en":"I usually wake up around seven on weekdays.","tpl":"[[I usually]] wake up around seven on weekdays.","jp":"平日は普段7時ごろに起きます。","scene":"日常","alts":["I normally get up around seven on weekdays."]},{"id":"P06_02","en":"I usually commute to the office by train.","tpl":"[[I usually]] commute to the office by train.","jp":"普段は電車でオフィスに通勤しています。","scene":"職場","alts":["I take the train to work."]},{"id":"P06_03","en":"I usually check my emails first thing in the morning.","tpl":"[[I usually]] check my emails first thing in the morning.","jp":"朝一番にメールを確認するのが習慣です。","scene":"職場","alts":["First thing in the morning, I check my emails."]},{"id":"P06_04","en":"I usually cook dinner at home during the week.","tpl":"[[I usually]] cook dinner at home during the week.","jp":"平日は普段、家で夕食を作ります。","scene":"日常","alts":["I normally make dinner at home on weekdays."]},{"id":"P06_05","en":"I usually pack light for short business trips.","tpl":"[[I usually]] pack light for short business trips.","jp":"短い出張では普段、荷物を少なくします。","scene":"海外出張","alts":["I normally travel light on short business trips."]},{"id":"P06_06","en":"I usually order iced coffee, even in winter.","tpl":"[[I usually]] order iced coffee, even in winter.","jp":"冬でも普段はアイスコーヒーを注文します。","scene":"レストラン","alts":["I normally get iced coffee even in winter."]},{"id":"P06_07","en":"I usually review the agenda before every meeting.","tpl":"[[I usually]] review the agenda before every meeting.","jp":"会議の前には普段、議題を確認します。","scene":"会議","alts":["I always look over the agenda before meetings."]},{"id":"P06_08","en":"I usually go grocery shopping on Sunday mornings.","tpl":"[[I usually]] go grocery shopping on Sunday mornings.","jp":"日曜の朝に食料品の買い出しに行くことが多いです。","scene":"買い物","alts":["I normally do grocery shopping on Sunday morning."]},{"id":"P06_09","en":"I usually sit by the aisle on long flights.","tpl":"[[I usually]] sit by the aisle on long flights.","jp":"長距離フライトでは普段、通路側の席を選びます。","scene":"旅行","alts":["I normally choose an aisle seat on long flights."]},{"id":"P06_10","en":"I usually listen to English podcasts while walking.","tpl":"[[I usually]] listen to English podcasts while walking.","jp":"歩きながら英語のポッドキャストを聴くことが多いです。","scene":"日常","alts":["I listen to English podcasts when I walk."]},{"id":"P06_11","en":"I usually book hotels close to public transit.","tpl":"[[I usually]] book hotels close to public transit.","jp":"普段は公共交通機関に近いホテルを予約します。","scene":"ホテル","alts":["I normally pick hotels near transit."]},{"id":"P06_12","en":"I usually take a quick walk after lunch.","tpl":"[[I usually]] take a quick walk after lunch.","jp":"昼食後に少し散歩するのが習慣です。","scene":"職場","alts":["I normally go for a short walk after lunch."]},{"id":"P06_13","en":"I usually compare reviews before buying electronics.","tpl":"[[I usually]] compare reviews before buying electronics.","jp":"家電を買う前は普段、レビューを比較します。","scene":"買い物","alts":["I always check reviews before buying tech."]},{"id":"P06_14","en":"I usually meet up with friends on Friday nights.","tpl":"[[I usually]] meet up with friends on Friday nights.","jp":"金曜の夜は普段、友人と集まります。","scene":"友人","alts":["I often hang out with friends on Friday nights."]},{"id":"P06_15","en":"I usually write down my tasks on a notepad.","tpl":"[[I usually]] write down my tasks on a notepad.","jp":"普段はメモ帳にタスクを書き出します。","scene":"職場","alts":["I normally jot down my tasks on paper."]},{"id":"P06_16","en":"I usually prefer window seats on scenic trains.","tpl":"[[I usually]] prefer window seats on scenic trains.","jp":"景色のいい電車では普段、窓側の席を好みます。","scene":"旅行","alts":["I normally pick a window seat on scenic trains."]},{"id":"P06_17","en":"I usually stretch for ten minutes before bed.","tpl":"[[I usually]] stretch for ten minutes before bed.","jp":"寝る前に10分ほどストレッチをするのが日課です。","scene":"日常","alts":["I normally do ten minutes of stretching before sleep."]},{"id":"P06_18","en":"I usually share a few appetizers with the table.","tpl":"[[I usually]] share a few appetizers with the table.","jp":"普段はテーブルのみんなで前菜をいくつかシェアします。","scene":"レストラン","alts":["I normally split some appetizers with everyone."]},{"id":"P06_19","en":"I usually arrive ten minutes early for appointments.","tpl":"[[I usually]] arrive ten minutes early for appointments.","jp":"約束の10分前には着くようにしています。","scene":"職場","alts":["I normally show up ten minutes early."]},{"id":"P06_20","en":"I usually read a few pages of a book at night.","tpl":"[[I usually]] read a few pages of a book at night.","jp":"夜は普段、本を数ページ読みます。","scene":"日常","alts":["I normally read a bit before sleeping."]}]},{"id":"P07","catId":"cat1","pattern":"I tend to ...","meaning":"私は〜する傾向があります／〜しがちです","grammar":"I tend to + 動詞の原形 で、無意識のクセや自分の性格・行動の傾向を客観的に表します。","usage":"自分の長所・短所を話すとき、仕事上のクセを共有するとき、雑談で共感を生むときによく使います。","nuance":"I always ... より柔らかく客観的で、「どちらかというと〜しがちなんですよね」と大人の会話にぴったりです。","similar":"I'm likely to ...（〜しそうだ）／ I have a habit of ...（〜する癖がある）","pitfall":"tend の後ろは to + 動詞の原形です（× tend to worrying → ○ tend to worry）。否定は I tend not to ... または I don't tend to ... を使います。","dialogue":[{"speaker":"A","en":"You're already done with the presentation deck?","jp":"もうプレゼン資料ができたんですか？"},{"speaker":"B","en":"Yeah, I tend to finish big tasks early so I don't stress later.","jp":"ええ、後で焦らないように大きな仕事は早めに終わらせがちなんです。"},{"speaker":"A","en":"I wish I had that habit. I tend to overthink the wording.","jp":"その習慣ほしいなあ。私は言い回しを考えすぎちゃうんです。"},{"speaker":"B","en":"We make a good balance then—you can polish my draft!","jp":"じゃあちょうどいいバランスですね。私の下書きを磨いてください！"}],"drills":{"subject":{"en":"He tends to speak very fast when he's excited.","jp":"彼は興奮するととても早口になる傾向があります。"},"tense":{"en":"I tended to skip breakfast when I lived alone.","jp":"一人暮らしの頃は朝食を抜きがちでした。"},"negative":{"en":"I tend not to check work emails on weekends.","jp":"週末は仕事のメールを見ないようにしています。"},"question":{"en":"Do you tend to pack too much for trips?","jp":"旅行のとき荷物を詰め込みすぎる傾向はありますか？"}},"examples":[{"id":"P07_01","en":"I tend to overthink small details.","tpl":"[[I tend to]] overthink small details.","jp":"細かいことを考えすぎる傾向があります。","scene":"自己紹介","alts":["I have a habit of overthinking small details."]},{"id":"P07_02","en":"I tend to speak quickly when I'm nervous.","tpl":"[[I tend to]] speak quickly when I'm nervous.","jp":"緊張すると早口になりがちです。","scene":"会議","alts":["I talk fast when I get nervous."]},{"id":"P07_03","en":"I tend to pack too many clothes for trips.","tpl":"[[I tend to]] pack too many clothes for trips.","jp":"旅行に服を持って行きすぎる傾向があります。","scene":"旅行","alts":["I always overpack clothes for trips."]},{"id":"P07_04","en":"I tend to work better in the morning.","tpl":"[[I tend to]] work better in the morning.","jp":"午前中の方が仕事の効率が上がる傾向があります。","scene":"職場","alts":["I am more productive in the morning."]},{"id":"P07_05","en":"I tend to forget umbrellas on the train.","tpl":"[[I tend to]] forget umbrellas on the train.","jp":"電車に傘を忘れがちです。","scene":"日常","alts":["I often leave my umbrella on the train."]},{"id":"P07_06","en":"I tend to stay up too late on weekends.","tpl":"[[I tend to]] stay up too late on weekends.","jp":"週末は夜更かししがちです。","scene":"日常","alts":["I usually stay up late on weekends."]},{"id":"P07_07","en":"I tend to choose spicy dishes at restaurants.","tpl":"[[I tend to]] choose spicy dishes at restaurants.","jp":"レストランでは辛い料理を選びがちです。","scene":"レストラン","alts":["I usually go for spicy food at restaurants."]},{"id":"P07_08","en":"I tend to double-check my flight gate several times.","tpl":"[[I tend to]] double-check my flight gate several times.","jp":"搭乗ゲートを何度も確認する傾向があります。","scene":"海外出張","alts":["I always check my gate number multiple times."]},{"id":"P07_09","en":"I tend to buy books faster than I can read them.","tpl":"[[I tend to]] buy books faster than I can read them.","jp":"読むスピードより早く本を買ってしまいがちです。","scene":"買い物","alts":["I buy more books than I have time to read."]},{"id":"P07_10","en":"I tend to get sleepy right after a heavy lunch.","tpl":"[[I tend to]] get sleepy right after a heavy lunch.","jp":"重い昼食の直後は眠くなりやすいです。","scene":"職場","alts":["I get drowsy after a big lunch."]},{"id":"P07_11","en":"I tend to take lots of notes during meetings.","tpl":"[[I tend to]] take lots of notes during meetings.","jp":"会議中はたくさんメモを取る傾向があります。","scene":"会議","alts":["I usually take detailed notes in meetings."]},{"id":"P07_12","en":"I tend to avoid crowded tourist spots.","tpl":"[[I tend to]] avoid crowded tourist spots.","jp":"混雑した観光地は避ける傾向があります。","scene":"旅行","alts":["I prefer to stay away from crowded tourist places."]},{"id":"P07_13","en":"I tend to lose track of time when I'm coding.","tpl":"[[I tend to]] lose track of time when I'm coding.","jp":"コーディングをしていると時間を忘れがちです。","scene":"職場","alts":["I often lose track of time while coding."]},{"id":"P07_14","en":"I tend to spend more than planned during sales.","tpl":"[[I tend to]] spend more than planned during sales.","jp":"セールのときは予定以上に使ってしまいがちです。","scene":"買い物","alts":["I usually overspend during sales."]},{"id":"P07_15","en":"I tend to drink too much coffee on busy days.","tpl":"[[I tend to]] drink too much coffee on busy days.","jp":"忙しい日はコーヒーを飲みすぎる傾向があります。","scene":"日常","alts":["I have too much coffee when I am busy."]},{"id":"P07_16","en":"I tend to wake up early in hotel rooms.","tpl":"[[I tend to]] wake up early in hotel rooms.","jp":"ホテルの部屋では早く目が覚めがちです。","scene":"ホテル","alts":["I usually wake up early when staying at hotels."]},{"id":"P07_17","en":"I tend to ask a lot of clarifying questions.","tpl":"[[I tend to]] ask a lot of clarifying questions.","jp":"確認の質問をたくさんする傾向があります。","scene":"会議","alts":["I often ask many follow-up questions."]},{"id":"P07_18","en":"I tend to listen more than I talk in big groups.","tpl":"[[I tend to]] listen more than I talk in big groups.","jp":"大人数では話すより聞く方に回りがちです。","scene":"友人","alts":["I am more of a listener in big groups."]},{"id":"P07_19","en":"I tend to underestimate how long traffic will take.","tpl":"[[I tend to]] underestimate how long traffic will take.","jp":"渋滞にかかる時間を甘く見積もりがちです。","scene":"海外出張","alts":["I often misjudge traffic times."]},{"id":"P07_20","en":"I tend to stick to familiar brands when shopping.","tpl":"[[I tend to]] stick to familiar brands when shopping.","jp":"買い物のときは馴染みのあるブランドを選びがちです。","scene":"買い物","alts":["I usually buy brands I already know."]}]},{"id":"P08","catId":"cat1","pattern":"I prefer ... to ...","meaning":"〜より…の方が好きです","grammar":"I prefer A to B（A・Bは名詞または動名詞 -ing）で、2つのうちAをより好むことを表します。","usage":"レストランでの注文、座席の希望、仕事の進め方、趣味やライフスタイルの比較などで使います。","nuance":"I like A better than B より洗練された大人っぽい響きで、ビジネスでも日常でも好印象です。","similar":"I'd rather ... than ...（その場の選択として〜したい）／ I like ... better than ...（よりカジュアル）","pitfall":"比較の相手をつなぐ前置詞は than ではなく to です（× prefer coffee than tea → ○ prefer coffee to tea）。","dialogue":[{"speaker":"A","en":"Should we hold tomorrow's sync online or in person?","jp":"明日の打ち合わせはオンラインと対面のどちらにしましょうか？"},{"speaker":"B","en":"I prefer meeting in person to talking over video for brainstorming.","jp":"ブレストならビデオ通話より対面で話す方が好きです。"},{"speaker":"A","en":"Makes sense. Let's book conference room B at ten.","jp":"なるほど。じゃあ10時に会議室Bを予約しましょう。"},{"speaker":"B","en":"Sounds great, thanks for arranging it.","jp":"いいですね、手配ありがとうございます。"}],"drills":{"subject":{"en":"My boss prefers short bullet points to long paragraphs.","jp":"上司は長い文章より短い箇条書きを好みます。"},"tense":{"en":"I preferred studying at cafés to studying at home.","jp":"家よりカフェで勉強する方が好きでした。"},"negative":{"en":"I don't necessarily prefer one over the other.","jp":"特にどちらかを強く好むわけではありません。"},"question":{"en":"Do you prefer window seats to aisle seats?","jp":"通路側より窓側の席の方が好きですか？"}},"examples":[{"id":"P08_01","en":"I prefer coffee to tea in the morning.","tpl":"[[I prefer]] coffee [[to]] tea in the morning.","jp":"朝は紅茶よりコーヒーの方が好きです。","scene":"日常","alts":["I like coffee better than tea in the morning."]},{"id":"P08_02","en":"I prefer working from home to commuting.","tpl":"[[I prefer]] working from home [[to]] commuting.","jp":"通勤するより在宅勤務の方が好きです。","scene":"職場","alts":["I like remote work better than commuting."]},{"id":"P08_03","en":"I prefer direct flights to connecting flights.","tpl":"[[I prefer]] direct flights [[to]] connecting flights.","jp":"乗り継ぎ便より直行便の方が好きです。","scene":"旅行","alts":["I like nonstop flights better than layovers."]},{"id":"P08_04","en":"I prefer texting to making phone calls.","tpl":"[[I prefer]] texting [[to]] making phone calls.","jp":"電話をかけるよりメッセージを送る方が好きです。","scene":"日常","alts":["I like texting more than calling."]},{"id":"P08_05","en":"I prefer quiet restaurants to noisy bars.","tpl":"[[I prefer]] quiet restaurants [[to]] noisy bars.","jp":"にぎやかなバーより静かなレストランの方が好きです。","scene":"レストラン","alts":["I like quiet restaurants better than loud bars."]},{"id":"P08_06","en":"I prefer walking to taking crowded buses.","tpl":"[[I prefer]] walking [[to]] taking crowded buses.","jp":"混んだバスに乗るより歩く方が好きです。","scene":"日常","alts":["I would rather walk than take a crowded bus."]},{"id":"P08_07","en":"I prefer morning meetings to late-afternoon ones.","tpl":"[[I prefer]] morning meetings [[to]] late-afternoon ones.","jp":"夕方遅い会議より朝の会議の方が好きです。","scene":"会議","alts":["I like morning meetings better than late ones."]},{"id":"P08_08","en":"I prefer local guesthouses to big chain hotels.","tpl":"[[I prefer]] local guesthouses [[to]] big chain hotels.","jp":"大手チェーンホテルより地元の宿の方が好きです。","scene":"ホテル","alts":["I like local inns better than big chain hotels."]},{"id":"P08_09","en":"I prefer trying clothes on to shopping online.","tpl":"[[I prefer]] trying clothes on [[to]] shopping online.","jp":"ネット通販より試着して買う方が好きです。","scene":"買い物","alts":["I like shopping in store better than online."]},{"id":"P08_10","en":"I prefer sparkling water to still water.","tpl":"[[I prefer]] sparkling water [[to]] still water.","jp":"普通の水より炭酸水の方が好きです。","scene":"レストラン","alts":["I like sparkling water better than still water."]},{"id":"P08_11","en":"I prefer autumn to summer because it's cooler.","tpl":"[[I prefer]] autumn [[to]] summer because it's cooler.","jp":"涼しいので夏より秋の方が好きです。","scene":"友人","alts":["I like fall better than summer."]},{"id":"P08_12","en":"I prefer written summaries to long voicemails.","tpl":"[[I prefer]] written summaries [[to]] long voicemails.","jp":"長い留守電より文章の要約の方が好きです。","scene":"職場","alts":["I like written notes better than long voicemails."]},{"id":"P08_13","en":"I prefer savory snacks to sweet desserts.","tpl":"[[I prefer]] savory snacks [[to]] sweet desserts.","jp":"甘いデザートよりしょっぱいスナックの方が好きです。","scene":"日常","alts":["I like savory snacks more than sweets."]},{"id":"P08_14","en":"I prefer exploring side streets to main avenues.","tpl":"[[I prefer]] exploring side streets [[to]] main avenues.","jp":"大通りより路地裏を探索する方が好きです。","scene":"旅行","alts":["I enjoy side streets more than main streets."]},{"id":"P08_15","en":"I prefer paying by card to carrying cash.","tpl":"[[I prefer]] paying by card [[to]] carrying cash.","jp":"現金を持ち歩くよりカードで払う方が好きです。","scene":"買い物","alts":["I like paying with a card rather than cash."]},{"id":"P08_16","en":"I prefer small team discussions to huge seminars.","tpl":"[[I prefer]] small team discussions [[to]] huge seminars.","jp":"大人数のセミナーより少人数の議論の方が好きです。","scene":"会議","alts":["I like small group discussions better than big seminars."]},{"id":"P08_17","en":"I prefer mountains to beaches for summer trips.","tpl":"[[I prefer]] mountains [[to]] beaches for summer trips.","jp":"夏の旅行は海より山の方が好きです。","scene":"旅行","alts":["I like the mountains more than the beach."]},{"id":"P08_18","en":"I prefer dark roast to light roast beans.","tpl":"[[I prefer]] dark roast [[to]] light roast beans.","jp":"浅煎りより深煎りの豆の方が好きです。","scene":"レストラン","alts":["I like dark roast better than light roast."]},{"id":"P08_19","en":"I prefer paper books to e-books before sleep.","tpl":"[[I prefer]] paper books [[to]] e-books before sleep.","jp":"寝る前は電子書籍より紙の本の方が好きです。","scene":"日常","alts":["I like physical books more than e-books at night."]},{"id":"P08_20","en":"I prefer honest feedback to polite compliments.","tpl":"[[I prefer]] honest feedback [[to]] polite compliments.","jp":"社交辞令より率直なフィードバックの方が好きです。","scene":"職場","alts":["I value honest feedback over polite praise."]}]},{"id":"P09","catId":"cat1","pattern":"I'm getting ...","meaning":"だんだん〜になってきています","grammar":"I'm getting + 形容詞（または比較級・過去分詞）で、状態が徐々に変化している途中であることを表します。","usage":"体調や気分の変化、英語や仕事への慣れ、空腹・眠気・疲れなど、今まさに変化している感覚を伝えるときに使います。","nuance":"I'm tired（もう疲れている）に対し、I'm getting tired（そろそろ疲れてきた）と、リアルな進行中の変化を表現できます。","similar":"I'm becoming ...（ややフォーマル・長期的な変化）／ I'm starting to ...（〜し始めている）","pitfall":"「〜に慣れてきた」は I'm getting used to + 名詞／-ing になります。to の後ろを動詞の原形にしないよう注意。","dialogue":[{"speaker":"A","en":"How are you settling into the new London office?","jp":"新しいロンドンオフィスには馴染んできましたか？"},{"speaker":"B","en":"I'm getting used to the commute, and everyone has been really welcoming.","jp":"通勤にも慣れてきていますし、皆さん本当に温かく迎えてくれています。"},{"speaker":"A","en":"That's great to hear. Are you getting comfortable with the local accent too?","jp":"それはよかった。現地のアクセントにも慣れてきました？"},{"speaker":"B","en":"Slowly, yes! I'm getting much better at catching fast conversations.","jp":"少しずつですが！速い会話もだいぶ聞き取れるようになってきました。"}],"drills":{"subject":{"en":"The weather is getting much colder this week.","jp":"今週は天気がずいぶん寒くなってきています。"},"tense":{"en":"I was getting worried when the train stopped.","jp":"電車が止まったとき、だんだん心配になってきました。"},"negative":{"en":"I'm not getting enough sleep lately.","jp":"最近、十分な睡眠が取れていません。"},"question":{"en":"Are you getting hungry? Should we grab lunch?","jp":"お腹が空いてきましたか？お昼にしましょうか？"}},"examples":[{"id":"P09_01","en":"I'm getting used to speaking English every day.","tpl":"[[I'm getting]] used to speaking English every day.","jp":"毎日英語を話すことに慣れてきています。","scene":"日常","alts":["I am becoming used to speaking English daily."]},{"id":"P09_02","en":"I'm getting a little hungry after all that walking.","tpl":"[[I'm getting]] a little hungry after all that walking.","jp":"たくさん歩いて少しお腹が空いてきました。","scene":"旅行","alts":["I am starting to feel hungry after walking so much."]},{"id":"P09_03","en":"I'm getting better at handling client calls.","tpl":"[[I'm getting]] better at handling client calls.","jp":"クライアントとの電話対応が上手くなってきています。","scene":"職場","alts":["I am improving at handling client calls."]},{"id":"P09_04","en":"I'm getting excited about our trip to Singapore.","tpl":"[[I'm getting]] excited about our trip to Singapore.","jp":"シンガポール旅行がだんだん楽しみになってきました。","scene":"海外出張","alts":["I am becoming excited for our Singapore trip."]},{"id":"P09_05","en":"I'm getting tired of sitting in traffic every morning.","tpl":"[[I'm getting]] tired of sitting in traffic every morning.","jp":"毎朝渋滞にはまるのにうんざりしてきています。","scene":"日常","alts":["I am growing tired of morning traffic."]},{"id":"P09_06","en":"I'm getting ready for the afternoon presentation.","tpl":"[[I'm getting]] ready for the afternoon presentation.","jp":"午後のプレゼンの準備を進めています。","scene":"会議","alts":["I am preparing for the afternoon presentation."]},{"id":"P09_07","en":"I'm getting confused by all these different versions.","tpl":"[[I'm getting]] confused by all these different versions.","jp":"バージョンが多すぎて混乱してきています。","scene":"職場","alts":["All these versions are confusing me."]},{"id":"P09_08","en":"I'm getting sleepy, so I should head to bed.","tpl":"[[I'm getting]] sleepy, so I should head to bed.","jp":"眠くなってきたので、もう寝ます。","scene":"日常","alts":["I am starting to feel sleepy."]},{"id":"P09_09","en":"I'm getting cold—could we close the window?","tpl":"[[I'm getting]] cold—could we close the window?","jp":"寒くなってきました。窓を閉めてもいいですか？","scene":"レストラン","alts":["I am starting to feel cold; can we close the window?"]},{"id":"P09_10","en":"I'm getting nervous as the deadline approaches.","tpl":"[[I'm getting]] nervous as the deadline approaches.","jp":"締め切りが近づくにつれて緊張してきています。","scene":"職場","alts":["I am becoming nervous as the deadline gets closer."]},{"id":"P09_11","en":"I'm getting much faster at typing in English.","tpl":"[[I'm getting]] much faster at typing in English.","jp":"英語のタイピングがずいぶん速くなってきています。","scene":"職場","alts":["My English typing is getting much faster."]},{"id":"P09_12","en":"I'm getting a bit overwhelmed with all the emails.","tpl":"[[I'm getting]] a bit overwhelmed with all the emails.","jp":"メールが多すぎて少し圧倒されてきています。","scene":"職場","alts":["I am starting to feel overwhelmed by emails."]},{"id":"P09_13","en":"I'm getting lost in this huge shopping mall.","tpl":"[[I'm getting]] lost in this huge shopping mall.","jp":"この巨大なショッピングモールで迷いそうです。","scene":"買い物","alts":["I am starting to get lost in this mall."]},{"id":"P09_14","en":"I'm getting comfortable with the new software.","tpl":"[[I'm getting]] comfortable with the new software.","jp":"新しいソフトの操作に慣れてきています。","scene":"職場","alts":["I am growing comfortable with the new software."]},{"id":"P09_15","en":"I'm getting dressed and will be down in five minutes.","tpl":"[[I'm getting]] dressed and will be down in five minutes.","jp":"今着替えているので、5分で下に降ります。","scene":"ホテル","alts":["I am getting dressed and will be right down."]},{"id":"P09_16","en":"I'm getting a slight headache from staring at screens.","tpl":"[[I'm getting]] a slight headache from staring at screens.","jp":"画面を見続けて少し頭が痛くなってきました。","scene":"日常","alts":["I am starting to get a headache from the screen."]},{"id":"P09_17","en":"I'm getting impatient waiting for the luggage.","tpl":"[[I'm getting]] impatient waiting for the luggage.","jp":"荷物を待つのがだんだんじれったくなってきました。","scene":"旅行","alts":["I am growing impatient waiting for my bags."]},{"id":"P09_18","en":"I'm getting more confident in English meetings.","tpl":"[[I'm getting]] more confident in English meetings.","jp":"英語の会議でだんだん自信がついてきています。","scene":"会議","alts":["My confidence in English meetings is growing."]},{"id":"P09_19","en":"I'm getting full, so let's skip dessert.","tpl":"[[I'm getting]] full, so let's skip dessert.","jp":"お腹がいっぱいになってきたのでデザートはパスしましょう。","scene":"レストラン","alts":["I am feeling full, so let's pass on dessert."]},{"id":"P09_20","en":"I'm getting ready to check out of the hotel.","tpl":"[[I'm getting]] ready to check out of the hotel.","jp":"ホテルのチェックアウトの準備をしています。","scene":"ホテル","alts":["I am preparing to check out."]}]},{"id":"P10","catId":"cat1","pattern":"It takes me ... to ...","meaning":"（私が）〜するのに…かかります","grammar":"It takes + 人 + 時間 + to + 動詞の原形 で、ある行動にかかる所要時間を表します。","usage":"通勤時間、移動時間、作業の見積もり、準備時間などを具体的に伝えるときに欠かせません。","nuance":"主語を人（I）にせず、形式主語 It を使うのが英語らしい自然な言い方です。me を省いて一般的な所要時間にもできます。","similar":"I spend + 時間 + -ing（時間を費やす）／ It'll take about ...（およそ〜かかるだろう）","pitfall":"× I take 30 minutes to go to work は不自然です。必ず It takes me 30 minutes to ... と It を主語にしましょう。","dialogue":[{"speaker":"A","en":"How's the commute from your new apartment?","jp":"新しいアパートからの通勤はどうですか？"},{"speaker":"B","en":"It takes me about forty minutes to get to the office door-to-door.","jp":"ドアツードアでオフィスまで40分ほどかかります。"},{"speaker":"A","en":"That's not bad at all! Do you have to transfer?","jp":"全然悪くないですね！乗り換えはありますか？"},{"speaker":"B","en":"Nope, just one direct train, so I can read on the way.","jp":"いいえ、直通1本なので途中で読書できますよ。"}],"drills":{"subject":{"en":"It takes her only ten minutes to walk to the station.","jp":"彼女が駅まで歩くのに10分しかかかりません。"},"tense":{"en":"It took me two hours to finish the monthly report.","jp":"月次レポートを仕上げるのに2時間かかりました。"},"negative":{"en":"It doesn't take me long to pack for a weekend trip.","jp":"週末旅行の荷造りにはそれほど時間はかかりません。"},"question":{"en":"How long does it take you to get to the airport?","jp":"空港まで行くのにどのくらいかかりますか？"}},"examples":[{"id":"P10_01","en":"It takes me about an hour to commute to work.","tpl":"[[It takes me]] about an hour [[to]] commute to work.","jp":"職場まで通勤するのに約1時間かかります。","scene":"職場","alts":["My commute to work takes about an hour."]},{"id":"P10_02","en":"It takes me ten minutes to walk to the station.","tpl":"[[It takes me]] ten minutes [[to]] walk to the station.","jp":"駅まで歩くのに10分かかります。","scene":"日常","alts":["It is a ten-minute walk to the station for me."]},{"id":"P10_03","en":"It takes me twenty minutes to get ready in the morning.","tpl":"[[It takes me]] twenty minutes [[to]] get ready in the morning.","jp":"朝の支度に20分かかります。","scene":"日常","alts":["I need twenty minutes to get ready in the morning."]},{"id":"P10_04","en":"It takes me a few days to recover from jet lag.","tpl":"[[It takes me]] a few days [[to]] recover from jet lag.","jp":"時差ボケから回復するのに数日かかります。","scene":"海外出張","alts":["I need a few days to get over jet lag."]},{"id":"P10_05","en":"It takes me half an hour to prepare for a meeting.","tpl":"[[It takes me]] half an hour [[to]] prepare for a meeting.","jp":"会議の準備に30分かかります。","scene":"会議","alts":["Preparing for a meeting takes me thirty minutes."]},{"id":"P10_06","en":"It takes me about fifteen minutes to cook pasta.","tpl":"[[It takes me]] about fifteen minutes [[to]] cook pasta.","jp":"パスタを作るのに約15分かかります。","scene":"日常","alts":["Cooking pasta takes me about fifteen minutes."]},{"id":"P10_07","en":"It takes me a while to fall asleep in a new hotel.","tpl":"[[It takes me]] a while [[to]] fall asleep in a new hotel.","jp":"初めてのホテルでは寝付くのに少し時間がかかります。","scene":"ホテル","alts":["I take a while to fall asleep at a new hotel."]},{"id":"P10_08","en":"It takes me two hours to review the weekly data.","tpl":"[[It takes me]] two hours [[to]] review the weekly data.","jp":"週次データを確認するのに2時間かかります。","scene":"職場","alts":["Reviewing the weekly data takes me two hours."]},{"id":"P10_09","en":"It takes me five minutes to reach the nearest convenience store.","tpl":"[[It takes me]] five minutes [[to]] reach the nearest convenience store.","jp":"最寄りのコンビニまで行くのに5分かかります。","scene":"日常","alts":["The nearest convenience store is five minutes away."]},{"id":"P10_10","en":"It takes me a long time to choose a gift.","tpl":"[[It takes me]] a long time [[to]] choose a gift.","jp":"プレゼントを選ぶのに長い時間がかかります。","scene":"買い物","alts":["I take forever to pick out a gift."]},{"id":"P10_11","en":"It takes me about forty minutes to get to Haneda Airport.","tpl":"[[It takes me]] about forty minutes [[to]] get to Haneda Airport.","jp":"羽田空港まで行くのに約40分かかります。","scene":"旅行","alts":["Getting to Haneda Airport takes me about forty minutes."]},{"id":"P10_12","en":"It takes me only a few seconds to check the schedule.","tpl":"[[It takes me]] only a few seconds [[to]] check the schedule.","jp":"スケジュールを確認するのに数秒しかかかりません。","scene":"職場","alts":["Checking the schedule takes me just a few seconds."]},{"id":"P10_13","en":"It takes me an hour to draft a detailed email in English.","tpl":"[[It takes me]] an hour [[to]] draft a detailed email in English.","jp":"英語で詳しいメールを書くのに1時間かかります。","scene":"職場","alts":["Drafting a detailed English email takes me an hour."]},{"id":"P10_14","en":"It takes me fifteen minutes to drive to the supermarket.","tpl":"[[It takes me]] fifteen minutes [[to]] drive to the supermarket.","jp":"スーパーまで車で15分かかります。","scene":"買い物","alts":["Driving to the supermarket takes me fifteen minutes."]},{"id":"P10_15","en":"It takes me a few tries to pronounce that word clearly.","tpl":"[[It takes me]] a few tries [[to]] pronounce that word clearly.","jp":"その単語をはっきり発音するのに数回かかります。","scene":"日常","alts":["I need a few tries to say that word clearly."]},{"id":"P10_16","en":"It takes me thirty minutes to jog around the park.","tpl":"[[It takes me]] thirty minutes [[to]] jog around the park.","jp":"公園の周りをジョギングするのに30分かかります。","scene":"日常","alts":["Jogging around the park takes me thirty minutes."]},{"id":"P10_17","en":"It takes me a couple of hours to pack for overseas trips.","tpl":"[[It takes me]] a couple of hours [[to]] pack for overseas trips.","jp":"海外出張の荷造りに2〜3時間かかります。","scene":"海外出張","alts":["Packing for overseas trips takes me a couple of hours."]},{"id":"P10_18","en":"It takes me ten minutes to skim the morning news.","tpl":"[[It takes me]] ten minutes [[to]] skim the morning news.","jp":"朝のニュースにざっと目を通すのに10分かかります。","scene":"日常","alts":["Skimming the morning news takes me ten minutes."]},{"id":"P10_19","en":"It takes me at least a week to memorize a new routine.","tpl":"[[It takes me]] at least a week [[to]] memorize a new routine.","jp":"新しい手順を覚えるのに少なくとも1週間はかかります。","scene":"職場","alts":["Learning a new routine takes me at least a week."]},{"id":"P10_20","en":"It takes me five minutes to walk from the hotel to the venue.","tpl":"[[It takes me]] five minutes [[to]] walk from the hotel to the venue.","jp":"ホテルから会場まで歩いて5分かかります。","scene":"海外出張","alts":["It is a five-minute walk from the hotel to the venue."]}]},{"id":"P11","catId":"cat2","pattern":"I want to ...","meaning":"〜したいです","grammar":"I want to + 動詞の原形 で、自分の願望ややりたいことを率直に表します。","usage":"友人との会話、目標の共有、日常の希望、自分の意思を明確に伝える場面で使います。","nuance":"素直で直接的な表現。カジュアルな場面では wanna と発音されることも多いですが、丁寧な依頼には I'd like to を使います。","similar":"I'd like to ...（より丁寧）／ I feel like -ing（なんとなく〜したい気分）","pitfall":"レストランやホテルで店員に注文するとき I want to ... と言うと少しぶっきらぼうに聞こえるため、I'd like to ... を使い分けましょう。","dialogue":[{"speaker":"A","en":"What's your main goal for learning English this year?","jp":"今年の英語学習の一番の目標は何ですか？"},{"speaker":"B","en":"I want to speak English smoothly in meetings without translating in my head.","jp":"頭の中で翻訳せずに、会議でスムーズに英語を話したいです。"},{"speaker":"A","en":"That's a great goal. Practicing core patterns every day really helps.","jp":"素晴らしい目標ですね。基本構文を毎日練習すると本当に効果がありますよ。"},{"speaker":"B","en":"I want to build a ten-minute daily habit starting today.","jp":"今日から毎日10分の習慣を作りたいです。"}],"drills":{"subject":{"en":"She wants to visit Kyoto next spring.","jp":"彼女は来年の春に京都を訪れたいと思っています。"},"tense":{"en":"I wanted to ask you a quick question earlier.","jp":"さっきちょっと質問したかったんです。"},"negative":{"en":"I don't want to miss the last train tonight.","jp":"今夜は終電を逃したくありません。"},"question":{"en":"Do you want to grab coffee after the meeting?","jp":"会議のあとでコーヒーでも飲みませんか？"}},"examples":[{"id":"P11_01","en":"I want to speak English more naturally.","tpl":"[[I want to]] speak English more naturally.","jp":"もっと自然に英語を話したいです。","scene":"日常","alts":["I would like to speak English more naturally."]},{"id":"P11_02","en":"I want to go home and get some rest.","tpl":"[[I want to]] go home and get some rest.","jp":"家に帰って少し休みたいです。","scene":"日常","alts":["I want to head home and rest."]},{"id":"P11_03","en":"I want to check the schedule before deciding.","tpl":"[[I want to]] check the schedule before deciding.","jp":"決める前にスケジュールを確認したいです。","scene":"職場","alts":["Let me check the schedule before deciding."]},{"id":"P11_04","en":"I want to improve my presentation skills.","tpl":"[[I want to]] improve my presentation skills.","jp":"プレゼンスキルを伸ばしたいです。","scene":"職場","alts":["I want to get better at presentations."]},{"id":"P11_05","en":"I want to ask you a quick question.","tpl":"[[I want to]] ask you a quick question.","jp":"ちょっと質問したいことがあります。","scene":"会議","alts":["I have a quick question to ask you."]},{"id":"P11_06","en":"I want to visit New York someday.","tpl":"[[I want to]] visit New York someday.","jp":"いつかニューヨークに行ってみたいです。","scene":"旅行","alts":["I hope to visit New York someday."]},{"id":"P11_07","en":"I want to try that new ramen shop downtown.","tpl":"[[I want to]] try that new ramen shop downtown.","jp":"街の中心部にある新しいラーメン屋に行ってみたいです。","scene":"レストラン","alts":["I want to check out that new ramen place."]},{"id":"P11_08","en":"I want to save money for a new laptop.","tpl":"[[I want to]] save money for a new laptop.","jp":"新しいノートパソコンを買うためにお金を貯めたいです。","scene":"買い物","alts":["I am saving up for a new laptop."]},{"id":"P11_09","en":"I want to finish this report by five.","tpl":"[[I want to]] finish this report by five.","jp":"このレポートを5時までに終わらせたいです。","scene":"職場","alts":["I aim to finish this report by five."]},{"id":"P11_10","en":"I want to learn how to cook authentic Thai food.","tpl":"[[I want to]] learn how to cook authentic Thai food.","jp":"本格的なタイ料理の作り方を学びたいです。","scene":"日常","alts":["I want to learn to make real Thai food."]},{"id":"P11_11","en":"I want to spend more time with my family.","tpl":"[[I want to]] spend more time with my family.","jp":"家族ともっと時間を過ごしたいです。","scene":"日常","alts":["I want to have more time with my family."]},{"id":"P11_12","en":"I want to confirm the flight details tonight.","tpl":"[[I want to]] confirm the flight details tonight.","jp":"今夜フライトの詳細を確認したいです。","scene":"海外出張","alts":["I want to double-check the flight details tonight."]},{"id":"P11_13","en":"I want to make sure we are on the same page.","tpl":"[[I want to]] make sure we are on the same page.","jp":"認識が合っているか確認したいです。","scene":"会議","alts":["I want to be sure we agree on the details."]},{"id":"P11_14","en":"I want to buy a souvenir for my coworkers.","tpl":"[[I want to]] buy a souvenir for my coworkers.","jp":"同僚にお土産を買いたいです。","scene":"買い物","alts":["I want to get a souvenir for my colleagues."]},{"id":"P11_15","en":"I want to take a hot shower as soon as we arrive.","tpl":"[[I want to]] take a hot shower as soon as we arrive.","jp":"着いたらすぐに熱いシャワーを浴びたいです。","scene":"ホテル","alts":["I want to shower right after we get there."]},{"id":"P11_16","en":"I want to catch up with you over dinner soon.","tpl":"[[I want to]] catch up with you over dinner soon.","jp":"近いうちに夕食でもしながら近況を話したいです。","scene":"友人","alts":["Let's catch up over dinner soon."]},{"id":"P11_17","en":"I want to hear your honest opinion on this.","tpl":"[[I want to]] hear your honest opinion on this.","jp":"これについてあなたの率直な意見を聞きたいです。","scene":"会議","alts":["I want to know what you honestly think."]},{"id":"P11_18","en":"I want to explore the old town on foot.","tpl":"[[I want to]] explore the old town on foot.","jp":"旧市街を歩いて探索したいです。","scene":"旅行","alts":["I want to walk around the old town."]},{"id":"P11_19","en":"I want to thank everyone for joining today.","tpl":"[[I want to]] thank everyone for joining today.","jp":"本日参加してくださった皆さんにお礼を言いたいです。","scene":"会議","alts":["I would like to thank everyone for coming today."]},{"id":"P11_20","en":"I want to change my seat to a quieter area.","tpl":"[[I want to]] change my seat to a quieter area.","jp":"もっと静かなエリアの席に変えたいです。","scene":"レストラン","alts":["Can I move to a quieter seat?"]}]},{"id":"P12","catId":"cat2","pattern":"I'd like to ...","meaning":"〜したいのですが／〜をお願いします","grammar":"I would like to の短縮形 + 動詞の原形 で、希望や依頼を丁寧に表現します。","usage":"ビジネス会議、ホテルのチェックイン、レストランでの注文、空港や店舗での丁寧な要望など、大人の英会話で最頻出です。","nuance":"I want to の丁寧版。丁寧さと自然さのバランスが最も良く、初対面の相手にも安心して使えます。","similar":"I want to ...（率直・カジュアル）／ I'd love to ...（ぜひ〜したい・強い喜び）","pitfall":"to の後ろは必ず動詞の原形。名詞を直接続ける場合は to を外して I'd like a coffee. にします。","dialogue":[{"speaker":"A","en":"Good evening. Welcome to the Grand Harbor Hotel. How may I help you?","jp":"こんばんは。グランドハーバーホテルへようこそ。ご用件を伺います。"},{"speaker":"B","en":"Hi, I'd like to check in. My reservation is under Sato.","jp":"こんにちは、チェックインをお願いします。佐藤で予約しています。"},{"speaker":"A","en":"Let me pull that up for you. Yes, three nights in a king room.","jp":"お調べいたします。はい、キングルームで3泊ですね。"},{"speaker":"B","en":"Also, I'd like to request a late checkout on Friday if possible.","jp":"それと、可能であれば金曜日にレイトチェックアウトをお願いしたいのですが。"}],"drills":{"subject":{"en":"Our director would like to review the slides first.","jp":"ディレクターがまずスライドを確認したいそうです。"},"tense":{"en":"I would have liked to join, but I had another meeting.","jp":"参加したかったのですが、別の会議がありました。"},"negative":{"en":"I wouldn't like to rush this important decision.","jp":"この重要な決定を急ぎたくはありません。"},"question":{"en":"Would you like to see the dessert menu?","jp":"デザートメニューをご覧になりますか？"}},"examples":[{"id":"P12_01","en":"I'd like to check in, please.","tpl":"[[I'd like to]] check in, please.","jp":"チェックインをお願いします。","scene":"ホテル","alts":["I would like to check in, please."]},{"id":"P12_02","en":"I'd like to make a reservation for two at seven.","tpl":"[[I'd like to]] make a reservation for two at seven.","jp":"7時に2名で予約をお願いしたいのですが。","scene":"レストラン","alts":["I would like to book a table for two at seven."]},{"id":"P12_03","en":"I'd like to share a quick update on our progress.","tpl":"[[I'd like to]] share a quick update on our progress.","jp":"進捗について簡単に共有したいと思います。","scene":"会議","alts":["I would like to give a brief progress update."]},{"id":"P12_04","en":"I'd like to try this jacket on in a larger size.","tpl":"[[I'd like to]] try this jacket on in a larger size.","jp":"このジャケットのワンサイズ大きいものを試着したいです。","scene":"買い物","alts":["Can I try this jacket in a bigger size?"]},{"id":"P12_05","en":"I'd like to confirm my return flight to Tokyo.","tpl":"[[I'd like to]] confirm my return flight to Tokyo.","jp":"東京行きの帰国便を確認したいのですが。","scene":"海外出張","alts":["I would like to check my return flight to Tokyo."]},{"id":"P12_06","en":"I'd like to introduce my colleague, Kenji.","tpl":"[[I'd like to]] introduce my colleague, Kenji.","jp":"同僚の健二をご紹介いたします。","scene":"自己紹介","alts":["Let me introduce my colleague, Kenji."]},{"id":"P12_07","en":"I'd like to order the grilled salmon with rice.","tpl":"[[I'd like to]] order the grilled salmon with rice.","jp":"サーモンのグリルとライスをお願いします。","scene":"レストラン","alts":["Can I have the grilled salmon with rice?"]},{"id":"P12_08","en":"I'd like to schedule a follow-up meeting next week.","tpl":"[[I'd like to]] schedule a follow-up meeting next week.","jp":"来週、フォローアップ会議を設定したいです。","scene":"会議","alts":["Let's schedule a follow-up meeting next week."]},{"id":"P12_09","en":"I'd like to leave my luggage here until three.","tpl":"[[I'd like to]] leave my luggage here until three.","jp":"3時まで荷物をここに預けたいのですが。","scene":"ホテル","alts":["Could I store my luggage here until three?"]},{"id":"P12_10","en":"I'd like to exchange these yen for US dollars.","tpl":"[[I'd like to]] exchange these yen for US dollars.","jp":"この日本円をアメリカドルに両替したいです。","scene":"旅行","alts":["I want to exchange yen into dollars."]},{"id":"P12_11","en":"I'd like to thank you for your prompt response.","tpl":"[[I'd like to]] thank you for your prompt response.","jp":"迅速なご返信ありがとうございます。","scene":"職場","alts":["Thank you for getting back to me so quickly."]},{"id":"P12_12","en":"I'd like to pay separately if that's okay.","tpl":"[[I'd like to]] pay separately if that's okay.","jp":"よろしければ別々 文の一つ！この to は前置詞なので、後ろは必ず -ing 形にします（× look forward to see you → ○ look forward to seeing you）。","dialogue":[{"speaker":"A","en":"Thanks for setting up the visit next week.","jp":"来週の訪問をセッティングしてくれてありがとう。"},{"speaker":"B","en":"My pleasure! I'm looking forward to showing you around our office.","jp":"どういたしまして！オフィスをご案内するのを楽しみにしています。"},{"speaker":"A","en":"And I'm looking forward to trying the ramen place you recommended.","jp":"それと、おすすめしてくれたラーメン屋に行くのも楽しみだよ。"},{"speaker":"B","en":"You're going to love it. Safe travels until then!","jp":"きっと気に入りますよ。それまでお気をつけてお越しください！"}],"drills":{"subject":{"en":"Everyone on the team is looking forward to the launch.","jp":"チームの全員がローンチを楽しみにしています。"},"tense":{"en":"I was looking forward to seeing you at the conference.","jp":"カンファレンスでお会いできるのを楽しみにしていました。"},"negative":{"en":"I'm not looking forward to the long flight back.","jp":"帰りの長いフライトはあまり楽しみではありません。"},"question":{"en":"What are you looking forward to most in Tokyo?","jp":"東京で一番楽しみにしていることは何ですか？"}},"examples":[{"id":"P16_01","en":"I'm looking forward to meeting you in person next week.","tpl":"[[I'm looking forward to]] meeting you in person next week.","jp":"来週直接お会いできるのを楽しみにしています。","scene":"海外出張","alts":["I look forward to meeting you next week."]},{"id":"P16_02","en":"I'm looking forward to hearing your feedback.","tpl":"[[I'm looking forward to]] hearing your feedback.","jp":"フィードバックをいただくのを楽しみにしています。","scene":"職場","alts":["I look forward to your feedback."]},{"id":"P16_03","en":"I'm looking forward to the weekend.","tpl":"[[I'm looking forward to]] the weekend.","jp":"週末を楽しみにしています。","scene":"日常","alts":["I can't wait for the weekend."]},{"id":"P16_04","en":"I'm looking forward to working with you on this project.","tpl":"[[I'm looking forward to]] working with you on this project.","jp":"このプロジェクトでご一緒できるのを楽しみにしています。","scene":"会議","alts":["I look forward to working with you."]},{"id":"P16_05","en":"I'm looking forward to trying the hotel breakfast.","tpl":"[[I'm looking forward to]] trying the hotel breakfast.","jp":"ホテルの朝食を楽しみにしています。","scene":"ホテル","alts":["I am excited for the hotel breakfast."]},{"id":"P16_06","en":"I'm looking forward to seeing my family over the holidays.","tpl":"[[I'm looking forward to]] seeing my family over the holidays.","jp":"休暇中に家族に会うのを楽しみにしています。","scene":"日常","alts":["I can't wait to see my family during the holidays."]},{"id":"P16_07","en":"I'm looking forward to our dinner on Friday.","tpl":"[[I'm looking forward to]] our dinner on Friday.","jp":"金曜日の夕食を楽しみにしています。","scene":"友人","alts":["I am excited about dinner on Friday."]},{"id":"P16_08","en":"I'm looking forward to visiting the art museum tomorrow.","tpl":"[[I'm looking forward to]] visiting the art museum tomorrow.","jp":"明日、美術館を訪れるのを楽しみにしています。","scene":"旅行","alts":["I am excited to visit the art museum tomorrow."]},{"id":"P16_09","en":"I'm looking forward to reading your final report.","tpl":"[[I'm looking forward to]] reading your final report.","jp":"最終レポートを読むのを楽しみにしています。","scene":"職場","alts":["I look forward to reading the final report."]},{"id":"P16_10","en":"I'm looking forward to relaxing at the hot spring.","tpl":"[[I'm looking forward to]] relaxing at the hot spring.","jp":"温泉でのんびりするのを楽しみにしています。","scene":"旅行","alts":["I can't wait to relax at the hot spring."]},{"id":"P16_11","en":"I'm looking forward to learning new skills in this workshop.","tpl":"[[I'm looking forward to]] learning new skills in this workshop.","jp":"このワークショップで新しいスキルを学ぶのを楽しみにしています。","scene":"職場","alts":["I am excited to learn new skills here."]},{"id":"P16_12","en":"I'm looking forward to catching up with you soon.","tpl":"[[I'm looking forward to]] catching up with you soon.","jp":"近いうちにまたお話しできるのを楽しみにしています。","scene":"友人","alts":["I look forward to catching up soon."]},{"id":"P16_13","en":"I'm looking forward to the spring cherry blossoms.","tpl":"[[I'm looking forward to]] the spring cherry blossoms.","jp":"春の桜を楽しみにしています。","scene":"日常","alts":["I can't wait for cherry blossom season
