","en":"I'm able to save time by preparing meals on Sunday.","tpl":"[[I'm able to]] save time by preparing meals on Sunday.","jp":"日曜に作り置きをすることで時間を節約できています。","scene":"日常","alts":["Meal prepping on Sunday saves me time."]},{"id":"P59_17","en":"I'm able to compare options quickly on my phone.","tpl":"[[I'm able to]] compare options quickly on my phone.","jp":"スマホで素早く選択肢を比較できます。","scene":"買い物","alts":["I can compare choices easily on my phone."]},{"id":"P59_18","en":"I'm able to focus better in a quiet room.","tpl":"[[I'm able to]] focus better in a quiet room.","jp":"静かな部屋の方が集中できます。","scene":"職場","alts":["I concentrate better in quiet spaces."]},{"id":"P59_19","en":"I'm able to meet you near the south exit at six.","tpl":"[[I'm able to]] meet you near the south exit at six.","jp":"6時に南口の近くでお会いできます。","scene":"友人","alts":["I can meet you by the south exit at six."]},{"id":"P59_20","en":"I'm able to answer any follow-up questions by email.","tpl":"[[I'm able to]] answer any follow-up questions by email.","jp":"追加のご質問にはメールでお答えできます。","scene":"会議","alts":["Feel free to email me any follow-up questions."]}]},{"id":"P60","catId":"cat6","pattern":"It's important to ...","meaning":"〜することが大切です","grammar":"It's important (for 人) to + 動詞の原形 で、原則・コツ・大事な視点を説得力をもって述べます。","usage":"プレゼン、会議でのまとめ、アドバイス、学習法や健康管理の話題など、意見を論理的に引き締めるときに使います。","nuance":"You should ... より客観的で普遍的な響きがあり、相手を責めずに大切なポイントを共有できます。","similar":"It's essential to ...（不可欠だ）／ It's crucial to ...（決定的に重要だ）","pitfall":"× To practice daily is important. も文法的には合っていますが、形式主語 It を先頭に置く It's important to ... の方が圧倒的に自然です。","dialogue":[{"speaker":"A","en":"What's your best tip for running smooth international meetings?","jp":"国際会議をスムーズに進める一番のコツは何ですか？"},{"speaker":"B","en":"It's important to share the agenda twenty-four hours in advance.","jp":"24時間前に議題を共有しておくことが大切です。"},{"speaker":"A","en":"That makes total sense, especially for non-native speakers.","jp":"本当にそうですね、特に非ネイティブにとっては助かります。"},{"speaker":"B","en":"Yes! And it's important to recap the action items at the end.","jp":"はい！それに最後にアクションアイテムを振り返ることも大切です。"}],"drills":{"subject":{"en":"It's important for everyone to feel comfortable asking questions.","jp":"全員が気軽に質問できると感じることが大切です。"},"tense":{"en":"It was important to clarify the budget before starting.","jp":"始める前に予算を明確にしておくことが重要でした。"},"negative":{"en":"It's important not to rush through the safety briefing.","jp":"安全説明を急いで飛ばさないことが大切です。"},"question":{"en":"Why is it important to practice speaking out loud?","jp":"声に出して話す練習をすることがなぜ大切なのですか？"}},"examples":[{"id":"P60_01","en":"It's important to practice a little every day.","tpl":"[[It's important to]] practice a little every day.","jp":"毎日少しずつ練習することが大切です。","scene":"日常","alts":["Daily practice is important."]},{"id":"P60_02","en":"It's important to listen carefully to customer feedback.","tpl":"[[It's important to]] listen carefully to customer feedback.","jp":"お客様の声にしっかり耳を傾けることが大切です。","scene":"職場","alts":["Listening closely to customers matters."]},{"id":"P60_03","en":"It's important to confirm the schedule in writing.","tpl":"[[It's important to]] confirm the schedule in writing.","jp":"スケジュールを書面で確認しておくことが大切です。","scene":"会議","alts":["Always confirm schedules in writing."]},{"id":"P60_04","en":"It's important to stay hydrated on long flights.","tpl":"[[It's important to]] stay hydrated on long flights.","jp":"長距離フライトでは水分補給を保つことが大切です。","scene":"海外出張","alts":["Drinking enough water on flights is important."]},{"id":"P60_05","en":"It's important to keep your passport safe while traveling.","tpl":"[[It's important to]] keep your passport safe while traveling.","jp":"旅行中はパスポートを安全に管理することが大切です。","scene":"旅行","alts":["Protecting your passport matters while abroad."]},{"id":"P60_06","en":"It's important to set clear expectations early.","tpl":"[[It's important to]] set clear expectations early.","jp":"早い段階で明確な期待値を設定することが大切です。","scene":"職場","alts":["Setting clear expectations early helps."]},{"id":"P60_07","en":"It's important to get enough sleep before a big presentation.","tpl":"[[It's important to]] get enough sleep before a big presentation.","jp":"大きなプレゼンの前は十分睡眠をとることが大切です。","scene":"会議","alts":["Rest well before a major presentation."]},{"id":"P60_08","en":"It's important to compare quality, not just price.","tpl":"[[It's important to]] compare quality, not just price.","jp":"価格だけでなく品質を比較することが大切です。","scene":"買い物","alts":["Look at quality, not only price."]},{"id":"P60_09","en":"It's important to respect local customs when visiting abroad.","tpl":"[[It's important to]] respect local customs when visiting abroad.","jp":"海外を訪れるときは現地の習慣を尊重することが大切です。","scene":"旅行","alts":["Respecting local culture is important."]},{"id":"P60_10","en":"It's important to speak clearly rather than quickly.","tpl":"[[It's important to]] speak clearly rather than quickly.","jp":"速く話すことより、はっきり話すことが大切です。","scene":"日常","alts":["Clarity matters more than speed."]},{"id":"P60_11","en":"It's important to check your hotel reservation before flying.","tpl":"[[It's important to]] check your hotel reservation before flying.","jp":"出発前にホテルの予約を確認しておくことが大切です。","scene":"ホテル","alts":["Verify your hotel booking before departure."]},{"id":"P60_12","en":"It's important to take breaks so you don't burn out.","tpl":"[[It's important to]] take breaks so you don't burn out.","jp":"燃え尽きないように休憩を取ることが大切です。","scene":"職場","alts":["Taking breaks prevents burnout."]},{"id":"P60_13","en":"It's important to double-check allergies before ordering.","tpl":"[[It's important to]] double-check allergies before ordering.","jp":"注文前にアレルギーを再確認することが大切です。","scene":"レストラン","alts":["Always check allergies before ordering."]},{"id":"P60_14","en":"It's important to keep an open mind in discussions.","tpl":"[[It's important to]] keep an open mind in discussions.","jp":"議論では柔軟な心を持つことが大切です。","scene":"会議","alts":["Staying open-minded helps discussions."]},{"id":"P60_15","en":"It's important to back up important documents regularly.","tpl":"[[It's important to]] back up important documents regularly.","jp":"重要な書類は定期的にバックアップすることが大切です。","scene":"職場","alts":["Regular backups are essential."]},{"id":"P60_16","en":"It's important to build trust with overseas partners.","tpl":"[[It's important to]] build trust with overseas partners.","jp":"海外パートナーとの信頼関係を築くことが大切です。","scene":"海外出張","alts":["Trust is key with overseas partners."]},{"id":"P60_17","en":"It's important to read reviews before booking a hotel.","tpl":"[[It's important to]] read reviews before booking a hotel.","jp":"ホテルを予約する前にレビューを読むことが大切です。","scene":"ホテル","alts":["Check reviews before booking."]},{"id":"P60_18","en":"It's important to stay calm when unexpected issues happen.","tpl":"[[It's important to]] stay calm when unexpected issues happen.","jp":"予期せぬ問題が起きたときは冷静でいることが大切です。","scene":"職場","alts":["Keeping calm during surprises helps."]},{"id":"P60_19","en":"It's important to balance work and personal time.","tpl":"[[It's important to]] balance work and personal time.","jp":"仕事とプライベートのバランスを取ることが大切です。","scene":"日常","alts":["Work-life balance really matters."]},{"id":"P60_20","en":"It's important to thank people for their time.","tpl":"[[It's important to]] thank people for their time.","jp":"相手の時間に対して感謝を伝えることが大切です。","scene":"友人","alts":["Always appreciate people's time."]}]},{"id":"P61","catId":"cat7","pattern":"I used to ...","meaning":"以前は〜していました（今はしていない）","grammar":"I used to + 動詞の原形 で、過去には習慣的にしていた・そうだったが今は違うことを表します。","usage":"自己紹介、昔の仕事や住まい、生活習慣の変化、昔話で盛り上がる場面に最適です。","nuance":"「昔はそうだったけど今は違う」という対比のニュアンスが1フレーズで自然に伝わります。","similar":"I would often ...（過去の反復行動・状態動詞には不可）／ I'm used to -ing（〜に慣れている・P69）","pitfall":"P69 の I'm used to -ing（〜に慣れている）と混同厳禁！be動詞なしの I used to + 原形 が「以前は〜していた」です。","dialogue":[{"speaker":"A","en":"You know this neighborhood really well!","jp":"この辺りのこと、すごく詳しいんですね！"},{"speaker":"B","en":"Yeah, I used to live just two blocks from this station.","jp":"ええ、以前はこの駅からたった2ブロックのところに住んでいたんです。"},{"speaker":"A","en":"Oh, nice! Has it changed much since then?","jp":"へえ、いいですね！その頃からだいぶ変わりましたか？"},{"speaker":"B","en":"A lot! There used to be a tiny bookstore right where that café is.","jp":"かなり変わりましたよ！あのカフェの場所には昔、小さな本屋があったんです。"}],"drills":{"subject":{"en":"She used to work at a design agency in Tokyo.","jp":"彼女は以前、東京のデザイン会社で働いていました。"},"tense":{"en":"We used to have in-person meetings every Monday.","jp":"以前は毎週月曜日に対面で会議をしていました。"},"negative":{"en":"I didn't use to drink black coffee, but now I love it.","jp":"以前はブラックコーヒーを飲みませんでしたが、今は大好きです。"},"question":{"en":"Did you use to play any sports in school?","jp":"学生時代は何かスポーツをしていましたか？"}},"examples":[{"id":"P61_01","en":"I used to live in Osaka before moving here.","tpl":"[[I used to]] live in Osaka before moving here.","jp":"こちらに引っ越す前は大阪に住んでいました。","scene":"自己紹介","alts":["I lived in Osaka before moving here."]},{"id":"P61_02","en":"I used to work in the sales department.","tpl":"[[I used to]] work in the sales department.","jp":"以前は営業部で働いていました。","scene":"職場","alts":["I previously worked in sales."]},{"id":"P61_03","en":"I used to commute ninety minutes each way.","tpl":"[[I used to]] commute ninety minutes each way.","jp":"以前は片道90分かけて通勤していました。","scene":"職場","alts":["My old commute was ninety minutes each way."]},{"id":"P61_04","en":"I used to get nervous speaking English on the phone.","tpl":"[[I used to]] get nervous speaking English on the phone.","jp":"以前は電話で英語を話すのに緊張していました。","scene":"日常","alts":["Phone calls in English used to make me nervous."]},{"id":"P61_05","en":"I used to travel abroad twice a year.","tpl":"[[I used to]] travel abroad twice a year.","jp":"以前は年に2回海外旅行をしていました。","scene":"旅行","alts":["I traveled overseas twice a year back then."]},{"id":"P61_06","en":"I used to drink three cups of coffee a day.","tpl":"[[I used to]] drink three cups of coffee a day.","jp":"以前は1日にコーヒーを3杯飲んでいました。","scene":"日常","alts":["I drank three coffees a day in the past."]},{"id":"P61_07","en":"I used to visit this café every Saturday morning.","tpl":"[[I used to]] visit this café every Saturday morning.","jp":"以前は毎週土曜の朝にこのカフェに通っていました。","scene":"レストラン","alts":["I came to this café every Saturday."]},{"id":"P61_08","en":"I used to play basketball in high school.","tpl":"[[I used to]] play basketball in high school.","jp":"高校時代はバスケットボールをしていました。","scene":"自己紹介","alts":["I played basketball in high school."]},{"id":"P61_09","en":"I used to pack way too much for business trips.","tpl":"[[I used to]] pack way too much for business trips.","jp":"以前は出張に荷物を詰め込みすぎていました。","scene":"海外出張","alts":["I always overpacked for business trips."]},{"id":"P61_10","en":"I used to translate everything from Japanese in my head.","tpl":"[[I used to]] translate everything from Japanese in my head.","jp":"以前は頭の中で何でも日本語から翻訳していました。","scene":"日常","alts":["I always translated from Japanese mentally."]},{"id":"P61_11","en":"I used to stay up past midnight on weekdays.","tpl":"[[I used to]] stay up past midnight on weekdays.","jp":"以前は平日に深夜0時過ぎまで起きていました。","scene":"日常","alts":["I stayed up past midnight on weekdays."]},{"id":"P61_12","en":"I used to shop mostly at department stores.","tpl":"[[I used to]] shop mostly at department stores.","jp":"以前はほとんど百貨店で買い物していました。","scene":"買い物","alts":["I mostly shopped at department stores."]},{"id":"P61_13","en":"I used to take long notes by hand during meetings.","tpl":"[[I used to]] take long notes by hand during meetings.","jp":"以前は会議中に手書きで長いメモを取っていました。","scene":"会議","alts":["I wrote long handwritten meeting notes."]},{"id":"P61_14","en":"I used to dislike spicy food, but now I enjoy it.","tpl":"[[I used to]] dislike spicy food, but now I enjoy it.","jp":"以前は辛い食べ物が苦手でしたが、今は好きです。","scene":"レストラン","alts":["I didn't like spicy food before."]},{"id":"P61_15","en":"I used to book hotels solely based on price.","tpl":"[[I used to]] book hotels solely based on price.","jp":"以前は値段だけでホテルを予約していました。","scene":"ホテル","alts":["I picked hotels only by price before."]},{"id":"P61_16","en":"I used to jog along the river every morning.","tpl":"[[I used to]] jog along the river every morning.","jp":"以前は毎朝川沿いをジョギングしていました。","scene":"日常","alts":["I ran by the river each morning."]},{"id":"P61_17","en":"I used to work with your brother at my old job.","tpl":"[[I used to]] work with your brother at my old job.","jp":"前の職場であなたのお兄さんと一緒に働いていました。","scene":"友人","alts":["Your brother and I were coworkers before."]},{"id":"P61_18","en":"I used to dread giving presentations in English.","tpl":"[[I used to]] dread giving presentations in English.","jp":"以前は英語でプレゼンするのが本当に嫌でした。","scene":"会議","alts":["English presentations used to scare me."]},{"id":"P61_19","en":"I used to carry a heavy guidebook when traveling.","tpl":"[[I used to]] carry a heavy guidebook when traveling.","jp":"以前は旅行のときに重いガイドブックを持ち歩いていました。","scene":"旅行","alts":["I carried a thick guidebook on trips."]},{"id":"P61_20","en":"I used to eat lunch at my desk every day.","tpl":"[[I used to]] eat lunch at my desk every day.","jp":"以前は毎日デスクで昼食を食べていました。","scene":"職場","alts":["I ate lunch at my desk daily."]}]},{"id":"P62","catId":"cat7","pattern":"I've been to ...","meaning":"〜に行ったことがあります","grammar":"I have been to の短縮形 + 場所 で、これまでに訪れた経験を表します。","usage":"旅行の話題、出張経験、おすすめのレストランやお店の共有で非常に頻繁に使われます。","nuance":"「行って今ここにいる（経験）」を表すため、過去形（I went to ...）より「経験がある」という焦点がはっきりします。","similar":"I went to ...（特定の過去の時点を言うとき）／ I've visited ...（やや丁寧）","pitfall":"× I've gone to Paris は「パリへ行ってしまって今ここにいない」という意味になるので、経験は必ず ○ I've been to Paris にします！","dialogue":[{"speaker":"A","en":"Have you ever visited London for work?","jp":"仕事でロンドンに行ったことはありますか？"},{"speaker":"B","en":"Yes, I've been to London twice—once for a trade show and once for client meetings.","jp":"はい、ロンドンには2回行ったことがあります。展示会で1回、顧客との会議で1回です。"},{"speaker":"A","en":"Nice! What did you think of it?","jp":"いいですね！どうでしたか？"},{"speaker":"B","en":"I loved the parks and museums, though the weather changed every hour!","jp":"公園や美術館が素敵でしたよ。天気は1時間ごとに変わりましたけどね！"}],"drills":{"subject":{"en":"She's been to over fifteen countries for business.","jp":"彼女は仕事で15か国以上を訪れたことがあります。"},"tense":{"en":"I' re in Ginza.","jp":"銀座の旗艦店に行ったことがあります。","scene":"買い物","alts":["I have visited their Ginza store."]},{"id":"P62_09","en":"I've been to Europe only once so far.","tpl":"[[I've been to]] Europe only once so far.","jp":"今のところヨーロッパには一度だけ行ったことがあります。","scene":"旅行","alts":["So far I have visited Europe once."]},{"id":"P62_10","en":"I've been to three meetings already this morning.","tpl":"[[I've been to]] three meetings already this morning.","jp":"今朝だけですでに3つの会議に出ました。","scene":"会議","alts":["I have attended three meetings this morning."]},{"id":"P62_11","en":"I've been to that café—their cheesecake is amazing.","tpl":"[[I've been to]] that café—their cheesecake is amazing.","jp":"あのカフェに行ったことありますが、チーズケーキが絶品です。","scene":"レストラン","alts":["I have tried that café and their cheesecake is great."]},{"id":"P62_12","en":"I've been to London, Paris, and Munich.","tpl":"[[I've been to]] London, Paris, and Munich.","jp":"ロンドン、パリ、ミュンヘンに行ったことがあります。","scene":"海外出張","alts":["I have visited London, Paris, and Munich."]},{"id":"P62_13","en":"I've been to Okinawa twice with my family.","tpl":"[[I've been to]] Okinawa twice with my family.","jp":"家族と沖縄に2回行ったことがあります。","scene":"旅行","alts":["I have taken two family trips to Okinawa."]},{"id":"P62_14","en":"I've been to the airport lounge in terminal three.","tpl":"[[I've been to]] the airport lounge in terminal three.","jp":"第3ターミナルの空港ラウンジに行ったことがあります。","scene":"海外出張","alts":["I have used the terminal three lounge."]},{"id":"P62_15","en":"I've been to that bakery a few times on weekends.","tpl":"[[I've been to]] that bakery a few times on weekends.","jp":"週末にあのパン屋さんには何度か行ったことがあります。","scene":"日常","alts":["I have stopped by that bakery a few times."]},{"id":"P62_16","en":"I've been to a jazz club in Yokohama once.","tpl":"[[I've been to]] a jazz club in Yokohama once.","jp":"横浜のジャズクラブに一度行ったことがあります。","scene":"友人","alts":["I went to a Yokohama jazz club once."]},{"id":"P62_17","en":"I've been to the outlet mall near Mount Fuji.","tpl":"[[I've been to]] g the final icons.","jp":"デザインチームはまだ最終アイコンを仕上げています。"},"tense":{"en":"I was still half asleep when my alarm rang.","jp":"目覚ましが鳴ったとき、まだ半分寝ていました。"},"negative":{"en":"I'm still not sure which hotel to pick.","jp":"どのホテルを選ぶべきかまだはっきり決まっていません。"},"question":{"en":"Are you still looking for a quiet café?","jp":"まだ静かなカフェを探していますか？"}},"examples":[{"id":"P67_01","en":"I'm still working on the quarterly report.","tpl":"[[I'm still]] working on the quarterly report.","jp":"まだ四半期レポートに取り組んでいます。","scene":"職場","alts":["I am currently still finishing the report."]},{"id":"P67_02","en":"I'm still waiting for my luggage at carousel two.","tpl":"[[I'm still]] waiting for my luggage at carousel two.","jp":"まだ2番ターンテーブルで荷物を待っています。","scene":"海外出張","alts":["My bag hasn't come out at carousel two yet."]},{"id":"P67_03","en":"I'm still deciding what to order.","tpl":"[[I'm still]] deciding what to order.","jp":"何を注文するかまだ迷っています。","scene":"レストラン","alts":["I need another minute to decide."]},{"id":"P67_04","en":"I'm still jet-lagged from yesterday's flight.","tpl":"[[I'm still]] jet-lagged from yesterday's flight.","jp":"昨日のフライトでまだ時差ボケしています。","scene":"旅行","alts":["I still have jet lag from yesterday."]},{"id":"P67_05","en":"I'm still at the office—I'll leave in twenty minutes.","tpl":"[[I'm still]] at the office—I'll leave in twenty minutes.","jp":"まだオフィスにいます、20分後に出ます。","scene":"職場","alts":["I am still at work for another twenty minutes."]},{"id":"P67_06","en":"I'm still looking for the right size.","tpl":"[[I'm still]] looking for the right size.","jp":"ちょうどいいサイズをまだ探しています。","scene":"買い物","alts":["I haven't found my size yet."]},{"id":"P67_07","en":"I'm still reviewing the contract terms.","tpl":"[[I'm still]] reviewing the contract terms.","jp":"まだ契約条件を確認しているところです。","scene":"会議","alts":["I am still going through the contract."]},{"id":"P67_08","en":"I'm still getting used to the new keyboard layout.","tpl":"[[I'm still]] getting used to the new keyboard layout.","jp":"新しいキーボード配列にまだ慣れている最中です。","sce college.","tpl":"[[It's been]] ten years [[since]] I graduated from college.","jp":"大学を卒業してから10年になります。","scene":"自己紹介","alts":["I graduated ten years ago."]},{"id":"P70_12","en":"It's been a few months since we last checked in.","tpl":"[[It's been]] a few months [[since]] we last checked in.","jp":"最後に連絡を取り合ってから数か月になります。","scene":"友人","alts":["We haven't caught up in a few months."]},{"id":"P70_13","en":"It's been almost a year since the hotel was renovated.","tpl":"[[It's been]] almost a year [[since]] the hotel was renovated.","jp":"そのホテルが改装されてからほぼ1年になります。","scene":"ホテル","alts":["The hotel finished renovating nearly a year ago."]},{"id":"P70_14","en":"It's been an hour since we ordered our food.","tpl":"[[It's been]] an hour [[since]] we ordered our food.","jp":"料理を注文してから1時間になります。","scene":"レストラン","alts":["We ordered an hour ago."]},{"id":"P70_15","en":"It's been a year since I joined this company.","tpl":"[[It's been]] a year [[since]] I joined this company.","jp":"この会社に入社してから1年になります。","scene":"職場","alts":["I started working here a year ago."]},{"id":"P70_16","en":"It's been several days since it last rained.","tpl":"[[It's been]] several days [[since]] it last rained.","jp":"最後に雨が降ってから数日になります。","scene":"日常","alts":["It hasn't rained for several days."]},{"id":"P70_17","en":"It's been three months since I began daily English practice.","tpl":"[[It's been]] three months [[since]] I began daily English practice.","jp":"毎日の英語練習を始めてから3か月になります。","scene":"日常","alts":["I started daily English practice three months ago."]},{"id":"P70_18","en":"It's been a long time since I stayed at a hot spring inn.","tpl":"[[It's been]] a long time [[since]] I stayed at a hot spring inn.","jp":"温泉旅館に泊まってからずいぶん久しぶりです。","scene":"旅行","alts":["I haven't stayed at a ryokan in a long time."]},{"id":"P70_19","en":"It's been two hours since the meeting started.","tpl":"[[It's been]] two hours [[since]] the meeting started.","jp":"会議が始まってから2時間になります。","scene":"会議","alts":["We have been in this meeting for two hours."]},{"id":"P70_20","en":"It's been years since I played tennis.","tpl":"[[It's been]] years [[since]] I played tennis.","jp":"テニスをしてから何年にもなります。","scene":"友人","alts":["I haven't played tennis in years."]}]},{"id":"P71","catId":"cat8","pattern":"It depends on ...","meaning":"〜次第です／〜によります","grammar":"It depends on + 名詞／疑問詞節（what / how / when など）で、状況によって答えが変わることを表します。","usage":"見積もり、スケジュール相談、おすすめを聞かれたとき、即答しにくい質問へのスマートな返しとして超頻出です。","nuance":"Yes/No で割り切れない大人の会話の必需品。短く It depends.（場合によりますね）だけでも立派に通じます。","similar":"It varies depending on ...（〜によって異なる）","pitfall":"on を忘れやすく、さらに depend は動詞なので be 動詞を付けないよう注意（× It's depend on → ○ It depends on）。","dialogue":[{"speaker":"A","en":"How long will the website redesign take?","jp":"ウェブサイトのリデザインはどのくらいかかりますか？"},{"speaker":"B","en":"It depends on how many custom pages you want to include.","jp":"カスタムページを何ページ含めるか次第ですね。"},{"speaker":"A","en":"What if we start with just five core pages?","jp":"まずは主要な5ページだけから始めたらどうですか？"},{"speaker":"B","en":"In that case, we can wrap it up in about three weeks.","jp":"それなら、およそ3週間で仕上げられますよ。"}],"drills":{"subject":{"en":"The final price depends on the shipping speed you choose.","jp":"最終価格は選択する配送スピードによって決まります。"},"tense":{"en":"Everything depended on the weather that morning.","jp":"すべてはその朝の天気次第でした。"},"negative":{"en":"It doesn't depend on luck—it's all about daily practice.","jp":"運次第ではなく、毎日の練習次第です。"},"question":{"en":"What does the delivery time depend on?","jp":"納期は何によって決まりますか？"}},"examples":[{"id":"P71_01","en":"It depends on the weather tomorrow.","tpl":"[[It depends on]] the weather tomorrow.","jp":"明日の天気次第です。","scene":"日常","alts":["That depends on tomorrow's weather."]},{"id":"P71_02","en":"It depends on how busy the restaurant is.","tpl":"[[It depends on]] how busy the restaurant is.","jp":"レストランがどのくらい混んでいるかによります。","scene":"レストラン","alts":["It varies with how crowded they are."]},{"id":"P71_03","en":"It depends on the client's final budget.","tpl":"[[It depends on]] the client's final budget.","jp":"クライアントの最終予算次第です。","scene":"会議","alts":["That depends on the client's budget."]},{"id":"P71_04","en":"It depends on traffic at that hour.","tpl":"[[It depends on]] traffic at that hour.","jp":"その時間帯の渋滞次第ですね。","scene":"海外出張","alts":["It varies depending on traffic."]},{"id":"P71_05","en":"It depends on what kind of trip you're planning.","tpl":"[[It depends on]] what kind of trip you're planning.","jp":"どんな旅行を計画しているかによります。","scene":"旅行","alts":["That depends on your travel style."]},{"id":"P71_06","en":"It depends on how much time we have.","tpl":"[[It depends on]] how much time we have.","jp":"どのくらい時間があるか次第です。","scene":"職場","alts":["It comes down to how much time we have."]},{"id":"P71_07","en":"It depends on the season—summer is more expensive.","tpl":"[[It depends on]] the season—summer is more expensive.","jp":"季節によります、夏はもっと高くなります。","scene":"ホテル","alts":["Prices vary by season."]},{"id":"P71_08","en":"It depends on which airline you book with.","tpl":"[[It depends on]] which airline you book with.","jp":"どの航空会社で予約するかによります。","scene":"海外出張","alts":["That varies by airline."]},{"id":"P71_09","en":"It depends on whether everyone can join on Thursday.","tpl":"[[It depends on]] whether everyone can join on Thursday.","jp":"木曜日に全員参加できるかどうか次第です。","scene":"会議","alts":["It hinges on Thursday's availability."]},{"id":"P71_10","en":"It depends on your personal preference.","tpl":"[[It depends on]] your personal preference.","jp":"個人の好みによりますね。","scene":"買い物","alts":["It really comes down to personal taste."]},{"id":"P71_11","en":"It depends on how many people are coming to dinner.","tpl":"[[It depends on]] how many people are coming to dinner.","jp":"夕食に何人来るかによります。","scene":"レストラン","alts":["It depends on the headcount for dinner."]},{"id":"P71_12","en":"It depends on the size of the project.","tpl":"[[It depends on]] the size of the project.","jp":"プロジェクトの規模次第です。","scene":"職場","alts":["That varies with project scope."]},{"id":"P71_13","en":"It depends on when the shipment clears customs.","tpl":"[[It depends on]] when the shipment clears customs.","jp":"荷物がいつ税関を通るか次第です。","scene":"買い物","alts":["It depends on customs clearance."]},{"id":"P71_14","en":"It depends on how fast we get feedback.","tpl":"[[It depends on]] how fast we get feedback.","jp":"どのくらい早くフィードバックをもらえるか次第です。","scene":"会議","alts":["It relies on how quickly we get feedback."]},{"id":"P71_15","en":"It depends on whether you prefer quiet or lively areas.","tpl":"[[It depends on]] whether you prefer quiet or lively areas.","jp":"静かなエリアとにぎやかなエリアのどちらが好きかによります。","scene":"ホテル","alts":["It depends on the vibe you want."]},{"id":"P71_16","en":"It depends on my flight arrival time.","tpl":"[[It depends on]] my flight arrival time.","jp":"私のフライトの到着時刻次第です。","scene":"海外出張","alts":["It depends on when my plane lands."]},{"id":"P71_17","en":"It depends on how tired I feel after work.","tpl":"[[It depends on]] how tired I feel after work.","jp":"仕事後にどのくらい疲れているかによります。","scene":"友人","alts":["It depends on my energy after work."]},{"id":"P71_18","en":"It depends on the material—wool needs dry cleaning.","tpl":"[[It depends on]] the material—wool needs dry cleaning.","jp":"素材によります。ウールはドライクリーニングが必要です。","scene":"買い物","alts":["Care depends on the fabric."]},{"id":"P71_19","en":"It depends on what you want to achieve this year.","tpl":"[[It depends on]] what you want to achieve this year.","jp":"今年何を達成したいか次第です。","scene":"日常","alts":["It depends on your goals this year."]},{"id":"P71_20","en":"It depends on the exchange rate on that day.","tpl":"[[It depends on]] the exchange rate on that day.","jp":"その日の為替レート次第です。","scene":"旅行","alts":["It varies with the exchange rate."]}]},{"id":"P72","catId":"cat8","pattern":"What if ...?","meaning":"もし〜したらどうしよう？／〜はどうですか？","grammar":"What if + 主語 + 動詞（現在形または過去形）? で、心配事の想定や、大胆なアイデア提案を行います。","usage":"トラブル対策の事前シミュレーション、会議での新しい発想の提案、旅行のバックアップ計画づくりに使います。","nuance":"What will happen if ...? を2語に凝縮した、非常にテンポがよくネイティブらしい表現です。","similar":"What would happen if ...?（より丁寧な仮定）／ How about we ...?（提案寄り）","pitfall":"後ろは疑問文語順ではなく「主語＋動詞」の語順にします（○ What if the train is late?）。","dialogue":[{"speaker":"A","en":"We're planning an outdoor reception at the hotel terrace.","jp":"ホテルのテラスで屋外レセプションを計画しています。"},{"speaker":"B","en":"Sounds lovely, but what if it rains on Friday evening?","jp":"素敵ですね、でももし金曜の夕方に雨が降ったらどうしますか？"},{"speaker":"A","en":"Good question—the hotel reserved an indoor ballroom as our backup.","jp":"いい質問ですね。ホテルが予備として屋内の宴会場を押さえてくれています。"},{"speaker":"B","en":"Smart! And what if we start thirty minutes earlier to catch the sunset?","jp":"さすが！それに夕日に合わせて30分早く始めるのはどうですか？"}],"drills":{"subject":{"en":"What if the client asks for a shorter timeline?","jp":"もしクライアントがもっと短い納期を求めてきたらどうしましょう？"},"tense":{"en":"What if we tried a completely different color palette?","jp":"もしまったく違う配色を試してみたらどうでしょう？"},"negative":{"en":"What if my card doesn't work at the local ATM?","jp":"もし現地のATMで私のカードが使えなかったらどうしよう？"},"question":{"en":"What if we split the presentation into two parts?","jp":"プレゼンを2部構成に分けるのはどうですか？"}},"examples":[{"id":"P72_01","en":"What if it rains tomorrow?","tpl":"[[What if]] it rains tomorrow?","jp":"もし明日雨が降ったらどうしよう？","scene":"日常","alts":["What will we do if it rains tomorrow?"]},{"id":"P72_02","en":"What if our flight gets delayed?","tpl":"[[What if]] our flight gets delayed?","jp":"もしフライトが遅延したらどうしましょう？","scene":"海外出張","alts":["What happens if our flight is delayed?"]},{"id":"P72_03","en":"What if we start the meeting ten minutes earlier?","tpl":"[[What if]] we start the meeting ten minutes earlier?","jp":"会議を10分早く始めるのはどうですか？","scene":"会議","alts":["How about starting the meeting ten minutes early?"]},{"id":"P72_04","en":"What if the restaurant is fully booked?","tpl":"[[What if]] the restaurant is fully booked?","jp":"もしレストランが満席だったらどうしよう？","scene":"レストラン","alts":["What do we do if they have no tables?"]},{"id":"P72_05","en":"What if we test the simpler version first?","tpl":"[[What if]] we test the simpler version first?","jp":"まずシンプルなバージョンを試してみるのはどうですか？","scene":"会議","alts":["Why not test the simpler version first?"]},{"id":"P72_06","en":"What if I lose Wi-Fi during the trip?","tpl":"[[What if]] I lose Wi-Fi during the trip?","jp":"旅行中にWi-Fiが切れたらどうしよう？","scene":"旅行","alts":["What do I do if I lose internet?"]},{"id":"P72_07","en":"What if the hotel room isn't ready when we arrive?","tpl":"[[What if]] the hotel room isn't ready when we arrive?","jp":"到着時にホテルの部屋の準備ができていなかったらどうしよう？","scene":"ホテル","alts":["What if we can't check in right away?"]},{"id":"P72_08","en":"What if this size doesn't fit when I get home?","tpl":"[[What if]] this size doesn't fit when I get home?","jp":"家に帰ってこのサイズが合わなかったらどうしよう？","scene":"買い物","alts":["Can I exchange it if it doesn't fit?"]},{"id":"P72_09","en":"What if we move the deadline to next Monday?","tpl":"[[What if]] we move the deadline to next Monday?","jp":"締め切りを来週月曜日に移すのはどうですか？","scene":"職場","alts":["Could we push the deadline to Monday?"]},{"id":"P72_10","en":"What if I forget the English word mid-sentence?","tpl":"[[What if]] I forget the English word mid-sentence?","jp":"文の途中で英単語を忘れたらどうしよう？","scene":"日常","alts":["What do I do if I blank on a word?"]},{"id":"P72_11","en":"What if we share a taxi instead of taking the bus?","tpl":"[[What if]] we share a taxi instead of taking the bus?","jp":"バスではなくタクシーをシェアするのはどうですか？","scene":"旅行","alts":["How about splitting a cab instead?"]},{"id":"P72_12","en":"What if the projector doesn't connect to my laptop?","tpl":"[[What if]] the projector doesn't connect to my laptop?","jp":"プロジェクターが私のパソコンにつながらなかったらどうしよう？","scene":"会議","alts":["What is our backup if the projector fails?"]},{"id":"P72_13","en":"What if we invite the design team too?","tpl":"[[What if]] we invite the design team too?","jp":"デザインチームも呼ぶのはどうですか？","scene":"職場","alts":["Should we include the design team?"]},{"id":"P72_14","en":"What if they run out of the daily special?","tpl":"[[What if]] they run out of the daily special?","jp":"もし日替わりメニューが売り切れていたらどうしよう？","scene":"レストラン","alts":["What will you order if the special is gone?"]},{"id":"P72_15","en":"What if my suitcase doesn't arrive on time?","tpl":"[[What if]] my suitcase doesn't arrive on time?","jp":"スーツケースが時間通りに届かなかったらどうしよう？","scene":"海外出張","alts":["What if my checked bag is delayed?"]},{"id":"P72_16","en":"What if we keep the intro under two minutes?","tpl":"[[What if]] we keep the intro under two minutes?","jp":"導入を2分以内に収めるのはどうですか？","scene":"会議","alts":["Let's try keeping the intro under two minutes."]},{"id":"P72_17","en":"What if we take a day trip to Kamakura instead?","tpl":"[[What if]] we take a day trip to Kamakura instead?","jp":"代わりに鎌倉へ日帰り旅行に行くのはどうですか？","scene":"友人","alts":["How about a day trip to Kamakura?"]},{"id":"P72_18","en":"What if the store doesn't accept my credit card?","tpl":"[[What if]] the store doesn't accept my credit card?","jp":"お店で私のクレジットカードが使えなかったらどうしよう？","scene":"買い物","alts":["What if they don't take my card?"]},{"id":"P72_19","en":"What if we automate this weekly report?","tpl":"[[What if]] we automate this weekly report?","jp":"この週次レポートを自動化するのはどうですか？","scene":"職場","alts":["Could we automate the weekly report?"]},{"id":"P72_20","en":"What if we meet at the café inside the station?","tpl":"[[What if]] we meet at the café inside the station?","jp":"駅構内のカフェで待ち合わせするのはどうですか？","scene":"友人","alts":["How about meeting at the station café?"]}]},{"id":"P73","catId":"cat8","pattern":"The reason why ... is ...","meaning":"〜の理由は…です","grammar":"The reason (why) + 主語 + 動詞 + is (that) + 主語 + 動詞 で、理由を強調して分かりやすく説明します。","usage":"プレゼンの根拠説明、提案の背景、遅延や変更の理由説明など、説得力のあるスピーチに欠かせません。","nuance":"結論の理由にスポットライトを当てる構文。口語では why を省いて The reason I called is ... と言うこともよくあります。","similar":"That's why ...（だから〜なんです）／ Because ...（シンプルに理由を述べる）","pitfall":"× The reason why ... is because ... は重複（理由が重複）とみなされるため、フォーマルな場面では ○ ... is that ... を使いましょう。","dialogue":[{"speaker":"A","en":"Why did we choose Yokohama for this year's workshop?","jp":"今年のワークショップ会場に横浜を選んだのはなぜですか？"},{"speaker":"B","en":"The reason why we picked Yokohama is that it's only thirty minutes from Haneda Airport.","jp":"横浜を選んだ理由は、羽田空港からたった30分だからです。"},{"speaker":"A","en":"That's super convenient for our overseas guests.","jp":"海外からのゲストにとってすごく便利ですね。"},{"speaker":"B","en":"Exactly! And there are plenty of great hotels within walking distance.","jp":"その通りです！しかも徒歩圏内に素敵なホテルがたくさんありますから。"}],"drills":{"subject":{"en":"The reason why she recommends this hotel is its quiet location.","jp":"彼女がこのホテルをおすすめする理由は、静かな立地です。"},"tense":{"en":"The reason why I arrived late was a sudden train delay.","jp":"私が遅刻した理由は、急な電車遅延でした。"},"negative":{"en":"The reason why we didn't launch early is that testing wasn't finished.","jp":"早めに公開しなかった理由は、テストが終わっていなかったからです。"},"question":{"en":"What's the main reason why customers choose this plan?","jp":"お客様がこのプランを選ぶ一番の理由は何ですか？"}},"examples":[{"id":"P73_01","en":"The reason why I'm calling is to confirm tomorrow's meeting.","tpl":"[[The reason why]] I'm calling [[is]] to confirm tomorrow's meeting.","jp":"お電話した理由は、明日の会議を確認するためです。","scene":"職場","alts":["I am calling to confirm tomorrow's meeting."]},{"id":"P73_02","en":"The reason why I'm learning English is to work globally.","tpl":"[[The reason why]] I'm learning English [[is]] to work globally.","jp":"英語を学んでいる理由は、グローバルに働くためです。","scene":"自己紹介","alts":["I study English so I can work globally."]},{"id":"P73_03","en":"The reason why we delayed the launch is to improve quality.","tpl":"[[The reason why]] we delayed the launch [[is]] to improve quality.","jp":"ローンチを延期した理由は、品質を高めるためです。","scene":"会議","alts":["We delayed launch to raise quality."]},{"id":"P73_04","en":"The reason why I love this café is the quiet atmosphere.","tpl":"[[The reason why]] I love this café [[is]] the quiet atmosphere.","jp":"このカフェが好きな理由は、静かな雰囲気です。","scene":"レストラン","alts":["I love this café for its quiet vibe."]},{"id":"P73_05","en":"The reason why I chose this hotel is its proximity to the station.","tpl":"[[The reason why]] I chose this hotel [[is]] its proximity to the station.","jp":"このホテルを選んだ理由は、駅に近いことです。","scene":"ホテル","alts":["I picked this hotel because it is near the station."]},{"id":"P73_06","en":"The reason why I prefer direct flights is that they save energy.","tpl":"[[The reason why]] I prefer direct flights [[is]] that they save energy.","jp":"直行便を好む理由は、体力を温存できるからです。","scene":"海外出張","alts":["Direct flights save me a lot of energy."]},{"id":"P73_07","en":"The reason why I brought this up is to avoid confusion later.","tpl":"[[The reason why]] I brought this up [[is]] to avoid confusion later.","jp":"この件を切り出した理由は、後で混乱を避けるためです。","scene":"会議","alts":["I mentioned this to prevent confusion later."]},{"id":"P73_08","en":"The reason why this coat costs more is the waterproof fabric.","tpl":"[[The reason why]] this coat costs more [[is]] the waterproof fabric.","jp":"このコートが高めな理由は、防水生地を使っているからです。","scene":"買い物","alts":["The waterproof fabric makes this coat pricier."]},{"id":"P73_09","en":"The reason why we left early is that traffic gets heavy at eight.","tpl":"[[The reason why]] we left early [[is]] that traffic gets heavy at eight.","jp":"早く出発した理由は、8時に渋滞がひどくなるからです。","scene":"旅行","alts":["We left early to beat eight o'clock traffic."]},{"id":"P73_10","en":"The reason why I recommend this app is that it's easy to use.","tpl":"[[The reason why]] I recommend this app [[is]] that it's easy to use.","jp":"このアプリをおすすめする理由は、使いやすいからです。","scene":"日常","alts":["I recommend this app because it is intuitive."]},{"id":"P73_11","en":"The reason why I asked for a window seat is that I love the view.","tpl":"[[The reason why]] I asked for a window seat [[is]] that I love the view.","jp":"窓側の席を頼んだ理由は、景色が好きだからです。","scene":"旅行","alts":["I picked a window seat for the view."]},{"id":"P73_12","en":"The reason why the line is long is that their ramen is famous.","tpl":"[[The reason why]] the line is long [[is]] that their ramen is famous.","jp":"行列が長い理由は、ここのラーメンが有名だからです。","scene":"レストラン","alts":["The line is long because they are famous for ramen."]},{"id":"P73_13","en":"The reason why I joined this company is the supportive culture.","tpl":"[[The reason why]] I joined this company [[is]] the supportive culture.","jp":"この会社に入った理由は、支え合う社風です。","scene":"自己紹介","alts":["I joined for the supportive team culture."]},{"id":"P73_14","en":"The reason why we need another week is that the data isn't ready.","tpl":"[[The reason why]] we need another week [[is]] that the data isn't ready.","jp":"もう1週間必要な理由は、データがまだ整っていないからです。","scene":"職場","alts":["We need an extra week until the data is ready."]},{"id":"P73_15","en":"The reason why I pack light is that I hate waiting at baggage claim.","tpl":"[[The reason why]] I pack light [[is]] that I hate waiting at baggage claim.","jp":"荷物を少なくする理由は、手荷物受取所で待つのが嫌だからです。","scene":"海外出張","alts":["I pack light to skip baggage claim."]},{"id":"P73_16","en":"The reason why I'm writing is to follow up on my quote.","tpl":"[[The reason why]] I'm writing [[is]] to follow up on my quote.","jp":"メールした理由は、お見積りの件をフォローするためです。","scene":"職場","alts":["I am emailing to follow up on my quote."]},{"id":"P73_17","en":"The reason why I skipped dessert is that I was already full.","tpl":"[[The reason why]] I skipped dessert [[is]] that I was already full.","jp":"デザートをパスした理由は、もうお腹がいっぱいだったからです。","scene":"レストラン","alts":["I skipped dessert because I was full."]},{"id":"P73_18","en":"The reason why I practice out loud is to build speaking reflexes.","tpl":"[[The reason why]] I practice out loud [[is]] to build speaking reflexes.","jp":"声に出して練習する理由は、話す反射神経を鍛えるためです。","scene":"日常","alts":["Practicing aloud builds speaking reflexes."]},{"id":"P73_19","en":"The reason why we booked early is that hotels fill up fast.","tpl":"[[The reason why]] we booked early [[is]] that hotels fill up fast.","jp":"早めに予約した理由は、ホテルがすぐ満室になるからです。","scene":"ホテル","alts":["We booked early because rooms sell out quickly."]},{"id":"P73_20","en":"The reason why I trust him is that he always keeps his promises.","tpl":"[[The reason why]] I trust him [[is]] that he always keeps his promises.","jp":"彼を信頼している理由は、いつも約束を守るからです。","scene":"友人","alts":["I trust him because he keeps his word."]}]},{"id":"P74","catId":"cat8","pattern":"If ..., I will ...","meaning":"もし〜なら、…します","grammar":"If + 主語 + 現在形, I will (I'll) + 動詞の原形 で、現実的な条件とそれに応じた行動を述べます。","usage":"仕事の約束、旅行のプランB、買い物や食事の条件付き行動など、段取りを組むときに欠かせません。","nuance":"会話では I will を短縮して I'll と言うのが自然。条件と結果をセットで明確に約束できます。","similar":"When ..., I'll ...（確実に起きるとき）／ Unless ..., I'll ...（〜でない限り）","pitfall":"最重要文法ルール！If 節の中は未来のことでも will を使わず現在形にします（× If it will rain → ○ If it rains）。","dialogue":[{"speaker":"A","en":"Let me know if you need any extra slides before the client call.","jp":"クライアントとの通話前に追加スライドが必要なら教えてくださいね。"},{"speaker":"B","en":"Thanks! If I get any new data from sales, I'll let you know right away.","jp":"ありがとう！営業から新しいデータが届いたらすぐ連絡しますね。"},{"speaker":"A","en":"Sounds good. What about dinner after the workshop?","jp":"了解です。ワークショップ後の夕食はどうします？"},{"speaker":"B","en":"If we finish before seven, I'll definitely join everyone!","jp":"7時前に終わったら、ぜひ皆さんとご一緒します！"}],"drills":{"subject":{"en":"If she arrives early, she'll wait in the hotel lobby.","jp":"彼女が早く着いたら、ホテルのロビーで待つそうです。"},"tense":{"en":"If I had more time, I would visit Kyoto too.","jp":"もっと時間があれば、京都にも行くのですが。"},"negative":{"en":"If it doesn't clear up, I'll take a taxi instead.","jp":"晴れなければ、代わりにタクシーに乗ります。"},"question":{"en":"If we book today, will we get the early-bird rate?","jp":"今日予約したら、早割料金になりますか？"}},"examples":[{"id":"P74_01","en":"If it rains tomorrow, I will take the bus.","tpl":"[[If]] it rains tomorrow, [[I will]] take the bus.","jp":"もし明日雨が降ったら、バスに乗ります。","scene":"日常","alts":["If it rains tomorrow, I'll take the bus."]},{"id":"P74_02","en":"If I finish early, I will join you for dinner.","tpl":"[[If]] I finish early, [[I will]] join you for dinner.","jp":"早く終わったら、夕食に合流します。","scene":"友人","alts":["If I wrap up early, I'll join you for dinner."]},{"id":"P74_03","en":"If you send the draft today, I will review it tonight.","tpl":"[[If]] you send the draft today, [[I will]] review it tonight.","jp":"今日下書きを送っていただければ、今夜確認します。","scene":"職場","alts":["Send the draft today and I'll review it tonight."]},{"id":"P74_04","en":"If the flight is delayed, I will text you immediately.","tpl":"[[If]] the flight is delayed, [[I will]] text you immediately.","jp":"フライトが遅れたら、すぐにメッセージします。","scene":"海外出張","alts":["I'll text you right away if the flight is delayed."]},{"id":"P74_05","en":"If they have my size, I will buy this jacket.","tpl":"[[If]] they have my size, [[I will]] buy this jacket.","jp":"私のサイズがあれば、このジャケットを買います。","scene":"買い物","alts":["I'll get this jacket if they have my size."]},{"id":"P74_06","en":"If we have extra time, I will visit the art museum.","tpl":"[[If]] we have extra time, [[I will]] visit the art museum.","jp":"時間に余裕があれば、美術館に行きます。","scene":"旅行","alts":["I'll check out the museum if we have time."]},{"id":"P74_07","en":"If the room is noisy, I will ask to switch.","tpl":"[[If]] the room is noisy, [[I will]] ask to switch.","jp":"部屋がうるさければ、変更をお願いします。","scene":"ホテル","alts":["I'll ask for a different room if it is noisy."]},{"id":"P74_08","en":"If you prefer tea, I will make a fresh pot.","tpl":"[[If]] you prefer tea, [[I will]] make a fresh pot.","jp":"紅茶の方がよければ、新しく淹れますよ。","scene":"日常","alts":["I'll brew fresh tea if you prefer it."]},{"id":"P74_09","en":"If the client approves, I will start production Monday.","tpl":"[[If]] the client approves, [[I will]] start production Monday.","jp":"クライアントが承認すれば、月曜に制作を開始します。","scene":"会議","alts":["Once approved, I'll start production Monday."]},{"id":"P74_10","en":"If the restaurant is full, I will try the café next door.","tpl":"[[If]] the restaurant is full, [[I will]] try the café next door.","jp":"レストランが満席なら、隣のカフェに行ってみます。","scene":"レストラン","alts":["I'll go next door if they are full."]},{"id":"P74_11","en":"If you need a ride, I will pick you up at six.","tpl":"[[If]] you need a ride, [[I will]] pick you up at six.","jp":"車が必要なら、6時に迎えに行きますよ。","scene":"友人","alts":["I'll pick you up at six if you need a ride."]},{"id":"P74_12","en":"If anything changes, I will update the calendar.","tpl":"[[If]] anything changes, [[I will]] update the calendar.","jp":"何か変更があれば、カレンダーを更新します。","scene":"職場","alts":["I'll update the schedule if anything changes."]},{"id":"P74_13","en":"If the price drops, I will order two of them.","tpl":"[[If]] the price drops, [[I will]] order two of them.","jp":"値段が下がったら、2つ注文します。","scene":"買い物","alts":["I'll buy two if it goes on sale."]},{"id":"P74_14","en":"If I get lost, I will call the hotel front desk.","tpl":"[[If]] I get lost, [[I will]] call the hotel front desk.","jp":"道に迷ったら、ホテルのフロントに電話します。","scene":"ホテル","alts":["I'll call reception if I get lost."]},{"id":"P74_15","en":"If you have questions, I will stay after the session.","tpl":"[[If]] you have questions, [[I will]] stay after the session.","jp":"質問があれば、セッション後に残ってお答えします。","scene":"会議","alts":["I'll stay afterward for any questions."]},{"id":"P74_16","en":"If the spicy dish is too hot, I will order extra rice.","tpl":"[[If]] the spicy dish is too hot, [[I will]] order extra rice.","jp":"辛い料理が辛すぎたら、ご飯を追加注文します。","scene":"レストラン","alts":["I'll get extra rice if it is too spicy."]},{"id":"P74_17","en":"If my meeting ends on time, I will catch the five PM train.","tpl":"[[If]] my meeting ends on time, [[I will]] catch the five PM train.","jp":"会議が時間通りに終われば、5時の電車に乗ります。","scene":"職場","alts":["I'll make the five PM train if we end on time."]},{"id":"P74_18","en":"If the weather stays sunny, I will walk to the harbor.","tpl":"[[If]] the weather stays sunny, [[I will]] walk to the harbor.","jp":"晴れが続けば、港まで歩きます。","scene":"旅行","alts":["I'll walk to the harbor if it stays sunny."]},{"id":"P74_19","en":"If I hear any news, I will forward it to you.","tpl":"[[If]] I hear any news, [[I will]] forward it to you.","jp":"何か連絡が入ったら、あなたに転送します。","scene":"海外出張","alts":["I'll pass along any updates I receive."]},{"id":"P74_20","en":"If we keep practicing daily, I will speak smoothly soon.","tpl":"[[If]] we keep practicing daily, [[I will]] speak smoothly soon.","jp":"毎日練習を続ければ、すぐスムーズに話せるようになります。","scene":"日常","alts":["Daily practice will make me fluent soon."]}]},{"id":"P75","catId":"cat8","pattern":"Even though ..., ...","meaning":"〜だけれども、…","grammar":"Even though + 主語 + 動詞, 主語 + 動詞 で、予想に反する事実や対比（譲歩）をはっきり表現します。","usage":"感想の深掘り、会議でのバランスの取れた評価、トラブルの中でもポジティブな面を語るときに大活躍します。","nuance":"but だけでつなぐ単調な英語から一歩抜け出し、TOEIC 700〜800点レベルらしい立体的な文が作れます。","similar":"Although ...（やや書き言葉寄り）／ Despite + 名詞（名詞句を続ける場合）","pitfall":"Even though と but を同じ文に同時に使わないよう注意！（× Even though it rained, but we went → ○ Even though it rained, we went）。","dialogue":[{"speaker":"A","en":"How was the trade show in Frankfurt?","jp":"フランクフルトの展示会はどうでしたか？"},{"speaker":"B","en":"Even though it was exhausting, we met some amazing potential partners.","jp":"すごく疲れましたが、素晴らしいパートナー候補に何社も出会えました。"},{"speaker":"A","en":"That's awesome! Was the booth busy the whole time?","jp":"最高ですね！ブースはずっと忙しかったですか？"},{"speaker":"B","en":"Nonstop! Even though we ran out of brochures on day two, everyone loved the live demo.","jp":"ひっきりなしでした！2日目にパンフレットが切れましたが、ライブデモが大好評でした。"}],"drills":{"subject":{"en":"Even though she was nervous, she delivered a clear speech.","jp":"彼女は緊張していましたが、分かりやすいスピーチをしました。"},"tense":{"en":"Even though the flight was delayed, we made our connection.","jp":"フライトは遅れましたが、乗り継ぎに間に合いました。"},"negative":{"en":"Even though it wasn't cheap, the quality is outstanding.","jp":"安くはありませんでしたが、品質は抜群です。"},"question":{"en":"Did you enjoy the hike even though it was chilly?","jp":"肌寒かったけれどハイキングは楽しめましたか？"}},"examples":[{"id":"P75_01","en":"Even though it rained, we still enjoyed our trip.","tpl":"[[Even though]] it rained, we still enjoyed our trip.","jp":"雨が降ったけれど、それでも旅行を楽しみました。","scene":"旅行","alts":["Although it rained, we had a great trip."]},{"id":"P75_02","en":"Even though the hotel is small, the rooms are spotless.","tpl":"[[Even though]] the hotel is small, the rooms are spotless.","jp":"ホテルは小さいけれど、部屋はピカピカです。","scene":"ホテル","alts":["The hotel is small, yet the rooms are spotless."]},{"id":"P75_03","en":"Even though I was tired, I finished the report.","tpl":"[[Even though]] I was tired, I finished the report.","jp":"疲れていたけれど、レポートを終わらせました。","scene":"職場","alts":["Despite being tired, I finished the report."]},{"id":"P75_04","en":"Even though the restaurant was busy, the service was fast.","tpl":"[[Even though]] the restaurant was busy, the service was fast.","jp":"レストランは混んでいたけれど、提供が早かったです。","scene":"レストラン","alts":["The service was quick despite the crowd."]},{"id":"P75_05","en":"Even though the jacket is pricey, it will last for years.","tpl":"[[Even though]] the jacket is pricey, it will last for years.","jp":"そのジャケットは高いけれど、何年も長持ちします。","scene":"買い物","alts":["It is expensive, but it will last years."]},{"id":"P75_06","en":"Even though I made a few mistakes, everyone understood me.","tpl":"[[Even though]] I made a few mistakes, everyone understood me.","jp":"いくつかミスはしたけれど、みんな理解してくれました。","scene":"会議","alts":["People understood me despite a few errors."]},{"id":"P75_07","en":"Even though we had a tight schedule, we met every goal.","tpl":"[[Even though]] we had a tight schedule, we met every goal.","jp":"タイトな日程だったけれど、すべての目標を達成しました。","scene":"職場","alts":["We hit every goal despite the tight timeline."]},{"id":"P75_08","en":"Even though the flight was twelve hours, I slept well.","tpl":"[[Even though]] the flight was twelve hours, I slept well.","jp":"12時間のフライトだったけれど、よく眠れました。","scene":"海外出張","alts":["I slept nicely on the twelve-hour flight."]},{"id":"P75_09","en":"Even though it's Monday, I feel really energized.","tpl":"[[Even though]] it's Monday, I feel really energized.","jp":"月曜日だけれど、すごく元気が出ます。","scene":"日常","alts":["I have lots of energy despite it being Monday."]},{"id":"P75_10","en":"Even though we disagreed at first, we found a great solution.","tpl":"[[Even though]] we disagreed at first, we found a great solution.","jp":"最初は意見が分かれたけれど、良い解決策を見つけました。","scene":"会議","alts":["We found a solution after disagreeing initially."]},{"id":"P75_11","en":"Even though the store is far, it's worth the trip.","tpl":"[[Even though]] the store is far, it's worth the trip.","jp":"お店は遠いけれど、行く価値があります。","scene":"買い物","alts":["It is worth going even if it is far."]},{"id":"P75_12","en":"Even though I'm busy, I try to study ten minutes daily.","tpl":"[[Even though]] I'm busy, I try to study ten minutes daily.","jp":"忙しいけれど、毎日10分は勉強するようにしています。","scene":"日常","alts":["I still study ten minutes daily despite being busy."]},{"id":"P75_13","en":"Even though the soup looks simple, the flavor is rich.","tpl":"[[Even though]] the soup looks simple, the flavor is rich.","jp":"スープはシンプルに見えるけれど、味が深いです。","scene":"レストラン","alts":["The soup has deep flavor despite looking simple."]},{"id":"P75_14","en":"Even though I packed light, I had everything I needed.","tpl":"[[Even though]] I packed light, I had everything I needed.","jp":"荷物を少なくしたけれど、必要なものは全部そろっていました。","scene":"旅行","alts":["I had everything I needed while packing light."]},{"id":"P75_15","en":"Even though he's new here, he learns remarkably fast.","tpl":"[[Even though]] he's new here, he learns remarkably fast.","jp":"彼は入社したばかりだけれど、驚くほど覚えが早いです。","scene":"職場","alts":["He picks things up fast despite being new."]},{"id":"P75_16","en":"Even though the line was long, it moved quickly.","tpl":"[[Even though]] the line was long, it moved quickly.","jp":"行列は長かったけれど、進むのが早かったです。","scene":"旅行","alts":["The long line moved surprisingly fast."]},{"id":"P75_17","en":"Even though we're in different time zones, we collaborate well.","tpl":"[[Even though]] we're in different time zones, we collaborate well.","jp":"タイムゾーンが違うけれど、うまく協業できています。","scene":"海外出張","alts":["We work well together across time zones."]},{"id":"P75_18","en":"Even though I'm not a morning person, I love hotel breakfasts.","tpl":"[[Even though]] I'm not a morning person, I love hotel breakfasts.","jp":"朝型ではないけれど、ホテルの朝食は大好きです。","scene":"ホテル","alts":["I love hotel breakfasts even as a night owl."]},{"id":"P75_19","en":"Even though it took two tries, we fixed the bug.","tpl":"[[Even though]] it took two tries, we fixed the bug.","jp":"2回かかったけれど、バグを直せました。","scene":"職場","alts":["We resolved the bug on the second try."]},{"id":"P75_20","en":"Even though we haven't met in years, it felt like yesterday.","tpl":"[[Even though]] we haven't met in years, it felt like yesterday.","jp":"何年も会っていなかったけれど、昨日のことのように感じました。","scene":"友人","alts":["It felt like no time had passed since we last met."]}]},{"id":"P76","catId":"cat8","pattern":"That's why ...","meaning":"そういうわけで〜なんです","grammar":"That's why + 主語 + 動詞 で、直前に述べた理由から導かれる結果・結論をテンポよくつなぎます。","usage":"説明の締めくくり、納得のリアクション（Oh, that's why!）、自分の行動理由を分かりやすく伝えるときに大活躍します。","nuance":"That's because ...（原因を後ろに置く）と逆向き。原因→That's why→結果の順で話すと英語がとても論理的に聞こえます。","similar":"So, ...（よりカジュアル）／ Therefore, ...（書き言葉・フォーマル）","pitfall":"That's why の後ろには「結果」、That's because の後ろには「理由」が来ます。ここを逆にしないよう注意！","dialogue":[{"speaker":"A","en":"Why did you arrive at the station thirty minutes early?","jp":"どうして30分も早く駅に着いたの？"},{"speaker":"B","en":"The express train only runs once an hour on Sundays. That's why I left early.","jp":"日曜日は特急が1時間に1本しかないんだ。だから早く出たんだよ。"},{"speaker":"A","en":"Oh, that's why! Good thing you checked the timetable.","jp":"ああ、そういうこと！時刻表を確認しておいてよかったね。"},{"speaker":"B","en":"Yep, now we even have time to grab coffee before boarding.","jp":"うん、乗る前にコーヒーを買う時間まであるよ。"}],"drills":{"subject":{"en":"That's why our team uses a shared checklist.","jp":"そういうわけで、私たちのチームは共有チェックリストを使っています。"},"tense":{"en":"That's why I decided to book a direct flight.","jp":"そういうわけで、直行便を予約することに決めました。"},"negative":{"en":"That's why I don't drink coffee after four PM.","jp":"そういうわけで、午後4時以降はコーヒーを飲まないんです。"},"question":{"en":"Oh, is that why the meeting was moved to Friday?","jp":"あ、だから会議が金曜日に移ったんですか？"}},"examples":[{"id":"P76_01","en":"That's why I'm practicing speaking every day.","tpl":"[[That's why]] I'm practicing speaking every day.","jp":"そういうわけで、毎日スピーキングを練習しています。","scene":"日常","alts":["That is the reason I practice speaking daily."]},{"id":"P76_02","en":"That's why we need to confirm the schedule today.","tpl":"[[That's why]] we need to confirm the schedule today.","jp":"そういうわけで、今日中にスケジュールを確認する必要があります。","scene":"会議","alts":["So we need to confirm the schedule today."]},{"id":"P76_03","en":"That's why I chose a hotel near the station.","tpl":"[[That's why]] I chose a hotel near the station.","jp":"そういうわけで、駅近くのホテルを選びました。","scene":"ホテル","alts":["So I picked a hotel by the station."]},{"id":"P76_04","en":"That's why the line outside is so long.","tpl":"[[That's why]] the line outside is so long.","jp":"だから外の行列があんなに長いんですね。","scene":"レストラン","alts":["Now I see why the line is so long."]},{"id":"P76_05","en":"That's why I always carry a backup charger.","tpl":"[[That's why]] I always carry a backup charger.","jp":"そういうわけで、いつも予備の充電器を持ち歩いています。","scene":"海外出張","alts":["So I always bring a spare charger."]},{"id":"P76_06","en":"That's why we should test it on mobile first.","tpl":"[[That's why]] we should test it on mobile first.","jp":"だからこそ、まずスマホでテストすべきなんです。","scene":"職場","alts":["So testing on mobile first makes sense."]},{"id":"P76_07","en":"That's why I brought an umbrella today.","tpl":"[[That's why]] I brought an umbrella today.","jp":"そういうわけで、今日傘を持ってきたんです。","scene":"日常","alts":["So I packed an umbrella today."]},{"id":"P76_08","en":"That's why this jacket is worth the investment.","tpl":"[[That's why]] this jacket is worth the investment.","jp":"だからこそ、このジャケットは買う価値があるんです。","scene":"買い物","alts":["That makes this jacket worth buying."]},{"id":"P76_09","en":"That's why I prefer morning flights.","tpl":"[[That's why]] I prefer morning flights.","jp":"そういうわけで、午前便の方が好きなんです。","scene":"旅行","alts":["So I like morning flights better."]},{"id":"P76_10","en":"That's why clear notes save so much time.","tpl":"[[That's why]] clear notes save so much time.","jp":"だからこそ、分かりやすいメモはすごく時間を節約するんです。","scene":"会議","alts":["So clear notes are such a time-saver."]},{"id":"P76_11","en":"That's why I asked for a quiet corner table.","tpl":"[[That's why]] I asked for a quiet corner table.","jp":"そういうわけで、静かな角の席をお願いしました。","scene":"レストラン","alts":["So I requested a quiet corner table."]},{"id":"P76_12","en":"That's why I double-checked the gate number.","tpl":"[[That's why]] I double-checked the gate number.","jp":"そういうわけで、搭乗ゲートを再確認したんです。","scene":"海外出張","alts":["So I checked the gate twice."]},{"id":"P76_13","en":"That's why she's so trusted by overseas clients.","tpl":"[[That's why]] she's so trusted by overseas clients.","jp":"だからこそ、彼女は海外クライアントから厚く信頼されているんです。","scene":"職場","alts":["That explains why overseas clients trust her."]},{"id":"P76_14","en":"That's why we booked tickets two months ahead.","tpl":"[[That's why]] we booked tickets two months ahead.","jp":"そういうわけで、2か月前にチケットを予約しました。","scene":"旅行","alts":["So we reserved tickets two months early."]},{"id":"P76_15","en":"That's why I try not to overpack anymore.","tpl":"[[That's why]] I try not to overpack anymore.","jp":"そういうわけで、もう荷物を詰め込みすぎないようにしています。","scene":"海外出張","alts":["So I pack much lighter now."]},{"id":"P76_16","en":"That's why they offer free alterations here.","tpl":"[[That's why]] they offer free alterations here.","jp":"そういうわけで、ここでは裾上げが無料なんですね。","scene":"買い物","alts":["So that is why alterations are free here."]},{"id":"P76_17","en":"That's why I love staying at this hotel chain.","tpl":"[[That's why]] I love staying at this hotel chain.","jp":"だからこそ、このホテルチェーンに泊まるのが好きなんです。","scene":"ホテル","alts":["That is why I keep coming back to this hotel."]},{"id":"P76_18","en":"That's why we should keep our slides visual.","tpl":"[[That's why]] we should keep our slides visual.","jp":"だからこそ、スライドは視覚的にすべきなんです。","scene":"会議","alts":["So visual slides work much better."]},{"id":"P76_19","en":"That's why I called you right away.","tpl":"[[That's why]] I called you right away.","jp":"そういうわけで、すぐあなたに電話したんです。","scene":"友人","alts":["So I gave you a call immediately."]},{"id":"P76_20","en":"That's why learning 80 core patterns is so effective.","tpl":"[[That's why]] learning 80 core patterns is so effective.","jp":"だからこそ、80の基本構文を学ぶのが効果的なんです。","scene":"日常","alts":["That explains why mastering 80 patterns works so well."]}]},{"id":"P77","catId":"cat8","pattern":"As soon as ..., ...","meaning":"〜したらすぐに、…","grammar":"As soon as + 主語 + 現在形（または過去形）, 主語 + 動詞 で、「〜した直後にすぐ行動する」スピード感を表します。","usage":"到着後の連絡、確認後の即返信、仕事の迅速なフォローアップなど、信頼感を高める表現として頻出です。","nuance":"ビジネスで「〜次第すぐ対応します」と伝えるときの鉄板フレーズです。","similar":"Once ..., ...（いったん〜したら）／ The moment ..., ...（〜した瞬間に）","pitfall":"If 節と同じく、未来の出来事でも As soon as 節の中は現在形にします（× As soon as I will arrive → ○ As soon as I arrive）。","dialogue":[{"speaker":"A","en":"Can you let me know when the revised contract comes back from legal?","jp":"法務から修正版の契約書が戻ってきたら教えてもらえますか？"},{"speaker":"B","en":"Of course! As soon as I receive it, I'll forward it to you.","jp":"もちろんです！受け取り次第すぐに転送しますね。"},{"speaker":"A","en":"Thanks so much. We want to send it to the client before five.","jp":"ありがとうございます。5時前にクライアントへ送りたいんです。"},{"speaker":"B","en":"Got it. I'll ping you on chat as soon as it lands in my inbox.","jp":"了解です。受信トレイに届いたらすぐチャットでお知らせします。"}],"drills":{"subject":{"en":"As soon as she lands in Tokyo, she'll message the team.","jp":"彼女が東京に着陸したらすぐ、チームに連絡するそうです。"},"tense":{"en":"As soon as I walked in, I recognized my old colleague.","jp":"中に入った途端、昔の同僚だと気づきました。"},"negative":{"en":"As soon as the rain stops, we won't need umbrellas anymore.","jp":"雨が止んだらすぐ、傘はもう要らなくなりますね。"},"question":{"en":"Could you call me as soon as you reach the hotel?","jp":"ホテルに着いたらすぐ電話してもらえますか？"}},"examples":[{"id":"P77_01","en":"As soon as I arrive at the hotel, I'll text you.","tpl":"[[As soon as]] I arrive at the hotel, I'll text you.","jp":"ホテルに着いたらすぐメッセージしますね。","scene":"ホテル","alts":["I'll text you right after I reach the hotel."]},{"id":"P77_02","en":"As soon as I get the update, I'll let you know.","tpl":"[[As soon as]] I get the update, I'll let you know.","jp":"アップデートが入ったらすぐお知らせします。","scene":"職場","alts":["I'll tell you right when I hear back."]},{"id":"P77_03","en":"As soon as the meeting ends, let's grab coffee.","tpl":"[[As soon as]] the meeting ends, let's grab coffee.","jp":"会議が終わったらすぐコーヒーを飲みましょう。","scene":"会議","alts":["Let's get coffee right after the meeting."]},{"id":"P77_04","en":"As soon as I land in Tokyo, I'll turn on my phone.","tpl":"[[As soon as]] I land in Tokyo, I'll turn on my phone.","jp":"東京に着陸したらすぐスマホの電源を入れます。","scene":"海外出張","alts":["I'll switch on my phone right after landing."]},{"id":"P77_05","en":"As soon as I finish this report, I'm heading home.","tpl":"[[As soon as]] I finish this report, I'm heading home.","jp":"このレポートが終わったらすぐ家に帰ります。","scene":"職場","alts":["I'm leaving right after I finish this report."]},{"id":"P77_06","en":"As soon as we check in, let's explore the neighborhood.","tpl":"[[As soon as]] we check in, let's explore the neighborhood.","jp":"チェックインしたらすぐ周辺を散策しましょう。","scene":"旅行","alts":["Let's walk around right after checking in."]},{"id":"P77_07","en":"As soon as the rain stops, we'll head to the park.","tpl":"[[As soon as]] the rain stops, we'll head to the park.","jp":"雨が止んだらすぐ公園に向かいましょう。","scene":"日常","alts":["We'll go to the park once it stops raining."]},{"id":"P77_08","en":"As soon as I saw the jacket, I knew I wanted it.","tpl":"[[As soon as]] I saw the jacket, I knew I wanted it.","jp":"そのジャケットを見た瞬間、欲しいと思いました。","scene":"買い物","alts":["I wanted that jacket the moment I saw it."]},{"id":"P77_09","en":"As soon as the food arrived, everyone started smiling.","tpl":"[[As soon as]] the food arrived, everyone started smiling.","jp":"料理が運ばれてきた途端、みんな笑顔になりました。","scene":"レストラン","alts":["Everyone smiled the second the food came."]},{"id":"P77_10","en":"As soon as I review the slides, I'll leave my comments.","tpl":"[[As soon as]] I review the slides, I'll leave my comments.","jp":"スライドを確認したらすぐコメントを入れます。","scene":"会議","alts":["I'll add comments right after checking the slides."]},{"id":"P77_11","en":"As soon as you're ready, we can start the demo.","tpl":"[[As soon as]] you're ready, we can start the demo.","jp":"準備ができ次第、デモを始められますよ。","scene":"会議","alts":["We can begin the demo whenever you're ready."]},{"id":"P77_12","en":"As soon as the store opens, let's go pick it up.","tpl":"[[As soon as]] the store opens, let's go pick it up.","jp":"お店が開いたらすぐ受け取りに行きましょう。","scene":"買い物","alts":["Let's pick it up right when the shop opens."]},{"id":"P77_13","en":"As soon as I clear customs, I'll look for the shuttle.","tpl":"[[As soon as]] I clear customs, I'll look for the shuttle.","jp":"税関を通ったらすぐシャトルバスを探します。","scene":"海外出張","alts":["I'll find the shuttle right after customs."]},{"id":"P77_14","en":"As soon as I woke up, I checked the flight status.","tpl":"[[As soon as]] I woke up, I checked the flight status.","jp":"目が覚めてすぐフライト状況を確認しました。","scene":"旅行","alts":["First thing after waking up, I checked my flight."]},{"id":"P77_15","en":"As soon as the client signs, we'll kick off the project.","tpl":"[[As soon as]] the client signs, we'll kick off the project.","jp":"クライアントが署名したらすぐプロジェクトを開始します。","scene":"職場","alts":["We'll start right after the client signs."]},{"id":"P77_16","en":"As soon as I got home, I took a hot shower.","tpl":"[[As soon as]] I got home, I took a hot shower.","jp":"家に着いてすぐ熱いシャワーを浴びました。","scene":"日常","alts":["I showered right when I got home."]},{"id":"P77_17","en":"As soon as a table opens up, they'll call our name.","tpl":"[[As soon as]] a table opens up, they'll call our name.","jp":"席が空き次第、名前を呼んでくれますよ。","scene":"レストラン","alts":["They'll call us right when a table is free."]},{"id":"P77_18","en":"As soon as I find the receipt, I'll submit the claim.","tpl":"[[As soon as]] I find the receipt, I'll submit the claim.","jp":"領収書が見つかり次第、精算を申請します。","scene":"職場","alts":["I'll file the expense once I find the receipt."]},{"id":"P77_19","en":"As soon as the conference wraps up, let's have dinner.","tpl":"[[As soon as]] the conference wraps up, let's have dinner.","jp":"カンファレンスが終わったらすぐ夕食を食べましょう。","scene":"海外出張","alts":["Let's get dinner right after the conference."]},{"id":"P77_20","en":"As soon as I heard the news, I called you.","tpl":"[[As soon as]] I heard the news, I called you.","jp":"そのニュースを聞いてすぐあなたに電話しました。","scene":"友人","alts":["I called you the moment I heard."]}]},{"id":"P78","catId":"cat8","pattern":"In case ..., ...","meaning":"〜の場合に備えて、…","grammar":"In case + 主語 + 現在形, 主語 + 動詞（または 主語 + 動詞 + in case ...）で、万が一への備えを表します。","usage":"旅行や出張の持ち物準備、会議の予備資料、連絡先の共有など、気の利く大人の準備表現として大活躍します。","nuance":"「もし起きたら」の if と違い、「起きる前にあらかじめ備えておく」という予防のニュアンスがはっきり出ます。","similar":"Just in case（念のため・単体でも超頻出）","pitfall":"名詞を続けるときは in case of + 名詞（例：in case of emergency 緊急時には）にします。","dialogue":[{"speaker":"A","en":"Why did you bring a printed copy of the slides too?","jp":"どうしてスライドの印刷版も持ってきたんですか？"},{"speaker":"B","en":"Just in case the conference room Wi-Fi goes down.","jp":"会議室のWi-Fiが落ちた場合に備えてです。"},{"speaker":"A","en":"Smart move! That actually happened to us last month.","jp":"賢いですね！先月実際にそれで困ったんですよ。"},{"speaker":"B","en":"I also saved a backup on a USB drive, just in case.","jp":"念のためUSBメモリにもバックアップを保存しておきました。"}],"drills":{"subject":{"en":"She always packs an extra shirt in case her flight is delayed.","jp":"彼女はフライト遅延に備えていつも予備のシャツを入れています。"},"tense":{"en":"I brought a light cardigan in case the plane was chilly.","jp":"機内が寒い場合に備えて薄いカーディガンを持ってきました。"},"negative":{"en":"Here's my mobile number in case you can't find the entrance.","jp":"入口が見つからない場合に備えて、私の携帯番号をどうぞ。"},"question":{"en":"Should we book an indoor table in case it rains?","jp":"雨が降る場合に備えて室内の席を予約しましょうか？"}},"examples":[{"id":"P78_01","en":"Take an umbrella in case it rains.","tpl":"Take an umbrella [[in case]] it rains.","jp":"雨が降る場合に備えて傘を持っていってください。","scene":"日常","alts":["Bring an umbrella just in case it rains."]},{"id":"P78_02","en":"Here's my number in case you get lost.","tpl":"Here's my number [[in case]] you get lost.","jp":"道に迷った場合に備えて私の番号をどうぞ。","scene":"旅行","alts":["Call this number if you get lost."]},{"id":"P78_03","en":"I packed a jacket in case it gets chilly tonight.","tpl":"I packed a jacket [[in case]] it gets chilly tonight.","jp":"今夜肌寒くなる場合に備えてジャケットを入れました。","scene":"旅行","alts":["I brought a jacket in case it turns cold."]},{"id":"P78_04","en":"Let's save a local copy in case the Wi-Fi drops.","tpl":"Let's save a local copy [[in case]] the Wi-Fi drops.","jp":"Wi-Fiが切れた場合に備えてローカルに保存しましょう。","scene":"会議","alts":["Save a local copy just in case Wi-Fi fails."]},{"id":"P78_05","en":"I arrived early in case there was a long line.","tpl":"I arrived early [[in case]] there was a long line.","jp":"長い行列ができている場合に備えて早く着きました。","scene":"海外出張","alts":["I came early in case of a long queue."]},{"id":"P78_06","en":"Keep the receipt in case you need to exchange it.","tpl":"Keep the receipt [[in case]] you need to exchange it.","jp":"交換が必要な場合に備えて領収書を取っておいてください。","scene":"買い物","alts":["Save the receipt in case of an exchange."]},{"id":"P78_07","en":"I brought a power bank in case my phone dies.","tpl":"I brought a power bank [[in case]] my phone dies.","jp":"スマホの電池が切れた場合に備えてモバイルバッテリーを持ってきました。","scene":"日常","alts":["I packed a power bank just in case."]},{"id":"P78_08","en":"Let's prepare two extra slides in case they ask about costs.","tpl":"Let's prepare two extra slides [[in case]] they ask about costs.","jp":"コストを聞かれた場合に備えて予備スライドを2枚作りましょう。","scene":"会議","alts":["Make two backup slides for cost questions."]},{"id":"P78_09","en":"I wrote down the hotel address in case I lose signal.","tpl":"I wrote down the hotel address [[in case]] I lose signal.","jp":"電波が切れた場合に備えてホテルの住所をメモしました。","scene":"ホテル","alts":["I noted the hotel address in case I go offline."]},{"id":"P78_10","en":"I carried some cash in case the shop doesn't take cards.","tpl":"I carried some cash [[in case]] the shop doesn't take cards.","jp":"お店でカードが使えない場合に備えて少し現金を持ちました。","scene":"買い物","alts":["I brought cash in case they are cash only."]},{"id":"P78_11","en":"Let's leave ten minutes early in case traffic is bad.","tpl":"Let's leave ten minutes early [[in case]] traffic is bad.","jp":"渋滞している場合に備えて10分早く出ましょう。","scene":"海外出張","alts":["Leave ten minutes early in case of traffic."]},{"id":"P78_12","en":"I'll email you the PDF in case the link doesn't open.","tpl":"I'll email you the PDF [[in case]] the link doesn't open.","jp":"リンクが開けない場合に備えてPDFもメールしておきます。","scene":"職場","alts":["I'll attach the PDF just in case."]},{"id":"P78_13","en":"I booked a refundable room in case my plans change.","tpl":"I booked a refundable room [[in case]] my plans change.","jp":"予定が変わる場合に備えてキャンセル無料の部屋を予約しました。","scene":"ホテル","alts":["I chose a refundable room in case plans shift."]},{"id":"P78_14","en":"Let's order an extra plate in case Kenji joins us.","tpl":"Let's order an extra plate [[in case]] Kenji joins us.","jp":"健二が合流する場合に備えてもう1品頼んでおきましょう。","scene":"レストラン","alts":["Let's get one more dish in case Kenji comes."]},{"id":"P78_15","en":"I packed earplugs in case the hotel is near a busy street.","tpl":"I packed earplugs [[in case]] the hotel is near a busy street.","jp":"ホテルが大通り沿いの場合に備えて耳栓を入れました。","scene":"ホテル","alts":["I brought earplugs in case it is noisy."]},{"id":"P78_16","en":"I copied Sarah on the email in case I'm away.","tpl":"I copied Sarah on the email [[in case]] I'm away.","jp":"私が不在の場合に備えてサラをCCに入れました。","scene":"職場","alts":["I CC'd Sarah in case I am out."]},{"id":"P78_17","en":"I downloaded the map offline in case roaming is slow.","tpl":"I downloaded the map offline [[in case]] roaming is slow.","jp":"ローミングが遅い場合に備えて地図をオフライン保存しました。","scene":"旅行","alts":["I saved an offline map just in case."]},{"id":"P78_18","en":"Let's keep a snack handy in case the meeting runs long.","tpl":"Let's keep a snack handy [[in case]] the meeting runs long.","jp":"会議が長引く場合に備えて軽食を手元に置いておきましょう。","scene":"会議","alts":["Keep a snack nearby in case we run o ですか？","scene":"旅行","alts":["Talking of travel, what are your summer plans?"]},{"id":"P79_02","en":"Speaking of lunch, have you tried the new Thai place?","tpl":"[[Speaking of]] lunch, have you tried the new Thai place?","jp":"ランチといえば、新しいタイ料理屋に行ってみましたか？","scene":"レストラン","alts":["Since we mentioned lunch, have you tried the new Thai spot?"]},{"id":"P79_03","en":"Speaking of schedules, are we still on for Thursday?","tpl":"[[Speaking of]] schedules, are we still on for Thursday?","jp":"スケジュールといえば、木曜日は予定通りですか？","scene":"会議","alts":["About our schedule, is Thursday still good?"]},{"id":"P79_04","en":"Speaking of hotels, did you book your room for Osaka?","tpl":"[[Speaking of]] hotels, did you book your room for Osaka?","jp":"ホテルといえば、大阪の部屋はもう予約しましたか？","scene":"ホテル","alts":["Did you reserve your Osaka hotel yet?"]},{"id":"P79_05","en":"Speaking of English, how's your daily practice going?","tpl":"[[Speaking of]] English, how's your daily practice going?","jp":"英語といえば、毎日の練習はどうですか？","scene":"日常","alts":["How is your daily English practice going?"]},{"id":"P79_06","en":"Speaking of shopping, there's a big sale this weekend.","tpl":"[[Speaking of]] shopping, there's a big sale this weekend.","jp":"買い物といえば、今週末大きなセールがありますよ。","scene":"買い物","alts":["By the way, there is a big sale this weekend."]},{"id":"P79_07","en":"Speaking of flights, did your seat upgrade go through?","tpl":"[[Speaking of]] flights, did your seat upgrade go through?","jp":"フライトといえば、座席のアップグレードは通りましたか？","scene":"海外出張","alts":["Did your flight upgrade get approved?"]},{"id":"P79_08","en":"Speaking of budgets, we need to finalize Q4 numbers.","tpl":"[[Speaking of]] budgets, we need to finalize Q4 numbers.","jp":"予算といえば、第4四半期の数字を確定させる必要がありますね。","scene":"会議","alts":["On the topic of budgets, let's finalize Q4."]},{"id":"P79_09","en":"Speaking of weather, it's supposed to warm up tomorrow.","tpl":"[[Speaking of]] weather, it's supposed to warm up tomorrow.","jp":"天気といえば、明日は暖かくなる予報ですよ。","scene":"日常","alts":["On the weather, tomorrow should be warmer."]},{"id":"P79_10","en":"Speaking of presentations, your slides looked super clean.","tpl":"[[Speaking of]] presentations, your slides looked super clean.","jp":"プレゼンといえば、あなたのスライドすごくきれいでしたよ。","scene":"職場","alts":["Your slides looked great, by the way."]},{"id":"P79_11","en":"Speaking of coffee, shall I grab you a cup too?","tpl":"[[Speaking of]] coffee, shall I grab you a cup too?","jp":"コーヒーといえば、あなたの分も買ってきましょうか？","scene":"職場","alts":["Want me to grab you a coffee too?"]},{"id":"P79_12","en":"Speaking of Kyoto, autumn foliage starts next week.","tpl":"[[Speaking of]] Kyoto, autumn foliage starts next week.","jp":"京都といえば、来週から紅葉が始まりますよ。","scene":"旅行","alts":["Kyoto's autumn leaves start next week."]},{"id":"P79_13","en":"Speaking of receipts, don't forget to submit yours Friday.","tpl":"[[Speaking of]] receipts, don't forget to submit yours Friday.","jp":"領収書といえば、金曜日に提出するのを忘れないでね。","scene":"海外出張","alts":["Remember to submit your receipts Friday."]},{"id":"P79_14","en":"Speaking of dessert, their matcha tiramisu is famous.","tpl":"[[Speaking of]] dessert, their matcha tiramisu is famous.","jp":"デザートといえば、ここの抹茶ティラミスが有名ですよ。","scene":"レストラン","alts":["Their matcha tiramisu is really popular."]},{"id":"P79_15","en":"Speaking of movies, have you seen anything good lately?","tpl":"[[Speaking of]] movies, have you seen anything good lately?","jp":"映画といえば、最近何か面白い作品観ましたか？","scene":"友人","alts":["Watched any good movies lately?"]},{"id":"P79_16","en":"Speaking of remote work, which days are you in the office?","tpl":"[[Speaking of]] remote work, which days are you in the office?","jp":"リモートワークといえば、何曜日が出社日ですか？","scene":"職場","alts":["Which days do you come into the office?"]},{"id":"P79_17","en":"Speaking of souvenirs, what's popular around here?","tpl":"[[Speaking of]] souvenirs, what's popular around here?","jp":"お土産といえば、この辺りで人気なのは何ですか？","scene":"買い物","alts":["What souvenirs are popular here?"]},{"id":"P79_18","en":"Speaking of time, we only have five minutes left.","tpl":"[[Speaking of]] time, we only have five minutes left.","jp":"時間といえば、もうあと5分しかありませんね。","scene":"会議","alts":["Looking at the clock, we have five minutes left."]},{"id":"P79_19","en":"Speaking of breakfast, what time does the buffet open?","tpl":"[[Speaking of]] breakfast, what time does the buffet open?","jp":"朝食といえば、ビュッフェは何時から開きますか？","scene":"ホテル","alts":["When does the breakfast buffet start?"]},{"id":"P79_20","en":"Speaking of which, I have a quick update to share.","tpl":"[[Speaking of]] which, I have a quick update to share.","jp":"そういえば、一つ手短に共有したいアップデートがあります。","scene":"会議","alts":["That reminds me, I have a quick update."]}]},{"id":"P80","catId":"cat8","pattern":"As far as I know, ...","meaning":"私の知る限りでは、〜","grammar":"As far as I know, + 主語 + 動詞 で、「自分が把握している範囲では〜です」と正確さと謙虚さを兼ね備えて伝えます。","usage":"ビジネスでの情報共有、営業時間やルールの案内、100%保証できない事実を誠実に伝える場面に最適です。","nuance":"誤情報のリスクを避けつつ、今手元にある最善の情報をプロらしく共有できる万能クッション表現です。","similar":"To my knowledge, ...（よりフォーマル）／ As far as I can tell, ...（見たところでは）","pitfall":"as far as を as long as（〜する限り［条件］）と混同しないよう注意しましょう！","dialogue":[{"speaker":"A","en":"Is the shuttle to terminal two running on normal hours today?","jp":"第2ターミナル行きのシャトルバスは今日通常運行していますか？"},{"speaker":"B","en":"As far as I know, yes—every fifteen minutes from the main entrance.","jp":"私の知る限りでははい、正面玄関から15分おきに出ています。"},{"speaker":"A","en":"Great! Do I need to book a seat ahead of time?","jp":"よかったです！事前に座席予約は必要ですか？"},{"speaker":"B","en":"As far as I know, it's first-come, first-served, so just head out five minutes early.","jp":"私の知る限り先着順なので、5分早めに外に出れば大丈夫ですよ。"}],"drills":{"subject":{"en":"As far as I know, everyone on the team approved the design.","jp":"私の知る限り、チームの全員がデザインを承認しました。"},"tense":{"en":"As far as I knew, the flight was still on schedule.","jp":"私が知っていた限りでは、フライトはまだ定刻通りでした。"},"negative":{"en":"As far as I know, there aren't any hidden fees.","jp":"私の知る限り、隠れた追加料金はありません。"},"question":{"en":"As far as you know, is the museum open on Mondays?","jp":"ご存知 ue yet.","jp":"私の知る限り、会場はまだ確定していません。","scene":"会議","alts":["The venue isn't confirmed yet, as far as I know."]},{"id":"P80_18","en":"As far as I know, returns are free within thirty days.","tpl":"[[As far as I know,]] returns are free within thirty days.","jp":"私の知る限り、30日以内なら返品無料です。","scene":"買い物","alts":["You have thirty days for free returns, I think."]},{"id":"P80_19","en":"As far as I know, he still lives in Seattle.","tpl":"[[As far as I know,]] he still lives in Seattle.","jp":"私の知る限り、彼は今でもシアトルに住んでいます。","scene":"友人","alts":["I believe he still lives in Seattle."]},{"id":"P80_20","en":"As far as I know, this is the fastest route to the airport.","tpl":"[[As far as I know,]] this is the fastest route to the airport.","jp":"私の知る限り、これが空港への一番速いルートです。","scene":"海外出張","alts":["This seems to be the quickest way to the airport."]}]}]};

/* ENGLISH 80 — iPhone Safari-Safe Audio & Speech Recognition Engine */
(function () {
  "use strict";

    "bags": "luggage", "trip": "vacation", "abroad": "overseas", "cell": "phone",
    "mobile": "phone", "laptop": "computer", "email": "mail", "draft": "file"

  function normalizeText(str) {
    let s = (str || "")
      .toLowerCase()
      .replace(/[’‘`]/g, "'")
      .replace(/[—–-]/g, " ")
      .replace(/[^a-z0-9'\s]/g, " ")
      .replace(/\s+/g, " ")
      .trim();
    if (!s) return "";
    const expanded = s.split(" ").map((w) => CONTRACTIONS[w] || w).join(" ");
    return expanded.replace(/'/g, "").replace(/\s+/g, " ").trim();

  function tokenize(str) {
    const n = normalizeText(str);

  class AudioEngine {

        ("SpeechRecognition" in window || "webkitSpeechRecognition" in window);

    _pickVoice(lang) {
