.（うまくいけば〜）","pitfall":"× I hope you to succeed は誤り。hope は人＋to不定詞を取れないので I hope you succeed. と節を続けます。","dialogue":[{"speaker":"A","en":"Our flight leaves in two hours, and it's starting to snow.","jp":"フライトまであと2時間なのに雪が降ってきたよ。"},{"speaker":"B","en":"I hope our flight doesn't get delayed.","jp":"フライトが遅れないといいな。"},{"speaker":"A","en":"Same here. I checked the app and it's still on time for now.","jp":"同感。アプリを見たら今のところ定刻通りだったよ。"},{"speaker":"B","en":"Fingers crossed! I hope we make our connecting flight smoothly.","jp":"祈ろう！乗り継ぎ便にスムーズに乗れるといいね。"}],"drills":{"subject":{"en":"She hopes the weather clears up by noon.","jp":"彼女は正午までに天気が晴れることを願っています。"},"tense":{"en":"I hoped we could finish before the deadline.","jp":"締め切り前に終わるといいなと思っていました。"},"negative":{"en":"I hope it doesn't rain during the outdoor event.","jp":"屋外イベントの間に雨が降らないといいな。"},"question":{"en":"Do you hope to work overseas in the future?","jp":"将来は海外で働きたいと思っていますか？"}},"examples":[{"id":"P17_01","en":"I hope you're doing well.","tpl":"[[I hope]] you're doing well.","jp":"お元気でいらっしゃることを願っています。","scene":"職場","alts":["Hope you are doing well."]},{"id":"P17_02","en":"I hope it doesn't rain tomorrow.","tpl":"[[I hope]] it doesn't rain tomorrow.","jp":"明日雨が降らないといいな。","scene":"日常","alts":["Hopefully it won't rain tomorrow."]},{"id":"P17_03","en":"I hope you have a safe flight home.","tpl":"[[I hope]] you have a safe flight home.","jp":"ご無事にご帰国されることを願っています。","scene":"海外出張","alts":["Have a safe flight home."]},{"id":"P17_04","en":"I hope we can meet again soon.","tpl":"[[I hope]] we can meet again soon.","jp":"また近いうちにお会いできるといいですね。","scene":"友人","alts":["Hopefully we can see each other again soon."]},{"id":"P17_05","en":"I hope this information helps.","tpl":"[[I hope]] this information helps.","jp":"この情報がお役に立てば幸いです。","scene":"職場","alts":["I hope you find this helpful."]},{"id":"P17_06","en":"I hope the traffic isn't too bad this morning.","tpl":"[[I hope]] the traffic isn't too bad this morning.","jp":"今朝は渋滞がひどくないといいな。","scene":"日常","alts":["Hopefully traffic is light this morning."]},{"id":"P17_07","en":"I hope my luggage arrives without any issues.","tpl":"[[I hope]] my luggage arrives without any issues.","jp":"荷物が問題なく届くといいな。","scene":"旅行","alts":["Hopefully my bags arrive safely."]},{"id":"P17_08","en":"I hope you enjoy your stay in Yokohama.","tpl":"[[I hope]] you enjoy your stay in Yokohama.","jp":"横浜での滞在を楽しんでいただけるとうれしいです。","scene":"ホテル","alts":["Hope you have a great stay in Yokohama."]},{"id":"P17_09","en":"I hope we can reach an agreement today.","tpl":"[[I hope]] we can reach an agreement today.","jp":"今日中に合意できるといいですね。","scene":"会議","alts":["Hopefully we can agree today."]},{"id":"P17_10","en":"I hope you feel better soon.","tpl":"[[I hope]] you feel better soon.","jp":"早く良くなるといいですね。","scene":"友人","alts":["Get well soon."]},{"id":"P17_11","en":"I hope they still have my size in stock.","tpl":"[[I hope]] they still have my size in stock.","jp":"私のサイズがまだ在庫にあるといいな。","scene":"買い物","alts":["Hopefully they still have my size."]},{"id":"P17_12","en":"I hope I didn't keep you waiting too long.","tpl":"[[I hope]] I didn't keep you waiting too long.","jp":"あまり長くお待たせしていなければいいのですが。","scene":"職場","alts":["Sorry if I kept you waiting."]},{"id":"P17_13","en":"I hope the restaurant isn't fully booked.","tpl":"[[I hope]] the restaurant isn't fully booked.","jp":"レストランが満席じゃないといいな。","scene":"レストラン","alts":["Hopefully the restaurant has a table."]},{"id":"P17_14","en":"I hope the presentation goes smoothly.","tpl":"[[I hope]] the presentation goes smoothly.","jp":"プレゼンがスムーズに進むといいな。","scene":"会議","alts":["Hopefully the presentation goes well."]},{"id":"P17_15","en":"I hope to visit Europe again next year.","tpl":"[[I hope]] to visit Europe again next year.","jp":"来年またヨーロッパを訪れたいと思っています。","scene":"旅行","alts":["I am hoping to go back to Europe next year."]},{"id":"P17_16","en":"I hope we finish on time today.","tpl":"[[I hope]] we finish on time today.","jp":"今日は時間通りに終わるといいな。","scene":"会議","alts":["Hopefully we wrap up on schedule."]},{"id":"P17_17","en":"I hope my English was clear enough.","tpl":"[[I hope]] my English was clear enough.","jp":"私の英語が十分伝わっていればいいのですが。","scene":"海外出張","alts":["I hope I explained that clearly."]},{"id":"P17_18","en":"I hope you have a relaxing weekend.","tpl":"[[I hope]] you have a relaxing weekend.","jp":"ゆっくりできる週末になるといいですね。","scene":"職場","alts":["Have a relaxing weekend."]},{"id":"P17_19","en":"I hope the Wi-Fi works well in the hotel room.","tpl":"[[I hope]] the Wi-Fi works well in the hotel room.","jp":"ホテルの部屋のWi-Fiがちゃんとつながるといいな。","scene":"ホテル","alts":["Hopefully the hotel Wi-Fi is reliable."]},{"id":"P17_20","en":"I hope everything works out for the best.","tpl":"[[I hope]] everything works out for the best.","jp":"すべてうまくいくことを願っています。","scene":"友人","alts":["Hopefully everything turns out well."]}]},{"id":"P18","catId":"cat2","pattern":"I've decided to ...","meaning":"〜することに決めました","grammar":"I have decided to の短縮形 + 動詞の原形 で、すでに決断し、今その決定を持っている状態を表します。","usage":"進路・転職・引っ越し・購入・方針決定など、迷った末の決断を報告するときに使います。","nuance":"I decided to ...（過去に決めた事実）より、現在完了の I've decided to ... は「今まさにそう決めている」という臨場感があります。","similar":"I've made up my mind to ...（固く決心した）／ I'm going to ...（予定をさらっと言う）","pitfall":"「〜しないことに決めた」は I've decided not to ... と to の直前に not を置きます。","dialogue":[{"speaker":"A","en":"Did you figure out whether you're going to the summit?","jp":"サミットに行くかどうか決まりましたか？"},{"speaker":"B","en":"Yes, I've decided to attend in person this year.","jp":"はい、今年は現地で参加することに決めました。"},{"speaker":"A","en":"Awesome! It's so much easier to network face to face.","jp":"最高ですね！対面のほうがずっと人脈を広げやすいですから。"},{"speaker":"B","en":"Totally. I've also decided to stay an extra day to visit our partner office.","jp":"本当に。パートナー企業のオフィスを訪問するためにもう1日延泊することにも決めました。"}],"drills":{"subject":{"en":"Our team has decided to postpone the release by one week.","jp":"チームはリリースを1週間延期することに決めました。"},"tense":{"en":"I decided to take the job offer last Friday.","jp":"先週の金曜日にその内定を受けることに決めました。"},"negative":{"en":"I've decided not to renew that subscription.","jp":"そのサブスクリプションは更新しないことに決めました。"},"question":{"en":"Have you decided where to go for lunch?","jp":"お昼はどこに行くか決めましたか？"}},"examples":[{"id":"P18_01","en":"I've decided to study English for thirty minutes every day.","tpl":"[[I've decided to]] study English for thirty minutes every day.","jp":"毎日30分英語を勉強することに決めました。","scene":"日常","alts":["I decided to practice English thirty minutes a day."]},{"id":"P18_02","en":"I've decided to accept the job offer.","tpl":"[[I've decided to]] accept the job offer.","jp":"そのオファーを受けることに決めました。","scene":"職場","alts":["I decided to take the job."]},{"id":"P18_03","en":"I've decided to take the morning train instead.","tpl":"[[I've decided to]] take the morning train instead.","jp":"代わりに朝の電車に乗ることに決めました。","scene":"旅行","alts":["I decided to catch the morning train."]},{"id":"P18_04","en":"I've decided to buy the navy coat.","tpl":"[[I've decided to]] buy the navy coat.","jp":"ネイビーのコートを買うことに決めました。","scene":"買い物","alts":["I am going with the navy coat."]},{"id":"P18_05","en":"I've decided to stay at a hotel near the conference hall.","tpl":"[[I've decided to]] stay at a hotel near the conference hall.","jp":"会場近くのホテルに泊まることに決めました。","scene":"ホテル","alts":["I chose a hotel near the venue."]},{"id":"P18_06","en":"I've decided to cut back on late-night snacks.","tpl":"[[I've decided to]] cut back on late-night snacks.","jp":"夜食を控えることに決めました。","scene":"日常","alts":["I decided to stop eating late at night."]},{"id":"P18_07","en":"I've decided to postpone my trip until next month.","tpl":"[[I've decided to]] postpone my trip until next month.","jp":"旅行を来月に延期することに決めました。","scene":"旅行","alts":["I decided to push my trip to next month."]},{"id":"P18_08","en":"I've decided to use a simpler layout for the slides.","tpl":"[[I've decided to]] use a simpler layout for the slides.","jp":"スライドにもっとシンプルなレイアウトを使うことにしました。","scene":"会議","alts":["I decided to simplify the slide layout."]},{"id":"P18_09","en":"I've decided to join the marathon this autumn.","tpl":"[[I've decided to]] join the marathon this autumn.","jp":"今年の秋にマラソンに参加することに決めました。","scene":"友人","alts":["I signed up for the autumn marathon."]},{"id":"P18_10","en":"I've decided to order the chef's tasting course.","tpl":"[[I've decided to]] order the chef's tasting course.","jp":"シェフのおまかせコースを頼むことに決めました。","scene":"レストラン","alts":["I will go with the tasting menu."]},{"id":"P18_11","en":"I've decided to delegate this task to the junior team.","tpl":"[[I've decided to]] delegate this task to the junior team.","jp":"この作業は若手チームに任せることにしました。","scene":"職場","alts":["I decided to hand this task to the junior team."]},{"id":"P18_12","en":"I've decided to travel carry-on only this time.","tpl":"[[I've decided to]] travel carry-on only this time.","jp":"今回は機内持ち込み荷物だけで行くことにしました。","scene":"海外出張","alts":["I decided not to check any bags this time."]},{"id":"P18_13","en":"I've decided to wake up an hour earlier on weekdays.","tpl":"[[I've decided to]] wake up an hour earlier on weekdays.","jp":"平日は1時間早く起きることに決めました。","scene":"日常","alts":["I decided to get up an hour earlier."]},{"id":"P18_14","en":"I've decided to switch to a new phone carrier.","tpl":"[[I've decided to]] switch to a new phone carrier.","jp":"携帯会社を乗り換えることに決めました。","scene":"買い物","alts":["I decided to change my mobile carrier."]},{"id":"P18_15","en":"I've decided to focus on one priority at a time.","tpl":"[[I've decided to]] focus on one priority at a time.","jp":"一度に一つの優先事項に集中することにしました。","scene":"職場","alts":["I decided to focus on one thing at a time."]},{"id":"P18_16","en":"I've decided to take a direct bus from the airport.","tpl":"[[I've decided to]] take a direct bus from the airport.","jp":"空港から直通バスに乗ることにしました。","scene":"旅行","alts":["I decided to ride the direct airport bus."]},{"id":"P18_17","en":"I've decided to ask for a quiet room away from the elevator.","tpl":"[[I've decided to]] ask for a quiet room away from the elevator.","jp":"エレベーターから離れた静かな部屋を頼むことにしました。","scene":"ホテル","alts":["I will request a room away from the elevator."]},{"id":"P18_18","en":"I've decided to start keeping a daily journal in English.","tpl":"[[I've decided to]] start keeping a daily journal in English.","jp":"毎日英語で日記をつけることに決めました。","scene":"日常","alts":["I decided to write an English diary daily."]},{"id":"P18_19","en":"I've decided to keep the presentation under ten minutes.","tpl":"[[I've decided to]] keep the presentation under ten minutes.","jp":"プレゼンは10分以内に収めることに決めました。","scene":"会議","alts":["I decided to limit the talk to ten minutes."]},{"id":"P18_20","en":"I've decided to cook at home more often this month.","tpl":"[[I've decided to]] cook at home more often this month.","jp":"今月はもっと自炊を増やすことにしました。","scene":"日常","alts":["I decided to cook more at home this month."]}]},{"id":"P19","catId":"cat2","pattern":"I'd rather ...","meaning":"どちらかというと〜したい","grammar":"I would rather の短縮形 + 動詞の原形（比較対象があるときは than + 動詞の原形）で、その場での優先選択を表します。","usage":"食事の選択、移動手段の相談、予定の調整、丁寧な断り方として非常に自然なネイティブ表現です。","nuance":"prefer が一般的な好みを表すのに対し、I'd rather は「今この状況ならこっちがいい」という具体的な選択に使います。","similar":"I'd prefer to ...（やや丁寧）／ I'd rather not ...（どちらかというと遠慮したい）","pitfall":"rather の後ろに to は入れません（× I'd rather to stay → ○ I'd rather stay）。否定は I'd rather not + 原形です。","dialogue":[{"speaker":"A","en":"Do you want to take a cab or walk back to the hotel?","jp":"ホテルまでタクシーにしますか、それとも歩きますか？"},{"speaker":"B","en":"It's such a nice evening. I'd rather walk than sit in traffic.","jp":"気持ちのいい夜ですね。渋滞にハマるより歩きたいです。"},{"speaker":"A","en":"Agreed! It's only about fifteen minutes along the river.","jp":"賛成！川沿いを歩けば15分くらいですから。"},{"speaker":"B","en":"Perfect. Maybe we can grab gelato on the way.","jp":"完璧ですね。途中でジェラートでも買えるかも。"}],"drills":{"subject":{"en":"He'd rather work quietly in the morning.","jp":"彼は朝、静かに仕事をする方を好みます。"},"tense":{"en":"I'd rather have taken the earlier flight.","jp":"もっと早い便に乗ればよかったです。"},"negative":{"en":"I'd rather not discuss budget details in a public café.","jp":"予算の詳細は公共のカフェでは話さない方がいいと思います。"},"question":{"en":"Would you rather eat Japanese or Italian tonight?","jp":"今夜は和食とイタリアン、どちらがいいですか？"}},"examples":[{"id":"P19_01","en":"I'd rather stay home tonight and relax.","tpl":"[[I'd rather]] stay home tonight and relax.","jp":"今夜は家にいてゆっくりしたいです。","scene":"日常","alts":["I would rather stay in tonight."]},{"id":"P19_02","en":"I'd rather take the train than drive in the rain.","tpl":"[[I'd rather]] take the train than drive in the rain.","jp":"雨の中で運転するより電車に乗りたいです。","scene":"日常","alts":["I prefer taking the train over driving in the rain."]},{"id":"P19_03","en":"I'd rather meet in the morning if you're free.","tpl":"[[I'd rather]] meet in the morning if you're free.","jp":"空いていれば午前中に会いたいです。","scene":"会議","alts":["I would prefer a morning meeting if possible."]},{"id":"P19_04","en":"I'd rather sit inside—it's a bit windy out here.","tpl":"[[I'd rather]] sit inside—it's a bit windy out here.","jp":"少し風があるので中の席にしたいです。","scene":"レストラン","alts":["Can we sit inside instead?"]},{"id":"P19_05","en":"I'd rather finish this today than leave it for Monday.","tpl":"[[I'd rather]] finish this today than leave it for Monday.","jp":"月曜日に残すより今日終わらせたいです。","scene":"職場","alts":["I want to get this done today instead of Monday."]},{"id":"P19_06","en":"I'd rather pay a little extra for a direct flight.","tpl":"[[I'd rather]] pay a little extra for a direct flight.","jp":"少し高くても直行便にしたいです。","scene":"海外出張","alts":["I prefer paying more for a nonstop flight."]},{"id":"P19_07","en":"I'd rather have green tea than coffee right now.","tpl":"[[I'd rather]] have green tea than coffee right now.","jp":"今はコーヒーより緑茶が飲みたいです。","scene":"レストラン","alts":["I would prefer green tea right now."]},{"id":"P19_08","en":"I'd rather wait until we have all the facts.","tpl":"[[I'd rather]] wait until we have all the facts.","jp":"事実がすべてそろうまで待ちたいです。","scene":"会議","alts":["Let's wait until we have all the information."]},{"id":"P19_09","en":"I'd rather walk to the museum since it's close.","tpl":"[[I'd rather]] walk to the museum since it's close.","jp":"近いので美術館まで歩きたいです。","scene":"旅行","alts":["I prefer walking to the museum."]},{"id":"P19_10","en":"I'd rather not share personal details online.","tpl":"[[I'd rather]] not share personal details online.","jp":"個人情報はネット上で共有したくないです。","scene":"日常","alts":["I prefer not to post personal info online."]},{"id":"P19_11","en":"I'd rather check out the smaller local shops.","tpl":"[[I'd rather]] check out the smaller local shops.","jp":"地元の小さなお店を見て回りたいです。","scene":"買い物","alts":["I prefer visiting small local shops."]},{"id":"P19_12","en":"I'd rather talk over the phone than write ten emails.","tpl":"[[I'd rather]] talk over the phone than write ten emails.","jp":"メールを10通書くより電話で話したいです。","scene":"職場","alts":["Calling is easier than sending ten emails."]},{"id":"P19_13","en":"I'd rather book a room with a desk for work.","tpl":"[[I'd rather]] book a room with a desk for work.","jp":"仕事用にデスクのある部屋を予約したいです。","scene":"ホテル","alts":["I prefer a room with a work desk."]},{"id":"P19_14","en":"I'd rather eat something light before the flight.","tpl":"[[I'd rather]] eat something light before the flight.","jp":"フライト前は何か軽いものを食べたいです。","scene":"旅行","alts":["I want a light meal before flying."]},{"id":"P19_15","en":"I'd rather keep the slides simple and visual.","tpl":"[[I'd rather]] keep the slides simple and visual.","jp":"スライドはシンプルで視覚的にまとめたいです。","scene":"会議","alts":["I prefer simple, visual slides."]},{"id":"P19_16","en":"I'd rather leave early to avoid the rush hour.","tpl":"[[I'd rather]] leave early to avoid the rush hour.","jp":"ラッシュアワーを避けるために早く出たいです。","scene":"日常","alts":["I want to leave early to beat the rush."]},{"id":"P19_17","en":"I'd rather try a local dish than fast food.","tpl":"[[I'd rather]] try a local dish than fast food.","jp":"ファストフードより地元の料理を試したいです。","scene":"レストラン","alts":["I prefer trying local food over fast food."]},{"id":"P19_18","en":"I'd rather not rush into a final contract today.","tpl":"[[I'd rather]] not rush into a final contract today.","jp":"今日急いで最終契約には進まない方がいいと思います。","scene":"海外出張","alts":["I prefer not to finalize the contract today."]},{"id":"P19_19","en":"I'd rather spend Sunday reading at the park.","tpl":"[[I'd rather]] spend Sunday reading at the park.","jp":"日曜日は公園で読書をして過ごしたいです。","scene":"友人","alts":["I want to spend Sunday reading in the park."]},{"id":"P19_20","en":"I'd rather carry a backpack than a shoulder bag.","tpl":"[[I'd rather]] carry a backpack than a shoulder bag.","jp":"ショルダーバッグよりリュックを持ちたいです。","scene":"買い物","alts":["I prefer a backpack to a shoulder bag."]}]},{"id":"P20","catId":"cat2","pattern":"I'm about to ...","meaning":"ちょうど〜するところです","grammar":"I'm about to + 動詞の原形 で、「まさに今から数秒〜数分以内に〜する直前」という切迫した未来を表します。","usage":"電話に出たとき、会議が始まる直前、出発の直前、搭乗前など、今のタイミングを伝えるときに便利です。","nuance":"I'm going to よりも圧倒的に「今すぐ・まさに直前」というスピード感があります。","similar":"I'm just about to ...（まさに今〜するところ）／ I'm on the verge of ...（〜しかけている）","pitfall":"about to の後ろに具体的な未来の時間（tomorrow など）は付けません（× I'm about to go tomorrow）。","dialogue":[{"speaker":"A","en":"Hey, do you have a minute to talk about the design?","jp":"ねえ、デザインについて少し話す時間はある？"},{"speaker":"B","en":"Sorry, I'm about to board my flight to Osaka!","jp":"ごめん、ちょうど大阪行きの飛行機に搭乗するところなんだ！"},{"speaker":"A","en":"Oh, my bad! Have a safe flight. Let's talk after you land.","jp":"あ、ごめんごめん！気をつけて。着いたら話そう。"},{"speaker":"B","en":"Will do! I'll message you as soon as I'm off the plane.","jp":"了解！飛行機を降りたらすぐ連絡するね。"}],"drills":{"subject":{"en":"The presentation is about to begin in two minutes.","jp":"プレゼンはあと2分で始まるところです。"},"tense":{"en":"I was about to leave when you called.","jp":"あなたが電話をくれたとき、ちょうど出るところでした。"},"negative":{"en":"I'm not about to give up after coming this far.","jp":"ここまで来て諦めるつもりはありません。"},"question":{"en":"Are you about to head out for lunch?","jp":"ちょうどお昼に出かけるところですか？"}},"examples":[{"id":"P20_01","en":"I'm about to leave the office now.","tpl":"[[I'm about to]] leave the office now.","jp":"ちょうど今オフィスを出るところです。","scene":"職場","alts":["I am just leaving the office."]},{"id":"P20_02","en":"I'm about to board the plane—talk to you later.","tpl":"[[I'm about to]] board the plane—talk to you later.","jp":"ちょうど飛行機に乗るところなので、また後で。","scene":"海外出張","alts":["I am boarding the plane right now."]},{"id":"P20_03","en":"I'm about to join the Zoom call.","tpl":"[[I'm about to]] join the Zoom call.","jp":"ちょうどZoom会議に参加するところです。","scene":"会議","alts":["I am jumping on the Zoom call now."]},{"id":"P20_04","en":"I'm about to head to the station.","tpl":"[[I'm about to]] head to the station.","jp":"ちょうど駅に向かうところです。","scene":"日常","alts":["I am just heading out to the station."]},{"id":"P20_05","en":"I'm about to send you the updated link.","tpl":"[[I'm about to]] send you the updated link.","jp":"ちょうど更新版のリンクを送るところです。","scene":"職場","alts":["I am sending the updated link right now."]},{"id":"P20_06","en":"I'm about to order coffee—do you want anything?","tpl":"[[I'm about to]] order coffee—do you want anything?","jp":"ちょうどコーヒーを頼むところだけど、何かいる？","scene":"友人","alts":["I am ordering coffee; want anything?"]},{"id":"P20_07","en":"I'm about to check out of the hotel.","tpl":"[[I'm about to]] check out of the hotel.","jp":"ちょうどホテルをチェックアウトするところです。","scene":"ホテル","alts":["I am just checking out now."]},{"id":"P20_08","en":"I'm about to start cooking dinner.","tpl":"[[I'm about to]] start cooking dinner.","jp":"ちょうど夕食を作り始めるところです。","scene":"日常","alts":["I am just starting dinner."]},{"id":"P20_09","en":"I'm about to step into a client meeting.","tpl":"[[I'm about to]] step into a client meeting.","jp":"ちょうど顧客との会議に入るところです。","scene":"職場","alts":["I am walking into a client meeting."]},{"id":"P20_10","en":"I'm about to pay at the register.","tpl":"[[I'm about to]] pay at the register.","jp":"ちょうどレジで会計するところです。","scene":"買い物","alts":["I am at the register about to pay."]},{"id":"P20_11","en":"I'm about to wrap up this document.","tpl":"[[I'm about to]] wrap up this document.","jp":"ちょうどこの書類を仕上げるところです。","scene":"職場","alts":["I am just finishing this document."]},{"id":"P20_12","en":"I'm about to get off the train at the next stop.","tpl":"[[I'm about to]] get off the train at the next stop.","jp":"次の駅でちょうど電車を降りるところです。","scene":"日常","alts":["I am getting off at the next stop."]},{"id":"P20_13","en":"I'm about to go through airport security.","tpl":"[[I'm about to]] go through airport security.","jp":"ちょうど空港の保安検査を通るところです。","scene":"旅行","alts":["I am heading through security now."]},{"id":"P20_14","en":"I'm about to call the restaurant to confirm.","tpl":"[[I'm about to]] call the restaurant to confirm.","jp":"ちょうど確認のためレストランに電話するところです。","scene":"レストラン","alts":["I am just about to call the restaurant."]},{"id":"P20_15","en":"I'm about to take a quick lunch break.","tpl":"[[I'm about to]] take a quick lunch break.","jp":"ちょうどお昼休憩に入るところです。","scene":"職場","alts":["I am just heading to lunch."]},{"id":"P20_16","en":"I'm about to print out the boarding pass.","tpl":"[[I'm about to]] print out the boarding pass.","jp":"ちょうど搭乗券を印刷するところです。","scene":"海外出張","alts":["I am printing my boarding pass right now."]},{"id":"P20_17","en":"I'm about to turn off my laptop for the night.","tpl":"[[I'm about to]] turn off my laptop for the night.","jp":"ちょうど今夜のパソコンを閉じるところです。","scene":"日常","alts":["I am shutting down my laptop now."]},{"id":"P20_18","en":"I'm about to walk into the conference room.","tpl":"[[I'm about to]] walk into the conference room.","jp":"ちょうど会議室に入るところです。","scene":"会議","alts":["I am stepping into the meeting room."]},{"id":"P20_19","en":"I'm about to ask the waiter for the check.","tpl":"[[I'm about to]] ask the waiter for the check.","jp":"ちょうど店員さんにお会計を頼むところです。","scene":"レストラン","alts":["I am about to ask for the bill."]},{"id":"P20_20","en":"I'm about to run out of battery, so let's be quick.","tpl":"[[I'm about to]] run out of battery, so let's be quick.","jp":"ちょうど電池が切れそうなので手短に話しましょう。","scene":"日常","alts":["My battery is almost dead, so let's make it quick."]}]},{"id":"P21","catId":"cat3","pattern":"I think ...","meaning":"〜だと思います","grammar":"I think (that) + 主語 + 動詞 で、自分の意見や推測をシンプルに述べます。","usage":"会議での意見表明、日常の感想、おすすめの共有など、英語会話で最も使用頻度の高い構文です。","nuance":"断定を避けて柔らかく自分の意見を伝えられます。会話では that はほぼ省略されます。","similar":"I believe ...（より確信がある）／ In my opinion, ...（意見であることを明確にする）","pitfall":"否定意見を言うときは I think ... not ではなく、P22 の I don't think ... を使うのが自然です。","dialogue":[{"speaker":"A","en":"What do you think of the new homepage design?","jp":"新しいホームページのデザインはどう思いますか？"},{"speaker":"B","en":"I think it looks super clean and easy to navigate.","jp":"とてもすっきりしていて使いやすいと思います。"},{"speaker":"A","en":"Anything we should tweak before Friday?","jp":"金曜日までに微調整すべき点はありますか？"},{"speaker":"B","en":"I think the call-to-action button could be a bit larger on mobile.","jp":"スマホではアクションボタンをもう少し大きくしてもいいと思います。"}],"drills":{"subject":{"en":"She thinks we should hire one more designer.","jp":"彼女はデザイナーをもう1人採用すべきだと考えています。"},"tense":{"en":"I thought the meeting was scheduled for three.","jp":"会議は3時の予定だと思っていました。"},"negative":{"en":"I don't think we need to change the schedule.","jp":"スケジュールを変更する必要はないと思います。"},"question":{"en":"Do you think this hotel is close enough to the venue?","jp":"このホテルは会場に十分近いと思いますか？"}},"examples":[{"id":"P21_01","en":"I think this is a great idea.","tpl":"[[I think]] this is a great idea.","jp":"これは素晴らしいアイデアだと思います。","scene":"会議","alts":["That sounds like a great idea."]},{"id":"P21_02","en":"I think we should leave a bit earlier.","tpl":"[[I think]] we should leave a bit earlier.","jp":"もう少し早く出発した方がいいと思います。","scene":"旅行","alts":["We should probably leave earlier."]},{"id":"P21_03","en":"I think the price is very reasonable.","tpl":"[[I think]] the price is very reasonable.","jp":"価格はとても良心的だと思います。","scene":"買い物","alts":["The price seems very fair."]},{"id":"P21_04","en":"I think we need more data before deciding.","tpl":"[[I think]] we need more data before deciding.","jp":"決める前にもっとデータが必要だと思います。","scene":"会議","alts":["We probably need more data first."]},{"id":"P21_05","en":"I think it's going to rain this evening.","tpl":"[[I think]] it's going to rain this evening.","jp":"今夜は雨が降ると思います。","scene":"日常","alts":["It looks like it will rain tonight."]},{"id":"P21_06","en":"I think the salmon dish is their specialty.","tpl":"[[I think]] the salmon dish is their specialty.","jp":"サーモン料理がこの店の名物だと思います。","scene":"レストラン","alts":["I believe the salmon is their signature dish."]},{"id":"P21_07","en":"I think you did an amazing job on the slides.","tpl":"[[I think]] you did an amazing job on the slides.","jp":"スライドの出来は本当に素晴らしかったと思います。","scene":"職場","alts":["You did a fantastic job on the slides."]},{"id":"P21_08","en":"I think we're heading in the right direction.","tpl":"[[I think]] we're heading in the right direction.","jp":"正しい方向に進んでいると思います。","scene":"会議","alts":["We seem to be on the right track."]},{"id":"P21_09","en":"I think this hotel is perfect for business trips.","tpl":"[[I think]] this hotel is perfect for business trips.","jp":"このホテルは出張にぴったりだと思います。","scene":"ホテル","alts":["This hotel is ideal for business travel."]},{"id":"P21_10","en":"I think I left my charger at the office.","tpl":"[[I think]] I left my charger at the office.","jp":"オフィスに充電器を忘れたと思います。","scene":"日常","alts":["I might have left my charger at work."]},{"id":"P21_11","en":"I think the train is faster than a taxi right now.","tpl":"[[I think]] the train is faster than a taxi right now.","jp":"今の時間帯はタクシーより電車の方が速いと思います。","scene":"海外出張","alts":["Taking the train is probably faster than a cab now."]},{"id":"P21_12","en":"I think we should double-check the contract terms.","tpl":"[[I think]] we should double-check the contract terms.","jp":"契約条件を再確認すべきだと思います。","scene":"職場","alts":["We ought to review the contract terms again."]},{"id":"P21_13","en":"I think the blue shirt suits you better.","tpl":"[[I think]] the blue shirt suits you better.","jp":"青いシャツの方がよく似合っていると思います。","scene":"買い物","alts":["The blue shirt looks better on you."]},{"id":"P21_14","en":"I think everyone enjoyed the team dinner.","tpl":"[[I think]] everyone enjoyed the team dinner.","jp":"みんなチームディナーを楽しんだと思います。","scene":"職場","alts":["It seemed like everyone had fun at dinner."]},{"id":"P21_15","en":"I think this neighborhood is really peaceful.","tpl":"[[I think]] this neighborhood is really peaceful.","jp":"この辺りはとても静かで落ち着いていますね。","scene":"旅行","alts":["This area feels really peaceful."]},{"id":"P21_16","en":"I think we have enough time for one more question.","tpl":"[[I think]] we have enough time for one more question.","jp":"あと1つ質問する時間は十分あると思います。","scene":"会議","alts":["We can probably take one more question."]},{"id":"P21_17","en":"I think I'll have the iced latte today.","tpl":"[[I think]] I'll have the iced latte today.","jp":"今日はアイスラテにしようと思います。","scene":"レストラン","alts":["I will probably get the iced latte today."]},{"id":"P21_18","en":"I think practicing out loud makes a huge difference.","tpl":"[[I think]] practicing out loud makes a huge difference.","jp":"声に出して練習すると大きな違いが出ると思います。","scene":"日常","alts":["Speaking aloud really helps."]},{"id":"P21_19","en":"I think the new system will save us hours.","tpl":"[[I think]] the new system will save us hours.","jp":"新しいシステムで何時間も節約できると思います。","scene":"職場","alts":["The new system should save us a lot of time."]},{"id":"P21_20","en":"I think we should keep it simple for the users.","tpl":"[[I think]] we should keep it simple for the users.","jp":"ユーザーのためにシンプルに保つべきだと思います。","scene":"会議","alts":["Keeping it simple for users is best."]}]},{"id":"P22","catId":"cat3","pattern":"I don't think ...","meaning":"〜だとは思いません","grammar":"I don't think + 肯定の節 で、後ろの内容を柔らかく否定します。","usage":"会議での反対意見、スケジュール調整、買い物での判断、丁寧な否定の場面で必須の構文です。","nuance":"英語では否定の not を前の think に付けるのが自然。相手を傷つけず穏やかに「そうは思わない」と伝えられます。","similar":"I'm not sure if ...（〜かどうか分からない）／ I doubt that ...（〜かどうか疑わしい）","pitfall":"× I think he won't come ではなく ○ I don't think he will come のように前に否定を置くのがネイティブの標準です。","dialogue":[{"speaker":"A","en":"Should we add three more features before next Friday's launch?","jp":"来週金曜のローンチ前にあと3つ機能を追加すべきでしょうか？"},{"speaker":"B","en":"I don't think we have enough time to test them properly.","jp":"それらをしっかりテストする時間は足りないと思います。"},{"speaker":"A","en":"True. Quality matters more than rushing extra features.","jp":"確かに。機能を急いで増やすより品質の方が大事ですね。"},{"speaker":"B","en":"Exactly. Let's save them for the next update.","jp":"その通りです。次のアップデートに回しましょう。"}],"drills":{"subject":{"en":"He doesn't think the delay will affect our delivery.","jp":"彼はその遅れが納期に影響するとは思っていません。"},"tense":{"en":"I didn't think the line would be this long.","jp":"行列がこんなに長いとは思いませんでした。"},"negative":{"en":"I don't think it's worth spending that much.","jp":"そこまでお金をかける価値はないと思います。"},"question":{"en":"Don't you think we should confirm with the client first?","jp":"まずクライアントに確認した方がいいと思いませんか？"}},"examples":[{"id":"P22_01","en":"I don't think we can finish by five today.","tpl":"[[I don't think]] we can finish by five today.","jp":"今日5時までに終わるとは思いません。","scene":"職場","alts":["I doubt we will finish by five today."]},{"id":"P22_02","en":"I don't think that's necessary right now.","tpl":"[[I don't think]] that's necessary right now.","jp":"今はそれは必要ないと思います。","scene":"会議","alts":["I think that is unnecessary right now."]},{"id":"P22_03","en":"I don't think I can make it to dinner tonight.","tpl":"[[I don't think]] I can make it to dinner tonight.","jp":"今夜の夕食には行けそうにありません。","scene":"友人","alts":["I probably can't make dinner tonight."]},{"id":"P22_04","en":"I don't think this size will fit me.","tpl":"[[I don't think]] this size will fit me.","jp":"このサイズは私には合わないと思います。","scene":"買い物","alts":["This size probably won't fit me."]},{"id":"P22_05","en":"I don't think we need a rental car in Tokyo.","tpl":"[[I don't think]] we need a rental car in Tokyo.","jp":"東京でレンタカーは必要ないと思います。","scene":"旅行","alts":["A rental car isn't really needed in Tokyo."]},{"id":"P22_06","en":"I don't think the Wi-Fi is working properly.","tpl":"[[I don't think]] the Wi-Fi is working properly.","jp":"Wi-Fiがちゃんと動いていないようです。","scene":"ホテル","alts":["The Wi-Fi doesn't seem to be working."]},{"id":"P22_07","en":"I don't think he saw my message yet.","tpl":"[[I don't think]] he saw my message yet.","jp":"彼はまだ私のメッセージを見ていないと思います。","scene":"職場","alts":["He probably hasn't read my message yet."]},{"id":"P22_08","en":"I don't think this restaurant takes credit cards.","tpl":"[[I don't think]] this restaurant takes credit cards.","jp":"このレストランはクレジットカードが使えないと思います。","scene":"レストラン","alts":["This place might be cash only."]},{"id":"P22_09","en":"I don't think we've met before.","tpl":"[[I don't think]] we've met before.","jp":"以前お会いしたことはないと思います。","scene":"自己紹介","alts":["I believe this is our first time meeting."]},{"id":"P22_10","en":"I don't think it's going to snow today.","tpl":"[[I don't think]] it's going to snow today.","jp":"今日は雪は降らないと思います。","scene":"日常","alts":["It probably won't snow today."]},{"id":"P22_11","en":"I don't think that approach will solve the root issue.","tpl":"[[I don't think]] that approach will solve the root issue.","jp":"そのやり方では根本的な問題は解決しないと思います。","scene":"会議","alts":["That approach probably won't fix the core issue."]},{"id":"P22_12","en":"I don't think we have enough seats for everyone.","tpl":"[[I don't think]] we have enough seats for everyone.","jp":"全員分の席が足りていないと思います。","scene":"レストラン","alts":["There probably aren't enough seats for all of us."]},{"id":"P22_13","en":"I don't think the flight will be canceled.","tpl":"[[I don't think]] the flight will be canceled.","jp":"フライトが欠航になるとは思いません。","scene":"海外出張","alts":["The flight probably won't get canceled."]},{"id":"P22_14","en":"I don't think I need a bag, thank you.","tpl":"[[I don't think]] I need a bag, thank you.","jp":"袋は大丈夫です、ありがとう。","scene":"買い物","alts":["No bag needed, thanks."]},{"id":"P22_15","en":"I don't think she meant to sound rude.","tpl":"[[I don't think]] she meant to sound rude.","jp":"彼女に失礼なつもりはなかったと思います。","scene":"友人","alts":["I am sure she didn't mean to be rude."]},{"id":"P22_16","en":"I don't think we should rush the hiring process.","tpl":"[[I don't think]] we should rush the hiring process.","jp":"採用プロセスを急ぐべきではないと思います。","scene":"職場","alts":["We shouldn't rush hiring."]},{"id":"P22_17","en":"I don't think my suitcase will fit in the overhead bin.","tpl":"[[I don't think]] my suitcase will fit in the overhead bin.","jp":"私のスーツケースは上の棚に入らないと思います。","scene":"旅行","alts":["My bag looks too big for the overhead compartment."]},{"id":"P22_18","en":"I don't think that's what the client asked for.","tpl":"[[I don't think]] that's what the client asked for.","jp":"それはクライアントが求めたものではないと思います。","scene":"会議","alts":["That doesn't match what the client requested."]},{"id":"P22_19","en":"I don't think the noise will bother me.","tpl":"[[I don't think]] the noise will bother me.","jp":"音は気にならないと思います。","scene":"ホテル","alts":["The noise shouldn't be a problem for me."]},{"id":"P22_20","en":"I don't think there's a quicker route at this hour.","tpl":"[[I don't think]] there's a quicker route at this hour.","jp":"この時間帯にもっと速いルートはないと思います。","scene":"海外出張","alts":["There probably isn't a faster way right now."]}]},{"id":"P23","catId":"cat3","pattern":"In my opinion, ...","meaning":"私の意見では〜","grammar":"In my opinion, + 主語 + 動詞 で、「あくまで私個人の見解ですが」と前置きして意見を述べます。","usage":"議論、ビジネス会議、レビュー、レストランや映画の感想など、複数の見方がある話題で使います。","nuance":"I think より少し改まった響きがあり、論理的な議論やプレゼン後の質疑応答で重宝します。","similar":"From my perspective, ...（私の立場から見ると）／ Personally, I think ...（個人的には〜）","pitfall":"In my opinion, I think ... と重ねるのは重複表現（くどい英語）になるので避けましょう。","dialogue":[{"speaker":"A","en":"Between option A and option B, which one makes more sense?","jp":"案Aと案Bなら、どちらがより合理的ですか？"},{"speaker":"B","en":"In my opinion, option B is much easier for customers to understand.","jp":"私の意見では、案Bの方がお客様にとってずっと分かりやすいです。"},{"speaker":"A","en":"Even though it costs slightly more to build?","jp":"開発コストが少し高くてもですか？"},{"speaker":"B","en":"Yes, in the long run it will reduce support tickets significantly.","jp":"はい、長期的には問い合わせ件数を大幅に減らせますから。"}],"drills":{"subject":{"en":"In her opinion, the training should be hands-on.","jp":"彼女の意見では、研修は実践形式にすべきだそうです。"},"tense":{"en":"In my opinion, last year's event was better organized.","jp":"私の意見では、昨年のイベントの方が運営がしっかりしていました。"},"negative":{"en":"In my opinion, this feature isn't ready for release yet.","jp":"私の意見では、この機能はまだリリースできる状態ではありません。"},"question":{"en":"What's the biggest risk here, in your opinion?","jp":"あなたのご意見では、ここでの最大のリスクは何ですか？"}},"examples":[{"id":"P23_01","en":"In my opinion, clarity is more important than speed.","tpl":"[[In my opinion,]] clarity is more important than speed.","jp":"私の意見では、スピードより分かりやすさの方が重要です。","scene":"会議","alts":["I believe clarity matters more than speed."]},{"id":"P23_02","en":"In my opinion, this is the best coffee shop in town.","tpl":"[[In my opinion,]] this is the best coffee shop in town.","jp":"私の意見では、ここが街で一番のコーヒーショップです。","scene":"レストラン","alts":["To me, this is the best café in town."]},{"id":"P23_03","en":"In my opinion, remote work boosts productivity.","tpl":"[[In my opinion,]] remote work boosts productivity.","jp":"私の意見では、リモートワークは生産性を高めます。","scene":"職場","alts":["I think remote work improves productivity."]},{"id":"P23_04","en":"In my opinion, the hotel is worth every yen.","tpl":"[[In my opinion,]] the hotel is worth every yen.","jp":"私の意見では、このホテルは料金以上の価値があります。","scene":"ホテル","alts":["This hotel is totally worth the price."]},{"id":"P23_05","en":"In my opinion, we should prioritize mobile users first.","tpl":"[[In my opinion,]] we should prioritize mobile users first.","jp":"私の意見では、まずスマホユーザーを優先すべきです。","scene":"会議","alts":["I believe we should focus on mobile users first."]},{"id":"P23_06","en":"In my opinion, autumn is the best season to visit Japan.","tpl":"[[In my opinion,]] autumn is the best season to visit Japan.","jp":"私の意見では、日本を訪れるなら秋が一番いい季節です。","scene":"旅行","alts":["Fall is the best time to visit Japan."]},{"id":"P23_07","en":"In my opinion, the second draft reads much better.","tpl":"[[In my opinion,]] the second draft reads much better.","jp":"私の意見では、第2稿の方がずっと読みやすいです。","scene":"職場","alts":["The second draft flows much better."]},{"id":"P23_08","en":"In my opinion, traveling solo teaches you a lot.","tpl":"[[In my opinion,]] traveling solo teaches you a lot.","jp":"私の意見では、一人旅は多くのことを教えてくれます。","scene":"旅行","alts":["Solo travel is a great learning experience."]},{"id":"P23_09","en":"In my opinion, ten minutes is enough for a daily review.","tpl":"[[In my opinion,]] ten minutes is enough for a daily review.","jp":"私の意見では、毎日の復習は10分で十分です。","scene":"日常","alts":["Ten minutes a day is plenty for review."]},{"id":"P23_10","en":"In my opinion, the jacket is a bit overpriced.","tpl":"[[In my opinion,]] the jacket is a bit overpriced.","jp":"私の意見では、そのジャケットは少し高すぎます。","scene":"買い物","alts":["That jacket seems a little expensive."]},{"id":"P23_11","en":"In my opinion, clear communication prevents most mistakes.","tpl":"[[In my opinion,]] clear communication prevents most mistakes.","jp":"私の意見では、明確な連絡が大半のミスを防ぎます。","scene":"職場","alts":["Good communication avoids most errors."]},{"id":"P23_12","en":"In my opinion, we need a backup plan for the launch.","tpl":"[[In my opinion,]] we need a backup plan for the launch.","jp":"私の意見では、ローンチの予備計画が必要です。","scene":"会議","alts":["We should have a backup plan for launch."]},{"id":"P23_13","en":"In my opinion, the soup needs a pinch more salt.","tpl":"[[In my opinion,]] the soup needs a pinch more salt.","jp":"私の意見では、このスープはもう少し塩気がほしいです。","scene":"レストラン","alts":["The soup could use a bit more salt."]},{"id":"P23_14","en":"In my opinion, short daily practice beats weekend cramming.","tpl":"[[In my opinion,]] short daily practice beats weekend cramming.","jp":"私の意見では、週末の詰め込みより毎日の短時間練習が勝ります。","scene":"日常","alts":["Daily practice works better than cramming."]},{"id":"P23_15","en":"In my opinion, staying near the station saves tons of time.","tpl":"[[In my opinion,]] staying near the station saves tons of time.","jp":"私の意見では、駅近に泊まると大幅に時間を節約できます。","scene":"海外出張","alts":["A hotel near the station saves a lot of time."]},{"id":"P23_16","en":"In my opinion, the keynote speaker was inspiring.","tpl":"[[In my opinion,]] the keynote speaker was inspiring.","jp":"私の意見では、基調講演のスピーカーは刺激的でした。","scene":"海外出張","alts":["The keynote speaker did a great job."]},{"id":"P23_17","en":"In my opinion, simpler menus make ordering easier.","tpl":"[[In my opinion,]] simpler menus make ordering easier.","jp":"私の意見では、シンプルなメニューの方が注文しやすいです。","scene":"レストラン","alts":["Simple menus are easier to order from."]},{"id":"P23_18","en":"In my opinion, both candidates have strong skills.","tpl":"[[In my opinion,]] both candidates have strong skills.","jp":"私の意見では、どちらの候補者も高いスキルを持っています。","scene":"職場","alts":["Both applicants are very capable."]},{"id":"P23_19","en":"In my opinion, we shouldn't cut the marketing budget.","tpl":"[[In my opinion,]] we shouldn't cut the marketing budget.","jp":"私の意見では、マーケティング予算は削るべきではありません。","scene":"会議","alts":["Cutting the marketing budget is a mistake."]},{"id":"P23_20","en":"In my opinion, good shoes are the best travel investment.","tpl":"[[In my opinion,]] good shoes are the best travel investment.","jp":"私の意見では、いい靴が旅で一番の投資です。","scene":"買い物","alts":["Comfortable shoes are essential for travel."]}]},{"id":"P24","catId":"cat3","pattern":"I feel like ...","meaning":"〜な気がします／〜したい気分です","grammar":"I feel like + 動名詞（-ing）／名詞 で「〜したい気分」、I feel like + 主語 + 動詞 で「〜な気がする」を表します。","usage":"食事の気分を話すとき、日常のちょっとした直感や違和感を伝えるときにネイティブが毎日使う構文です。","nuance":"論理より「感覚・気分」にフォーカスした非常に自然な口語表現です。","similar":"I'm in the mood for ...（〜の気分だ）／ It feels like ...（〜のような感じがする）","pitfall":"「〜したい気分」のときは like の後ろに必ず動名詞（-ing）または名詞を置きます（× I feel like to eat → ○ I feel like eating）。","dialogue":[{"speaker":"A","en":"What are you in the mood for tonight?","jp":"今夜は何が食べたい気分ですか？"},{"speaker":"B","en":"I feel like eating something warm, maybe udon or ramen.","jp":"何か温かいものが食べたい気分です。うどんかラーメンとか。"},{"speaker":"A","en":"Ooh, there's a great udon place two blocks from here.","jp":"おっ、ここから2ブロック先にすごく美味しいうどん屋があるよ。"},{ l like]] staying in my hotel room tonight.","jp":"今夜はホテルの部屋でのんびりしたい気分です。","scene":"ホテル","alts":["I just want to stay in tonight."]},{"id":"P24_09","en":"I feel like ordering something spicy.","tpl":"[[I feel like]] ordering something spicy.","jp":"何か辛いものを頼みたい気分です。","scene":"レストラン","alts":["I am in the mood for spicy food."]},{"id":"P24_10","en":"I feel like my English is finally clicking.","tpl":"[[I feel like]] my English is finally clicking.","jp":"英語がようやくしっくりき始めた気がします。","scene":"日常","alts":["English is starting to click for me."]},{"id":"P24_11","en":"I feel like we need a fresh pair of eyes on this.","tpl":"[[I feel like]] we need a fresh pair of eyes on this.","jp":"これには第三者の視点が必要な気がします。","scene":"職場","alts":["Someone else should take a look at this."]},{"id":"P24_12","en":"I feel like walking along the waterfront.","tpl":"[[I feel like]] walking along the waterfront.","jp":"海沿いを歩きたい気分です。","scene":"旅行","alts":["I want to walk by the water."]},{"id":"P24_13","en":"I feel like I forgot to pack something.","tpl":"[[I feel like]] I forgot to pack something.","jp":"何か荷物を入れ忘れた気がします。","scene":"海外出張","alts":["I have a feeling I forgot something."]},{"id":"P24_14","en":"I feel like trying a new hairstyle.","tpl":"[[I feel like]] trying a new hairstyle.","jp":"新しい髪型に挑戦したい気分です。","scene":"日常","alts":["I am in the mood for a new haircut."]},{"id":"P24_15","en":"I feel like this jacket is a bit too heavy.","tpl":"[[I feel like]] this jacket is a bit too heavy.","jp":"このジャケットは少し重すぎる気がします。","scene":"買い物","alts":["This jacket seems a bit too heavy."]},{"id":"P24_16","en":"I feel like we're spending too much time on slide two.","tpl":"[[I feel like]] we're spending too much time on slide two.","jp":"2枚目のスライドに時間をかけすぎている気がします。","scene":"会議","alts":["We seem to be stuck on slide two."]},{"id":"P24_17","en":"I feel like listening to jazz while I work.","tpl":"[[I feel like]] listening to jazz while I work.","jp":"仕事をしながらジャズを聴きたい気分です。","scene":"職場","alts":["I am in the mood for jazz while working."]},{"id":"P24_18","en":"I feel like I'm catching a mild cold.","tpl":"[[I feel like]] I'm catching a mild cold.","jp":"ちょっと風邪をひきかけている気がします。","scene":"日常","alts":["I think I might be coming down with a cold."]},{"id":"P24_19","en":"I feel like celebrating after finishing this project.","tpl":"[[I feel like]] celebrating after finishing this project.","jp":"このプロジェクトが終わってお祝いしたい気分です。","scene":"職場","alts":["Let's celebrate finishing this project."]},{"id":"P24_20","en":"I feel like buying some fresh fruit at the market.","tpl":"[[I feel like]] buying some fresh fruit at the market.","jp":"市場で新鮮な果物を買いたい気分です。","scene":"買い物","alts":["I want to pick up some fresh fruit."]}]},{"id":"P25","catId":"cat3","pattern":"I'm worried about ...","meaning":"〜が心配です","grammar":"I'm worried about + 名詞／動名詞（-ing）で、不安や懸念の対象を具体的に伝えます。","usage":"仕事のリスク共有、旅行のトラブル懸念、健康や天気の心配など、日常からビジネスまで幅広く使います。","nuance":"ビジネスで少し控えめに懸念を伝えたいときは I'm concerned about ... に言い換えることもできます。","similar":"I'm concerned about ...（ビジネス寄りの懸念）／ I'm anxious about ...（ソワソワした強い不安）","pitfall":"worry は自動詞なので「〜を心配している」という状態には I'm worried about ... を使います（× I'm worrying about も言いますが状態は worried が定番）。","dialogue":[{"speaker":"A","en":"You look a little stressed. Everything okay?","jp":"少し疲れているみたいだけど、大丈夫？"},{"speaker":"B","en":"I'm worried about the timeline for the client demo next Tuesday.","jp":"来週火曜のクライアント向けデモのスケジュールが心配なんです。"},{"speaker":"A","en":"Let's look at the task list together and see what we can trim.","jp":"一緒にタスクリストを見て、削れるところを探しましょう。"},{"speaker":"B","en":"That would be a huge relief. Thanks for stepping in.","jp":"そうしてもらえるとすごく助かります。ありがとうございます。"}],"drills":{"subject":{"en":"She's worried about missing her connecting flight.","jp":"彼女は乗り継ぎ便に乗り遅れるのを心配しています。"},"tense":{"en":"I was worried about the weather, but it turned out sunny.","jp":"天気が心配でしたが、晴れてよかったです。"},"negative":{"en":"I'm not worried about the budget anymore.","jp":"もう予算のことは心配していません。"},"question":{"en":"Are you worried about giving the speech in English m burnout."]},{"id":"P25_19","en":"I'm worried about spicy food upsetting my stomach.","tpl":"[[I'm worried about]] spicy food upsetting my stomach.","jp":"辛い料理でお腹を壊さないか心配です。","scene":"レストラン","alts":["I worry spicy food might upset my stomach."]},{"id":"P25_20","en":"I'm worried about forgetting my lines on stage.","tpl":"[[I'm worried about]] forgetting my lines on stage.","jp":"ステージでセリフを忘れないか心配です。","scene":"職場","alts":["I am afraid of blanking on stage."]}]},{"id":"P26","catId":"cat3","pattern":"I'm glad ...","meaning":"〜でうれしいです／安心しました","grammar":"I'm glad (that) + 主語 + 動詞（または to + 原形）で、起きたことへの喜びや安堵を伝えます。","usage":"再会の挨拶、問題が解決したときの安堵、相手への感謝や気遣いを表すときに使います。","nuance":"happy が大きな幸福感を表すのに対し、glad は「〜してよかった」「ほっとした」という具体的な出来事への喜びに向いています。","similar":"I'm relieved that ...（ほっとした）／ I'm happy to ...（喜んで〜する）","pitfall":"名詞の前に置いて × a glad news のようには使えません。常に be glad の形で使います。","dialogue":[{"speaker":"A","en":"Hey, I made it! Sorry the train was delayed.","jp":"着いたよ！電車が遅れてごめん。"},{"speaker":"B","en":"No worries at all. I'm glad you made it safely.","jp":"全然大丈夫。無事に来られてよかったよ。"},{"speaker":"A","en":"Did you already get us a table?","jp":"もう席は取ってくれたの？"},{"speaker":"B","en":"Yeah, I'm glad we booked ahead because the place is packed.","jp":"うん、お店が満席だから予約しておいて本当によかったよ。"}],"drills":{"subject":{"en":"She's glad the client approved the design.","jp":"彼女はクライアントがデザインを承認してくれて喜んでいます。"},"tense":{"en":"I was glad to hear you got the promotion.","jp":"昇進されたと聞いてうれしかったです。"},"negative":{"en":"I'm glad we didn't cancel the trip.","jp":"旅行をキャンセルしなくてよかったです。"},"question":{"en":"Aren't you glad we brought umbrellas today?","jp":"今日傘を持ってきてよかったと思わない？"}},"examples":[{"id":"P26_01","en":"I'm glad we could meet today.","tpl":"[[I'm glad]] we could meet today.","jp":"今日お会いできてうれしいです。","scene":"海外出張","alts":["I am happy we could meet today."]},{"id":"P26_02","en":"I'm glad you liked the presentation.","tpl":"[[I'm glad]] you liked the presentation.","jp":"プレゼンを気に入っていただけてうれしいです。","scene":"会議","alts":["I am happy tfall":"自分が驚く場合は surprised（-ed）。surprising は「驚かせるような（モノ・コト）」に使います。","dialogue":[{"speaker":"A","en":"Wait, the whole order arrived already?","jp":"えっ、注文したものもう全部届いたの？"},{"speaker":"B","en":"Yeah! I'm surprised that it got here in less than twenty-four hours.","jp":"そうなんだよ！24時間以内に届いて驚いてるんだ。"},{"speaker":"A","en":"That's insanely fast. Everything intact?","jp":"めちゃくちゃ速いね。中身も無事？"},{"speaker":"B","en":"Completely fine. I'm definitely ordering from them again.","jp":"完璧に無事だよ。絶対またここで注文する。"}],"drills":{"subject":{"en":"Everyone was surprised that he spoke fluent Japanese.","jp":"彼が流暢な日本語を話すので皆驚いていました。"},"tense":{"en":"I was surprised that the museum was free on Sundays.","jp":"日曜日は美術館が無料だと知って驚きました。"},"negative":{"en":"I'm not surprised that the concert sold out quickly.","jp":"コンサートがすぐ完売しても驚きません。"},"question":{"en":"Were you surprised that they changed the venue?","jp":"会場が変更されて驚きましたか？"}},"examples":[{"id":"P27_01","en":"I'm surprised that the train is so quiet.","tpl":"[[I'm surprised that]] the train is so quiet.","jp":"電車がこんなに静かで驚いています。","scene":"旅行","alts":["I am amazed how quiet the train is."]},{"id":"P27_02","en":"I'm surprised that we finished ahead of schedule.","tpl":"[[I'm surprised that]] we finished ahead of schedule.","jp":"予定より早く終わって驚いています。","scene":"職場","alts":["I didn't expect us to finish early."]},{"id":"P27_03","en":"I'm surprised that this jacket is on sale already.","tpl":"[[I'm surprised that]] this jacket is on sale already.","jp":"このジャケットがもうセールになっていて驚いています。","scene":"買い物","alts":["I didn't expect this jacket to be discounted yet."]},{"id":"P27_04","en":"I'm surprised that the hotel room is so spacious.","tpl":"[[I'm surprised that]] the hotel room is so spacious.","jp":"ホテルの部屋がこんなに広くて驚いています。","scene":"ホテル","alts":["The hotel room is surprisingly spacious."]},{"id":"P27_05","en":"I'm surprised that it's already November.","tpl":"[[I'm surprised that]] it's already November.","jp":"もう11月なんて驚きです。","scene":"日常","alts":["I can't believe it is already November."]},{"id":"P27_06","en":"I'm surprised that nobody asked about the pricing.","tpl":"[[I'm surprised that]] nobody asked about the pricing.","jp":"誰も価格について質問しなくて驚いています。","scene":"会議","alts":["I expected someone to ask about pricing."]},{"id":"P27_07","en":"I'm surprised that the portions here are huge.","tpl":"[[I'm surprised that]] the portions here are huge.","jp":"ここの料理の量が多くて驚いています。","scene":"レストラン","alts":["The portions are surprisingly big."]},{"id":"P27_08","en":"I'm surprised that you remember my coffee order.","tpl":"[[I'm surprised that]] you remember my coffee order.","jp":"私のコーヒーの注文を覚えていてくれて驚きです。","scene":"友人","alts":["I can't believe you remembered my order."]},{"id":"P27_09","en":"I'm surprised that the flight was completely full.","tpl":"[[I'm surprised that]] the flight was completely full.","jp":"フライトが満席で驚いています。","scene":"海外出張","alts":["I didn't expect a completely full flight."]},{"id":"P27_10","en":"I'm surprised that it warmed up so quickly today.","tpl":"[[I'm surprised that]] it warmed up so quickly today.","jp":"今日こんなに早く暖かくなって驚いています。","scene":"日常","alts":["It got warm surprisingly fast today."]},{"id":"P27_11","en":"I'm surprised that the line moved so fast.","tpl":"[[I'm surprised that]] the line moved so fast.","jp":"行列がこんなに早く進んで驚いています。","scene":"旅行","alts":["The queue went surprisingly quickly."]},{"id":"P27_12","en":"I'm surprised that they approved it on the first try.","tpl":"[[I'm surprised that]] they approved it on the first try.","jp":"一発で承認されて驚いています。","scene":"職場","alts":["I didn't expect first-try approval."]},{"id":"P27_13","en":"I'm surprised that this café is open twenty-four hours.","tpl":"[[I'm surprised that]] this café is open twenty-four hours.","jp":"このカフェが24時間営業で驚いています。","scene":"レストラン","alts":["I didn't know this café is open all day and night."]},{"id":"P27_14","en":"I'm surprised that you learned so fast.","tpl":"[[I'm surprised that]] you learned so fast.","jp":"こんなに早く習得して驚いています。","scene":"職場","alts":["You picked ou completely. Less text makes it way less intimidating.","jp":"完全に賛成です。文字が少ない方がずっととっつきやすいですからね。"},{"speaker":"A","en":"Great, I'll share a cleaner mockup tomorrow morning.","jp":"よかったです、明日の朝にもっとすっきりしたモックアップを共有します。"},{"speaker":"B","en":"Sounds like a plan. Looking forward to seeing it.","jp":"それでいきましょう。楽しみにしています。"}],"drills":{"subject":{"en":"Most of the team agrees with the new schedule.","jp":"チームのほとんどが新しいスケジュールに賛成しています。"},"tense":{"en":"I agreed with his proposal after seeing the data.","jp":"データを見て彼の提案に賛成しました。"},"negative":{"en":"I don't entirely agree with that conclusion.","jp":"その結論には完全には賛成できません。"},"question":{"en":"Do you agree with the client's revised timeline?","jp":"クライアントの修正スケジュールに賛成ですか？"}},"examples":[{"id":"P28_01","en":"I agree with you completely.","tpl":"[[I agree with]] you completely.","jp":"あなたに完全に賛成です。","scene":"会議","alts":["I totally agree with you."]},{"id":"P28_02","en":"I agree with your point about customer support.","tpl":"[[I agree with]] your point about customer support.","jp":"カスタマーサポートに関するあなたのご意見に賛成です。","scene":"会議","alts":["I share your view on customer support."]},{"id":"P28_03","en":"I agree with the proposed budget.","tpl":"[[I agree with]] the proposed budget.","jp":"提案された予算案に賛成です。","scene":"職場","alts":["The proposed budget looks good to me."]},{"id":"P28_04","en":"I agree with Kenji—we need more testing.","tpl":"[[I agree with]] Kenji—we need more testing.","jp":"健二に賛成です。もっとテストが必要です。","scene":"会議","alts":["Kenji is right; we need more testing."]},{"id":"P28_05","en":"I agree with that review; the pasta is amazing.","tpl":"[[I agree with]] that review; the pasta is amazing.","jp":"そのレビューに同感です。ここのパスタは絶品です。","scene":"レストラン","alts":["The review was spot-on about the pasta."]},{"id":"P28_06","en":"I agree with taking an earlier flight.","tpl":"[[I agree with]] taking an earlier flight.","jp":"もっと早い便にすることに賛成です。","scene":"海外出張","alts":["Taking the earlier flight makes sense."]},{"id":"P28_07","en":"I agree with the idea of shorter weekly meetings.","tpl":"[[I agree with]] the idea of shorter weekly meetings.","jp":"週次会議を短くするアイデアに賛成です。","scene":"職場","alts":["Shorter weekly meetings sound great."]},{"id":"P28_08","en":"I agree with splitting the bill evenly.","tpl":"[[I agree with]] splitting the bill evenly.","jp":"割り勘にすることに賛成です。","scene":"レストラン","alts":["Splitting it evenly works for me."]},{"id":"P28_09","en":"I agree with what you said earlier.","tpl":"[[I agree with]] what you said earlier.","jp":"さっきあなたが言ったことに同感です。","scene":"友人","alts":["You made a good point earlier."]},{"id":"P28_10","en":"I agree with keeping the room design minimalist.","tpl":"[[I agree with]] keeping the room design minimalist.","jp":"部屋のデザインをミニマルに保つことに賛成です。","scene":"日常","alts":["A minimalist design is a great choice."]},{"id":"P28_11","en":"I agree with the hotel's eco-friendly towel policy.","tpl":"[[I agree with]] the hotel's eco-friendly towel policy.","jp":"ホテルのエコなタオル方針に賛成です。","scene":"ホテル","alts":["I support the hotel's eco-friendly policy."]},{"id":"P28_12","en":"I agree with prioritizing quality over quantity.","tpl":"[[I agree with]] prioritizing quality over quantity.","jp":"量より質を優先することに賛成です。","scene":"職場","alts":["Quality over quantity is the right call."]},{"id":"P28_13","en":"I agree with skipping the crowded tourist trap.","tpl":"[[I agree with]] skipping the crowded tourist trap.","jp":"混んだ観光名所を飛ばすことに賛成です。","scene":"旅行","alts":["Avoiding that tourist spot is smart."]},{"id":"P28_14","en":"I agree with buying durable shoes instead of cheap ones.","tpl":"[[I agree with]] buying durable shoes instead of cheap ones.","jp":"安い靴より丈夫な靴を買うことに賛成です。","scene":"買い物","alts":["Investing in durable shoes makes sense."]},{"id":"P28_15","en":"I agree with his assessment of the market.","tpl":"[[I agree with]] his assessment of the market.","jp":"彼の市場分析に同意します。","scene":"会議","alts":["His market analysis sounds right."]},{"id":"P28_16","en":"I agree with starting at nine instead of eight.","tpl":"[[I agree with]] starting ころ、私たちのチームはあと1週間必要です。"},"tense":{"en":"To be honest, I didn't understand half of that lecture.","jp":"正直に言うと、あの講義の半分は理解できませんでした。"},"negative":{"en":"To be honest, I'm not a big fan of crowded places.","jp":"正直、人混みはあまり好きではないんです。"},"question":{"en":"Can I be honest with you about the design?","jp":"デザインについて正直に言ってもいいですか？"}},"examples":[{"id":"P29_01","en":"To be honest, I'm a little tired today.","tpl":"[[To be honest,]] I'm a little tired today.","jp":"正直に言うと、今日は少し疲れています。","scene":"日常","alts":["Honestly, I am a bit tired today."]},{"id":"P29_02","en":"To be honest, I didn't expect such a great turnout.","tpl":"[[To be honest,]] I didn't expect such a great turnout.","jp":"正直、こんなに大勢来てくれるとは思いませんでした。","scene":"職場","alts":["Honestly, I didn't expect this many people."]},{"id":"P29_03","en":"To be honest, the price is a bit over my budget.","tpl":"[[To be honest,]] the price is a bit over my budget.","jp":"正直なところ、価格は少し予算オーバーです。","scene":"買い物","alts":["Honestly, that is a little above my budget."]},{"id":"P29_04","en":"To be honest, I prefer the original version.","tpl":"[[To be honest,]] I prefer the original version.","jp":"正直に言うと、元のバージョンの方が好きです。","scene":"会議","alts":["Honestly, I like the first version better."]},{"id":"P29_05","en":"To be honest, I'm still getting used to the time difference.","tpl":"[[To be honest,]] I'm still getting used to the time difference.","jp":"正直、まだ時差に慣れている最中です。","scene":"海外出張","alts":["Honestly, I am still adjusting to the time zone."]},{"id":"P29_06","en":"To be honest, I forgot to check my calendar.","tpl":"[[To be honest,]] I forgot to check my calendar.","jp":"正直、カレンダーを確認するのを忘れていました。","scene":"職場","alts":["Honestly, I forgot to look at my schedule."]},{"id":"P29_07","en":"To be honest, the dish was a bit too salty for me.","tpl":"[[To be honest,]] the dish was a bit too salty for me.","jp":"正直、その料理は私には少ししょっぱすぎました。","scene":"レストラン","alts":["Honestly, it was a little too salty for my taste."]},{"id":"P29_08","en":"To be honest, I've never seemed like the train was stuck for twenty minutes.","jp":"電車が20分も止まっていたように感じました。"},"negative":{"en":"It doesn't seem like the rain is stopping anytime soon.","jp":"雨はすぐには止みそうにありません。"},"question":{"en":"Does it seem like we're missing any files?","jp":"足りないファイルがありそうですか？"}},"examples":[{"id":"P30_01","en":"It seems like it's going to rain soon.","tpl":"[[It seems like]] it's going to rain soon.","jp":"もうすぐ雨が降りそうです。","scene":"日常","alts":["It looks like rain soon."]},{"id":"P30_02","en":"It seems like the client is happy with the draft.","tpl":"[[It seems like]] the client is happy with the draft.","jp":"クライアントは下書きに満足しているようです。","scene":"職場","alts":["The client appears happy with the draft."]},{"id":"P30_03","en":"It seems like there's a delay on the main line.","tpl":"[[It seems like]] there's a delay on the main line.","jp":"本線に遅延が出ているみたいです。","scene":"日常","alts":["The main line appears to be delayed."]},{"id":"P30_04","en":"It seems like this restaurant is really popular.","tpl":"[[It seems like]] this restaurant is really popular.","jp":"このレストランはすごく人気があるみたいです。","scene":"レストラン","alts":["This place looks very popular."]},{"id":"P30_05","en":"It seems like we're running a bit behind schedule.","tpl":"[[It seems like]] we're running a bit behind schedule.","jp":"少し予定より押しているようです。","scene":"会議","alts":["We appear to be slightly behind schedule."]},{"id":"P30_06","en":"It seems like the store is closed on Mondays.","tpl":"[[It seems like]] the store is closed on Mondays.","jp":"そのお店は月曜定休みたいです。","scene":"買い物","alts":["It looks like the shop is closed Mondays."]},{"id":"P30_07","en":"It seems like they upgraded our hotel room.","tpl":"[[It seems like]] they upgraded our hotel room.","jp":"ホテルの部屋をアップグレードしてくれたみたいです。","scene":"ホテル","alts":["It looks like we got a room upgrade."]},{"id":"P30_08","en":"It seems like everyone is busy this week.","tpl":"[[It seems like]] everyone is busy this week.","jp":"今週はみんな忙しそうですね。","scene":"職場","alts":["Everyone looks busy this week."]},{"id":  like]] we took a wrong turn back there.","jp":"さっき曲がる場所を間違えたみたいです。","scene":"旅行","alts":["Looks like we made a wrong turn."]},{"id":"P30_19","en":"It seems like a reasonable compromise.","tpl":"[[It seems like]] a reasonable compromise.","jp":"妥当な妥協案のようです。","scene":"会議","alts":["That looks like a fair compromise."]},{"id":"P30_20","en":"It seems like autumn arrived overnight.","tpl":"[[It seems like]] autumn arrived overnight.","jp":"一晩で秋が来たみたいですね。","scene":"日常","alts":["It suddenly feels like autumn."]}]},{"id":"P31","catId":"cat4","pattern":"Do you know ...?","meaning":"〜をご存知ですか？","grammar":"Do you know + 疑問詞 + 主語 + 動詞（間接疑問文）または名詞／if節 で、知っているかを尋ねます。","usage":"道案内、営業時間、担当者の確認、おすすめを聞くときなど、情報収集の出発点になる構文です。","nuance":"直接 What time ...? と聞くよりワンクッション置けるため、初対面の相手にも丁寧な印象を与えます。","similar":"Could you tell me ...?（さらに丁寧）／ Do you happen to know ...?（ひょっとしてご存知ですか？）","pitfall":"後ろは疑問文の語順ではなく「主語＋動詞」の平叙文語順になります（× Do you know where is the station? → ○ Do you know where the station is?）。","dialogue":[{"speaker":"A","en":"Excuse me, do you know where the airport shuttle stops?","jp":"すみません、空港シャトルバスの乗り場をご存知ですか？"},{"speaker":"B","en":"Yes, go out the main entrance and turn left. It's at stand number three.","jp":"はい、正面玄関を出て左に曲がってください。3番乗り場です。"},{"speaker":"A","en":"Do you know how often it runs?","jp":"どのくらいの間隔で走っているかご存知ですか？"},{"speaker":"B","en":"Every twenty minutes, right on the hour.","jp":"毎時ちょうどから20分おきですよ。"}],"drills":{"subject":{"en":"Does she know when the client is arriving?","jp":"彼女はクライアントがいつ到着するか知っていますか？"},"tense":{"en":"Did you know that the museum is closed on Tuesdays?","jp":"美術館が火曜休館だと知っていましたか？"},"negative":{"en":"Don't you know where we parked the rental car?","jp":"レンタカーをどこに停めたか覚えていないの？"},"question":{"en":"Do you happen to know the Wi-Fi password?","jp":"ひょっとしてWi-Fiのパスワードをご存知ですか？"}},"examples":[{"id":"P31_01","en":"Do you know where the nearest subway station is?","tpl":"[[Do you know]] where the nearest subway station is?","jp":"一番近い地下鉄の駅はどこかご存知ですか？","scene":"旅行","alts":["Could you tell me where the nearest subway station is?"]},{"id":"P31_02","en":"Do you know what time the restaurant closes?","tpl":"[[Do you know]] what time the restaurant closes?","jp":"レストランが何時に閉まるかご存知ですか？","scene":"レストラン","alts":["What time does the restaurant close?"]},{"id":"P31_03","en":"Do you know if this train goes to the airport?","tpl":"[[Do you know]] if this train goes to the airport?","jp":"この電車は空港に行くかご存知ですか？","scene":"旅行","alts":["Does this train go to the airport?"]},{"id":"P31_04","en":"Do you know who is leading today's meeting?","tpl":"[[Do you know]] who is leading today's meeting?","jp":"今日の会議の進行役は誰か知っていますか？","scene":"会議","alts":["Who is running today's meeting?"]},{"id":"P31_05","en":"Do you know the Wi-Fi password here?","tpl":"[[Do you know]] the Wi-Fi password here?","jp":"ここのWi-Fiパスワードをご存知ですか？","scene":"ホテル","alts":["What is the Wi-Fi password here?"]},{"id":"P31_06","en":"Do you know a good coffee shop nearby?","tpl":"[[Do you know]] a good coffee shop nearby?","jp":"近くに美味しいコーヒーショップをご存知ですか？","scene":"日常","alts":["Can you recommend a good café nearby?"]},{"id":"P31_07","en":"Do you know when the updated file will be ready?","tpl":"[[Do you know]] when the updated file will be ready?","jp":"更新版ファイルがいつできるか知っていますか？","scene":"職場","alts":["When will the updated file be ready?"]},{"id":"P31_08","en":"Do you know how to get to terminal two?","tpl":"[[Do you know]] how to get to terminal two?","jp":"第2ターミナルへの行き方をご存知ですか？","scene":"海外出張","alts":["How do I get to terminal two?"]},{"id":"P31_09","en":"Do you know if they accept mobile payments?","tpl":"[[Do you know]] if they accept mobile payments?","jp":"モバイル決済が使えるかご存知ですか？","scene":"買い物","alts":["Do they take mobile payments?"]},{"id":"P31_10","en":"Do you know why the meeting was moved to three?","tpl":"[[Do you know]] why the meeting was moved to three?","jp":"会議が3時に変更された理由を知っていますか？","scene":"会議","alts":["Why was the meeting pushed to three?"]},{"id":"P31_11","en":"Do you know how much the は事前予約が必要かご存知ですか？","scene":"旅行","alts":["Do we have to book tickets ahead of time?"]}]},{"id":"P32","catId":"cat4","pattern":"Could you tell me ...?","meaning":"〜を教えていただけますか？","grammar":"Could you tell me + 疑問詞 + 主語 + 動詞（または if節／名詞）で、非常に丁寧に情報を尋ねます。","usage":"ホテル、空港、店舗、初対面のビジネス相手など、礼儀正しく質問したいあらゆる場面で使えます。","nuance":"Can you tell me ...? より丁寧で、丁寧な接客やビジネスシーンの標準表現です。","similar":"Would you mind telling me ...?（さらに丁寧）／ Can you tell me ...?（ややカジュアル）","pitfall":"Do you know ...? と同じく、疑問詞の後ろは「主語＋動詞」の語順にします（× Could you tell me what time does it open? → ○ what time it opens?）。","dialogue":[{"speaker":"A","en":"Excuse me, could you tell me where the baggage claim is?","jp":"すみません、手荷物受取所はどこか教えていただけますか？"},{"speaker":"B","en":"Sure, head down the escalator and follow the green signs.","jp":"はい、エスカレーターを降りて緑の案内表示に従ってください。"},{"speaker":"A","en":"And could you tell me which carousel is for flight NH106?","jp":"それから、NH106便はどのターンテーブルか教えていただけますか？"},{"speaker":"B","en":"That's carousel four, right at the end of the hall.","jp":"ホールの突き当たり、4番のターンテーブルですよ。"}],"drills":{"subject":{"en":"Could your team tell me when the report will be finalized?","jp":"レポートがいつ確定するか教えていただけますか？"},"tense":{"en":"Could you tell me what happened during yesterday's call?","jp":"昨日の電話で何があったか教えていただけますか？"},"negative":{"en":"Could you tell me why the coupon didn't work?","jp":"なぜクーポンが適用されなかったのか教えていただけますか？"},"question":{"en":"Could you possibly tell me the status of my order?","jp":"注文の状況を教えていただくことは可能でしょうか？"}},"examples":[{"id":"P32_01","en":"Could you tell me how to get to the station?","tpl":"[[Could you tell me]] how to get to the station?","jp":"駅への行き方を教えていただけますか？","scene":"旅行","alts":["Can you tell me how to reach the station?"]},{"id":"P32_02","en":"Could you tell me what time checkout is?","tpl":"[[Could you tell me]] what time checkout is?","jp":"チェックアウトは何時か教えていただけますか？","scene":"ホテル","alts":["What time is checkout?"]},{"id":"P32_03","en":"Could you tell me where the restrooms are?","tpl":"[[Could you tell me]] where ernationally.","jp":"海外出張にすごく慣れているみたいですね。"},{"speaker":"B","en":"Thanks! I've been doing it for a few years now.","jp":"ありがとうございます！もう数年やっていますから。"},{"speaker":"A","en":"How often do you fly overseas for work?","jp":"仕事でどのくらいの頻度で海外に行くんですか？"},{"speaker":"B","en":"Usually once every two months, mostly to Singapore and London.","jp":"普段は2か月に1回くらいですね。主にシンガポールとロンドンです。"}],"drills":{"subject":{"en":"How often does the airport bus run?","jp":"空港バスはどのくらいの頻度で走っていますか？"},"tense":{"en":"How often did you practice before the exam?","jp":"試験前はどのくらいの頻度で練習しましたか？"},"negative":{"en":"How often do you end up skipping lunch?","jp":"どのくらいの頻度で昼食を抜きがちですか？"},"question":{"en":"How often should we back up the project files?","jp":"プロジェクトファイルはどのくらいの頻度でバックアップすべきですか？"}},"examples":[{"id":"P34_01","en":"How often do you go to the gym?","tpl":"[[How often do you]] go to the gym?","jp":"どのくらいの頻度でジムに行きますか？","scene":"日常","alts":["How frequently do you work out?"]},{"id":"P34_02","en":"How often do you travel for business?","tpl":"[[How often do you]] travel for business?","jp":"どのくらいの頻度で出張に行きますか？","scene":"海外出張","alts":["How frequently do you go on business trips?"]},{"id":"P34_03","en":"How often do you work from home?","tpl":"[[How often do you]] work from home?","jp":"どのくらいの頻度で在宅勤務をしていますか？","scene":"職場","alts":["How many days a week do you work remotely?"]},{"id":"P34_04","en":"How often do you hold team meetings?","tpl":"[[How often do you]] hold team meetings?","jp":"どのくらいの頻度でチーム会議を開きますか？","scene":"会議","alts":["How frequently does your team meet?"]},{"id":"P34_05","en":"How often do you cook at home?","tpl":"[[How often do you]] cook at home?","jp":"どのくらいの頻度で自炊しますか？","scene":"日常","alts":["Do you cook at home often?"]},{"id":"P34_06","en":"How often do you practice speaking English?","tpl":"[[How often do you]] practice speaking English?","jp":"どのくらいの頻度で英会話を練習していますか？","scene":"日常","alts":["How frequently do you practice English?"]},{"id":"P34_07","en":"How often do you visit your hometown?","tpl":" n do you need it?"]},{"id":"P36_03","en":"What do you mean by 'standard package'?","tpl":"[[What do you mean by]] 'standard package'?","jp":"「標準パッケージ」とはどういう内容ですか？","scene":"買い物","alts":["What is included in the standard package?"]},{"id":"P36_04","en":"What do you mean by 'flexible schedule'?","tpl":"[[What do you mean by]] 'flexible schedule'?","jp":"「柔軟なスケジュール」とはどういう意味ですか？","scene":"会議","alts":["How flexible is the schedule?"]},{"id":"P36_05","en":"What do you mean by 'local flavor'?","tpl":"[[What do you mean by]] 'local flavor'?","jp":"「地元の味」とはどういう意味ですか？","scene":"レストラン","alts":["What makes it a local flavor?"]},{"id":"P36_06","en":"What do you mean by 'phase two'?","tpl":"[[What do you mean by]] 'phase two'?","jp":"「フェーズ2」とは何を指していますか？","scene":"会議","alts":["What is covered in phase two?"]},{"id":"P36_07","en":"What do you mean by 'partial refund'?","tpl":"[[What do you mean by]] 'partial refund'?","jp":"「一部返金」とはどういう意味ですか？","scene":"ホテル","alts":["How does a partial refund work?"]},{"id":"P36_08","en":"What do you mean by 'smart casual'?","tpl":"[[What do you mean by]] 'smart casual'?","jp":"「スマートカジュアル」とはどのくらいの服装ですか？","scene":"海外出張","alts":["What should I wear for smart casual?"]},{"id":"P36_09","en":"What do you mean by 'hidden gem'?","tpl":"[[What do you mean by]] 'hidden gem'?","jp":"「隠れた名店」とはどういう意味ですか？","scene":"旅行","alts":["What makes it a hidden gem?"]},{"id":"P36_10","en":"What do you mean by 'out of scope'?","tpl":"[[What do you mean by]] 'out of scope'?","jp":"「スコープ外」とはどういう意味ですか？","scene":"会議","alts":["Why is that out of scope?"]},{"id":"P36_11","en":"What do you mean by 'it depends'?","tpl":"[[What do you mean by]] 'it depends'?","jp":"「場合による」とはどういうことですか？","scene":"日常","alts":["What does it depend on?"]},{"id":"P36_12","en":"What do you mean by 'seasonal menu'?","tpl":"[[What do you mean by]] 'seasonal menu'?","jp":"「季節限定メニュー」とはどんな料理ですか？","scene":"レストラン","alts":["What is on the seasonal menu?"]},{"id":"P36_13","en":"What do you mean by 'express checkout 埋まっているんです。"},{"speaker":"B","en":"No problem. How about Wednesday morning at ten?","jp":"大丈夫です。水曜日の朝10時はどうですか？"},{"speaker":"A","en":"Wednesday at ten works great for me!","jp":"水曜10時はばっちり空いています！"},{"speaker":"B","en":"Awesome. How about meeting at the café downstairs?","jp":"よかった。1階のカフェで会うのはどうですか？"}],"drills":{"subject":{"en":"How about your team? Are they available on Thursday?","jp":"あなたのチームはどうですか？木曜日は空いていますか？"},"tense":{"en":"How about the presentation you gave yesterday?","jp":"昨日のプレゼンはどうでしたか？"},"negative":{"en":"How about not scheduling any meetings on Fridays?","jp":"金曜日は会議を入れないというのはどうですか？"},"question":{"en":"I'm having the pasta. How about you?","jp":"私はパスタにします。あなたはどうしますか？"}},"examples":[{"id":"P37_01","en":"How about grabbing lunch together?","tpl":"[[How about]] grabbing lunch together?","jp":"一緒にお昼を食べるのはどうですか？","scene":"職場","alts":["Want to get lunch together?"]},{"id":"P37_02","en":"How about next Tuesday at two?","tpl":"[[How about]] next Tuesday at two?","jp":"来週火曜日の2時はどうですか？","scene":"会議","alts":["Does next Tuesday at two work?"]},{"id":"P37_03","en":"How about taking a ten-minute break?","tpl":"[[How about]] taking a ten-minute break?","jp":"10分休憩を取るのはどうですか？","scene":"会議","alts":["Shall we take a short break?"]},{"id":"P37_04","en":"How about trying that Italian place?","tpl":"[[How about]] trying that Italian place?","jp":"あのイタリアンのお店を試すのはどうですか？","scene":"レストラン","alts":["Why don't we try that Italian place?"]},{"id":"P37_05","en":"How about you? What do you think?","tpl":"[[How about]] you? What do you think?","jp":"あなたはどうですか？どう思いますか？","scene":"日常","alts":["What about you?"]},{"id":"P37_06","en":"How about sharing a taxi to the airport?","tpl":"[[How about]] sharing a taxi to the airport?","jp":"空港までタクシーをシェアするのはどうですか？","scene":"海外出張","alts":["Want to split a cab to the airport?"]},{"id":"P37_07","en":"How about checking the weather forecast first?","tpl":"[[How about]] checking the weather forecast first?","jp":"まず天気予報を確認するのはどうですか？","scene":"旅行","alts":["Let's check the weather first."]},{"id":"P37_08","en":"How about this color instead?","tpl":"[[How about]] this color instead?","jp":"代わりにこちらの色はどうですか？","scene":"買い物","alts":["What do you think of this color?"]},{"id":"P37_09","en":"How about meeting in the hotel lobby at eight?","tpl":"[[How about]] meeting in the hotel lobby at eight?","jp":"8時にホテルのロビーで待ち合わせるのはどうですか？","scene":"ホテル","alts":["Shall we meet in the lobby at eight?"]},{"id":"P37_10","en":"How about ordering a salad to share?","tpl":"[[How about]] ordering a salad to share?","jp":"シェア用にサラダを頼むのはどうですか？","scene":"レストラン","alts":["Should we split a salad?"]},{"id":"P37_11","en":"How about sending a quick reminder email?","tpl":"[[How about]] sending a quick reminder email?","jp":"簡単にリマインドメールを送るのはどうですか？","scene":"職場","alts":["Maybe we should send a quick reminder."]},{"id":"P37_12","en":"How about walking instead of taking the bus?","tpl":"[[How about]] walking instead of taking the bus?","jp":"バスに乗る代わりに歩くのはどうですか？","scene":"旅行","alts":["Let's walk instead of riding the bus."]},{"id":"P37_13","en":"How about a cup of coffee before we start?","tpl":"[[How about]] a cup of coffee before we start?","jp":"始める前にコーヒーでも1杯どうですか？","scene":"会議","alts":["Would you like coffee before we begin?"]},{"id":"P37_14","en":"How about going to the art museum this Sunday?","tpl":"[[How about]] going to the art museum this Sunday?","jp":"今度の日曜日に美術館へ行くのはどうですか？","scene":"友人","alts":["Want to visit the art museum Sunday?"]},{"id":"P37_15","en":"How about simplifying the chart on slide four?","tpl":"[[How about]] simplifying the chart on slide four?","jp":"4枚目のスライドのグラフをシンプルにするのはどうですか？","scene":"会議","alts":["We could simplify the chart on slide four."]},{"id":"P37_16","en":"How about booking a window seat for the view?","tpl":"[[How about]] booking a window seat for the view?","jp":"景色が見えるように窓側の席を予約するのはどうですか？","scene":"旅行","alts":["Let's get a window seat for the view."]},{"id":"P37_17","en":"How about checking out that souvenir shop?","tpl":"[[How about]] checking out that souvenir shop?","jp":"あのお土産屋さんを見てみるのはどうですか？","scene":"買い物","alts":["Want to look inside that souvenir shop?"]},{"id":"P37_18","en":"How about testing it on a smartphone first?","tpl":"[[How about]] testing it on a smartphone first?","jp":"まずスマホでテストしてみるのはどうですか？","scene":"職場","alts":["Let's test it on mobile first."]},{"id":"P37_19","en":"How about wrapping up early today?","tpl":"[[How about]] wrapping up early today?","jp":"今日は早めに切り上げるのはどうですか？","scene":"職場","alts":["Shall we call it a day early?"]},{"id":"P37_20","en":"How about dessert? Are you still hungry?","tpl":"[[How about]] dessert? Are you still hungry?","jp":"デザートはどうですか？まだ食べられますか？","scene":"レストラン","alts":["Would you like some dessert?"]}]},{"id":"P38","catId":"cat4","pattern":"Is there any ...?","meaning":"〜は何かありますか？","grammar":"Is there any + 不可算名詞／単数名詞?（複数なら Are there any + 複数名詞?）で、存在や可能性を尋ねます。","usage":"ホテル・レストラン・買い物での確認、会議での質問募集、旅行中の空き状況チェックなどに大活躍します。","nuance":"any を入れることで「何か一つでも・少しでもありますか？」という自然な疑問文になります。","similar":"Do you have any ...?（お店や相手が持っているか聞く）","pitfall":"可算名詞の複数形（seats, questions など）を聞くときは Are there any ...? に変えましょう。","dialogue":[{"speaker":"A","en":"Before we wrap up, is there any chance we can move the review to Thursday?","jp":"終える前に、レビューを木曜日に移せる可能性はありますか？"},{"speaker":"B","en":"Let me check. Thursday morning looks wide open.","jp":"確認しますね。木曜の午前中はかなり空いていますよ。"},{"speaker":"A","en":"Awesome. Is there any other topic we need to cover today?","jp":"よかった。今日他に扱うべき議題はありますか？"},{"speaker":"B","en":"Nope, I think we covered everything on the list.","jp":"いいえ、リストの項目は全部カバーできたと思います。"}],"drills":{"subject":{"en":"Are there any seats left on the evening train?","jp":"夕方の電車に空席は残っていますか？"},"tense":{"en":"Was there any feedback from the Tokyo office?","jp":"東京オフィスから何かフィードバックはありましたか？"},"negative":{"en":"Isn't there any quicker way to get downtown?","jp":"中心部へ行くもっと速い方法はありませんか？"},"question":{"en":"Is there any extra charge for late checkout?","jp":"レイトチェックアウトに追加料金はかかりますか？"}},"examples":[{"id":"P38_01","en":"Is there any chance we can reschedule?","tpl":"[[Is there any]] chance we can reschedule?","jp":"日程を変更できる可能性はありますか？","scene":"会議","alts":["Could we possibly reschedule?"]},{"id":"P38_02","en":"Is there any extra fee for checking a second bag?","tpl":"[[Is there any]] extra fee for checking a second bag?","jp":"2つ目の荷物を預けるのに追加料金はかかりますか？","scene":"海外出張","alts":["Is there a fee for a second checked bag?"]},{"id":"P38_03","en":"Is there any coffee left in the pot?","tpl":"[[Is there any]] coffee left in the pot?","jp":"ポットにコーヒーは残っていますか？","scene":"職場","alts":["Is there still coffee in the pot?"]},{"id":"P38_04","en":"Is there any vegetarian option on the menu?","tpl":"[[Is there any]] vegetarian option on the menu?","jp":"メニューにベジタリアン対応の料理はありますか？","scene":"レストラン","alts":["Do you have any vegetarian dishes?"]},{"id":"P38_05","en":"Is there any discount for paying in advance?","tpl":"[[Is there any]] discount for paying in advance?","jp":"前払い割引はありますか？","scene":"ホテル","alts":["Do you offer an advance-payment discount?"]},{"id":"P38_06","en":"Is there any Wi-Fi available in the lobby?","tpl":"[[Is there any]] Wi-Fi available in the lobby?","jp":"ロビーでWi-Fiは使えますか？","scene":"ホテル","alts":["Do you have Wi-Fi in the lobby?"]},{"id":"P38_07","en":"Is there any update on the delivery?","tpl":"[[Is there any]] update on the delivery?","jp":"配送状況のアップデートはありますか？","scene":"買い物","alts":["Has there been any update on the shipment?"]},{"id":"P38_08","en":"Is there any reason we can't start tomorrow?","tpl":"[[Is there any]] reason we can't start tomorrow?","jp":"明日始められない理由は何かありますか？","scene":"会議","alts":["Why can't we start tomorrow?"]},{"id":"P38_09","en":"Is there any pharmacy near this hotel?","tpl":"[[Is there any]] pharmacy near this hotel?","jp":"このホテルの近くに薬局はありますか？","scene":"旅行","alts":["Is there a drugstore nearby?"]},{"id":"P38_10","en":"Is there any difference between these two models?","tpl":"[[Is there any]] difference between these two models?","jp":"この2つのモデルに何か違いはありますか？","scene":"買い物","alts":["How do these two models differ?"]},{"id":"P38_11","en":"Is there any homework before next week's session?","tpl":"[[Is there any]] homework before next week's session?","jp":"来週のセッションまでに事前課題はありますか？","scene":"職場","alts":["Do we have any prep work for next week?"]},{"id":"P38_12","en":"Is there any spice in this soup?","tpl":"[[Is there any]] spice in this soup?","jp":"このスープにスパイスは入っていますか？","scene":"レストラン","alts":["Is this soup spicy?"]},{"id":"P38_13","en":"Is there any shuttle bus to the convention center?","tpl":"[[Is there any]] shuttle bus to the convention center?","jp":"展示会場行きのシャトルバスはありますか？","scene":"海外出張","alts":["Does a shuttle go to the convention center?"]},{"id":"P38_14","en":"Is there any room for negotiation on the price?","tpl":"[[Is there any]] room for negotiation on the price?","jp":"価格交渉の余地はありますか？","scene":"職場","alts":["Is the price negotiable?"]},{"id":"P38_15","en":"Is there any ATM inside the station?","tpl":"[[Is there any]] ATM inside the station?","jp":"駅の中にATMはありますか？","scene":"旅行","alts":["Can I find an ATM in the station?"]},{"id":"P38_16","en":"Is there any problem with my reservation?","tpl":"[[Is there any]] problem with my reservation?","jp":"私の予約に何か問題はありますか？","scene":"ホテル","alts":["Is everything okay with my booking?"]},{"id":"P38_17","en":"Is there any parking space behind the restaurant?","tpl":"[[Is there any]] parking space behind the restaurant?","jp":"レストランの裏に駐車スペースはありますか？","scene":"レストラン","alts":["Do you have parking in the back?"]},{"id":"P38_18","en":"Is there any other document I need to sign?","tpl":"[[Is there any]] other document I need to sign?","jp":"他に署名が必要な書類はありますか？","scene":"職場","alts":["Do I need to sign anything else?"]},{"id":"P38_19","en":"Is there any wait time for a table of four?","tpl":"[[Is there any]] wait time for a table of four?","jp":"4名席は待ち時間がありますか？","scene":"レストラン","alts":["Is there a wait for four people?"]},{"id":"P38_20","en":"Is there any local specialty I shouldn't miss?","tpl":"[[Is there any]] local specialty I shouldn't miss?","jp":"見逃せない地元の名物はありますか？","scene":"旅行","alts":["What local food should I definitely try?"]}]},{"id":"P39","catId":"cat4","pattern":"I was wondering if ...","meaning":"もしよろしければ〜かなと思いまして","grammar":"I was wondering if + 主語 + 動詞（現在形または過去形）で、非常に丁寧かつ控えめに依頼・質問をします。","usage":"ビジネスメール・上司や取引先への相談、ホテルでのリクエスト、少し頼みにくいお願いをするときに最適です。","nuance":"過去進行形（was wondering）を使うことで距離感と礼儀正しさが生まれ、ネイティブが最も好む丁寧表現の一つです。","similar":"Could you possibly ...?（〜していただくことは可能でしょうか）／ Would it be possible to ...?（〜は可能でしょうか）","pitfall":"疑問文ではなく平叙文なので、語順は「if + 主語 + 動詞」にし、文末はピリオド（.）にします。","dialogue":[{"speaker":"A","en":"Hi Sarah, do you have a quick second?","jp":"サラ、今少しだけいいですか？"},{"speaker":"B","en":"Sure, what's up?","jp":"いいよ、どうしたの？"},{"speaker":"A","en":"I was wondering if you could look over my slides before tomorrow's pitch.","jp":"明日のピッチの前にスライドを見ていただけないかと思いまして。"},{"speaker":"B","en":"Of course! Send me the link and I'll leave comments by four.","jp":"もちろん！リンクを送ってくれれば4時までにコメントを入れるよ。"}],"drills":{"subject":{"en":"We were wondering if your team could join our call.","jp":"御社のチームにも通話に参加していただけないかと思いまして。"},"tense":{"en":"I was wondering if you had received my email.","jp":"私のメールが届いているか気になりまして。"},"negative":{"en":"I was wondering if you wouldn't mind switching seats.","jp":"もし差し支えなければ席を替わっていただけないかと思いまして。"},"question":{"en":"I was wondering if there's an earlier flight available.","jp":"もっと早い便に空きがあるかなと思いまして。"}},"examples":[{"id":"P39_01","en":"I was wondering if you could help me with this.","tpl":"[[I was wondering if]] you could help me with this.","jp":"これをお手伝いいただけないかと思いまして。","scene":"職場","alts":["Could you possibly help me with this?"]},{"id":"P39_02","en":"I was wondering if you're free for lunch tomorrow.","tpl":"[[I was wondering if]] you're free for lunch tomorrow.","jp":"明日ランチのお時間があるかなと思いまして。","scene":"友人","alts":["Are you free for lunch tomorrow?"]},{"id":"P39_03","en":"I was wondering if I could check in a little
