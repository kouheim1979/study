<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0071E3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ENGLISH 80">
  <title>ENGLISH 80 — 80の基本構文で自由に話す英会話トレーニング</title>
  <style>
/* ENGLISH 80 — Apple-grade Minimalist Design System */
:root {
  --bg: #F5F6F8;
  --surface: #FFFFFF;
  --surface-2: #F0F2F5;
  --border: #E5E7EB;
  --border-strong: #D1D5DB;
  --text: #111827;
  --text-2: #4B5563;
  --text-3: #6B7280;
  --accent: #0071E3;
  --accent-hover: #005BB5;
  --accent-soft: rgba(0, 113, 227, 0.10);
  --fixed-bg: rgba(0, 113, 227, 0.12);
  --fixed-text: #0058B0;
  --var-bg: rgba(5, 150, 105, 0.11);
  --var-text: #047857;
  --success: #10B981;
  --success-soft: rgba(16, 185, 129, 0.12);
  --warn: #F59E0B;
  --warn-soft: rgba(245, 158, 11, 0.14);
  --danger: #EF4444;
  --danger-soft: rgba(239, 68, 68, 0.12);
  --lv1: #E5E7EB;
  --lv1-text: #6B7280;
  --lv2: #BFDBFE;
  --lv2-text: #1E40AF;
  --lv3: #93C5FD;
  --lv3-text: #1E3A8A;
  --lv4: #34D399;
  --lv4-text: #065F46;
  --lv5: #059669;
  --lv5-text: #FFFFFF;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
  --shadow-md: 0 6px 20px rgba(15, 23, 42, 0.07);
  --radius: 16px;
  --radius-sm: 10px;
  --nav-h: 64px;
  --header-h: 56px;
}

[data-theme="dark"] {
  --bg: #0B0D11;
  --surface: #141820;
  --surface-2: #1C222D;
  --border: #262E3D;
  --border-strong: #374151;
  --text: #F3F4F6;
  --text-2: #D1D5DB;
  --text-3: #9CA3AF;
  --accent: #3B9EFF;
  --accent-hover: #60B0FF;
  --accent-soft: rgba(59, 158, 255, 0.16);
  --fixed-bg: rgba(59, 158, 255, 0.18);
  --fixed-text: #7CC4FF;
  --var-bg: rgba(52, 211, 153, 0.16);
  --var-text: #6EE7B7;
  --success: #34D399;
  --success-soft: rgba(52, 211, 153, 0.16);
  --warn: #FBBF24;
  --warn-soft: rgba(251, 191, 36, 0.16);
  --danger: #F87171;
  --danger-soft: rgba(248, 113, 113, 0.16);
  --lv1: #232A37;
  --lv1-text: #9CA3AF;
  --lv2: #1E3A5F;
  --lv2-text: #93C5FD;
  --lv3: #1D4ED8;
  --lv3-text: #DBEAFE;
  --lv4: #047857;
  --lv4-text: #A7F3D0;
  --lv5: #10B981;
  --lv5-text: #042F2E;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
}

*, *::before, *::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  font-size: 15px;
  line-height: 1.55;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
}

button, input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: none;
  padding: 0;
}

/* Top Header */
.app-header {
  position: sticky;
  top: 0;
  z-index: 40;
  height: var(--header-h);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  letter-spacing: -0.02em;
  font-size: 17px;
  cursor: pointer;
}

.brand-mark {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  background: var(--accent);
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: -0.04em;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.streak-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border-radius: 999px;
  background: var(--warn-soft);
  color: var(--warn);
  font-weight: 700;
  font-size: 13px;
}

.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: var(--surface-2);
  color: var(--text);
  display: grid;
  place-items: center;
  transition: background 0.15s ease, transform 0.1s ease;
}

.icon-btn:hover { background: var(--border); }
.icon-btn:active { transform: scale(0.95); }

/* Main Container */
.app-main {
  max-width: 980px;
  margin: 0 auto;
  padding: 16px 16px calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 28px);
}

/* Bottom Navigation (Mobile One-Hand First) */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 45;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: var(--text-3);
  font-size: 11px;
  font-weight: 600;
  transition: color 0.15s ease;
}

.nav-item.active { color: var(--accent); }
.nav-item svg { width: 21px; height: 21px; }

/* Cards & Surfaces */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow-sm);
}

.card + .card { margin-top: 14px; }

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.section-title {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.015em;
  margin: 0;
}

.muted { color: var(--text-3); font-size: 13px; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 44px;
  padding: 10px 16px;
  border-radius: 12px;
  font-weight: 600;
  font-size: 14px;
  transition: background 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
}

.btn:active { transform: scale(0.98); }
.btn svg { width: 17px; height: 17px; flex-shrink: 0; }
.walking-big-btn svg { width: 30px; height: 30px; }

.btn-primary {
  background: var(--accent);
  color: #FFFFFF;
}
.btn-primary:hover { background: var(--accent-hover); }

.btn-secondary {
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--border); }

.btn-success {
  background: var(--success);
  color: #FFFFFF;
}

.btn-danger {
  background: var(--danger-soft);
  color: var(--danger);
}

.btn-sm {
  min-height: 36px;
  padding: 6px 12px;
  font-size: 13px;
  border-radius: 9px;
}

.btn-block { width: 100%; }

/* Uniform Grids */
.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

@media (max-width: 600px) {
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
}

/* Home Hero Summary */
.hero-card {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 16px;
  align-items: center;
}

@media (max-width: 600px) {
  .hero-card { grid-template-columns: 1fr; }
}

.kpi-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-top: 14px;
}

@media (max-width: 640px) {
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
}

.kpi-box {
  background: var(--surface-2);
  border-radius: 12px;
  padding: 12px;
}
.kpi-val { font-size: 21px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; }
.kpi-lbl { font-size: 12px; color: var(--text-3); margin-top: 3px; }

/* 80-Pattern Mastery Map */
.legend-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
}

.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--text-2);
}

.legend-dot {
  width: 11px;
  height: 11px;
  border-radius: 3px;
}

.cat-block {
  margin-top: 16px;
}

.cat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.cat-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 14px;
}

.cat-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

.map-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}

@media (max-width: 680px) {
  .map-grid { grid-template-columns: repeat(2, 1fr); }
}

.map-tile {
  text-align: left;
  padding: 10px 11px;
  border-radius: 12px;
  border: 1px solid var(--border);
  transition: transform 0.12s ease, border-color 0.15s ease;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 76px;
  position: relative;
}

.map-tile:hover { transform: translateY(-1px); border-color: var(--accent); }
.map-tile.lv-1 { background: var(--lv1); color: var(--lv1-text); }
.map-tile.lv-2 { background: var(--lv2); color: var(--lv2-text); }
.map-tile.lv-3 { background: var(--lv3); color: var(--lv3-text); }
.map-tile.lv-4 { background: var(--lv4); color: var(--lv4-text); }
.map-tile.lv-5 { background: var(--lv5); color: var(--lv5-text); }

.tile-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  font-weight: 700;
  opacity: 0.85;
}

.tile-pattern {
  font-size: 13.5px;
  font-weight: 700;
  line-height: 1.25;
  margin-top: 4px;
  color: inherit;
}

.tile-jp {
  font-size: 11px;
  opacity: 0.85;
  margin-top: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.due-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--warn);
  display: inline-block;
}

/* Fixed vs Variable Color-Coding */
.en-sentence {
  font-size: 21px;
  font-weight: 600;
  line-height: 1.5;
  letter-spacing: -0.01em;
}

.en-sentence-lg {
  font-size: 25px;
  font-weight: 700;
  line-height: 1.45;
  letter-spacing: -0.015em;
}

@media (max-width: 520px) {
  .en-sentence { font-size: 18px; }
  .en-sentence-lg { font-size: 21px; }
}

.seg-fixed {
  background: var(--fixed-bg);
  color: var(--fixed-text);
  padding: 2px 6px;
  border-radius: 6px;
  font-weight: 700;
}

.seg-var {
  background: var(--var-bg);
  color: var(--var-text);
  padding: 2px 6px;
  border-radius: 6px;
  font-weight: 600;
}

/* Segmented Controls / Tabs */
.seg-bar {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 4px;
  background: var(--surface-2);
  padding: 4px;
  border-radius: 12px;
  margin-bottom: 14px;
}

.seg-btn {
  padding: 8px 10px;
  border-radius: 9px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-2);
  text-align: center;
  transition: background 0.15s ease, color 0.15s ease;
}

.seg-btn.active {
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}

/* Mode Launcher Grid */
.mode-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 15px;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: border-color 0.15s ease, transform 0.12s ease;
}

.mode-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.mode-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--accent-soft);
  color: var(--accent);
  display: grid;
  place-items: center;
}
.mode-name { font-weight: 700; font-size: 15px; }
.mode-desc { font-size: 12.5px; color: var(--text-3); line-height: 1.4; }

/* Pattern Study Detail */
.info-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 12px;
}

@media (max-width: 640px) {
  .info-grid { grid-template-columns: 1fr; }
}

.info-box {
  background: var(--surface-2);
  border-radius: 12px;
  padding: 13px;
}

.info-box-label {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 4px;
}

.example-row {
  padding: 13px 0;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.example-row:last-child { border-bottom: none; }

.scene-tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 6px;
  background: var(--surface-2);
  color: var(--text-2);
  margin-bottom: 5px;
}

/* Dialogue */
.dialogue-line {
  display: flex;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--surface-2);
  margin-bottom: 8px;
  align-items: flex-start;
}

.speaker-badge {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.speaker-badge.b { background: var(--success); }

/* Inputs & Textareas */
.input-field {
  width: 100%;
  min-height: 46px;
  padding: 11px 14px;
  border-radius: 12px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  font-size: 16px;
  outline: none;
  transition: border-color 0.15s ease;
}

.input-field:focus { border-color: var(--accent); }

/* Speech Diff Tokens */
.word-ok {
  color: var(--success);
  font-weight: 700;
}

.word-miss {
  background: var(--danger-soft);
  color: var(--danger);
  padding: 1px 5px;
  border-radius: 5px;
  font-weight: 700;
  text-decoration: underline wavy var(--danger);
}

/* Timer Bar */
.timer-track {
  height: 6px;
  background: var(--surface-2);
  border-radius: 999px;
  overflow: hidden;
  margin: 10px 0;
}

.timer-fill {
  height: 100%;
  background: var(--accent);
  transition: width 0.1s linear;
}

.timer-fill.warn { background: var(--warn); }
.timer-fill.danger { background: var(--danger); }

/* Mic Pulse */
.mic-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 48px;
  padding: 10px 20px;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
  font-weight: 700;
}

.mic-btn.recording {
  background: var(--danger);
  animation: micPulse 1.3s infinite;
}

@keyframes micPulse {
  0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.45); }
  70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
  100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
}

/* Chat Bubbles (AI Conversation) */
.chat-box {
  max-height: 360px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 4px 2px;
}

.bubble {
  max-width: 85%;
  padding: 11px 14px;
  border-radius: 15px;
  font-size: 15px;
  line-height: 1.5;
}

.bubble.ai {
  align-self: flex-start;
  background: var(--surface-2);
  border-bottom-left-radius: 4px;
}

.bubble.user {
  align-self: flex-end;
  background: var(--accent);
  color: #FFFFFF;
  border-bottom-right-radius: 4px;
}

/* Walking Mode */
.walking-stage {
  text-align: center;
  padding: 26px 18px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--border);
}

.walking-phase {
  display: inline-block;
  padding: 5px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  background: var(--accent-soft);
  color: var(--accent);
  margin-bottom: 14px;
}

.walking-big-btn {
  width: 84px;
  height: 84px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  display: inline-grid;
  place-items: center;
  box-shadow: var(--shadow-md);
}

/* Progress Bars */
.bar-track {
  height: 8px;
  border-radius: 999px;
  background: var(--surface-2);
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  border-radius: 999px;
  background: var(--accent);
  transition: width 0.3s ease;
}

/* Modal & Toast */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(15, 23, 42, 0.55);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.modal-backdrop.open { display: flex; }

.modal-sheet {
  width: 100%;
  max-width: 480px;
  max-height: 86vh;
  overflow-y: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  box-shadow: var(--shadow-md);
}

.toast {
  position: fixed;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 14px);
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--text);
  color: var(--surface);
  padding: 10px 16px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
  z-index: 70;
  max-width: 90vw;
  text-align: center;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.notice-box {
  background: var(--surface-2);
  border-left: 3px solid var(--accent);
  padding: 10px 13px;
  border-radius: 0 10px 10px 0;
  font-size: 12.5px;
  color: var(--text-2);
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  background: var(--surface-2);
  color: var(--text-2);
}

.pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.success { background: var(--success-soft); color: var(--success); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }

.flex-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.flex-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.mt-8 { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.mt-16 { margin-top: 16px; }
.hidden { display: none !important; }


/* Motivation-first visual refresh — ENGLISH 80 */
:root {
 --bg:#f4f5ff;--surface:#fff;--surface-2:#f2f3fb;--border:#e0e2f0;--border-strong:#c8cce1;
 --text:#20243e;--text-2:#4c5672;--text-3:#626b84;--accent:#5145db;--accent-hover:#4133bf;
 --accent-soft:#efedff;--radius:22px;--radius-sm:14px;--nav-h:72px;
 --shadow-sm:0 3px 12px #2528590a;--shadow-md:0 10px 28px #25285915;
 --lv1:#f8f8fc;--lv1-text:#515b74;--lv2:#e6e3ff;--lv2-text:#4737b7;
 --lv3:#dcecff;--lv3-text:#174da0;--lv4:#d5f6e8;--lv4-text:#08654b;--lv5:#087b59;--lv5-text:#fff;
}
[data-theme="dark"]{
 --bg:#111324;--surface:#1c2036;--surface-2:#252a43;--border:#353b56;--border-strong:#525b7c;
 --text:#f3f4ff;--text-2:#c9cde4;--text-3:#aeb6d2;--accent:#a99cff;--accent-hover:#bdb2ff;--accent-soft:#343054;
 --lv1:#252a43;--lv1-text:#c9cde4;--lv2:#423676;--lv2-text:#e0d9ff;--lv3:#234b83;--lv3-text:#e0edff;
 --lv4:#1e594c;--lv4-text:#baf6da;--lv5:#0a7857;--lv5-text:#fff;
}
html,body{background:var(--bg)}
.app-main{max-width:940px;padding-top:20px}
.app-header{height:var(--header-h);padding-inline:max(16px,env(safe-area-inset-left,0px))}
.brand-mark{width:34px;height:34px;border-radius:12px;background:linear-gradient(145deg,#7865ff,#4332bd);box-shadow:0 3px 0 #32269c;font-size:15px}
.brand{font-size:18px;letter-spacing:-.035em}
.streak-pill{background:#fff1d5;color:#9b4900;padding:6px 10px}
[data-theme="dark"] .streak-pill{background:#543916;color:#ffcf83}
.streak-pill svg{width:16px;height:16px}
.card{border-radius:22px;box-shadow:var(--shadow-sm);padding:20px}
.btn{border-radius:14px;min-height:46px;font-weight:750;transition:transform .12s,background .15s,box-shadow .15s}
.btn-sm{min-height:36px}
.btn-primary{background:#5145db;color:white;box-shadow:0 3px 0 #382ca6}
.btn-primary:hover{background:#4337c4}
.btn-success{background:#087b59;color:white;box-shadow:0 3px 0 #065c43}
.btn-secondary{box-shadow:0 2px 0 var(--border)}
.btn:active{transform:translateY(2px);box-shadow:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.bottom-nav{box-shadow:0 -4px 22px #2528590b}
.nav-item{margin:6px 3px 5px;border-radius:15px;gap:4px;font-size:10.5px}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:800}
.nav-item svg{width:23px;height:23px}
.hero-card.mot-hero{display:grid;grid-template-columns:minmax(0,1fr) 136px;gap:18px;align-items:center;position:relative;overflow:hidden;background:linear-gradient(135deg,#28226f 0%,#5041c6 65%,#7260de 100%);color:#fff;border:0;padding:25px;box-shadow:0 12px 25px #4232aa26}
.mot-hero:before{content:"";position:absolute;right:-45px;top:-70px;width:245px;height:245px;border:38px solid #ffffff0b;border-radius:50%;pointer-events:none}
.mot-hero>*{position:relative}
.mot-eyebrow{font-size:10px;letter-spacing:.15em;font-weight:850;color:#e0d9ff;text-transform:uppercase}
.mot-hero h1{font-size:clamp(24px,4.6vw,34px);line-height:1.22;margin:8px 0 9px;letter-spacing:-.045em;font-weight:850}
.mot-hero p{font-size:13px;line-height:1.65;color:#f0edff;margin:0}
.mot-hero .btn-primary{background:#fff;color:#34279e;box-shadow:0 3px 0 #d3caff;min-height:48px}
.mot-hero .btn-secondary{background:#ffffff17;border-color:#ffffff45;color:white;box-shadow:none}
.mot-ring{--pct:0;display:grid;place-items:center;width:124px;height:124px;margin:auto;border-radius:50%;background:conic-gradient(#a9f5cf calc(var(--pct)*1%),#ffffff25 0);padding:9px}
.mot-ring-inner{display:grid;place-content:center;text-align:center;width:100%;height:100%;border-radius:50%;background:#4237a3;color:white}
.mot-ring-inner strong{font-size:32px;line-height:1;letter-spacing:-.05em}
.mot-ring-inner span{font-size:11px;color:#ece7ff;margin-top:6px}
.mot-hero-footer{display:flex;justify-content:center;color:#e0d9ff;font-size:11px;margin-top:9px;font-weight:700}
.mot-today{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:16px}
.mot-today .card{margin:0;min-width:0}
.mot-kicker{font-size:10px;letter-spacing:.12em;color:var(--accent);font-weight:850}
.mot-heading{font-size:17px;font-weight:850;margin:4px 0 10px;line-height:1.35;letter-spacing:-.02em}
.mot-goal-number{font-size:30px;font-weight:850;line-height:1;letter-spacing:-.04em}
.mot-goal-number small{font-size:13px;color:var(--text-3);font-weight:650;letter-spacing:0}
.mot-progress{height:12px;background:var(--surface-2);border-radius:20px;overflow:hidden;margin:12px 0 8px}
.mot-progress>span{display:block;height:100%;background:linear-gradient(90deg,#7162ef,#14a876);border-radius:20px;transition:width .4s}
.mot-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:10px;text-align:center}
.mot-day{display:grid;justify-items:center;gap:6px;font-size:10px;color:var(--text-3)}
.mot-day i{width:30px;height:30px;display:grid;place-items:center;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);font-size:13px;font-style:normal;font-weight:800}
.mot-day.done i{background:#d3f5e5;color:#08654b;border-color:#a4e6c8}
.mot-day.today i{outline:2px solid var(--accent);outline-offset:1px}
[data-theme="dark"] .mot-day.done i{background:#215b49;color:#c0ffe2;border-color:#408c72}
.mot-mini{font-size:12px;color:var(--text-3);margin-top:9px}
.kpi-row{gap:10px;margin-top:16px}
.kpi-box{background:var(--surface);border:1px solid var(--border);border-radius:17px;box-shadow:var(--shadow-sm);padding:14px}
.kpi-val{font-size:24px;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.035em}
.kpi-lbl{font-size:11px;line-height:1.35;margin-top:6px}
.mot-map{margin-top:18px}
.mot-map .section-head{align-items:flex-start}
.mot-map .section-title{font-size:20px;font-weight:850;letter-spacing:-.03em}
.mot-map .legend-row{gap:6px 11px;line-height:1.5}
.mot-map .legend-dot{border:1px solid var(--border-strong)}
.cat-block{margin-top:22px;border-top:1px solid var(--border);padding-top:16px}
.cat-header{align-items:center;gap:10px}
.cat-badge{gap:10px;min-width:0;font-size:14px;font-weight:800}
.mot-cat-number{display:grid;place-items:center;width:34px;height:34px;flex:0 0 34px;border-radius:12px;background:var(--cat-color);color:#fff;font-size:13px;font-weight:850}
.mot-cat-progress{flex:0 0 72px;text-align:right;font-size:11px;font-weight:800;color:var(--text-2)}
.mot-cat-progress .bar-track{height:5px;margin-top:4px}
.map-grid{gap:9px}
.map-tile{border-radius:15px;min-height:92px;padding:10px;box-shadow:0 2px 0 var(--border);justify-content:flex-start;gap:3px;overflow:hidden}
.map-tile.lv-5{border-color:#087b59;box-shadow:0 3px 0 #065c43}
.map-tile.lv-4{border-color:#9cddc4}
[data-theme="dark"] .map-tile.lv-4{border-color:#357c68}
.tile-top{opacity:1;font-size:10px}
.tile-pattern{font-size:14px;line-height:1.28;overflow-wrap:anywhere}
.tile-jp{white-space:normal;overflow:visible;font-size:11px;line-height:1.35;opacity:.94}
.tile-top .mot-level{padding:1px 5px;border-radius:6px;background:#ffffff65}
[data-theme="dark"] .tile-top .mot-level,.map-tile.lv-5 .mot-level{background:#ffffff20}
.info-box,.dialogue-line{border-radius:15px}
.input-field{border-radius:14px}
.seg-bar{padding:5px;border-radius:15px}
.seg-btn{border-radius:11px}
.seg-btn.active{color:var(--accent);font-weight:800}
.walking-stage{border-radius:24px;box-shadow:var(--shadow-md)}
.walking-big-btn,.mic-btn{background:#5145db;color:white;box-shadow:0 5px 0 #382ca6}
.mic-btn.recording{background:#dc2626;box-shadow:none}
.timer-track,.bar-track{border-radius:20px}
.toast{border-radius:16px}
@media(max-width:600px){
 .app-main{padding:12px 12px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px)}
 .card{padding:15px;border-radius:19px}
 .hero-card.mot-hero{grid-template-columns:minmax(0,1fr) 93px;padding:18px 15px;gap:10px}
 .mot-ring{width:90px;height:90px;padding:6px}
 .mot-ring-inner strong{font-size:25px}.mot-ring-inner span{font-size:9px}
 .mot-hero .flex-row{display:grid;grid-template-columns:1fr;gap:8px}
 .mot-hero .btn{font-size:12px;padding:10px 8px;white-space:normal;line-height:1.35;min-height:42px}
 .mot-hero-footer{font-size:9px}
 .mot-today{grid-template-columns:1fr;gap:10px;margin-top:12px}
 .mot-today .card{padding:14px 16px}
 .mot-day i{width:34px;height:34px}
 .mot-map .section-head{flex-wrap:wrap}
 .mot-map .flex-row select{max-width:100%;width:100%!important}
 .kpi-row{margin-top:12px}
}
@media(max-width:345px){.mot-day i{width:27px;height:27px}.hero-card.mot-hero{grid-template-columns:1fr}.mot-ring{margin:auto}.nav-item{font-size:9px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}

 
.growth-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.growth-step{display:flex;flex-direction:column;gap:5px;align-items:flex-start;text-align:left;background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:12px;min-width:0}
.growth-step.current{border:2px solid var(--stage-color);padding:11px;box-shadow:0 3px 0 var(--border)}
.growth-step-index{background:var(--stage-color);color:white;border-radius:11px;padding:5px 10px;font-size:13px;font-weight:850}
.growth-step-name{font-size:14px;font-weight:850;line-height:1.3}
.growth-step-count{font-weight:850;font-size:21px;letter-spacing:-.03em;margin-top:3px}
.growth-step-track{height:7px;width:100%;border-radius:20px;background:var(--border);overflow:hidden}
.growth-step-track>span{display:block;height:100%;background:var(--stage-color);border-radius:20px}
.growth-group-actions{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:9px 0 12px}
.mot-map{scroll-margin-top:calc(var(--header-h) + 12px)}
@media(max-width:600px){.growth-steps{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.growth-step-name{font-size:13px}.growth-step{padding:11px}.growth-step.current{padding:10px}}
</style>
</head>
<body>
