<title>ミミトレ 英語リスニング</title>
<style>
/* VOICE   everyday study: upbeat and focused, a pocket gym for the ears
   IDEA    a pocket audio trainer: transport keys, a tuning scale for speed, an on-air light
   PICTURE the daily goal dial on a cobalt field; in drills, the coral play key above the live sentence
   COLOUR  white ground, cobalt #2b3bff field, coral signal, ink #0c1233; night is deep indigo
   TYPE    system rounded (SF Pro Rounded / Hiragino Maru Gothic) for figures and titles, system sans for text
   LAYOUT  phone: cobalt band with dial, menu list, bottom tabs; 900px+: side rail and a 760px column */
:root{color-scheme:light dark;--bg:#ffffff;--ink:#0c1233;--mute:#596084;--line:#e3e6f5;--card:#f3f4ff;--card2:#e6e9ff;--brand:#2b3bff;--brand-ink:#ffffff;--brand-soft:#e8ebff;--hot:#e3304a;--hot-ink:#ffffff;--hot-soft:#ffe8eb;--warn:#a86200;--warn-soft:#fff0d4;--field:#2b3bff;--field-ink:#ffffff;--field-mute:rgba(255,255,255,.76);--shadow:0 1px 2px rgba(12,18,51,.08),0 4px 14px -8px rgba(12,18,51,.3);
--f-ui:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
--f-round:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Arial Rounded MT Bold",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
--f-en:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a0d26;--ink:#eef0ff;--mute:#a4aad0;--line:#262c58;--card:#131839;--card2:#1c2250;--brand:#8c95ff;--brand-ink:#0a0d26;--brand-soft:#1f2662;--hot:#ff6b78;--hot-ink:#1a0710;--hot-soft:#3b1830;--warn:#ffc35a;--warn-soft:#3a2c10;--field:#1b237a;--field-ink:#ffffff;--field-mute:rgba(255,255,255,.74);--shadow:none}}
:root[data-theme=dark]{--bg:#0a0d26;--ink:#eef0ff;--mute:#a4aad0;--line:#262c58;--card:#131839;--card2:#1c2250;--brand:#8c95ff;--brand-ink:#0a0d26;--brand-soft:#1f2662;--hot:#ff6b78;--hot-ink:#1a0710;--hot-soft:#3b1830;--warn:#ffc35a;--warn-soft:#3a2c10;--field:#1b237a;--field-ink:#ffffff;--field-mute:rgba(255,255,255,.74);--shadow:none}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-ui);overflow:hidden;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}

.logo svg{width:30px;height:30px;flex:none}
.top .eq{opacity:0;transition:opacity .2s}

main{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.wrap{max-width:760px;margin:0 auto;padding:6px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.tabs{display:flex;flex:none;background:var(--bg);border-top:1px solid var(--line);padding:4px max(4px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 4px) max(4px,env(safe-area-inset-left,0px))}

@media(min-width:900px){#app{display:grid;grid-template-columns:96px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}.top{grid-column:1/3}.tabs{grid-row:2;grid-column:1;flex-direction:column;justify-content:flex-start;gap:6px;border-top:0;border-right:1px solid var(--line);padding:14px 8px}.tab{flex:none;min-height:66px;font-size:12px}main{grid-row:2;grid-column:2}}

.hero-in{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);grid-template-areas:"t t" "d s" "a a";gap:14px 20px;align-items:center;max-width:760px;margin:0 auto}
.hero-t{grid-area:t}

@media(min-width:600px){.hero{padding-top:18px;padding-bottom:28px}.hero-in{grid-template-columns:220px minmax(0,1fr);grid-template-areas:"d t" "d s" "d a";align-items:end}.hero-stats{display:flex;flex-wrap:wrap;gap:8px 28px}.hs{display:block}.hs b{display:block;font-size:28px}}

.mi.done .st{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.mi.done .num,.mi.done b{color:var(--mute)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-weight:800;font-size:15px;white-space:nowrap;text-decoration:none}
.btn .ic{width:19px;height:19px}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

["Where will they meet?","どこで待ち合わせますか？",["At the station","At Ken's house","At the mountain","At a café"],"「Let's meet at the station at eight.」と言っています。"],
["What will Ken bring?","ケンは何を持っていきますか？",["Some snacks","Some drinks","A camera","A map"],"最後に「I'll bring some snacks.」と言っています。"]],
v:[["Do you have any plans for ~?","〜の予定はある？"],["I might just ~.","〜するだけかも"],["Do you want to come?","一緒に来る？（want to は「ワナ」に近い）"]]},
{id:'p03',lv:1,type:'t',title:"Store Announcement",ja:"スーパーの店内放送",s:[
["","Attention, shoppers. Thank you for shopping at Green Market.","お客様にお知らせいたします。グリーンマーケットをご利用いただきありがとうございます。"],
["","Today only, all fresh fruit is twenty percent off.","本日限り、生鮮フルーツが全品20％オフです。"],
["","Our bakery has fresh bread right out of the oven.","ベーカリーでは焼きたてのパンをご用意しております。"],
["","If you need help, please ask any staff member in a green apron.","お困りの際は、緑のエプロンを着けたスタッフにお声がけください。"],
["","Also, please note that the store will close early today, at seven p.m.","また、本日は午後7時に早めに閉店いたしますのでご注意ください。"],
["","We're sorry for any inconvenience. Have a nice day!","ご不便をおかけして申し訳ございません。良い一日を！"]],
q:[["What is on sale today?","今日セールになっているのは何ですか？",["Fresh fruit","Bread","Vegetables","Green aprons"],"「Today only, all fresh fruit is twenty percent off.」とあります。"],
["How can shoppers find a staff member?","客はどうやってスタッフを見つけられますか？",["Look for a green apron","Go to the bakery","Call the office","Check the website"],"「any staff member in a green apron」＝緑のエプロンのスタッフに聞くよう案内しています。"],
["What time will the store close today?","今日は何時に閉店しますか？",["At 7 p.m.","At 5 p.m.","At 9 p.m.","At 11 p.m."],"「the store will close early today, at seven p.m.」と言っています。"]],
v:[["Attention, shoppers.","お客様にお知らせします"],["right out of the oven","焼きたての"],["please note that ~","〜にご注意ください"]]},
{id:'p04',lv:1,type:'t',title:"A Phone Message",ja:"歯医者からの留守電",s:[
["","Hi, Emma. This is Lisa from Smile Dental Clinic.","もしもし、エマさん。スマイル歯科のリサです。"],
["","I'm calling about your appointment tomorrow at three o'clock.","明日3時のご予約の件でお電話しました。"],
["","I'm sorry, but Dr. Brown is sick and can't see patients tomorrow.","申し訳ないのですが、ブラウン先生が体調不良で、明日は診察ができません。"],
["","Could we move your appointment to Friday at the same time?","ご予約を金曜日の同じ時間に変更できますでしょうか？"],
["","Please call me back at five five five, two eight one oh.","555-2810まで折り返しお電話ください。"],
["","Thanks, and sorry for the trouble.","よろしくお願いします。ご迷惑をおかけしてすみません。"]],
q:[["Why is Lisa calling?","リサはなぜ電話していますか？",["To change an appointment","To make a new appointment","To ask about a payment","To give test results"],"予約を金曜日に移せないかと頼んでいます（move your appointment）。"],
["When is the new appointment?","新しい予約はいつですか？",["Friday at three","Tomorrow at three","Friday at two","Thursday at three"],"「Friday at the same time」＝元の予約と同じ3時です。"],
["What number should Emma call?","エマはどの番号に電話すべきですか？",["555-2810","555-2018","555-2180","555-8210"],"電話番号は1桁ずつ読み、0は「oh」と読むことが多いです。"]],
v:[["This is ~ from ...","…の〜です（電話での名乗り）"],["call me back","折り返し電話する"],["sorry for the trouble","ご迷惑をおかけします"]]},
{id:'p05',lv:1,type:'t',title:"My Morning Routine",ja:"わたしの朝の習慣",s:[
["","I usually get up at six thirty on weekdays.","平日はたいてい6時半に起きます。"],
["","First, I drink a glass of water and open the window.","まず、コップ1杯の水を飲んで窓を開けます。"],
["","Then I take a quick shower and make breakfast.","それからさっとシャワーを浴びて朝食を作ります。"],
["","I like to eat rice, miso soup, and an egg.","ご飯とみそ汁と卵を食べるのが好きです。"],
["","I leave home at seven forty and walk to the station.","7時40分に家を出て、駅まで歩きます。"],
["","It takes about ten minutes, so it's good exercise.","10分ほどかかるので、いい運動になります。"],
["","On weekends, I sleep until nine. That's my favorite part of the week!","週末は9時まで寝ます。それが一週間でいちばん好きな時間です！"]],
q:[["What does the speaker do first in the morning?","話し手が朝いちばんにすることは何ですか？",["Drinks a glass of water","Takes a shower","Makes breakfast","Walks to the station"],"「First, I drink a glass of water」と言っています。"],
["What time does the speaker leave home?","話し手は何時に家を出ますか？",["7:40","6:30","7:14","9:00"],"「seven forty」＝7時40分。forty（40）と fourteen（14）の違いに注意。"],
["How long is the walk to the station?","駅まで歩いて何分ですか？",["About ten minutes","About five minutes","About thirty minutes","About an hour"],"「It takes about ten minutes」とあります。"]],
v:[["get up","起きる"],["take a quick shower","さっとシャワーを浴びる"],["It takes about ~.","〜くらいかかる"]]},
{id:'p06',lv:2,type:'d',title:"Printer Problems",ja:"プリンターの故障",s:[
["A","Hi, Mark. Is the printer on the third floor working again?","ねえマーク、3階のプリンターはまた使えるようになった？"],
["B","I'm afraid not. The technician can't come until Thursday.","残念ながらまだなんだ。技術者が木曜日まで来られないって。"],
["A","Oh no. I need to print fifty copies of the sales report for tomorrow's meeting.","ええ、困った。明日の会議用に営業報告書を50部印刷しないといけないの。"],
["B","Why don't you use the one in the marketing department? It's usually free in the afternoon.","マーケティング部のを使ったら？午後はたいてい空いてるよ。"],
["A","Good idea. Do I need a password for it?","いい考えね。パスワードは必要？"],
["B","Yes, but I think it's written on a note next to the machine.","うん、でも機械の横のメモに書いてあると思う。"],
["A","Perfect. I'll head over there after lunch.","完璧。お昼のあとに行ってみるわ。"],
["B","And let me know if you need a hand putting the reports together.","報告書をまとめるのに手伝いが必要なら言ってね。"]],
q:[["What problem are the speakers discussing?","2人が話している問題は何ですか？",["A printer is not working.","A meeting was canceled.","A report is missing.","A password was changed."],"冒頭でプリンターが直ったか尋ね、「I'm afraid not.」と答えています。"],
["What does Mark suggest?","マークは何を提案していますか？",["Using another department's printer","Calling the technician","Postponing the meeting","Printing fewer copies"],"「Why don't you use the one in the marketing department?」＝別の部署のプリンターを使う提案です。"],
["What does Mark offer to do?","マークは何をすると申し出ていますか？",["Help put the reports together","Print the reports","Find the password","Lead the meeting"],"「let me know if you need a hand putting the reports together」＝まとめる作業を手伝う、です。"]],
v:[["I'm afraid not.","残念ながら違います"],["Why don't you ~?","〜したらどう？（提案）"],["need a hand","手伝いが必要だ"]]},
{id:'p07',lv:2,type:'d',title:"Hotel Check-in",ja:"ホテルのチェックイン",s:[
["A","Good evening. Welcome to the Harbor View Hotel. Do you have a reservation?","こんばんは。ハーバービューホテルへようこそ。ご予約はございますか？"],
["B","Yes, it's under the name Sato. Two nights, a double room.","はい、佐藤の名前で予約しています。2泊で、ダブルルームです。"],
["A","Let me see. Yes, Mr. Sato. Could I see your passport, please?","確認いたします。はい、佐藤様ですね。パスポートを拝見できますか？"],
["B","Sure, here it is. Is breakfast included?","はい、どうぞ。朝食は含まれていますか？"],
["A","It is. Breakfast is served from six thirty to ten in the restaurant on the second floor.","はい、含まれております。朝食は2階のレストランで6時半から10時までです。"],
["B","Great. And what's the Wi-Fi password?","よかった。それからWi-Fiのパスワードは？"],
["A","It's printed on the back of your key card. Your room is eight one five, on the eighth floor.","カードキーの裏に印刷してございます。お部屋は8階の815号室です。"],
["B","Thank you. Oh, and could I get a wake-up call at six tomorrow?","ありがとうございます。あ、明日6時にモーニングコールをお願いできますか？"],
["A","Of course. Enjoy your stay.","かしこまりました。ごゆっくりお過ごしください。"]],
q:[["How long will the guest stay?","客は何泊しますか？",["Two nights","One night","Three nights","A week"],"「Two nights, a double room.」と言っています。"],
["Where is breakfast served?","朝食はどこで出されますか？",["On the second floor","In the guest's room","On the eighth floor","In the lobby"],"「in the restaurant on the second floor」とあります。8階は客室の階です。"],
["What does the guest ask for at the end?","客は最後に何を頼んでいますか？",["A wake-up call","A late check-out","A room upgrade","A taxi to the airport"],"「could I get a wake-up call at six tomorrow?」と頼んでいます。"]],
v:[["under the name ~","〜の名前で（予約）"],["Is ~ included?","〜は含まれていますか"],["wake-up call","モーニングコール"]]},
{id:'p08',lv:2,type:'t',title:"Train Delay",ja:"列車遅延のアナウンス",s:[
["","Attention, passengers. This is an announcement for the eight fifteen express train to Central Station.","ご乗車のお客様にお知らせいたします。セントラル駅行き8時15分発の急行列車についてのご案内です。"],
["","Due to heavy snow, this train is running about twenty minutes behind schedule.","大雪のため、この列車は予定より約20分遅れて運行しております。"],
["","It will now depart from platform four instead of platform two.","2番線ではなく、4番線からの発車に変更となります。"],
["","Passengers who need to make connections at Central Station should speak to a staff member at the ticket gate.","セントラル駅で乗り換えのあるお客様は、改札の係員にお申し出ください。"],
["","We apologize for the delay, and thank you for your patience.","遅れが出ておりますことをお詫びするとともに、ご理解に感謝いたします。"]],
q:[["What is causing the delay?","遅れの原因は何ですか？",["Heavy snow","A signal problem","An accident","Strong wind"],"「Due to heavy snow」とあります。due to は原因を表します。"],
["Where will the train leave from?","列車はどこから出発しますか？",["Platform four","Platform two","Platform eight","Central Station"],"「platform four instead of platform two」＝2番線ではなく4番線。instead of の後ろは変更前です。"],
["What should passengers with connections do?","乗り換えのある乗客は何をすべきですか？",["Talk to a staff member","Buy a new ticket","Take a bus","Wait on platform two"],"「should speak to a staff member at the ticket gate」と案内しています。"]],
v:[["behind schedule","予定より遅れて"],["instead of ~","〜の代わりに"],["make connections","乗り換える"]]},
{id:'p09',lv:2,type:'t',title:"The Two-Minute Rule",ja:"ポッドキャスト：2分ルール",s:[
["","Welcome back to Small Steps, the podcast about building better habits.","「スモール・ステップス」へおかえりなさい。より良い習慣づくりについてのポッドキャストです。"],
["","Today, I want to talk about something called the two-minute rule.","今日は「2分ルール」と呼ばれるものについてお話しします。"],
["","The idea is simple: when you start a new habit, make it so easy that it takes less than two minutes.","考え方はシンプルで、新しい習慣を始めるときは、2分もかからないくらい簡単にする、というものです。"],
["","For example, instead of promising to read every night, you just promise to read one page.","たとえば、毎晩読書すると約束する代わりに、1ページだけ読むと約束するんです。"],
["","It sounds almost too small, but that's the point.","小さすぎると思うかもしれませんが、そこがポイントです。"],
["","Once you've started, it's much easier to keep going.","一度始めてしまえば、続けるのはずっと簡単になります。"],
["","So, what's one habit you could shrink down to two minutes this week?","さて、今週2分に縮められる習慣を1つ挙げるとしたら、何でしょうか？"]],
q:[["What is the podcast mainly about?","このポッドキャストは主に何についてですか？",["Building habits","Saving money","Reading faster","Managing meetings"],"冒頭で「the podcast about building better habits」と紹介しています。"],
["According to the speaker, how should a new habit start?","話し手によると、新しい習慣はどう始めるべきですか？",["It should be very easy.","It should take an hour.","It should be done with friends.","It should be planned in detail."],"「make it so easy that it takes less than two minutes」とあります。"],
["What example does the speaker give?","話し手が挙げている例は何ですか？",["Reading one page","Running two kilometers","Writing a diary","Drinking more water"],"「you just promise to read one page」が例です。"]],
v:[["The idea is simple.","考え方はシンプル"],["that's the point","そこが肝心"],["keep going","続ける"]]},
{id:'p10',lv:2,type:'d',title:"Lost and Found",ja:"忘れ物センター",s:[
["A","Excuse me, I think I left my umbrella on the bus this morning.","すみません、今朝バスに傘を忘れたと思うんです。"],
["B","OK. Which bus were you on, and around what time?","わかりました。どのバスに、何時ごろ乗っていましたか？"],
["A","The number twelve, at about eight thirty. I got off at City Hall.","12番のバスで、8時半ごろです。市役所で降りました。"],
["B","Can you describe the umbrella?","傘の特徴を教えていただけますか？"],
["A","It's dark blue with a wooden handle. It's quite long.","紺色で、木の持ち手です。けっこう長いです。"],
["B","Let me check. We have two blue ones. Is this yours?","確認しますね。青いのが2本ありますね。こちらですか？"],
["A","Yes, that's it! Thank you so much.","はい、それです！本当にありがとうございます。"],
["B","No problem. Could you just sign this form for me?","どういたしまして。こちらの用紙にサインだけお願いできますか？"]],
q:[["Where did the speaker lose the umbrella?","話し手はどこで傘をなくしましたか？",["On a bus","On a train","At City Hall","In a taxi"],"「I left my umbrella on the bus」と言っています。City Hall は降りた場所です。"],
["What does the umbrella look like?","傘はどんな見た目ですか？",["Dark blue with a wooden handle","Black with a metal handle","Light blue and short","Green with a plastic handle"],"「It's dark blue with a wooden handle. It's quite long.」とあります。"],
["What is the speaker asked to do?","話し手は何をするよう頼まれていますか？",["Sign a form","Pay a fee","Show an ID card","Come back tomorrow"],"最後に「Could you just sign this form」と頼まれています。"]],
v:[["leave ~ on the bus","バスに〜を置き忘れる"],["get off","降りる"],["describe","特徴を説明する"]]},
{id:'p11',lv:3,type:'d',title:"Budget Meeting",ja:"予算の打ち合わせ",s:[
["A","So, have you had a chance to look at the numbers for next quarter?","それで、来四半期の数字はもう見てくれた？"],
["B","I have, and honestly, they're tighter than I expected. Shipping costs have gone up almost fifteen percent.","見ました。正直、思ったより厳しいです。配送コストが15％近く上がっていて。"],
["A","That's what I was worried about. Do you think we'll need to raise our prices?","それを心配していたんだ。値上げが必要になると思う？"],
["B","Not necessarily. If we switch to the new supplier in Osaka, we could cut costs without passing them on to customers.","必ずしもそうとは限りません。大阪の新しい仕入れ先に切り替えれば、お客様に転嫁せずにコストを削減できます。"],
["A","But wouldn't that delay our deliveries?","でも、それだと納品が遅れないかな？"],
["B","Only for the first month or so, while they get set up. After that, they'd actually be faster.","先方の準備が整う最初の1か月ほどだけです。その後はむしろ早くなります。"],
["A","All right. Why don't you put together a short proposal, and we'll go over it with the team on Monday?","わかった。短い提案書をまとめてくれないか。月曜日にチームで検討しよう。"],
["B","Sounds good. I'll have it ready by Friday afternoon.","承知しました。金曜日の午後までに用意しておきます。"]],
q:[["What problem are the speakers discussing?","2人が話している問題は何ですか？",["Rising shipping costs","Falling sales","A late delivery","A new competitor"],"「Shipping costs have gone up almost fifteen percent.」が問題点です。"],
["What does the second speaker suggest?","2人目の話し手は何を提案していますか？",["Changing suppliers","Raising prices","Hiring more staff","Delaying a product launch"],"「If we switch to the new supplier in Osaka」と提案。値上げには「Not necessarily.」と答えています。"],
["When will the proposal be ready?","提案書はいつできますか？",["By Friday afternoon","By Monday morning","Next month","At the end of the quarter"],"「I'll have it ready by Friday afternoon.」月曜日はチームで検討する日です。"]],
v:[["have a chance to ~","〜する機会がある"],["pass ~ on to ...","〜を…に転嫁する"],["go over","検討する・目を通す"]]},
{id:'p12',lv:3,type:'t',title:"Rooftop Gardens",ja:"地元ニュース：屋上ガーデン計画",s:[
["","In local news, the city of Westbridge has announced a plan to turn the roofs of twelve public buildings into community gardens.","地元のニュースです。ウェストブリッジ市は、公共の建物12棟の屋上をコミュニティガーデンにする計画を発表しました。"],
["","The project, which is expected to cost around two million dollars, will begin next spring.","費用はおよそ200万ドルと見込まれるこのプロジェクトは、来年の春に始まります。"],
["","Officials say the gardens will help cool the downtown area in summer and give residents a place to grow their own vegetables.","市の担当者によると、ガーデンは夏の中心街の気温を下げ、住民が自分で野菜を育てる場所にもなるということです。"],
["","Some local business owners, however, have raised concerns about the cost and about who will be responsible for maintenance.","しかし地元の事業者の一部からは、費用や、維持管理の責任を誰が負うのかについて懸念の声が上がっています。"],
["","The city council plans to hold a public meeting on the issue at the end of this month.","市議会は今月末にこの件に関する公開の会合を開く予定です。"],
["","Residents who can't attend are encouraged to submit their comments online.","出席できない住民は、オンラインで意見を提出するよう呼びかけられています。"]],
q:[["What is the city planning to do?","市は何をする計画ですか？",["Create gardens on rooftops","Build a new city hall","Repair old schools","Open a farmers market"],"「turn the roofs of twelve public buildings into community gardens」とあります。"],
["What concern have some business owners raised?","一部の事業者が示した懸念は何ですか？",["The cost and maintenance","Noise from construction","The loss of parking spaces","The timing of the project"],"「concerns about the cost and about who will be responsible for maintenance」とあります。"],
["What can residents do if they cannot attend the meeting?","会合に出られない住民は何ができますか？",["Submit comments online","Call the mayor","Watch it on TV","Visit the gardens"],"「are encouraged to submit their comments online」とあります。"]],
v:[["turn A into B","AをBに変える"],["raise concerns about ~","〜について懸念を示す"],["be encouraged to ~","〜するよう勧められる"]]},
{id:'p13',lv:3,type:'d',title:"Job Interview",ja:"採用面接",s:[
["A","Thanks for coming in today. To start, could you tell me a little about your current role?","本日はお越しいただきありがとうございます。まず、現在のお仕事について少し教えていただけますか？"],
["B","Sure. I've been working as a project coordinator at a software company for about three years.","はい。ソフトウェア会社でプロジェクトコーディネーターとして約3年働いています。"],
["A","And what made you decide to apply for this position?","このポジションに応募しようと思った理由は何ですか？"],
["B","Well, I enjoy my job, but I'd like to take on more responsibility, especially managing client relationships.","今の仕事は楽しいのですが、もっと責任のある仕事、特に顧客との関係づくりを担当したいと思っています。"],
["A","I see. Can you give me an example of a time you dealt with a difficult client?","なるほど。難しい顧客に対応した例を挙げていただけますか？"],
["B","Last year, one of our clients was unhappy about a delay. I set up weekly calls to keep them updated, and in the end, they actually extended their contract.","昨年、あるお客様が遅れに不満をお持ちでした。毎週電話会議を設けて状況をお伝えし続けたところ、最終的に契約を延長していただけました。"],
["A","That's impressive. Do you have any questions for us?","それは素晴らしいですね。何か質問はありますか？"],
["B","Yes. I was wondering what a typical day looks like for someone in this role.","はい。このポジションの典型的な1日がどのようなものか伺いたいです。"]],
q:[["What is the candidate's current job?","応募者の現在の仕事は何ですか？",["Project coordinator","Sales manager","Software engineer","Customer service agent"],"「I've been working as a project coordinator」と言っています。software company は勤務先です。"],
["Why is the candidate applying for the position?","応募者はなぜこの職に応募していますか？",["To take on more responsibility","To earn a higher salary","To work from home","To move to a new city"],"「I'd like to take on more responsibility」が理由です。"],
["What happened with the difficult client?","難しい顧客とはどうなりましたか？",["They extended their contract.","They canceled the project.","They asked for a refund.","They changed companies."],"「in the end, they actually extended their contract」とあります。"]],
v:[["take on more responsibility","より大きな責任を担う"],["deal with ~","〜に対応する"],["keep ~ updated","〜に最新の状況を伝え続ける"]]},
{id:'p14',lv:3,type:'t',title:"Museum Tour",ja:"博物館ツアーの案内",s:[
["","Good morning, everyone, and welcome to the Riverside Museum of Science and Industry.","皆さん、おはようございます。リバーサイド科学産業博物館へようこそ。"],
["","My name is Daniel, and I'll be your guide for the next hour or so.","ダニエルと申します。これから1時間ほど、皆さんのガイドを務めます。"],
["","We'll start here in the main hall with our steam engine collection, then make our way upstairs to the new exhibition on renewable energy.","まずここメインホールで蒸気機関のコレクションを見てから、上の階の再生可能エネルギーの新しい展示に向かいます。"],
["","You're welcome to take photos anywhere in the museum, but please don't use a flash, as it can damage some of the older items.","館内はどこでも写真撮影ができますが、古い展示品を傷めることがあるので、フラッシュは使わないでください。"],
["","Halfway through, we'll take a ten-minute break near the café, so you'll have time to grab a drink.","途中でカフェの近くで10分間の休憩を取りますので、飲み物を買う時間があります。"],

["B","That's true. Maybe a hybrid schedule would be the best of both worlds, like three days in and two at home.","それは確かに。ハイブリッド勤務ならいいとこ取りかもね。出社3日、在宅2日みたいな。"],

["B","Exactly. I think we should bring it up at the next staff meeting.","そのとおり。次のスタッフ会議で提案すべきだと思う。"],
["A","Let's do it. If enough people agree, management might actually listen.","そうしよう。賛成する人が多ければ、経営陣も耳を傾けるかもしれない。"]],

["Why is the second speaker unhappy?","2人目の話し手はなぜ不満なのですか？",["The commute is long.","The office is noisy.","There are too many meetings.","The salary is low."],"「My commute is over an hour each way.」が理由です。"],
["What do the speakers decide to do?","2人は何をすることにしましたか？",["Raise the issue at a staff meeting","Quit their jobs","Talk to their manager privately","Start working from home"],"「we should bring it up at the next staff meeting」→「Let's do it.」"]],

function normAI(v, opt){

  const raw = Array.isArray(v.lines) ? v.lines : Array.isArray(v.sentences) ? v.sentences : [];
  const spk = []; const lines = raw.map(l => { l = l || {}; let sp = ''; if (!talk){ const key = str(l.sp, 20) || 'A'; let i = spk.indexOf(key); if (i < 0){ spk.push(key); i = spk.length - 1; } sp = i % 2 ? 'B' : 'A'; } return [sp, str(l.en, 400), str(l.ja, 400)]; }).filter(l => l[1]).slice(0, 30);
  if (lines.length < 3) throw new Error('short');
  const qs = (Array.isArray(v.questions) ? v.questions : []).map(q => { q = q || {}; return [str(q.q, 240), str(q.qj, 240), (Array.isArray(q.opts) ? q.opts : []).map(o => str(o, 160)).filter(Boolean).slice(0, 4), str(q.exp, 400)]; }).filter(q => q[0] && q[2].length >= 2).slice(0, 5);
  const vocab = (Array.isArray(v.vocab) ? v.vocab : []).map(x => { x = x || {}; return [str(x.w, 80), str(x.ja, 120)]; }).filter(x => x[0]).slice(0, 8);
  return {id: 'ai' + Date.now().toString(36) + rnd(1e5).toString(36), ai: 1, made: Date.now(), lv: opt.lv, type: talk ? 't' : 'd', title: str(v.title, 80) || 'New Listening', ja: str(v.titleJa, 80) || str(opt.topic, 40), s: lines, q: qs, v: vocab};
}

/* ---------- Dictation ---------- */
class DictSess extends Base {
  constructor(o){ super(); this.o = o; this.items = o.items || []; this.title = o.title || 'ディクテーション'; this.sub = o.sub || LV[st.set.level]; this.key = 'dict'; this.mode = st.set.dictMode === 'cloze' ? 'cloze' : 'full'; this.setup = !!o.setup; this.src = 'bank'; this.cnt = o.cnt || 8; this.k = 0; this.res = []; this.state = 'q'; this.plays = 0; this.input = ''; this.clv = {}; this.hint = 0; }

      '<h3 class="h3">問題数</h3><div class="seg">' + [5, 8, 12].map(n => '<button data-act="dCnt" data-v="' + n + '" aria-pressed="' + (this.cnt === n) + '">' + n + '文</button>').join('') + '</div>' +
      '<h3 class="h3">形式</h3><div class="seg"><button data-act="dMode" data-v="full" aria-pressed="' + (this.mode === 'full') + '">全文</button><button data-act="dMode" data-v="cloze" aria-pressed="' + (this.mode === 'cloze') + '">穴埋め</button></div><p class="small muted">全文：聞こえた英文をすべて入力。穴埋め：聞き取りのポイントになる語だけを入力します。</p>' +
      '<button class="btn hot wide" data-act="dGo" style="margin-top:14px">' + ic('play', 'fill') + 'スタート</button></div>'); }
  a_dSrc(el){ this.src = el.dataset.v; this.renderSetup(); }
  a_dCnt(el){ this.cnt = +el.dataset.v; this.renderSetup(); }
  a_dGo(){ this.items = this.gen(); if (!this.items.length){ toast('出題できる文がありません'); return; } this.setup = false; this.begin(); }
  gen(){ if (this.src === 'rev') return shuffle(st.rev).slice(0, this.cnt).map(x => ({en: x.en, ja: x.ja, pt: x.pt})); return pickDict(st.set.level, this.cnt); }
  begin(){ this.k = 0; this.res = []; this.newItem(); }
  newItem(){ const it = this.items[this.k]; this.state = 'q'; this.plays = 0; this.input = ''; this.hint = 0; this.clv = {}; this.cl = this.mode === 'cloze' ? makeCloze(it.en, it.pt, st.set.level) : null; this.render(); $('#sbody').scrollTop = 0; this.play(); }
  async play(rate){ const it = this.items[this.k]; const tok = Speech.begin(); this.plays++; const pe = $('#dPlays'); if (pe) pe.textContent = '再生 ' + this.plays + '回'; await Speech.say(it.en, {role: it.sp === 'B' ? 'B' : 'A', rate}); if (Speech.valid(tok) && this.state === 'q' && !IOS){ const f = $('#dIn') || $('.cloze input'); if (f) try { f.focus({preventScroll: true}); } catch(e){} } }
  render(){ Sess.head(); if (this.state === 'sum') return; const it = this.items[this.k];
    const top = '<div class="qhead2"><span class="qno">' + (this.k + 1) + '<small> / ' + this.items.length + '</small></span><div class="seg"><button data-act="dMode" data-v="full" aria-pressed="' + (this.mode === 'full') + '">全文</button><button data-act="dMode" data-v="cloze" aria-pressed="' + (this.mode === 'cloze') + '">穴埋め</button></div></div>';
    const pz = '<div class="playz"><button class="play live" data-act="dPlay" aria-label="再生">' + ic('play', 'fill') + '</button><div class="row c"><button class="btn sm" data-act="dSlow">ゆっくり 0.7×</button><span class="small muted" id="dPlays">再生 ' + this.plays + '回</span></div></div>';
    if (this.state === 'q'){
      let field;
      if (this.mode === 'cloze') field = '<p class="cloze" lang="en">' + this.cl.T.map((t, i) => { const b = this.cl.blanks.indexOf(i); if (b < 0) return esc(t.raw); const sp = splitPunct(t.raw); return esc(sp[0]) + '<input data-b="' + b + '" aria-label="空欄' + (b + 1) + '" style="width:' + Math.max(3.2, sp[1].length * 0.72 + 1.6).toFixed(1) + 'em" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" value="' + esc(this.clv[b] || '') + '">' + esc(sp[2]); }).join(' ') + '</p>';

    } else { const r = this.res[this.k];

        '<div class="row"><button class="btn" data-act="dPlay">' + ic('play', 'fill') + 'もう一度</button><button class="btn" data-act="dSlow">0.7×</button><button class="btn" data-act="dSave">' + ic('star') + (Rev.has(it.en) ? '保存済み' : '保存') + '</button></div>' +
        '<button class="btn hot wide" data-act="dNext" style="margin-top:14px">' + (this.k + 1 < this.items.length ? '次の文へ' : '結果を見る') + '</button>'); }
  }
  hintText(en){ return tokens(en).map(t => { const w = t.raw; if (this.hint >= 2) return w.charAt(0) + w.slice(1).replace(/[A-Za-z0-9]/g, '_'); return w.replace(/[A-Za-z0-9]/g, '_'); }).join('  '); }
  onInput(t){ if (t.id === 'dIn') this.input = t.value; else if (t.dataset.b != null) this.clv[t.dataset.b] = t.value; }

      r = {score: Math.round(100 * (ok + 0.6 * ty) / bl.length), html: T.map((t, i) => i in stat ? '<span class="t-' + (stat[i] === 0 ? 'ok' : stat[i] === 1 ? 'typo' : 'miss') + '">' + esc(t.raw) + '</span>' : '<span class="t-n">' + esc(t.raw) + '</span>').join(' '), mine: null}; }
    else { const g = gradeText(it.en, this.input); r = {score: g.score, html: g.html, mine: this.input.trim()}; }

  a_dGive(){ this.finishItem({score: 0, html: tokens(this.items[this.k].en).map(t => '<span class="t-miss">' + esc(t.raw) + '</span>').join(' '), mine: this.mode === 'full' ? this.input.trim() : null}); }
  finishItem(r){ const it = this.items[this.k]; this.res[this.k] = r; this.state = 'a'; Stats.ans('dict', r.score >= 80); if (r.score < 80 && st.set.autoRev) Rev.add(it.en, it.ja, this.o.src || 'ディクテーション', it.pt); Speech.stop(); this.render(); }

    Sess.body(summaryHTML({score: avg, unit: '点', label: 'ディクテーションの平均点', rows, key: this.key, msg: msgFor(avg) + (st.set.autoRev && this.res.some(r => r && r.score < 80) ? ' 80点未満の文は復習カードに追加しました。' : '')})); }
  a_again(){ if (!this.o.fixed) this.items = this.gen(); this.begin(); }
}

      (this.mic ? '<div class="card micres"><b>' + (this.mic.score != null ? 'マイク採点 ' + this.mic.score + '%' : '聞き取り中…') + '</b>' + (this.mic.html ? '<p class="diff sm" lang="en">' + this.mic.html + '</p><p class="small muted">緑の語は聞き取れた語、赤は伝わらなかった語です。</p>' : '<p class="muted" id="micLive" lang="en">' + esc(this.mic.live || '英文を言ってから「止めて採点」を押してください') + '</p>') + '</div>' : '') +

      '<div class="selfrate"><span class="lab">自己評価で次へ</span><div class="grade">' + [[0,'難しい'],[1,'もう少し'],[2,'言えた']].map(x => '<button class="btn ' + (x[0] === 2 ? 'pri' : '') + '" data-act="shRate" data-v="' + x[0] + '">' + x[1] + '</button>').join('') + '</div></div>'); }
  gapBar(sec, tok){ return new Promise(res => { const bar = $('#gapBar'); if (bar){ bar.style.transition = 'none'; bar.style.width = '100%'; void bar.offsetWidth; bar.style.transition = 'width ' + sec.toFixed(2) + 's linear'; bar.style.width = '0%'; } const t0 = performance.now(); const iv = setInterval(() => { if (!Speech.valid(tok) || performance.now() - t0 >= sec * 1000){ clearInterval(iv); res(); } }, 100); }); }
  async run(){ const it = this.items[this.k]; const tok = Speech.begin(); this.mic = null; const role = it.sp === 'B' ? 'B' : 'A';

    '<div class="set"><span class="lab2">ディクテーションの形式</span>' + segSet('dictMode', [['full', '全文'], ['cloze', '穴埋め']]) + '</div>' +
    '<div class="set"><span class="lab2">1日の目標</span>' + segSet('goal', [[5, '5分'], [10, '10分'], [15, '15分'], [20, '20分'], [30, '30分']]) + '</div>' +
    '<div class="set"><span class="lab2">間違えた文を自動で復習カードに追加</span>' + segSet('autoRev', [['true', 'オン'], ['false', 'オフ']]) + '</div></div>' +
    '<div class="sec-h"><h2>データ</h2></div><div class="card"><p class="small" style="margin-top:0">' + esc(cloud) + '</p><div class="row"><button class="btn sm" data-act="bkCopy">' + ic('copy') + 'バックアップをコピー</button><button class="btn sm" data-act="bkRestore">復元</button><button class="btn sm" data-act="reset">' + ic('trash') + '記録をリセット</button></div></div>' +
    '<div class="sec-h"><h2>音が出ないとき</h2></div><div class="card small"><p style="margin-top:0">iPhone・iPad：消音モード（マナーモード）を解除し、音量を上げてください。設定アプリの「アクセシビリティ」→「読み上げコンテンツ」→「声」→「英語」で、高音質の声（拡張・プレミアム）をダウンロードすると聞きやすくなります。</p><p>Android：端末の設定の「テキスト読み上げ」で、英語の音声データをインストールしてください。</p><p style="margin-bottom:0">アプリ内の表示で音が出ない場合は、Safari または Chrome で開いてください。</p></div></div>'; }

const UI = {
  tab: 'home', libF: 'all', revQ: '',
  go(tab){ this.tab = tab; this.render(); const v = $('#view'); v.scrollTop = 0; },
  render(){ $$('.tab').forEach(b => b.setAttribute('aria-current', b.dataset.tab === this.tab ? 'page' : 'false')); const v = $('#view'); const fn = {home: vHome, train: vTrain, lib: vLib, rev: vRev, me: vMe}[this.tab] || vHome; try { v.innerHTML = fn(); } catch(e){ console.error(e); v.innerHTML = '<div class="wrap"><p class="note">表示中にエラーが発生しました：' + esc(e.message) + '</p></div>'; } if (this.tab === 'rev') filterRev(); this.badge(); syncRate(); },
  rerender(){ if (!Sess.cur) this.render(); else this.badge(); },
  badge(){ const n = Rev.due().length, b = $('#revBadge'); if (b){ b.hidden = !n; b.textContent = n > 99 ? '99+' : String(n); } const c = $('#lvChip'); if (c) c.textContent = LV[st.set.level]; },
  voicesReady(){ if (!Sess.cur && (this.tab === 'me' || this.tab === 'home')) this.render(); },
  refreshStatus(){ if (!Sess.cur && this.tab === 'me') this.render(); },
  noVoice(){ toast('この画面では英語の音声を再生できません。マイページの「音が出ないとき」をご覧ください'); },
  tapHint(){ toast('もう一度、再生ボタンをタップしてください'); }
};
function syncRate(){ ['spd', 'topSpd'].forEach(id => { const el = document.getElementById(id); if (el) el.textContent = fmtRate(st.set.rate); }); }
function filterRev(){ const q = UI.revQ.trim().toLowerCase(); $$('.ritem').forEach(li => { li.hidden = !!q && li.textContent.toLowerCase().indexOf(q) < 0; }); }

/* modal */
let askR = null;
function modal(html, kind){ const m = $('#modal'); m.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>'; m.dataset.kind = kind || ''; m.hidden = false; }
function closeModal(){ const m = $('#modal'); m.hidden = true; m.innerHTML = ''; m.dataset.kind = ''; if (askR){ const r = askR; askR = null; r(false); } }
function ask(msg, ok){ return new Promise(res => { askR = res; modal('<p class="ask">' + esc(msg) + '</p><div class="row end"><button class="btn" data-act="askNo">キャンセル</button><button class="btn hot" data-act="askYes">' + esc(ok || 'OK') + '</button></div>', 'ask'); }); }
function showOnboarding(){ modal('<h3>ミミトレへようこそ</h3><p style="margin-top:0">毎日10〜15分で、英語の「耳」を鍛えるアプリです。まずレベルを選んでください（あとから変えられます）。</p><div class="opts">' + [1, 2, 3].map(l => '<button class="opt ' + (st.set.level === l ? 'ok' : '') + '" data-act="obLv" data-v="' + l + '"><span class="k">' + (st.set.level === l ? ic('check') : l) + '</span><span><b>' + LV[l] + '</b><br><span class="small muted">' + LVD[l] + '</span></span></button>').join('') + '</div><div class="row" style="margin-top:14px"><button class="btn" data-act="obTest">' + ic('voice') + '音声テスト</button><button class="btn hot" data-act="obGo" style="flex:1">はじめる</button></div><p class="small muted" style="margin-bottom:0">音が出ないときは、マナーモードを解除して音量を上げてください。記録は自動で保存されます。</p>', 'onb'); }
function speedSheet(){ modal('<h3>再生速度</h3>' + tunerHTML('rateM') + '<button class="btn pri wide" data-act="modalClose" style="margin-top:12px">閉じる</button>', 'spd'); }

/* ============================== Global actions ============================== */
const A = {
  tab: el => { if (Sess.cur) return; UI.go(el.dataset.tab); },
  sessClose: () => Sess.close(),
  course: () => Course.start(),
  courseNext: () => Course.next(),
  menu: el => Sess.open(makeMenuSession(el.dataset.k)),
  openP: el => { const p = findP(el.dataset.id); if (p) Sess.open(new PasSess(p, {})); },
  delP: async el => { if (await ask('このAI教材を削除しますか？', '削除')){ st.custom = st.custom.filter(p => p.id !== el.dataset.id); Store.touch('custom'); UI.render(); } },
  setLv: el => { st.set.level = +el.dataset.v; Store.touch(); UI.render(); },
  lvMenu: () => modal('<h3>レベル</h3><div class="opts">' + [1, 2, 3].map(l => '<button class="opt ' + (st.set.level === l ? 'ok' : '') + '" data-act="lvPick" data-v="' + l + '"><span class="k">' + (st.set.level === l ? ic('check') : l) + '</span><span><b>' + LV[l] + '</b><br><span class="small muted">' + LVD[l] + '</span></span></button>').join('') + '</div>', 'lv'),
  lvPick: el => { st.set.level = +el.dataset.v; Store.touch(); closeModal(); if (Sess.cur) UI.badge(); else UI.render(); toast('レベルを「' + LV[st.set.level] + '」にしました'); },
  mode: el => openMode(el.dataset.m),
  libF: el => { UI.libF = el.dataset.v; UI.render(); },
  revStart: () => { const d = Rev.due(); if (!d.length){ toast('今日の復習はありません'); return; } Sess.open(new RevSess(d)); },
  revDel: async el => { if (await ask('このカードを削除しますか？', '削除')){ Rev.remove(el.dataset.id); UI.render(); } },
  sayTxt: el => { Speech.begin(); Speech.say(el.dataset.t, {role: el.dataset.r || 'A'}); },
  setK: el => { const k = el.dataset.k; let v = el.dataset.v; if (v === 'true' || v === 'false') v = v === 'true'; else if (/^\d+(\.\d+)?$/.test(v)) v = +v; st.set[k] = v; Store.touch(); if (!Sess.cur) UI.render(); },
  rateP: el => { st.set.rate = +el.dataset.v; Store.touch(); syncRate(); ['rateR', 'rateM'].forEach(id => { const r = document.getElementById(id); if (r){ r.value = st.set.rate; const o = document.getElementById(id + 'O'); if (o) o.textContent = fmtRate(st.set.rate); } }); $$('[data-act="rateP"]').forEach(b => b.classList.toggle('pri', Math.abs(+b.dataset.v - st.set.rate) < 0.001)); },
  spd: () => speedSheet(),
  modalClose: () => closeModal(),
  askYes: () => { const r = askR; askR = null; closeModal(); if (r) r(true); },
  askNo: () => closeModal(),
  testV: el => { Speech.begin(); Speech.say(el.dataset.r === 'B' ? "Hi there! I'm the second voice. Nice to meet you." : "Hello! This is my voice. Let's train your ears together.", {role: el.dataset.r}); },
  mpWeak: () => Sess.open(new MPSess({sets: weakSets(), n: 10})),
  obLv: el => { st.set.level = +el.dataset.v; Store.touch(); showOnboarding(); UI.badge(); },
  obTest: () => { Speech.begin(); Speech.say("Hello! Welcome to MimiTore. Let's train your ears together."); },
  obGo: () => { st.onb = true; Store.touch(); closeModal(); UI.render(); },
  bkCopy: () => { const txt = JSON.stringify({app: 'mimitore', v: 1, made: Date.now(), state: Store.body('state'), review: Store.body('review'), custom: Store.body('custom')}); const fallback = () => modal('<h3>バックアップ</h3><p class="small muted" style="margin-top:0">下の文字列をすべて選択してコピーし、メモなどに保存してください。</p><textarea class="bk" readonly id="bkOut">' + esc(txt) + '</textarea><button class="btn pri wide" data-act="modalClose" style="margin-top:12px">閉じる</button>', 'bk');
    try { navigator.clipboard.writeText(txt).then(() => toast('バックアップをコピーしました。メモなどに貼り付けて保存してください'), fallback); } catch(e){ fallback(); } },
  bkRestore: () => modal('<h3>バックアップから復元</h3><p class="small muted" style="margin-top:0">コピーしておいたバックアップを貼り付けてください。今の記録と合わせて取り込みます。</p><textarea class="bk" id="bkIn" placeholder="ここに貼り付け"></textarea><div class="row end" style="margin-top:12px"><button class="btn" data-act="modalClose">キャンセル</button><button class="btn pri" data-act="bkLoad">取り込む</button></div>', 'bk'),
  bkLoad: () => { const t = $('#bkIn'); try { const o = JSON.parse(t.value); if (!o || o.app !== 'mimitore') throw new Error('x'); mergeIn(o.state, o.review, o.custom); if (o.state && o.state.set) st.set = Object.assign({}, DEF, st.set); ['state', 'review', 'custom'].forEach(p => Store.touch(p)); closeModal(); UI.render(); toast('バックアップを取り込みました'); } catch(e){ toast('バックアップの形式が正しくありません'); } },
  reset: async () => { if (await ask('学習記録・復習カード・AI教材をすべて削除します。設定は残ります。よろしいですか？', 'リセット')){ st.days = {}; st.pas = {}; st.mp = {}; st.cs = {}; st.num = {}; st.del = st.del.concat(st.rev.map(x => x.id)).slice(-300); st.rev = []; st.custom = []; ['state', 'review', 'custom'].forEach(p => Store.touch(p)); UI.render(); toast('記録をリセットしました'); } }
};

/* ============================== Events & boot ============================== */
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; const a = el.dataset.act; try { if (S && S.act(a, el, e)) return; if (A[a]) A[a](el, e); } catch(err){ console.error(err); toast('エラーが発生しました'); } });
document.addEventListener('input', e => { const t = e.target; if (t.dataset && t.dataset.set){ const k = t.dataset.set; const v = t.dataset.num ? +t.value : t.value; st.set[k] = v; const o = t.dataset.out && document.getElementById(t.dataset.out); if (o) o.textContent = t.dataset.fmt === 'rate' ? fmtRate(v) : (t.dataset.pre || '') + (+v).toFixed(1) + (t.dataset.unit || ''); Store.touch(); if (k === 'rate'){ syncRate(); $$('[data-act="rateP"]').forEach(b => b.classList.toggle('pri', Math.abs(+b.dataset.v - v) < 0.001)); } return; } if (t.id === 'revSearch'){ UI.revQ = t.value; filterRev(); return; } if (S && S.onInput) S.onInput(t, e); });
document.addEventListener('change', e => { const t = e.target; if (t.dataset && t.dataset.set){ if (t.dataset.set === 'accent'){ st.set.voiceA = ''; st.set.voiceB = ''; Store.touch(); if (!Sess.cur) UI.render(); } return; } if (S && S.onChange) S.onChange(t, e); });
document.addEventListener('keydown', e => { if (!$('#modal').hidden){ if (e.key === 'Escape') closeModal(); return; } if (!S) return; if (e.key === 'Escape' && !typing(e)){ Sess.close(); return; } if (S.onKey) S.onKey(e); });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
['touchend', 'mousedown', 'keydown'].forEach(ev => document.addEventListener(ev, unlockTTS, {capture: true, passive: true}));
document.addEventListener('visibilitychange', () => { if (document.hidden){ Store.flushLocal(); Cloud.flush(); } else if (Sess.cur) keepAwake(true); });
window.addEventListener('pagehide', () => Store.flushLocal());

async function capInit(){
  if (!(window.claude && typeof window.claude.use === 'function')) return;
  const use = n => window.claude.use(n).catch(() => null);
  Cloud.init();
  const got = await Promise.all([use('tts'), use('sample'), use('dictation')]);
  const tts = got[0], sample = got[1], dict = got[2];
  if (tts){ Speech.ctts = tts; try { tts.onState(x => { const s = x && x.state; if (s === 'speaking'){ Speech.cStart = performance.now(); Speech.worked = true; setAir(true); const f = Speech.cOn; Speech.cOn = null; if (f) f(); } else if (s === 'idle' || s === 'paused') setAir(false); }); } catch(e){} }
  if (sample) Cap.sample = sample;
  if (dict){ Cap.dict = dict; try { dict.onPartial(x => { if (!Mic.on) return; Mic.partial = (x && x.text) || ''; Mic.text = (Mic.finals + ' ' + Mic.partial).trim(); if (Mic.onP) Mic.onP(Mic.text); }); dict.onFinal(x => { if (!Mic.on) return; Mic.finals = (Mic.finals + ' ' + ((x && x.text) || '')).trim(); Mic.partial = ''; Mic.text = Mic.finals; if (Mic.onP) Mic.onP(Mic.text); }); dict.onState(x => { if (x && x.state === 'idle' && Mic.on) Mic.finish(); }); } catch(e){} }
  UI.rerender();
}
function boot(data){
  Store.load(); pruneDays(); Speech.init();
  UI.tab = ['home', 'train', 'lib', 'rev', 'me'].indexOf(data && data.tab) >= 0 ? data.tab : 'home';
  UI.render();
  if (!st.onb) setTimeout(() => { if (!st.onb && $('#modal').hidden) showOnboarding(); }, 250);
  capInit();
  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({tab: UI.tab})); } catch(e){}
}
window.MimiTore = {gradeText, numWords, ordWords, timeWords, yearWords, priceWords, decWords, digitWords, numCheck, makeCloze, tokens, NUMGEN, st, Speech, Sess, UI, Rev, Stats, PASSAGES, RESP, DICT, MP, CS};
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
}
</script>
</body>
