{id:"garden",icon:"🌱",title:"Community Gardens",tag:"環境・地域",titleEn:"The Benefits of Community Gardens",passage:"In many cities, local people are creating small gardens in empty spaces. These gardens give neighbors a chance to grow vegetables together. They also help children learn where food comes from. Some schools visit community gardens as part of their lessons. By working with others, people can make their neighborhoods greener and build stronger relationships.",q1:"According to the passage, how can people build stronger relationships?",a1:"By working with others in community gardens, they can build stronger relationships.",q2:"Please look at the three pictures. Describe what happened.",lead:"One Saturday morning, Emi went to a community garden.",a2:"First, Emi met some neighbors at the garden. Then, she watered the plants with them. Later, they shared the vegetables they had grown, and everyone was happy.",q3:"Some people say that schools should teach students how to grow vegetables. What do you think about that?",a3:"I agree. Students can learn about nature and healthy food. It is also a good way to work with classmates.",q4:"Do you think young people should spend more time doing volunteer work?",a4:"Yes, I do. Helping other people teaches us important skills. For example, we can learn how to communicate with different people.",panels:[["👩🏻‍🌾","🌱","Emi joins"],["💧","🪴","They water"],["🥕","🤝","They share"]]},
{id:"bottle",icon:"🌍",title:"Less Plastic",tag:"環境・生活",titleEn:"Using Fewer Plastic Bottles",passage:"Plastic waste has become a serious problem in many parts of the world. To reduce waste, some schools ask students to bring reusable water bottles. This can save money because students do not need to buy drinks every day. In addition, reusable bottles are available in many colors and sizes. Small changes in daily habits can protect the environment.",q1:"According to the passage, why can reusable water bottles save students money?",a1:"Because students do not need to buy drinks every day.",q2:"Please look at the three pictures. Describe what happened.",lead:"One day, Ken noticed a poster at his school.",a2:"First, Ken saw a poster about plastic waste. Then, he bought a reusable bottle at a shop. The next day, he brought the bottle to school and used it instead of buying a drink.",q3:"Some people say that stores should stop giving customers plastic bags. What do you think?",a3:"I agree because many plastic bags are used only once. People can bring their own bags when they go shopping.",q4:"Do you think students learn more from the internet than from books?",a4:"I think both are useful. The internet helps students find new information quickly, but books are often easier to read carefully.",panels:[["🪧","🏫","A poster"],["🧴","🛒","New bottle"],["🎒","💧","At school"]]},
{id:"online",icon:"💻",title:"Online Learning",tag:"教育・テクノロジー",titleEn:"Learning with Technology",passage:"Today, many students use computers and tablets to study outside the classroom. Online lessons are useful because students can learn at their own speed. Some websites offer videos that explain difficult subjects in simple ways. However, students should also talk to teachers and classmates. Combining online tools with face-to-face learning can help students understand new ideas more deeply.",q1:"According to the passage, how can students understand new ideas more deeply?",a1:"By combining online tools with face-to-face learning.",q2:"Please look at the three pictures. Describe what happened.",lead:"Last weekend, Yui had trouble with her science homework.",a2:"First, Yui did not understand a science question. Then, she watched an online lesson on her tablet. After that, she solved the problem and showed her answer to her teacher on Monday.",q3:"Some people say that all students should have their own tablet computers. What do you think?",a3:"I agree because tablets help students study anywhere. However, schools should also teach students how to use them safely.",q4:"Do you think it is important for teenagers to play sports regularly?",a4:"Yes, I do. Playing sports keeps us healthy. It also helps us make friends and reduce stress.",panels:[["📚","😟","Homework"],["📱","💡","Video lesson"],["✅","👩‍🏫","Success"]]},
{id:"community",icon:"🤝",title:"Helping the Town",tag:"地域・ボランティア",titleEn:"Keeping Our Town Clean",passage:"In some towns, local residents organize events to clean parks and rivers. Volunteers collect trash and separate materials that can be recycled. These activities make public places more pleasant for everyone. They also give people of different ages a chance to meet. Many students enjoy joining such events because they can help their communities while spending time with friends.",q1:"According to the passage, why do many students enjoy joining cleanup events?",a1:"Because they can help their communities while spending time with friends.",q2:"Please look at the three pictures. Describe what happened.",lead:"One Sunday, Taro and his friends went to a riverside park.",a2:"First, Taro and his friends found trash near the river. Then, they picked it up and put it into bags. Finally, they finished cleaning the park, and a local woman thanked them.",q3:"Some people say that teenagers should take part in community events. What do you think?",a3:"I agree. Teenagers can learn about their town and meet new people. Community events also teach them responsibility.",q4:"Do you think it is better to live in a big city than in a small town?",a4:"I prefer living in a city because it is convenient. For example, there are many shops and public transportation options.",panels:[["🏞️","🗑️","They notice"],["🧤","🗑️","They clean"],["🙌","🌳","Thank you"]]}

function header(){return '<header class="top"><div class="logo">INTERVIEW <span>QUEST.</span></div><a class="toplink" href="../">まなびBOXへ</a></header>'}
function lesson(){return LESSONS[st.lesson]}
function home(){const ss=stats();let h=header()+'<section class="hero"><div><div class="eyebrow">EIKEN GRADE 2 · SPEAKING</div><h1>面接練習を、<br><em>ちょっと好きに。</em></h1><p class="lead">画面の試験官と会話して、英語を声に出す。まずは1回、最後までやってみよう。</p><div class="pills"><span class="pill">🎧 音声で質問</span><span class="pill">🎬 動く試験官</span><span class="pill">🕖 本番 約7分</span></div><div class="actions"><button class="btn primary" data-action="start" data-mode="practice">✨ やさしく練習</button><button class="btn" data-action="start" data-mode="exam">🎯 本番チャレンジ</button><button class="btn" data-action="printone">🖨 選んだカードを印刷</button></div></div><div class="hero-art">'+video()+'</div></section>';
h+='<section class="section card" style="margin-top:18px"><h2>🖨 面接カードを印刷</h2><p class="note">A4に2枚ずつ配置し、切り取って使えます。カードには質問や模範解答を載せません。</p><div class="actions"><button class="btn purple" data-action="printall">4枚まとめて印刷</button><button class="btn small" data-action="printone">選択中の1枚だけ</button></div></section><section class="section"><h2>今日のチャレンジ</h2><div class="statrow"><div class="stat"><strong>'+ss.count+' 回</strong><small>完走した面接</small></div><div class="stat"><strong>🔥 '+ss.streak+' 日</strong><small>学習の連続日数</small></div><div class="stat"><strong>4 セット</strong><small>オリジナル問題</small></div></div></section>';
h+='<section class="section"><h2>挑戦するテーマを選ぼう</h2><div class="grid">'+LESSONS.map(function(x,i){return '<button class="set" data-action="choose" data-value="'+i+'" aria-pressed="'+(i===st.lesson)+'"><span class="set-icon">'+x.icon+'</span><b>'+esc(x.title)+'</b><small>'+esc(x.tag)+'</small></button>'}).join("")+'</div></section>';
h+='<section class="section card"><h2>🛠 音声設定</h2><div class="actions"><button class="btn small" data-action="rate" data-value="0.75" aria-pressed="'+(st.rate===.75)+'">ゆっくり</button><button class="btn small" data-action="rate" data-value="0.9" aria-pressed="'+(st.rate===.9)+'">ふつう</button><button class="btn small" data-action="rate" data-value="1.05" aria-pressed="'+(st.rate===1.05)+'">はやめ</button><button class="btn small" data-action="testvoice">🔊 声を試す</button></div><p class="note">練習モードは英語字幕やヒントを表示。本番モードは質問を原則音声だけで出します。声はブラウザの英語読み上げ機能を使用します。実在の人の動画や生成AIとの自由会話ではありません。</p></section>';
h+='<p class="note" style="margin-top:18px">3級の面接練習をするなら <a href="../eiken3-mensetsu/" style="color:#b9f17b">英検3級 面接ルーム →</a></p><p class="note" style="margin-top:20px">※非公式のオリジナル教材です。英検協会による提供・監修ではありません。「録音してAI変換」を押した場合のみ音声を外部AIサービスへ送信します。</p>';app.innerHTML=h}
function promptText(){const x=lesson();return EN[st.stage]||{q1:x.q1,q2:x.q2,q3:x.q3,q4:x.q4}[st.stage]||""}
function sceneSVG(a,i){const emoji1=a[0],emoji2=a[1];return '<div class="scene"><svg viewBox="0 0 120 118" role="img" aria-label="'+esc(a[2])+'"><rect width="120" height="118" fill="#e9f6ff"/><circle cx="94" cy="19" r="12" fill="#ffda82"/><path d="M0 85 Q55 72 120 85 V118 H0Z" fill="#bcdebc"/><rect x="3" y="69" width="114" height="3" fill="#a1bba5"/><circle cx="35" cy="45" r="16" fill="#f2bd9a"/><path d="M20 43 Q18 23 37 27 Q51 27 51 43" fill="#303b58"/><path d="M22 65 Q36 57 49 65 L58 102 H13Z" fill="'+(["#a4c1e5","#e7b3bf","#a5d7cb"][i])+'"/><path d="M24 75 L12 91 M49 76 L60 92" stroke="#e7b393" stroke-width="8" stroke-linecap="round"/><text x="78" y="63" font-size="36" text-anchor="middle">'+esc(emoji1)+'</text><text x="83" y="99" font-size="27" text-anchor="middle">'+esc(emoji2)+'</text></svg><div class="scene-label">'+esc(a[2])+'</div></div>'}
function paper(showPicture){const x=lesson();return '<div class="paper"><h3>'+esc(x.titleEn)+'</h3><p class="passage">'+esc(x.passage)+'</p>'+(showPicture?'<div class="three">'+x.panels.map(sceneSVG).join("")+'</div><p class="story-start">'+esc(x.lead)+'</p>':'')+'</div>'}
function isAnswerStage(){return ["reading","q1","q2","q3","q4","welcome"].includes(st.stage)}
function responsePane(){const s=st.stage;const key=s;const hint=s==="reading"?"音読はタイトルから。声に出して読んだら「次へ」を押そう。":s==="q2"?"First → Then → Finally の3つでつなぐと話しやすいよ。":s==="q3"||s==="q4"?"I think ... because ... の形で理由もひとつ添えよう。":s==="q1"?"Because ... / By ... の形で答えてみよう。":"How are you? と聞かれたら I'm good, thank you. と答えよう。";
let out='<div class="panel"><div class="kicker">YOUR TURN · SPEAK OUT</div><h3 class="stage-title">🎙 声に出して答えよう</h3><p class="subtext">'+(st.mode==="practice"?"言えたらメモして、あとでお手本と比べよう。":"英語で答えたら次に進もう。メモは任意。")+'</p>';
if(s!=="reading"&&s!=="welcome"){out+='<label class="sr-only" for="answer">あなたの英語の回答</label><textarea id="answer" spellcheck="false" placeholder="話した英語をメモ（空欄でも次へ進めます）">'+esc(st.answers[key]||"")+'</textarea><div class="answer-tools"><button class="btn small voice-btn" data-action="mic">🎤 直接音声認識</button><button class="btn small purple voice-btn" data-action="aimic">🎙️ 録音してAI変換</button><span class="note">文字起こし後は必ず内容を確認</span></div>'}
out+='<div id="voice-status" class="voice-status" role="status" aria-live="polite"></div><p class="voice-help">iPhoneで直接認識できないときは「録音してAI変換」を選んでください。押した場合だけ音声を外部AIサービスに送信します。送信しない場合はキーボードの🎤でも入力できます。</p>';
if(st.mode==="practice")out+='<p class="tip">💡 '+esc(hint)+'</p>';
out+='</div>';return out}

function printCards(onlySelected){
 const sets=onlySelected?[lesson()]:LESSONS;
 const root=document.getElementById("print-root")||document.createElement("section");
 root.id="print-root";
 root.innerHTML=sets.map(function(x){
  return '<article class="print-card"><div class="print-card-header"><b>EIKEN GRADE 2 · PRACTICE CARD</b><span>SET '+esc(x.id.toUpperCase())+'</span></div><h2>'+esc(x.titleEn)+'</h2><p class="print-passage">'+esc(x.passage)+'</p><div class="print-illustrations">'+x.panels.map(sceneSVG).join("")+'</div><div class="print-numbers"><span>1</span><span>2</span><span>3</span></div><p class="print-lead">'+esc(x.lead)+'</p><div class="print-foot">ORIGINAL · UNOFFICIAL PRACTICE MATERIAL</div></article>'
 }).join("");
 document.body.appendChild(root);
 const remove=function(){root.remove();window.removeEventListener("afterprint",remove)};
 window.addEventListener("afterprint",remove);
 window.print();
}

function stageScene(){let s=st.stage;if(s==="welcome")return '<div class="panel"><div class="kicker">START</div><h2 class="stage-title">入室して、あいさつしよう</h2><p class="subtext">試験官に「Hello!」「I am fine, thank you.」などを言ってみよう。</p></div>';
if(s==="silent"||s==="reading"||s==="q1"||s==="prep2"||s==="q2")return '<div class="panel"><div class="kicker">QUESTION CARD</div>'+paper(true)+'</div>';
if(s==="flip"||s==="q3"||s==="q4")return '<div class="backside">🔒<br>ここからはカードを裏返します。<br>自分の言葉で答えてみよう。</div>';
return ""}
function counter(){if(st.stage!=="silent"&&st.stage!=="prep2")return "";return '<div class="timerbox"><strong id="count">'+st.time+'</strong><small>秒 · 準備時間<br>時間が来ると自動で次へ進みます。</small></div>'}
function stage(){const s=st.stage;if(s==="end"){finish();return}const idx=STAGES.indexOf(s),sub=st.mode==="practice"?"GUIDED PRACTICE":"REAL EXAM MODE";let h=header()+'<div class="session-head"><span class="session-title">'+esc(lesson().title)+'　<span class="note">'+sub+'</span></span><button class="btn small" data-action="quit">✕ 終了</button></div><div class="progress">'+STAGES.map(function(k,i){return '<span class="'+(i<idx?"done":i===idx?"now":"")+'" title="'+esc(TITLES[k])+'"></span>'}).join("")+'</div>';
h+='<div class="interview"><div>'+video()+'<div class="panel" style="margin-top:14px"><div class="kicker">EXAMINER SAYS</div><h2 class="stage-title">'+esc(TITLES[s])+'</h2><div class="bubble '+(!st.show?"caption-off":"")+'" aria-live="polite">'+(!st.show?"🎧 質問をよく聞いて、声に出して答えよう。":esc(promptText()))+'</div><div class="tools"><button class="btn small" data-action="repeat">🔊 もう一度</button><button class="btn small" data-action="caption">'+(st.show?"🙈 字幕を隠す":"👀 字幕を見る")+'</button></div></div></div><div class="screen '+(st.mode==="exam"?"exam-mode":"practice-mode")+'">'+counter()+stageScene()+(isAnswerStage()?responsePane():'')+'<div class="footer-action"><button class="btn small" data-action="back">← 戻る</button><button class="btn primary" data-action="next">'+(s==="silent"||s==="prep2"?"準備OK → 次へ":s==="welcome"?"入室できた → 次へ":s==="flip"?"裏返した → 次へ":"答えた！ → 次へ")+'　→</button></div>'+(st.error?'<div class="flash" role="status">'+esc(st.error)+'</div>':'')+'</div></div>';
app.innerHTML=h;syncTalking()}
function syncTalking(){const v=document.getElementById("vid");if(v)v.classList.toggle("talking",st.speaking)}
let voice=null;function chooseVoice(){try{const vs=window.speechSynthesis.getVoices();voice=vs.find(function(v){return /^en-US/i.test(v.lang)&&/Samantha|Google|Jenny|Aria/i.test(v.name)})||vs.find(function(v){return /^en-US/i.test(v.lang)})||vs.find(function(v){return /^en-/i.test(v.lang)})||null}catch(e){}}
if("speechSynthesis" in window){chooseVoice();window.speechSynthesis.addEventListener("voiceschanged",chooseVoice)}
function stopAudio(){try{window.speechSynthesis.cancel()}catch(e){}st.speaking=false;syncTalking()}
function say(text,done){stopAudio();if(!("speechSynthesis" in window)){if(done)done();return}const token=st.token;let complete=false;function ondone(){if(complete||token!==st.token)return;complete=true;st.speaking=false;syncTalking();if(done)done()}try{const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=st.rate;u.pitch=1.02;if(voice)u.voice=voice;u.onstart=function(){if(token===st.token){st.speaking=true;syncTalking()}};u.onend=ondone;u.onerror=ondone;window.speechSynthesis.speak(u);if(done)setTimeout(ondone,10000)}catch(e){ondone()}}
function clearCountdown(){if(st.activeTimer){clearInterval(st.activeTimer);st.activeTimer=null}}
function startCountdown(){if(st.stage!=="silent"&&st.stage!=="prep2")return;clearCountdown();const token=st.token,deadline=Date.now()+20000;st.activeTimer=setInterval(function(){if(token!==st.token){clearCountdown();return}const n=Math.max(0,Math.ceil((deadline-Date.now())/1000));st.time=n;const el=document.getElementById("count");if(el)el.textContent=n;if(n<=0){clearCountdown();advance()}},180)}
function go(s){EikenVoice.cancel();st.token++;clearCountdown();stopAudio();if(st.recognition){try{st.recognition.abort()}catch(e){}st.recognition=null}st.stage=s;st.show=st.mode==="practice";st.error="";st.time=20;if(s==="end"){finish();return}stage();const msg=promptText();if(msg){say(msg,(s==="silent"||s==="prep2")?startCountdown:undefined)}else if(s==="silent"||s==="prep2")startCountdown();window.scrollTo({top:0,behavior:"instant"})}
function advance(){const idx=STAGES.indexOf(st.stage);if(idx<STAGES.length-1)go(STAGES[idx+1])}
function start(mode){st.mode=mode;st.answers={};go("welcome")}

function voiceStatus(msg){
 const el=document.getElementById("voice-status");if(el)el.textContent=msg;
 const b=document.querySelector('[data-action="aimic"]');
 if(b)b.textContent=EikenVoice.isRecording()?"⏹ 録音を終了":"🎙️ 録音してAI変換";
}
function voiceAnswer(t){
 const key=st.stage;
 if(!["q1","q2","q3","q4"].includes(key))return;
 st.answers[key]=((st.answers[key]||"")+" "+t).trim();
 const ta=document.getElementById("answer");if(ta)ta.value=st.answers[key];
}
function mic(){
 if(!window.EikenVoice){voiceStatus("音声入力機能を読み込めませんでした。ページを更新してください。");return}
 EikenVoice.nativeSpeech({onState:voiceStatus,onText:voiceAnswer});
}
function aiMic(){
 if(!window.EikenVoice){voiceStatus("録音機能を読み込めませんでした。ページを更新してください。");return}
 if(EikenVoice.isRecording()){EikenVoice.stopAI();return}
 EikenVoice.aiSpeech({onState:voiceStatus,onText:voiceAnswer,maxSeconds:st.stage==="q2"?35:25});
}
function checkItem(n,q,model,answer){const words=answer.trim()?answer.trim().split(/\s+/).length:0;const reason=/\b(because|since|for example|also|so|first|then|finally|later|after)\b/i.test(answer);const tip=!words?"まだ回答メモがないよ。次は声に出してみよう。":n===2&&words<16?"3コマを順番に説明して、3つ以上の文にしてみよう。":(n===3||n===4)&&!reason?"理由を because / for example で加えてみよう。":words<7?"もう少し詳しく話せるといいね。":"伝えようとしたことがいいね。お手本と比べてみよう。";return '<div class="check-item"><div class="kicker">No.'+n+'</div><p>'+esc(q)+'</p><p class="muted"><b>あなた：</b>'+(words?esc(answer):"（メモなし）")+'</p><div class="model"><b>お手本の一例：</b><br>'+esc(model)+'</div><p class="note">'+esc(tip)+'</p></div>'}
function finish(){st.stage="result";stopAudio();clearCountdown();const x=lesson();saved.sessions.push({date:new Date().toISOString(),id:x.id,mode:st.mode});if(saved.sessions.length>250)saved.sessions=saved.sessions.slice(-250);save();let h=header()+'<div class="result-banner"><div class="eyebrow">MISSION COMPLETE</div><h1>面接、完走！ 🎉</h1><p>最後まで英語を話し切ったね。<br>今日のチャレンジが次の自信につながるよ。</p><span class="pill">'+(st.mode==="exam"?"本番チャレンジ":"やさしく練習")+' · '+esc(x.title)+'</span></div>';
h+='<section class="section card"><h2>🌟 ふりかえり</h2><p class="note">ここは自動採点ではなく、お手本とメモを比べる練習ページです。音声の発音や内容の正しさをAIが判定したものではありません。</p><div class="check">'+checkItem(1,x.q1,x.a1,st.answers.q1||"")+checkItem(2,x.q2,x.a2,st.answers.q2||"")+checkItem(3,x.q3,x.a3,st.answers.q3||"")+checkItem(4,x.q4,x.a4,st.answers.q4||"")+'</div></section><div class="actions"><button class="btn primary" data-action="again">🔁 同じ問題でもう一度</button><button class="btn" data-action="home">🏠 問題を選び直す</button></div>';
app.innerHTML=h;window.scrollTo(0,0)}
document.addEventListener("input",function(e){if(e.target&&e.target.id==="answer")st.answers[st.stage]=e.target.value});
document.addEventListener("click",function(e){const b=e.target.closest("[data-action]");if(!b)return;const a=b.getAttribute("data-action"),v=b.getAttribute("data-value");if(a==="choose"){st.lesson=+v;home()}else if(a==="start")start(b.getAttribute("data-mode"));else if(a==="next")advance();else if(a==="back"){const i=STAGES.indexOf(st.stage);if(i>0)go(STAGES[i-1])}else if(a==="quit"){EikenVoice.cancel();st.token++;clearCountdown();stopAudio();st.stage="home";home()}else if(a==="caption"){st.show=!st.show;stage()}else if(a==="repeat"){say(promptText(),(st.stage==="silent"||st.stage==="prep2")?startCountdown:undefined)}else if(a==="mic")mic();else if(a==="aimic")aiMic();else if(a==="home"){EikenVoice.cancel();st.stage="home";home()}else if(a==="again")start(st.mode);else if(a==="rate"){st.rate=Number(v)||.9;saved.rate=st.rate;save();home()}else if(a==="printall")printCards(false);else if(a==="printone")printCards(true);else if(a==="testvoice"){say("Hello! Welcome to your English interview. Let's practice together!")}})
document.addEventListener("visibilitychange",function(){if(document.hidden){stopAudio();clearCountdown()}else if(st.stage==="silent"||st.stage==="prep2"){startCountdown()}});
home();
</script>
</body></html>
