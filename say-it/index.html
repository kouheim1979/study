<style>
/* SAY IT. — Editorial speaking studio, November 2026 */
:root{
  --ink:#172a27;
  --muted:#75827b;
  --paper:#f8f7f2;
  --white:#fffefa;
  --line:#dfe6dc;
  --purple:#ef6246;
  --purpleDeep:#d34c34;
  --lime:#c9f27c;
  --good:#197758;
  --bad:#c65a4a;
  --shadow:0 7px 0 rgba(28,51,43,.035);
}
html{scroll-behavior:smooth}
body{background:#eeeee8;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
button{transition:transform .15s,background .15s,border-color .15s}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #e5a45c;outline-offset:3px}
.app{max-width:1580px;grid-template-columns:242px minmax(0,1fr);background:var(--paper);box-shadow:none;border-left:1px solid #e5e7df;border-right:1px solid #e5e7df}
.sidebar{background:#fffefa;color:var(--ink);border-right:1px solid #e5e8e0;padding:32px 20px;gap:29px}
.brand{margin:0 9px 18px;gap:12px}
.brandmark{height:45px;width:45px;border-radius:13px;background:var(--purple);color:#fff;font-size:22px;transform:none;box-shadow:4px 4px 0 #facdbb}
.brand h1{font-size:26px;letter-spacing:-.07em}
.brand p{color:#849085;letter-spacing:.09em;font-size:10px}

.nav button:hover{background:#f4f3ee;color:var(--ink)}
.nav button.active{background:#183a31;color:#fff}
.nav button.active .navico{color:var(--lime)}
.navico{font-size:22px}
.sideline{background:#e7e9e1}
.sidebar>div[style*="padding:0 11px"]{color:#7f8d83!important}
.sidefoot{border:1px solid #dce5d8;background:#f0f5e7;border-radius:18px;padding:19px}
.sidefoot .small{color:#60776b;font-weight:750}
.sidefoot .big{color:#193a31;font-size:38px}
.sidefoot .big span{color:#60776b}
.sidefoot .mini-track{background:#d7e5d2}

.main{max-width:1190px;width:100%;margin:0 auto;padding:35px clamp(30px,4.4vw,72px) 90px}
.topline{margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.eyebrow{color:var(--purple);letter-spacing:.13em;font-size:11px;font-weight:900}
.daytag{background:#edf1e8;color:#617369;border:1px solid #e2e7dc;border-radius:8px;font-size:11px;padding:8px 12px}
.homehero{min-height:320px;background:#fc8363;border-radius:26px;padding:42px 46px;box-shadow:6px 7px 0 #e9e9df;color:#1e302c;isolation:isolate}
.homehero::before{width:425px;height:425px;right:-85px;top:-185px;background:#ffb29c;border:0;opacity:.7;transform:rotate(-18deg);border-radius:47% 53% 65% 35%}
.homehero::after{width:295px;height:295px;right:18%;top:56%;border:1px solid #1b393522;border-radius:50%}
.hero-content{max-width:590px}
.hero-kicker{display:inline-flex;background:#17392f;border-radius:100px;color:#ddf69f;font-size:10px;letter-spacing:.14em;padding:9px 14px;margin-bottom:22px}
.homehero h2{font-size:clamp(33px,3.8vw,49px);line-height:1.37;letter-spacing:-.085em;margin:0 0 13px;color:#132c26;position:relative}
.homehero p{color:#344d43;line-height:1.85;font-size:13px;font-weight:600}
.hero-start{background:#163a30;color:#fff;min-height:46px;border-radius:10px;padding:14px 22px;box-shadow:4px 5px 0 #ffe0c5;margin-top:23px;font-weight:900;font-size:13px}
.hero-start:hover{background:#244b3e;filter:none;transform:translateY(-2px)}
.hero-art{right:7%;top:70px;transform:rotate(11deg);opacity:1}
.bubble{width:178px;height:125px;font-size:50px;letter-spacing:-.075em;border-radius:28px 28px 8px 28px;background:#fffcef;box-shadow:9px 10px 0 #153a3129;color:#18382d;transform:rotate(-8deg);border:2px solid #18382d}
.bubble::after{right:-10px;bottom:-23px;width:45px;height:38px;transform:rotate(-25deg);background:#c9f27c;border:2px solid #18382d;border-radius:14px 14px 9px 14px}
.section-head{margin:42px 0 17px;align-items:baseline}
.section-head h3{font-size:20px;letter-spacing:-.055em}

.section-head span{color:#88978d;font-size:11px}
.setup{background:#fffefa;border-radius:22px;border:1px solid #e1e8de;box-shadow:5px 5px 0 #eaece4;padding:30px}
.form-label{color:#4c6157;font-size:12px;margin:0 0 11px;letter-spacing:0}
.form-label::before{content:"";display:inline-block;height:6px;width:6px;border-radius:50%;background:#ee7a62;margin-right:7px;vertical-align:2px}
.choices{gap:8px}
.chip{border-radius:9px;border:1px solid #dae2da;background:#f6f7f1;color:#64746a;padding:12px 19px;font-weight:800;font-size:13px}
.chip:hover{border-color:#f2a18f;color:#b94b37}
.chip.selected{background:#193d32;border-color:#193d32;color:#fff;box-shadow:none}
.setupgrid{gap:26px;margin-top:28px}
.control-select{border-radius:9px;background-color:#f6f7f1;border-color:#dae2da;color:#223c33;min-height:48px}
.timers .chip{padding:12px 13px}
.start-row{border-top:1px dashed #d7e0d3;margin-top:30px;padding-top:25px}
.start-row .caption{color:#78887b}
.primary{background:#ee6245;color:#fff;border-radius:11px;box-shadow:4px 4px 0 #ffdbca;font-size:14px;padding:16px 24px}
.primary:hover{background:#d24c37;transform:translateY(-2px)}
.mini-grid{gap:13px}
.stat-card{background:#fffefa;border:1px solid #e0e7dc;border-radius:17px;box-shadow:3px 3px 0 #eaede5;padding:19px 22px}
.stat-card .stat-title{color:#7a897d;font-size:12px}
.stat-card .stat-number{color:#1a3b30;font-size:32px}
.stat-card .stat-caption{color:#929f95}

function buttonSet(items,selected,attr){return items.map(item=>`<button class="chip ${selected===item?'selected':''}" data-${attr}="${escapeHTML(item)}" aria-pressed="${selected===item}">${item==='all'?'全部':escapeHTML(item)}</button>`).join('')}
function renderHome(){const available=currentPool().length;els.view.innerHTML=`<div class="view"><section class="homehero"><div class="hero-content"><div class="hero-kicker">SPEAK WITH CONFIDENCE · EVERY DAY</div><h2>英語が、<br>口から出る。</h2><p>日本語を見て声に出す → 答えを確認。<br>短い反復で、英語の反射神経を鍛えよう。</p><button id="heroStart" class="hero-start">10問ではじめる ↗</button></div><div class="hero-art" aria-hidden="true"><div class="bubble">SAY!</div></div></section>
<div class="section-head"><h3>今日のトレーニング</h3><span>設定はいつでも変更できます</span></div><section class="setup"><div class="form-label">難易度を選ぶ</div><div class="choices" id="levels">${buttonSet(['すべて','初級','中級','上級'],config.level,'level')}</div><div class="setupgrid"><div><div class="form-label">出題テーマ</div><select class="control-select" id="topic" aria-label="出題テーマ">${uniqueTopics.map(t=>`<option value="${t}" ${t===config.topic?'selected':''}>${t}</option>`).join('')}</select></div><div><div class="form-label">制限時間</div><div class="timers">${[3,5,10,0].map(t=>`<button class="chip ${config.timer===t?'selected':''}" data-timer="${t}">${t===0?'なし':t+'秒'}</button>`).join('')}</div></div></div><div class="setupgrid"><div><div class="form-label">練習する問題数</div><div class="choices">${buttonSet([5,10,20,'全部'],config.count,'count')}</div></div><div><div class="form-label">練習のコツ</div><div style="font-size:12px;line-height:1.9;color:#818da0">まず声に出して、答えを確認。<br>別の自然な英語でもOKです。</div></div></div><div class="start-row"><div class="caption">対象 <b>${available}問</b> ／ 全 <b>${BANK.length}問</b> からランダム出題</div><button class="primary" id="start">練習スタート <span aria-hidden="true">→</span></button></div></section>
<div class="section-head"><h3>これまでの記録</h3><span>学習データはこの端末に保存</span></div><div class="mini-grid">${statCards()}</div></div>`;
els.view.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{config.level=b.dataset.level;config.topic='すべて';renderHome()});els.view.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>{config.count=isNaN(Number(b.dataset.count))?'全部':Number(b.dataset.count);renderHome()});els.view.querySelectorAll('[data-timer]').forEach(b=>b.onclick=()=>{config.timer=Number(b.dataset.timer);renderHome()});document.getElementById('topic').onchange=e=>{config.topic=e.target.value;renderHome()};document.getElementById('start').onclick=()=>start(false);document.getElementById('heroStart').onclick=()=>{const oldCount=config.count;config.count=10;start(false);config.count=oldCount}}
function statCards(){return `<div class="stat-card"><div class="stat-title">練習した文</div><div class="stat-number">${record.total}<small> 文</small></div><div class="stat-caption">累計チャレンジ</div></div><div class="stat-card"><div class="stat-title">できた率</div><div class="stat-number">${record.total?Math.round(record.correct/record.total*100):0}<small> %</small></div><div class="stat-caption">自己評価ベース</div></div><div class="stat-card"><div class="stat-title">苦手な文</div><div class="stat-number">${weakItems().length}<small> 問</small></div><div class="stat-caption">繰り返して定着</div></div>`}
function start(onlyWeak){let pool=onlyWeak?weakItems():currentPool();if(!pool.length){toast(onlyWeak?'苦手な問題はまだありません':'この条件の問題はありません');return}pool=shuffle([...pool]);const n=config.count==='全部'?pool.length:Math.min(config.count,pool.length);run={items:pool.slice(0,n),index:0,shown:false,good:0,miss:0,onlyWeak};page='practice';typingVisible=false;render();window.scrollTo({top:0,behavior:'smooth'})}
function stopTimer(){if(interval){clearInterval(interval);interval=null}}
function initTimer(){stopTimer();if(!run||config.timer===0||run.shown)return;timerEnd=Date.now()+config.timer*1000;const element=document.getElementById('timer');if(!element)return;const update=()=>{if(!run||run.shown)return;const remain=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));element.innerHTML=`<span class="timer-dot"></span>${remain?String(remain).padStart(2,'0')+'s':'TIME UP'}`;element.classList.toggle('out',remain===0);if(remain===0)stopTimer()};update();interval=setInterval(update,120)}
function renderPractice(){if(!run)return go('home');if(run.index>=run.items.length)return renderFinish();const q=run.items[run.index],percent=run.index/run.items.length*100;els.view.innerHTML=`<div class="view"><div class="progress-header"><button class="back" id="backhome">← 練習を終了</button><div class="progress-meta"><strong style="color:#182132">${run.index+1}</strong> / ${run.items.length} 問</div></div><div class="progress-track"><div style="width:${percent}%"></div></div>
<div class="question-card"><div class="q-top"><span class="pill">${escapeHTML(q.level)}・${escapeHTML(q.topic)}</span><div id="timer" class="timer" role="timer">${config.timer===0?'FREE':config.timer+'s'}</div></div>
<div class="qbody"><p class="q-kicker">SAY IT IN ENGLISH</p><h2 class="japanese">${escapeHTML(q.jp)}</h2><div class="prompt">声に出して英語にしてみよう</div></div>
<div id="answerZone" class="answer-zone">${run.shown?answerHTML(q):'<div class="answer-hide"><button id="reveal" class="reveal">答えを見る <span aria-hidden="true">→</span></button></div>'}</div>
</div><div class="assist-row"><span>声に出すだけでOK。採点は自分で決められます。</span><button class="typing-btn" id="toggleTyping">⌨ タイピング練習 ${typingVisible?'を閉じる':'もする'}</button></div><div id="typearea">${typingVisible?typingHTML():''}</div></div>`;
document.getElementById('backhome').onclick=()=>{if(run&&run.index>0){record.sessions++;save()}go('home')};document.getElementById('toggleTyping').onclick=()=>{typingVisible=!typingVisible;const oldInput=document.getElementById('answerInput')?.value||'';const a=document.getElementById('typearea');a.innerHTML=typingVisible?typingHTML(oldInput):'';document.getElementById('toggleTyping').textContent=typingVisible?'⌨ タイピング練習を閉じる':'⌨ タイピング練習もする';bindTyping()};bindAnswer();bindTyping();if(!run.shown)initTimer()}
function typingHTML(previous=''){return `<div class="typebox"><label for="answerInput">英文を入力してから答えを確認できます（任意）</label><input id="answerInput" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="I am ..." value="${escapeHTML(previous)}"><div id="typeFeedback" class="type-feedback">入力した英文は自動採点しません。答えと見比べてみよう。</div></div>`}
function answerHTML(q){return `<div class="answer"><div class="q-kicker" style="margin:0 0 9px">MODEL ANSWER</div><div class="en-text">${escapeHTML(q.en)}</div>${q.tip?`<div class="tip">💡 ${escapeHTML(q.tip)}</div>`:''}<div class="answer-actions"><button class="ghost" id="speak">◖))　英語を聞く</button><div class="rate-actions"><button id="miss" class="miss">↻　あとで復習</button><button id="got" class="got">✓　できた！ →</button></div></div></div>`}
function bindAnswer(){if(!run)return;const q=run.items[run.index];const rev=document.getElementById('reveal');if(rev)rev.onclick=()=>{run.shown=true;stopTimer();document.getElementById('answerZone').innerHTML=answerHTML(q);bindAnswer();document.getElementById('answerZone').scrollIntoView({block:'nearest',behavior:'smooth'})};const sp=document.getElementById('speak');if(sp)sp.onclick=()=>speak(q.en);const got=document.getElementById('got');if(got)got.onclick=()=>grade(true);const miss=document.getElementById('miss');if(miss)miss.onclick=()=>grade(false)}
function bindTyping(){const inp=document.getElementById('answerInput');if(inp){inp.onkeydown=e=>{if(e.key==='Enter'&&!run.shown){e.preventDefault();document.getElementById('reveal')?.click()}}}}
function speak(t){if(!('speechSynthesis' in window)){toast('この環境では音声再生に対応していません');return}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.86;u.pitch=1;const voices=speechSynthesis.getVoices();const v=voices.find(v=>v.lang.toLowerCase().startsWith('en-us')&&/enhanced|premium|natural/i.test(v.name))||voices.find(v=>v.lang.toLowerCase().startsWith('en-us'))||voices.find(v=>v.lang.toLowerCase().startsWith('en'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){toast('音声の再生に失敗しました')}}
function grade(isGood){if(!run||!run.shown)return;let q=run.items[run.index];const d=record.details[q.id]||{attempts:0,correct:0,weak:false};d.attempts++;if(isGood){d.correct++;d.weak=false;run.good++;record.correct++}else{d.weak=true;run.miss++}record.details[q.id]=d;record.total++;save();run.index++;run.shown=false;typingVisible=false;stopTimer();if(run.index<run.items.length)renderPractice();else{record.sessions++;save();renderFinish()}}
function renderFinish(){page='finish';stopTimer();const done=run.good+run.miss;const pct=done?Math.round(run.good/done*100):0;els.view.innerHTML=`<div class="view"><div class="progress-track"><div style="width:100%"></div></div><section class="finish-card"><div class="finish-emblem">✦</div><div class="eyebrow">SESSION COMPLETE</div><h2>今日も一歩、英語が近づいた！</h2><p>おつかれさま。苦手な文は復習に自動で追加されています。</p><div class="finish-scores"><div><strong>${done}</strong><small>練習した文</small></div><div><strong style="color:#16845e">${pct}%</strong><small>できた率</small></div><div><strong style="color:#dc7064">${run.miss}</strong><small>復習する文</small></div></div><div class="finish-buttons"><button class="secondary" id="finishHome">ホームに戻る</button><button class="primary" id="finishAgain">もう一度練習 →</button></div></section></div>`;document.getElementById('finishHome').onclick=()=>go('home');document.getElementById('finishAgain').onclick=()=>start(run.onlyWeak);syncUI()}
function renderWeak(){const weak=weakItems();els.view.innerHTML=`<div class="view"><div class="section-head" style="margin-top:0"><h3>苦手を復習</h3><span>${weak.length} 問</span></div><section class="stats-section"><div style="display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:18px"><div><div style="font-weight:900;font-size:18px">間違えた文を、もう一度。</div><div style="font-size:12px;color:#8a95a5;margin-top:7px">「できた！」になると苦手リストから外れます。</div></div><button id="startWeak" class="primary" ${weak.length?'':'disabled'}>復習スタート →</button></div><div class="weak-list">${weak.length?weak.map(q=>`<div class="weak-item"><div><div class="weak-jp">${escapeHTML(q.jp)}</div><div class="weak-en">${escapeHTML(q.en)}</div></div><span class="weak-tag">${q.level}</span></div>`).join(''):'<div class="empty-state">まだ苦手な問題はありません。<br>まずは今日の練習を始めてみましょう。</div>'}</div></section></div>`;document.getElementById('startWeak').onclick=()=>start(true)}
function renderStats(){const levels=['初級','中級','上級'];const rows=levels.map(level=>{const items=BANK.filter(q=>q.level===level),attempted=items.filter(q=>record.details[q.id]?.attempts),weak=items.filter(q=>record.details[q.id]?.weak).length;return `<div style="padding:18px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:15px"><div style="font-weight:850;font-size:13px;min-width:46px">${level}</div><div style="flex:1;background:#edf0f6;height:10px;border-radius:50px;overflow:hidden"><div style="height:100%;border-radius:50px;width:${attempted.length/items.length*100}%;background:var(--purple)"></div></div><span style="font-size:12px;color:#718096;min-width:105px;text-align:right">${attempted.length} / ${items.length} 問</span><span style="font-size:11px;color:#de746a;min-width:50px;text-align:right">苦手 ${weak}</span></div>`}).join('');els.view.innerHTML=`<div class="view"><div class="section-head" style="margin-top:0"><h3>学習記録</h3><span>がんばりを見える化</span></div><div class="mini-grid" style="margin-top:0;margin-bottom:17px">${statCards()}</div><section class="stats-section"><h3>レベル別の取り組み状況</h3><div style="font-size:12px;color:#8b96a6;margin-bottom:16px">一度でも解いた文をカウントしています。</div>${rows}<div style="font-size:11px;color:#9ca5b2;line-height:1.8;margin-top:13px">全${BANK.length}問。記録はこのブラウザに保存されます。<br>英作文には複数の正しい言い方があります。解答例と比較して自己評価してください。</div></section></div>`}
function render(){syncUI();if(page==='home')renderHome();else if(page==='practice')renderPractice();else if(page==='weak')renderWeak();else if(page==='stats')renderStats();else if(page==='finish')renderFinish();syncUI()}
document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.nav)));document.getElementById('brand').addEventListener('click',()=>go('home'));document.getElementById('brand').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go('home')}});
document.addEventListener('keydown',e=>{if(!run||page!=='practice'||e.target.matches('input,select,button'))return;if(e.code==='Space'){e.preventDefault();if(!run.shown)document.getElementById('reveal')?.click()}else if(run.shown&&e.key==='1')document.getElementById('miss')?.click();else if(run.shown&&e.key==='2')document.getElementById('got')?.click()});
render();
</script>
</body>
</html>
