<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f7f3">
<meta name="description" content="SAY IT.｜日本語を英語にする瞬間英作文。140文、音声再生、苦手復習。">
<title>SAY IT. — 瞬間英作文</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* SAY IT — A language notebook, not a landing page. */
:root{
  --paper:#f6f4ee;--paper2:#eeeae0;--white:#fffefa;--ink:#262b29;
  --muted:#666e6a;--faint:#848b86;--rule:#d9d9d1;
  --green:#31584c;--deep:#223b34;--soft:#e6ebe5;--accent:#b46b4e;
  --serif:"Zen Old Mincho","Yu Mincho","Hiragino Mincho ProN",serif;
  --sans:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --latin:"DM Sans","Inter",-apple-system,BlinkMacSystemFont,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%;scroll-behavior:smooth;touch-action:manipulation}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:500;line-height:1.7;-webkit-font-smoothing:antialiased;font-feature-settings:"palt" 1}
body::before{content:"";position:fixed;top:0;left:0;width:100%;height:3px;background:var(--green);z-index:90}
button,select,input,textarea{font:inherit;touch-action:manipulation}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
button:active:not(:disabled){transform:translateY(1px)}
a{color:inherit}
#app{min-height:100svh}
.frame,.main{max-width:1120px;margin:0 auto;padding-left:clamp(24px,5vw,68px);padding-right:clamp(24px,5vw,68px)}
.site-head{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--rule);gap:20px}
.identity{display:flex;align-items:baseline;gap:19px;border:0;background:none;padding:0;color:var(--ink)}
.wordmark{font-family:var(--latin);font-size:30px;font-weight:800;letter-spacing:-.102em;line-height:1}
.wordmark .point{color:var(--accent)}
.identity-caption{font-family:var(--sans);font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.12em}
.top-nav{display:flex;align-items:stretch;gap:38px;height:100%}
.nav-link{position:relative;border:0;background:none;padding:0;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.035em}
.nav-link[aria-current="page"]{color:var(--ink);font-weight:700}
.nav-link[aria-current="page"]:after{content:"";height:2px;position:absolute;bottom:0;left:0;right:0;background:var(--accent)}
.top-date{color:var(--faint);font-family:var(--latin);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.main{padding-bottom:90px}
.home{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(275px,.62fr);column-gap:clamp(56px,8vw,128px);align-items:start;padding-top:68px}
.home-primary{display:flex;flex-direction:column;min-width:0}
.eyebrow{order:0;display:flex;align-items:center;gap:11px;font-family:var(--latin);font-size:10px;color:var(--accent);font-weight:800;letter-spacing:.17em;text-transform:uppercase}
.eyebrow .rule{width:18px;height:1px;background:var(--accent)}
.home-title{order:1;font-family:var(--serif);font-size:clamp(44px,5.5vw,69px);line-height:1.34;letter-spacing:-.075em;font-weight:600;margin:15px 0 12px;font-feature-settings:"palt" 1}
.home-lead{order:2;margin:0 0 34px;color:var(--muted);font-size:13px;line-height:2.05;letter-spacing:.015em}
.lesson-head{order:5;display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin:41px 0 5px;padding-top:14px;border-top:1px solid var(--ink)}
.lesson-head h2{font-size:13px;letter-spacing:.07em;font-weight:700;margin:0}
.lesson-head small{font-family:var(--latin);font-size:11px;color:var(--faint);letter-spacing:.06em}
.settings{order:6;border-top:0;margin-top:5px}
.setting{display:grid;grid-template-columns:100px 1fr;gap:9px;align-items:center;padding:16px 0;border-bottom:1px solid var(--rule)}
.setting-name{font-size:12px;color:var(--muted);font-weight:600}
.seg{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
.seg button{min-width:43px;border:1px solid transparent;background:transparent;color:var(--muted);padding:7px 12px;border-radius:3px;font-size:12px;font-weight:550;line-height:1.5}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--soft);border-color:#cad5cb;color:var(--deep);font-weight:700}
.setting select{appearance:none;background:transparent;border:0;border-radius:0;color:var(--ink);padding:7px 25px 9px 0;font-size:16px;font-weight:600;max-width:100%;cursor:pointer}
.setting .select-wrap{display:inline-block;position:relative;border-bottom:1px solid #a7aea6;max-width:100%}
.setting .select-wrap:after{content:"";position:absolute;right:5px;top:13px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);width:6px;height:6px;transform:rotate(45deg);pointer-events:none}
.begin{order:3;position:relative;width:100%;min-height:77px;margin:0;border:0;border-radius:2px;background:var(--deep);color:#fffefa;text-align:left;display:flex;align-items:center;justify-content:space-between;padding:13px 22px 13px 25px;font-size:15px;font-weight:700;letter-spacing:.025em}
.begin::before{content:"";position:absolute;left:0;bottom:0;width:0;height:3px;background:var(--accent);transition:width .25s ease}
.begin:hover{background:#294a41}
.begin:hover::before{width:100%}
.begin>span:last-child{font-family:var(--latin);font-size:13px;font-weight:650;letter-spacing:.025em;color:#d5e5de}
.hint-under{order:4;font-size:11px;color:var(--faint);margin:10px 0 0;line-height:1.8}
.sidebar{padding-top:90px}
.sidebar-label{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.055em;padding:0 0 16px;border-bottom:1px solid var(--ink)}
.sidebar-label::after{content:"NOTE / 01";font-family:var(--latin);font-size:9px;color:var(--faint);font-weight:700;letter-spacing:.1em}
.sidebar-stat{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:9px;border-bottom:1px solid var(--rule);padding:18px 0 17px}
.sidebar-stat span{color:var(--muted);font-size:12px}
.sidebar-stat strong{font-family:var(--latin);font-weight:600;font-size:32px;letter-spacing:-.065em;line-height:1}
.sidebar-stat em{font-family:var(--sans);font-weight:500;margin-left:4px;font-size:11px;font-style:normal;letter-spacing:0}
.side-note{font-family:var(--serif);font-size:13px;color:var(--muted);line-height:2.1;margin:29px 0 0;font-weight:500}
.side-link{display:inline-flex;align-items:center;gap:10px;border:0;border-bottom:1px solid var(--accent);color:var(--deep);background:none;margin-top:22px;padding:0 0 4px;font-size:12px;font-weight:700}
.practice{max-width:780px;margin:0 auto;min-height:calc(100svh - 82px);display:flex;flex-direction:column;padding-top:31px}
.exercise-bar{display:flex;align-items:center;justify-content:space-between}
.exit{border:0;background:transparent;padding:9px 0;color:var(--muted);font-size:12px;font-weight:650}
.counter{color:var(--muted);font-family:var(--latin);font-variant-numeric:tabular-nums;font-size:12px;letter-spacing:.03em}
.counter b{font-family:var(--latin);font-weight:650;color:var(--ink);font-size:22px}
.progress{height:2px;background:var(--rule);margin:17px 0 0;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);transition:width .22s}
.exercise-content{flex:1;display:flex;flex-direction:column;justify-content:center;padding:53px 0 25px}
.exercise-meta{display:flex;justify-content:space-between;align-items:center;gap:14px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.075em;margin:0 0 39px}
.timer{font-family:var(--latin);font-variant-numeric:tabular-nums;display:inline-flex;gap:5px;align-items:baseline}
.timer strong{color:var(--green);font-size:21px;font-weight:650;letter-spacing:-.055em}
.timer.expired strong{color:var(--accent)}
.sentence{font-family:var(--serif);font-size:clamp(36px,5vw,55px);font-weight:600;line-height:1.67;letter-spacing:-.069em;max-width:820px;margin:0;overflow-wrap:anywhere;font-feature-settings:"palt" 1;text-wrap:pretty}
.prompt-remark{color:var(--faint);font-size:12px;letter-spacing:.07em;margin:30px 0 0}
.answer-section{position:relative;margin:42px 0 0;border-top:1px solid #a5aba4;padding:23px 0 0}
.answer-label{font-family:var(--latin);font-size:10px;font-weight:800;letter-spacing:.17em;color:var(--accent);text-transform:uppercase}
.answer-en{font-family:var(--latin);font-size:clamp(27px,3.4vw,40px);line-height:1.53;letter-spacing:-.045em;font-weight:500;margin:15px 0 16px;max-width:710px}
.answer-tip{font-size:12px;line-height:1.9;color:var(--muted);margin:0 0 12px}
.sound{display:inline-flex;gap:9px;align-items:center;border:0;border-bottom:1px solid #9ca99c;background:none;color:var(--deep);padding:6px 0;font-size:12px;font-weight:700}
.sound svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7}
.exercise-foot{margin-top:auto;padding:17px 0 calc(32px + env(safe-area-inset-bottom))}
.primary,.secondary{min-height:68px;display:flex;align-items:center;justify-content:center;width:100%;border-radius:2px;font-size:14px;font-weight:700;letter-spacing:.035em}
.primary{border:1px solid var(--deep);color:#fffefa;background:var(--deep)}
.primary:hover{background:#304e43}
.secondary{border:1px solid var(--deep);background:transparent;color:var(--deep)}
.review-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.text-action{display:block;margin:13px auto 0;background:transparent;color:var(--muted);border:0;font-size:12px;padding:9px 0}
.type-panel{margin:23px 0 0}
.type-panel label{display:block;font-size:12px;margin-bottom:9px;color:var(--muted)}
.type-panel input{width:100%;background:var(--white);border:1px solid var(--rule);border-radius:2px;color:var(--ink);padding:12px 14px;font-size:16px;font-family:var(--latin)}
.type-panel small{display:block;color:var(--faint);font-size:11px;margin-top:7px}
.interstitial{max-width:780px;margin:0 auto;padding:74px 0 60px}
.interstitial .eyebrow{font-family:var(--latin)}
.section-title,.finish-heading{font-family:var(--serif);font-size:clamp(37px,5vw,54px);font-weight:600;letter-spacing:-.07em;line-height:1.45;margin:12px 0 19px}
.section-desc{font-size:13px;line-height:2;color:var(--muted);margin:0 0 36px}
.section-headline{font-size:13px;letter-spacing:.035em;font-weight:700;border-bottom:1px solid var(--ink);margin:37px 0 0;padding-bottom:15px}
.review-list{list-style:none;margin:0;padding:0}
.review-item{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid var(--rule);padding:21px 0}
.review-item strong{font-family:var(--serif);font-weight:600;font-size:18px;line-height:1.6}
.review-item p{font-family:var(--latin);font-size:16px;line-height:1.6;color:var(--muted);margin:7px 0 0}
.review-item small{font-size:11px;color:var(--faint);white-space:nowrap;margin-top:3px}
.empty{font-size:13px;color:var(--muted);padding:36px 0}
.standout-figures{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.figure{padding:28px 15px 23px 0;border-right:1px solid var(--rule)}
.figure:not(:first-child){padding-left:21px}.figure:last-child{border-right:0}
.figure strong{font-family:var(--latin);font-weight:600;font-size:41px;line-height:1.1;letter-spacing:-.07em;display:block}
.figure span{font-size:11px;color:var(--muted);display:block;margin-top:10px}
.track-row{display:grid;grid-template-columns:68px 1fr 65px;gap:15px;align-items:center;border-bottom:1px solid var(--rule);padding:20px 0}
.track-row b{font-size:12px;font-weight:650}.track-row small{font-family:var(--latin);font-size:12px;color:var(--muted);text-align:right}
.track{height:3px;background:var(--rule)}.track span{display:block;height:100%;background:var(--green)}
.finish-actions{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:37px}
.legal{font-size:12px;color:var(--faint);margin-top:27px;line-height:1.8}
.toast{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:3px;padding:12px 18px;box-shadow:0 12px 30px #0002;font-size:12px;z-index:80;pointer-events:none}
.toast[hidden]{display:none}
.mobile-nav{display:none}
@media(max-width:850px){
 .frame,.main{padding-left:25px;padding-right:25px}
 .site-head{height:69px}
 .wordmark{font-size:27px}.identity{gap:13px}.identity-caption{font-size:10px;letter-spacing:.07em}
 .top-nav{display:none}.top-date{font-size:9px}
 .home{grid-template-columns:1fr;padding-top:38px;gap:0}
 .eyebrow{font-size:9px}
 .home-title{font-size:clamp(38px,10vw,51px);margin-top:16px;margin-bottom:9px}
 .home-lead{font-size:12px;margin-bottom:25px}
 .begin{min-height:72px;padding:14px 21px}
 .lesson-head{margin-top:29px}
 .setting{padding:14px 0;grid-template-columns:79px 1fr;gap:5px}
 .setting-name{font-size:11px}
 .seg button{font-size:11px;padding:7px 9px;min-width:39px}
 .sidebar{padding-top:43px;margin:0 0 35px}
 .sidebar-stat{padding:15px 0}.sidebar-stat strong{font-size:28px}
 .side-note{margin-top:20px}
 .main{padding-bottom:110px}
 .mobile-nav{position:fixed;bottom:0;left:0;right:0;z-index:60;display:grid;grid-template-columns:repeat(3,1fr);height:calc(62px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#f6f4eeeF;border-top:1px solid var(--rule);backdrop-filter:blur(14px)}
 .mobile-nav button{position:relative;border:0;background:none;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.05em}
 .mobile-nav button[aria-current="page"]{font-weight:700;color:var(--deep)}
 .mobile-nav button[aria-current="page"]:before{content:"";height:2px;background:var(--accent);position:absolute;top:0;left:29%;right:29%}
 body[data-page="practice"] .mobile-nav,body[data-page="finish"] .mobile-nav{display:none}
 body[data-page="practice"] .main,body[data-page="finish"] .main{padding-bottom:0}
 .practice{min-height:calc(100svh - 69px);padding-top:14px}
 .exercise-content{padding:38px 0 12px}
 .exercise-meta{margin-bottom:26px}
 .sentence{font-size:clamp(33px,8.7vw,43px);line-height:1.78}
 .prompt-remark{margin-top:26px}
 .answer-section{margin-top:27px;padding-top:20px}
 .answer-en{font-size:clamp(25px,7vw,32px)}
 .exercise-foot{padding-top:12px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
 .primary,.secondary{min-height:61px}
 .interstitial{padding:45px 0 68px}
 .section-title,.finish-heading{font-size:36px}
}
@media(max-width:375px){
 .frame,.main{padding-left:18px;padding-right:18px}
 .top-date{display:none}.home-title{font-size:39px}
 .setting{grid-template-columns:70px 1fr}
 .seg button{padding:6px 7px;min-width:35px;font-size:10px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body data-page="home">
<div id="app">
<header class="site-head frame">
<button class="identity" data-nav="home" aria-label="ホームへ"><span class="wordmark">sayit<span class="point">.</span></span><span class="identity-caption">瞬間英作文</span></button>
<nav class="top-nav" aria-label="メニュー"><button class="nav-link" data-nav="home">練習</button><button class="nav-link" data-nav="weak">復習</button><button class="nav-link" data-nav="stats">記録</button></nav>
<span class="top-date">JAPANESE → ENGLISH</span>
</header>
<main class="main" id="view" aria-live="polite"></main>
<nav class="mobile-nav" aria-label="メニュー"><button data-nav="home">練習</button><button data-nav="weak">復習</button><button data-nav="stats">記録</button></nav>
<div id="toast" class="toast" hidden role="status"></div>
</div>
<script>
const BANK=[];
function add(level,topic,entries){for(const [jp,en,tip=''] of entries) BANK.push({id:BANK.length,level,topic,jp,en,tip})}
add('初級','be動詞',[
 ['私は学生です。','I am a student.'],['彼は今忙しいです。','He is busy now.'],['彼女は私の姉ではありません。','She is not my older sister.'],['あなたは疲れていますか？','Are you tired?'],['これは私の傘です。','This is my umbrella.'],['彼らは公園にいます。','They are in the park.'],['今日は寒くありません。','It is not cold today.'],['あなたのお父さんは先生ですか？','Is your father a teacher?'],['私のカバンは机の下にあります。','My bag is under the desk.'],['あれは誰の自転車ですか？','Whose bicycle is that?']]);
add('初級','一般動詞',[
 ['私は毎朝コーヒーを飲みます。','I drink coffee every morning.'],['彼女は週末にテニスをします。','She plays tennis on weekends.'],['私は魚が好きではありません。','I do not like fish.'],['あなたは英語を話しますか？','Do you speak English?'],['彼は毎日電車で通勤します。','He goes to work by train every day.'],['私の母は車を運転しません。','My mother does not drive.'],['あなたは何時に起きますか？','What time do you get up?'],['この店は夜9時に閉まります。','This store closes at nine p.m.'],['私はよく音楽を聴きます。','I often listen to music.'],['彼は犬を2匹飼っています。','He has two dogs.']]);
add('初級','過去形',[
 ['昨日は雨でした。','It was rainy yesterday.'],['私は昨夜テレビを見ました。','I watched TV last night.'],['彼女は昨日学校に来ませんでした。','She did not come to school yesterday.'],['あなたは昨日何を食べましたか？','What did you eat yesterday?'],['私たちは去年京都を訪れました。','We visited Kyoto last year.'],['彼はその本を先週買いました。','He bought that book last week.'],['私はその映画を見ませんでした。','I did not watch that movie.'],['子どもたちは公園で遊んでいました。','The children were playing in the park.'],['あなたはその時どこにいましたか？','Where were you then?'],['私は今朝6時に起きました。','I got up at six this morning.']]);
add('初級','未来・助動詞',[
 ['私は明日早く起きます。','I will get up early tomorrow.'],['彼女は来週ここに来る予定です。','She is going to come here next week.'],['窓を開けてもいいですか？','May I open the window?'],['私は泳ぐことができます。','I can swim.'],['彼は今日は来られません。','He cannot come today.'],['私たちは今すぐ出発しなければなりません。','We must leave now.'],['あなたはもっと水を飲むべきです。','You should drink more water.'],['明日は雨が降るでしょう。','It will rain tomorrow.'],['手伝いましょうか？','Shall I help you?'],['ここで写真を撮ってもいいですか？','Can I take pictures here?']]);
add('初級','疑問文・会話',[
 ['駅はどこですか？','Where is the station?'],['これはいくらですか？','How much is this?'],['今日は何曜日ですか？','What day is it today?'],['あなたの好きな食べ物は何ですか？','What is your favorite food?'],['もう一度言ってくれますか？','Could you say that again?'],['水を一杯ください。','Can I have a glass of water, please?'],['駅までどのくらいかかりますか？','How long does it take to get to the station?'],['この席は空いていますか？','Is this seat taken?'],['私は何をすればいいですか？','What should I do?'],['ここに座ってもいいですか？','Can I sit here?']]);
add('中級','現在完了',[
 ['私は一度も北海道に行ったことがありません。','I have never been to Hokkaido.'],['彼女はすでに宿題を終えています。','She has already finished her homework.'],['彼は3年間ここに住んでいます。','He has lived here for three years.'],['あなたはその映画を見たことがありますか？','Have you ever seen that movie?'],['私はまだ昼食を食べていません。','I have not had lunch yet.'],['私たちは2019年から知り合いです。','We have known each other since 2019.'],['彼はちょうど出かけたところです。','He has just left.'],['私はその鍵をなくしてしまいました。','I have lost the key.'],['彼女は最近とても忙しいです。','She has been very busy lately.'],['日本には何回来たことがありますか？','How many times have you been to Japan?']]);
add('中級','比較',[

 ['雨が降ったら家にいます。','If it rains, I will stay home.'],['時間があれば手伝えます。','If I have time, I can help you.'],['彼がいつ帰るか知っていますか？','Do you know when he will come back?'],['電車に間に合うように急ぎましょう。','Let us hurry so we can catch the train.'],['その件について後で連絡します。','I will get back to you about that later.'],['何か問題があれば教えてください。','Please let me know if there is a problem.'],['私は彼が正しいと思います。','I think he is right.'],['彼女が来るかどうか分かりません。','I do not know whether she will come.'],['彼は疲れていたので早く寝ました。','He went to bed early because he was tired.'],['もう少しゆっくり話してもらえますか？','Could you speak a little more slowly?']]);

add('上級','複文・関係詞',[
 ['彼が話していたことは理にかなっています。','What he was saying makes sense.'],['私が心配しているのは時間が足りないことです。','What worries me is that we do not have enough time.'],['彼女がなぜ怒っているのか見当もつきません。','I have no idea why she is upset.'],['この方法が必ずうまくいくとは限りません。','This method does not necessarily work every time.'],['彼が来るまで始めないほうがいいでしょう。','We had better not start until he arrives.'],['忙しいにもかかわらず、彼女は手伝ってくれました。','Although she was busy, she helped us.'],['結果がどうであれ、挑戦する価値はあります。','Whatever the outcome, it is worth trying.'],['私が思っていたのと全く違いました。','It was completely different from what I had expected.'],['彼女は私が頼んだとおりにしてくれました。','She did exactly what I asked her to do.'],['誰が担当するにしても、引き継ぎが必要です。','Whoever takes charge will need a handover.']]);
add('上級','ニュアンス',[
 ['彼はわざとそうしたわけではありません。','He did not do it on purpose.'],['それは必ずしも悪いことではありません。','That is not necessarily a bad thing.'],['やろうと思えば今日中に終わらせられます。','We could finish it today if we wanted to.'],['少なくとも、試してみる価値はあります。','At least it is worth a try.'],['彼がそのことを知っているとは思えません。','I doubt he knows about it.'],['その件についてはまだ何とも言えません。','It is too early to say anything definite about that.'],['今のところ予定どおり進んでいます。','So far, things are going according to plan.'],['私はむしろ別の方法を試したいです。','I would rather try a different approach.'],['彼女の説明はかなり説得力がありました。','Her explanation was quite convincing.'],['今さら変更するのは難しいでしょう。','It would be difficult to change it at this point.']]);


'use strict';
const KEY='sayit_progress_v1', CK='sayit_config_v2';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
let progress={total:0,correct:0,details:{},sessions:0};
try{progress=Object.assign(progress,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
if(!progress.details||typeof progress.details!=='object')progress.details={};
let cfg={level:'すべて',count:10,topic:'すべて',timer:5};
try{cfg=Object.assign(cfg,JSON.parse(localStorage.getItem(CK)||'{}'))}catch(e){}
let page='home',session=null,clockId=null,deadline=0,typed='',showInput=false;
const levels=['すべて','初級','中級','上級'];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(progress))}catch(e){}};
const saveCfg=()=>{try{localStorage.setItem(CK,JSON.stringify(cfg))}catch(e){}};
const weak=()=>BANK.filter(q=>progress.details[q.id]?.weak);
const pool=()=>BANK.filter(q=>(cfg.level==='すべて'||q.level===cfg.level)&&(cfg.topic==='すべて'||q.topic===cfg.topic));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pct=(n,d)=>d?Math.round(100*n/d):0;
const opts=(items,active,attr)=>'<div class="seg">'+items.map(v=>'<button type="button" data-'+attr+'="'+esc(v)+'" aria-pressed="'+(String(v)===String(active))+'">'+esc(v)+'</button>').join('')+'</div>';
const countLbl=n=>n==='全部'?'全問':n+'問';
const topics=()=>['すべて',...new Set(BANK.filter(q=>cfg.level==='すべて'||q.level===cfg.level).map(q=>q.topic))];
function notify(msg){const d=$('toast');d.textContent=msg;d.hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>{d.hidden=true},2200)}
function sync(){
 document.body.dataset.page=page;
 document.querySelectorAll('[data-nav]').forEach(el=>{el.setAttribute('aria-current',(el.dataset.nav===page||(page==='finish'&&el.dataset.nav==='home')||(page==='practice'&&el.dataset.nav==='home'))?'page':'false')});
}
function navigate(dest){stopClock();if(dest==='home')session=null;page=dest;render();window.scrollTo({top:0,left:0,behavior:'instant'})}
function home(){
 const p=pool(),available=cfg.count==='全部'?p.length:Math.min(p.length,Number(cfg.count));
 const rate=pct(progress.correct,progress.total);
 const topicOptions=topics().map(t=>'<option value="'+esc(t)+'" '+(t===cfg.topic?'selected':'')+'>'+esc(t)+'</option>').join('');
 $('view').innerHTML=
 '<div class="home">'+
 '<section class="home-primary">'+
 '<div class="eyebrow"><span class="rule"></span>SPEAKING PRACTICE / 01</div>'+
 '<h1 class="home-title">瞬間英作文</h1>'+
 '<p class="home-lead">日本語を見て、英語にする。<br>短い文を、声に出して繰り返す。</p>'+
 '<div class="lesson-head"><h2>練習内容</h2><small>全'+BANK.length+'文</small></div>'+
 '<div class="settings">'+
 '<div class="setting"><div class="setting-name">レベル</div>'+opts(levels,cfg.level,'level')+'</div>'+
 '<div class="setting"><label class="setting-name" for="topic">テーマ</label><div><span class="select-wrap"><select id="topic">'+topicOptions+'</select></span></div></div>'+
 '<div class="setting"><div class="setting-name">制限時間</div>'+opts(['なし','3秒','5秒','10秒'],cfg.timer?cfg.timer+'秒':'なし','timer')+'</div>'+
 '<div class="setting"><div class="setting-name">問題数</div>'+opts(['5','10','20','全部'],cfg.count==='全部'?'全部':String(cfg.count),'count')+'</div>'+
 '</div>'+
 '<button class="begin" data-action="start" '+(!available?'disabled':'')+'><span>練習を始める</span><span>'+available+'問　→</span></button>'+
 '<p class="hint-under">答えは声に出してから確認。採点は自己評価です。</p>'+
 '</section>'+
 '<aside class="sidebar"><div class="sidebar-label">これまでの記録</div>'+
 '<div class="sidebar-stat"><span>練習した文</span><strong>'+progress.total+'<em>文</em></strong></div>'+
 '<div class="sidebar-stat"><span>言えた割合</span><strong>'+rate+'<em>%</em></strong></div>'+
 '<div class="sidebar-stat"><span>復習する文</span><strong>'+weak().length+'<em>問</em></strong></div>'+
 '<p class="side-note">1回にたくさん進めるより、少しずつ続ける。<br>学習記録はこの端末に保存されます。</p>'+
 '<button class="side-link" data-nav="weak">苦手な文を復習する <span aria-hidden="true">→</span></button>'+
 '</aside></div>';
}
function stopClock(){if(clockId){clearInterval(clockId);clockId=null}}
function beginClock(){
 stopClock();
 if(!cfg.timer||!session||session.shown)return;
 deadline=Date.now()+cfg.timer*1000;
 clockId=setInterval(()=>{
   if(!session||session.shown){stopClock();return}
   const rem=Math.max(0,Math.ceil((deadline-Date.now())/1000));
   const target=$('remaining');
   if(target){target.textContent=String(rem).padStart(2,'0');target.parentElement.classList.toggle('expired',!rem)}
   if(!rem)stopClock()
 },90)
}
function start(onlyWeak){
 const list=onlyWeak?weak():pool();
 if(!list.length){notify(onlyWeak?'復習する問題はまだありません':'条件に合う問題がありません');return}
 const all=shuffle([...list]);const n=cfg.count==='全部'?all.length:Math.min(all.length,Number(cfg.count));
 session={items:all.slice(0,n),index:0,shown:false,good:0,miss:0,onlyWeak};
 page='practice';typed='';showInput=false;render();window.scrollTo(0,0)
}
function speakerSVG(){return '<svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zM16 9a5 5 0 0 1 0 6M19 6a9 9 0 0 1 0 12"/></svg>'}
function practice(){
 if(!session)return navigate('home');
 if(session.index>=session.items.length)return finish();
 const q=session.items[session.index],pos=session.index+1,n=session.items.length;
 $('view').innerHTML=
 '<section class="practice">'+
 '<div class="exercise-bar"><button class="exit" data-action="exit" aria-label="練習を終了">← 終了する</button><span class="counter"><b>'+String(pos).padStart(2,'0')+'</b> / '+String(n).padStart(2,'0')+'</span></div>'+
 '<div class="progress" role="progressbar" aria-label="練習の進捗" aria-valuemin="0" aria-valuemax="'+n+'" aria-valuenow="'+session.index+'"><div class="progress-fill" style="width:'+(session.index/n*100)+'%"></div></div>'+
 '<div class="exercise-content">'+
 '<div class="exercise-meta"><span>'+esc(q.level)+'　/　'+esc(q.topic)+'</span>'+(cfg.timer&&!session.shown?'<span class="timer" role="timer"><strong id="remaining">'+String(cfg.timer).padStart(2,'0')+'</strong> 秒</span>':'<span>日本語 → 英語</span>')+'</div>'+
 '<h1 class="sentence">'+esc(q.jp)+'</h1>'+
 (!session.shown?'<p class="prompt-remark">声に出して答えてください。</p>':'')+
 (session.shown?'<div class="answer-section"><div class="answer-label">解答例</div><div class="answer-en" lang="en">'+esc(q.en)+'</div>'+(q.tip?'<p class="answer-tip">'+esc(q.tip)+'</p>':'')+'<button class="sound" data-action="speak">'+speakerSVG()+'英文を聞く</button></div>':'')+
 (showInput?'<div class="type-panel"><label for="typed">英語を入力して確認（任意）</label><input id="typed" spellcheck="false" autocomplete="off" autocapitalize="sentences" placeholder="英文を入力…" value="'+esc(typed)+'" '+(session.shown?'readonly':'')+'><small>入力内容は自動採点されません。</small></div>':'')+
 '</div>'+
 '<div class="exercise-foot">'+(session.shown?
 '<div class="review-actions"><button class="secondary" data-action="miss">もう一度</button><button class="primary" data-action="got">言えた　→</button></div>':
 '<button class="primary" data-action="reveal">答えを見る　→</button>')+
 (!session.shown?'<button class="text-action" data-action="type">'+(showInput?'入力欄を閉じる':'英語を入力する')+'</button>':'')+
 '</div></section>';
 if(!session.shown)beginClock();
}
function reveal(){if(!session||session.shown)return;stopClock();session.shown=true;render()}
function grade(ok){
 if(!session||!session.shown)return;
 const q=session.items[session.index],d=progress.details[q.id]||{attempts:0,correct:0,weak:false};
 d.attempts++;
 if(ok){d.correct++;d.weak=false;progress.correct++;session.good++}
 else{d.weak=true;session.miss++}
 progress.details[q.id]=d;progress.total++;save();session.index++;session.shown=false;typed='';showInput=false;
 stopClock();
 if(session.index>=session.items.length){progress.sessions++;save();page='finish'}
 render();window.scrollTo(0,0)
}
function finish(){
 if(!session)return navigate('home');
 const n=session.good+session.miss;
 $('view').innerHTML='<section class="interstitial">'+
 '<div class="eyebrow"><span class="rule"></span>今日の練習</div>'+
 '<h1 class="finish-heading">'+n+'文、終わりました。</h1>'+
 '<p class="section-desc">言えなかった文は、あとから繰り返し練習できます。</p>'+
 '<div class="standout-figures">'+
 '<div class="figure"><strong>'+n+'</strong><span>練習した文</span></div>'+
 '<div class="figure"><strong>'+pct(session.good,n)+'%</strong><span>言えた割合</span></div>'+
 '<div class="figure"><strong>'+session.miss+'</strong><span>復習に追加</span></div></div>'+
 '<div class="finish-actions"><button type="button" class="secondary" data-nav="home">ホームへ</button><button type="button" class="primary" data-action="again">もう一度</button></div>'+
 '</section>';
}
function review(){
 const list=weak();
 $('view').innerHTML='<section class="interstitial">'+
 '<div class="eyebrow"><span class="rule"></span>復習</div>'+
 '<h1 class="section-title">言えなかった文</h1>'+
 '<p class="section-desc">「言えた」を選ぶと、復習リストから外れます。</p>'+
 '<button class="begin" data-action="weak-start" '+(!list.length?'disabled':'')+'><span>復習を始める</span><span>'+list.length+'問　→</span></button>'+
 '<h2 class="section-headline">復習リスト</h2>'+
 (list.length?'<ul class="review-list">'+list.map(q=>'<li class="review-item"><div><strong>'+esc(q.jp)+'</strong><p lang="en">'+esc(q.en)+'</p></div><small>'+esc(q.level)+'</small></li>').join('')+'</ul>':
 '<div class="empty">まだ復習する文はありません。</div>')+
 '</section>'
}
function stats(){
 const rate=pct(progress.correct,progress.total);
 $('view').innerHTML='<section class="interstitial">'+
 '<div class="eyebrow"><span class="rule"></span>学習記録</div>'+
 '<h1 class="section-title">積み重ねた練習</h1>'+
 '<p class="section-desc">この端末で取り組んだ記録です。</p>'+
 '<div class="standout-figures">'+
 '<div class="figure"><strong>'+progress.total+'</strong><span>練習した文</span></div>'+
 '<div class="figure"><strong>'+rate+'%</strong><span>言えた割合</span></div>'+
 '<div class="figure"><strong>'+weak().length+'</strong><span>苦手な文</span></div></div>'+
 '<h2 class="section-headline">レベル別の学習状況</h2>'+
 ['初級','中級','上級'].map(l=>{const a=BANK.filter(q=>q.level===l),done=a.filter(q=>progress.details[q.id]?.attempts>0).length;return '<div class="track-row"><b>'+l+'</b><div class="track"><span style="width:'+pct(done,a.length)+'%"></span></div><small>'+done+' / '+a.length+'</small></div>'}).join('')+
 '<p class="legal">答え方は一つとは限りません。解答例と比べて、自分で「言えた」を判定してください。</p></section>';
}
function speak(){
 if(!session||!('speechSynthesis' in window)){notify('この端末では音声を再生できません');return}
 try{
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(session.items[session.index].en);u.lang='en-US';u.rate=.9;
  const voices=speechSynthesis.getVoices();
  u.voice=voices.find(v=>/^en-US/i.test(v.lang)&&/premium|enhanced|natural/i.test(v.name))||voices.find(v=>/^en-US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))||null;
  speechSynthesis.speak(u)
 }catch(e){notify('音声を再生できませんでした')}
}
function render(){stopClock();sync();if(page==='home')home();else if(page==='practice')practice();else if(page==='weak')review();else if(page==='stats')stats();else if(page==='finish')finish();sync()}
document.addEventListener('click',e=>{
 const el=e.target.closest('button[data-action],button[data-nav],button[data-level],button[data-timer],button[data-count]');
 if(!el)return;
 if(el.dataset.nav){navigate(el.dataset.nav);return}
 if(el.dataset.level){cfg.level=el.dataset.level;cfg.topic='すべて';saveCfg();render();return}
 if(el.dataset.timer){cfg.timer=el.dataset.timer==='なし'?0:parseInt(el.dataset.timer,10);saveCfg();render();return}
 if(el.dataset.count){cfg.count=el.dataset.count==='全部'?'全部':parseInt(el.dataset.count,10);saveCfg();render();return}
 const a=el.dataset.action;
 if(a==='start')start(false);else if(a==='weak-start')start(true);
 else if(a==='exit'){if(session&&session.index>0){progress.sessions++;save()}navigate('home')}
 else if(a==='reveal')reveal();else if(a==='got')grade(true);else if(a==='miss')grade(false);
 else if(a==='again')start(session?.onlyWeak||false);
 else if(a==='speak')speak();
 else if(a==='type'){typed=$('typed')?.value||typed;showInput=!showInput;render();if(showInput)$('typed')?.focus()}
});
document.addEventListener('change',e=>{if(e.target.id==='topic'){cfg.topic=e.target.value;saveCfg();render()}});
document.addEventListener('input',e=>{if(e.target.id==='typed')typed=e.target.value});
document.addEventListener('keydown',e=>{
 if(page!=='practice'||!session||e.target.matches('input,select,button'))return;
 if(e.code==='Space'&&!session.shown){e.preventDefault();reveal()}
 if(session.shown&&e.key==='1')grade(false);
 if(session.shown&&e.key==='2')grade(true);
});
render();

</script>
</body></html>
