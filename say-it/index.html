function pool(){return BANK.filter(q=>(config.level==='すべて'||q.level===config.level)&&(config.topic==='すべて'||q.topic===config.topic))}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function statCard(title,num,unit){return `<div class="metric"><div class="metric-label">${title}</div><div class="metric-number">${num}<span class="metric-unit">${unit}</span></div></div>`}
function home(){const available=pool().length;const total=record.total,rate=total?Math.round(record.correct/total*100):0;
const levels=[['すべて','MIX','全レベル'],['初級','EASY','基本'],['中級','MID','実用'],['上級','HARD','発展']];const availableCount=config.count==='全部'?available:Math.min(config.count,available);
$('view').innerHTML=`<div class="view"><div class="home-layout"><div class="home-left"><div class="kicker"><span class="signal"></span>YOUR DAILY SPEAKING WORKOUT</div><h1 class="home-head">考える前に、<br><span>英語が出る。</span></h1><p class="lead">日本語を見て、すぐ英語で声に出す。<br>短い反復で、話す反射神経を鍛えよう。</p><div class="level-label">今日のレベル <span>${BANK.length}フレーズ収録</span></div><div class="level-grid">${levels.map(([v,en,jp])=>`<button class="level-btn" data-level="${v}" aria-pressed="${v===config.level}"><strong>${jp==='全レベル'?'ミックス':v}</strong><small>${en}</small></button>`).join('')}</div><div class="metrics">${statCard('累計チャレンジ',total,'文')}${statCard('できた率',rate,'%')}${statCard('苦手リスト',weak().length,'問')}</div><p class="footnote">記録はこの端末に保存されます。正解は自分で評価できます。</p></div><div class="home-right"><section class="sprint"><div class="sprint-top"><span>TODAY’S SPRINT</span><span class="round-icon">${arrow}</span></div><div class="sprint-center"><div><div class="sprint-big">${availableCount}</div><div class="sprint-unit">QUESTIONS<br>QUICK SESSION</div></div></div><div class="sprint-bottom"><div class="sprint-desc">${config.timer?config.timer+'秒で英作文':'時間無制限'} × ${availableCount}問<small>声に出して、答えをチェック</small></div><button id="start" class="round-play" aria-label="練習を始める" ${!available?'disabled':''}>${arrow}</button></div></section><div class="sprint-hint">${check}<span>登録不要 · すぐに練習スタート</span></div><details class="custom" id="settings"><summary>トレーニング設定 <span class="summary-right">${config.timer?config.timer+'秒':'時間なし'} · ${config.count==='全部'?'全問':config.count+'問'} <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></span></summary><div class="custom-fields"><div><div class="form-label">制限時間</div><div class="options">${[0,3,5,10].map(t=>`<button class="opt" data-timer="${t}" aria-pressed="${config.timer===t}">${t?t+'秒':'なし'}</button>`).join('')}</div></div><div><div class="form-label">問題数</div><div class="options">${[5,10,20,'全部'].map(c=>`<button class="opt" data-count="${c}" aria-pressed="${String(config.count)===String(c)}">${c==='全部'?'全問':c+'問'}</button>`).join('')}</div></div><div><label class="form-label" for="topic">文法・テーマで選ぶ</label><select id="topic" class="topic-select"><option value="すべて">全テーマからランダム</option>${[...new Set(BANK.filter(q=>config.level==='すべて'||q.level===config.level).map(q=>q.topic))].map(t=>`<option value="${esc(t)}" ${config.topic===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div></div></details></div></div></div>`;

}
function start(onlyWeak){const selected=onlyWeak?weak():pool();if(!selected.length){toast(onlyWeak?'苦手問題はまだありません':'この条件の問題はありません');return}const all=shuffle([...selected]);const n=config.count==='全部'?all.length:Math.min(config.count,all.length);session={items:all.slice(0,n),index:0,shown:false,good:0,miss:0,onlyWeak};page='practice';typingOpen=false;render();window.scrollTo({top:0,behavior:'instant'})}
function clearClock(){if(clockId){clearInterval(clockId);clockId=null}}
function beginClock(){clearClock();if(!session||session.shown||!config.timer)return;deadline=Date.now()+config.timer*1000;clockId=setInterval(tick,90);tick()}
function tick(){if(!session||session.shown){clearClock();return}const left=Math.max(0,(deadline-Date.now())/1000),text=$('clockText'),circ=$('clockCircle'),clock=$('clock');if(text)text.textContent=left?Math.ceil(left)+'s':'TIME';if(circ)circ.style.strokeDashoffset=String(68*(1-left/config.timer));if(clock)clock.classList.toggle('out',left===0);if(left===0)clearClock()}
function practice(){if(!session)return nav('home');if(session.index>=session.items.length)return finish();const q=session.items[session.index],index=session.index,total=session.items.length;
$('view').innerHTML=`<div class="view practice-shell ${session.shown?'answered':''}"><div class="practice-top"><button class="quiet-btn" id="exit" aria-label="練習を終える"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><span class="count-text"><b>${index+1}</b> / ${total}</span></div><div class="progress">${Array.from({length:total},(_,i)=>`<span class="${i<index?'done':i===index?'current':''}"></span>`).join('')}</div><section class="question-area"><div class="clock" id="clock" ${config.timer?'':'style="display:none"'}><svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="11"/><circle id="clockCircle" class="active" cx="14" cy="14" r="11"/></svg><span id="clockText">${config.timer}s</span></div><div class="question-top"><span class="tiny-line"></span>JAPANESE → ENGLISH<span class="tiny-line"></span></div><div class="q-topic">${esc(q.level)} · ${esc(q.topic)}</div><h1 class="question-jp">${esc(q.jp)}</h1><div class="question-hint">英語で<strong> 声に出して </strong>答えよう</div></section><div id="answerArea">${session.shown?answer(q):''}</div><div id="typingArea">${typingOpen?typing():''}</div><section class="action-zone" id="actionZone">${session.shown?gradeButtons():`<button class="big-cta" id="reveal">答えを見る ${arrow}</button>`}<div class="tiny-actions">${!session.shown?`<button id="typingToggle" class="tiny-link">${pencil}${typingOpen?'入力を閉じる':'英語を入力して練習'}</button>`:''}<button id="skip" class="tiny-link">${repeat} ${session.shown?'次へ進む（復習に追加）':'答えが出ない'}</button></div></section></div>`;
$('exit').onclick=()=>{if(session&&session.index>0){record.sessions++;save()}nav('home')};
const r=$('reveal');if(r)r.onclick=reveal;
const sk=$('skip');if(sk)sk.onclick=()=>{if(!session.shown)reveal();else grade(false)};
const toggle=$('typingToggle');if(toggle)toggle.onclick=()=>{typingOpen=!typingOpen;const previous=$('typingInput')?.value||'';$('typingArea').innerHTML=typingOpen?typing(previous):'';toggle.innerHTML=`${pencil}${typingOpen?'入力を閉じる':'英語を入力して練習'}`;bindTyping()};
bindTyping();bindGrade();if(!session.shown)beginClock();

function typing(old=''){return `<div class="typing"><label for="typingInput">英語を入力（任意）</label><input id="typingInput" value="${esc(old)}" placeholder="I think..." spellcheck="false" autocapitalize="sentences"><small>手入力は自動採点されません。解答例と見比べてください。</small></div>`}
function bindTyping(){if($('typingInput'))$('typingInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();reveal()}}}
function answer(q){return `<div class="answer-box"><div class="answer-label">${check} MODEL ANSWER</div><div class="answer-text">${esc(q.en)}</div>${q.tip?`<p class="answer-tip">${esc(q.tip)}</p>`:''}<button id="speak" class="audio-btn">${volume} 発音を聞く</button></div>`}
function gradeButtons(){return `<div class="grade-row"><button class="review-btn" id="miss">${repeat} あとで復習</button><button class="success-btn" id="got">${check} 言えた！</button></div>`}
function reveal(){if(!session||session.shown)return;session.shown=true;clearClock();document.querySelector('.practice-shell')?.classList.add('answered');$('answerArea').innerHTML=answer(session.items[session.index]);$('actionZone').innerHTML=gradeButtons()+`<div class="tiny-actions"><button id="skip" class="tiny-link">${repeat} 次へ進む（復習に追加）</button></div>`;if($('typingInput'))$('typingInput').readOnly=true;bindGrade();$('skip').onclick=()=>grade(false);$('answerArea').scrollIntoView({block:'nearest',behavior:'smooth'})}
function bindGrade(){if($('got'))$('got').onclick=()=>grade(true);if($('miss'))$('miss').onclick=()=>grade(false);if($('speak'))$('speak').onclick=()=>speak(session.items[session.index].en)}
function speak(str){if(!('speechSynthesis' in window)){toast('音声再生に対応していません');return}try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(str);u.lang='en-US';u.rate=.88;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase().startsWith('en-us')&&/premium|enhanced|natural/i.test(v.name))||voices.find(v=>v.lang.toLowerCase().startsWith('en-us'))||voices.find(v=>v.lang.toLowerCase().startsWith('en'))||null;speechSynthesis.speak(u)}catch(e){toast('音声が再生できませんでした')}}
function grade(ok){if(!session||!session.shown)return;const q=session.items[session.index],d=record.details[q.id]||{attempts:0,correct:0,weak:false};d.attempts++;if(ok){d.correct++;d.weak=false;session.good++;record.correct++}else{d.weak=true;session.miss++}record.details[q.id]=d;record.total++;save();session.index++;session.shown=false;typingOpen=false;clearClock();if(session.index>=session.items.length){record.sessions++;save();page='finish';finish()}else{practice();window.scrollTo({top:0,behavior:'instant'})}}
function finish(){clearClock();page='finish';const n=session.good+session.miss,pct=n?Math.round(session.good/n*100):0;$('view').innerHTML=`<div class="view finish-wrap"><div class="finish-hero"><div class="finish-icon">${check}</div><div class="kicker" style="justify-content:center">SESSION COMPLETE</div><h1>おつかれさま！</h1><p>今日も英語を口に出す練習ができました。<br>苦手な文は、あとから何度でも復習できます。</p><div class="finish-numbers"><div><strong>${n}</strong><small>練習した文</small></div><div><strong>${pct}%</strong><small>言えた率</small></div><div><strong>${session.miss}</strong><small>復習リストへ</small></div></div><div class="finish-choices"><button id="goHome" class="outline-cta">ホームへ</button><button id="again" class="big-cta">もう一度 ${arrow}</button></div></div></div>`;$('goHome').onclick=()=>nav('home');$('again').onclick=()=>start(session.onlyWeak);sync()}
function review(){const list=weak();$('view').innerHTML=`<section class="view section-page"><div class="page-kicker">REVIEW / RETRY</div><h1 class="page-title">苦手だけ、<br>もう一度。</h1><p class="page-lead">言えなかった文を集めています。「言えた！」を押すとリストから外れます。</p><div class="page-actions"><button id="startWeak" class="big-cta" ${!list.length?'disabled':''}>${list.length}問を復習 ${arrow}</button></div><div class="list-card">${list.length?list.map(q=>`<div class="weak-row"><div><div class="weak-jp">${esc(q.jp)}</div><div class="weak-en">${esc(q.en)}</div></div><span class="tag">${esc(q.level)}</span></div>`).join(''):'<div class="empty">苦手な問題はまだありません。<br>今日のトレーニングから始めよう。</div>'}</div></section>`;$('startWeak').onclick=()=>start(true)}
function stats(){const levels=['初級','中級','上級'];const pct=record.total?Math.round(record.correct/record.total*100):0;$('view').innerHTML=`<section class="view section-page"><div class="page-kicker">YOUR PROGRESS</div><h1 class="page-title">続けた分だけ、<br>話せるように。</h1><p class="page-lead">この端末での学習状況を表示しています。</p><div class="stats-main">${statCard('練習した文',record.total,'文')}${statCard('言えた率',pct,'%')}${statCard('苦手な文',weak().length,'問')}</div><div class="list-card">${levels.map(l=>{let list=BANK.filter(q=>q.level===l),seen=list.filter(q=>(record.details[q.id]?.attempts||0)>0).length,p=Math.round(seen/list.length*100);return `<div class="level-row"><span class="level-name">${l}</span><div class="level-track"><span style="width:${p}%"></span></div><span class="level-count">${seen} / ${list.length}</span></div>`}).join('')}</div><p class="footnote">全${BANK.length}問。答え方は一つとは限りません。解答例と比較して、自分で「言えた」を判定してください。</p></section>`}
function render(){sync();if(page==='home')home();else if(page==='practice')practice();else if(page==='weak')review();else if(page==='stats')stats();else if(page==='finish')finish();sync()}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>nav(b.dataset.nav));$('brand').onclick=()=>nav('home');document.addEventListener('keydown',e=>{if(!session||page!=='practice'||e.target.matches('input,select,button'))return;if(e.code==='Space'&&!session.shown){e.preventDefault();reveal()}else if(session.shown&&e.key==='1')grade(false);else if(session.shown&&e.key==='2')grade(true)});
render();
</script>
</body>
</html>
