<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123c40">
<meta name="description" content="QQEnglish公式R.E.M.S.教材をBook・Unit・ページから探して、この画面の中で読む個人向けビューア。">
<title>R.E.M.S. Reader | まなびBOX</title>
<style>
:root{--bg:#f3f5f1;--ink:#182d34;--muted:#64767a;--line:#dbe3de;--card:#fff;--accent:#117e79;--accent-ink:#0b5f5a;--dark:#123c40;--soft:#e3f3ee;--warn:#9a6a0c;--warn-bg:#fff6dc;--shadow:0 6px 24px rgba(15,54,56,.07)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
/* iPhoneのダブルタップ拡大を無効化（ピンチ拡大・スクロールは可能） */
html,body,*{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.5}
button,input,a,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #73cbc2;outline-offset:2px}
[hidden]{display:none!important}

/* header */
.top{background:var(--dark);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 14px}
.top-in{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{color:#b9e5dd;text-decoration:none;font-size:.82rem;white-space:nowrap}
.brand{font-weight:850;font-size:1.15rem;letter-spacing:-.02em}.brand span{color:#9fdccf}
.ver{font-size:.66rem;color:#8fc9bf}

.main{max-width:1180px;margin:auto;padding:12px 12px 56px;display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.pick{padding:14px}
.label{font-size:.7rem;font-weight:800;letter-spacing:.09em;color:var(--muted);margin:0 0 7px}
.chips{display:grid;gap:6px;margin-bottom:13px}
.chips.books{grid-template-columns:repeat(5,1fr)}
.chips.units{grid-template-columns:repeat(4,1fr)}
.chips.segs{grid-template-columns:1fr 1fr;margin-bottom:0}
.chip{border:1px solid var(--line);background:#fafcfa;border-radius:10px;padding:9px 4px;font-weight:800;font-size:.86rem;min-height:42px}
.chip[aria-pressed=true]{background:var(--dark);border-color:var(--dark);color:#fff}
.units .chip[aria-pressed=true]{background:var(--soft);border-color:#2ba79c;color:var(--accent-ink)}
.seg{text-align:left;padding:9px 11px;line-height:1.3}
.seg b{display:block;font-size:.84rem}.seg small{font-size:.72rem;color:var(--muted);font-weight:600}
.seg[aria-pressed=true]{background:#eef9f5;border-color:var(--accent);color:var(--ink);box-shadow:inset 3px 0 var(--accent)}
.seg .dot{float:right;font-size:.7rem;color:var(--accent)}
.toggle{display:flex;background:#eef2ef;border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:13px}
.toggle button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px;font-size:.84rem;font-weight:750;color:#5e7171}
.toggle button[aria-pressed=true]{background:#fff;color:var(--dark);box-shadow:0 1px 6px #0001}

/* reader */
.reader{overflow:hidden;min-width:0;grid-column:2;grid-row:1/span 3}.pick{grid-column:1;grid-row:1}.side{grid-column:1;grid-row:2}
.bar{display:flex;align-items:center;gap:6px;padding:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.title{flex:1 1 100%;display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:2px}
.title h1{font-size:1.02rem;margin:0;letter-spacing:-.01em}
.title span{font-size:.76rem;color:var(--muted);white-space:nowrap}
.nav{border:1px solid var(--line);background:#fff;border-radius:10px;min-height:42px;padding:0 13px;font-weight:800}
.nav:disabled{opacity:.35;cursor:default}
.pageno{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:#f6f8f6;border-radius:10px;padding:0 4px 0 8px;min-height:42px}
.pageno input{width:52px;border:0;background:transparent;text-align:center;font-weight:800;font-size:1rem;outline:0}
.pageno span{font-size:.78rem;color:var(--muted)}
.star{margin-left:auto}.star[aria-pressed=true]{background:var(--warn-bg);border-color:#e3c169;color:var(--warn)}
.meter{height:4px;background:#edf1ed}.meter i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}

.view{position:relative;background:#e9eeeb;min-height:60vh}
.msg{padding:44px 20px;text-align:center;color:#4f6966}
.msg h2{font-size:1rem;margin:10px 0 6px;color:var(--ink)}
.msg p{font-size:.84rem;margin:0 auto;max-width:420px;line-height:1.7}
.spin{width:30px;height:30px;border:3px solid #cfe2dc;border-top-color:var(--accent);border-radius:50%;margin:auto;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
#pages{padding:8px}
#canvas{display:block;margin:auto;background:#fff;box-shadow:0 1px 8px #0002;max-width:100%;height:auto}
#imgwrap{padding:8px}#pageimg{display:block;margin:auto;max-width:100%;height:auto;background:#fff;box-shadow:0 1px 8px #0002;min-height:300px;transition:opacity .15s}#pageimg.loading{opacity:.35}
#frame{display:block;width:100%;height:min(78vh,1050px);border:0;background:#fff}
.hint{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(18,60,64,.92);color:#fff;font-size:.76rem;padding:7px 10px;border-radius:9px;text-align:center;pointer-events:none}

.foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px;border-top:1px solid var(--line);background:#fbfcfb}
.mode{font-size:.74rem;color:var(--muted);flex:1 1 100%;margin-bottom:2px}
.mode b{color:var(--accent-ink)}
.act{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;font-size:.8rem;font-weight:750;text-decoration:none;cursor:pointer;white-space:nowrap}
.act.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}

.side{display:grid;gap:14px}
.box{padding:13px}
.box h3{font-size:.84rem;margin:0 0 8px}
.list{display:flex;flex-wrap:wrap;gap:6px}
.list button{border:1px solid var(--line);background:#f7f9f7;border-radius:9px;padding:6px 10px;font-size:.8rem;font-weight:700}
.list .x{border:0;background:transparent;color:#a05b4f;padding:6px 4px}
.empty{font-size:.78rem;color:var(--muted)}
.note{font-size:.72rem;color:var(--muted);line-height:1.6;margin:0}
footer{grid-column:1/-1;grid-row:4;text-align:center;color:var(--muted);font-size:.72rem;padding:14px 8px}
footer a{color:inherit}

@media(max-width:820px){
 .main{grid-template-columns:1fr;padding:10px 8px 48px;gap:10px}
 .reader,.pick,.side,footer{grid-column:1;grid-row:auto}.reader{order:1}.pick{order:2}.side{order:3}footer{order:4}
 .pick{padding:12px}
 .view{min-height:50vh}
 #frame{height:72vh}
}

/* ===== 大きく表示（全画面・向き自動） ===== */
.fs-open{border:2px solid var(--line);background:#fff;border-radius:12px;min-height:42px;padding:0 12px;font-weight:800;font-size:.86rem;white-space:nowrap}
.fs-ui{display:none}
body.noscroll{overflow:hidden}
#view.full{position:fixed;z-index:60;left:0;top:0;width:100vw;height:100vh;min-height:0;margin:0;background:#1b1a20;display:flex;align-items:center;justify-content:center;overflow:hidden}
#view.full .fs-ui{display:block}
#view.full.scrolly{overflow-y:auto;align-items:flex-start;-webkit-overflow-scrolling:touch}#view.full.scrolly>#pages,#view.full.scrolly>#imgwrap{height:auto;min-height:100%;align-items:flex-start}#view.full.scrolly .fs-ui>*{position:fixed}
#view.full>#pages,#view.full>#imgwrap{padding:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#view.full #canvas,#view.full #pageimg{box-shadow:none;border-radius:0;max-width:none;max-height:none;min-height:0;margin:0}
#view.full #frame{height:100%}
#view.full .msg{color:#ddd}#view.full .msg h2,#view.full .msg h3{color:#fff}
#view.full .hint{display:none}
.fs-close,.fs-pg,.fs-nav{position:absolute;z-index:3;border:0;color:#fff;background:rgba(0,0,0,.55);font-weight:800}
.fs-close{top:max(10px,env(safe-area-inset-top));left:10px;border-radius:12px;padding:9px 13px;font-size:.9rem}
.fs-pg{top:max(12px,env(safe-area-inset-top));right:12px;border-radius:10px;padding:6px 10px;font-size:.85rem;pointer-events:none}
.fs-nav{bottom:max(14px,env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;font-size:1.3rem;opacity:.8}
.fs-auto{position:absolute;z-index:3;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);border:0;border-radius:12px;padding:9px 12px;font-size:.78rem;font-weight:800;color:#fff;background:rgba(0,0,0,.55);white-space:nowrap}.fs-auto[aria-pressed=false]{opacity:.6}
.fs-nav.l{left:12px}.fs-nav.r{right:12px}
.fs-nav:disabled{opacity:.25}
</style>
</head>
<body>
<header class="top"><div class="top-in">
 <a class="back" href="../">← まなびBOX</a>
 <div class="brand">R.E.M.S. <span>Reader</span></div>
 <span class="ver">v3.2</span>
</div></header>

<main class="main">
 <section class="card reader" aria-label="教材を読む">
  <div class="bar">
   <div class="title"><h1 id="title">Book 1 · Unit A</h1><span id="sub">Lesson 11–14</span></div>
   <button class="nav" id="prev" type="button" aria-label="前のページ">←</button>
   <label class="pageno"><input id="page" type="number" inputmode="numeric" min="1" aria-label="ページ番号"><span id="total">/ 258</span></label>
   <button class="nav" id="next" type="button" aria-label="次のページ">→</button>
   <button class="fs-open" id="fs-open" type="button">⛶ 大きく</button><button class="ra-btn" id="ra-open" type="button">🔊 音読</button>
   <button class="nav star" id="star" type="button" aria-pressed="false">☆</button>
  </div>
  <div class="meter"><i id="meter"></i></div>
  <div class="view" id="view">
   <div class="fs-ui"><button class="fs-close" id="fs-close" type="button">✕ もどる</button><button class="fs-auto" id="fs-auto" type="button" aria-pressed="true">自動で大きく: ON</button><span class="fs-pg" id="fs-pg"></span><button class="fs-nav l" id="fs-prev" type="button" aria-label="前のページ">◀</button><button class="fs-nav r" id="fs-next" type="button" aria-label="次のページ">▶</button><button class="fs-ra" id="fs-ra" type="button">🔊 音読</button></div>

   <div class="msg" id="msg"><div class="spin"></div><h2 id="msg-h">読み込み中…</h2><p id="msg-p"></p></div>
   <div id="pages" hidden><canvas id="canvas" aria-label="教材ページ"></canvas></div>
   <div id="imgwrap" hidden><img id="pageimg" alt="教材ページ" decoding="async"></div>
   <iframe id="frame" title="QQEnglish R.E.M.S. 教材" hidden></iframe>
   <div class="hint" id="hint" hidden></div>
  </div>
  <div class="foot">
   <div class="mode" id="mode">　</div>
   <button class="act" id="reload" type="button">再読み込み</button>
   <button class="act" id="save" type="button">↓ PDFを保存</button>
   <label class="act" for="file">端末のPDFを読込</label><input type="file" id="file" accept=".pdf,application/pdf">
   <a class="act" id="official" target="_blank" rel="noopener noreferrer">公式PDF ↗</a>
  </div>
 </section>

 <aside class="card pick" aria-label="教材を選ぶ">
  <p class="label">BOOK</p><div class="chips books" id="books"></div>
  <p class="label">UNIT</p><div class="chips units" id="units"></div>
  <div class="toggle" role="group" aria-label="解答"><button type="button" id="q" aria-pressed="true">問題のみ</button><button type="button" id="a" aria-pressed="false">解答付き</button></div>
  <p class="label">LESSON</p><div class="chips segs" id="segs"></div>
 </aside>

 <div class="side">
  <section class="card box"><h3>最近読んだレッスン</h3><div class="list" id="recent"></div></section>
  <section class="card box"><h3>しおり</h3><div class="list" id="marks"></div></section>
  <section class="card box"><h3>自分専用サーバー（Cloudflare）</h3>
   <p class="note" id="worker-state">未設定</p>
   <div class="list" style="margin-top:8px"><a class="act" href="setup.html">設定する</a><button class="act" id="worker-test" type="button" hidden>接続テスト</button></div></section>
  <section class="card box"><h3>端末に保存済みの教材 <span class="empty" id="lib-n"></span></h3><div class="list" id="lib"></div>
   <p class="note" style="margin-top:8px">保存済みの教材は通信なしで、ページ単位ですぐに表示されます。</p></section>
  <p class="note">教材の著作権はQQEnglishに帰属します。このアプリは公式PDFを表示するだけで、PDFを再配布していません。</p>
 </div>
 <footer>非公式の個人用ビューア · 出典 <a href="https://www.qqeng.com/blog2/r-e-m-s-textbooks/" target="_blank" rel="noopener noreferrer">QQEnglish R.E.M.S. Textbooks</a></footer>
</main>

<script src="../shared/read-aloud.js"></script>
<script>
"use strict";
/* ===== 教材データ ===== */
const SPEC={
 A:"1-5:1-78|6-10:79-176|11-14:177-258",
 B:"1-5:1-84|6-10:85-182|11-12:183-224",
 C:"1-5:1-98|6-10:99-210|11-13:211-266",
 D:"1-5:1-75|6-10:76-170|11-15:171-262|16-20:263-335|21-23:336-403",
 E:"1-5:1-85|6-10:86-193|11-16:194-306",
 F:"1-5:1-84|6-10:85-168|11-12:169-211",
 G:"1-5:1-86|6-10:87-195|11-15:196-283",
 H:"1-5:1-82|6-10:83-177|11-16:178-290",
 I:"1-5:1-88|6-10:89-205|11-16:206-316",
 J:"1-5:1-73|6-10:74-170|11-15:171-266|16-18:267-316",
 K:"1-5:1-68|6-10:69-156|11-15:157-244|16-20:245-324|21-26:325-438",
 L:"1-5:1-79|6-10:80-178|11-15:179-283|16-18:284-338",
 M:"1-5:1-76|6-10:77-186|11-15:187-305",
 N:"1-5:1-83|6-10:84-185|11-14:186-264",
 O:"1-5:1-75|6-10:76-168|11-15:169-270|16-18:271-327",
 P:"1-5:1-80|6-10:81-176|11-15:177-273|16-20:274-342|21-25:343-438|26-30:439-539|31-33:540-590",
 Q:"1-5:1-78|6-10:79-173|11-15:174-283",
 R:"1-5:1-84|6-10:85-180|11-15:181-291",
 S:"1-5:1-82|6-10:83-177|11-14:178-263",
 T:"1-5:1-72|6-10:73-164|11-15:165-254"
};
const BOOKS=["ABCD","EFGH","IJKL","MNOP","QRST"];
const ROOT="https://www.qqeng.com/blog2/wordpress/wp-content/uploads/2024/01/";
const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
/* 公式サイトは他サイトからのPDF読込を許可していないため、公開中継で取得を試みる */
const RELAYS=[
 u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),
 u=>"https://api.codetabs.com/v1/proxy?quest="+u,
 u=>"https://corsproxy.io/?url="+encodeURIComponent(u),
 u=>"https://api.cors.lol/?url="+encodeURIComponent(u)
];
const IOS=/iP(hone|od|ad)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);

const $=id=>document.getElementById(id);
const segsCache={};
const segs=u=>segsCache[u]||(segsCache[u]=SPEC[u].split("|").map(v=>{const[l,p]=v.split(":");const[ls,le]=l.split("-").map(Number);const[start,end]=p.split("-").map(Number);return{ls,le,start,end};}));
const maxPage=u=>segs(u).at(-1).end;
const bookOf=u=>BOOKS.findIndex(b=>b.includes(u))+1;
const segOf=(u,p)=>segs(u).find(s=>p>=s.start&&p<=s.end)||segs(u)[0];
const pad=n=>String(n).padStart(2,"0");
const lessonName=s=>"Lesson "+pad(s.ls)+"–"+pad(s.le);
const pdfUrl=(u,s,ans)=>ROOT+"REMS_Book"+bookOf(u)+"_"+u+s.ls+"-"+u+s.le+"_pp"+s.start+"-"+s.end+(ans?"_answer":"")+".pdf";
const docKey=(u,s,ans)=>"rems-"+u+"-"+s.ls+"-"+s.le+"-"+(ans?"answers":"questions");
const validUnit=u=>typeof u==="string"&&Object.hasOwn(SPEC,u);
const clampPage=(u,p)=>Math.max(1,Math.min(maxPage(u),Math.floor(Number(p))||1));

/* ===== 設定・履歴（localStorage） ===== */
const KEY="rems-reader-v3";
let store={last:{unit:"A",page:1,ans:false},byUnit:{},recent:[],marks:[]};
try{
 const s=JSON.parse(localStorage.getItem(KEY)||"null");
 if(s&&typeof s==="object")store={...store,...s};
 else{const old=JSON.parse(localStorage.getItem("rems-reader-state-v1")||"null");
  if(old?.last)store.last={unit:old.last.unit,page:old.last.page,ans:!!old.last.answers};
  if(Array.isArray(old?.bookmarks))store.marks=old.bookmarks;
  if(old?.byUnit)store.byUnit=old.byUnit;}
}catch(e){}
for(const k of["recent","marks"])if(!Array.isArray(store[k]))store[k]=[];
store.recent=store.recent.filter(x=>validUnit(x?.unit));store.marks=store.marks.filter(x=>validUnit(x?.unit));
if(!store.byUnit||typeof store.byUnit!=="object")store.byUnit={};
store.worker=typeof store.worker==="string"&&/^https:\/\/[^\s"<>]+$/.test(store.worker)?store.worker.replace(/\/+$/,""):"";
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}};

let state={unit:validUnit(store.last?.unit)?store.last.unit:"A",page:1,ans:!!store.last?.ans};
state.page=clampPage(state.unit,store.last?.page);
const fromHash=()=>{const m=decodeURIComponent(location.hash.slice(1)).match(/^([A-T])\/(\d+)(?:\/([01]))?$/);return m?{unit:m[1],page:clampPage(m[1],m[2]),ans:m[3]==="1"}:null;};
state=fromHash()||state;

/* ===== 端末内PDF保存（IndexedDB。旧版と同じDB・キー） ===== */
let dbp=null;
function db(){return dbp||(dbp=new Promise((ok,ng)=>{if(!("indexedDB"in window))return ng(Error("no idb"));const r=indexedDB.open("rems-reader-pdfs",1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("files"))r.result.createObjectStore("files");};r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error);}));}
async function idb(mode,fn){const d=await db();return new Promise((ok,ng)=>{const t=d.transaction("files",mode);const q=fn(t.objectStore("files"));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>ng(t.error);});}
const dbGet=k=>idb("readonly",s=>s.get(k)).catch(()=>null);
const dbPut=(k,v)=>idb("readwrite",s=>s.put(v,k));
const dbDel=k=>idb("readwrite",s=>s.delete(k));
const dbKeys=()=>idb("readonly",s=>s.getAllKeys()).catch(()=>[]);
const toBuffer=u8=>u8.buffer.slice(u8.byteOffset,u8.byteOffset+u8.byteLength);

/* ===== PDF.js ===== */
let pdfjsP=null;
function pdfjs(){return pdfjsP||(pdfjsP=new Promise((ok,ng)=>{const s=document.createElement("script");s.src=PDFJS+"pdf.min.js";s.onload=()=>{if(!window.pdfjsLib)return ng(Error("PDF.js"));pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js";ok(pdfjsLib);};s.onerror=()=>{pdfjsP=null;ng(Error("PDF表示エンジンを読み込めません"));};document.head.append(s);}));}
const docs=new Map(); /* key -> PDFDocumentProxy（直近2件） */
function keepDoc(key,doc){docs.delete(key);docs.set(key,doc);while(docs.size>2){const[k,d]=docs.entries().next().value;docs.delete(k);d.destroy();}}
async function docFromData(key,buf){const lib=await pdfjs();const d=await lib.getDocument({data:new Uint8Array(buf)}).promise;keepDoc(key,d);return d;}

/* ===== 中継取得（並列・15秒で打ち切り） ===== */
let directBlocked=false,relayDownAt=0;const relayDown=()=>Date.now()-relayDownAt<60000;const relayLog=[];const relayBusy=new Map();
function fetchRelay(url,onProgress){
 relayLog.length=0;
 const one=async make=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);
  try{const r=await fetch(make(url),{signal:c.signal});if(!r.ok)throw Error("HTTP "+r.status);
   const total=+r.headers.get("content-length")||0;let got=0;const parts=[];const rd=r.body.getReader();
   for(;;){const{done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;onProgress?.(got,total);}
   const b=new Uint8Array(got);let o=0;for(const p of parts){b.set(p,o);o+=p.length;}
   if(String.fromCharCode(...b.subarray(0,5))!=="%PDF-")throw Error("PDF以外の応答");return b;}
  catch(e){relayLog.push(new URL(make(url)).hostname.replace(/^api\./,"")+": "+(e.name==="AbortError"?"時間切れ":e.message));throw e;}
  finally{clearTimeout(t);}};
 return Promise.any(RELAYS.map(one)).catch(()=>{throw Error("取得できませんでした");});
}
/* 自分専用サーバー（Cloudflare Worker） */
let workerError="";
async function fetchStream(u,onProgress){
 const c=new AbortController(),t=setTimeout(()=>c.abort(),60000);
 try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw Error("HTTP "+r.status);
  const total=+r.headers.get("content-length")||0;let got=0;const parts=[];const rd=r.body.getReader();
  for(;;){const{done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;onProgress?.(got,total);}
  const b=new Uint8Array(got);let o=0;for(const x of parts){b.set(x,o);o+=x.length;}
  if(String.fromCharCode(...b.subarray(0,5))!=="%PDF-")throw Error("PDF以外の応答");return b;}
 catch(e){throw e.name==="AbortError"?Error("時間切れ"):e;}finally{clearTimeout(t);}
}
function renderWorker(){
 const el=$("worker-state");if(!el)return;$("worker-test").hidden=!store.worker;
 el.innerHTML=store.worker?(workerError?"⚠️ 接続できません："+workerError.replace(/[<>&]/g,""):"✓ 使用中")+"<br><span style=\"word-break:break-all\">"+store.worker.replace(/[<>&"]/g,"")+"</span>":"未設定（設定すると全教材がページ単位でくっきり表示・保存されます）";
}
/* 公式PDFを取得（自分専用サーバー→直接→公開中継）。成功したら端末に保存 */
function download(key,url,onProgress){
 if(relayBusy.has(key))return relayBusy.get(key);
 const p=(async()=>{
  if(store.worker){try{const b=await fetchStream(store.worker+"?url="+encodeURIComponent(url),onProgress);await dbPut(key,toBuffer(b)).catch(()=>{});renderLib();return b;}catch(e){workerError=String(e.message||e);renderWorker();}}
  if(!directBlocked){try{const r=await fetch(url);if(!r.ok)throw Error("HTTP "+r.status);const b=new Uint8Array(await r.arrayBuffer());await dbPut(key,toBuffer(b)).catch(()=>{});return b;}catch(e){directBlocked=true;}}
  if(relayDown()&&!onProgress)throw Error("中継停止中");
  try{const b=await fetchRelay(url,onProgress);relayDownAt=0;await dbPut(key,toBuffer(b)).catch(()=>{});renderLib();return b;}
  catch(e){relayDownAt=Date.now();throw e;}
 })().finally(()=>relayBusy.delete(key));
 relayBusy.set(key,p);return p;
}

/* ===== 表示 ===== */
let token=0,current={key:"",mode:""},renderTask=null,gTimer=0,gTries=0,useNative=!IOS;
function view(which){$("imgwrap").hidden=which!=="img";$("msg").hidden=which!=="msg";$("pages").hidden=which!=="pages";$("frame").hidden=which!=="frame";if(which!=="frame")$("hint").hidden=true;}
function message(h,p,spin=true){if(full)layoutFull(1,1.414);$("msg-h").textContent=h;$("msg-p").textContent=p||"";$("msg").querySelector(".spin").hidden=!spin;view("msg");}
function setMode(html){$("mode").innerHTML=html;}

async function show(){
 const t=++token,u=state.unit,s=segOf(u,state.page),key=docKey(u,s,state.ans),url=pdfUrl(u,s,state.ans),offset=state.page-s.start+1;
 $("official").href=url+"#page="+offset;
 /* 1) 読み込み済み */
 let doc=docs.get(key);
 /* 2) 端末に保存済み */
 if(!doc){
  if(current.key!==key)message("読み込み中…","");
  const buf=await dbGet(key);if(t!==token)return;
  if(buf){try{doc=await docFromData(key,buf);}catch(e){await dbDel(key).catch(()=>{});}if(t!==token)return;}
 }
 if(doc){current={key,mode:"pdf"};setMode("<b>端末に保存済み</b> · スワイプでもページ移動できます");return drawPage(doc,offset,t);}
 /* 3) 未保存：すぐに埋め込み表示し、裏で取得して保存できたら切替 */
 if(store.worker&&!workerError){
  message("教材を取得中…","初回のみ。取得した教材は端末に保存され、次回からすぐ開きます。");
  try{const b=await download(key,url,(g,tt)=>{if(t===token)$("msg-p").textContent="ダウンロード中… "+(tt?Math.round(g/tt*100)+"%":(g/1048576).toFixed(1)+" MB");});
   if(t!==token)return;await docFromData(key,toBuffer(b));if(t===token)show();return;}
  catch(e){if(t!==token)return;}
 }
 if(!imgBad.has(url))showImage(key,url,offset,s.end-s.start+1);else showFrame(key,url,offset);
 download(key,url).then(async b=>{if(t!==token&&current.key!==key)return;try{await docFromData(key,toBuffer(b));}catch(e){return;}if(current.key===key)show();}).catch(()=>{});
}
/* 画像表示：wsrv.nl がPDFの指定ページを画像に変換（ページ送り可能・ブラウザがキャッシュ） */
const imgBad=new Set();
function imgUrl(url,n){const w=Math.min(1600,Math.ceil(Math.max(320,full?Math.max(screenWH().w,screenWH().h):$("view").clientWidth-16)*Math.min(window.devicePixelRatio||1,2)/200)*200);return "https://wsrv.nl/?url="+encodeURIComponent(url)+"&page="+(n-1)+"&w="+w+"&output=webp&q=85";}
function showImage(key,url,offset,total){
 const im=$("pageimg"),src=imgUrl(url,offset);current={key,mode:"img",url};view("img");$("reload").textContent="再読み込み";
 setMode("<b>画像表示</b> · スワイプでもページ移動できます");
 if(im.dataset.src!==src){im.classList.add("loading");im.dataset.src=src;im.src=src;}
 if(offset<total)new Image().src=imgUrl(url,offset+1); /* 次ページを先読み */
}
$("pageimg").addEventListener("load",()=>{$("pageimg").classList.remove("loading");sizeImg();if(window.ReadAloud)ReadAloud.pageChanged();});
$("pageimg").addEventListener("error",()=>{const im=$("pageimg");if(!im.dataset.src)return;im.classList.remove("loading");if(current.mode==="img"){imgBad.add(current.url);im.dataset.src="";show();}});
function showFrameFull(){if(full)layoutFull(1,1);}
function showFrame(key,url,offset){
 const src=useNative?url+"#page="+offset+"&view=FitH":"https://docs.google.com/gview?embedded=true&url="+encodeURIComponent(url);
 const f=$("frame");
 if(f.dataset.src!==src){if(useNative||f.dataset.base!==url){f.dataset.base=url;gTries=0;loadFrame(src);}else f.dataset.src=src;}
 current={key,mode:"frame"};view("frame");showFrameFull();if(window.ReadAloud)ReadAloud.pageChanged();
 const h=$("hint");if(!useNative){h.textContent="PDF内 "+offset+" ページ目を表示してください";h.hidden=false;clearTimeout(h._t);h._t=setTimeout(()=>{h.hidden=true;},4000);}
 setMode(useNative?"<b>ブラウザ表示</b> · 白い場合は「Google表示」に切替":"<b>Google表示</b> · 裏で取得でき次第、ページ単位の表示に切替わります");
 $("reload").textContent=useNative?"Google表示に切替":"再読み込み";
}
function loadFrame(src){const f=$("frame");f.dataset.src=src;f.src=src;clearTimeout(gTimer);if(!useNative&&gTries<3)gTimer=setTimeout(()=>{gTries++;loadFrame(src);},10000);}
$("frame").addEventListener("load",()=>clearTimeout(gTimer));

async function drawPage(doc,offset,t){
 view("pages");$("reload").textContent="再読み込み";
 const n=Math.min(Math.max(offset,1),doc.numPages);
 try{
  const pg=await doc.getPage(n);if(t!==token)return;
  const base=pg.getViewport({scale:1}),scale=fitScale(base.width,base.height),vp=pg.getViewport({scale});
  const dpr=Math.min(window.devicePixelRatio||1,3),c=$("canvas"),ctx=c.getContext("2d");
  renderTask?.cancel();
  c.width=Math.floor(vp.width*dpr);c.height=Math.floor(vp.height*dpr);c.style.width=vp.width+"px";c.style.height=vp.height+"px";
  renderTask=pg.render({canvasContext:ctx,viewport:vp,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null});
  await renderTask.promise;renderTask=null;if(window.ReadAloud)ReadAloud.pageChanged();
  if(n<doc.numPages)doc.getPage(n+1).catch(()=>{}); /* 次ページを先読み */
 }catch(e){if(e?.name!=="RenderingCancelledException"&&t===token)message("ページを表示できませんでした",String(e.message||e),false);}
}

/* ===== 画面更新 ===== */
function chip(cls,html,pressed,onClick,label){const b=document.createElement("button");b.type="button";b.className=cls;b.innerHTML=html;b.setAttribute("aria-pressed",String(pressed));if(label)b.setAttribute("aria-label",label);b.onclick=onClick;return b;}
let cachedKeys=new Set();
function render(){
 const u=state.unit,b=bookOf(u),s=segOf(u,state.page),offset=state.page-s.start+1;
 $("books").replaceChildren(...BOOKS.map((v,i)=>chip("chip","B"+(i+1),i+1===b,()=>go(v[0],store.byUnit[v[0]]||1),"Book "+(i+1))));
 $("units").replaceChildren(...BOOKS[b-1].split("").map(x=>chip("chip",x,x===u,()=>go(x,store.byUnit[x]||1),"Unit "+x)));
 $("segs").replaceChildren(...segs(u).map(x=>chip("chip seg",(cachedKeys.has(docKey(u,x,state.ans))?'<span class="dot">● 保存済</span>':"")+"<b>"+lessonName(x)+"</b><small>pp. "+x.start+"–"+x.end+"</small>",x===s,()=>{go(u,x.start);autoBig();})));
 $("q").setAttribute("aria-pressed",String(!state.ans));$("a").setAttribute("aria-pressed",String(state.ans));
 $("title").textContent="Book "+b+" · Unit "+u+(state.ans?" · 解答付き":"");
 $("sub").textContent=lessonName(s)+" · PDF "+offset+"/"+(s.end-s.start+1);
 $("page").value=state.page;$("page").max=maxPage(u);$("total").textContent="/ "+maxPage(u);
 $("meter").style.width=(state.page/maxPage(u)*100)+"%";
 if(typeof fsSync==="function")setTimeout(fsSync,0);
 $("prev").disabled=state.page<=1;$("next").disabled=state.page>=maxPage(u);
 const marked=store.marks.some(m=>m.unit===u&&m.page===state.page);$("star").textContent=marked?"★":"☆";$("star").setAttribute("aria-pressed",String(marked));$("star").setAttribute("aria-label",marked?"しおりを外す":"しおりを付ける");
 list("recent",store.recent,x=>{const sg=segOf(x.unit,x.page);return x.unit+" · "+lessonName(sg).replace("Lesson ","L")+" · p."+x.page;},"まだありません");
 list("marks",store.marks,x=>"★ "+x.unit+" · p."+x.page,"☆ でページを登録",true);
 show();
}
function list(id,items,label,empty,removable){
 const el=$(id);el.replaceChildren();
 if(!items.length){const e=document.createElement("span");e.className="empty";e.textContent=empty;return el.append(e);}
 for(const x of items.slice(0,12)){el.append(chip("",label(x),false,()=>{go(x.unit,x.page,x.ans??state.ans);autoBig();}));
  if(removable){const r=chip("x","×",false,()=>{store.marks=store.marks.filter(m=>m!==x);persist();render();},"しおりを削除");el.append(r);}}
}
async function renderLib(){
 const keys=(await dbKeys()).filter(k=>/^rems-[A-T]-\d+-\d+-(answers|questions)$/.test(k));cachedKeys=new Set(keys);
 $("lib-n").textContent=keys.length?"（"+keys.length+"件）":"";
 const el=$("lib");el.replaceChildren();
 if(!keys.length){const e=document.createElement("span");e.className="empty";e.textContent="まだありません（開いた教材は自動で保存されます）";el.append(e);}
 for(const k of keys.sort()){const[,u,ls,le,kind]=k.split("-");const sg=segs(u).find(x=>x.ls==ls&&x.le==le);if(!sg)continue;
  el.append(chip("",u+" L"+pad(ls)+"–"+pad(le)+(kind==="answers"?" 解答":""),false,()=>{go(u,sg.start,kind==="answers");autoBig();}));
  el.append(chip("x","×",false,async()=>{if(!confirm("この教材を端末から削除しますか？"))return;await dbDel(k);docs.get(k)?.destroy();docs.delete(k);await renderLib();render();},"端末から削除"));}
 /* レッスン一覧の「保存済」表示を更新 */
 const u=state.unit;[...$("segs").children].forEach((b,i)=>{const x=segs(u)[i];const has=cachedKeys.has(docKey(u,x,state.ans));const d=b.querySelector(".dot");if(has&&!d)b.insertAdjacentHTML("afterbegin",'<span class="dot">● 保存済</span>');if(!has&&d)d.remove();});
}
function go(unit,page,ans=state.ans){
 if(!validUnit(unit))return;
 state={unit,page:clampPage(unit,page),ans:!!ans};
 store.last={...state};store.byUnit[unit]=state.page;
 const s=segOf(unit,state.page);
 store.recent=[{unit,page:state.page,ans:state.ans},...store.recent.filter(x=>!(x.unit===unit&&segOf(x.unit,x.page)===s))].slice(0,8);
 persist();
 history.replaceState(null,"","#"+unit+"/"+state.page+"/"+(state.ans?1:0));
 render();
}

/* ===== 操作 ===== */
$("worker-test").onclick=async()=>{
 const b=$("worker-test");b.textContent="テスト中…";
 const s=segOf(state.unit,state.page);
 try{const r=await fetch(store.worker+"?url="+encodeURIComponent(pdfUrl(state.unit,s,state.ans)),{method:"HEAD"});if(!r.ok)throw Error("HTTP "+r.status);workerError="";b.textContent="✓ OK";show();}
 catch(e){workerError=String(e.message||e);b.textContent="接続テスト";}
 renderWorker();
};
$("prev").onclick=()=>go(state.unit,state.page-1);
$("next").onclick=()=>go(state.unit,state.page+1);
$("page").addEventListener("change",()=>go(state.unit,$("page").value));
$("page").addEventListener("keydown",e=>{if(e.key==="Enter")$("page").blur();});
$("q").onclick=()=>go(state.unit,state.page,false);
$("a").onclick=()=>go(state.unit,state.page,true);
$("star").onclick=()=>{const{unit,page}=state;const i=store.marks.findIndex(m=>m.unit===unit&&m.page===page);if(i>=0)store.marks.splice(i,1);else store.marks.unshift({unit,page});store.marks=store.marks.slice(0,40);persist();render();};
$("reload").onclick=()=>{
 if(current.mode==="img"){$("pageimg").dataset.src="";relayDownAt=0;return show();}
 if(current.mode==="frame"&&useNative){useNative=false;$("frame").dataset.base="";return show();}
 if(current.mode==="frame"){gTries=0;relayDownAt=0;loadFrame($("frame").dataset.src);return show();}
 docs.get(current.key)?.destroy();docs.delete(current.key);show();
};
document.addEventListener("keydown",e=>{if(e.target.closest("input")||e.altKey||e.metaKey||e.ctrlKey)return;if(e.key==="ArrowRight")$("next").click();if(e.key==="ArrowLeft")$("prev").click();});
/* スワイプでページ送り */
let sx=0,sy=0,st=0;
$("view").addEventListener("touchstart",e=>{if(e.touches.length!==1)return sx=NaN;sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();},{passive:true});
$("view").addEventListener("touchend",e=>{const t=e.changedTouches[0];let dx=t.clientX-sx,dy=t.clientY-sy;if(full&&fullRot)[dx,dy]=[dy,-dx];if(!(Math.abs(dx)>60&&Math.abs(dy)<50&&Date.now()-st<600))return;if(window.visualViewport&&visualViewport.scale>1.05)return;(dx<0?$("next"):$("prev")).click();},{passive:true});
let rz=0;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(current.mode==="pdf"||current.mode==="img")show();},200);});
const FS_PAGE=()=>"p."+state.page+" · PDF "+(state.page-segOf(state.unit,state.page).start+1)+"/"+(segOf(state.unit,state.page).end-segOf(state.unit,state.page).start+1);
/* ===== 大きく表示：画面いっぱい。横長ページは縦持ちなら90度回して表示 ===== */
let full=false,fullRot=false;
function screenWH(){const v=window.visualViewport;return{w:Math.round(v?v.width:innerWidth),h:Math.round(v?v.height:innerHeight)};}
function layoutFull(pw,ph){
 const{w,h}=screenWH(),v=$("view");
 /* 横長ページ×縦持ち → 90度回転。縦長ページ×横持ち → 横幅いっぱい＋縦スクロール */
 fullRot=pw>ph*1.05&&h>w*1.05&&Math.min(h/pw,w/ph)>Math.min(w/pw,h/ph)*1.1;
 const scroll=!fullRot&&ph>pw*1.05&&w>h*1.05;v.classList.toggle("scrolly",scroll);
 Object.assign(v.style,fullRot?{width:h+"px",height:w+"px",left:w+"px",top:"0px",transformOrigin:"0 0",transform:"rotate(90deg)"}:{width:w+"px",height:h+"px",left:"0px",top:"0px",transform:""});
 return fullRot?{W:h,H:w}:scroll?{W:w,H:Infinity}:{W:w,H:h};
}
function fitScale(pw,ph){if(!full)return Math.max(260,$("view").clientWidth-16)/pw;const b=layoutFull(pw,ph);return Math.min(b.W/pw,b.H/ph);}
function sizeImg(){const im=$("pageimg");if(!full||!im.naturalWidth){im.style.width=im.style.height="";return;}const s=fitScale(im.naturalWidth,im.naturalHeight);im.style.width=Math.floor(im.naturalWidth*s)+"px";im.style.height=Math.floor(im.naturalHeight*s)+"px";}
function setFull(on){
 full=on;const v=$("view");v.classList.toggle("full",on);document.body.classList.toggle("noscroll",on);
 if(on)layoutFull(1,1.414);else{v.style.cssText="";v.classList.remove("scrolly");fullRot=false;$("pageimg").style.width=$("pageimg").style.height="";}
 fsSync();show();
}
function fsSync(){$("fs-pg").textContent=FS_PAGE();$("fs-prev").disabled=$("prev").disabled;$("fs-next").disabled=$("next").disabled;}
$("fs-open").onclick=()=>setFull(true);
$("fs-close").onclick=()=>setFull(false);
$("fs-prev").onclick=()=>{$("prev").click();fsSync();};
$("fs-next").onclick=()=>{$("next").click();fsSync();};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&full)setFull(false);});
/* 自動で大きく（教材を開いたら全画面・向き自動）。設定は両リーダー共通 */
const autoOn=()=>{try{return localStorage.getItem("reader-auto-full")!=="0";}catch(e){return true;}};
function autoBig(){if(autoOn()&&!full)setFull(true);}
function syncAuto(){$("fs-auto").textContent="自動で大きく: "+(autoOn()?"ON":"OFF");$("fs-auto").setAttribute("aria-pressed",String(autoOn()));}
$("fs-auto").onclick=()=>{try{localStorage.setItem("reader-auto-full",autoOn()?"0":"1");}catch(e){}syncAuto();};
syncAuto();
window.ReadAloud&&ReadAloud.init({
 getPage:()=>{const s=segOf(state.unit,state.page);return{key:state.unit+"/"+state.page+"/"+state.ans,doc:current.mode==="pdf"?docs.get(current.key):null,n:state.page-s.start+1,canvas:current.mode==="pdf"?$("canvas"):null,imageUrl:current.mode==="img"?$("pageimg").src:null};},
 next:()=>{if(state.page>=maxPage(state.unit))return false;$("next").click();return true;}
});
$("ra-open").onclick=()=>ReadAloud.toggle();$("fs-ra").onclick=()=>ReadAloud.toggle();

window.visualViewport?.addEventListener("resize",()=>{if(full){clearTimeout(rz);rz=setTimeout(()=>show(),150);}});
window.addEventListener("hashchange",()=>{const h=fromHash();if(h&&(h.unit!==state.unit||h.page!==state.page||h.ans!==state.ans))go(h.unit,h.page,h.ans);});

/* 保存：ファイルとしてダウンロード（取得できない場合は公式PDFを開いて手動保存） */
function saveFile(u8,name){const url=URL.createObjectURL(new Blob([u8],{type:"application/pdf"}));const a=document.createElement("a");a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
$("save").onclick=async()=>{
 const btn=$("save");if(btn.dataset.busy)return;btn.dataset.busy="1";
 const u=state.unit,s=segOf(u,state.page),key=docKey(u,s,state.ans),url=pdfUrl(u,s,state.ans),name=url.split("/").pop();
 try{
  let data=docs.get(key)?await docs.get(key).getData():null;
  if(!data){const b=await dbGet(key);if(b)data=new Uint8Array(b);}
  if(!data){btn.textContent="取得中…";data=await download(key,url,(g,t)=>{btn.textContent="取得中 "+(t?Math.round(g/t*100)+"%":(g/1048576).toFixed(1)+"MB");});}
  saveFile(data,name);btn.textContent="✓ 保存しました";
  if(current.key===key&&current.mode!=="pdf")show();
 }catch(e){
  btn.textContent="↓ PDFを保存";
  if(confirm("自動で取得できませんでした。\n公式PDFを開くので、共有ボタン→「ファイルに保存」で保存してください。\n保存後「端末のPDFを読込」で選ぶと、この画面で読めます。"+(relayLog.length?"\n\n("+relayLog.join(" / ")+")":"")))window.open(url,"_blank","noopener");
 }finally{delete btn.dataset.busy;setTimeout(()=>{if(!btn.dataset.busy)btn.textContent="↓ PDFを保存";},2500);}
};
/* 端末のPDFを読み込み → この教材として保存 */
$("file").addEventListener("change",async e=>{
 const f=e.target.files?.[0];e.target.value="";if(!f)return;
 const u=state.unit,s=segOf(u,state.page),key=docKey(u,s,state.ans),expect=pdfUrl(u,s,state.ans).split("/").pop().replace(".pdf","").toLowerCase();
 if(!f.name.toLowerCase().includes(expect)&&!confirm("ファイル名が "+expect+".pdf と異なります。\nこの教材（Unit "+u+" "+lessonName(s)+(state.ans?" 解答付き":"")+"）として登録しますか？"))return;
 message("読み込み中…",f.name);
 try{const buf=await f.arrayBuffer();await dbPut(key,buf.slice(0)).catch(()=>{});docs.get(key)?.destroy();docs.delete(key);await docFromData(key,buf);await renderLib();show();}
 catch(err){message("読み込めませんでした",String(err.message||err),false);}
});

renderWorker();
go(state.unit,state.page,state.ans);
autoBig();
renderLib();
